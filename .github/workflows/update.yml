name: daily-update

on:
  # 每天 UTC 00:30 = 北京时间 08:30 自动抓取
  schedule:
    - cron: "30 0 * * *"
  # 手动触发入口（Action 页面右上角 Run workflow）
  workflow_dispatch: {}
  # 任意 push 触发（便于首次验证 workflow 是否被注册）
  push:
    branches: [master]
    paths:
      - '.github/workflows/update.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data
        run: python main.py

      - name: Build page
        run: python preview.py

      - name: Commit and push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items.json index.html
          git diff --cached --quiet || git commit -m "auto: update data $(date -u +%F)"
          git push
