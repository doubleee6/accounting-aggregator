<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会计信息聚合工作台</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1a1d21; --muted: #8a919f;
    --primary: #0f766e; --primary-soft: #e6f4f1; --border: #e7e9ee;
    --tax: #b45309; --tax-bg: #fef3c7;
    --cicpa: #0f766e; --cicpa-bg: #ccfbf1;
    --esnai: #1d4ed8; --esnai-bg: #dbeafe;
    --cpa: #7c3aed; --cpa-bg: #ede9fe;
    --audit: #be185d; --audit-bg: #fce7f3;
    --mof: #1e40af; --mof-bg: #e0e7ff;
    --shadow-sm: 0 1px 2px rgba(16,24,40,.05);
    --shadow-md: 0 4px 14px rgba(16,24,40,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); line-height: 1.6;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px 20px 48px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }

  /* 顶栏 */
  .topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .logo {
    width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
    background: var(--primary); display: flex; align-items: center; justify-content: center;
  }
  .topbar h1 { font-size: 21px; font-weight: 600; letter-spacing: -.01em; }
  .topbar p { color: var(--muted); font-size: 13px; margin-top: 2px; }

  /* 顶部官网直达 */
  .quick-links { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .ql {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px;
    border-radius: 999px; font-size: 13px; background: var(--card);
    border: 1px solid var(--border); color: #4b5563; text-decoration: none;
    box-shadow: var(--shadow-sm); transition: all .15s;
  }
  .ql:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
  .ql svg { color: var(--muted); flex-shrink: 0; }
  .ql:hover svg { color: var(--primary); }

  /* 搜索栏 */
  .searchbar {
    display: flex; align-items: center; gap: 10px; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px;
    box-shadow: var(--shadow-sm); margin-bottom: 18px;
    transition: border-color .15s, box-shadow .15s;
  }
  .searchbar:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .searchbar svg { color: var(--muted); flex-shrink: 0; }
  .searchbar input { flex: 1; border: none; outline: none; font-size: 15px; background: transparent; color: var(--text); }
  .searchbar input::placeholder { color: #b0b6c0; }

  /* 主体布局 */
  .main { display: flex; gap: 18px; align-items: flex-start; }

  /* 左侧栏 */
  .sidebar { width: 210px; flex-shrink: 0; position: sticky; top: 20px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px; box-shadow: var(--shadow-sm); }
  .group-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 8px 10px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px;
    cursor: pointer; font-size: 14px; color: #4b5563; transition: background .12s;
  }
  .nav-item:hover { background: #f2f4f7; }
  .nav-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 500; }
  .nav-item .badge { margin-left: auto; background: #eceef1; color: #6b7280; border-radius: 10px; padding: 1px 8px; font-size: 12px; }
  .nav-item.active .badge { background: #cfe8e2; color: var(--primary); }
  .nav-item .soon { font-size: 11px; color: var(--tax); background: var(--tax-bg); border-radius: 6px; padding: 1px 6px; font-weight: 500; }
  .nav-parent .arrow { font-size: 11px; color: var(--muted); margin-left: 4px; transition: transform .15s; }
  .nav-parent.open .arrow { transform: rotate(180deg); }
  .nav-children { display: none; padding-left: 6px; margin-top: 2px; }
  .nav-children.open { display: block; }
  .nav-child { padding-left: 20px; font-size: 13px; }

  /* 右侧内容 */
  .content { flex: 1; min-width: 0; }
  .count { color: var(--muted); font-size: 13px; margin: 2px 2px 12px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--shadow-sm);
    transition: box-shadow .15s, transform .15s;
  }
  .card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .card .meta { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .tag { padding: 2px 9px; border-radius: 6px; font-size: 12px; font-weight: 500; }
  .tag.cicpa { background: var(--cicpa-bg); color: var(--cicpa); }
  .tag.esnai { background: var(--esnai-bg); color: var(--esnai); }
  .tag.cpa { background: var(--cpa-bg); color: var(--cpa); }
  .tag.audit { background: var(--audit-bg); color: var(--audit); }
  .tag.mof { background: var(--mof-bg); color: var(--mof); }
  .tag.tax { background: var(--tax-bg); color: var(--tax); }
  .card h2 { font-size: 16px; font-weight: 600; margin: 8px 0 6px; line-height: 1.45; }
  .card h2 a { color: var(--text); text-decoration: none; }
  .card h2 a:hover { color: var(--primary); }
  .card .sum { font-size: 13.5px; color: #5a6472; }
  .empty { text-align: center; color: var(--muted); padding: 56px 0; font-size: 14px; }
  .card.new { border-left: 3px solid #e11d48; background: linear-gradient(90deg, #fff5f6 0%, #ffffff 40%); }
  .badge-new {
    display: inline-flex; align-items: center; background: #ffe4e6; color: #e11d48;
    padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; line-height: 1.5;
  }

  /* Tab 切换 */
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    padding: 9px 20px; border-radius: 10px; font-size: 14px; cursor: pointer;
    color: #4b5563; background: var(--card); border: 1px solid var(--border);
    transition: all .15s; font-weight: 500;
  }
  .tab:hover { border-color: var(--primary); color: var(--primary); }
  .tab.active { background: var(--primary); color: #ffffff; border-color: var(--primary); }

  /* 每日更新看板 */
  .daily-board { max-width: 760px; }
  .day-group {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    margin-bottom: 12px; box-shadow: var(--shadow-sm); overflow: hidden;
  }
  .day-head {
    display: flex; align-items: center; gap: 12px; padding: 14px 18px;
    cursor: pointer; user-select: none;
  }
  .day-head:hover { background: #f8fafb; }
  .day-title { font-size: 15px; font-weight: 600; white-space: nowrap; }
  .day-title .today-flag { color: #e11d48; font-weight: 700; }
  .day-summary { flex: 1; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .day-arrow { color: var(--muted); transition: transform .15s; font-size: 12px; flex-shrink: 0; }
  .day-group.open .day-arrow { transform: rotate(180deg); }
  .day-body { display: none; padding: 0 18px 16px; }
  .day-group.open .day-body { display: block; }
  .d-src { margin-top: 12px; }
  .d-src-name { font-size: 12.5px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
  .d-card {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    border-radius: 8px; font-size: 14px; transition: background .12s;
  }
  .d-card:hover { background: #f2f4f7; }
  .d-card .tag { flex-shrink: 0; }
  .d-card a { color: var(--text); text-decoration: none; flex: 1; min-width: 0; }
  .d-card a:hover { color: var(--primary); }

  @media (max-width: 720px) {
    .main { flex-direction: column; }
    .sidebar { width: 100%; position: static; }
    .nav-items-row { display: flex; gap: 6px; overflow-x: auto; }
    .nav-item { flex-shrink: 0; }
  }
</style>
</head>

 "f39bd475d9ec663c6b4206c2e37c1b00"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "项目终止后已完成部分的处理", "url": "https://bbs.esnai.cn/thread-5498332-1-1.html", "date": "2026-09-01", "content": "背景：制造企业建设生产线，在平整土地等基础已完工、并就主要设备签订设备采购合同（定制设备），后因政府批复等原因，该项目被终止。 问题：项目终止后已经完成的平等土地等（在自有土地上实施）是转为无形资产——土地使用权？金额巨大的终止设备采购合同的赔偿金在 ...", "id": "1b7b180a28d3763d5c9a2c85f374b3d1"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "请教陈版主，股份支付相关问题", "url": "https://bbs.esnai.cn/thread-5498331-1-1.html", "date": "2026-09-01", "content": "版主好： 公司授予股权激励背景如下：公司2024年10月设立了持股平台a，彼时持股平台a还没有并入拟上市主体X的股权架构中，且出资额由员工自行认购，按1元/股认购，员工认购后实缴出资到位，出资额合计500万。a合伙协议约定要求“自取得合伙企业份额之日起在X服务满5年 ...", "id": "c9597080700b72bbfcbbf99aad232367"}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第二十五号）", "url": "https://www.cicpa.org.cn/xxfb/news/202608/t20260831_66069.html", "date": "2026-08-31", "id": "be40a7e92dd5470ab0bca6102a473d49", "content": "为贯彻落实《中共中央办公厅\n国务院办公厅印发\n<关于进一步加强财会监督工作的意见>的通知》等文件精神，根据财政部《关于进一步加强注册会计师协会自律监督工作的意见》（财会〔2024〕27号）以及《会计师事务所执业质量检查制度》（会协〔2011〕39号）要求，2025年，按照财会监督专项行动和注册会计师行业“财会监督深化年”主题活动的部署安排，中国注册会计师协会（以下简称中注协）联合财政部监督评价局，组织相关人员与财政部监管局组建检查组，对备案从事证券服务业务的会计师事务所进行执业质量检查；组织各省、自治区、直辖市及深圳市注册会计师协会（以下简称地方注协），联合地方财政部门，对本区域内的会计师事务所开展执业质量检查。现将有关情况公告如下。\n一、总体情况\n截至\n2024年底，全国共有会计师事务所10993家（总所9522家，分所1471家）。2025年，中注协与地方注协共对2053家会计师事务所开展执业质量检查。截至目前，中注协及地方注协共对存在违规问题的377家会计师事务所和711名注册会计师实施了行业惩戒及自律监管措施。其中，对91家会计师事务所和270名注册会计师予以公开谴责；对67家会计师事务所和211名注册会计师予以通报批评；对52家会计师事务所和194名注册会计师予以训诫，对167家会计师事务所和36名注册会计师采取约谈、责令整改等自律监管措施。\n二、典型案例\n（一）永拓会计师事务所（特殊普通合伙）存在对被审计单位同一财务报表同时出具不同结论的审计报告的行为。该所为某公司\n2012年度和2013年度合并财务报表分别出具了审计报告，审计意见均为保留意见。在出具上述报告的同一天，该所还分别为该公司出具了无保留意见的审计报告，其后附的财务报表与发表保留意见的审计报告后附的财务报表列报金额一致。中注协对该所给予公开谴责的行业惩戒。\n（二）吉林市鼎信会计师事务所有限公司在某公司\n2021-2023年研究开发费用专项审计中，从企业获取的资料存在重大不一致，在明知研发费用辅助账无支持资料的情况下，认可公司仅以计提基数和提取比例测算得出研发费用。该所未恰当评估研发费用计算的合理性，未获取充分、适当的审计证据。中注协对该所及注册会计师王林琳、刘艳玲给予公开谴责的行业惩戒。\n（三）中审华会计师事务所（特殊普通合伙）在某公司\n2024年财务报表审计中，未保持应有的职业怀疑，在建工程审计程序执行不到位，未能识别出企业在建工程存在虚增的问题，发表不恰当的审计意见。中注协对该所注册会计师韩正萍、莫秀金给予公开谴责的行业惩戒。\n（四）云南立审会计师事务所（普通合伙）存在允许其他单位或者个人以本所名义承办业务的情形；在审计项目中，存在用伪造的被审计单位及对方单位公章编制虚假询证函，用伪造的被审计单位公章编制虚假固定资产盘点检查表及管理层声明等情况。云南省注册会计师协会对该所及注册会计师吉庆伟、王桂英给予公开谴责的行业惩戒。\n（五）绍兴天清会计师事务所（普通合伙）在审计工作中，明知被审计单位因招投标需要，要做大资产、收入等财务指标，在收到企业人为修改后的财务报表和账套后，未对主营业务收入、银行存款、固定资产等科目明细账中的异常数据给予必要的关注，未获取充分、适当的审计证据，出具了\n4份无保留意见的审计报告。该所还存在未与被审计单位签订业务约定书，从其他会计师事务所转接审计项目并出具审计报告；审计工作底稿由其他会计师事务所员工编制，未获取相关支持性证据并复核数据等情况。浙江省注册会计师协会对该所及注册会计师陈杨、罗先明、刘映元、张小军给予公开谴责的行业惩戒。\n（六）宁波嘉德会计师事务所（普通合伙）允许其他会计师事务所以本所名义承办审计业务，某审计项目的审计工作底稿编制人和复核人均为其他会计师事务所从业人员。存在审计项目未编制审计工作底稿，利用其他会计师事务所审计调整数据出具审计报告的情况。部分审计项目的重要报表科目仅编制审定表、明细表、凭证测试表，未执行实质性的审计程序，未取得审计证据，无审计说明和审计结论。浙江省注册会计师协会对该所及注册会计师支立宇、吴秀梅、王志君给予公开谴责的行业惩戒。\n（七）上海普道兢实会计师事务所（普通合伙）向协会提供的纳税申报表存在修图痕迹，填表日期与税款所属期间明显不匹配，纳税申报表、财务报表收入数据与税务系统导出的对应期间纳税申报表列示的金额不一致，且未提供差异明细。该所未按照质量管理准则及职业道德守则要求修订相关制度；部分审计项目应收账款未实施函证程序且未说明不实施函证的理由，货币资金、预付账款、长期股权投资、固定资产、预收账款、营业收入、营业成本等重要科目审计程序执行不到位。上海市注册会计师协会对该所及注册会计师马勇、陈高潮、曹孟南、袁爱红给予公开谴责的行业惩戒。\n（八）上海中豪会计师事务所（普通合伙）未按照质量管理准则及职业道德守则要求修订相关制度；存在项目组同时为客户提供审计服务和代理记账服务的情况，违反相关独立性要求。在审计项目中，被审计单位提供给事务所的情况说明中提及不能提供会计报表有关会计科目的明细清单，在无法对应收账款、预收账款、其他应收款、其他应付款等重要科目实施有效的审计程序，无法获得充分、适当的审计证据的情况下，仍出具了无保留意见的审计报告。此外，部分鉴证项目在未履行必要的审计程序，未获取充分适当的证据的情况下出具报告。上海市注册会计师协会对该所及注册会计师来永斌、吴均圣给予公开谴责的行业惩戒。\n（九）河南中蓝会计师事务所（普通合伙）部分审计项目业务约定书要素不齐全，未编制总体审计策略；重要科目实质性审计程序缺失，银行存款及应收账款未执行函证程序且未说明理由，未执行替代测试；存货监盘流于形式，且未实施存货计价测试；在建工程、固定资产、无形资产、营业收入、营业成本等重要科目审计程序执行不到位。河南省注册会计师协会对该所及执行合伙人苗晓春，注册会计师吴君丽、肖莹莹、孙孝民给予公开谴责的行业惩戒。\n各会计师事务所和注册会计师应当遵守法律法规，遵循执业准则，恪守职业道德，坚持诚信、客观、独立、公正，切实发挥执业监督作用，维护市场经济秩序和社会公共利益，更好服务经济社会高质量发展。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我们公司仓库存储条件良好、管理有序，但前阵子下大暴雨，导致仓库进水把存货都泡坏了，想问一下，这种被水淹的货物，进项税额还能不能抵扣啊？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5252053/content.html", "date": "2026-08-31", "id": "eaa1f760c52ff35fb87cb29122cd21e0", "content": "答：\n这种情况能继续抵扣。\n您公司仓库存储条件良好、管理有序，因暴雨导致仓库进水、货物被淹损坏，属于自然灾害造成的损失，不属于非正常损失，因此，对应货物的进项税额无需做转出处理，可以继续抵扣。\n根据《中华人民共和国增值税法》第二十二条第三项规定，非正常损失项目对应的进项税额不得从销项税额中抵扣。《中华人民共和国增值税法实施条例》第十九条明确，增值税法所称非正常损失，是指因管理不善造成货物被盗、丢失、霉烂变质，以及因违反法律法规造成货物或者不动产被依法没收、销毁、拆除等情形。\n需要注意的是，企业应当留存好相关证明材料，如仓库检查记录、设备配备情况、气象部门发布的暴雨预警或天气证明、仓库进水的现场照片或视频、存货损失清单、内部报损审批记录等，确保能够充分证明自己已履行了合理的、必要的管理义务，该损失确由自然灾害等不可抗力因素造成，从而合规享受进项税额抵扣政策。"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "违约金现金流选择", "url": "https://bbs.esnai.cn/thread-5498322-1-1.html", "date": "2026-08-31", "content": "求助版主，公司采购一项服务，由于延迟服务，需支付供应商违约金，此项合同已履约，根据准则核算时冲减采购成本，但支付的违约金应该计入购买商品相关的现金流还是支付其他经营活动有关呢？", "id": "99e11c11937f8de245b4156e09e6fa51"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "有点看不懂这公司中报的收入和归母净利润，结合审计考试", "url": "https://bbs.esnai.cn/thread-5498321-1-1.html", "date": "2026-08-31", "content": "代码002611 突然想起审计不是每年综合都要考个认定风险的题吗？大家帮忙分析下", "id": "84b4ececd9df1ed0a87a41bf52e8f719"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "子公司向母公司无偿划拨土地使用权问题", "url": "https://bbs.esnai.cn/thread-5498318-1-1.html", "date": "2026-08-31", "content": "全资子公司向母公司无偿划拨一宗土地的部分使用权，新购土地原值为5千万，其中20%划给母公司。子公司账面实收资本和未分配利润均小于1千万。母公司长投也小于1千万。 单体报表，个人觉得子公司应该先冲资本公积，然后冲留存收益（盈余公积和未分配利润）。母公司应该做 ...", "id": "accf61c4997c5e1cfa0dad2eb51d94c5"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "同控与非同控", "url": "https://bbs.esnai.cn/thread-5498299-1-1.html", "date": "2026-08-28", "content": "请教一个问题： 甲乙同受 A 控制；2025年甲收购丙，形成非同合并，购买日为 2025 年5月1日；2026 年丙 100% 股权无偿划转给乙，乙控制丙的日期为2026年2月；两个时点（甲合并丙、乙控制丙）之间不足12个月，乙合并丙属于非同控？是否满12月是判断同控/非同控的唯一依据 ...", "id": "2e654db214e018768be688d33f05d64d"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "求助陈版9810跨境电商出口增值税收入申报问题", "url": "https://bbs.esnai.cn/thread-5498298-1-1.html", "date": "2026-08-28", "content": "9810跨境电商出口增值税收入申报是按报关单出口当月开具的销项发票进行申报，还是按会计处理（根据电商平台的销售收入金额）进行申报？ 如果按照开具的销项发票申报销售收入，销项发票在会计上不代表确认主营业务收入，只是退税申报凭证，与财务报表的收入金额不相符。 ...", "id": "29326cee0f93e9ab2648cdfaea07ea3d"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "收到某社区居委会通过街道办事处划来财政援助资金，是否为按财政补助会计准则处理？", "url": "https://bbs.esnai.cn/thread-5498296-1-1.html", "date": "2026-08-28", "content": "某社区居民委员会联合A公司，向某区申报巩固脱贫攻坚成果项目——2024年中药材加工生产线建设项目【实施单位：A公司；监管单位：A公司所属街道办事处；实施内容：购买相关设备3台套及运用新技术对某生产进行智能改造等；项目预期收益：稳定一定数量脱贫人员就业，达到一 ...", "id": "4c44e9b6243bf677ca7bddde5e8eb015"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "求助陈版主 急急急", "url": "https://bbs.esnai.cn/thread-5498286-1-1.html", "date": "2026-08-27", "content": "太感谢陈版主的很多指导了，感恩，有很多问题想继续请教一下： 一、像针对一些主要客户的核查，如何判定其交易额与其经营规模、注册资本是否匹配呢？有何具体判定的标准呢？同时如果不匹配会存在哪些需要特别关注的风险呢？像IPO针对客户的回款方式比例的核实，主要目 ...", "id": "f90d99bcc76148748ddae0b02e90d2a6"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "折价退货的处理", "url": "https://bbs.esnai.cn/thread-5498284-1-1.html", "date": "2026-08-27", "content": "A公司采购了一批材料，采购价100万（假设不考虑税费），过了半年后公司发现此批材料存在质量问题，与供应商协商退货，但因这半年期间，该材料的市场价格下降到了90万元，供应商同意按90万退货不接受原价退货。 求助陈版主： （1）这类业务场景是按退货处理还是按向供 ...", "id": "98ad6ae9c223352ad70f16fd3a078035"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "陈版主，定制化软件开发，质保服务和质保金", "url": "https://bbs.esnai.cn/thread-5498277-1-1.html", "date": "2026-08-26", "content": "陈版主，您好 甲公司向乙公司购买产品（定制化开发软件）及验收之后的免费服务维护期为12个月，乙公司承诺在免费服务维护期内对软件提供及时的免费升级服务及扩容服务。升级程序应满足安全要求并能经过测试验证。乙公司有义务确保甲公司软件升级成功，不影响依赖于本 ...", "id": "89b28acbc65670aeba80a6143b1f6ce1"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "求教陈版主，关于票据贴现现金流量问题", "url": "https://bbs.esnai.cn/thread-5498276-1-1.html", "date": "2026-08-26", "content": "陈老师您好，A集团母公司从全资子公司采购产品以后，母公司开立票据支付给子公司，子公司收到票据后进行贴现，子公司收到的贴现款，单体现金流量列示为经营活动-销售商品、提供劳务收到的现金，其中母公司开立票据时有支付承兑保证金也有以大额存单进行质押开立票据的， ...", "id": "4850c42d2232a148707ed84f835c1460"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "同控增资收购", "url": "https://bbs.esnai.cn/thread-5498275-1-1.html", "date": "2026-08-26", "content": "求助陈版主和各位前辈， 案例背景：A和B是同控下的两个兄弟公司，之前没有任何持股关系，今年A向B增资，取得B公司80%股权。假设B公司的净资产跟在最终控制方合并的净资产金额是一样的，A公司的长投应该怎么计算呢？是按照增前的净资产金额*持股比例还是按照增资后的 ...", "id": "37511f1064cdc4748efa886efde01c3b"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "期货公司（含风险管理子公司）新列报准则下利润表格式选择与保证金利息列报分析", "url": "https://bbs.esnai.cn/thread-5498274-1-1.html", "date": "2026-08-26", "content": "分析基于财政部《企业会计准则第30号——财务报表列报》（财会〔2026〕11号，2026年7月正式发布2027/2029/2030年分阶段生效）及《金融企业利润表的列报格式和列报方法（修订征求意见稿）》（财办会〔2025〕51号附件3）整理，供内部会计政策判断参考。配套报表格式尚未正 ...", "id": "6e47e370425485b3713769b7f377bdc8"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "复杂并购条款的分拆和界定", "url": "https://bbs.esnai.cn/thread-5498272-1-1.html", "date": "2026-08-26", "content": "背景： A公司拟收购B公司90%股权，B在现阶段是股份公司，B的部分现股东又是高管，所以B公司股份转让受公司法关于股份公司董监高每年25%股份转让上限的限制，对此，在完成90%全部收购前，B需要先从股份公司转成有限公司；此外，B的现股东中有一个持股10%的股东与B的现大 ...", "id": "bf64527e5ddecce87100034956b60101"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "求助陈老师，文旅行业预收的OTA线上平台款项，如何处理", "url": "https://bbs.esnai.cn/thread-5498269-1-1.html", "date": "2026-08-25", "content": "陈老师好， 有个业务需要咨询您一下 我们审计的客户为文旅行业主要经营海洋馆以及配套酒店业务，部分合同是与大型线上平台，例如美团、携程掐签订，合同约定：该线上平台（乙方）需要预付3000万元，客户实际到园区消费后，核销部分预付款，合同期限为1年，到期可 ...", "id": "82bd244aed4fe3e0ef7c2e6b6aafe887"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "请问下连续审计的情况下，需要对期初数做到什么程度？具体在哪里有规定呢？", "url": "https://bbs.esnai.cn/thread-5498263-1-1.html", "date": "2026-08-25", "content": "请问下连续审计的情况下，需要对期初数做到什么程度？具体在哪里有规定呢？ 查了下豆包，说连续审计的情况下，注册会计师通常只需关注上期期末余额是否已正确结转至本期，很少需要再实施其他专门的审计程序。。。但我找了半天也没找到原文。。。 请问大家知道哪里有规 ...", "id": "eeefbf466aeb5c539e531e4f1d4a5ff9"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "请教陈版：芯片合作研发 + 技术成果转让附带保底采购义务的会计处理", "url": "https://bbs.esnai.cn/thread-5498261-1-1.html", "date": "2026-08-25", "content": "## 一、项目背景及合同主要条款 ### 1、业务背景 2023 年 4 月，A 公司与 B 公司签署芯片研发合作协议。B 公司提出芯片功能需求，双方共同确定芯片规格指标并形成规格书附件；**A 公司主导全部研发工作**，负责芯片设计、晶圆投片、封装测试及后续量产供应保障；B ...", "id": "c5d4b9fa2de9c6c82f23381b432b8ce2"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "明股实债在合并层面转股权处理", "url": "https://bbs.esnai.cn/thread-5498257-1-1.html", "date": "2026-08-25", "content": "陈版主，您好！业务是这样，集团公司A和政府共同签订了一个协议注资给A控股的子公司B，政府分两次出资给子公司B，第一次作为股权，第二次出资作为债权（明股实债），现跟对方商量将第二部分债权转股权，请问需要视同初始投资即享有吗？少数股东损益是不是不能按当期利润 ...", "id": "6f60868d57e36535c33e1abace9f8470"}, {"source": "国家税务局", "category": "留言咨询", "title": "上个月有几笔业务没及时开票也没申报，现在补开发票，销售额是按开票时间，还是业务发生时间申报？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5251608/content.html", "date": "2026-08-04", "id": "4f82410647b805b974eafa692cc76dbd", "content": "答：\n销售额应计入业务实际发生时间的税款所属期。根据《国家税务总局关于增值税一般纳税人登记管理有关事项的公告》规定，纳税人因自行补充或更正、风控核查、稽查查补等调整的销售额，应按纳税义务发生时间计入对应税款所属期销售额。\n因此，补开的发票销售额应该按业务发生的所属期申报。"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕219号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202608/t20260814_3995493.htm", "date": "2026-07-31", "id": "1d0c36e9f051d2a3aa9e17671018e7af", "content": "财政部行政处罚决定书（财监法〔2026〕219号）\n财监法〔\n2026\n〕\n219\n号\n财政部行政处罚决定书\n当\n事\n人：张亚飞\n地      址：\n浙江省杭州市萧山区钱江世纪城润奥商务中心\nT2写字楼\n依照《中华人民共和国注册会计师法》等规定，财政部组织检查组于2025年对天健会计师事务所（特殊普通合伙）（以下称天健所）执业质量等情况开展了检查。\n检查发现的主要问题和行政处罚决定如下\n：\n天健所\n在\n济南西城投资开发集团有限公司\n2024年度\n财务报表审计中，对\n省会文化艺术中心三馆二期\n项目实施监盘，\n并对利息资本化进行复核，未关注到该项目于2023年6月已达到预定可使用状态，\n未识别被审计单位\n2024年度少计财务费用\n、\n多计期初未分配利润\n等\n问题\n。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反\n了\n《中华人民共和国注册会计师法》第二十一条第一款，《会计师事务所执业许可和监督管理办法》第六十条第（一）项，不符合《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十八条、第二十九条\n,\n《中国注册会计师审计准则第1301号——审计证据》第九条等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款，《会计师事务所执业许可和监督管理办法》第七十条第一款的规定，\n财政部决定给予\n你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n7\n月\n31\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕218号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202608/t20260814_3995492.htm", "date": "2026-07-31", "id": "f620b873e5ab663363b96f795bd1b21e", "content": "财政部行政处罚决定书（财监法〔2026〕218号）\n财监法〔\n2026\n〕\n218\n号\n财政部行政处罚决定书\n当  事  人：杨红蕊\n地      址：\n浙江省杭州市萧山区钱江世纪城润奥商务中心\nT2写字楼\n依照《中华人民共和国注册会计师法》等规定，财政部组织检查组于2025年对天健会计师事务所（特殊普通合伙）（以下称天健所）执业质量等情况开展了检查。\n检查发现的主要问题和行政处罚决定如下\n：\n天健所\n在\n济南市政公用资产管理运营有限公司\n2024年\n度\n财务报表审计中，\n已抽查到\n相关\n事项涉及的凭证，\n但\n认可了\n该公司\n将收到的\n基础设施建设项目\n资金计入“资本公积”，\n未保持应有的职业怀疑，存在\n职业判断\n错误\n，未识别被审计单位\n2024年\n度\n多计资本公积等问题\n。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述事项 查组于\n20\n25\n年对\n天职国际会计师事务所（特殊普通合伙）（以下称天职国际所）执业\n质量\n等\n情况\n开展\n了检查。\n检查发现的主要问题和行政处罚决定如下\n：\n一、\n未保持应有的职业怀疑，\n未执行充分适当的审计程序，\n职业判断错误。\n天职国际所在北京佰能蓝天科技股份有限公司（以下称北京佰能）\n2023\n年度财务报表审计中，执行研发费用细节测试时，抽取了年末入账、金额超出重要性水平的材料支出样本，分别为\n342\n.\n60\n万元的催化剂设备、\n313\n.\n15\n万元的建安施工，但未识别出\n存在的异常。经查，上述支出均为工程项目相关成本。天职国际所未对上述样本列示内容保持应有的职业怀疑，未就上述支出是否为研发相关支出执行充分适当的审计程序，认可了北京佰能的会计处理，职业判断错误。\n二、审计程序存在重大缺陷。\n（一）天职国际所北京佰能\n2023\n年度财务报表审计项目中，在执行研发费用穿行测试时，未就研发费用中的材料费用、其他研发费用报销取得穿行测试样本。\n（二）天职国际所对北京佰能\n2023\n年度财务报表审计项目中，研发活动控制测试、细节测试未设计充分适当的实质性测试程序，对于审计程序的记录仅是简单勾画程序表格，未进一步获取充分适当的审计证据，未发现北京佰能将与研发活动无关的成本费用计入研发费用。\n（三）天职国际所北京佰能\n2023\n年度财务报表审计项目中，研发人工费用审计程序执行不到位。一是穿行测试环节，仅取得工资社保计算分摊汇总表，未对计入研发费用的非研发部门人员人工成本执行进一步的审计程序；二是实质性测试方面，\n2023\n年工资检查表测试程序中，未针对研发费用科目特性制定充分适当的审计程序，对于研发人员认定、人工成本分摊未制定并执行充分适当的审计程序。\n（四）天职国际所北京佰能\n2023\n年度财务报表审计项目中，收入审计程序存在重大缺陷。北京佰能采用投入法对环保工程类业务进行收入确认。审计工作底稿中列示了工程项目履约进度，但未获取充分适当的审计证据支持履约进度的确认。\n（五）天职国际所北京佰能\n2023\n年度财务报表审计项目中，审计工作底稿中未见营业成本料工费明细表，未见对人工成本及其他费用的审计程序，未获取充分适当的审计证据。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、《会计师事务所执业许可和监督管理办法》第六十条第（一）项的规定，不符合《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》第二十二条第一款，《中国注册会计师审计准则第\n1301\n号——审计证据》第十条，《中国注册会计师审计准则第\n1231\n号——针对评估的重大错报风险采取的应对措施》第二十七条第一款、第二款的规定。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款、《会计师事务所执业许可和监督管理办法》第七十条第一款的规定，\n财政部决定给予\n你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n7\n月\n31\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕215号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202608/t20260814_3995486.htm", "date": "2026-07-31", "id": "e636d0100a4082c2b892525fc869749c", "content": "财政部行政处罚决定书（财监法〔2026〕215号）\n财监法〔\n2026\n〕\n215\n号\n财政部行政处罚决定书\n当\n事\n人：\n李利亚\n地\n址：\n北京市海淀区车公庄西路\n19\n号外文文化创意园\n12\n号楼\n依照\n《中华人民共和国注册会计师法》等\n规定，财政部组织检查组于\n20\n25\n年对\n天职国际会计师事务所（特殊普通合伙）（以下称天职国际所）执业\n质量\n等\n情况\n开展\n了检查。\n检查发现的主要问题和行政处罚决定如下\n：\n一、\n未保持应有的职业怀疑，\n未执行充分适当的审计程序，\n职业判断错误。\n天职国际所\n在\n北京佰能蓝天科技股份有限公司（以下称北京佰能）\n2024\n年度财务报表审计项目\n中\n，执行研发费用细节测试\n时\n，抽到了一笔金额为\n219\n.\n03\n万元\n的研发材料领用凭证。经查，上述材料支出实际应为工程项目相关成本。\n天职国际所对该凭证中列\n示内容未保持应有的职业怀疑，未就\n该笔大额领料是否为研发相关支出执行充分适当的审计程序\n，认可了北京佰能的会计处理，\n职业判断错误\n。\n二、审计程序存在重大缺陷。\n（一）天职国际所北京佰能\n2024\n年度财务报表审计项目中，在执行研发费用穿行测试时，未就研发费用中的材料费用、其他研发费用报销取得穿行测试样本。\n（二）天职国际所对北京佰能\n2024\n年度财务报表审计项目中，研发活动控制测试、细节测试未设计充分适当的实质性测试程序，对于审计程序的记录仅是简单勾画程序表格，未进一步获取充分适当的审计证据，未发现北京佰能将与研发活动无关的成本费用计入研发费用。\n（三）天职国际所北京佰能\n2024\n年度财务报表审计项目中，研发人工费用审计程序执行不到位。一是穿行测试环节，仅取得工资社保计算分摊汇总表，未对计入研发费用的非研发部门人员人工成本执行进一步的审计程序；二是控制测试方面，\n2024\n年未对研发人工成本归集的控制点执行控制测试。\n（四）天职国际所北京佰能\n2024\n年度财务报表审计项目中，收入审计程序存在重大缺陷。北京佰能采用投入法对环保工程类业务进行收入确认。审计工作底稿中列示了工程项目履约进度，但未获取充分适当的审计证据支持履约进度的确认。同时，北京佰能\n2024\n年年末存货余额为\n479\n.\n03\n万元，未见对投入法下存货余额的审计程序及结论。\n（五）天职国际所北京佰能\n2024\n年度财务报表审计项目中，审计工作底稿中未见营业成本料工费明细表，未见对人工成本及其他费用的审计程序，未获取充分适当的审计证据。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、《会计师事务所执业许可和监督管理办法》第六十条第（一）项的规定，不符合《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》第二十二条第一款，《中国注册会计师审计准则第\n1301\n号——审计证据》第十条，《中国注册会计师审计准则第\n1231\n号——针对评估的重大错报风险采取的应对措施》第二十七条第一款、第二款的规定\n。\n上述事实，有检查报告、\n检查工作底稿、\n当事人签证和反馈意见等相关证据予以证实。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款、《会计师事务所执业许可和监督管理办法》第七十条第一款的规定，\n财政部决定给予\n你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n7\n月\n31\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕214号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202608/t20260814_3995485.htm", "date": "2026-07-31", "id": "4693e1694e98523587132f372082d064", "content": "财政部行政处罚决定书（财监法〔2026〕214号）\n财监法〔\n2026\n〕\n214\n号\n财政部行政处罚决定书\n当\n事\n人：汪吉军\n地\n址：\n北京市海淀区车公庄西路\n19\n号外文文化创意园\n12\n号楼\n依照《中华人民共和国注册会计师法》等规定，财政部组织检查组于2025年对天职国际会计师事务所（特殊普通合伙）（以下称天职国际所）执业质量等情况开展了检查。\n检查发现的主要问题和行政处罚决定如下\n：\n一、未保持应有的职业怀疑，未执行充分适当的审计程序，职业判断错误\n（一）天职国际所在北京佰能蓝天科技股份有限公司（以下称北京佰能）2023年度财务报表审计中，执行研发费用细节测试时，抽取了年末入账、金额超出重要性水平的材料支出样本，分别为342.60万元的催化剂设备、313.15万元的建安施工，但未识别出存在的异常。经查，上述支出均为工程项目相关成本。天职\n国际所未对上述样本列示内容保持应有的职业怀疑，未就上述支出是否为研发相关支出执行充分适当的审计程序，认可了北京佰能的会计处理，职业判断错误。\n（二）天职国际所在北京佰能2024年度财务报表审计项目中，执行研发费用细节测试时，抽到了一笔金额为219.03万元的研发材料领用凭证。经查，上述材料支出实际应为工程项目相关成本。天职国际所对该凭证中列示内容未保持应有的职业怀疑，未就该笔大额领料是否为研发相关支出执行充分适当的审计程序，认可了北京佰能的会计处理，职业判断错误。\n二、审计程序存在重大缺陷。\n（一）天职国际所北京佰能2023年度、2024年度财务报表审计项目中，在执行研发费用穿行测试时，未就研发费用中的材料费用、其他研发费用报销取得穿行测试样本。\n（二）天职国际所对北京佰能2023年度、2024年度财务报表审计项目中，研发活动控制测试、细节测试未设计充分适当的实质性测试程序，对于审计程序的记录仅是简单勾画程序表格，未进一步获取充分适当的审计证据，未发现北京佰能将与研发活动无关的成本费用计入研发费用。\n（三）天职国际所北京佰能2023年度、2024年度财务报表审计项目中，研发人工费用审计程序执行不到位。一是穿行测试环节，仅取得工资社保计算分摊汇总表，未对计入研发费用的非研发部门人员人工成本执行进一步的审计程序；二是控制测试方面，2024年未对研发人工成本归集的控制点执行控制测试；三是实质性测试方面，2023年工资检查表测试程序中，未针对研发费用科目特性制定充分适当的审计程序，对于研发人员认定、人工成本分摊未制定并执行充分适当的审计程序。\n（四）天职国际所北京佰能2023年度、2024年度财务报表审计项目中，收入审计程序存在重大缺陷。北京佰能采用投入法对环保工程类业务进行收入确认。审计工作底稿中列示了工程项目履约进度，但未获取充分适当的审计证据支持履约进度的确认。同时，北京佰能2024年年末存货余额为479.03万元，未见对投入法下存货余额的审计程序及结论。\n（五）天职国际所北京佰能2023年度、2024年度财务报表审计项目中，审计工作底稿中未见营业成本料工费明细表，未见对人工成本及其他费用的审计程序，未获取充分适当的审计证据。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、《会计师事务所执业许可和监督管理办法》第六十条第（一）项的规定，不符合《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十二条第一款，《中国注册会计师审计准则第1301号——审计证据》第十条，《中国注册会计师审计准则第1231号——针对评估的重大错报风险采取的应对措施》第二十七条第一款、第二款的规定。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款、《会计师事务所执业许可和监督管理办法》第七十条第一款的规定，\n财政部决定给予\n你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n7\n月\n31\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕213号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202608/t20260814_3995484.htm", "date": "2026-07-31", "id": "111f0cae356fa1017adbec2bb698c3bd", "content": "财政部行政处罚决定书（财监法〔2026〕213号）\n财监法〔\n2026\n〕\n213\n号\n财政部行政处罚决定书\n当  事  人：李阳林\n地      址：深圳市福田区福田街道福山社区滨河大道\n5020\n号\n同心大厦\n21\n层\n2101\n依照《中华人民共和国注册会计师法》等规定，财政部组织检查组于\n2025\n年对鹏盛会计师事务所（特殊普通合伙）（以下称鹏盛所）执业质量等情况开展了检查。\n检查发现的主要问题和行政处罚决定如下\n：\n深圳市赛格导航科技股份有限公司（以下称赛格导航）在\n2024\n年计提存货跌价准备时，未区分存货呆滞、不良情况，均以正常可使用、可销售良品的单位售价作为可变现净值计算基础；赛格导航及其子公司上海赛格车圣导航科技有限公司\n2024\n年末账龄\n3\n年以上发出商品未结合合同履行情况和发出商品实物状态合理计提存货跌价准备,导致\n2024\n年少计提存货跌价准备\n377\n.\n14\n万元。\n2024\n年，赛格导航在计提存货跌价准备确定存货可变现净值时，未合理匡算销售商品的相关税费，以\n3\n%作为销售税金及费用比例。根据\n2024\n年度财务报表计算，销售税金及费用比例合计\n11\n.\n64\n%，与前述\n3\n%差异\n8\n.\n64\n%,导致少计提存货跌价准备\n206\n.\n54\n万元。\n上述事项导致赛格导航\n2024\n年少计提存货跌价准备合计\n583.68\n万元。鹏盛所在赛格导航\n2024\n年度财务报表审计中，未审慎关注赛格导航期末存货状态，\n未有效执行重新测算程序\n，未发现财务报表重大错报。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、第二款第\n（一）\n项、第三款，不符合《中国注册会计师鉴证业务基本准则》第二十八条第\n一\n款，《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》第二十八条\n,\n《中国注册会计师审计准则第\n1311\n号——对存货、诉讼和索赔、分部信息等特定项目获取审计证据的具体考虑》第三条\n第一款、\n第二款第\n（一）\n项\n等规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，\n财政部决定给予\n你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n7\n月\n31\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕212号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202608/t20260814_3995483.htm", "date": "2026-07-31", "id": "4fac769d7c118bc80f2b2c6d71890249", "content": "财政部行政处罚决定书（财监法〔2026〕212号）\n财监法〔\n2026\n〕\n212\n号\n财政部行政处罚决定书\n当  事  人：凌永平\n地      址：深圳市福田区福田街道福山社区滨河大道\n5020\n号\n同心大厦\n21\n层\n2101\n依照《中华人民共和国注册会计师法》等规定，财政部组织检查组于\n2025\n年对鹏盛会计师事务所（特殊普通合伙）（以下称鹏盛所）执业质量等情况开展了检查。\n检查发现的主要问题和行政处罚决定如下\n：\n深圳市赛格导航科技股份有限公司（以下称赛格导航）在\n2024\n年计提存货跌价准备时，未区分存货呆滞、不良情况，均以正常可使用、可销售良品的单位售价作为可变现净值计算基础；赛格导航及其子公司上海赛格车圣导航科技有限公司\n2024\n年末账龄\n3\n年以上发出商品未结合合同履行情况和发出商品实物状态合理计提存货跌价准备,导致\n2024\n年少计提存货跌价准备\n377.14\n万元。\n2024\n年，赛格导航在计提存货跌价准备确定存货可变现净值时，未合理匡算销售商品的相关税费，以\n3\n%作为销售税金及费用比例。根据\n2024\n年度财务报表计算，销售税金及费用比例合计\n11.64\n%，与前述\n3\n%差异\n8.64\n%,导致少计提存货跌价准备\n206.54\n万元。\n上述事项导致赛格导航\n2024\n年少计提存货跌价准备合计\n583.68\n万元。鹏盛所在赛格导航\n2024\n年\n度财务报表审计中，未审慎关注赛格导航期末存货状态，\n未有效执行重新测算程序\n，未发现财务报表重大错报。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、第二款第\n（\n一\n）\n项、第三款，不符合《中国注册会计师鉴证业务基本准则》第二十八条第\n一\n款，《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》第二十八条\n，《中国注册会计师审计准则第\n1311\n号——对存货、诉讼和索赔、分部信息等特定项目获取审计证据的具体考虑》第三条\n第一款、\n第二款第\n（\n一\n）\n项\n等规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，\n财政部决定给予\n你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n7\n月\n31\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕211号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202608/t20260814_3995479.htm", "date": "2026-07-31", "id": "32269b5e594ea3399e8a5ac9b15f9290", "content": "财政部行政处罚决定书（财监法〔2026〕211号）\n财监法〔\n2026\n〕\n211\n号\n财政部行政处罚决定书\n当  事  人：周溢\n地      址：深圳市福田区福田街道福山社区滨河大道\n5020\n号\n同心大厦\n21\n层\n2101\n依照《中华人民共和国注册会计师法》等规定，财政部组织检查组于\n2025\n年对鹏盛会计师事务所（特殊普通合伙）（以下称鹏盛所）的执业质量等情况开展了检查。\n检查发现的主要问题和行政处罚决定如下\n：\n北京蓝色星际科技股份有限公司（以下称蓝色星际）向子公司北京蓝色星河软件技术发展有限公司（现更名为北京蓝色星河科技有限公司）、北京蓝色星云科技发展有限公司采购其开发的软件，并形成合并报表期末存货\n6305\n.\n52\n万元，在编制\n2024\n年度合并报表时，未将合并报表期末存货余额中所包含的未实现内部销售损益\n5371\n.\n07\n万元予以抵销\n，\n导致合并报表多计存货\n5371\n.\n07\n万元，少计成本\n5371\n.\n07\n万元，多计利润总额\n5371\n.\n07\n万元。\n鹏盛所在蓝色星际\n2024\n年报\n审计时未发现上述错报，认可了企业的会计处理，\n存在职业判断错误。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、第二款第\n（\n一\n）\n项、第三款，不符合《中国注册会计师鉴证业务基本准则》第二十八条第\n一\n款，《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》第二十八条等规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，\n财政部决定给予\n你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n7\n月\n31\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕210号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202608/t20260814_3995478.htm", "date": "2026-07-31", "id": "7d1525fa4fe8127209397efd4bebbf09", "content": "财政部行政处罚决定书（财监法〔2026〕210号）\n财监法〔\n2026\n〕\n210\n号\n财政部行政处罚决定书\n当  事  人：康梦佳\n地      址：深圳市福田区福田街道福山社区滨河大道\n5020\n号\n同心大厦\n21\n层\n2101\n依照《中华人民共和国注册会计师法》等规定，财政部组织检查组于\n2025\n年对鹏盛会计师事务所（特殊普通合伙）（以下称鹏盛所）的执业质量等情况开展了检查。\n检查发现的主要问题和行政处罚决定如下\n：\n北京蓝色星际科技股份有限公司（以下称蓝色星际）向子公司北京蓝色星河软件技术发展有限公司（现更名为北京蓝色星河科技有限公司）、北京蓝色星云科技发展有限公司采购 n）项，不符合《中国注册会计师鉴证业务基本准则》第二十八条第\n一\n款，《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》第二十八条、第三十条，《中国注册会计师审计准则第\n1501\n号——对财务报表形成审计意见和出具审计报告》第十四条第（\n二\n）项等规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，\n财政部决定给予\n你警告、暂停执行业务\n1\n个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n7\n月\n31\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕201号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202608/t20260814_3995466.htm", "date": "2026-07-31", "id": "dd00da23865e30a5f99b18dae01ff45a", "content": "财政部行政处罚决定书（财监法〔2026〕201号）\n财监法〔\n2026\n〕\n201\n号\n财政部行政处罚决定书\n当  事  人：\n王自勇\n地      址：天津市和平区解放北路\n188\n号信达广场\n52\n层\n依照《中华人民共和国注册会计师法》等规定，财政部组织检查组于\n2025\n年对中审华会计师事务所（特殊普通合伙）（以下称中审华所）执业质量等情况开展了检查。\n检查发现的主要问题和行政处罚决定如下\n：\n天津民祥生物医药股份有限公司（以下称民祥生物）的全资子公司天津民祥药业有限公司\n2021\n年通过与山东森俐德机械设备有限公司签订购买“不锈钢反应釜”等设备的虚假合同，虚增在建工程\n4487.61\n万元，并将进项税额\n583.39\n万元在增值税纳税申报中进行抵扣，导致民祥生物\n2024\n年度合并财务报表\n虚增在建工程\n4487\n.\n61\n万元\n。\n中审华所在\n民祥生物\n2024\n年度财务报表审计中，未保持应有的职业怀疑，在建工程监盘程序设计及执行存在重大缺陷，在建工程审计程序执行不到位，未识别民祥生物合并财务报表存在虚增在建工程的问题，发表不恰当的审计意见。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为\n违反了\n《中华人民共和国注册会计师法》第二十一条第一款，《会计师事务所执业许可和监督管理办法》第六十条第\n（一）\n项，不符合《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》第二十八条，《中国注册会计师审计准则第\n1501\n号——对财务报表形成审计意见和出具审计报告》第十二条第一款的有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款，《会计师事务所执业许可和监督管理办法》第七十条第一款的规定，\n财政部决定给予\n你警告、暂停执行业务\n3\n个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n7\n月\n31\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕200号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202608/t20260814_3995463.htm", "date": "2026-07-31", "id": "dca55b04f65dfd6b5f99b2d6c16a11ef", "content": "财政部行政处罚决定书（财监法〔2026〕200号）\n财监法〔\n2026\n〕\n200\n号\n财政部行政处罚决定书\n当  事  人：\n方健敏\n地      址：天津市和平区解放北路\n188\n号信达广场\n52\n层\n依照《中华人民共和国注册会计师法》等规定，财政部组织检查组于\n2025\n年对中审华会计师事务所（特殊普通合伙）（以下称中审华所）执业质量等情况开展了检查。\n检查发现的主要问题和行政处罚决定如下\n：\n天津民祥生物医药股份有限公司（以下称民祥生物）的全资子公司天津民祥药业有限公司\n2021\n年通过与山东森俐德机械设备有限公司签订购买“不锈钢反应釜”等设备的虚假合同，虚增在建工程\n4487.61\n万元，并将进项税额\n583.39\n万元在增值税纳税申报中进行抵扣，导致民祥生物\n2024\n年度合并财务报表\n虚增在建工程\n4487.61\n万元\n。\n中审华所在民祥生物\n2024\n年度财务报表审计中，未保持应有的职业怀疑，在建工程监盘程序设计及执行存在重大缺陷，在建工程审计程序执行不到位，未识别民祥生物合并财务报表存在虚增在建工程的问题，发表不恰当的审计意见。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为\n违反了\n《中华人民共和国注册会计师法》第二十一条第一款，《会计师事务所执业许可和监督管理办法》第六十条第\n（一）\n项，不符合《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》第二十八条，《中国注册会计师审计准则第\n1501\n号——对财务报表形成审计意见和出具审计报告》第十二条第一款的有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款，《会计师事务所执业许可和监督管理办法》第七十条第一款的规定，\n财政部决定给予\n你警告、暂停执行业务\n3\n个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n7\n月\n31\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕199号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202608/t20260814_3995462.htm", "date": "2026-07-31", "id": "bccaaa4f9066b737d1d030e6711e98ee", "content": "财政部行政处罚决定书（财监法〔2026〕199号）\n财监法〔\n2026\n〕\n199\n号\n财政部行政处罚决定书\n当  事  人：林润勰\n地      址：天津市南开区红旗路\n214\n/\n216\n号天津中环产业园有限\n公司A楼南门二层\n依照《中华人民共和国注册会计师法》等\n规定\n，\n财政部组织检查组于\n2025\n年\n对\n立信中联会计师事务所（特殊普通合伙）（以下称立信中联所）执业质量等情况开展了检查。\n检查发现的主要问题和行政处罚决定如下\n：\n立信中联所对\n福建莆田农村商业银行股份有限公司\n2024\n年财务报表审计时，仅对部分企业借款人的工商信息进行查询，\n审计程序执行不到位，\n未充分关注莆田农商银行贷款、贷记卡五级分类不准确的事项\n。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、第二款第（一）项、第三款，《会计师事务所执业许可和监督管理办法》第六十条第（一）项，不符合\n《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》第二十八条、第二十九条、第三十条，《中国注册会计师审计准则第\n1231\n号——针对评估的重大错报风险采取的应对措施》第二十六条第一款、\n第\n二款等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款，《会计师事务所执业许可和监督管理办法》第七十条第一款的规定，\n财政部决定给予\n你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n7\n月\n31\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚 要求》第二十八条、第二十九条、第三十条，《中国注册会计师审计准则第\n1231\n号——针对评估的重大错报风险采取的应对措施》第二十六条\n第一款、第二款\n等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款，《会计师事务所执业许可和监督管理办法》第七十条第一款的规定，\n财政部决定给予\n你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n7\n月\n31\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕196号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202608/t20260814_3995458.htm", "date": "2026-07-31", "id": "f7543d2ca96310272111e13e5c252b4c", "content": "财政部行政处罚决定书（财监法〔2026〕196号）\n财监法〔\n2026\n〕\n196\n号\n财政部行政处罚决定书\n当  事  人：俞德昌\n地      址：\n天津市南开区红旗路\n214\n/\n216\n号天津中环产业园有限\n公司A楼南门二层\n依照《中华人民共和国注册会计师法》等\n规定\n，\n财政部组织检查组于\n2025\n年\n对\n立信中联会计师事务所（特殊普通合伙\n）（\n以下称立信中联所）执业质量开展了检查。\n检查发现的主要问题和行政处罚决定如下\n：\n2024\n年，\n杭州康韵生物科技股份有限公司（以下称康韵生物公司）\n通过“在建工程”科目核算拱墅区矩阵国际中心\n7\n处房产装修支出\n415\n.\n23\n万元，同时通过“投资性房地产”科目核算上述房产增值\n429\n.\n98\n万元。上述事项导致\n康韵生物公司\n累计多计“在建工程”、少计“投资性房地产-在建”、多计“投资性房地产-公允\n价值变动”\n415\n.\n23\n万元，累计多计利润总额\n415\n.\n23\n万元。\n2024\n年多计利润总额\n41\n.\n41\n万元，多计净利润\n31\n.\n06\n万元。\n立信中联所对康韵生物公司\n2024\n年财务报表审计时，未保持应有的职业怀疑，未识别财务报表的重大错报。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、第二款第（一）项、第三款，《会计师事务所执业许可和监督管理办法》第六十条第（一）项，不符合\n《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》第二十八条、第二十九条、第三十条，《中国注册会计师审计准则第\n1231\n号——针对评估的重大错报风险采取的应对措施》\n第二十六条第一款、第二款\n等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款，《会计师事务所执业许可和监督管理办法》第七十条第一款的规定，\n财政部决定给予\n你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n7\n月\n31\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕195号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202608/t20260814_3995457.htm", "date": "2026-07-31", "id": "6d40929ca7f1c07d0656183807e751b5", "content": "财政部行政处罚决定书（财监法〔2026〕195号）\n财监法〔\n2026\n〕\n195\n号\n财政部行政处罚决定书\n当  事  人：刘欢\n地      址：天津市南开区红旗路\n214\n/\n216\n号天津中环产业园有限\n公司A楼南门二层\n依照《中华人民共和国注册会计师法》等\n规定\n，\n财政部组织检查组于\n2025\n年\n对\n立信中联会计师事务所（特殊普通合伙）（以下称立信中联所）执业质量等情况开展了检查。\n检查发现的主要问题和行政处罚决定如下\n：\n一、立信中联\n所对\n宁波工业投资集团有限公司\n（以下称\n宁波工投集团\n）202\n3\n年度\n会计报表重要事项存在不实内容的情况未予指明，为其出具编制基础一致但合并范围不一致的财务报表审计报告\n202\n3\n年\n，\n立信中联\n所对宁波工投集团年度财务报表进行审计，\n为其\n出具两份合并范围不一致、意见类型冲突的审计报告。经检查，同一年度的两份审计报告所附财务报表在货币资金、交易性\n金融资产、其他流动资产、递延所得税资产、其他应付款、资本公积、盈余公积、未分配利润等多项会计科目的账面数据\n上\n存在显著差异\n。\n二、\n未保持职业怀疑，存在职业判断错误\n1\n.\n2024\n年，宁波工投集团编制合并财务报表时，未按照母公司会计政策对子公司财务报表进行调整，导致累计多计投资性房地产\n93951\n.\n97\n万元、\n少计累计折旧\n80938\n.\n77\n万元，\n多计公允价值变动损益\n13381\n.\n24\n万\n元，\n其中\n2024\n年少计累计折旧\n6656\n.\n63\n万元，\n多计公允价值变动损益\n108\n.\n86\n万\n元\n。\n立信中联所\n对宁波工投集团\n2024\n年度合并财务报表审计时，未对上述事项予以充分关注，未将子公司财务报表按照母公司会计政策予以调整，认可了企业的会计处理。\n2\n.\n宁波工投集团下属子公司宁波市石化进出口有限公司（以下称石化进出口）在不承担货权转移风险的前提下，将货物直接由上游供应商转移给下游客户，未按代销实质确认收入，\n2024\n年多计收入\n17952\n.\n06\n万元。立信中联所对宁波工投集团\n2024\n年度合并财务报表审计时，未对其下属子公司石化进出口将代销行为按总额法确认收入事项予以充分关注，认可了企业的会计处理。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、第二款第（四）项、第三款，《会计师事务所执业许可和监督管理办法》第六十条第（一）项，不符合\n《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》第二十八条、第二十九条、第三十条，《中国注册会计师审计准则第\n1401\n号——对集团财务报表审计的特殊考虑》第五十八条等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款，《会计师事务所执业许可和监督管理办法》第七十条第一款的规定，\n财政部决定给予\n你警告、暂停执行业务\n6\n个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n7\n月\n31\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕194号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202608/t20260814_3995455.htm", "date": "2026-07-31", "id": "68b0aed6df6655a4d02437b8a9e25be5", "content": "财政部行政处罚决定书（财监法〔2026〕194号）\n财监法〔\n2026\n〕\n194\n号\n财政部行政处罚决定书\n当  事  人：陈春波\n地      址：\n天津市南开区红旗路\n214\n/\n216\n号天津中环产业园有限\n公司A楼南门二层\n依照《中华人民共和国注册会计师法》等\n规定\n，\n财政部组织检查组于\n2025\n年\n对\n立信中联会计师事务所（特殊普通合伙）（以下称立信中联所）执业质量等情况开展了检查。\n检查发现的主要问题和行政处罚决定如下\n：\n一、立信中联所\n对\n宁波工业投资集团有限公司\n（以下称\n宁波工投集团\n）2022年度、2023年度\n会计报表重要事项存在不实内容的情况未予指明，连续两年为其出具编制基础一致但合并范围不一致的财务报表审计报告\n202\n2\n年、\n202\n3\n年，\n立信中联所\n连续两年对宁波工投集团年度财务报表进行审计，\n每年为其\n出具两份合并范围不一致、意见类型冲突的审计报告。经检查，同一年度的两份审计报告所附财务\n报表在货币资金、交易性金融资产、其他流动资产、递延所得税资产、其他应付款、资本公积、盈余公积、未分配利润等多项会计科目的账面数据\n上\n存在显著差异\n。\n二、未保持职业怀疑，存在职业判断错误\n1\n.\n2024\n年，宁波工投集团编制合并财务报表时，未按照母公司会计政策对子公司财务报表进行调整，导致累计多计投资性房地产\n93951\n.\n97\n万元、\n少计累计折旧\n80938\n.\n77\n万元，\n多计公允价值变动损益\n13381\n.\n24\n万\n元，\n其中\n2024\n年少计累计折旧\n6656\n.\n63\n万元，\n多计公允价值变动损益\n108\n.\n86\n万\n元\n。\n立信中联所\n对宁波工投集团\n2024\n年度合并财务报表审计时，未对上述事项予以充分关注，未将子公司财务报表按照母公司会计政策予以调整，认可了企业的会计处理。\n2\n.\n宁波工投集团\n下属\n子公司宁波市石化进出口有限公司（以下称石化进出口）在不承担货权转移风险的前提下，将货物直接由上游供应商转移给下游客户，未按代销实质确认收入，\n2024\n年多计收入\n17952\n.\n06\n万元。\n立信中联所\n对宁波工投集团\n2024\n年度合并财务报表审计时，未对其下属子公司石化进出口将代销行为按总额法确认收入事项予以充分关注，认可了企业的会计处理。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、第二款第（四）项、第三款，《会计师事务所执业许可和监督管理办法》第六十条第（一）项，不符合\n《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》第二十八条、第二十九条、第三十条，《中国注册会计师审计准则第\n1401\n号——对集团财务报表审计的特殊考虑》第五十八条等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款，《会计师事务所执业许可和监督管理办法》第七十条第一款的规定，\n财政部决定给予\n你警告、暂停执行业务\n12\n个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n7\n月\n31\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕193号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202608/t20260814_3995452.htm", "date": "2026-07-31", "id": "07047035a2f6d4634207e4e251b1da16", "content": "财政部行政处罚决定书（财监法〔2026〕193号）\n财监法〔2026〕193 号\n财政部行政处罚决定书\n当\n事\n人：立信中联会计师事务所（特殊普通合伙）\n地      址：天津市南开区红旗路214/216号天津中环产业园有限    公司A楼南门二层\n依照《中华人民共和国注册会计师法》等\n规定\n，\n财政部组织\n检查组于\n2025\n年\n对你所\n执业质量等情况开展了检查。\n检查发现的主要问题和行政处罚决定如下\n：\n一、\n你所对\n宁波工业投资集团有限公司\n（以下称\n宁波工投集团\n）2022年度、2023年度\n会计报表重要事项存在不实内容的情况未予指明，连续两年为其出具编制基础一致但合并范围不一致的财务报表审计报告\n202\n2\n年、202\n3\n年，你所连续两年对宁波工投集团年度财务报表进行审计，\n每年为其\n出具两份合并范围不一致、意见类型冲突的审计报告。经检查，同一年度\n的\n两份审计报告所附财务报表在\n货币资金、交易性金融资产、其他流动资产、递延所得税资产、其他应付款、资本公积、盈余公积、未分配利润等多项会计科目的账面数据上存在显著差异。\n二、未保持职业怀疑，存在职业判断错误\n（一）\n2024\n年，宁波工投集团编制合并财务报表时，未按照母公司会计政策对子公司财务报表进行调整，导致累计多计投资性房地产\n93951\n.\n97\n万元、\n少计累计折旧\n80938\n.\n77\n万元，\n多计公允价值变动损益\n13381\n.\n24\n万\n元，\n其中\n2024\n年少计累计折旧\n6656\n.\n63\n万元，\n多计公允价值变动损益\n108\n.\n86\n万\n元\n。\n你所对宁波工投集团\n2024\n年度合并财务报表审计时，未对上述事项予以充分关注，未将子公司财务报表按照母公司会计政策予以调整，认可了企业的会计处理。\n（二）宁波工投集团下属子公司宁波市石化进出口有限公司（以下称石化进出口）在不承担货权转移风险的前提下，将货物直接由上游供应商转移给下游客户，未按代销实质确认收入，\n2024\n年多计收入\n17952\n.\n06\n万元。你所对宁波工投集团\n2024\n年度合并财务报表审计时，未对其下属子公司石化进出口将代销行为按总额法确认收入事项予以充分关注，认可了企业的\n会计\n处理。\n（三）\n2024\n年，\n杭州康韵生物科技股份有限公司（以下称康韵生物公司）\n通过“在建工程”科目核算拱墅区矩阵国际中心\n7\n处房产装修支出\n415\n.\n23\n万元，同时通过“投资性房地产”科目核算上述房产增值\n429\n.\n98\n万元。上述事项导致\n康韵生物公司\n累计多计“在建工程”、少计“投资性房地产-在建”、多计“投资性房地产-公允价值变动”\n415\n.\n23\n万元，累计多计利润总额\n415\n.\n23\n万元。\n2024\n年度多计利润总额\n41\n.\n41\n万元，多计净利润\n31\n.\n06\n万元。\n你所对康韵生物公司\n2024\n年财务报表审计时，未保持应有的职业怀疑，未识别财务报表的重大错报。\n（四）你所对福建莆田农村商业银行股份有限公司\n（以下称\n莆田农商银行\n）\n2024\n年财务报表审计时，仅对部分企业借款人的工商信息进行查询，\n五级分类检查审计程序执行不到位，\n未充分关注莆田农商银行贷款、贷记卡五级分类不准确的事项\n。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、第二款第（四）项、第三款、第三十一条，《会计师事务所执业许可和监督管理办法》第六十条第（一）项，不符合\n《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》第二十八条、第二十九条、第三十条，《中国注册会计师审计准则第\n1401\n号——对集团财务报表审计的特殊考虑》第五十八条，《中国注册会计师审计准则第\n1231\n号——针对评估的重大错报风险采取的应对措施》第二十六条第一\n款\n、\n第\n二款等有关规定。\n依据《中华人民共和国注册会计师法》第三十九条第一款，《会计师事务所执业许可和监督管理办法》第六十七条第一款的规定，\n财政部决定给予你所以下行政处罚\n：\n1\n.警告；\n2\n.\n暂停经营业务\n6\n个月\n；\n3\n.没收宁波工投集团\n2022\n年度-\n2024\n年度财务报表审计项目违法所得\n65\n.\n3\n万元，并对\n宁波工投集团\n2022\n年度-\n2024\n年度财务报表审计项目处五倍罚款\n326\n.\n5\n万元\n；\n4\n.没收康韵生物公司\n2024\n年度财务报表审计项目违法所得\n16\n万元，并对康韵生物公司\n2024\n年度财务报表审计项目处一倍罚款\n16\n万元\n；\n5\n.没收莆田农商银行\n2024\n年度财务报表审计项目违法所得\n12\n万元\n。\n你所应在收到本处罚决定书之日起十五日内与财政部\n天津\n监管局联系，凭财政部\n天津\n监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n7\n月\n31\n日"}, {"source": "内部审计", "category": "论坛讨论", "title": "学会这几招、乱账不用愁", "url": "https://bbs.esnai.cn/thread-5497960-1-1.html", "date": "2026-07-30", "content": "学会这几招、乱账不用愁前言：新入职一家公司，可能会因为交接不善，不得不面对“前任”留下来一堆乱账，此时的迷茫与无助与谁说？那么我们需要把这些清楚明白揭示出来，并向领导汇报。学会这几招，其实并不难。一、清理乱账前的准备1、了解公司业务状况，如业务流程（ ...", "id": "6e3db7deaab6391672657a466cae45ac"}, {"source": "国家税务局", "category": "留言咨询", "title": "我们准备新开办一家企业，请问办理税务登记和社保费登记需要收费吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5251143/content.html", "date": "2026-07-17", "id": "b668824e5e891eadcf221c291ee2a74a", "content": "答：\n不需要。\n按照《关于取消部分涉企行政事业性收费的通知》（财综〔2011〕9号），我国取消税务登记证工本费。同时，按照《国务院办公厅关于加快推进“五证合一、一照一码”登记制度改革的通知》（国办发〔2016〕53号）有关要求，税务登记和社会保险登记均已纳入营业执照登记，不再需要单独办理登记。"}, {"source": "财政部", "category": "处罚案例", "title": "财政部列入严重失信主体名单决定书（财监法〔2026〕164号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202609/t20260903_3996633.htm", "date": "2026-07-13", "id": "1916f687f782f20e0b448db51d5e2c3b", "content": "财政部列入严重失信主体名单决定书（财监法〔2026〕164号）\n财\n监法\n〔\n202\n6\n〕\n164\n号\n财政部列入严重失信主体名单决定书\n当\n事\n人：\n王雅栋\n地\n址：\n北京市西城区阜成门外大街2号22层A2\n依照《注册会计师行业严重失信主体名单管理办法》（财政部令第\n116\n号，以下称《办法》）的规定，基于对你的有关行政处罚，\n财政部决定\n将你列入严重失信主体名单\n，有关事项如下\n：\n依照《中华人民共和国注册会计师法》等规定，财政部组织检查组对\n中兴财光华会计师事务所（特殊普通合伙）（以下称中兴财光华）\n执业质量等情况开展了检查，认定该所存在未保持应有的职业怀疑，未履行必要审计程序或审计程序存在重大缺陷\n等严重违法问题。\n你作为相关审计报告签字注册会计师，对有关问题负有责任。\n2026\n年\n4\n月，财政部向你作出行政处罚决定，给予你\n警告、暂停执行业务1年\n的行政\n处罚。\n依据《办法》第四条第\n（一）\n项的规定，财政部决定将你列入注册会计师行业严重失信主体名单，实施联合惩戒。依据《办\n法》\n第十条第一款\n的规定，列入期限为\n二\n年。\n依据《办法》第九条的规定，除依照法律、行政法规规定应当实施的从业限制等管理措施外，财政部还将实施下列管理措施：（一）列为重点监管对象，适当提高抽查的比例和频次，依法严格监管；（二）不适用告知承诺制；（三）不予授予财政部门荣誉称号等表彰奖励。\n依据《办法》第十二条的规定，当事人被列入严重失信主体名单满一年后，符合相关条件的，可以依照《办法》规定向财政部申请提前移出。\n依据《办法》第十七条的规定，如有证据证明公示信息不准确，可以要求财政部进行更正。\n如不服本决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本决定不停止执行。\n财  政  部\n202\n6\n年\n7\n月\n13\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部列入严重失信主体名单决定书（财监法〔2026〕163号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202609/t20260903_3996632.htm", "date": "2026-07-13", "id": "b5a1f7e84182eaa8e14d65e80a2b4ead", "content": "财政部列入严重失信主体名单决定书（财监法〔2026〕163号）\n财\n监法\n〔\n202\n6\n〕\n163\n号\n财政部列入严重失信主体名单决定书\n当\n事\n人：\n齐正华\n地\n址：\n北京市西城区阜成门外大街\n2\n号\n22\n层\nA2\n依照《注册会计师行业严重失信主体名单管理办法》（财政部令第\n116\n号，以下称《办法》）的规定，基于对你的有关行政处罚，\n财政部决定\n将你列入严重失信主体名单\n，有关事项如下\n：\n依照《中华人民共和国注册会计师法》等规定，财政部组织检查组对\n中兴财光华会计师事务所（特殊普通合伙）（以下称中兴财光华）\n执业质量等情况开展了检查，认定该所存在未保持应有的职业怀疑，未履行必要审计程序或审计程序存在重大缺陷\n等严重违法问题。\n你作为相关审计报告签字注册会计师，对有关问题负有责任。\n2026\n年\n4\n月，财政部向你作出行政处罚决定，给予你\n警告、暂停执行业务\n1\n年\n的行政\n处罚。\n依据《办法》第四条第\n（一）\n项的规定，财政部决定将你列入注册会计师行业严重失信主体名单，实施联合惩戒。依据《办\n法》\n第十条第一款\n的规定，列入期限为\n二\n年。\n依据《办法》第九条的规定，除依照法律、行政法规规定应当实施的从业限制等管理措施外，财政部还将实施下列管理措施：（一）列为重点监管对象，适当提高抽查的比例和频次，依法严格监管；（二）不适用告知承诺制；（三）不予授予财政部门荣誉称号等表彰奖励。\n依据《办法》第十二条的规定，当事人被列入严重失信主体名单满一年后，符合相关条件的，可以依照《办法》规定向财政部申请提前移出。\n依据《办法》第十七条的规定，如有证据证明公示信息不准确，可以要求财政部进行更正。\n如不服本决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本决定不停止执行。\n财  政  部\n202\n6\n年\n7\n月\n13\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部列入严重失信主体名单决定书（财监法〔2026〕162号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202609/t20260903_3996631.htm", "date": "2026-07-13", "id": "0bbe00906d84ecff839f501ea2de4c57", "content": "财政部列入严重失信主体名单决定书（财监法〔2026〕162号）\n财\n监法\n〔202\n6\n〕\n162\n号\n财政部列入严重失信主体名单决定书\n当\n事\n人：中兴财光华会计师事务所（特殊普通合伙）\n地\n址：北京市西城区阜成门外大街2号22层A24\n依照《注册会计师行业严重失信主体名单管理办法》（财政部令第116号，以下称《办法》）的规定，基于对你所的有关行政处罚，财\n政部决定\n将你所列入严重失信主体名单\n，有关事项如下\n：\n依照《中华人民共和国注册会计师法》等规定，财政部组织检查组对你所执业质量等情况开展了检查，认定你所存在未保持应有的职业怀疑，未履行必要审计程序或审计程序存在重大缺陷\n等严重违法问题\n。\n2026\n年\n4\n月，财政部向你所作出行政处罚决定，给予你所\n警告\n、\n暂停经营业务1年\n，\n并处\n罚没款\n的\n行政处罚\n。\n依据《办法》第四条第\n（四）\n项的规定，\n财政部决定将你所列入\n注册会计师行业严重失信主体名单，实施联合惩戒。依据《办法》\n第十条第一款\n的规定，列入期限为二年。\n依据《办法》第九条的规定，除依照法律、行政法规规定应当实施的从业限制等管理措施外，财政部还将实施下列管理措施：（一）列为重点监管对象，适当提高抽查的比例和频次，依法严格监管；（二）不适用告知承诺制；（三）不予授予财政部门荣誉称号等表彰奖励。\n依据《办法》第十二条的规定，当事人被列入严重失信主体名单满一年后，符合相关条件的，可以依照《办法》规定向财政部申请提前移出。\n依据《办法》第十七条的规定，如有证据证明公示信息不准确，可以要求财政部进行更正。\n如不服本决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本决定不停止执行。\n财  政  部\n202\n6\n年\n7\n月\n13\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部列入严重失信主体名单决定书（财监法〔2026〕161号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202609/t20260903_3996630.htm", "date": "2026-07-13", "id": "4745deb4bfccaceef7ca8b5c91a96f3c", "content": "财政部列入严重失信主体名单决定书（财监法〔2026〕161号）\n财\n监法\n〔\n202\n6\n〕\n161\n号\n财政部列入严重失信主体名单决定书\n当\n事\n人：\n任海春\n地\n址：\n北京市大兴区饮马井街\n2\n号院\n4\n号楼\n1\n层\n0257\n号\n依照《注册会计师行业严重失信主体名单管理办法》（财政部令第\n116\n号，以下称《办法》）的规定，基于对你的有关行政处罚，\n财政部决定\n将你列入严重失信主体名单\n，有关事项如下\n：\n依照《中华人民共和国注册会计师法》等规定，财政部组织检查组对北京亚泰国际会计师事务所（特殊普通合伙）（现更名为北京亚泰国际会计师事务所（普通合伙））执业质量等情况开展了检查，认定该所\n在福建紫天传媒科技股份有限公司\n2023\n年度财务报表审计项目中，\n存在\n隐匿\n重要档案资料、逃避财政部门依法实施的监督检查，编制虚假的审计工作底稿等严重违法问题。\n你作\n为上述审计报告签字注册会计师，对有关问题负有责任。\n2025\n年\n12\n月，财政部向你作出行政处罚决定，给予你警告、暂停执行业务\n1\n年，罚款\n1\n万元的行政\n处罚。\n依据《办法》第四条第（一）项的规定，财政部\n决定将你列入注册会计师行业严重失信主体名单\n，实施联合惩戒。依据《办法》第十条第一款的规定，列入期限为二年。\n依据《办法》第九条的规定，除依照法律、行政法规规定应当实施的从业限制等管理措施外，财政部还将实施下列管理措施：（一）列为重点监管对象，适当提高抽查的比例和频次，依法严格监管；（二）不适用告知承诺制；（三）不予授予财政部门荣誉称号等表彰奖励。\n依据《办法》第十二条的规定，当事人被列入严重失信主体名单满一年后，符合相关条件的，可以依照《办法》规定向财政部申请提前移出。\n依据《办法》第十七条的规定，如有证据证明公示信息不准确，可以要求财政部进行更正。\n如不服本决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本决定不停止执行。\n财  政  部\n202\n6\n年\n7\n月\n13\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部列入严重失信主体名单决定书（财监法〔2026〕160号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202609/t20260903_3996629.htm", "date": "2026-07-13", "id": "b053a4f1d9d762221d0dd6e34ad8c07a", "content": "财政部列入严重失信主体名单决定书（财监法〔2026〕160号）\n财\n监法\n〔\n202\n6\n〕\n160\n号\n财政部列入严重失信主体名单决定书\n当\n事\n人：\n田梦珺\n地\n址：\n北京市大兴区饮马井街\n2\n号院\n4\n号楼\n1\n层\n0257\n号\n依照《注册会计师行业严重失信主体名单管理办法》（财政部令第\n116\n号，以下称《办法》）的规定，基于对你的有关行政处罚，\n财政部决定\n将你列入严重失信主体名单\n，有关事项如下\n：\n依照《中华人民共和国注册会计师法》等规定，财政部组织检查组对北京亚泰国际会计师事务所（特殊普通合伙）（现更名为北京亚泰国际会计师事务所（普通合伙））执业质量等情况开展了检查，认定该所\n存在隐匿重要档案资料、逃避财政部门依法实施的监督检查，编制虚假的审计工作底稿等严重违法问题。\n你作为相关审计报告签字注册会计师，对有关问题负有责任。\n2025\n年\n12\n月，财政部向你作出行政处罚决定，给予你警告、吊销注册会计师证书，罚款\n1\n万元的行政\n处罚。\n依据《办法》第四条第（二）项的规定，财政部\n决定将你列入注册会计师行业严重失信主体名单\n，实施联合惩戒。依据《办法》第十条第二款的规定，列入期限为五年。\n依据《办法》第九条的规定，除依照法律、行政法规规定应当实施的从业限制等管理措施外，财政部还将实施下列管理措施：（一）列为重点监管对象，适当提高抽查的比例和频次，依法严格监管；（二）不适用告知承诺制；（三）不予授予财政部门荣誉称号等表彰奖励。\n依据《办法》第十二条的规定，当事人被列入严重失信主体名单满一年后，符合相关条件的，可以依照《办法》规定向财政部申请提前移出。\n依据《办法》第十七条的规定，如有证据证明公示信息不准确，可以要求财政部进行更正。\n如不服本决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本决定不停止执行。\n财  政  部\n202\n6\n年\n7\n月\n13\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部列入严重失信主体名单决定书（财监法〔2026〕159号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202609/t20260903_3996627.htm", "date": "2026-07-13", "id": "34bf72f81c9704d78520694517db6d0d", "content": "财政部列入严重失信主体名单决定书（财监法〔2026〕159号）\n财\n监法\n〔202\n6\n〕\n159\n号\n财政部\n列入严重失信主体名单决定书\n当\n事\n人：\n北京亚泰国际会计师事务所（普通合伙）\n地\n址：\n北京市大兴区饮马井街\n2\n号院\n4\n号楼\n1\n层\n0257\n号\n依照《注册会计师行业严重失信主体名单管理办法》（财政部令第116号，以下称《办法》）的规定，基于对你所的有关行政处罚，财\n政部决定\n将你所列入严重失信主体名单\n，有关事项如下\n：\n依照《中华人民共和国注册会计师法》等规定，财政部组织检查组对你所执业质量等情况开展了检查，认定你所\n存在隐匿重要档案资料、逃避财政部门依法实施的监督检查，编制虚假的审计工作底稿等严重违法问题\n。\n2025\n年\n12\n月，财政部向你所作出行政处罚决定，给予你所警告、暂停经营业务\n1\n年，没收紫天科技2023年度财务报表审计项目违法所得\n140\n万元、处以罚款\n701\n万元，没\n收湘投轻材\n2023\n年度财务报表审计项目违法所得\n25\n万元、处以罚款\n25\n万元的行政处罚\n。截至目前，你所未缴纳上述罚没款。\n依据《办法》第四条第（四）（七）项的规定，\n财政部决定将你所列入\n注册会计师行业严重失信主体名单，实施联合惩戒。依据《办法》第十条第一款的规定，列入期限为二年。\n依据《办法》第九条的规定，除依照法律、行政法规规定应当实施的从业限制等管理措施外，财政部还将实施下列管理措施：（一）列为重点监管对象，适当提高抽查的比例和频次，依法严格监管；（二）不适用告知承诺制；（三）不予授予财政部门荣誉称号等表彰奖励。\n依据《办法》第十二条的规定，当事人被列入严重失信主体名单满一年后，符合相关条件的，可以依照《办法》规定向财政部申请提前移出。\n依据《办法》第十七条的规定，如有证据证明公示信息不准确，可以要求财政部进行更正。\n如不服本决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本决定不停止执行。\n财  政  部\n202\n6\n年\n7\n月\n13\n日"}, {"source": "内部审计", "category": "论坛讨论", "title": "现在大家发帖吗", "url": "https://bbs.esnai.cn/thread-5497756-1-1.html", "date": "2026-07-10", "content": "现在大家还在论坛上发帖探讨吗？感觉活跃性降低了不少", "id": "440903428c51e0899d6dfa283aa2efe5"}, {"source": "内部审计", "category": "论坛讨论", "title": "审计交流", "url": "https://bbs.esnai.cn/thread-5497741-1-1.html", "date": "2026-07-09", "content": "周一晚上，与某新能源审计负责人做了一些业务交流，其中几个话题值得拿出来探讨。一、业绩成果的界定与审计有效性困惑：目前老板对审计部的管理要求之一是，所有审计发现的问题需区分是新问题还是历史遗留问题。如果挽损金额主要来自历史问题，且金额逐年递增，他会质疑 ...", "id": "6ca3033054c2b300cd355d458bdf8e9d"}, {"source": "内部审计", "category": "论坛讨论", "title": "事项复盘", "url": "https://bbs.esnai.cn/thread-5497709-1-1.html", "date": "2026-07-06", "content": "查出来虚报加班费。与业务主管沟通，业务主管反馈其会与上级领导反馈。 然后我就一直追着问他们上级领导的意见。最终提交的处罚结果与最初给我说的不一致（提交时我不在办公室，一直以为没有提交）。我向领导反馈了。领导只是说他会沟通。最终不了了之。 我在想，之后 ...", "id": "5e7a79de3d8ad3dc659d8653ef3b9855"}, {"source": "内部审计", "category": "论坛讨论", "title": "审计思路", "url": "https://bbs.esnai.cn/thread-5497703-1-1.html", "date": "2026-07-06", "content": "不知道该审什么了......", "id": "ea6ae3f8cc053bdd0e31e15923111be9"}, {"source": "国家税务局", "category": "留言咨询", "title": "我们是按季申报的小规模纳税人，今年第一季度跨地区提供建筑服务，不含税销售额30万元，需要在项目地预缴增值税吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5250677/content.html", "date": "2026-07-01", "id": "313d195cfa8b0d3aa2afe60b76e15c80", "content": "答：\n需要。\n按照《财政部 税务总局关于发布〈增值税预缴税款管理办法〉的公告》（财政部 税务总局公告2026年第14号）《财政部 税务总局关于增值税法施行后增值税优惠政策衔接事项的公告》（财政部 税务总局公告2026年第10号）规定，2026年1月1日起，纳税人跨地级行政区（直辖市下辖县区）提供建筑服务（以下简称跨地区提供建筑服务），当期在预缴地实现的全部价款、预收款（不含增值税）合计未达到增值税起征点的，无需预缴增值税；达到增值税起征点的，2027年12月31日以前减按1%预征率预缴增值税。小规模纳税人以一个季度为一个计税期间的，起征点为季度销售额30万元。\n您是按季申报的小规模纳税人，今年第一季度跨地区提供建筑服务不含税销售额为30万元，达到了增值税起征点，按规定需要预缴增值税，预征率减按1%。"}, {"source": "内部审计", "category": "论坛讨论", "title": "有没有内部审计沟通群", "url": "https://bbs.esnai.cn/thread-5497552-1-1.html", "date": "2026-06-22", "content": "各位大佬、各位同仁： 请问怎么获取本地的内部审计沟通群？以及哪位大佬有内部审计沟通群可以共享一下。 本人3年外审经验，5年内审经验，现任上市公司审计经理，想找一个能交流的群", "id": "46656dea231a237f7dc046d0e66386a1"}, {"source": "国家税务局", "category": "留言咨询", "title": "我们是机械制造公司，是增值税一般纳税人，在销售机器设备的同时还提供安装服务，但是销售设备和提供安装服务的税率不一样，那我们应该如何缴纳增值税？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5250202/content.html", "date": "2026-06-05", "id": "45d81b4b6c30472a25dc17e755f93cda", "content": "答：\n您这种情况属于一项应税交易涉及两个以上税率的情形。按照政策规定，一般纳税人销售机器设备同时提供安装服务，应按照销售货物的税率来缴纳增值税。\n根据《中华人民共和国增值税法》第十三条规定，纳税人发生一项应税交易涉及两个以上税率、征收率的，按照应税交易的主要业务适用税率、征收率。\n根据《财政部 税务总局关于增值税进项税额抵扣等有关事项的公告》（财政部 税务总局公告2026年第13号）：一般纳税人发生下列情形，应当按照应税交易的主要业务适用税率：\n（二）销售活动板房、机器设备、钢结构件等货物的同时提供的安装服务，适用货物的税率。\n也就是说，一项应税交易涉及两个以上税率的业务，核心是看业务之间是否有明显的主附关系，然后按照应税交易的主要业务来确定适用税率。\n你们公司在卖机器设备的同时提供安装服务，既有销售机器设备13%的税率，又有安装服务9%的税率，销售机器设备是居于主体地位的，体现了交易的实质和目的，安装服务是必要的补充，以销售机器设备的发生为前提，那么按照增值税相关政策规定，应该按照主要业务“销售货物”适用13%的税率。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我们是一家生产制造公司，为了扩大生产，2025年12月购买了一套价值400万元的生产设备并于当月投入使用，这些新购入的设备成本可以在2025年度企业所得税汇算清缴时一次性扣除吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5249544/content.html", "date": "2026-05-11", "id": "380937e15cd54744e4bd0f56276d8d2a", "content": "зӯ”пјҡ\nдёҚеҸҜд»ҘгҖӮ\nж №жҚ®гҖҠеӣҪе®¶зЁҺеҠЎжҖ»еұҖе…ідәҺи®ҫеӨҮеҷЁе…·жүЈйҷӨжңүе…ідјҒдёҡжүҖеҫ—зЁҺж”ҝзӯ–жү§иЎҢй—®йўҳзҡ„е…¬е‘ҠгҖӢпјҲеӣҪе®¶зЁҺеҠЎжҖ»еұҖе…¬е‘Ҡ2018е№ҙз¬¬46еҸ·пјүз¬¬дәҢжқЎи§„е®ҡпјҡеӣәе®ҡиө„дә§еңЁжҠ•е…ҘдҪҝз”ЁжңҲд»Ҫзҡ„ж¬ЎжңҲжүҖеұһе№ҙеәҰдёҖж¬ЎжҖ§зЁҺеүҚжүЈйҷӨгҖӮ\nеӣ жӯӨпјҢдёҖж¬ЎжҖ§жүЈйҷӨзҡ„ж—¶зӮ№е№¶йқһиҙӯиҝӣжҲ–жҠ•е…ҘдҪҝз”Ёзҡ„еҪ“жңҲпјҢиҖҢжҳҜеңЁжҠ•е…ҘдҪҝз”ЁжңҲд»Ҫзҡ„ж¬ЎжңҲжүҖеұһе№ҙеәҰгҖӮ\nз»“еҗҲжӮЁе…¬еҸёе®һйҷ…жғ…еҶөпјҢ2025е№ҙ12жңҲиҙӯд№°е№¶жҠ•е…ҘдҪҝз”Ёзҡ„и®ҫеӨҮпјҢеә”еңЁ2026е№ҙдә«еҸ—дёҖж¬ЎжҖ§жүЈйҷӨж”ҝзӯ–пјҢиҖҢдёҚжҳҜеңЁ2025е№ҙеәҰдјҒдёҡжүҖеҫ—зЁҺжұҮз®—жё…зјҙж—¶дә«еҸ—гҖӮ\nиҝҷйҮҢйңҖиҰҒжҸҗйҶ’жӮЁпјҢж №жҚ®гҖҠиҙўж”ҝйғЁ зЁҺеҠЎжҖ»еұҖе…ідәҺи®ҫеӨҮгҖҒеҷЁе…·жүЈйҷӨжңүе…ідјҒдёҡжүҖеҫ—зЁҺж”ҝзӯ–зҡ„е…¬е‘ҠгҖӢпјҲиҙўж”ҝйғЁ зЁҺеҠЎжҖ»еұҖе…¬е‘Ҡ2023е№ҙз¬¬37еҸ·пјүз¬¬дёҖжқЎи§„е®ҡпјҡдјҒдёҡеңЁ2024е№ҙ1жңҲ1ж—ҘиҮі2027е№ҙ12жңҲ31ж—Ҙжңҹй—ҙж–°иҙӯиҝӣзҡ„и®ҫеӨҮгҖҒеҷЁе…·пјҢеҚ•дҪҚд»·еҖјдёҚи¶…иҝҮ500дёҮе…ғзҡ„пјҢе…Ғи®ёдёҖж¬ЎжҖ§и®Ўе…ҘеҪ“жңҹжҲҗжң¬иҙ№з”ЁеңЁи®Ўз®—еә”зәізЁҺжүҖеҫ—йўқж—¶жүЈйҷӨпјҢдёҚеҶҚеҲҶе№ҙеәҰи®Ўз®—жҠҳж—§пјӣеҚ•дҪҚд»·еҖји¶…иҝҮ500дёҮе…ғзҡ„пјҢд»ҚжҢүдјҒдёҡжүҖеҫ—зЁҺжі•е®һж–ҪжқЎдҫӢгҖҒгҖҠиҙўж”ҝйғЁ еӣҪе®¶зЁҺеҠЎжҖ»еұҖе…ідәҺе®Ңе–„еӣәе®ҡиө„дә§еҠ йҖҹжҠҳж—§дјҒдёҡжүҖеҫ—зЁҺж”ҝзӯ–зҡ„йҖҡзҹҘгҖӢпјҲиҙўзЁҺ\nгҖ”\n2014\nгҖ•\n75еҸ·пјүгҖҒгҖҠиҙўж”ҝйғЁ еӣҪе®¶зЁҺеҠЎжҖ»еұҖе…ідәҺиҝӣдёҖжӯҘе®Ңе–„еӣәе®ҡиө„дә§еҠ йҖҹжҠҳж—§дјҒдёҡжүҖеҫ—зЁҺж”ҝзӯ–зҡ„йҖҡзҹҘгҖӢпјҲиҙўзЁҺ\nгҖ”\n2015\nгҖ•\n106еҸ·пјүзӯүзӣёе…іи§„е®ҡжү§иЎҢгҖӮ"}, {"source": "内部审计", "category": "论坛讨论", "title": "AI辅助审计", "url": "https://bbs.esnai.cn/thread-5496935-1-1.html", "date": "2026-04-29", "content": "回到开篇提到的AI（人工智能）辅助审计。求职时，若能讲出一个新故事，为未来的领导描绘更美好的前景（哪怕是“画大饼”），也能显著提升你谈薪时的底气。过去，简历上注明“擅长SQL”绝对是亮点；而如今，这个位置属于AI。随着AI技术的广泛应用，审计模式或将发生变革 ...", "id": "42404a6bcf49ec2ea79781ed31303a98"}, {"source": "国家税务局", "category": "留言咨询", "title": "小规模纳税人提供旅游服务，计算增值税应纳税额时，可以按规定从含税销售额中扣除支付给其他单位的住宿费、餐饮费等，在判断增值税起征点时，是按扣除前的销售额还是扣除后的销售额判断？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5249007/content.html", "date": "2026-04-17", "id": "845159028dbcf4bd336a118f3777b25f", "content": "答：\n根据《财政部 税务总局关于增值税法施行后增值税优惠政策衔接事项的公告》（财政部 税务总局公告2026年第10号）规定：自2026年1月1日至2027年12月31日，小规模纳税人发生应税交易，起征点标准如下：\n（一）以一个月为一个计税期间的，起征点为月销售额10万元。以一个季度为一个计税期间的，起征点为季度销售额30万元。\n（二）按次纳税的，起征点为每次（日）销售额1000元。一日内发生多次应税交易的，按日适用起征点标准。\n小规模纳税人发生应税交易，按照规定以扣除相关价款后的余额计算销售额或者允许从含税销售额中扣除相关价款后计算应纳税额的，以扣除相关价款后的不含税余额，适用本条起征点标准。\n因此，小规模纳税人提供旅游服务，应以按规定扣除相关价款后的不含税余额，来适用起征点标准。"}, {"source": "内部审计", "category": "论坛讨论", "title": "内部审计电子书籍链接（内审修行与实战系列）", "url": "https://bbs.esnai.cn/thread-5496727-1-1.html", "date": "2026-04-11", "content": "《内审修行与实战》系列书，共4本，每本均20万字以上，内容充足且独立原创，全是一线内审干货。 添加助理微信：“内审图书咨询”（17320147730），获取课程信息。 一、电子书免费预览 第1本：实务干货篇：https://flbook.com.cn/c/zIjurapLgb/share 第2本：内审修行 ...", "id": "20f52587744dce549c4bf1a90356e8ca"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕90号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260414_3987540.htm", "date": "2026-04-07", "id": "65e1783fa173fa833aa0a7c4765d3665", "content": "财政部行政处罚决定书（财监法〔2026〕90号）\n财监法〔\n2026\n〕\n90\n号\n财政部行政处罚决定书\n当 事 人：杨帆\n地    址：哈尔滨市南岗区千山路\n19\n号\n依照《中华人民共和国会计法》的规定，财政部组织检查组于\n2025\n年对黑龙江北大荒牧业营销有限公司（以下称北大荒牧业营销公司）会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n一、部分贸易业务不具有商业实质\n2023\n年，北大荒牧业营销公司分别与东方集团大连粮食贸易有限公司、大连家禾农业发展有限公司、大连良运集团粮油购销有限公司、大连德泰电仓供应链科技有限公司开展多笔大豆销售采购业务，与哈尔滨汇实丰商贸有限公司（现更名为哈尔滨九皋供应链管理有限公司）、黑龙江实丰农牧有限公司开展多笔豆粕销售采购业务，上述贸易业务不具有商业实质，导致\n2023\n年虚增营业收入\n23642.14\n万元，虚增营业成本\n23608.17\n万元，虚增利润\n33.97\n万元。\n二、部分业务收入核算方法错误\n北大荒牧业营销公司在从事玉米、豆粕贸易中，每笔交易价差固定，向下游客户转让商品前不拥有对商品的实质控制权，属于代理人身份，应按净额法确认收入。北大荒牧业营销公司按总额法确认收入，导致\n2023\n年多计收入\n43533.08\n万元、多计成本\n43533.08\n万元，\n2024\n年多计收入\n47473.00\n万元、多计成本\n47473.00\n万元。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了\n2017\n年修改的《中华人民共和国会计法》第九条第一款、第二款，\n2024\n年修改的《中华人民共和国会计法》第九条第一款、第二款，不符合《企业会计准则第\n14\n号——收入》第三十四条第一款的规定。\n你作为北大荒牧业营销公司的财务负责人，对上述问题负有责任。依据\n2017\n年修改的《中华人民共和国会计法》第四十二条第一款第（四）项、第四十三条第二款，\n2024\n年修改的《中华人民共和国会计法》第四十条第一款第（四）项的规定，财政部决定给予你罚款\n1\n万元的行政处罚。\n你应在收到本处罚决定书之日起十五日内与财政部黑龙江监管局联系，凭财政部黑龙江监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n4\n月\n7\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕89号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260414_3987539.htm", "date": "2026-04-07", "id": "afb7f7c618998be6db75b6c7b7684d54", "content": "财政部行政处罚决定书（财监法〔2026〕89号）\n财监法〔\n2026\n〕\n89\n号\n财政部行政处罚决定书\n当 事 人：车万峰\n地    址：哈尔滨市南岗区千山路\n19\n号\n依照《中华人民共和国会计法》的规定，财政部组织检查组于\n2025\n年对黑龙江北大荒牧业营销有限公司（以下称北大荒牧业营销公司）会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n一、部分贸易业务不具有商业实质\n2023\n年，北大荒牧业营销公司分别与东方集团大连粮食贸易有限公司、大连家禾农业发展有限公司、大连良运集团粮油购销有限公司、大连德泰电仓供应链科技有限公司开展多笔大豆销售采购业务，与哈尔滨汇实丰商贸有限公司（现更名为哈尔滨九皋供应链管理有限公司）、黑龙江实丰农牧有限公司开展多笔豆粕销售采购业务，上述贸易业务不具有商业实质，导致\n2023\n年虚增营业收入\n23642.14\n万元，虚增营业成本\n23608.17\n万元，虚增利润\n33.97\n万元。\n二、部分业务收入核算方法错误\n北大荒牧业营销公司在从事玉米、豆粕贸易中，每笔交易价差固定，向下游客户转让商品前不拥有对商品的实质控制权，属于代理人身份，应按净额法确认收入。北大荒牧业营销公司按总额法确认收入，导致\n2023\n年多计收入\n43533.08\n万元、多计成本\n43533.08\n万元，\n2024\n年多计收入\n47473.00\n万元、多计成本\n47473.00\n万元。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了\n2017\n年修改的《中华人民共和国会计法》第九条第一款、第二款，\n2024\n年修改的《中华人民共和国会计法》第九条第一款、第二款，不符合《企业会计准则第\n14\n号——收入》第三十四条第一款的规定。\n你作为北大荒牧业营销公司的单位负责人，对上述问题负有责任。依据\n2017\n年修改的《中华人民共和国会计法》第四十二条第一款第（四）项、第四十三条第二款，\n2024\n年修改的《中华人民共和国会计法》第四十条第一款第（四）项的规定，财政部决定给予你罚款\n2\n万元的行政处罚。\n你应在收到本处罚决定书之日起十五日内与财政部黑龙江监管局联系，凭财政部黑龙江监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n4\n月\n7\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕88号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260414_3987538.htm", "date": "2026-04-07", "id": "ee7467cbb13f57f9e722bd9e9a9393bc", "content": "财政部行政处罚决定书（财监法〔2026〕88号）\n财监法〔\n2026\n〕\n88\n号\n财政部行政处罚决定书\n当 事 人：黑龙江北大荒牧业营销有限公司\n地    址：哈尔滨市南岗区千山路\n19\n号\n依照《中华人民共和国会计法》的规定，财政部组织检查组于\n2025\n年对你公司会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n一、部分贸易业务不具有商业实质\n2023\n年，你公司分别与东方集团大连粮食贸易有限公司、大连家禾农业发展有限公司、大连良运集团粮油购销有限公司、大连德泰电仓供应链科技有限公司开展多笔大豆销售采购业务，与哈尔滨汇实丰商贸有限公司（现更名为哈尔滨九皋供应链管理有限公司）、黑龙江实丰农牧有限公司开展多笔豆粕销售采购业务。经查，上述贸易业务不具有商业实质，导致\n2023\n年虚增营业收入\n23642.14\n万元，虚增营业成本\n23608.17\n万元，虚增利润\n33.97\n万元。\n二、部分业务收入核算方法错误\n你公司在从事玉米、豆粕贸易中，每笔交易价差固定，向下游客户转让商品前不拥有对商品的实质控制权，属于代理人身份，应按净额法确认收入。你公司按总额法确认收入，导致\n2023\n年多计收入\n43533.08\n万元、多计成本\n43533.08\n万元，\n2024\n年多计收入\n47473.00\n万元、多计成本\n47473.00\n万元。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了\n2017\n年修改的《中华人民共和国会计法》第九条第一款、第二款，\n2024\n年修改的《中华人民共和国会计法》第九条第一款、第二款，不符合《企业会计准则第\n14\n号——收入》第三十四条第一款的规定。\n依据\n2017\n年修改的《中华人民共和国会计法》第四十二条第一款第（四）项、第四十三条第二款，\n2024\n年修改的《中华人民共和国会计法》第四十条第一款第（四）项的规定，财政部决定给予你公司警告、通报批评，并处罚款\n25\n万元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部黑龙江监管局联系，凭财政部黑龙江监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n4\n月\n7\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕85号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260414_3987537.htm", "date": "2026-04-07", "id": "36052323254facbe098bb098e0eb19d5", "content": "财政部行政处罚决定书（财监法〔2026〕85号）\n财监法〔\n2026\n〕\n85\n号\n财政部行政处罚决定书\n当 事 人：丁锋云\n地    址：长春市经济开发区南沙大街\n2888\n号\n依照《中华人民共和国会计法》的规定，财政部组织检查组于\n2025\n年对派斯林数字科技股份有限公司（以下称派斯林）会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n2024\n年，派斯林对“北京福田戴姆勒\nA6\n分拼线整包项目”等\n3\n个项目采 司（现更名为汉嘉数智科技集团股份有限公司，以下称汉嘉设计）会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n汉嘉设计\n2024\n年对“大关单元\nGS0507-R21-01\n地块八丈井东片安置房及\nGS0507-G1/S42-30\n地块绿地兼社会停车场设计\n-\n采购\n-\n施工（\nEPC\n）总承包项目”等\n6\n个\nEPC\n联合体项目采用总额法按履约进度确认收入，上述项目由汉嘉设计联合施工单位组成联合体共同投标并提供服务，联合体协议明确了各自的工作内容、权利义务和合同价款，汉嘉设计负责设计，未主导采购和施工服务，未承担采购和施工服务的主要责任，只收取设计费、管理费，无法自主决定整个项目报价。汉嘉设计作为联合体牵头方，对上述项目中的采购和施工部分仅承担连带责任，不符合总额法确认收入的相关条件，应按净额法确认收入，导致\n2024\n年多计收入\n29263.91\n万元、多计成本\n29263.91\n万元。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了\n2024\n年修改的《中华人民共和国会计法》第十五条第一款，不符合《企业会计准则第\n14\n号——收入》第三十四条第一款的规定。\n你作为汉嘉设计的会计机构负责人，对上述问题负有责任。依据\n2024\n年修改的《中华人民共和国会计法》第四十条第一款第（四）项的规定，财政部决定给予你罚款\n10\n万元的行政处罚。\n你应在收到本处罚决定书之日起十五日内与财政部浙江监管局联系，凭财政部浙江监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n4\n月\n7\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕77号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260414_3987531.htm", "date": "2026-04-07", "id": "0058a7bf1d3614478eced0beb3a03bdc", "content": "财政部行政处罚决定书（财监法〔2026〕77号）\n财监法〔\n2026\n〕\n77\n号\n财政部行政处罚决定书\n当 事 人：朱祖龙\n地    址：杭州市拱墅区湖墅南路\n501\n号\n依照《中华人民共和国会计法》的规定，财政部组织检查组于\n2025\n年对汉嘉设计集团股份有限公司（现更名为汉嘉数智科技集团股份有限公司，以下称汉嘉设计）会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n汉嘉设计\n2024\n年对“大关单元\nGS0507-R21-01\n地块八丈井东片安置房及\nGS0507-G1/S42-30\n地块绿地兼社会停车场设计\n-\n采购\n-\n施工（\nEPC)\n总承包项目”等\n6\n个\nEPC\n联合体项目采用总额法按履约进度确认收入，上述项目由汉嘉设计联合施工单位组成联合体共同投标并提供服务，联合体协议明确了各自的工作内容、权利义务和合同价款，汉嘉设计负责设计，未主导采购和施工服务，未承担采购和施工服务的主要责任，只收取设计费、管理费，无法自主决定整个项目报价。汉嘉设计作为联合体牵头方，对上述项目中的采购和施工部分仅承担连带责任，不符合总额法确认收入的相关条件，应按净额法确认收入，导致\n2024\n年多计收入\n29263.91\n万元、多计成本\n29263.91\n万元。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了\n2024\n年修改的《中华人民共和国会计法》第十五条第一款，不符合《企业会计准则第\n14\n号——收入》第三十四条第一款的规定。\n你作为汉嘉设计的主管会计工作负责人，对上述问题负有责任。依据\n2024\n年修改的《中华人民共和国会计法》第四十条第一款第（四）项的规定，财政部决定给予你罚款\n10\n万元的行政处罚。\n你应在收到本处罚决定书之日起十五日内与财政部浙江监管局联系，凭财政部浙江监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款
