1.27%；虚增投资性房地产58,784,491.48元，虚增比例为891.37%；虚增使用权资产4,400,747.73元，虚增比例为34.04%；虚增递延所得税资产57,960,910.93元，虚增比例为100.00%；虚减合同负债71,217,773.18元，虚减比例为69.75%；虚减应付职工薪酬10,355,935.46元，虚减比例为54.32%；虚增租赁负债4,077,009.99元，虚增比例为30.92%。深圳文本在欧瑞博2022年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n（五）在深圳可瑞高新材料股份有限公司（以下称可瑞高新）2022年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n可瑞高新2022年虚减营业成本12,586,583.82元，虚减比例为33.37%；虚增销售费用1,705,196.11元，虚增比例为187.35%；虚增管理费用4,806,275.90元，虚增比例为320.90%；虚增研发费用1,160,171.73元，虚增比例为32.70%；虚增净利润4,526,082.51元，虚增比例为330.73%；虚减预付账款8,633,331.15元，虚减比例为72.34%；虚减存货10,580,000元，虚减比例为57.56%；虚增固定资产1,947,234.57元，虚增比例为79.53%；虚增无形资产2,246,828.51元，虚增比例为100.00%；虚减应付账款7,603,331.15元，虚减比例为52.14%；虚减其他应付款7,895,829.74元，虚减比例为75.37%；虚减长期借款6,429,928.81元，虚减比例为43.18%。深圳文本在可瑞高新2022年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n二、未实施必要的审计程序，未获取充分适当的审计证据，发表不恰当审计意见\n（一）在深圳蓝胖子机器智能有限公司（以下称蓝胖子）2021年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，发表不恰当审计意见。\n蓝胖子2021年处置子公司股权交易事项不满足投资收益确认条件，导致虚增投资收益50,632,500.00元，虚增比例为100.00%，使其2021年净利润由亏损12,535,211.58元转为盈利38,097,288.42元。深圳文本在蓝胖子2021年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，未发现其处置子公司股权交易事项不满足投资收益确认条件，发表了不恰当的审计意见。\n（二）在深圳市粤能环保科技有限公司（以下称粤能环保）2021年度财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，发表不恰当审计意见。\n粤能环保2021年财务报告列报货币资金720,843.28元，虚增货币资金700,333.53元，虚增比例为3,414.64%。深圳文本在粤能环保2021年度财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，发表了不恰当的审计意见。\n上述行为违反《中华人民共和国注册会计师法》第二十一条，《会计师事务所执业许可和监督管理办法》第六十条，《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条、第九条，《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十条、第二十六条、第二十七条、第二十九条、第三十条，《中国注册会计师审计准则第1301号——审计证据》第十条，《中国注册会计师审计准则第1312号——函证》第十一条，《中国注册会计师审计准则第1311号——对存货、诉讼和索赔、分部信息等特定项目获取审计证据的具体考虑》第四条等规定。\n上述事实，有财政检查报告、财政检查工作底稿、相关当事人签证和反馈意见等相关证据予以证实。\n你作为相关审计报告的签字注册会计师，对上述问题负有责任。依据《中华人民共和国注册会计师法》第三十九条的规定，财政部决定给予你吊销注册会计师证书的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2024年11月27日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书 （财监法〔2024〕390号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971672.htm", "date": "2024-11-27", "id": "bff598b77fee79968dad37a4e00b623f", "content": "财政部行政处罚决定书 （财监法〔2024〕390号）\n财监法〔2024〕390号\n财政部行政处罚决定书\n当 事 人：赵晓芳\n地      址：深圳市福田区\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2023年对深圳文本会计师事务所（普通合伙）（以下称深圳文本）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、在深圳市艾特自动化有限公司（以下称艾特自动化）2021年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告\n艾特自动化2021年虚增营业成本3,158,069.23元，虚增比例为16.28%；虚减销售费用2,435,194.64元，虚减比例为45.74%；虚增管理费用1,547,766.62元，虚增比例为47.96%；虚减营业外收入1,813,517.68元，虚减比例为90.77%；虚减货币资金269,488.04元，虚减比例为44.48%；虚增应收票据840,681.70元，虚增比例为18.49%；虚增应收账款2,128,215.72元，虚增比例为23.37%；虚增预付账款3,064,944.04元，虚增比例为5,527.07%；虚增其他应收款4,486,284.10元，虚增比例为606.28%；虚减应付账款2,084,055.12元，虚减比例为44.66%；虚增预收账款3,101,812.11元，虚增比例为312.74%；虚减应付职工薪酬682,500.00元，虚减比例为62.55%；虚增其他应付款6,665,000.00元，虚增比例为6,665.00%；虚增实收资本5,000,000.00元，虚增比例为5,000.00%。深圳文本在艾特自动化2021年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n二、在中成空间（深圳)智能技术有限公司（以下称中成空间）2022年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告\n中成空间2022年虚减信用减值损失13,495,618.83元，虚减比例为87.21%；虚减资产减值损失835,885.28元，虚减比例为96.23%；虚减所得税费用840,446.68元，虚减比例为126.93%；虚增净利润21,309,719.60元，虚增比例为433.83%；虚减应收票据47,468,768.08元，虚减比例为100.00%；虚减预付账款10,861,047.61元，虚减比例为87.90%；虚减合同资产14,092,001.40元，虚减比例为35.95%；虚减存货42,170,435.20元，虚减比例为61.14%；虚减应付票据47,468,768.08元，虚减比例为96.93%；虚减应付账款44,570,820.68元，虚减比例为30.17%；虚减合同负债53,493,489.37元，虚减比例为100.00%；虚减其他应付款8,252,577.30元，虚减比例为17.13%。深圳文本在中成空间2022年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n上述行为违反《中华人民共和国注册会计师法》第二十一条，《会计师事务所执业许可和监督管理办法》第六十条，《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条、第九条，《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十条、第二十六条、第二十七条、第三十条，《中国注册会计师审计准则第1301号——审计证据》第十条，《中国注册会计师审计准则第1312号——函证》第十一条等规定。\n上述事实，有财政检查报告、财政检查工作底稿、相关当事人签证和反馈意见等相关证据予以证实。\n你作为相关审计报告的签字注册会计师，对上述问题负有责任。依据《中华人民共和国注册会计师法》第三十九条的规定，财政部决定给予你吊销注册会计师证书的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2024年11月27日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2024〕389号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971671.htm", "date": "2024-11-27", "id": "280f21b6fad6164ca0beca6a9a60f36c", "content": "财政部行政处罚决定书（财监法〔2024〕389号）\n财监法〔2024〕389号\n财政部行政处罚决定书\n当 事 人：深圳文本会计师事务所（普通合伙）\n地      址：深圳市福田区福田街道福山社区滨河大道5022号联合广场A座2208-J13\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2023年对你所执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告\n（一）在深圳市景鹏建设工程有限公司（以下称景鹏建设）2022年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n景鹏建设2022年虚增营业收入665,222,853.81元，虚增比例为143.00%；虚增营业成本652,852,938.29元，虚增比例为161.96%；虚增管理费用6,779,833.36元，虚增比例为46.04%；虚减研发费用15,070,965.83元，虚减比例为100.00%；虚增所得税费用3,017,030.88元，虚增比例为93.83%；虚增净利润16,475,821.37元，虚增比例为80.46%；虚增应收账款130,015,708.83元，虚增比例为408.32%；虚减预付账款665,639,518.68元，虚减比例为95.51%；虚减其他应收款567,695,191.80元，虚减比例为88.39%；虚增存货135,403,351.90元，虚增比例为447.92%；虚增固定资产8,516,768.56元，虚增比例为519.22%；虚减应付账款296,538,653.18元，虚减比例为77.74%；虚减合同负债386,000,140.90元，虚减比例为100.00%；虚增应交税费8,726,999.47元，虚增比例为156.31%；虚减其他应付款368,411,491.10元，虚减比例为98.24%。你所在景鹏建设2022年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n（二）在深圳市艾特自动化有限公司（以下称艾特自动化）2021年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n艾特自动化2021年虚增营业成本3,158,069.23元，虚增比例为16.28%；虚减销售费用2,435,194.64元，虚减比例为45.74%；虚增管理费用1,547,766.62元，虚增比例为47.96%；虚减营业外收入1,813,517.68元，虚减比例为90.77%；虚减货币资金269,488.04元，虚减比例为44.48%；虚增应收票据840,681.70元，虚增比例为18.49%；虚增应收账款2,128,215.72元，虚增比例为23.37%；虚增预付账款3,064,944.04元，虚增比例为5,527.07%；虚增其他应收款4,486,284.10元，虚增比例为606.28%；虚减应付账款2,084,055.12元，虚减比例为44.66%；虚增预收账款3,101,812.11元，虚增比例为312.74%；虚减应付职工薪酬682,500.00元，虚减比例为62.55%；虚增其他应付款6,665,000.00元，虚增比例为6,665.00%；虚增实收资本5,000,000.00元，虚增比例为5,000.00%。你所在艾特自动化2021年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n（三）在中成空间（深圳)智能技术有限公司（以下称中成空间）2022年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n中成空间2022年虚减信用减值损失13,495,618.83元，虚减比例为87.21%；虚减资产减值损失835,885.28元，虚减比例为96.23%；虚减所得税费用840,446.68元，虚减比例为126.93%；虚增净利润21,309,719.60元，虚增比例为433.83%；虚减应收票据47,468,768.08元，虚减比例为100.00%；虚减预付账款10,861,047.61元，虚减比例为87.90%；虚减合同资产14,092,001.40元，虚减比例为35.95%；虚减存货42,170,435.20元，虚减比例为61.14%；虚减应付票据47,468,768.08元，虚减比例为96.93%；虚减应付账款44,570,820.68元，虚减比例为30.17%；虚减合同负债53,493,489.37元，虚减比例为100.00%；虚减其他应付款8,252,577.30元，虚减比例为17.13%。你所在中成空间2022年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n（四）在深圳市欧瑞博科技股份有限公司（以下称欧瑞博）2021年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n欧瑞博2021年虚增营业收入101,317,344.57元，虚增比例为18.61%；虚减所得税费用19,948,912.92元，虚减比例为100.00%；虚增净利润58,198,429.43元，虚增比例为52.68%；虚减货币资金49,471,385.62元，虚减比例为15.63%；虚减应收账款30,626,766.23元，虚减比例为30.90%；虚减预付账款10,822,370.35元，虚减比例为73.00%；虚增递延所得税资产47,210,784.67元，虚增比例为100.00%；虚减应付账款15,676,989.80元，虚减比例为16.71%；虚减合同负债78,805,708.06元，虚减比例为100.00%。你所在欧瑞博2021年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n（五）在欧瑞博2022年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n欧瑞博2022年虚增其他收益4,914,798.36元，虚增比例为29.29%；虚增投资收益2,402,409.12元，虚增比例为372.27%；虚增信用减值损失3,188,471.11元，虚增比例为100.00%；虚减资产减值损失27,548,549.56元，虚减比例为100.00%；虚减所得税费用10,750,126.26元，虚减比例为100.00%；虚增净利润126,672,740.89元，虚增比例为109.96%；虚减货币资金49,451,520.85元，虚减比例为15.35%；虚增应收账款47,896,134.28元，虚增比例为170.06%；虚增预付账款18,052,739.84元，虚增比例为293.92%；虚增其他应收款4,792,429.50元，虚增比例为41.27%；虚增投资性房地产58,784,491.48元，虚增比例为891.37%；虚增使用权资产4,400,747.73元，虚增比例为34.04%；虚增递延所得税资产57,960,910.93元，虚增比例为100.00%；虚减合同负债71,217,773.18元，虚减比例为69.75%；虚减应付职工薪酬10,355,935.46元，虚减比例为54.32%；虚增租赁负债4,077,009.99元，虚增比例为30.92%。你所在欧瑞博2022年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n（六）在深圳可瑞高新材料股份有限公司（以下称可瑞高新）2022年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n可瑞高新2022年虚减营业成本12,586,583.82元，虚减比例为33.37%；虚增销售费用1,705,196.11元，虚增比例为187.35%；虚增管理费用4,806,275.90元，虚增比例为320.90%；虚增研发费用1,160,171.73元，虚增比例为32.70%；虚增净利润4,526,082.51元，虚增比例为330.73%；虚减预付账款8,633,331.15元，虚减比例为72.34%；虚减存货10,580,000元，虚减比例为57.56%；虚增固定资产1,947,234.57元，虚增比例为79.53%；虚增无形资产2,246,828.51元，虚增比例为100.00%；虚减应付账款7,603,331.15元，虚减比例为52.14%；虚减其他应付款7,895,829.74元，虚减比例为75.37%；虚减长期借款6,429,928.81元，虚减比例为43.18%。你所在可瑞高新2022年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n二、未实施必要的审计程序，未获取充分适当的审计证据，发表不恰当审计意见\n（一）在深圳蓝胖子机器智能有限公司（以下称蓝胖子）2021年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，发表不恰当审计意见。\n蓝胖子2021年处置子公司股权交易事项不满足投资收益确认条件，导致虚增投资收益50,632,500.00元，虚增比例为100.00%，使其2021年净利润由亏损12,535,211.58元转为盈利38,097,288.42元。你所在蓝胖子2021年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，未发现其处置子公司股权交易事项不满足投资收益确认条件，发表了不恰当的审计意见。\n（二）在深圳市粤能环保科技有限公司（以下称粤能环保）2021年度财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，发表不恰当审计意见。\n粤能环保2021年财务报告列报货币资金720,843.28元，虚增货币资金700,333.53元，虚增比例为3,414.64%。你所在粤能环保2021年度财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，发表了不恰当的审计意见。\n上述行为违反《中华人民共和国注册会计师法》第二十一条、第三十一条，《会计师事务所执业许可和监督管理办法》第六十条，《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条、第十四条，《中国注册会计师职业道德守则第3号——提供专业服务的具体要求》第三条，《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十条、第二十六条、第二十七条、第二十八条、第二十九条、第三十条，《中国注册会计师审计准则第1301号——审计证据》第十条，《中国注册会计师审计准则第1312号——函证》第十二条、第十三条，《中国注册会计师审计准则第1311号——对存货、诉讼和索赔、分部信息等特定项目获取审计证据的具体考虑》第四条等规定。\n上述事实，有财政检查报告、财政检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n根据违法行为的事实、性质、情节，依据《中华人民共和国注册会计师法》第三十九条，我部决定给予你所警告、没收违法所得87,600元并处罚款438,000元、吊销执业许可的行政处罚。\n当事人应在收到本处罚决定书之日起十五日内与财政部深圳监管局联系，凭财政部深圳监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2024年11月27日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2024〕388号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971670.htm", "date": "2024-11-27", "id": "9898977c1e15fa50bdf57a14593a5d5a", "content": "财政部行政处罚决定书（财监法〔2024〕388号）\n财监法〔2024〕388号\n财政部行政处罚决定书\n当 事 人：侯玉昆\n地      址：深圳市龙岗区\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2023年对深圳市巨源立德会计师事务所（普通合伙）（以下称巨源立德）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n深圳市希格玛计算机技术有限公司（以下称希格玛）对持有的华林证券股份有限公司股权投资的账面价值以投资成本金额计量，未按公允价值进行调整，导致少计2022年末总资产2,519,852,445.30元，少计金额超过财务报表总资产金额（310,770,538.15元）的8倍。巨源立德在希格玛2022年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，未发现上述重大会计差错，发表了不恰当的审计意见。\n上述行为违反《中华人民共和国注册会计师法》第二十一条，《会计师事务所执业许可和监督管理办法》第六十条，《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条、第九条，《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十七条、第二十八条、第二十九条、第三十条，《中国注册会计师审计准则第1301号——审计证据》第十条等规定。\n上述事实，有财政检查报告、财政检查工作底稿、相关当事人签证和反馈意见等相关证据予以证实。\n你作为相关审计报告的签字注册会计师，对上述问题负有责任。依据《中华人民共和国注册会计师法》第三十九条的规定，财政部决定给予你暂停执行业务3个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2024年11月27日"}, {"source": "国家税务局", "category": "留言咨询", "title": "我跳槽到了新公司，可我个税APP里还存在老东家的任职受雇信息，我想把它删掉，如何处理？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5236049/content.html", "date": "2024-11-22", "id": "51d30da5717d50304ee50f6ca51c3c20", "content": "答：\n首先，您新入职的公司可以正常新增您的任职受雇信息，且不影响您工资薪金的正常申报。如果您想删除原扣缴单位任职受雇信息，有两种处理方式。\n第一种处理方式\n请您联系原扣缴单位，也就是您上一家工作单位的办税人员。让他通过自然人电子税务局（扣缴端或网页端）“人员信息采集”模块进行信息更新。\n扣缴端\n如使用自然人电子税务局（扣缴端），需将人员状态修改为“非正常“，并填写离职日期，进行保存和报送。\n网页端\n如使用自然人电子税务局（网页端），填写离职日期后点击报送即可。\n之后您个人所得税App中原公司的任职受雇信息将不再显示。\n第二种处理方式\n如果您联系不到原单位办税人员，可以自己通过个人所得税App发起申诉，操作步骤是这样的：打开个人所得税App，点击【我的】—【任职受雇】，点开您上一家任职受雇单位，点击右上角的【申诉】，申诉类型选择“曾经在职”，填写离职日期和补充说明后，点击【提交】，申诉状态变为已受理。\n主管税务机关会后台受理您的申诉信息，并联系您原公司展开调查，辅导办税人员及时准确填报员工离职信息。后续相关结果会通过个人所得税App主页的消息提醒反馈给您，敬请留意即可。"}, {"source": "国家税务局", "category": "留言咨询", "title": "企业的成本费用支出，当期未取得有效凭证，什么时候取得有效凭证就可以税前扣除？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5235861/content.html", "date": "2024-11-15", "id": "30c14894bd452f84210652bc585546a0", "content": "答：\n根据《国家税务总局关于企业所得税若干问题的公告》（国家税务总局公告2011年第34号）规定，企业当年度实际发生的相关成本、费用，由于各种原因未能及时取得该成本、费用的有效凭证，企业在预缴季度所得税时，可暂按账面发生金额进行核算；但在汇算清缴时，应补充提供该成本、费用的有效凭证。"}, {"source": "国家税务局", "category": "留言咨询", "title": "公司为员工租房支付的费用，可以企业所得税税前扣除吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5235723/content.html", "date": "2024-11-08", "id": "7f021f49d8c2ed8ab61af56b79910668", "content": "答：\n根据《中华人民共和国企业所得税法实施条例》(中华人民共和国国务院令第512号)的规定，“第四十条企业发生的职工福利费支出，不超过工资、薪金总额14%的部分，准予扣除。”\n《国家税务总局关于企业工资薪金及职工福利费扣除问题的通知》(国税函〔2009]3号)关于职工福利费扣除问题进一步明确:企业职工福利费，包括为职工卫生保健、生活、住房、交通等所发放的各项补贴和非货币性福利，包括企业向职工发放的因公外地就医费用、未实行医疗统筹企业职工医疗费用、职工供养直系亲属医疗补贴、供暖费补贴、职工防暑降温费、职工困难补贴、救济费、职工食堂经费补贴、职工交通补贴等。\n因此，你公司支付的员工租房费用，符合上述条件的可以在限额以内税前扣除。\n需要提醒的是，企业发生的职工福利费，应该单独设置账册，进行准确核算。没有单独设置账册准确核算的，税务机关应责令企业在规定的期限内进行改正。逾期仍未改正的，税务机关可对企业发生的职工福利费进行合理的核定。"}, {"source": "国家税务局", "category": "留言咨询", "title": "小规模纳税人纳税期限不同其享受免税政策的效果可能存在差异。那么，小规模纳税人能否自己选择按月或按季纳税？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5235598/content.html", "date": "2024-11-01", "id": "cc2b88c3366fe6132da2c4e4fa861d17", "content": "答：\n按照固定期限纳税的小规模纳税人可以根据自己的实际经营情况选择实行按月纳税或按季纳税。\n为确保年度内纳税人的纳税期限相对稳定，纳税人一经选择，一个会计年度内不能变更。这里的一个会计年度，是指会计上所说的1-12月，而不是自选择之日起顺延一年的意思。\n纳税人在每个会计年度内的任意时间均可以向主管税务机关提出选择变更其纳税期限，但纳税人一旦选择变更纳税期限后，当年12月31日前不得再次变更。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我是企业会计，想问一下什么情况下企业需要办理增值税一般纳税人资格登记？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5235450/content.html", "date": "2024-10-25", "id": "ad980e6a38dc7799cdf03a96472fdf71", "content": "答：\n根据《国家税务总局关于增值税一般纳税人登记管理办法》（国家税务总局令第43号）规定：增值税纳税人，年应税销售额超过财政部、国家税务总局规定的小规模纳税人标准的，除本办法第四条规定外，应当向主管税务机关办理一般纳税人登记。\n该办法第四条明确，按照政策规定，选择按照小规模纳税人的；以及年应税销售额超过规定标准的其他个人不办理一般纳税人登记。\n根据《财政部 税务总局关于统一增值税小规模纳税人标准的通知》（财税〔2018〕33号）规定：增值税小规模纳税人标准为年应征增值税销售额500万元及以下。\n年应税销售额，是指纳税人在连续不超过12个月或四个季度的经营期内累计应征增值税销售额，包括纳税申报销售额、稽查查补销售额、纳税评估调整销售额。\n销售服务、无形资产或者不动产有扣除项目的纳税人其应税行为年应税销售额按未扣除之前的销售额计算。纳税人偶然发生的销售无形资产转让不动产的销售额，不计入应税行为年应税销售额。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司目前属于按季纳税的小规模纳税人，随着经营规模扩大，我们在9月办理一般纳税人登记，9月1日生效。请问我公司三季度的申报应如何办理？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5235340/content.html", "date": "2024-10-18", "id": "9967579b696988bac3ddc62b7d5a78e2", "content": "答：\n你公司需要在10月份申报期内办理两项申报业务：一是办理9月税款所属期的一般纳税人申报；二是办理7-8月税款所属期的小规模纳税人申报。\n需要注意的是，对于按季申报纳税的小规模纳税人，在季度中间由小规模纳税人登记为一般纳税人的，其对应的小规模季度属期申报（即你公司7-8月所属期的申报），均统一以季度销售额30万元的标准来判断是否可以享受小规模纳税人免征增值税政策。即，如果你公司7-8月销售额未超过30万元的，仍可以享受小规模纳税人免征增值税优惠。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是一般纳税人，员工出差取得电子客票行程单，行程单中单独注明了改签费，改签费是否可以按照购进旅客运输服务计算抵扣进项税？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5235100/content.html", "date": "2024-10-11", "id": "7aeca288e33a09b18b6b9514e8bf7c0f", "content": "答：\n可以。航空运输电子客票行程单上列明的改签费和铁路车票上列明的改签费，均属于纳税人提供运输服务取得的全部价款和价外费用的范畴，可以按照《财政部 税务总局 海关总署关于深化增值税改革有关政策的公告》（财政部 税务总局 海关总署公告2019年第39号）第六条的有关规定计算抵扣进项税额。"}, {"source": "国家税务局", "category": "留言咨询", "title": "企业为全体员工支付的补充养老保险费和补充医疗保险费能否在企业所得税税前扣除？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5234524/content.html", "date": "2024-09-13", "id": "9f4ba8410f5dc2276c19f9f0404aba9f", "content": "答：\n根据《财政部 国家税务总局关于补充养老保险费 补充医疗保险费有关企业所得税政策问题的通知》（财税〔2009〕27号）的规定，自2008年1月1日起，企业根据国家有关政策规定，为在本企业任职或者受雇的全体员工支付的补充养老保险费、补充医疗保险费，分别在不超过职工工资总额5%标准内的部分，在计算应纳税所得额时准予扣除；超过的部分，不予扣除。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我购买了商业健康保险，准备填报享受税前扣除优惠，请问是否需要获得“税优识别码”?", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5234212/content.html", "date": "2024-08-30", "id": "a816be8ff07a056b5092b96a4dd0d106", "content": "答：\n需要。“税优识别码”是指为确保税收优惠商业健康保险保单的唯一性、真实性和有效性，由商业健康保险信息平台按照“一人一单一码”的原则对投保人进行校验后，下发给保险公司，并在保单凭证上打印的数字识别码。\n根据《国家税务总局关于推广实施商业健康保险个人所得税政策有关征管问题的公告》（国家税务总局公告2017年第17号）第五条以及第六条的规定：保险公司销售符合规定的商业健康保险产品，及时为购买保险的个人开具发票和保单凭证，并在保单凭证上注明“税优识别码”。\n个人购买商业健康保险未获得“税优识别码”的，其支出金额不得税前扣除。"}, {"source": "国家税务局", "category": "留言咨询", "title": "在个税APP修改专项附加扣除的实际操作中我发现，修改子女的教育信息，有时在原来信息基础上修改就可以，有时需要新增一条，这是什么原因呢?", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5233975/content.html", "date": "2024-08-23", "id": "0bd8b98700c19525f92937f5ca34a81a", "content": "答：\n纳税人的子女接受全日制学历教育的相关支出，按照每个子女每月2000元的标准定额扣除。学历教育包括义务教育（小学、初中教育），高中阶段教育（普通高中、中等职业、技工教育）、高等教育（大学专科、大学本科、硕士研究生、博士研究生教育），年满3岁至小学入学前处于学前教育阶段的子女，也按学历教育规定执行。\n子女教育阶段有变化的，纳税人应及时修改相关教育信息。需要在原来信息基础上修改的主要有：子女由小学升初中或转学换校等情况。此时，不需要新增信息，只需要在原有子女教育专项附加扣除记录中进行修改即可。需要新增一条信息的情况主要有：子女由幼儿园升入小学、初中升入高中、高中升入大学专科/本科、后续升入硕士研究生/博士研究生等情况，此时，不可以直接修改原有的子女教育专项附加扣除信息，需要新增一条教育阶段信息。例如，您孩子今年幼儿园升小学，如果您直接将2024年1-8月的“幼儿园”修改为“小学”，这会导致1-8月的数据被覆盖，无法享受对应阶段的专项附加扣除，正确做法是新增一条，填写小学教育信息，选择“扣除比例”和“申报方式”后点击提交。"}, {"source": "国家税务局", "category": "留言咨询", "title": "境外旅客离境时，应如何办理离境退税？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5233268/content.html", "date": "2024-07-31", "id": "76f914203847c1a1c4f30247842f5e6d", "content": "答：\n根据国家税务总局公告2015年第41号第二条、第八条、第十八条、第十九条和第二十二条，在我国境内连续居住不超过183天的外国人和港澳台同胞，境外旅客本人在退税商店购买且符合退税条件的个人物品，需要离境退税的，应当：\n1.境外旅客在退税商店购买退税物品，需要离境退税的，应当在离境前凭本人的有效身份证件及购买退税物品的增值税普通发票（由增值税发票系统升级版开具），向退税商店索取《离境退税申请单》。\n2.境外旅客离境时，应向海关办理退税物品验核确认手续。\n3.境外旅客向退税代理机构申请办理离境退税时，须提交以下资料：\n（1）本人有效身份证件；\n（2）经海关验核签章的《离境退税申请单》。\n4.境外旅客领取或者办理领取退税款时，应当签字确认《境外旅客购物离境退税收款回执单》。"}, {"source": "国家税务局", "category": "留言咨询", "title": "资源回收企业应如何做好企业所得税税前扣除凭证管理？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5232376/content.html", "date": "2024-06-12", "id": "266c72c0f42314a90a6008bee319bb0b", "content": "答：\n“反向开票”措施为资源回收企业取得合规的企业所得税税前扣除凭证提供了便利，可以在很大程度上解决困扰资源回收企业所得税成本无票列支问题，助力企业进一步规范会计核算，降低涉税风险。同时，对于包括通过“反向开票”方式开具的发票在内的各类企业所得税税前扣除凭证，资源回收企业均应严格按照税收法律、行政法规、规章和规范性文件相关规定执行。企业取得的税前扣除凭证不符合相关规定的，相应的支出将不能在发生年度税前扣除。不符合规定进行税前扣除的，税务机关将依法调整其应纳税所得额，追缴税款，并严格按照《中华人民共和国税收征收管理法》《中华人民共和国发票管理办法》等有关规定处理。"}, {"source": "国家税务局", "category": "留言咨询", "title": "通过“反向开票”方式开具的发票是否可以作为企业所得税税前扣除凭证？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5232248/content.html", "date": "2024-06-05", "id": "44fc9703a3efa1877470e1d75e4cfdf1", "content": "зӯ”пјҡ\nж №жҚ®гҖҠдёӯеҚҺдәәж°‘е…ұе’ҢеӣҪдјҒдёҡжүҖеҫ—зЁҺжі•гҖӢеҸҠе…¶е®һж–ҪжқЎдҫӢгҖҒгҖҠдёӯеҚҺдәәж°‘е…ұе’ҢеӣҪзЁҺж”¶еҫҒж”¶з®ЎзҗҶжі•гҖӢеҸҠе…¶е®һж–Ҫз»ҶеҲҷгҖҒгҖҠдёӯеҚҺдәәж°‘е…ұе’ҢеӣҪеҸ‘зҘЁз®ЎзҗҶеҠһжі•гҖӢеҸҠе…¶е®һж–Ҫз»ҶеҲҷгҖҒгҖҠеӣҪе®¶зЁҺеҠЎжҖ»еұҖе…ідәҺеҸ‘еёғ<дјҒдёҡжүҖеҫ—зЁҺзЁҺеүҚжүЈйҷӨеҮӯиҜҒз®ЎзҗҶеҠһжі•>зҡ„е…¬е‘ҠгҖӢпјҲ2018е№ҙз¬¬28еҸ·пјүзӯүзЁҺж”¶жі•еҫӢгҖҒиЎҢж”ҝжі•и§„гҖҒи§„з« е’Ңи§„иҢғжҖ§ж–Үд»¶и§„е®ҡпјҢдјҒдёҡеҸ‘з”ҹж”ҜеҮәпјҢеә”еҸ–еҫ—зЁҺеүҚжүЈйҷӨеҮӯиҜҒпјҢдҪңдёәи®Ўз®—дјҒдёҡжүҖеҫ—зЁҺеә”зәізЁҺжүҖеҫ—йўқж—¶жүЈйҷӨзӣёе…іж”ҜеҮәзҡ„дҫқжҚ®гҖӮиө„жәҗеӣһж”¶дјҒдёҡйҖҡиҝҮвҖңеҸҚеҗ‘ејҖзҘЁвҖқж–№ејҸејҖе…·зҡ„еҸ‘зҘЁпјҢз¬ҰеҗҲдёҠиҝ°зЁҺж”¶жі•еҫӢгҖҒиЎҢж”ҝжі•и§„гҖҒи§„з« е’Ңи§„иҢғжҖ§ж–Үд»¶зӣёе…іи§„е®ҡзҡ„пјҢеҸҜд»ҘдҪңдёәжң¬дјҒдёҡжүҖеҫ—зЁҺзЁҺеүҚжүЈйҷӨеҮӯиҜҒгҖӮ"}, {"source": "国家税务局", "category": "留言咨询", "title": "实行“反向开票”的资源回收企业应如何进行代办申报事项、缴纳代办税费？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5231597/content.html", "date": "2024-05-28", "id": "1723dd33399cbdfa640820b3425207c6", "content": "答：\n实行“反向开票”的资源回收企业，应按照规定在“反向开票”的次月申报期内，向企业所在地主管税务机关报送《代办税费报告表》和《代办税费明细报告表》，缴纳代办的增值税及附加税费、个人所得税。"}, {"source": "国家税务局", "category": "留言咨询", "title": "资源回收企业“反向开票”后，需要开具红字发票的如何处理？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5228242/content.html", "date": "2024-05-23", "id": "84fa1f0658d44596d3bc3e934f693c7e", "content": "答：\n资源回收企业“反向开票”后，发生销售退回、开票有误、销售折让等情形，需要通过增值税发票管理系统开具红字增值税专用发票的，由资源回收企业填开《开具红字增值税专用发票信息表》；需要通过电子发票服务平台开具红字增值税专用发票或普通发票的，由资源回收企业填开《红字发票信息确认单》。资源回收企业填开《开具红字增值税专用发票信息表》或《红字发票信息确认单》时，应当填写对应的蓝字发票信息，红字发票需与原蓝字发票一一对应。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是一家江苏退税商店，这个月有一名外籍人士在我处购买商品，护照上显示他已在我国境内连续居住超一年，请问能给其开具《离境退税申请单》吗?", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5221975/content.html", "date": "2024-03-25", "id": "c246bda48457e2ed136e9de5668f6b5a", "content": "答：\n不可以。按照现行规定，在我国境内连续居住不超过183天的外国人和港澳台同胞适用境外旅客购物离境退税政策。该旅客在我国境内连续居住超过183天，贵公司不得为其开具《离境退税申请单》。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是一家外贸企业，三个月前出口的一批货物已经办理退税，现在因质量问题退回来了，应该如何处理?", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5221825/content.html", "date": "2024-03-18", "id": "f90751950d1a021f5317863b0fca60d4", "content": "答：\n根据现行规定，贵公司出口货物发生退运，应向主管税务机关申请开具《出口货物已补税/未退税证明》，已办理出口退（免）税的，需要补缴已退税款，随后贵公司可凭该证明向海关申请办理退运手续。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司于2023年12月向巴西出口了一批工程机械产品，出口合同中约定的收汇日期为2024年6月30日，请问现在可以申报出口退（免）税吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5221768/content.html", "date": "2024-03-15", "id": "3dc0c9e028f9a5d1446e0a70c42aa115", "content": "答：\n可以。贵公司出口合同约定全部收汇最终日期（2024年6月30日）在申报出口退（免）税截止期限（2023年出口货物的申报退（免）税截止期限为2024年4月增值税纳税申报期）之后的，按照规定留存《出口货物收汇情况表》及相关出口合同等举证资料，即可视同收汇，正常申报办理出口退（免）税。需要注意的是，此类情况应当在合同约定全部收汇最终日期前完成收汇。"}, {"source": "国家税务局", "category": "留言咨询", "title": "请问出口退（免）税备案单证保存期是多久?", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5221702/content.html", "date": "2024-03-12", "id": "ef9d9d1723c6274b56d76c89a5de69ac", "content": "答：\n除另有规定外，出口退（免）税备案单证由出口企业存放和保管，不得擅自损毁，保存期为5年。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是一家出口服装的企业，2023年通过广交会成交一笔订单，但与外商签署的是电子购销合同，请问这样符合备案单证规定吗?", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5221512/content.html", "date": "2024-03-01", "id": "f415f9636f1b708f0c3f666204cd4b47", "content": "答：\n符合。电子购销合同是合同的一种形式。按照规定，贵公司可根据自身实际，自行选择纸质化、影像化或者数字化方式，留存保管出口退（免）税备案单证。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是一家生产企业，现在发现2023年3月办理核销的进料加工手册中填报的进出口数据有误，能重新办理核销吗?", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5221456/content.html", "date": "2024-02-28", "id": "49a11c752aa630b2e1ed9691d1016caf", "content": "答：\n可以。贵公司发现进料加工手册核销数据有误的，应在发现次月按照有关规定向主管税务机关重新办理核销手续。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是一家出口企业，现因经营不善需要注销税务登记，请问是否需要办理出口退（免）税备案撤回?", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5221431/content.html", "date": "2024-02-27", "id": "52647ae5a965f5baa7fe6e2585a0857c", "content": "答：\n需要。出口企业或其他单位申请注销税务登记的，应先向主管税务机关申请撤回出口退（免）税备案。出口企业或其他单位撤回出口退（免）税备案的，主管税务机关应按规定结清退（免）税款后办理。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是一家出口企业，2023年12月已办理出口退（免）税备案，但在2023年6月已出口了一批货物，请问该笔货物能否申报退（免）税？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5221372/content.html", "date": "2024-02-23", "id": "93a1b706b84ba9e550c36032be295206", "content": "答：\n可以。贵公司在出口退（免）税备案之前发生的出口货物劳务，在办理出口退（免）税备案后，可以在规定的退（免）税申报期内按规定申报增值税退（免）税或免税，以及消费税退（免）税或免税。"}, {"source": "国家税务局", "category": "留言咨询", "title": "什么是非居民企业？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5221098/content.html", "date": "2024-02-01", "id": "f0d24be5310af213c8f4ecd70feb238c", "content": "答：\n非居民企业，是指依照外国（地区）法律成立且实际管理机构不在中国境内，但在中国境内设立机构、场所的，或者在中国境内未设立机构、场所，但有来源于中国境内所得的企业。实际管理机构，是指对企业的生产经营、人员、账务、财产等实施实质性全面管理和控制的机构。机构、场所，是指在中国境内从事生产经营活动的机构、场所，包括：\n（一）管理机构、营业机构、办事机构；\n（二）工厂、农场、开采自然资源的场所；\n（三）提供劳务的场所；\n（四）从事建筑、安装、装配、修理、勘探等工程作业的场所；\n（五）其他从事生产经营活动的机构、场所。\n非居民企业委托营业代理人在中国境内从事生产经营活动的，包括委托单位或者个人经常代其签订合同，或者储存、交付货物等，该营业代理人视为非居民企业在中国境内设立的机构、场所。"}, {"source": "国家税务局", "category": "留言咨询", "title": "小规模纳税人可以办理出口退税吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5221096/content.html", "date": "2024-01-25", "id": "75f2ceed564d3970ed7c67404618bc23", "content": "答：\n增值税小规模纳税人出口的货物适用增值税免税政策。"}, {"source": "国家税务局", "category": "留言咨询", "title": "如果我司需要向境外支付资金，哪些情形需要办理对外支付税务备案呢？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5220664/content.html", "date": "2024-01-18", "id": "81fc714734ca8bc3e711eb8c462ccbc7", "content": "答：\n根据《国家税务总局 国家外汇管理局关于服务贸易等项目对外支付税务备案有关问题的公告》（国家税务总局 国家外汇管理局公告2013年第40号）境内机构和个人向境外单笔支付等值5万美元以上（不含等值5万美元，下同）下列外汇资金，除本公告第三条规定的情形外，均应向所在地主管税务机关进行备案：\n（一）境外机构或个人从境内获得的包括运输、旅游、通信、建筑安装及劳务承包、保险服务、金融服务、计算机和信息服务、专有权利使用和特许、体育文化和娱乐服务、其他商业服务、政府服务等服务贸易收入；\n（二）境外个人在境内的工作报酬，境外机构或个人从境内获得的股息、红利、利润、直接债务利息、担保费以及非资本转移的捐赠、赔偿、税收、偶然性所得等收益和经常转移收入；\n（三）境外机构或个人从境内获得的融资租赁租金、不动产的转让收入、股权转让所得以及外国投资者其他合法所得。"}, {"source": "国家税务局", "category": "留言咨询", "title": "非居民纳税人享受税收协定待遇应如何申请？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5220459/content.html", "date": "2024-01-12", "id": "846c774f86d718800b50f3849dbac0ff", "content": "答：\n非居民纳税人享受协定待遇，采取“自行判断、申报享受、相关资料留存备查”的方式办理。非居民纳税人自行判断符合享受协定待遇条件的，可在纳税申报时，或通过扣缴义务人在扣缴申报时，自行享受协定待遇，同时按照规定归集和留存相关资料备查，并接受税务机关后续管理。\n非居民纳税人自行申报的，自行判断符合享受协定待遇条件且需要享受协定待遇，应在申报时报送《非居民纳税人享受协定待遇信息报告表》，并按照规定归集和留存相关资料备查。\n在源泉扣缴和指定扣缴情况下，非居民纳税人自行判断符合享受协定待遇条件且需要享受协定待遇的，应当如实填写《非居民纳税人享受协定待遇信息报告表》，主动提交给扣缴义务人，并按照规定归集和留存相关资料备查。\n扣缴义务人收到《非居民纳税人享受协定待遇信息报告表》后，确认非居民纳税人填报信息完整的，依国内税收法律规定和协定规定扣缴，并如实将《非居民纳税人享受协定待遇信息报告表》作为扣缴申报的附表报送主管税务机关。\n非居民纳税人未主动提交《非居民纳税人享受协定待遇信息报告表》给扣缴义务人或填报信息不完整的，扣缴义务人依国内税收法律规定扣缴。"}, {"source": "国家税务局", "category": "留言咨询", "title": "先进制造业企业出口货物劳务、发生跨境应税行为可否适用加计抵减政策？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5220125/content.html", "date": "2024-01-05", "id": "9b01c3f4892bc2e7411dcd43122f33a2", "content": "зӯ”пјҡ\nж №жҚ®гҖҠиҙўж”ҝйғЁ зЁҺеҠЎжҖ»еұҖе…ідәҺе…ҲиҝӣеҲ¶йҖ дёҡдјҒдёҡеўһеҖјзЁҺеҠ и®ЎжҠөеҮҸж”ҝзӯ–зҡ„е…¬е‘ҠгҖӢпјҲиҙўж”ҝйғЁ зЁҺеҠЎжҖ»еұҖе…¬е‘Ҡ2023е№ҙз¬¬43еҸ·пјүпјҡвҖңдә”гҖҒе…ҲиҝӣеҲ¶йҖ дёҡдјҒдёҡеҮәеҸЈиҙ§зү©еҠіеҠЎгҖҒеҸ‘з”ҹи·Ёеўғеә”зЁҺиЎҢдёәдёҚйҖӮз”ЁеҠ и®ЎжҠөеҮҸж”ҝзӯ–пјҢе…¶еҜ№еә”зҡ„иҝӣйЎ№зЁҺйўқдёҚеҫ—и®ЎжҸҗеҠ и®ЎжҠөеҮҸйўқгҖӮ\nе…ҲиҝӣеҲ¶йҖ дёҡдјҒдёҡе…јиҗҘеҮәеҸЈиҙ§зү©еҠіеҠЎгҖҒеҸ‘з”ҹи·Ёеўғеә”зЁҺиЎҢдёәдё”ж— жі•еҲ’еҲҶдёҚеҫ—и®ЎжҸҗеҠ и®ЎжҠөеҮҸйўқзҡ„иҝӣйЎ№зЁҺйўқпјҢжҢүз…§д»ҘдёӢе…¬ејҸи®Ўз®—пјҡ\nдёҚеҫ—и®ЎжҸҗеҠ и®ЎжҠөеҮҸйўқзҡ„иҝӣйЎ№зЁҺйўқ=еҪ“жңҹж— жі•еҲ’еҲҶзҡ„е…ЁйғЁиҝӣйЎ№зЁҺйўқГ—еҪ“жңҹеҮәеҸЈиҙ§зү©еҠіеҠЎе’ҢеҸ‘з”ҹи·Ёеўғеә”зЁҺиЎҢдёәзҡ„й”Җе”®йўқГ·еҪ“жңҹе…ЁйғЁй”Җе”®йўқгҖӮвҖқ"}, {"source": "国家税务局", "category": "留言咨询", "title": "集成电路企业出口货物劳务、发生跨境应税行为，是否可以享受增值税进项税额加计抵减政策？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5219885/content.html", "date": "2023-12-27", "id": "67dfc2d6424aff3693f5b1885903c53d", "content": "答：\n根据《财政部 税务总局关于集成电路企业增值税加计抵减政策的通知》（财政部 税务总局公告2023年第17号）第五条规定，集成电路企业出口货物劳务、发生跨境应税行为不适用加计抵减政策，其对应的进项税额不得计提加计抵减额。\n集成电路企业兼营出口货物劳务、发生跨境应税行为且无法划分不得计提加计抵减额的进项税额，按照以下公式计算：\n不得计提加计抵减额的进项税额=当期无法划分的全部进项税额×当期出口货物劳务和发生跨境应税行为的销售额÷当期全部销售额"}, {"source": "国家税务局", "category": "留言咨询", "title": "按照现行规定不得从销项税额中抵扣的进项税额，是否可以计提加计抵减额？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5219631/content.html", "date": "2023-12-21", "id": "84ec2e08a2d33270510c7a72fbf51a8c", "content": "答：\n不可以。只有当期可抵扣进项税额才能计提加计抵减额。"}, {"source": "国家税务局", "category": "留言咨询", "title": "企业A已经开始享受先进制造业加计抵减政策，后期又被工信部门列入工业母机企业清单，是否可以选择停止享受先进制造业加计抵减政策，而申请享受工业母机加计抵减政策？工业母机加计抵减政策加计15%，如企业A前期已按先进制造业的5%计提加计抵减额，能否对差额部分进行补充计提？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5219630/content.html", "date": "2023-12-13", "id": "8d162073b42efa96d9b8cdb06da5d965", "content": "答：\n纳税人同时符合三项加计抵减政策的，可以择优选择适用，但在同一期间不得叠加适用。企业A先适用先进制造业加计抵减政策，后期可选择停止享受该政策，改为选择工业母机加计抵减政策，前期未计提的差额部分可以一次性补充计提。"}, {"source": "国家税务局", "category": "留言咨询", "title": "纳税人享受集成电路、工业母机、先进制造业企业增值税加计抵减政策，是否要向税务部门提交声明？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5218264/content.html", "date": "2023-12-08", "id": "b68e32b8f88aadba92d7bd3d2b414dda", "content": "答：\n《国家税务总局关于增值税小规模纳税人减免增值税等政策有关征管事项的公告》（2023年第1号）规定，符合规定的生产、生活性服务业纳税人，应在年度首次确认适用加计抵减政策时，通过电子税务局或办税服务厅提交《适用加计抵减政策的声明》。\n不同于生产、生活性服务业增值税加计抵减政策，三项加计抵减政策均采取清单管理，清单由工信部门牵头制定。清单内的纳税人进行纳税申报时，系统会弹出相关提示，引导纳税人申报享受对应的加计抵减政策，纳税人无需再提交相关声明。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司“六税两费”的申报逾期了，是否还可以享受“六税两费”减免优惠？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5217322/content.html", "date": "2023-12-01", "id": "7ac740378924c28876da707c16a2c4ca", "content": "зӯ”пјҡ\nеўһеҖјзЁҺе°Ҹи§„жЁЎзәізЁҺдәәйҖҫжңҹз”іжҠҘзҡ„вҖңе…ӯзЁҺдёӨиҙ№вҖқзЁҺиҙ№ж¬ҫзҡ„еұһжңҹеңЁ2019е№ҙ1жңҲ1ж—ҘиҮі2027е№ҙ12жңҲ31ж—ҘеҶ…пјҢеҸҜз”іжҠҘдә«еҸ—вҖңе…ӯзЁҺдёӨиҙ№вҖқеҮҸе…Қдјҳжғ пјӣзҷ»и®°дёәдёҖиҲ¬зәізЁҺдәәзҡ„дёӘдҪ“е·Ҙе•ҶжҲ·йҖҫжңҹз”іжҠҘзҡ„вҖңе…ӯзЁҺдёӨиҙ№вҖқзЁҺиҙ№ж¬ҫзҡ„еұһжңҹеңЁ2022е№ҙ1жңҲ1ж—ҘиҮі2027е№ҙ12жңҲ31ж—ҘеҶ…пјҢеҸҜз”іжҠҘдә«еҸ—еҮҸе…Қдјҳжғ пјӣзҷ»и®°дёәдёҖиҲ¬зәізЁҺдәәзҡ„е°ҸеһӢеҫ®еҲ©дјҒдёҡе’Ңж–°и®ҫз«ӢдјҒдёҡйҖҫжңҹз”іжҠҘзҡ„вҖңе…ӯзЁҺдёӨиҙ№вҖқзЁҺиҙ№ж¬ҫзҡ„еұһжңҹеңЁ2022е№ҙ1жңҲ1ж—ҘиҮі2027е№ҙ12жңҲ31ж—ҘеҶ…зҡ„пјҢз¬ҰеҗҲж–Үд»¶и§„е®ҡжғ…еҪўзҡ„пјҢд№ҹеҸҜз”іжҠҘдә«еҸ—еҮҸе…Қдјҳжғ гҖӮ"}, {"source": "国家税务局", "category": "留言咨询", "title": "外出报验的纳税人、跨区税源登记的纳税人能否享受“六税两费”减免政策？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5217014/content.html", "date": "2023-11-24", "id": "c7ca9d143314ba9d5b22e986ae0bc5fa", "content": "答：\n包括外出报验、跨区税源登记的纳税人在内的各类纳税人，均应当根据其税务登记信息、增值税一般纳税人登记信息和企业所得税汇算清缴信息，综合判断是否属于增值税小规模纳税人、个体工商户或小型微利企业，符合条件的可以享受“六税两费”减免政策。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是2023年的新设立企业，尚未办理过汇算清缴，能否申报享受“六税两费”减免优惠？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5216454/content.html", "date": "2023-11-16", "id": "6022f5ffb0cdc109a37fe1eb054cebd4", "content": "答：\n登记为增值税一般纳税人的新设立企业，从事国家非限制和禁止行业，且同时符合申报期上月末从业人数不超过300人、资产总额不超过5000万元两项条件的，在办理首次汇算清缴前，可按照小型微利企业申报享受“六税两费”减免优惠。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是按月申报的增值税小规模纳税人，2023年9月份预计销售货物取得收入20万元，请问能够享受什么减免税政策，又该如何开具增值税发票呢？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5216248/content.html", "date": "2023-11-10", "id": "23dbedcb55240890ee8135d5d487c650", "content": "答：\n《财政部 税务总局关于增值税小规模纳税人减免增值税政策的公告》（2023年第19号）第二条规定，增值税小规模纳税人适用3%征收率的应税销售收入，减按1%征收率征收增值税。\n《国家税务总局关于增值税小规模纳税人减免增值税等政策有关征管事项的公告》（2023年第1号）第五条规定，小规模纳税人取得应税销售收入，适用减按1%征收率征收增值税政策的，应按照1%征收率开具增值税发票。\n因此，您9月份销售货物取得的收入20万元，可以适用减按1%征收率征收增值税的政策，并按照1%征收率开具增值税专用发票或增值税普通发票。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司如何判断是否可以按照小型微利企业申报享受“六税两费”减免优惠？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5215937/content.html", "date": "2023-11-03", "id": "7966b7b7ec026a64564111fce682dcaf", "content": "зӯ”пјҡ\nе°ҸеһӢеҫ®еҲ©дјҒдёҡзҡ„еҲӨе®ҡд»ҘдјҒдёҡжүҖеҫ—зЁҺе№ҙеәҰжұҮз®—жё…зјҙз»“жһңдёәеҮҶгҖӮзҷ»и®°дёәеўһеҖјзЁҺдёҖиҲ¬зәізЁҺдәәзҡ„ж–°и®ҫз«ӢдјҒдёҡпјҢд»ҺдәӢеӣҪе®¶йқһйҷҗеҲ¶е’ҢзҰҒжӯўиЎҢдёҡпјҢдё”еҗҢж—¶з¬ҰеҗҲз”іжҠҘжңҹдёҠжңҲжң«д»Һдёҡдәәж•°дёҚи¶…иҝҮ300дәәгҖҒиө„дә§жҖ»йўқдёҚи¶…иҝҮ5000дёҮе…ғдёӨйЎ№жқЎд»¶зҡ„пјҢеҸҜеңЁеҠһзҗҶйҰ–ж¬ЎжұҮз®—жё…зјҙеүҚжҢүз…§е°ҸеһӢеҫ®еҲ©дјҒдёҡз”іжҠҘдә«еҸ—вҖңе…ӯзЁҺдёӨиҙ№вҖқеҮҸе…Қдјҳжғ пјӣеҜ№дәҺж–°и®ҫз«ӢеҪ“жңҲеҚіжҢүж¬Ўз”іжҠҘзҡ„пјҢеҲҷж №жҚ®и®ҫз«Ӣж—¶жҳҜеҗҰеҗҢж—¶з¬ҰеҗҲд»Һдёҡдәәж•°дёҚи¶…иҝҮ300дәәгҖҒиө„дә§жҖ»йўқдёҚи¶…иҝҮ5000дёҮе…ғдёӨйЎ№жқЎд»¶жқҘеҲӨж–ӯжҳҜеҗҰеҸҜд»ҘжҢүз…§е°ҸеһӢеҫ®еҲ©дјҒдёҡз”іжҠҘдә«еҸ—вҖңе…ӯзЁҺдёӨиҙ№вҖқеҮҸе…Қдјҳжғ гҖӮ"}, {"source": "国家税务局", "category": "留言咨询", "title": "我是个体工商户，属于按季申报的增值税小规模纳税人。2023年8月5日，自行开具了1张征收率为3%的增值税专用发票，提供给下游客户用于抵扣进项税额，尚未申报纳税。请问对于这笔销售收入，如果我要享受减按1%征收增值税政策，是否必须追回已开具的征收率为3%的专用发票？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5215730/content.html", "date": "2023-10-27", "id": "dace8440a1870f57463d6e605751e571", "content": "答：\n《财政部 税务总局关于增值税小规模纳税人减免增值税政策的公告》（2023年第19号）第二条规定，增值税小规模纳税人适用3%征收率的应税销售收入，减按1%征收率征收增值税。\n您取得适用3%征收率的应税销售收入，可以享受减按1%征收率征收增值税政策。但增值税专用发票具有抵扣功能，您已向购买方开具3%征收率的增值税专用发票，应在增值税专用发票全部联次追回予以作废或者按规定开具红字专用发票后，方可就此笔业务适用减征增值税政策。否则，需要就已开具增值税专用发票的应税销售收入按3%征收率申报缴纳增值税。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是分支机构，登记为一般纳税人，是否可以申报享受“六税两费”减免优惠？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5215463/content.html", "date": "2023-10-18", "id": "522a76cd0f7fe9c3a5efbdb93604d203", "content": "答：\n企业所得税实行法人税制，由总机构统一计算包括汇总纳税企业所属各个不具有法人资格分支机构在内的全部应纳税所得额、应纳税额，以法人机构为整体判断是否属于小型微利企业。企业所属各个不具有法人资格的分支机构，登记为增值税一般纳税人的，应当根据总机构是否属于小型微利企业来判别能否申报享受“六税两费”减免优惠。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是零售摩托车的增值税小规模纳税人，2023年8月销售额20万元，均为客户开具了3%征收率的机动车销售统一发票，请问我还能享受3%征收率销售收入减按1%征收增值税政策吗？我的个别客户为增值税一般纳税人，是否能够抵扣进项税额？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5215098/content.html", "date": "2023-10-11", "id": "6bdb59e5f7c68d5429752bc990370a68", "content": "答：\n《财政部 税务总局关于增值税小规模纳税人减免增值税政策的公告》（2023年第19号）第二条规定，增值税小规模纳税人适用3%征收率的应税销售收入，减按1%征收率征收增值税。\n根据上述规定，您可以享受3%征收率销售收入减按1%征收增值税政策。但由于您开具的3%征收率的机动车销售统一发票，具有抵扣功能，您的客户如为一般纳税人，可以凭您开具的3%征收率的机动车销售统一发票，抵扣对应的进项税额。因此，您需要追回已开具的3%征收率的机动车销售统一发票，重新开具1%征收率的机动车销售统一发票，方能享受减税政策。如无法追回，则需要按照3%征收率计算缴纳增值税。今后您要享受3%征收率销售收入减按1%征收增值税政策时，如需开具机动车销售统一发票，注意应按照1%征收率开具。"}, {"source": "国家税务局", "category": "留言咨询", "title": "“一老一小”扣除提高后的标准是多少？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5214546/content.html", "date": "2023-09-28", "id": "bd03031a918dab16162eb41e39b629ce", "content": "зӯ”пјҡ\nиҮӘ2023е№ҙ1жңҲ1ж—Ҙиө·пјҢжҸҗй«ҳ3еІҒд»ҘдёӢе©ҙе№је„ҝз…§жҠӨгҖҒеӯҗеҘіж•ҷиӮІе’ҢиөЎе…»иҖҒдәә3йЎ№дё“йЎ№йҷ„еҠ жүЈйҷӨж ҮеҮҶгҖӮе…¶дёӯпјҢ3еІҒд»ҘдёӢе©ҙе№је„ҝз…§жҠӨгҖҒеӯҗеҘіж•ҷиӮІдё“йЎ№йҷ„еҠ жүЈйҷӨж ҮеҮҶз”ұзҺ°иЎҢжҜҸеӯ©жҜҸжңҲ1000е…ғжҸҗй«ҳеҲ°2000е…ғпјҢд№ҹе°ұжҳҜиҜҙпјҢжҜҸдёӘеӯ©еӯҗд»ҺеҮәз”ҹеҲ°е®ҢжҲҗеӯҰеҺҶж•ҷиӮІпјҢе…¶зҲ¶жҜҚжҜҸдёӘжңҲеҸҜд»ҘеңЁзЁҺеүҚжүЈйҷӨ2000е…ғпјҢжҜҸе№ҙ2.4дёҮе…ғпјҢиҝҷдәӣжүЈйҷӨеҸҜд»Ҙз”ұзҲ¶жҜҚеҸҢж–№еҲҶеҲ«дә«еҸ—пјҢд№ҹеҸҜд»Ҙз”ұе…¶дёӯдёҖж–№дә«еҸ—пјӣиөЎе…»иҖҒдәәдё“йЎ№йҷ„еҠ жүЈйҷӨж ҮеҮҶз”ұжҜҸжңҲ2000е…ғжҸҗй«ҳеҲ°3000е…ғпјҢзӢ¬з”ҹеӯҗеҘіжҢүз…§жҜҸжңҲ3000е…ғзҡ„ж ҮеҮҶе®ҡйўқжүЈйҷӨпјҢйқһзӢ¬з”ҹеӯҗеҘідёҺе…„ејҹе§җеҰ№еҲҶж‘ҠжҜҸжңҲ3000е…ғзҡ„жүЈйҷӨйўқеәҰпјҢжҜҸдәәеҲҶж‘Ҡзҡ„йўқеәҰдёҚи¶…иҝҮжҜҸжңҲ1500е…ғгҖӮ"}, {"source": "国家税务局", "category": "留言咨询", "title": "从事涉税专业服务有哪些基本执业要求？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5212398/content.html", "date": "2023-09-19", "id": "2acd54db6a6ea713ffd861eee322f6d9", "content": "答：\n涉税专业服务机构及其涉税服务人员应当拥护中国共产党领导，坚持正确政治方向，诚实守信、正直自律、勤勉尽责，秉持专业精神和职业操守执行业务。从事涉税专业服务应当遵照法律、行政法规、部门规章及规范性文件，接受税务机关行政监管和相关行业协会自律监管。\n涉税专业服务机构应当按照规定向税务机关报送机构基本信息及其涉税服务人员的身份信息和执业资质信息，并以真实身份开展涉税专业服务。"}, {"source": "国家税务局", "category": "留言咨询", "title": "今年以来，纳税人已经填报享受“一老一小”扣除的，如何按照提高后的标准享受扣除？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5212117/content.html", "date": "2023-09-13", "id": "18f171485f816e11e27a5e5cbf202e6b", "content": "答：\n今年以来，纳税人已经按照原标准填报享受2023年度3岁以下婴幼儿照护、子女教育、赡养老人专项附加扣除的，自9月份起，信息系统将自动按照提高后的专项附加扣除标准计算应缴纳的个人所得税，此前多缴的税款可以自动抵减本年度后续月份应纳税款，抵减不完的，可以在办理2023年度综合所得汇算清缴时继续享受。"}, {"source": "国家税务局", "category": "留言咨询", "title": "个体工商户享受减半征收个人所得税政策是否需要办理备案？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5211719/content.html", "date": "2023-09-08", "id": "cdb2f2e0ec38896a2222abc9ca0fe1e9", "content": "答：\n个体工商户在预缴和汇算清缴个人所得税时均可享受减半征税政策，享受政策时无需进行备案，通过填写个人所得税纳税申报表和减免税事项报告表相关栏次，即可享受。"}, {"source": "国家税务局", "category": "留言咨询", "title": "个体工商户今年已就经营所得预缴税款的，还能享受优惠政策吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5211423/content.html", "date": "2023-09-01", "id": "e4b2aca50204c0887fb6cfa33d627ece", "content": "答：\n为最大程度释放减税红利，个体工商户今年前几个月已就经营所得预缴税款的，也能享受税收优惠。具体办法是，按12号公告应减征的税款，在《公告》发布前已缴纳的，可申请退税；也可自动抵减以后月份的税款，当年抵减不完的在汇算清缴时办理退税；12号公告发布之日前已办理注销的，不再追溯享受。"}, {"source": "国家税务局", "category": "留言咨询", "title": "“换电模式”新能源汽车如何确定车辆购置税计税价格？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5211176/content.html", "date": "2023-08-25", "id": "65cd6c15c6895bf6b58148c3832b66ae", "content": "答：\n为配合新能源汽车“换电模式”创新发展，从引导和规范的角度，允许符合相关技术标准和要求的“换电模式”新能源汽车，以不含动力电池的新能源汽车作为车辆购置税征税对象。为准确区分不含动力电池的新能源汽车车辆购置税计税价格，要求销售方销售时应分别核算不含动力电池的新能源汽车销售额并与动力电池分别开具发票。符合以上要求的，依据购车人购置不含动力电池的新能源汽车时取得的机动车销售统一发票载明的不含税价作为车辆购置税计税价格。"}, {"source": "国家税务局", "category": "留言咨询", "title": "个体工商户减半征收个人所得税政策的优惠力度提高了吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5210948/content.html", "date": "2023-08-17", "id": "eed9b89991291f8276cfbea4fbcd1e76", "content": "答：\n为进一步支持个体工商户发展，国家提高了政策优惠力度。自2023年1月1日至2027年12月31日，将个体工商户减半征收个人所得税的年应纳税所得额范围，由不超过100万元提高为不超过200万元。"}, {"source": "国家税务局", "category": "留言咨询", "title": "适用减半征收个人所得税政策的个体工商户范围是什么？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5210784/content.html", "date": "2023-08-09", "id": "00aeb8f22323d2d0bf83c0d37c3ea936", "content": "答：\n个体工商户不论是查账征收还是核定征收个人所得税，均可享受减半征税政策。"}, {"source": "国家税务局", "category": "留言咨询", "title": "个体工商户如何申报享受减半征收个人所得税政策？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5210544/content.html", "date": "2023-08-03", "id": "22936e5744bc427be92e93f34335cd5b", "content": "答：\n对于通过电子税务局申报的个体工商户，税务机关将自动为其提供申报表和报告表中该项政策的预填服务。实行简易申报的定期定额个体工商户，税务机关按照减免后的应纳税额自动进行税款划缴。"}, {"source": "国家税务局", "category": "留言咨询", "title": "小型微利企业所得税优惠政策的办理程序如何规定？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5210252/content.html", "date": "2023-07-26", "id": "ee7399a9559b25c3f69f6ec95c953db9", "content": "зӯ”пјҡ\nж №жҚ®гҖҠеӣҪе®¶зЁҺеҠЎжҖ»еұҖе…ідәҺиҗҪе®һе°ҸеһӢеҫ®еҲ©дјҒдёҡжүҖеҫ—зЁҺдјҳжғ ж”ҝзӯ–еҫҒз®Ўй—®йўҳзҡ„е…¬е‘ҠгҖӢпјҲеӣҪе®¶зЁҺеҠЎжҖ»еұҖе…¬е‘Ҡ2023е№ҙз¬¬6еҸ·пјүи§„е®ҡпјҢз¬ҰеҗҲжқЎд»¶зҡ„е°ҸеһӢеҫ®еҲ©дјҒдёҡйҖҡиҝҮеЎ«еҶҷзәізЁҺз”іжҠҘиЎЁпјҢеҚіеҸҜдҫҝжҚ·дә«еҸ—дјҳжғ ж”ҝзӯ–пјҢж— йңҖе…¶д»–жүӢз»ӯгҖӮ\nе°ҸеһӢеҫ®еҲ©дјҒдёҡеә”еҮҶзЎ®еЎ«жҠҘд»Һдёҡдәәж•°гҖҒиө„дә§жҖ»йўқгҖҒеӣҪе®¶йҷҗеҲ¶жҲ–зҰҒжӯўиЎҢдёҡзӯүеҹәзЎҖдҝЎжҒҜпјҢи®Ўз®—еә”зәізЁҺжүҖеҫ—йўқеҗҺпјҢдҝЎжҒҜзі»з»ҹе°ҶеҲ©з”Ёзӣёе…іж•°жҚ®пјҢдёәе°ҸеһӢеҫ®еҲ©дјҒдёҡжҷәиғҪйў„еЎ«дјҳжғ йЎ№зӣ®гҖҒиҮӘеҠЁи®Ўз®—еҮҸе…ҚзЁҺйўқгҖӮ"}, {"source": "国家税务局", "category": "留言咨询", "title": "企业如何享受小型微利企业所得税优惠政策？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5209999/content.html", "date": "2023-07-20", "id": "3be4afdce0b3f999c7043efffe6136dd", "content": "答：\n举例：\nA企业2022年成立，从事国家非限制和禁止行业，2023年度1季度和2季度相关指标为：从业人数季度平均值分别为170人、190人；资产总额季度平均值分别为2100万元、2500万元。2季度累计应纳税所得额200万元，其中1季度应纳税所得额90万元，已预缴企业所得税4.5万元。\n解析：\n小型微利企业预缴企业所得税时，资产总额、从业人数、年度应纳税所得额指标，暂按当年度截至本期预缴申报所属期末的情况进行判断。\nA企业预缴2023年2季度企业所得税时，“从业人数”截至本期末季度平均值为180人，“资产总额”截至本期末季度平均值为2300万元，累计应纳税所得额为200万元。\n企业预缴企业所得税时，符合小型微利企业的判断标准：从事国家非限制和禁止行业，且同时符合截至本期预缴申报所属期末资产总额季度平均值不超过5000万元、从业人数季度平均值不超过300人、应纳税所得额不超过300万元，A企业可以享受优惠政策。\n《财政部 税务总局关于小微企业和个体工商户所得税优惠政策的公告》（2023年第6号）规定，对小型微利企业年应纳税所得额不超过100万元的部分，减按25%计入应纳税所得额，按20%的税率缴纳企业所得税。因此，A企业2季度的应纳税额为：200×25%×20%-4.5=5.5（万元）。"}, {"source": "国家税务局", "category": "留言咨询", "title": "企业在7月预缴申报时享受研发费用加计扣除政策，应如何填报申报表？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5209722/content.html", "date": "2023-07-12", "id": "76d6e13763734f3d89432e6ffacaf2b9", "content": "зӯ”пјҡ\nзәізЁҺдәәеҰӮйҖүжӢ©зәёиҙЁз”іжҠҘиЎЁиҝӣиЎҢйў„зјҙз”іжҠҘпјҢеҸҜеңЁгҖҠдёӯеҚҺдәәж°‘е…ұе’ҢеӣҪдјҒдёҡжүҖеҫ—зЁҺжңҲпјҲеӯЈпјүеәҰйў„зјҙзәізЁҺз”іжҠҘиЎЁпјҲAзұ»пјүгҖӢпјҲA200000пјүз¬¬7иЎҢвҖңеҮҸпјҡе…ҚзЁҺж”¶е…ҘгҖҒеҮҸи®Ўж”¶е…ҘгҖҒеҠ и®ЎжүЈйҷӨвҖқдёӢзҡ„жҳҺз»ҶиЎҢж¬ЎеЎ«еҶҷзӣёе…ідјҳжғ дәӢйЎ№еҗҚз§°е’Ңдјҳжғ йҮ‘йўқгҖӮ\nзәізЁҺдәәеҰӮйҖҡиҝҮз”өеӯҗзЁҺеҠЎеұҖиҝӣиЎҢйў„зјҙз”іжҠҘпјҢеҸҜзӣҙжҺҘеңЁдёӢжӢүиҸңеҚ•дёӯйҖүжӢ©зӣёеә”зҡ„дјҳжғ дәӢйЎ№еҗҚз§°пјҢеҶҚеЎ«жҠҘдјҳжғ йҮ‘йўқгҖӮйңҖиҰҒжіЁж„Ҹзҡ„жҳҜпјҢз”ұдәҺдёӢжӢүиҸңеҚ•дёӯдјҳжғ дәӢйЎ№иҫғеӨҡпјҢиҜ·еңЁзЁҺеҠЎжҖ»еұҖе®ҳзҪ‘вҖңзәізЁҺжңҚеҠЎвҖқж Ҹзӣ®жҹҘйҳ…гҖҠдјҒдёҡжүҖеҫ—зЁҺз”іжҠҘдәӢйЎ№зӣ®еҪ•гҖӢпјҢеҜ№з…§йҖүжӢ©жӯЈзЎ®зҡ„дјҳжғ дәӢйЎ№пјҢд»ҘеҮҶзЎ®дә«еҸ—дјҳжғ ж”ҝзӯ–гҖӮ"}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第二十二号）", "url": "https://www.cicpa.org.cn/xxfb/tzgg/202307/t20230707_64330.html", "date": "2023-07-07", "id": "da44e8dac4c7211ee9f5b68900b09366", "content": "为进一步贯彻落实《国务院办公厅关于进一步规范财务审计秩序 促进注册会计师行业健康发展的意见》（国办发〔\n2021\n〕\n30\n号），根据《会计师事务所执业质量检查制度》（会协〔\n2011\n〕\n39\n号），\n2022\n年，中国注册会计师协会（以下简称中注协）与各省、自治区、直辖市注册会计师协会（以下简称省级注协）共计对\n1864\n家会计师事务所开展执业质量检查。截至目前，中注协和省级注协对存在违规问题的\n259\n家事务所和\n336\n名注册会计师实施了行业惩戒及自律监管措施。其中，对\n27\n家事务所和\n54\n名注册会计师公开谴责；对\n32\n家事务所和\n74\n名注册会计师通报批评；对\n37\n家事务所和\n135\n名注册会计师训诫，对其他\n163\n家事务所和\n73\n名注册会计师采取约谈等监管措施。\n现将检查发现的八个典型案例公告如下：\n一是北京正义会计师事务所有限责任公司主任会计师未参与该公司日常经营管理。该公司未按检查要求提供审计工作底稿，部分审计项目存在未实施风险评估程序、未确定重要性水平，未对银行存款、往来款项、借款、存货等科目执行必要的审计程序，未获取充分、适当的审计证据等问题。北京注册会计师协会对该公司及主任会计师杨火才、注册会计师张明作出公开谴责的行业惩戒。\n二是广州天维会计师事务所（普通合伙）现任合伙人均不是注册会计师，不符合执业许可存续条件，且存在冒用已去世注册会计师名义出具报告的行为。该所的部分审计项目存在未对收入、银行存款、往来款项、固定资产等科目执行必要的审计程序，未获取充分、适当的审计证据等问题。广东省注册会计师协会对该所作出公开谴责的行业惩戒。\n三是广州市忠雄会计师事务所（普通合伙）未建立合伙人晋升、委派、考评、薪酬和违规行为处理等机制，且存在支付业务回扣等问题。该所的部分审计项目未确定重要性水平，未对收入、银行存款、往来款项、长期股权投资等科目执行必要的审计程序，未获取充分、适当的审计证据。广东省注册会计师协会对该所作出公开谴责的行业惩戒。\n四是台州中鼎会计师事务所（普通合伙）的部分审计项目存在未实际执行审计程序，未编制审计工作底稿等问题。浙江省注册会计师协会对该所及注册会计师董汉兰、段兰珍、单爱武、赵遗珍作出公开谴责的行业惩戒。\n五是杭州德益会计师事务所（普通合伙）的部分审计项目未对银行存款、应收账款、短期借款等科目执行\n函证程序，也未说明不予函证的理由。同时，存在未对存货获取有关清单，未实施监盘程序，也未实施替代程序等问题。上述科目均对有关财务报表有重大影响，但该所未能执行必要的审计程序，\n未能获取充分、适当的审计证据。浙江省注册会计师协会对该所及注册会计师张丛玲、周娟作出公开谴责的行业惩戒。\n六是武汉天意会计师事务有限责任公司主任会计师无法正常履职，未委托其他股东代为履职，该公司也未将上述情况向监管部门报备。该公司审计报告编号不连续，还存在部分签字注册会计师未实际参与项目，复核流于形式等问题。抽查的部分项目未确定重要性水平，未对银行存款、借款、存货、固定资产、收入等科目执行必要的审计程序，未获取充分、适当的审计证据。个别项目的研发费用审定金额与财务报表实际披露金额差异巨大，该公司未予以关注。湖北省注册会计师协会对该公司及主任会计师高剑作出公开谴责的行业惩戒。\n七是重庆华税会计师事务所（普通合伙）部分审计项目的项目承接、实质性程序、完成阶段等全部审计程序仅由一名助理人员完成，且此人在该所无工资发放及社保缴纳记录，无法证明是该所员工。该所部分审计项目还存在未对收入、银行存款、存货、往来款项、长期股权投资、固定资产等科目执行必要的审计程序，未获取充分、适当的审计证据等问题。重庆市注册会计师协会对该所作出公开谴责的行业惩戒。\n八是云南知行宜宸会计师事务所（普通合伙）对部分首次承接的审计业务，未与前任注册会计师进行沟通，未执行期初余额审计；部分审计项目未对发放贷款、长期股权投资、往来款项、收入等科目执行必要的审计程序，未获取充分、适当的审计证据。云南省注册会计师协会对该所作出公开谴责的行业惩戒。\n2023\n年，中注协将在财政部党组的领导下，按照党中央、国务院决策部署，深入贯彻《中共中央办公厅 国务院办公厅关于进一步加强财会监督工作的意见》，切实加强行业自律监督，加大行业惩戒力度，推动会计师事务所更好发挥执业监督作用，促进行业高质量发展，更好服务国家建设。"}, {"source": "国家税务局", "category": "留言咨询", "title": "企业设立不具有法人资格的分支机构，如何适用小型微利企业所得税优惠政策？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5208158/content.html", "date": "2023-07-05", "id": "52d34dd033d951fec2ee00c53019c35a", "content": "зӯ”пјҡ\nзҺ°иЎҢдјҒдёҡжүҖеҫ—зЁҺе®һиЎҢжі•дәәзЁҺеҲ¶пјҢдјҒдёҡеә”д»Ҙжі•дәәдёәдё»дҪ“пјҢи®Ўз®—е№¶зјҙзәідјҒдёҡжүҖеҫ—зЁҺгҖӮгҖҠдёӯеҚҺдәәж°‘е…ұе’ҢеӣҪдјҒдёҡжүҖеҫ—зЁҺжі•гҖӢз¬¬дә”еҚҒжқЎз¬¬дәҢж¬ҫи§„е®ҡпјҢеұ…ж°‘дјҒдёҡеңЁдёӯеӣҪеўғеҶ…и®ҫз«ӢдёҚе…·жңүжі•дәәиө„ж јзҡ„иҗҘдёҡжңәжһ„зҡ„пјҢеә”еҪ“жұҮжҖ»и®Ўз®—е№¶зјҙзәідјҒдёҡжүҖеҫ—зЁҺгҖӮеӣ жӯӨпјҢдјҒдёҡи®ҫз«ӢдёҚе…·жңүжі•дәәиө„ж јеҲҶж”Ҝжңәжһ„зҡ„пјҢеә”еҪ“е…ҲжұҮжҖ»и®Ўз®—жҖ»жңәжһ„еҸҠе…¶еҗ„еҲҶж”Ҝжңәжһ„зҡ„д»Һдёҡдәәж•°гҖҒиө„дә§жҖ»йўқгҖҒе№ҙеәҰеә”зәізЁҺжүҖеҫ—йўқпјҢеҶҚдҫқжҚ®еҗ„жҢҮж Үзҡ„еҗҲи®Ўж•°еҲӨж–ӯжҳҜеҗҰз¬ҰеҗҲе°ҸеһӢеҫ®еҲ©дјҒдёҡжқЎд»¶гҖӮ"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是一家小型企业，在7月份预缴申报时不打算享受研发费用加计扣除政策，以后还可以享受吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5206717/content.html", "date": "2023-06-26", "id": "794747042156f9cdfecdfef1dc7df5fa", "content": "答：\n对7月份预缴申报期未选择享受研发费用加计扣除政策的企业，在10月份预缴申报或年度汇算清缴时能够准确归集核算研发费用的，可结合自身生产经营实际情况，自主选择在10月份预缴申报或年度汇算清缴时统一享受。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我是一家餐饮公司，为按月申报的增值税小规模纳税人，由于对新出台政策不熟悉，2023年5月25日为客户开具了2万元的3%征收率增值税普通发票。5月实际月销售额为15万元，均为3%征收率的销售收入，我公司客户为个人，无法收回已开具发票，请问我公司还能够享受3%征收率销售收入减按1%征收率征收增值税政策吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5205445/content.html", "date": "2023-06-14", "id": "b3851d15efc63d3ce5559eecea2c3334", "content": "答：\n《财政部 税务总局关于明确增值税小规模纳税人减免增值税等政策的公告》（2023年第1号）规定，自2023年1月1日至2023年12月31日，增值税小规模纳税人适用3%征收率的应税销售收入，减按1%征收率征收增值税。\n您3%征收率的销售收入15万元，可以在申报纳税时直接进行减税申报，享受3%征收率销售收入减按1%征收率征收增值税政策。为减轻您的办税负担，无需对已开具的3%征收率的增值税普通发票进行作废或换开。但需要注意的是，按照《中华人民共和国发票管理办法》等相关规定，纳税人应如实开具发票。《国家税务总局关于增值税小规模纳税人减免增值税等政策有关征管事项的公告》（2023年第1号）第五条规定，小规模纳税人取得应税销售收入，适用减按1%征收率征收增值税政策的，应按照1%征收率开具增值税发票。因此，今后您享受3%征收率销售收入减按1%征收率征收增值税政策时，如需开具增值税普通发票，应按照1%征收率开具。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是零售摩托车的增值税小规模纳税人，每月销售额在10万元左右，2023年5月为客户开具发票时无法确认本月是否能够享受月销售额10万元以下免税政策，请问我要享受今年新出台的小规模纳税人优惠政策，应如何开具机动车销售统一发票？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5205260/content.html", "date": "2023-06-09", "id": "c80880bbc007ceffe4987e044d5f8224", "content": "答：\n《财政部 税务总局关于明确增值税小规模纳税人减免增值税等政策的公告》（2023年第1号）规定，自2023年1月1日至2023年12月31日，对月销售额10万元以下（含本数）的增值税小规模纳税人，免征增值税。增值税小规模纳税人适用3%征收率的应税销售收入，减按1%征收率征收增值税。\n您在月中开票时并不知晓销售额是否会超过10万元、能否享受免税政策，应先按照1%征收率开具机动车销售统一发票。申报纳税时，如月销售额未超过10万元，可以在申报纳税时进行免税申报，如月销售额超过10万元，可以在申报纳税时减按1%征收率申报缴纳增值税。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我是按月申报的增值税小规模纳税人，2023年5月为客户开具发票时按照习惯开具了3%征收率的增值税普通发票，如实际月销售额未超过10万元，请问我能够享受免税优惠政策吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5205092/content.html", "date": "2023-06-01", "id": "422f677fc9ff99970b61d4d0c9e4e24a", "content": "答：\n《财政部 税务总局关于明确增值税小规模纳税人减免增值税等政策的公告》（2023年第1号）规定，自2023年1月1日至2023年12月31日，对月销售额10万元以下（含本数）的增值税小规模纳税人，免征增值税。\n您的月销售额如未超过10万元，可以在申报纳税时直接进行免税申报，享受免征增值税政策。"}, {"source": "国家税务局", "category": "留言咨询", "title": "城镇土地使用税优惠政策如何规定仓储用地？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5196729/content.html", "date": "2023-05-25", "id": "cf89f560d88569504d780235fe79e53a", "content": "зӯ”пјҡ\nж №жҚ®гҖҠиҙўж”ҝйғЁ зЁҺеҠЎжҖ»еұҖе…ідәҺз»§з»ӯе®һж–Ҫзү©жөҒдјҒдёҡеӨ§е®—е•Ҷе“Ғд»“еӮЁи®ҫж–Ҫз”Ёең°еҹҺй•Үеңҹең°дҪҝз”ЁзЁҺдјҳжғ ж”ҝзӯ–зҡ„е…¬е‘ҠгҖӢпјҲиҙўж”ҝйғЁ зЁҺеҠЎжҖ»еұҖе…¬е‘Ҡ2023е№ҙз¬¬5еҸ·пјүпјҢвҖңеҗҢдёҖвҖқд»“еӮЁи®ҫж–ҪеҚ ең°йқўз§ҜеңЁ6000е№іж–№зұіеҸҠд»ҘдёҠзҡ„пјҢжүҚиғҪдә«еҸ—дјҳжғ гҖӮ\nиҝҷжҲ·дјҒдёҡзҡ„д»“еӮЁи®ҫж–ҪеҲҶж•ЈеңЁдёӨең°пјҢеә”еҪ“еҲҶејҖеҲӨж–ӯжҳҜеҗҰз¬ҰеҗҲдјҳжғ жқЎд»¶гҖӮдҪҚдәҺеҹҺеҢ—зҡ„д»“еӮЁи®ҫж–ҪеҚ ең°3000е№іж–№зұіпјҢжңӘиҫҫеҲ°5еҸ·е…¬е‘Ҡи§„е®ҡзҡ„йқўз§Ҝж ҮеҮҶпјҢж— жі•йҖӮз”ЁиҜҘж”ҝзӯ–пјӣдҪҚдәҺеҹҺеҚ—зҡ„д»“еӮЁи®ҫж–ҪеҚ ең°7000е№іж–№зұіпјҢз¬ҰеҗҲ5еҸ·е…¬е‘Ҡи§„е®ҡпјҢеҸҜд»Ҙдә«еҸ—еҮҸжҢүжүҖеұһеңҹең°зӯүзә§йҖӮз”ЁзЁҺйўқж ҮеҮҶзҡ„50%и®ЎеҫҒеҹҺй•Үеңҹең°дҪҝз”ЁзЁҺзҡ„зЁҺж”¶дјҳжғ гҖӮ"}, {"source": "国家税务局", "category": "留言咨询", "title": "取得多处经营所得的个体工商户如何享受优惠政策？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5196398/content.html", "date": "2023-05-18", "id": "9f444562ed3f5f45900668f62ca505fb", "content": "зӯ”пјҡ\nжҢүз…§зҺ°иЎҢж”ҝзӯ–и§„е®ҡпјҢзәізЁҺдәәд»ҺдёӨеӨ„д»ҘдёҠеҸ–еҫ—з»ҸиҗҘжүҖеҫ—зҡ„пјҢеә”еҪ“йҖүжӢ©еҗ‘е…¶дёӯдёҖеӨ„з»ҸиҗҘз®ЎзҗҶжүҖеңЁең°дё»з®ЎзЁҺеҠЎжңәе…іеҠһзҗҶе№ҙеәҰжұҮжҖ»з”іжҠҘгҖӮиӢҘдёӘдҪ“е·Ҙе•ҶжҲ·д»ҺдёӨеӨ„д»ҘдёҠеҸ–еҫ—з»ҸиҗҘжүҖеҫ—пјҢйңҖеңЁеҠһзҗҶе№ҙеәҰжұҮжҖ»зәізЁҺз”іжҠҘж—¶пјҢеҗҲе№¶дёӘдҪ“е·Ҙе•ҶжҲ·з»ҸиҗҘжүҖеҫ—е№ҙеә”зәізЁҺжүҖеҫ—йўқпјҢйҮҚж–°и®Ўз®—еҮҸе…ҚзЁҺйўқпјҢеӨҡйҖҖе°‘иЎҘгҖӮдёҫдҫӢеҰӮдёӢпјҡ\nгҖҗдҫӢгҖ‘зәізЁҺдәәеј жҹҗеҗҢж—¶з»ҸиҗҘдёӘдҪ“е·Ҙе•ҶжҲ·Aе’ҢдёӘдҪ“е·Ҙе•ҶжҲ·BпјҢе№ҙеә”зәізЁҺжүҖеҫ—йўқеҲҶеҲ«дёә80дёҮе…ғе’Ң50дёҮе…ғпјҢйӮЈд№Ҳеј жҹҗеңЁе№ҙеәҰжұҮжҖ»зәізЁҺз”іжҠҘж—¶пјҢеҸҜд»Ҙдә«еҸ—еҮҸеҚҠеҫҒж”¶дёӘдәәжүҖеҫ—зЁҺж”ҝзӯ–зҡ„еә”зәізЁҺжүҖеҫ—йўқдёә100дёҮе…ғгҖӮ"}, {"source": "国家税务局", "category": "留言咨询", "title": "个体工商户减半征税的个人所得税优惠政策及适用范围是什么？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5196046/content.html", "date": "2023-05-12", "id": "e78ec809a3d0a6ac7111b8257242a83b", "content": "答：\n对个体工商户经营所得年应纳税所得额不超过100万元的部分，在现行优惠政策基础上，再减半征收个人所得税。个体工商户不区分征收方式，均可享受。"}, {"source": "国家税务局", "category": "留言咨询", "title": "个体工商户变更经营者是先到税务部门办理变更还是先到市场监管部门办理变更？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5195446/content.html", "date": "2023-05-06", "id": "09cc0d59ba00c181c31b34796336b74a", "content": "ç­”ï¼ڑ\nو ¹وچ®م€ٹن؟ƒè؟›ن¸ھن½“ه·¥ه•†وˆ·هڈ‘ه±•و‌،ن¾‹ï¼ˆن¸­هچژن؛؛و°‘ه…±ه’Œه›½ه›½هٹ،é™¢ن»¤ç¬¬755هڈ·ï¼‰\nم€‹\nم€پم€ٹه¸‚هœ؛ç›‘ç®،و€»ه±€هٹ‍ه…¬هژ…ه…³ن؛ژهپڑه¥½ن¸ھن½“ه·¥ه•†وˆ·ç»ڈèگ¥è€…هڈکو›´ç™»è®°ه·¥ن½œçڑ„é€ڑçں¥ï¼ˆه¸‚ç›‘و³¨هڈ‘م€”2022م€•102هڈ·ï¼‰م€‹è§„ه®ڑï¼Œç»ڈèگ¥è€…ه؛”ه½“ن¾‌و³•هٹ‍ç»“ن¸ھن½“ه·¥ه•†وˆ·و¶‰ç¨ژن؛‹é،¹هگژï¼Œه†چç”³è¯·ن¸ھن½“ه·¥ه•†وˆ·ç»ڈèگ¥è€…هڈکو›´ç™»è®°م€‚ه¸‚هœ؛ç›‘ç®،éƒ¨é—¨وژ¥هڈ—ç”³è¯·ن؛؛وڈگن؛¤çڑ„ç؛¸è´¨م€ٹو¸…ç¨ژè¯پوکژم€‹ï¼Œه…·ه¤‡و•°وچ®ه…±ن؛«و‌،ن»¶çڑ„ï¼Œé€ڑè؟‡و•°وچ®ه…±ن؛«çڑ„و–¹ه¼ڈèژ·هڈ–ه…¶ç¨ژهٹ،ن؛‹é،¹ç»“و¸…وƒ…ه†µçڑ„ن؟،وپ¯م€‚ç»ڈèگ¥è€…هڈکو›´هگژï¼Œهڈٹو—¶ه°†ç›¸ه…³ç™»è®°و³¨ه†Œن؟،وپ¯وژ¨é€پè‡³ç¨ژهٹ،éƒ¨é—¨م€‚"}, {"source": "国家税务局", "category": "留言咨询", "title": "研发费用加计扣除政策中的研发费用包括哪些？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5195199/content.html", "date": "2023-04-28", "id": "e0f769891b4c0ba01178b8a8df152064", "content": "зӯ”пјҡ\nе…·дҪ“еҢ…жӢ¬дәәе‘ҳдәәе·Ҙиҙ№з”ЁпјҢзӣҙжҺҘжҠ•е…Ҙиҙ№з”ЁпјҢжҠҳж—§иҙ№з”ЁпјҢж— еҪўиө„дә§ж‘Ҡй”ҖпјҢж–°дә§е“Ғи®ҫи®Ўиҙ№гҖҒж–°е·Ҙиүәи§„зЁӢеҲ¶е®ҡиҙ№гҖҒж–°иҚҜз ”еҲ¶зҡ„дёҙеәҠиҜ•йӘҢиҙ№гҖҒеӢҳжҺўејҖеҸ‘жҠҖжңҜзҡ„зҺ°еңәиҜ•йӘҢиҙ№е’Ңе…¶д»–зӣёе…іиҙ№з”Ёзӯүиҙ№з”ЁпјҢе…¶дёӯпјҢе…¶д»–зӣёе…іиҙ№з”ЁйҮҮеҸ–йҷҗйўқжүЈйҷӨзҡ„ж–№ејҸгҖӮ119еҸ·ж–ҮпјҲиҙўзЁҺгҖ”2015гҖ•119еҸ·пјүйҮҮеҸ–жӯЈеҲ—дёҫеҪўејҸпјҢеҜ№дёҠиҝ°иҙ№з”ЁдёӯеҸҜеҠ и®ЎжүЈйҷӨзҡ„е…·дҪ“иҙ№з”ЁиҝӣиЎҢдәҶжҳҺзЎ®гҖӮжҜ”еҰӮпјҡдәәе‘ҳдәәе·Ҙиҙ№з”ЁеҢ…жӢ¬зӣҙжҺҘд»ҺдәӢз ”еҸ‘жҙ»еҠЁдәәе‘ҳзҡ„е·Ҙиө„и–ӘйҮ‘гҖҒеҹәжң¬е…»иҖҒдҝқйҷ©иҙ№гҖҒеҹәжң¬еҢ»з–—дҝқйҷ©иҙ№гҖҒеӨұдёҡдҝқйҷ©иҙ№гҖҒе·ҘдјӨдҝқйҷ©иҙ№гҖҒз”ҹиӮІдҝқйҷ©иҙ№е’ҢдҪҸжҲҝе…¬з§ҜйҮ‘пјҢд»ҘеҸҠеӨ–иҒҳз ”еҸ‘дәәе‘ҳзҡ„еҠіеҠЎиҙ№з”ЁпјҢйңҖиҰҒиҜҙжҳҺзҡ„жҳҜпјҢиҒҢе·ҘзҰҸеҲ©иҙ№гҖҒиЎҘе……е…»иҖҒдҝқйҷ©гҖҒиЎҘе……еҢ»з–—дҝқйҷ©дёҚеұһдәҺдәәе‘ҳдәәе·Ҙиҙ№з”ЁпјҢеә”жҢүгҖҠеӣҪе®¶зЁҺеҠЎжҖ»еұҖе…ідәҺз ”еҸ‘иҙ№з”ЁзЁҺеүҚеҠ и®ЎжүЈйҷӨеҪ’йӣҶиҢғеӣҙжңүе…ій—®йўҳзҡ„е…¬е‘ҠгҖӢпјҲ2017е№ҙз¬¬40еҸ·пјүзҡ„и§„е®ҡеҲ—е…Ҙе…¶д»–зӣёе…іиҙ№з”ЁпјҢе№¶йҮҮеҸ–йҷҗйўқжүЈйҷӨзҡ„ж–№ејҸгҖӮ"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是增值税小规模纳税人，享受物流企业大宗商品仓储设施用地减征城镇土地使用税优惠的同时，是否可以叠加享受“六税两费”优惠？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5192816/content.html", "date": "2023-04-20", "id": "db0ce82e97194cd891919a64f4822fb9", "content": "答：\n根据《财政部 税务总局关于进一步实施小微企业“六税两费”减免政策的公告》（2022年第10号）的规定，2022年1月1日至2024年12月31日，省、自治区、直辖市人民政府可以根据本地区实际情况，以及宏观调控需要，对增值税小规模纳税人、小型微利企业和个体工商户在50%的税额幅度内减征房产税、城镇土地使用税等“六税两费”。纳税人享受其他优惠政策的，可叠加享受“六税两费”优惠政策。\n你公司在享受物流企业大宗商品仓储设施用地减半征收城镇土地使用税优惠的基础上，可以叠加享受“六税两费”优惠。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是一家信息传输、软件和信息技术服务企业，2023年度发生的研发费用如何适用加计扣除政策？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5192530/content.html", "date": "2023-04-13", "id": "e65f05d26e9180de9e738838f5511bf6", "content": "зӯ”пјҡ\nгҖҠиҙўж”ҝйғЁ зЁҺеҠЎжҖ»еұҖе…ідәҺиҝӣдёҖжӯҘе®Ңе–„з ”еҸ‘иҙ№з”ЁзЁҺеүҚеҠ и®ЎжүЈйҷӨж”ҝзӯ–зҡ„е…¬е‘ҠгҖӢпјҲ2023е№ҙз¬¬7еҸ·пјҢд»ҘдёӢз®Җз§°вҖң7еҸ·е…¬е‘ҠвҖқпјүжҳҺзЎ®пјҡдјҒдёҡејҖеұ•з ”еҸ‘жҙ»еҠЁдёӯе®һйҷ…еҸ‘з”ҹзҡ„з ”еҸ‘иҙ№з”ЁпјҢжңӘеҪўжҲҗж— еҪўиө„дә§и®Ўе…ҘеҪ“жңҹжҚҹзӣҠзҡ„пјҢеңЁжҢүи§„е®ҡжҚ®е®һжүЈйҷӨзҡ„еҹәзЎҖдёҠпјҢиҮӘ2023е№ҙ1жңҲ1ж—Ҙиө·пјҢеҶҚжҢүз…§е®һйҷ…еҸ‘з”ҹйўқзҡ„100%еңЁзЁҺеүҚеҠ и®ЎжүЈйҷӨпјӣеҪўжҲҗж— еҪўиө„дә§зҡ„пјҢиҮӘ2023е№ҙ1жңҲ1ж—Ҙиө·пјҢжҢүз…§ж— еҪўиө„дә§жҲҗжң¬зҡ„200%еңЁзЁҺеүҚж‘Ҡй”ҖгҖӮ\nдҪ е…¬еҸё2023е№ҙеәҰеҸ‘з”ҹзҡ„з ”еҸ‘иҙ№з”ЁеҸҜжҢүз…§дёҠиҝ°и§„е®ҡпјҢйҖӮз”Ёз ”еҸ‘иҙ№з”ЁеҠ и®ЎжүЈйҷӨж”ҝзӯ–гҖӮ"}, {"source": "国家税务局", "category": "留言咨询", "title": "在预缴企业所得税时，小型微利企业如何享受所得税优惠政策？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5186314/content.html", "date": "2023-04-07", "id": "647563b7cbc83b5294fc8f0961211a0a", "content": "答：\n首先，判断是否符合条件。企业在年度中间预缴企业所得税时，按照政策标准判断符合小型微利企业条件的，即可享受优惠政策。资产总额、从业人数、年度应纳税所得额指标，暂按当年度截至本期预缴申报所属期末的情况进行判断。其中，资产总额、从业人数指标按照政策标准中“全年季度平均值”的计算公式，计算截至本期预缴申报所属期末的季度平均值。\n其次，按照政策规定计算应纳税额。今后如调整政策，从其规定，计算方法以此类推。\n示例如下：\n例：\nA企业2022年成立，从事国家非限制和禁止行业，2023年1季度季初、季末的从业人数分别为120人、200人，1季度季初、季末的资产总额分别为2000万元、4000万元，1季度的应纳税所得额为90万元。\n解析：\n2023年1季度，A企业“从业人数”的季度平均值为160人，“资产总额”的季度平均值为3000万元，应纳税所得额为90万元。符合关于小型微利企业预缴企业所得税时的判断标准：从事国家非限制和禁止行业，且同时符合截至本期预缴申报所属期末资产总额季度平均值不超过5000万元、从业人数季度平均值不超过300人、应纳税所得额不超过300万元，可以享受优惠政策。\n《财政部 税务总局关于小微企业和个体工商户所得税优惠政策的公告》（2023年第6号）规定，对小型微利企业年应纳税所得额不超过100万元的部分，减按25%计入应纳税所得额，按20%的税率缴纳企业所得税。因此，A企业1季度的应纳税额为：90×25%×20%=4.5（万元）。"}, {"source": "国家税务局", "category": "留言咨询", "title": "个体工商户享受个人所得税优惠政策的程序是怎样的？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5185963/content.html", "date": "2023-03-30", "id": "893dc9cd4406808f55146deedab39efc", "content": "答：\n个体工商户在预缴和汇算清缴个人所得税时均可享受减半政策，享受政策时无需进行备案，通过填写个人所得税纳税申报表和减免税事项报告表相关栏次，即可享受。对于通过电子税务局申报的个体工商户，税务机关将自动为其提供申报表和报告表中该项政策的预填服务。实行简易申报的定期定额个体工商户，税务机关按照减免后的税额进行税款划缴。"}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第二十一号）", "url": "https://www.cicpa.org.cn/xxfb/tzgg/202203/t20220318_63434.html", "date": "2022-03-18", "id": "94c452ebcfcc287c62f6a1a1b5568692", "content": "为深入贯彻落实《国务院办公厅关于进一步规范财务审计秩序 促进注册会计师行业健康发展的意见》（国办发〔\n2021\n〕\n30\n号），根据《会计师事务所执业质量检查制度》（会协〔\n2011\n〕\n39\n号），\n2021\n年，中国注册会计师协会按照统一检查计划、统一组织实施、统一规范程序、统一处理处罚、统一发布公告的原则，组织各省、自治区、直辖市注册会计师协会（以下简称各省级注协）在配合财政部门检查的基础上，又对\n1000\n家事务所开展行业自律检查。截至\n2022\n年\n2\n月\n28\n日，各级注协对存在违规问题的\n199\n家事务所和\n465\n名注册会计师按照惩戒办法实施了行业惩戒。其中，对\n53\n家事务所和\n116\n名注册会计师公开谴责；对\n57\n家事务所和\n151\n名注册会计师通报批评；对\n56\n家事务所和\n137\n名注册会计师训诫；对其他\n33\n家事务所和\n61\n名注册会计师采取约谈等监管措施。同时，各级注协共开展常态化诚信教育\n68\n次，监管约谈\n227\n家次，整改帮扶\n235\n家次，提供专业技术支持\n208\n次。\n现将检查发现的\n9\n个典型案例公告如下：\n一、郁南西江会计师事务所有限公司印章管理不规范，同时使用两枚事务所印章，违规使用业务章签发审计报告，控制注册会计师个人印章。该所还存在抽查的部分审计项目未执行必要的审计程序、未发现被审计单位合并范围严重错误、未按照准则要求撰写审计报告等其他违规行为。广东省注册会计师协会对该所及注册会计师张桂深、陈光明、梁景成、李烘飞作出公开谴责的行业惩戒。\n二、云南天定会计师事务所（普通合伙）雇佣其他会计师事务所合伙人冯某某复核审计工作底稿，且由冯某某执行部分审计工作。该所还存在抽查的部分审计项目未对收入、银行存款、往来款项和存货执行必要的审计程序，未获取充分适当的审计证据等其他违规行为。云南省注册会计师协会对该所及首席合伙人谭宏章作出公开谴责的行业惩戒。\n三、上海佳安会计师事务所有限公司由注册会计师以个人名义聘请非本所员工担任助理人员，执行审计业务，编制审计工作底稿。该所还存在抽查的部分审计项目未执行必要审计程序、未获取充分适当的审计证据等其他违规行为。上海市注册会计师协会对该所及注册会计师黄肇华、陆里清、唐宝华作出公开谴责的行业惩戒。\n四、嘉兴百索会计师事务所有限公司存在允许其他单位或者个人以本所名义承办业务、允许部分注册会计师在该所挂名执业等行为，且存在幕后控制人。该所还存在抽查的部分审计项目未发现长期待摊费用未摊销等重大会计差错、未执行存货监盘等必要审计程序、未获取充分适当的审计证据等其他违规行为。浙江省注册会计师协会对该所及注册会计师李运河作出公开谴责的行业惩戒。\n五、广州中庆会计师事务所（普通合伙）\n2020\n年\n1\n月至\n2021\n年\n6\n月出具的\n790\n份审计报告未经合伙人签字。该所还存在抽查的部分审计项目未执行银行函证等必要审计程序、未获取充分适当的审计证据等其他违规行为。广东省注册会计师协会对该所及注册会计师张俊生、夏喜林、杨士华、陈郁华、李亚民、胡道福作出公开谴责的行业惩戒。\n六、广州华拓会计师事务所有限公司未按检查要求提供审计工作底稿，涉及\n1570\n份审计报告，占该所出具审计报告总量的\n85.33%\n，涉嫌无审计工作底稿出具审计报告。该所还存在抽查的部分审计项目未发现库存现金期末余额为负数、未实施银行函证等必要的审计程序、未获取充分适当的审计证据等其他违规行为。广东省注册会计师协会对该所及注册会计师商四新、胡建新、黄意、赵露雨、张鹏、李亚芝、胡建国、陈川作出公开谴责的行业惩戒。\n七、杭州深度会计师事务所有限公司存在抽查的部分审计项目未对收入、银行存款、往来款项和存货执行必要的审计程序，审计工作底稿中财务报表项目审定金额与财务报表实际金额差异巨大等问题。该所还存在未按规定及时归档审计工作底稿、未按规定如实报备对外出具的审计报告信息等其他违规行为。浙江省注册会计师协会对该所及注册会计师周凤明、崔鸿启、张娟娟作出公开谴责的行业惩戒。\n八、上海普道兢实会计师事务所（普通合伙）存在抽查的部分审计报告与审计工作底稿表述存在矛盾、审计报告中审计意见段与管理层对财务报表的责任段中披露的财务报表编制基础不一致、审计业务约定书中与管理层声明书关于财务报表编制基础不一致等问题。该所还存在抽查的审计项目未实施固定资产监盘和存货监盘程序、未对函证进行控制等其他违规行为。上海市注册会计师协会对该所及注册会计师马勇、陈高潮作出公开谴责的行业惩戒。\n九、湖南元和联合会计师事务所（普通合伙）存在抽查的部分审计报告格式不符合审计报告准则规定、审计报告“特别事项说明”主体未予明确、未附已审计财务报表和财务报表附注等问题。该所还存在抽查的部分审计项目未执行必要的审计程序，承接承做与自身规模、执业能力风险承担能力不匹配的业务等其他违规行为。湖南省注册会计师协会对该所及注册会计师刘春保、陈武南作出公开谴责的行业惩戒。\n中注协将坚决贯彻党中央、国务院决策部署，认真落实财政部党组部署安排，着力配合开展整顿行业秩序、建设法规体系等工作，促进行业健康发展。同时，坚持零容忍、严监管，加大行业自律监管力度，持续推动提升行业社会公信力和服务国家建设的能力。\n2022年\n3\n月\n16\n日"}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第二十号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/202006/t20200618_23730.html", "date": "2020-06-18", "id": "1201d030010040fb0c3fdc3aefabbd23", "content": "你现在的位置：\n首页\n>\n信息查询\n>\n执业质量检查通告\n中国注册会计师协会会计师事务所执业质量检查通告（第二十号）\n2020-06-18 04:12\n根据《会计师事务所执业质量检查制度》（会协〔\n2011\n〕\n39\n号）和《关于开展\n2019\n年全国会计师事务所执业质量检查工作的通知》（会协〔\n2019\n〕\n15\n号）要求，中国注册会计师协会和各省、自治区、直辖市注册会计师协会（以下简称各级注协）组织实施并完成了\n2019\n年会计师事务所（以下简称事务所）执业质量检查工作。现将有关情况通告如下：\n一、检查总体情况\n2019\n年，各级注协贯彻落实党中央国务院关于“打好防范化解重大风险攻坚战”、会计师事务所执业质量检查制度改革精神和注册会计师行业\n“\n职业化建设年\n”\n主题活动等各项要求\n,\n坚持问题导向、坚持系统风险导向检查理念、坚持帮扶提升职业化水平，促进事务所完善质量控制体系、提升职业道德水平和执业质量，推动行业高质量发展。根据《国务院办公厅关于推广随机抽查规范事中事后监管的通知》的要求，以周期性检查为基础，结合实际情况，建立随机抽取检查对象、随机选派检查人员、检查情况及检查结果及时向社会公开的\n“\n双随机、一公开\n”\n检查机制。\n2019\n年，各级注协共组织检查人员\n846\n名\n,\n检查事务所\n1296\n家，抽查业务项目\n8521\n个，其中，财务报表审计业务项目\n6163\n个，验资业务项目\n927\n个，其他专项审计业务项目\n1431\n个。其中，中注协组织检查人员\n69\n名，检查从事证券服务业务事务所\n5\n家，抽取业务项目\n54\n个。\n二、检查重点及检查结果\n2019\n年，各级注协继续坚持系统风险导向检查理念和\n“\n五个并重\n”\n原则，注重实效，加强帮扶。在充分利用系统风险导向检查的成果和日常监管实践基础上，开展\n“\n回头看\n”\n检查，帮助事务所查找存在质量控制和风险管理问题的原因，促进事务所提升执业质量和职业声誉，推动注册会计师提升职业能力、养成职业精神。\n在被检查事务所的选取上，各级注协以周期性检查为基础，坚持随机抽取被查事务所，同时结合实际，将业务规模较大的事务所，涉嫌不正当低价竞争或承接业务数量与事务所人力资源明显不匹配的事务所，在日常监管中发现执业质量较差、受到监管机构处罚或投诉举报较多的事务所，与境外事务所和国内从事证券服务业务会计师事务所合作项目较多的事务所作为检查重点。\n在被检查业务项目的选取上，各级注协根据事务所质量控制体系的初步评估及业务特点，聚焦高风险项目和重点风险领域，兼顾不同规模的客户，以及财务报告审计、验资和专项审计等业务类型。部分省级注协在检查中还关注了事务所内部收费管理政策的制定和执行情况，对涉嫌不正当低价竞争的项目进行重点检查。中注协重点关注了高风险上市公司、新三板和金融类企业的审计业务。\n从检查总体情况看，多数事务所针对第一轮检查中提出的问题，通过修改和完善相关的执业质量政策和程序进行了整改，风险防范意识有所提升，执业质量有所提高。\n检查也发现，部分事务所质量控制体系设计不适当或未得到有效执行，个别事务所未建立完整的质量控制体系，\n未及时根据业务准则和法律法规变化更新执业标准、工作底稿、业务报告等\n。\n在业务执行过程中，一些事务所未认真贯彻风险导向审计理念，未保持合理的职业怀疑态度，存在对重大的交易、账户余额及列报实施的审计程序实施不到位，获取的审计证据不够充分、适当，审计证据不能有效支持审计报告的意见类型等问题。个别事务所在无底稿或未对获取的审计证据执行审计程序的情况下直接出具审计报告。检查还发现，个别会计师事务所未向检查组提交完整的业务清单，存在大量未以事务所名义开具的业务收入发票。\n三、惩戒情况\n2019\n年，各级注协按有关规定对存在问题的\n96\n家事务所和\n251\n名注册会计师实施了行业惩戒。包括，给予\n26\n家事务所和\n37\n名注册会计师公开谴责；给予\n40\n家事务所和\n102\n名注册会计师通报批评；给予\n30\n家事务所和\n112\n名注册会计师训诫。其中，中注协给予\n6\n名注册会计师通报批评，给予\n2\n名注册会计师训诫。\n2020\n年，各级注协将巩固拓展行业质量提升成果，开展\n“\n质量管理提升年\n”\n主题活动，完善行业业务监管工作机制和制度，加强监管联动，探索建立综合监管机制，强化执业质量检查，加大对违规会计师事务所及注册会计师的惩戒力度，提高行业诚信水平。\n2020\n年\n6\n月\n15\n日\n附件："}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十九号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201903/t20190321_23729.html", "date": "2019-03-21", "id": "7b7506d12f3b3a1cd3759bd2dd91420f", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十八号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201901/t20190107_23728.html", "date": "2019-01-07", "id": "f9020bd48738e0366630011b6a29ebe8", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十七号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201804/t20180420_23727.html", "date": "2018-04-20", "id": "f2955e154c71bf2540f897e961dad47a", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十六号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201801/t20180123_23726.html", "date": "2018-01-23", "id": "08e945bc381e3118ab665df25b9ba034", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十五号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201704/t20170421_23725.html", "date": "2017-04-21", "id": "c0be67a8a615d8823055249270c184be", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十四号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201701/t20170117_23724.html", "date": "2017-01-17", "id": "60d2bbe1c3ce16006e428d870ee93ff8", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十三号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201603/t20160311_23723.html", "date": "2016-03-11", "id": "2f7f36c3e79aa253af775b617dcde749", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十二号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201601/t20160126_23722.html", "date": "2016-01-26", "id": "28ccaf0befdb3939dbd9412104bc60f5", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十一号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201503/t20150303_23721.html", "date": "2015-03-03", "id": "3836f51e78739819633eea0e0ed7c8f2", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201501/t20150127_23720.html", "date": "2015-01-27", "id": "971d8ef3b58d640ef15876bea20d2da6", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第九号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201402/t20140208_23719.html", "date": "2014-02-08", "id": "675dc8a771d891bace92d9f9aed33fa1", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第八号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201312/t20131212_23718.html", "date": "2013-12-12", "id": "394ad8936f8489bc88ba8d66ea3bb65f", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第七号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201303/t20130308_23717.html", "date": "2013-03-08", "id": "3d903a38f1316b6663337d2d781c0769", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第六号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201212/t20121219_23716.html", "date": "2012-12-19", "id": "57c37d38649d71f14f5c2712344c24e1", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第五号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201203/t20120301_23715.html", "date": "2012-03-01", "id": "d82855cbb202c00c325e0c08a21343c8", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第四号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201202/t20120221_23714.html", "date": "2012-02-21", "id": "4198d2691af49e6253fbaf5647148985", "content": ""}];
const MATCH = {"财政部": ["财政部"], "国家税务局": ["国家税务局"], "中注协": ["中注协"], "中国会计视野": ["CPA业务探讨", "内部审计"], "CPA业务探讨": ["CPA业务探讨"], "内部审计": ["内部审计"]};
const DAILY = {"2026-09-03": "共 4 条 · CPA业务探讨4条", "2026-09-02": "共 1 条 · CPA业务探讨1条 · 热点：股权", "2026-09-01": "共 3 条 · CPA业务探讨3条 · 热点：收入、成本、股份支付", "2026-08-31": "共 5 条 · CPA业务探讨3条、中注协1条、国家税务局1条 · 热点：执业质量、进项、存货、审计", "2026-08-28": "共 3 条 · CPA业务探讨3条 · 热点：增值税、收入、出口", "2026-08-27": "共 2 条 · CPA业务探讨2条", "2026-08-26": "共 5 条 · CPA业务探讨5条", "2026-08-25": "共 4 条 · CPA业务探讨4条 · 热点：审计、合并、股权", "2026-08-04": "共 1 条 · 国家税务局1条 · 热点：发票", "2026-07-31": "共 27 条 · 财政部27条 · 热点：处罚、行政处罚", "2026-07-30": "共 1 条 · 内部审计1条", "2026-07-17": "共 1 条 · 国家税务局1条", "2026-07-13": "共 6 条 · 财政部6条 · 热点：严重失信", "2026-07-10": "共 1 条 · 内部审计1条", "更早": "共 308 条 · 财政部173条、国家税务局97条、中注协20条、内部审计18条 · 热点：处罚、行政处罚、增值税、执业质量"};
const list = document.getElementById('list');
const count = document.getElementById('count');
const dailyBoard = document.getElementById('dailyBoard');
let src = 'all';
let kw = '';

function esc(s) { return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function tagFor(source) {
  if (source === '财政部') return '<span class="tag mof">财政部</span>';
  if (source === '中注协') return '<span class="tag cicpa">中注协</span>';
  if (source === '国家税务局') return '<span class="tag tax">国家税务局</span>';
  if (source === 'CPA业务探讨') return '<span class="tag cpa">CPA业务探讨</span>';
  if (source === '内部审计') return '<span class="tag audit">内部审计</span>';
  return '<span class="tag esnai">会计视野</span>';
}

// 判断日期是否在最近 30 天内（用于「新」高亮）
function isRecent(d) {
  if (!d) return false;
  const t = new Date(d + 'T00:00:00');
  if (isNaN(t)) return false;
  const diff = (Date.now() - t.getTime()) / 86400000;
  return diff >= 0 && diff <= 30;
}

// 日期相对标签（今天 / 昨天 / 具体日期）
function dayLabel(d) {
  const pad = n => String(n).padStart(2, '0');
  const t = new Date();
  const ts = t.getFullYear() + '-' + pad(t.getMonth() + 1) + '-' + pad(t.getDate());
  const y = new Date(Date.now() - 86400000);
  const ys = y.getFullYear() + '-' + pad(y.getMonth() + 1) + '-' + pad(y.getDate());
  if (d === ts) return '<span class="today-flag">今天</span> · ' + d;
  if (d === ys) return '昨天 · ' + d;
  return d;
}

// 折叠/展开某一天
function toggleDay(head) {
  head.parentElement.classList.toggle('open');
}

// 生成某一天的看板块
function buildDay(d, items, open) {
  const summary = DAILY[d] || '';
  const bySrc = {};
  items.forEach(it => { (bySrc[it.source] = bySrc[it.source] || []).push(it); });
  const srcBlocks = Object.keys(bySrc).map(src => {
    const cards = bySrc[src].map(it =>
      '<div class="d-card">' + tagFor(it.source) +
      '<a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.title) + '</a></div>'
    ).join('');
    return '<div class="d-src"><div class="d-src-name">' + esc(src) + ' · ' + bySrc[src].length + ' 条</div>' + cards + '</div>';
  }).join('');
  const title = d === '更早' ? '更早 · ' + items.length + ' 条' : dayLabel(d);
  return '<div class="day-group' + (open ? ' open' : '') + '">' +
    '<div class="day-head" onclick="toggleDay(this)">' +
      '<div class="day-title">' + title + '</div>' +
      '<div class="day-summary">' + esc(summary) + '</div>' +
      '<span class="day-arrow">▾</span>' +
    '</div>' +
    '<div class="day-body">' + srcBlocks + '</div>' +
  '</div>';
}

// 渲染每日更新看板：最近 14 天每天一组，更早的合并
function renderDaily() {
  const groups = {};
  DATA.forEach(it => {
    const d = it.date || '未知';
    (groups[d] = groups[d] || []).push(it);
  });
  const days = Object.keys(groups).sort().reverse();
  const recentDays = days.slice(0, 14);
  const oldDays = days.slice(14);
  let blocks = recentDays.map((d, i) => buildDay(d, groups[d], i < 2)).join('');
  if (oldDays.length) {
    const oldItems = oldDays.reduce((a, d) => a.concat(groups[d]), []);
    blocks += buildDay('更早', oldItems, false);
  }
  dailyBoard.innerHTML = blocks;
}

function render() {
  const q = kw.toLowerCase();
  const rows = DATA.filter(it => {
    if (src !== 'all' && !(MATCH[src] || []).includes(it.source)) return false;
    if (q && !(it.title + ' ' + (it.content || '')).toLowerCase().includes(q)) return false;
    return true;
  });
  count.textContent = '共 ' + rows.length + ' 条';
  if (!rows.length) {
    const tip = '没有匹配的结果';
    list.innerHTML = '<div class="empty">' + tip + '</div>';
    return;
  }
  list.innerHTML = rows.map(it => {
    const sum = (it.content || '').slice(0, 140).replace(/\n/g, ' ');
    const isNew = isRecent(it.date);
    const newClass = isNew ? ' new' : '';
    const newBadge = isNew ? '<span class="badge-new">新</span>' : '';
    return '<div class="card' + newClass + '">' +
      '<div class="meta">' + tagFor(it.source) + '<span>' + esc(it.date || '日期未知') + '</span>' + newBadge + '</div>' +
      '<h2><a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.title) + '</a></h2>' +
      (sum ? '<div class="sum">' + esc(sum) + '…</div>' : '<div class="sum">（正文待抓取）</div>') +
      '</div>';
  }).join('');
}

document.getElementById('q').addEventListener('input', e => { kw = e.target.value.trim(); render(); });
document.getElementById('sidebar').addEventListener('click', e => {
  const item = e.target.closest('.nav-item');
  if (!item) return;
  // 父级点击：切换子分类展开/收起
  if (item.classList.contains('nav-parent')) {
    item.classList.toggle('open');
    const children = item.nextElementSibling;
    if (children && children.classList.contains('nav-children')) {
      children.classList.toggle('open', item.classList.contains('open'));
    }
  }
  document.querySelectorAll('.nav-item').forEach(c => c.classList.remove('active'));
  item.classList.add('active');
  src = item.dataset.src;
  render();
});

// Tab 切换：分类浏览 / 每日更新
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const isDaily = tab.dataset.tab === 'daily';
    document.getElementById('view-browse').style.display = isDaily ? 'none' : '';
    document.getElementById('view-daily').style.display = isDaily ? '' : 'none';
    if (isDaily) renderDaily();
  });
});

render();
</script>
</body>
</html>
