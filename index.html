\n紫天科技子公司华创易通（福建）科技有限公司（以下称华创易通）编制虚假验收单，虚构对中移建设有限公司广东分公司的短信服务采购业务，导致紫天科技2023年度合并财务报表营业成本虚增6,860.38万元。\n北京亚泰对紫天科技2023年度财务报表审计中，在知悉营业成本异常的情况下，未设计和实施恰当的审计程序，未获取充分适当的审计证据，认可紫天科技2023年度营业成本虚增6,860.38万元的会计处理，发表了不恰当的审计意见。\n四、未发现紫天科技合并财务报表合并抵销存在的错误，错报金额12,205.08万元超过审计重要性水平\n（一）未发现2023年末应收账款合并抵销错误4,652.69万元。\n北京亚泰对紫天科技2023年度财务报表审计中，编制的紫天科技所属子公司应收账款审计工作底稿记录2023年末对紫天科技合并报表主体范围内公司的应收账款原值审定金额合计5,732.03万元，与合并抵销金额1,079.34万元相差4,652.69万元，北京亚泰未发现上述合并抵销错误，导致紫天科技2023年度合并财务报表应收账款期末数多计4,652.69万元。\n（二）未发现2023年末其他应收款合并抵销错误7,431.85万元。\n北京亚泰对紫天科技2023年度财务报表审计中，编制的紫天科技及其子公司其他应收款审计工作底稿记录2023年末对紫天科技合并报表主体范围外公司的其他应收款原值审定金额合计4,576.23万元，紫天科技合并财务报表中其他应收款原值期末数为12,008.08万元，北京亚泰未发现上述合并抵销错误，导致紫天科技2023年度合并财务报表其他应收款期末数多计7,431.85万元。\n（三）未发现2023年末其他应付款合并抵销错误120.54万元。\n北京亚泰对紫天科技2023年度财务报表审计中，编制的紫天科技及其子公司其他应付款审计工作底稿记录2023年末对紫天科技合并报表主体范围外公司的其他应付款审定金额合计7,710.42万元，紫天科技合并财务报表中其他应付款期末数为7,589.88万元，北京亚泰未发现上述合并抵销错误，导致紫天科技2023年度合并财务报表其他应付款期末数少计120.54万元。\n五、职业判断错误，认可紫天科技代充值业务采用总额法核算的错误会计处理，发表了不恰当的审计意见\n紫天科技子公司宁波麦粒网络科技有限公司（以下称宁波麦粒）对应采用净额法核算的互联网广告代充值业务，采用总额法核算，导致紫天科技2023年度合并财务报表营业收入虚增187,051.80万元、营业成本虚增187,051.80万元。\n北京亚泰对紫天科技2023年度财务报表审计中，未保持应有的职业怀疑，未对宁波麦粒互联网广告代充值业务收入确认获取充分适当的审计证据，认可宁波麦粒采用总额法核算导致紫天科技2023年度合并财务报表营业收入、营业成本各虚增187,051.80万元的错报事项，发表了不恰当的审计意见，错报金额占紫天科技2023年度合并财务报表营业收入的85.48%、营业成本的87.86%。\n六、未编制复核紫天科技合并现金流量表的审计工作底稿，无法支撑审计结论\n北京亚泰对紫天科技2023年度财务报表审计中，未编制复核紫天科技2023年度合并现金流量表的审计工作底稿，未就紫天科技合并现金流量表的公允性、准确性获取充分适当的审计证据，无法支撑审计结论。\n七、上市实体的审计报告未披露关键审计事项段\n北京亚泰出具的《福建紫天传媒科技股份有限公司审计报告》（亚泰国际会审字(2024)第0181号）未披露关键审计事项段。\n八、未对湖南湘投轻材科技股份有限公司审计项目获取充分适当的审计证据，发表了不恰当的审计意见\n湖南湘投轻材科技股份有限公司（以下称湘投轻材）2023年伪造向克诺尔车辆设备（苏州）有限公司销售轨交制动盘K1产品的货运单、销售出库单和装箱单等单据，虚构轨交制动盘销售交易，导致2023年度财务报表虚增应收账款1,225.49万元、营业收入1,084.51万元、应交税金140.98万元、营业成本812.27万元、利润总额272.24万元，虚减存货812.27万元。\n北京亚泰对湘投轻材2023年度财务报表审计中，向湘投轻材上述客户函证过程中，未保持对函证程序的控制，询证函回函经湘投轻材转交北京亚泰。北京亚泰未对直接从湘投轻材获取的询证函回函的可靠性进行充分评估，未保持职业怀疑，未获取充分适当的审计证据，认可湘投轻材上述会计处理，发表了不恰当的审计意见。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条，《会计师事务所执业许可和监督管理办法》第五十四条第一款、第六十条第（一）（三）项，不符合《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十条第一款、第二十八条、第二十九条、第三十条，《中国注册会计师审计准则第1131号——审计工作底稿》第九条，《中国注册会计师审计准则第1301号——审计证据》第十条，《中国注册会计师审计准则第1401号——对集团财务报表审计的特殊考虑》第四十七条，《中国注册会计师审计准则第1501号——对财务报表形成审计意见和出具审计报告》第十八条第（二）项，《中国注册会计师审计准则第1504号——在审计报告中沟通关键审计事项》第六条、第八条，《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条第（一）（二）（四）项等规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款和《会计师事务所执业许可和监督管理办法》第六十九条、第七十条第一款的规定，财政部决定给予你警告、罚款1万元、吊销注册会计师证书的行政处罚。\n你应在收到本处罚决定书之日起十五日内与财政部北京监管局联系，凭财政部北京监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年12月29日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕370号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202601/t20260115_3981940.htm", "date": "2025-12-29", "id": "2d36bff7ff63542ef2c35f6cb75a36d7", "content": "财政部行政处罚决定书（财监法〔2025〕370号）\n财监法〔2025〕370 号\n财政部行政处罚决定书\n当 事 人：北京亚泰国际会计师事务所（普通合伙）（案涉期间名为北京亚泰国际会计师事务所（特殊普通合伙））\n地    址：北京市大兴区饮马井街2号院4号楼1层0257号\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组对你所执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、隐匿福建紫天传媒科技股份有限公司关键审计工作底稿等重要档案资料，逃避财政部门依法实施的监督检查\n2024年6月25日，财政部检查组对你所开展执业质量检查，2024年7月1日，你所承诺已真实、完整地向检查组提供2024年对包括福建紫天传媒科技股份有限公司（以下称紫天科技）在内的17户企业年度财务报表审计的审计工作底稿等档案资料，实际你所提交材料未包含对紫天科技（单体）、部分重要子公司及合并层面等的审计工作底稿。2024年9月11日，你所声称紫天科技2023年度财务报表审计项目的纸质版审计工作底稿及存放电子版底稿的\n电脑及光盘于2024年9月5日被公安机关调取，证实在财政部检查组从2024年6月25日开始的现场检查期间，你所未将紫天科技2023年度财务报表审计工作底稿完整提交检查组以配合检查。2025年3月至7月，你所又多次向财政部检查组补充提交紫天科技审计项目新的审计工作底稿，同时书面承认存在未及时配合检查、检查期间未完整提交审计工作底稿的情况。\n二、编制虚假的紫天科技审计工作底稿，隐瞒审计发现的问题，发表了不恰当的审计意见\n（一）编制虚假的存货相关审计工作底稿，隐瞒审计发现的问题，发表了不恰当的审计意见。\n紫天科技子公司福州缘笙科技有限公司（以下称缘笙科技）2023年与福建省海峡星云信息科技有限公司（以下称海峡星云）签订的《买卖框架协议》和《销售协议》均未实际执行，海峡星云未向缘笙科技供应任何服务器，缘笙科技通过编制虚假货物签收和入库资料虚增存货，导致紫天科技2023年度合并财务报表存货期末数虚增71,862.73万元。\n你所对紫天科技2023年度财务报表审计中，编制虚假的紫天科技存货相关审计工作底稿，隐瞒审计发现的问题，未获取充分适当的审计证据，认可紫天科技2023年度合并财务报表存货期末数虚增71,862.73万元的会计处理，发表了不恰当的审计意见。\n（二）编制虚假的预付账款相关审计工作底稿，隐瞒审计发现的问题，发表了不恰当的审计意见。\n缘笙科技向福州市森讯通信技术有限公司（以下称福州森讯）采购服务器，合同金额81,204.88万元。合同约定缘笙科技委托关联方上海紫赏广告传媒有限公司（以下称上海紫赏）分别向福州森讯的股东福州墨森网络科技有限公司、福州腾昌信息科技有限公司预付服务器采购款项；上海紫赏向上述两家公司预付的款项，于当日转回至上海紫赏账户，缘笙科技未冲减确认的预付账款81,204.88万元。2023年4月，缘笙科技依据与海峡星云签订的《买卖框架协议》，在未向海峡星云付款的情况下，将前述81,204.88万元服务器采购预付款，调整为2022年12月31日对海峡星云的预付账款。上述事项导致紫天科技2022年度合并财务报表预付账款期末数虚增81,204.88万元。\n你所对紫天科技2023年度财务报表审计中，编制虚假的紫天科技预付账款相关审计工作底稿，隐瞒审计发现的问题，认可紫天科技2023年度合并财务报表预付账款期初数虚增81,204.88万元的会计处理，发表了不恰当的审计意见。\n三、在知悉紫天科技营业成本异常的情况下，未设计和实施恰当的审计程序，未获取充分适当的审计证据，发表了不恰当的审计意见\n紫天科技子公司华创易通（福建）科技有限公司（以下称华创易通）编制虚假验收单，虚构对中移建设有限公司广东分公司的短信服务采购业务，导致紫天科技2023年度合并财务报表营业成本虚增6,860.38万元。\n你所对紫天科技2023年度财务报表审计中，在知悉营业成本异常的情况下，未设计和实施恰当的审计程序，未获取充分适当的审计证据，认可紫天科技2023年度营业成本虚增6,860.38万元的会计处理，发表了不恰当的审计意见。\n四、未发现紫天科技合并财务报表合并抵销存在的错误，错报金额12,205.08万元超过审计重要性水平\n（一）未发现2023年末应收账款合并抵销错误4,652.69万元。\n你所对紫天科技2023年度财务报表审计中，编制的紫天科技所属子公司应收账款审计工作底稿记录2023年末对紫天科技合并报表主体范围内公司的应收账款原值审定金额合计5,732.03万元，与合并抵销金额1,079.34万元相差4,652.69万元，你所未发现上述合并抵销错误，导致紫天科技2023年度合并财务报表应收账款期末数多计4,652.69万元。\n（二）未发现2023年末其他应收款合并抵销错误7,431.85万元。\n你所对紫天科技2023年度财务报表审计中，编制的紫天科技及其子公司其他应收款审计工作底稿记录2023年末对紫天科技合并报表主体范围外公司的其他应收款原值审定金额合计4,576.23万元，紫天科技合并财务报表中其他应收款原值期末数为12,008.08万元，你所未发现上述合并抵销错误，导致紫天科技2023年度合并财务报表其他应收款期末数多计7,431.85万元。\n（三）未发现2023年末其他应付款合并抵销错误120.54万元。\n你所对紫天科技2023年度财务报表审计中，编制的紫天科技及其子公司其他应付款审计工作底稿记录2023年末对紫天科技合并报表主体范围外公司的其他应付款审定金额合计7,710.42万元，紫天科技合并财务报表中其他应付款期末数为7,589.88万元，你所未发现上述合并抵销错误，导致紫天科技2023年度合并财务报表其他应付款期末数少计120.54万元。\n五、职业判断错误，认可紫天科技代充值业务采用总额法核算的错误会计处理，发表了不恰当的审计意见\n紫天科技子公司宁波麦粒网络科技有限公司（以下称宁波麦粒）对应采用净额法核算的互联网广告代充值业务，采用总额法核算，导致紫天科技2023年度合并财务报表营业收入虚增187,051.80万元、营业成本虚增187,051.80万元。\n你所对紫天科技2023年度财务报表审计中，未保持应有的职业怀疑，未对宁波麦粒互联网广告代充值业务收入确认获取充分适当的审计证据，认可宁波麦粒采用总额法核算导致紫天科技2023年度合并财务报表营业收入、营业成本各虚增187,051.80万元的错报事项，发表了不恰当的审计意见，错报金额占紫天科技2023年度合并财务报表营业收入的85.48%、营业成本的87.86%。\n六、未编制复核紫天科技合并现金流量表的审计工作底稿，无法支撑审计结论\n你所对紫天科技2023年度财务报表审计中，未编制复核紫天科技2023年度合并现金流量表的审计工作底稿，未就紫天科技合并现金流量表的公允性、准确性获取充分适当的审计证据，无法支撑审计结论。\n七、上市实体的审计报告未披露关键审计事项段\n你所出具的《福建紫天传媒科技股份有限公司审计报告》（亚泰国际会审字(2024)第0181号）未披露关键审计事项段。\n八、未获取充分适当的审计证据，发表了不恰当的审计意见\n（一）未对湖南湘投轻材科技股份有限公司审计项目获取充分适当的审计证据，发表了不恰当的审计意见。\n湖南湘投轻材科技股份有限公司（以下称湘投轻材）2023年伪造向克诺尔车辆设备（苏州）有限公司销售轨交制动盘K1产品的货运单、销售出库单和装箱单等单据，虚构轨交制动盘销售交易，导致2023年度财务报表虚增应收账款1,225.49万元、营业收入1,084.51万元、应交税金140.98万元、营业成本812.27万元、利润总额272.24万元，虚减存货812.27万元。\n你所对湘投轻材2023年度财务报表审计中，向湘投轻材上述客户函证过程中，未保持对函证程序的控制，询证函回函经湘投轻材转交你所。你所未对直接从湘投轻材获取的询证函回函的可靠性进行充分评估，未保持职业怀疑，未获取充分适当的审计证据，认可湘投轻材上述会计处理，发表了不恰当的审计意见。\n（二）未对江西华章汉辰融资担保集团股份有限公司审计项目获取充分适当的审计证据，发表了不恰当的审计意见。\n江西华章汉辰融资担保集团股份有限公司（以下称江西华章）在担保赔偿准备金累计未达到当年担保责任余额10％的情况下，实行差额提取，担保赔偿准备金计提不足。经你所审定的江西华章合并财务报表，2022年、2023年少计提担保赔偿准备金分别为17,554.96万元、19,667.87万元。\n你所在对江西华章2023年度财务报表审计中，未对担保赔偿准备金计提基准的准确性进行核实，未关注担保赔偿准备金采用差额计提方式不符合相关规定，未考虑担保赔偿准备金的会计政策是否合理以及计提金额是否充足，未获取充分适当的审计证据，发表了不恰当的审计意见。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条、第三十一条，《会计师事务所执业许可和监督管理办法》第五十四条第一款、第六十条第（一）（三）项，不符合《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十条第一款、第二十八条、第二十九条、第三十条，《中国注册会计师审计准则第1131号——审计工作底稿》第九条，《中国注册会计师审计准则第1301号——审计证据》第十条，《中国注册会计师审计准则第1401号——对集团财务报表审计的特殊考虑》第四十七条，《中国注册会计师审计准则第1501号——对财务报表形成审计意见和出具审计报告》第十八条第（二）项，《中国注册会计师审计准则第1504号——在审计报告中沟通关键审计事项》第六条、第八条，《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条第（一）（二）（四）项等规定。\n对上述违法行为，依据《中华人民共和国注册会计师法》第三十九条第一款和《会计师事务所执业许可和监督管理办法》第六十七条第一款、第六十九条的规定，财政部决定给予你所警告，没收紫天科技2023年度财务报表审计项目违法所得140万元、处以罚款701万元，没收湘投轻材2023年度财务报表审计项目违法所得25万元、处以罚款25万元，暂停经营业务1年的行政处罚。\n你所应在收到本处罚决定书之日起十五日内与财政部北京监管局联系，凭财政部北京监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年12月29日"}, {"source": "内部审计", "category": "论坛讨论", "title": "审计证据收集的合规性真的很必要", "url": "https://bbs.esnai.cn/thread-5495349-1-1.html", "date": "2025-12-22", "content": "今天在一个从业者微信群里看到同行提问。大意是，想通过某种书证，规避调取员工银行流水可能带来的合规风险。各位同行也是献计献策，讨论了一番。就这个问题，我个人的看法是，首先，提问的同行有风险意识，这个很好。可是，他的防范手段是，企业出具告知书或者同意书， ...", "id": "25141466df9fb8186bf2083e17357fc0"}, {"source": "国家税务局", "category": "留言咨询", "title": "公司给我发了一张超市购物卡，我去超市买东西，收银员说不能再开发票，这符合规定吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5245761/content.html", "date": "2025-12-15", "id": "7a0974007fd94a3764aca5c6f1ca2eaa", "content": "答：\n使用公司发放购物卡购买商品是不能开具发票的。您所说的此类公司发放的超市购物卡属于预付卡的一种，根据《国家税务总局关于营改增试点若干征管问题的公告》（国家税务总局公告2016第53号）相关规定，售卡人在销售预付卡时取得的资金，不缴纳增值税，可以向购卡人、充值人开具增值税普通发票，不得开具增值税专用发票。当持卡人在超市商户使用购物卡进行消费时，销售方应按照现行规定缴纳增值税，且不得向持卡人开具增值税发票。"}, {"source": "内部审计", "category": "论坛讨论", "title": "国有企“两金”清理工作的心得与思考", "url": "https://bbs.esnai.cn/thread-5495173-1-1.html", "date": "2025-12-11", "content": "国有企“两金”清理工作的心得与思考一、背景与认识 近年来，国有企业“两金”（应收账款和存货）压降工作已成为深化国企改革、提升资产质量的重要抓手。从审计实践来看，“两金”占比过高不仅占用大量资金、增加财务成本，还潜藏资产减值风险和经营隐患。笔者结合“两 ...", "id": "2d11a2b081162cf61d5e45906772f8a1"}, {"source": "内部审计", "category": "论坛讨论", "title": "关于国有企业交付高质量内部审计项目的几点心得", "url": "https://bbs.esnai.cn/thread-5495172-1-1.html", "date": "2025-12-11", "content": "近期公司着力打造高质量内部审计项目，持续关注内部审计项目质量，笔者结合公司近年来推动高质量内部审计项目的实践，就如何系统性提升内部审计项目质量，谈几点心得与思考。一、健全审计治理架构，夯实制度根基，是提升审计质量的前提内部审计的独立性与权威性直接影 ...", "id": "0609e24aa4ec6a97d89aeccbec4ae081"}, {"source": "内部审计", "category": "论坛讨论", "title": "从内审员到企业高管（高管续）谢绝转载十续", "url": "https://bbs.esnai.cn/thread-5495003-1-1.html", "date": "2025-11-28", "content": "接着十 补充续 任何企业都是有痛点的，你也可以简单理解为 老板肯定有头疼的事情或者想解决的问题。找一个自己擅长的，可能未来这个位置的高管位置就是你的了。如果你只是做合规性审计、内控审计、风险识别，哪怕是舞弊调查，那就与高管位置无缘了，因为那仅仅是审计思 ...", "id": "8fd57502d25c18b69c0a9e9b2ca742cf"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是一般纳税人，员工出差、休探亲假，以及公司组织员工外出旅游产生的住宿费，我们都取得了增值税专用发票，请问这些专票能否抵扣进项税额？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5245336/content.html", "date": "2025-11-26", "id": "42d94913b5ab9976a0dec8dbee353028", "content": "答：\n您好！一般纳税人取得的住宿费增值税专用发票，能否抵扣，需分情况处理，具体如下：\n1.可抵扣情形：公司员工因公务出差产生的住宿费，取得的增值税专用发票，其进项税额可以按规定抵扣销项税。这是因为出差住宿属于企业生产经营相关的合理支出，符合进项税抵扣的相关规定。\n2.不可抵扣情形：按照规定，如果住宿费用于集体福利或个人消费，即使取得增值税专用发票，进项税额也不能抵扣。比如员工探亲住宿（属于个人消费）、公司组织员工旅游住宿（属于集体福利），这些情况下的住宿费专票均无法抵扣。\n需要特别提醒的是，若属于不可抵扣情形，即使已认证抵扣，也需在后续纳税申报时做进项税额转出处理，避免税务风险。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是一家科技制造企业，想问一下，在10月份预缴申报时，如何享受研发费用加计扣除优惠？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5244846/content.html", "date": "2025-11-06", "id": "d60dd7b35b96665a51aa7a4ce168b6cc", "content": "答：\n按照政策规定，企业可以在7月申报期、10月申报期和年度汇算清缴期三个时点申报享受研发费用加计扣除优惠政策。在每年10月份预缴申报第三季度（按季预缴）或9月份（按月预缴）企业所得税时，企业可以根据盈亏情况、研发费用核算情况、研发费用金额大小等因素，自主选择是否就当年前三季度研发费用享受加计扣除优惠政策。在10月份预缴申报期没有选择享受研发费用加计扣除优惠政策的，可以在办理当年度企业所得税汇算清缴时统一享受。\n企业享受研发费用加计扣除优惠政策采取“自行判别、申报享受、相关资料留存备查”的办理方式。\n填报报表时应这样操作：\n1.根据实际发生的研发费用支出，计算加计扣除金额，在《中华人民共和国企业所得税月（季）度预缴纳税申报表（A类）》第22行“减：免税收入、减计收入、加计扣除”的明细行次填写“优惠事项名称”和对应金额。\n2.根据享受加计扣除优惠的研发费用情况（上半年或前三季度）填写《研发费用加计扣除优惠明细表》(A107012)。《研发费用加计扣除优惠明细表》（A107012）与规定的其他资料一并留存备查。"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕298号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202602/t20260206_3983472.htm", "date": "2025-11-01", "id": "ae9d15474705ad6c2de0fb8f17745e9b", "content": "财政部行政处罚决定书（财监法〔2025〕298号）\n财监\n法\n〔\n202\n5\n〕\n298\n号\n财政部行政处罚\n决定\n书\n当 事 人：曾剑南\n地    址：北京市朝阳区望京东园四区\n1\n号楼君康人寿大厦\n30\n层\n依照《中华人民共和国会计法》的规定，财政部组织检查组于\n2024\n年对欢瑞世纪联合股份有限公司（以下称欢瑞世纪）会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n欢瑞世纪\n2022\n年在增值税本期实际抵减额为零的情况下，错误计提\n15,404,597.54\n元加计抵减额并确认为其他收益，导致\n2022\n年度多计其他收益\n15,404,597.54\n元。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了\n2017\n年修正的《中华人民共和国会计法》第二十五条、第二十六条第（二）项等有关规定。\n你作为欢瑞世纪主管会计工作负责人，对上述问题负有责任。依据\n2017\n年修正的《中华人民共和国会计法》第四十二条第一款第（三）项的规定，财政部决定给予你罚款\n1\n万元的行政处罚。\n你应在收到本处罚决定书之日起十五日内与财政部北京监管局联系，凭财政部北京监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n5\n年\n11\n月\n1\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕297号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202602/t20260206_3983471.htm", "date": "2025-11-01", "id": "d9dc13543ec0e61b885e4b1b85114827", "content": "财政部行政处罚决定书（财监法〔2025〕297号）\n财监\n法\n〔\n202\n5\n〕\n297\n号\n财政部行政处罚\n决定\n书\n当\n事\n人：\n赵枳程\n地\n址：\n北京市朝阳区望京东园四区\n1\n号楼君康人寿大厦\n30\n层\n依照《中华人民共和国会计法》的规定，财政部组织检查组于\n2024\n年对欢瑞世纪联合股份有限公司（以下称欢瑞世纪）会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n欢瑞世纪\n2022\n年在增值税本期实际抵减额为零的情况下，错误计提\n15,404,597.54\n元加计抵减额并确认为其他收益，导致\n2022\n年度多计其他收益\n15,404,597.54\n元。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了\n2017\n年修正的《中华人民共和国会计法》第二十五条、第二十六条第（二）项等有关规定。\n你作为欢瑞世纪单位负责人，对上述问题负有责任。依据\n2017\n年修正的《中华人民共和国会计法》第四十二条第一款第（三）项的规定，财政部决定给予你罚款\n2\n万元的行政处罚。\n你应在收到本处罚决定书之日起十五日内与财政部北京监管局联系，凭财政部北京监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n5\n年\n11\n月\n1\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕296号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202602/t20260206_3983470.htm", "date": "2025-11-01", "id": "6ad392497dae7626181dfb1b5104883d", "content": "财政部行政处罚决定书（财监法〔2025〕296号）\n财监\n法\n〔\n202\n5\n〕\n296\n号\n财政部行政处罚\n决定\n书\n当 事 人：欢瑞世纪联合股份有限公司\n地    址：\n北京市朝阳区望京东园四区\n1\n号楼君康人寿大厦\n30\n层\n依照《中华人民共和国会计法》的规定，财政部组织检查组于\n2024\n年对你公司会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n你公司\n2022\n年在增值税本期实际抵减额为零的情况下，错误计提\n15,404,597.54\n元加计抵减额并确认为其他收益，导致\n2022\n年度多计其他收益\n15,404,597.54\n元。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了\n2017\n年修正的《中华人民共和国会计法》第二十五条、第二十六条第（二）项等有关规定。\n依据\n2017\n年修正的《中华人民共和国会计法》第四十二条第一款第（三）项的规定，财政部决定给予你公司罚款\n5\n万元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部北京监管局联系，凭财政部北京监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n5\n年\n11\n月\n1\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕295号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202602/t20260206_3983469.htm", "date": "2025-11-01", "id": "6cd2b5d4695643d09003a8794913cdea", "content": "财政部行政处罚决定书（财监法〔2025〕295号）\n财监\n法\n〔\n202\n5\n〕\n295\n号\n财政部行政处罚\n决定\n书\n当 事 人：舒宁\n地    址：\n天津市南开区红旗路\n216\n号天津中环产业园有限公司\nA\n楼南门二层\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于\n2024\n年对立信中联会计师事务所（特殊普通合伙，以下称立信中联所）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n欢瑞世纪联合股份有限公司（以下称欢瑞世纪）\n2022\n年在增值税本期实际抵减额为零的情况下，错误计提\n15,404,597.54\n元加计抵减额并确认为其他收益，导致\n2022\n年度多计其他收益\n15,404,597.54\n元。\n经检查，立信中联所在审计工作中仅获取并检查有关记账凭证，未保持应有的职业怀疑，应发现未发现欢瑞世纪多计其他收益问题，导致立信中联所对欢瑞世纪\n2022\n年度财务报表审计发表的审计意见不恰当。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第二款第（一）项\n，\n不符合《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》第二十二条第一款、第二十八条、第二十九条，《中国注册会计师审计准则第\n1301\n号——审计证据》第十条等有\n关\n规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，财政部决定给予你警告、暂停执行业务\n3\n个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n5\n年\n11\n月\n1\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕294号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202602/t20260206_3983468.htm", "date": "2025-11-01", "id": "8b600c0b7f9ae5c26aaa4bb16760c28d", "content": "财政部行政处罚决定书（财监法〔2025〕294号）\n财监\n法\n〔\n202\n5\n〕\n294\n号\n财政部行政处罚\n决定\n书\n当 事 人：东松\n地    址：\n天津市南开区红旗路\n216\n号天津中环产业园有限公司\nA\n楼南门二层\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于\n2024\n年对立信中联会计师事务所（特殊普通合伙，以下称立信中联所）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n欢瑞世纪联合股份有限公司（以下称欢瑞世纪）\n2022\n年在增值税本期实际抵减额为零的情况下，错误计提\n15,404,597.54\n元加计抵减额并确认为其他收益，导致\n2022\n年度多计其他收益\n15,404,597.54\n元。\n经检查，立信中联所在审计工作中仅获取并检查有关记账凭证，未保持应有的职业怀疑，应发现未发现欢瑞世纪多计其他收益问题，导致立信中联所对欢瑞世纪\n2022\n年度财务报表审计发表的审计意见不恰当。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第二款第（一）项\n，\n不符合《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》第二十二条第一款、第二十八条、第二十九条，《中国注册会计师审计准则第\n1301\n号——审计证据》第十条等有\n关\n规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，财政部决定给予你警告、暂停执行业务\n3\n个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n5\n年\n11\n月\n1\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕293号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202602/t20260206_3983464.htm", "date": "2025-11-01", "id": "395ee41a6d4fcd4e1a52bacb1eab133e", "content": "财政部行政处罚决定书（财监法〔2025〕293号）\n财监\n法\n〔\n202\n5\n〕\n293\n号\n财政部行政处罚\n决定\n书\n当 事 人：立信中联会计师事务所（特殊普通合伙）\n地    址：\n天津市南开区红旗路\n216\n号天津中环产业园有限公司\nA\n楼南门二层\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于\n2024\n年对你所执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、对欢瑞世纪联合股份有限公司（以下称欢瑞世纪）合并财务报表审计未保持职业怀疑，存在职业判断错误\n欢瑞世纪\n2022\n年在增值税本期实际抵减额为零的情况下，错误计提\n15,404,597.54\n元加计抵减额并确认为其他收益，导致\n2022\n年度多计其他收益\n15,404,597.54\n元。\n经检查，你所在审计工作中仅获取并检查有关记账凭证，未保持应有的职业怀疑，应发现未发现欢瑞世纪多计其他收益问题，导致你所对欢瑞世纪\n2022\n年度财务报表审计发表的审计意见不恰当。\n二\n、对天津天保热电有限公司（以下称天保热电）合并财务报表审计程序实施不到位，未识别重大会计差错\n天保热电\n2022\n年度、\n2023\n年度在没有证据可以证明企业能够收到政府经营补贴的情况下，多确认其他收益\n236,240,000\n元、\n237,640,000\n元。\n经检查，你所在审计工作中未保持\n应有的\n职业怀疑，未分析以前年度政府补贴实际到账情况，以判断企业确认其他收益的合理性。\n三\n、对天津荣程联合钢铁集团有限公司（以下称荣程钢铁）合并财务报表实施审计程序不到位，未获取充分适当的审计证据\n（一）你所在对荣程钢铁\n2023\n年度财务报表审计中，未识别荣程钢铁\n2023\n年度存在无依据确认收入\n73,950,000\n元的会计差错。\n荣程钢铁在未实际收到款项且未按已签订协议要求完成考核验收的情况下，\n2023\n年直接计提\n2021\n年\n4\n月至\n2022\n年\n1\n月相关收入\n73,950,000\n元。\n经检查，你所在审计工作中关注到了上述情况，但未保持应有的职业怀疑，未实施进一步审计程序。\n（二）你所在对荣程钢铁\n2023\n年度财务报表审计中，未识别荣程钢铁存在其他应收款少确认坏账损失\n30,000,000\n元的会计差错。\n荣程钢铁\n2023\n年末其他应收款中包含唐山威宇冷轧镀锌金属有限公司\n30,000,000\n元，该公司于\n2019\n年\n7\n月已注销，但企业截至\n2023\n年末仍未计提坏账损失。\n经检查，你所在审计工作中未对长期挂账的往来款予以关注，未获取该笔款项可收回性的支持性文件，导致未识别上述会计差错。\n（三）你所在对荣程钢铁\n2023\n年度财务报表审计中，未识别荣程钢铁\n2023\n年度提前确认其他收益\n25,639,200\n元的会计差错。\n荣程钢铁\n2023\n年将收到的与资产相关的补助收入\n25,639,200\n元一次性确认为其他收益。\n经检查，你所在审计工作中未获取充分、适当的审计证据，未对荣程钢铁的补助收入核算方式作出恰当的职业判断。\n上述问题，导致你所对荣程钢铁\n2023\n年度财务报表审计发表的审计意见不恰当。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第二款第（一）项和第三款、第三十一条，不符合《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》第二十二条第一款、第二十八条、第二十九条，《中国注册会计师审计准则第\n1301\n号——审计证据》第十条等有关规定。\n依据《中华人民共和国注册会计师法》第三十九条第一款的规定，财政部决定给予你所警告、没收欢瑞世纪\n2022\n年度财务报表审计项目违法所得\n1,050,000\n元并处违法所得一倍罚款\n1,050,000\n元、没收荣程钢铁\n2023\n年度财务报表审计项目违法所得\n635,000\n元的行政处罚。\n你所应在收到本处罚决定书之日起十五日内与财政部天津监管局联系，凭财政部天津监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n5\n年\n11\n月\n1\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部列入严重失信主体名单决定书（财监法〔2025〕272 号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202512/t20251230_3980839.htm", "date": "2025-10-17", "id": "a2dc4999605e96b2fe0de30d18181372", "content": "财政部列入严重失信主体名单决定书（财监法〔2025〕272 号）\n财监法〔2025〕272 号\n财政部列入严重失信主体名单决定书\n当 事 人：深圳中炘国际会计师事务所（普通合伙）\n地    址  ：深圳市福田区莲花街道康欣社区北环大道7001号开元大厦29楼\n依照《注册会计师行业严重失信主体名单管理办法》（财政部令第116号，以下简称《办法》）的规定，基于对你所的有关行政处罚，财政部决定将你所列入严重失信主体名单，有关事项如下：\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组对你所执业质量等情况开展了检查，认定你所存在在不具备上市公司审计业务胜任能力、审计程序严重缺失、未编制完成审计工作底稿等情况下出具审计报告等严重违法问题。2024年8月，财政部决定给予你所警告，没收违法所得40.7万元并处罚款127.1万元，吊销执业许可的行政处罚。截至目前，你所仍未缴纳上述罚没款。\n依据《办法》第四条第（七）项的规定，财政部决定将你所列入注册会计师行业严重失信主体名单，实施联合惩戒。依据《办\n法》第十条第一款的规定，列入期限为二年。\n依据《办法》第九条的规定，除依照法律、行政法规规定应当实施的从业限制等管理措施外，财政部还将实施下列管理措施：（一）列为重点监管对象，适当提高抽查的比例和频次，依法严格监管；（二）不适用告知承诺制；（三）不予授予财政部门荣誉称号等表彰奖励。\n依据《办法》第十二条的规定，当事人被列入严重失信主体名单满一年后，符合相关条件的，可以依照《办法》规定向财政部申请提前移出。\n依据《办法》第十七条的规定，如有证据证明公示信息不准确，可以要求财政部进行更正。\n如不服本决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本决定不停止执行。\n财  政  部\n2025年10月17日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部列入严重失信主体名单决定书 （财监法〔2025〕273 号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202511/t20251128_3977680.htm", "date": "2025-10-17", "id": "16a4b2a04b0271ea4c56e428e5b9f840", "content": "财政部列入严重失信主体名单决定书 （财监法〔2025〕273 号）\n财监法〔2025〕273 号\n财政部列入严重失信主体名单决定书\n当 事 人：深圳市度支会计师事务所（普通合伙）\n地    址：深圳市福田区莲花街道金田路4028号荣超经贸中心A309-B32\n依照《注册会计师行业严重失信主体名单管理办法》（财政部令第116号，以下简称《办法》）的规定，基于对你所的有关行政处罚，财政部决定将你所列入严重失信主体名单，有关事项如下：\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组对你所执业质量等情况开展了检查，认定你所存在编造事由出具虚假审计报告等严重违法问题。2024年11月，财政部向你所作出行政处罚决定，给予你所没收违法所得1.19万元并处罚款5.95万元的行政处罚。截至目前，你所仍未缴纳上述罚没款。\n依据《办法》第四条第（七）项的规定，财政部决定将你所列入注册会计师行业严重失信主体名单，实施联合惩戒。依据《办法》第十条第一款的规定，列入期限为二年。除依照法律、行政法规规定应当实施的从业限制等管理措施外，财政部还将依据《办法》第九条的规定，实施其他相关管理措施。\n依据《办法》第十二条的规定，当事人被列入严重失信主体名单满一年后，符合相关条件的，可以依照《办法》规定向财政部申请提前移出。\n依据《办法》第十七条的规定，如有证据证明公示信息不准确，可以要求财政部进行更正。\n如不服本决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本决定不停止执行。\n财  政  部\n2025年10月17日"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是一般纳税人，销售自己使用过的固定资产适用简易计税方法的，如何填写增值税申报表？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5243574/content.html", "date": "2025-10-11", "id": "1c9bc8d04e084e47a96d7c7c8ae6ee9d", "content": "答：\n一般纳税人销售自己使用过的固定资产，符合相关规定的，可以选择适用简易办法依照3%征收率减按2%征收增值税优惠政策，填表方法如下：\n1.将价款按3%征收率换算为不含税销售额，销售额=含税销\n售额÷（1+3%），销项税额=销售额x3%。将销售额、销项税\n额填写至《增值税及附加税费申报表附列资料（一）》第11栏对应的列次。\n2.《增值税减免税申报明细表》的减税项目中“减税性质代码及名称”选择“0001129924”，对应减征的增值税应纳税额按销售额的1%计算填写在《增值税减免税申报明细表》减税项目相应栏次。\n3.《增值税及附加税费申报表》主表第5栏填写“按简易办法计税销售额”，第21栏填写“简易计税办法计算的应纳税额”，第23栏填写“应纳税额减征额”，第24栏填写“应纳税额合计”。填写《增值税及附加税费申报表附列资料（一）》《增值税减免税申报明细表》后，系统会自动生成《增值税及附加税费申报表》主表的数据。"}, {"source": "财政部", "category": "处罚案例", "title": "财政部发布2025年度会计师事务所执业质量检查名单", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250924_3972981.htm", "date": "2025-09-23", "id": "3bbdb7d4e90b0e0ed0502dd055de4f08", "content": "财政部发布2025年度会计师事务所执业质量检查名单\n依照《中华人民共和国注册会计师法》等规定，根据\n202\n5\n年度会计和评估监督检查计划，财政部确定\n4\n0\n家会计师事务所执业质量检查名单，现予发布。\n2025\n年度会计师事务所执业质量检查名单\n（按事务所名称首字母排序）\n序号\n会计师事务所名称\n1\n安永华明会计师事务所（特殊普通合伙）\n2\n北京大地泰华会计师事务所（特殊普通合伙）\n3\n北京德皓国际会计师事务所（特殊普通合伙）\n4\n北京国富会计师事务所（特殊普通合伙）\n5\n北京兴华会计师事务所（特殊普通合伙）\n6\n北京中名国成会计师事务所（特殊普通合伙）\n7\n北京中天恒会计师事务所（特殊普通合伙）\n8\n毕马威华振会计师事务所（特殊普通合伙）\n9\n大华会计师事务所（特殊普通合伙）\n10\n大信会计师事务所（特殊普通合伙）\n11\n德勤华永会计师事务所（特殊普通合伙）\n12\n公证天业会计师事务所\n（特殊普通合伙）\n1\n3\n和信会计师事务所（特殊普通合伙）\n14\n华兴会计师事务所（特殊普通合伙）\n15\n利安达会计师事务所（特殊普通合伙）\n16\n立信会计师事务所（特殊普通合伙）\n17\n立信中联会计师事务所（特殊普通合伙）\n18\n鹏盛会计师事务所（特殊普通合伙）\n19\n普华永道中天会计师事务所（特殊普通合伙）\n20\n容诚会计师事务所（特殊普通合伙）\n21\n上会会计师事务所（特殊普通合伙）\n22\n四川华信（集团）会计师事务所（特殊普通合伙）\n23\n天健会计师事务所（特殊普通合伙）\n24\n天圆全会计师事务所（特殊普通合伙）\n25\n天职国际会计师事务所（特殊普通合伙）\n26\n希格玛会计师事务所（特殊普通合伙）\n27\n信永中和会计师事务所（特殊普通合伙）\n28\n永拓会计师事务所（特殊普通合伙）\n29\n致同会计师事务所（特殊普通合伙）\n30\n中汇会计师事务所（特殊普通合伙）\n31\n中勤万信会计师事务所（特殊普通合伙）\n32\n中瑞诚会计师事务所（特殊普通合伙）\n33\n中审华会计师事务所（特殊普通合伙）\n34\n中审亚太会计师事务所（特殊普通合伙）\n35\n中审众环会计师事务所（特殊普通合伙）\n36\n中喜会计师事务所（特殊普通合伙）\n37\n中兴财光华会计师事务所（特殊普通合伙）\n38\n中兴华会计师事务所（特殊普通合伙）\n39\n中证天通会计师事务所（特殊普通合伙）\n40\n中准会计师事务所（特殊普通合伙）"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕261号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974628.htm", "date": "2025-09-13", "id": "766c91333a672181a677e236d9436a99", "content": "财政部行政处罚决定书（财监法〔2025〕261号）\n财监法〔2025〕261 号\n财政部行政处罚决定书\n当 事 人：王振军\n地    址：北京市朝阳区建国门外大街22号赛特广场五层\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对致同会计师事务所（特殊普通合伙，以下称致同所）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n致同所对亿利洁能股份有限公司（以下称亿利洁能）2022年度财务报表审计出具的审计意见类型不恰当。致同所对亿利洁能2022年度财务报表审计意见为带强调事项段的无保留意见，强调事项之一为“亿利洁能公司2022年12月31日货币资金中存放亿利集团财务有限公司（以下称亿利财务公司）款项余额为389,343.59万元，占期末货币资金比例较高；2022年1—4月存放亿利财务公司款项余额曾超过股东大会审议通过的存放限额。亿利洁能公司大额资金存放亿利财务公司，可能存在流动性、安全性风险。”\n一、致同所在2022年度审计报告出具日前已获知亿利财务公司及其控股股东亿利资源集团有限公司（以下称亿利集团，系亿利洁能控股股东）的重大风险事项\n（一）致同所审计工作底稿“舆情列表—亿利洁能”记录亿利财务公司“会计记账未真实反映业务、内部控制严重违反审慎经营规则，北京银保监局责令其改正，并给予合计100万元罚款的行政处罚”、“亿利财务公司无法偿还到期票据被法院列为被执行人”。\n（二）致同所审计工作底稿中《亿利洁能股份有限公司关于亿利集团财务有限公司的风险持续评估报告》显示，2022年末亿利财务公司流动性比例为1.57%，远低于《企业集团财务公司管理办法》规定的25%目标值。\n（三）致同所审计工作底稿已获取《亿利集团财务有限公司2022年度审计报告》。经检查组根据该审计报告数据测算，2022年末贷款余额占存款余额与实收资本之和的比例为129.70%，远高于《企业集团财务公司管理办法》规定的80%目标值。\n（四）致同所审计工作底稿“专业技术委员会会议记录”显示“公司存放亿利财务公司的款项流动性最终取决于亿利集团的财务状况改善情况。虽然2022年4月之后超限额存款问题已解决，鉴于亿利集团的资金状况尚未明显改善，其所持股票100%质押，上市公司在财务公司存款余额占比仍然较高，本期拟继续对财务公司存款的流动性、安全性问题进行强调”。\n（五）上海证券交易所分别于2022年1月和3月两次向致同所下发了审计风险提示函，2022年5月对亿利洁能下发2021年年度报告的信息披露监管工作函，均高度关注存放亿利财务公司款项的真实性和安全性，并明确指出控股股东存在流动性风险。\n二、亿利洁能大额资金存放亿利财务公司，亿利财务公司主要资产为对亿利集团的放贷资产，亿利财务公司的流动性最终取决于亿利集团。致同所在亿利洁能2022年度财务报表审计中，对亿利财务公司、亿利集团流动性风险，以及对亿利洁能存放亿利财务公司款项、亿利洁能对亿利财务公司投资的减值测试审计程序执行不到位\n（一）审计档案未见重要审计程序对应的审计工作底稿，如对亿利财务公司主要财务数据分析性复核、亿利财务公司及亿利集团诉讼及处罚的分析判断、亿利财务公司存款比例计算、亿利集团保障财务公司流动性措施的核实等。\n（二）未对原北京银保监局对亿利财务公司行政处罚的原因予以落实，审计工作底稿未见对行政处罚、亿利财务公司无法偿还到期票据被法院列为被执行人是否导致亿利洁能2022年度财务报表整体（含存放财务公司款项、对亿利财务公司长期股权投资）存在重大错报的判断过程和依据。\n（三）缺少对亿利财务公司流动性比例、贷款余额占存款余额与实收资本之和的比例异常的分析判断过程。\n（四）《亿利集团信用等级说明》落款日期为2022年6月29日，在2022年度亿利洁能财务报表审计报告日（2023年4月28日）之前近10个月，间隔时间较长，且未归入审计档案。\n（五）亿利集团2023年2月13日《企业信用报告》显示，亿利集团借款正常类188.01亿元、关注类16.60亿元、不良类3.83亿元，逾期借款6.69亿元，致同所未将亿利集团2023年2月13日《企业信用报告》归入审计档案，审计工作底稿未见对亿利集团关注类、不良类、逾期借款产生的原因以及对亿利集团流动性影响的分析判断过程。\n（六）致同所仅获取了亿利集团出具的《亿利资源集团有限公司关于保障财务公司流动性说明》，未见对亿利集团保障亿利财务公司流动性措施的核实资料及记录。\n（七）致同所查询了亿利集团及亿利财务公司舆情、诉讼及行政处罚等公开信息情况，记录在“舆情列表—亿利洁能”审计工作底稿中，底稿记录与实际情况不符。检查组查询同花顺显示：亿利财务公司于2022年1月27日开始被立案限制高消费，在2022年审计报告日前已达到93条；于2022年9月28日开始被公告为失信被执行人，在2022年审计报告日前已达到89条；于2022年9月30日开始被公告终本案件，在2022年审计报告日前已达到76条，涉及未执行金额4,521.50万元。亿利集团于2021年12月10日开始被立案限制高消费，在2022年审计报告日前已达到54条；于2022年6月27日开始被公告终本案件，在2022年审计报告日前已达到9条，涉及未执行金额14,572.55万元。上述情况致同所在审计工作底稿中未予以关注。\n三、亿利洁能2022年度财务报告未恰当列报和披露\n在亿利洁能经审计的2022年度财务报告中，2022年末亿利洁能存放亿利财务公司款项余额389,343.59万元，亿利洁能对亿利财务公司的长期股权投资余额60,076.40万元，均未计提减值，仅在财务报表附注中披露了“公司2021年12月31日货币资金余额中存放财务公司款项金额为512,663.56万元，超过本公司2021年第三次临时股东大会审计通过的《金融服务协议》约定的月最高40亿元限额，截至2022年4月末，存放财务公司款项余额超限部分已收回”，以及“截至2023年4月28日，亿利资源集团持有本公司128,940万股无限售流通股股份，占公司总股本的36.21%，累计质押128,940万股，占其所持公司股份的100%”，未披露亿利财务公司及亿利集团的其他风险事项。\n综上，亿利洁能2022年度合并财务报表层次重要性水平4,377.02万元，实际执行的重要性水平2,626.21万元。致同所在明知亿利财务公司及其控股股东亿利集团存在重大流动性风险的情况下，对亿利洁能存放亿利财务公司款项的安全性、流动性风险，以及对亿利财务公司投资的减值风险的审计程序执行不到位，亿利洁能未对存放亿利财务公司款项及对亿利财务公司的投资计提减值，也未在财务报表附注中充分披露，财务报表整体存在重大错报，因此致同所对亿利洁能2022年度财务报表出具“带强调事项段的无保留意见”不恰当。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、第二款第（三）项和第三款，《会计师事务所执业许可和监督管理办法》第六十条第（一）项，不符合《注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十条，《中国注册会计师审计准则第1502号——在审计报告中发表非无保留意见》第七条，《中国注册会计师审计准则第1503号——在审计报告中增加强调事项段和其他事项段》第六条等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款，《会计师事务所执业许可和监督管理办法》第七十条第一款的规定，财政部决定给予你警告、暂停执行业务3个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕260号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974627.htm", "date": "2025-09-13", "id": "643cf5108ab955cfed3cafca15986bef", "content": "财政部行政处罚决定书（财监法〔2025〕260号）\n财监法〔2025〕260 号\n财政部行政处罚决定书\n当 事 人：赵雷励\n地    址：北京市朝阳区建国门外大街22号赛特广场五层\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对致同会计师事务所（特殊普通合伙，以下称致同所）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n致同所对亿利洁能股份有限公司（以下称亿利洁能）2022年度财务报表审计出具的审计意见类型不恰当。致同所对亿利洁能2022年度财务报表审计意见为带强调事项段的无保留意见，强调事项之一为“亿利洁能公司2022年12月31日货币资金中存放亿利集团财务有限公司（以下称亿利财务公司）款项余额为389,343.59万元，占期末货币资金比例较高；2022年1—4月存放亿利财务公司款项余额曾超过股东大会审议通过的存放限额。亿利洁能公司大额资金存放亿利财务公司，可能存在流动性、安全性风险。”\n一、致同所在2022年度审计报告出具日前已获知亿利财务公司及其控股股东亿利资源集团有限公司（以下称亿利集团，系亿利洁能控股股东）的重大风险事项\n（一）致同所审计工作底稿“舆情列表—亿利洁能”记录亿利财务公司“会计记账未真实反映业务、内部控制严重违反审慎经营规则，北京银保监局责令其改正，并给予合计100万元罚款的行政处罚”、“亿利财务公司无法偿还到期票据被法院列为被执行人”。\n（二）致同所审计工作底稿中《亿利洁能股份有限公司关于亿利集团财务有限公司的风险持续评估报告》显示，2022年末亿利财务公司流动性比例为1.57%，远低于《企业集团财务公司管理办法》规定的25%目标值。\n（三）致同所审计工作底稿已获取《亿利集团财务有限公司2022年度审计报告》。经检查组根据该审计报告数据测算，2022年末贷款余额占存款余额与实收资本之和的比例为129.70%，远高于《企业集团财务公司管理办法》规定的80%目标值。\n（四）致同所审计工作底稿“专业技术委员会会议记录”显示“公司存放亿利财务公司的款项流动性最终取决于亿利集团的财务状况改善情况。虽然2022年4月之后超限额存款问题已解决，鉴于亿利集团的资金状况尚未明显改善，其所持股票100%质押，上市公司在财务公司存款余额占比仍然较高，本期拟继续对财务公司存款的流动性、安全性问题进行强调”。\n（五）上海证券交易所分别于2022年1月和3月两次向致同所下发了审计风险提示函，2022年5月对亿利洁能下发2021年年度报告的信息披露监管工作函，均高度关注存放亿利财务公司款项的真实性和安全性，并明确指出控股股东存在流动性风险。\n二、亿利洁能大额资金存放亿利财务公司，亿利财务公司主要资产为对亿利集团的放贷资产，亿利财务公司的流动性最终取决于亿利集团。致同所在亿利洁能2022年度财务报表审计中，对亿利财务公司、亿利集团流动性风险，以及对亿利洁能存放亿利财务公司款项、亿利洁能对亿利财务公司投资的减值测试审计程序执行不到位\n（一）审计档案未见重要审计程序对应的审计工作底稿，如对亿利财务公司主要财务数据分析性复核、亿利财务公司及亿利集团诉讼及处罚的分析判断、亿利财务公司存款比例计算、亿利集团保障财务公司流动性措施的核实等。\n（二）未对原北京银保监局对亿利财务公司行政处罚的原因予以落实，审计工作底稿未见对行政处罚、亿利财务公司无法偿还到期票据被法院列为被执行人是否导致亿利洁能2022年度财务报表整体（含存放财务公司款项、对亿利财务公司长期股权投资）存在重大错报的判断过程和依据。\n（三）缺少对亿利财务公司流动性比例、贷款余额占存款余额与实收资本之和的比例异常的分析判断过程。\n（四）《亿利集团信用等级说明》落款日期为2022年6月29日，在2022年度亿利洁能财务报表审计报告日（2023年4月28日）之前近10个月，间隔时间较长，且未归入审计档案。\n（五）亿利集团2023年2月13日《企业信用报告》显示，亿利集团借款正常类188.01亿元、关注类16.60亿元、不良类3.83亿元，逾期借款6.69亿元，致同所未将亿利集团2023年2月13日《企业信用报告》归入审计档案，审计工作底稿未见对亿利集团关注类、不良类、逾期借款产生的原因以及对亿利集团流动性影响的分析判断过程。\n（六）致同所仅获取了亿利集团出具的《亿利资源集团有限公司关于保障财务公司流动性说明》，未见对亿利集团保障亿利财务公司流动性措施的核实资料及记录。\n（七）致同所查询了亿利集团及亿利财务公司舆情、诉讼及行政处罚等公开信息情况，记录在“舆情列表—亿利洁能”审计工作底稿中，底稿记录与实际情况不符。检查组查询同花顺显示：亿利财务公司于2022年1月27日开始被立案限制高消费，在2022年审计报告日前已达到93条；于2022年9月28日开始被公告为失信被执行人，在2022年审计报告日前已达到89条；于2022年9月30日开始被公告终本案件，在2022年审计报告日前已达到76条，涉及未执行金额4,521.50万元。亿利集团于2021年12月10日开始被立案限制高消费，在2022年审计报告日前已达到54条；于2022年6月27日开始被公告终本案件，在2022年审计报告日前已达到9条，涉及未执行金额14,572.55万元。上述情况致同所在审计工作底稿中未予以关注。\n三、亿利洁能2022年度财务报告未恰当列报和披露\n在亿利洁能经审计的2022年度财务报告中，2022年末亿利洁能存放亿利财务公司款项余额389,343.59万元，亿利洁能对亿利财务公司的长期股权投资余额60,076.40万元，均未计提减值，仅在财务报表附注中披露了“公司2021年12月31日货币资金余额中存放财务公司款项金额为512,663.56万元，超过本公司2021年第三次临时股东大会审计通过的《金融服务协议》约定的月最高40亿元限额，截至2022年4月末，存放财务公司款项余额超限部分已收回”，以及“截至2023年4月28日，亿利资源集团持有本公司128,940万股无限售流通股股份，占公司总股本的36.21%，累计质押128,940万股，占其所持公司股份的100%”，未披露亿利财务公司及亿利集团的其他风险事项。\n综上，亿利洁能2022年度合并财务报表层次重要性水平4,377.02万元，实际执行的重要性水平2,626.21万元。致同所在明知亿利财务公司及其控股股东亿利集团存在重大流动性风险的情况下，对亿利洁能存放亿利财务公司款项的安全性、流动性风险，以及对亿利财务公司投资的减值风险的审计程序执行不到位，亿利洁能未对存放亿利财务公司款项及对亿利财务公司的投资计提减值，也未在财务报表附注中充分披露，财务报表整体存在重大错报，因此致同所对亿利洁能2022年度财务报表出具“带强调事项段的无保留意见”不恰当。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、第二款第（三）项和第三款，《会计师事务所执业许可和监督管理办法》第六十条第（一）项，不符合《注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十条，《中国注册会计师审计准则第1502号——在审计报告中发表非无保留意见》第七条，《中国注册会计师审计准则第1503号——在审计报告中增加强调事项段和其他事项段》第六条等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款，《会计师事务所执业许可和监督管理办法》第七十条第一款的规定，财政部决定给予你警告、暂停执行业务3个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕259号 ）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974626.htm", "date": "2025-09-13", "id": "d67b4c93f9137347f12380cf024bbeee", "content": "财政部行政处罚决定书（财监法〔2025〕259号 ）\n财监法〔2025〕259 号\n财政部行政处罚决定书\n当 事 人：天瑞集团股份有限公司\n地    址：河南省汝州市广成东路南侧\n依照《中华人民共和国会计法》的规定，财政部组织检查组于2024年对你公司会计信息质量开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、错误调整信用减值损失，虚增2023年度利润406,022,449.90元\n天瑞集团股份有限公司（以下称天瑞集团）2023年未经评估，直接对子公司天瑞水泥集团有限公司（以下称天瑞水泥）2023年的应收款项预期信用损失率进行调整，并按照调整后的预期信用损失率直接在2023年度集团合并报表中冲回预期信用损失663,755,658.16元，其中包括以前年度预期信用损失501,312,238.37元。上述调整不属于会计估计变更，实际为前期会计差错更正，应作追溯调整，导致天瑞集团2023年度多冲销以前年度信用减值损失501,312,238.37元，考虑递延所得税因素后，天瑞集团2023年度财务报表虚增利润406,022,449.90元。\n二、未对已涉诉债权928,597,837.00元评估预期信用损失并计提坏账准备\n天瑞集团及其子公司天瑞（国际）控股有限公司（以下称天瑞国际）、煜阔有限公司截至2023年12月31日应收中国山水水泥集团有限公司及其关联方中国山水水泥集团（香港）有限公司928,597,837.00元。天瑞集团已于2023年6月28日针对上述应收债权向香港特别行政区高等法院原讼法庭提起诉讼，截至2023年12月31日，案件正在审理中，天瑞集团对以上已涉诉债权未按照披露的会计政策计提坏账，亦未在债权进入诉讼阶段后评估预期信用损失并计提坏账准备，导致天瑞集团2023年财务报表少计坏账准备46,429,891,85元，虚增利润46,429,891,85元。\n三、冲销未到期票据导致同时少计资产及负债2,735,472,700.00元\n天瑞集团截至2023年12月31日未到期且已贴现银行承兑汇票余额4,079,300,000.00元，其中，保证金承兑余额2,735,472,700.00元，敞口承兑余额1,343,827,300.00元。天瑞集团2023年将保证金承兑余额2,735,472,700.00元与预付账款科目对冲，导致天瑞集团2023年度财务报表少计预付账款2,735,472,700.00元，少计应付票据2,735,472,700.00元。\n四、少计提折旧和摊销6,207,228.21元\n天瑞集团下属子公司天瑞水泥在2013年至2017年通过并购方式收购了12家企业（包括辽阳天瑞诚兴水泥有限公司、辽阳天瑞威企水泥有限公司、信阳天瑞水泥有限公司、海城市第一水泥有限公司、大连天瑞金海岸水泥有限公司、庄河天瑞水泥有限公司、盘锦金润水泥有限责任公司、平顶山天瑞姚电水泥有限公司、河南永安水泥有限责任公司、天瑞新登郑州水泥有限公司、辽宁辽东水泥集团有限公司、辽阳天瑞辽塔水泥有限公司），并购时对被收购企业的固定资产、无形资产进行了重新评估，按照年限平均法，2023年该固定资产应计提折旧和摊销6,207,228.21元，但天瑞水泥仅在合并层面做了资产增值调整，未就增值部分计提固定资产折旧和无形资产摊销。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了2017年修正的《中华人民共和国会计法》第十三条第一款，不符合《企业会计准则第28号——会计政策、会计估计变更和差错更正》第八条第一款及第二款、第十一条第一款及第二款、第十二条第一款，《企业会计准则第22号——金融工具确认和计量》第四十七条第一款、第五十九条第一款、第六十条，《企业会计准则4号——固定资产》第十四条第一款，《企业会计准则6号——无形资产》第十七条第一款等有关规定。\n依据2017年修正的《中华人民共和国会计法》第四十二条第一款第（五）项的规定，财政部决定给予你公司罚款5万元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部河南监管局联系，凭财政部河南监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕258号 ）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974625.htm", "date": "2025-09-13", "id": "2091cf3299e50f39833703c8e170aa6b", "content": "财政部行政处罚决定书（财监法〔2025〕258号 ）\n财监法〔2025〕258 号\n财政部行政处罚决定书\n当 事 人：武汉碧水集团有限公司\n地    址：武汉市江岸区沿江大道江滩32号\n依照《中华人民共和国会计法》的规定，财政部组织检查组于2024年对你公司会计信息质量开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、合并财务报表内部交易抵消不充分，多计收入79,119,383.39元，多计成本68,865,692.22元，多计利润10,253,691.17元，多计在建工程10,253,691.17元\n武汉碧水集团有限公司（以下称碧水集团)“长江碧道慢行系统改造工程”及“南湖生态活水项目补水通道工程”由碧水集团子公司武汉市奥鑫市政建设公司（以下称奥鑫市政）等公司组成联合体实施，子公司武汉海绵城市建设有限公司“东湖港、东杨港雨水生态排口改造工程”由奥鑫市政实施。碧水集团及武汉海绵城市建设有限公司分别按照向奥鑫市政等联合体支付的工程款确认在建工程，奥鑫市政2023年对以上项目按照项目形象进度累计确认收入79,119,383.39元，累计确认成本68,865,692.22元。碧水集团合并财务报表对上述内部交易事项未抵消，导致2023年度合并财务报表多计收入79,119,383.39元，多计成本68,865,692.22元，多计利润10,253,691.17元，多计在建工程10,253,691.17元。\n二、未及时确认2018年—2022年自有资金存款利息收入，2023年将以前年度利息收入从其他应付款科目转入当期财务费用—利息收入科目，多计2023年度利润65,376,103.43元\n碧水集团2018年1月1日至2022年12月31日自有资金（土地收益金及资本金等）共取得存款利息收入65,376,103.43元，碧水集团在收到存款利息当期计入“其他应付款—其他—其他”科目，未及时进行财务核算，2023年经政府审计并委托中介机构审定后，直接转入当期财务费用—利息收入科目，未采用追溯重述法更正上述重要的前期差错，导致碧水集团2023年度合并财务报表多计利润65,376,103.43元。\n三、已办理财务竣工决算审计的项目未办理资产移交手续，导致2023年资产82,759,067.99元未及时入账\n碧水集团下属子公司武汉水资源发展投资有限公司（以下称水投公司）2023年其他非流动资产科目列示官桥湖（庙湖）污泥清除工程项目成本76,372,978.41元，列示菱角湖清淤工程项目成本6,386,089.58元。以上项目资金均由政府拨付到位，项目已完工并完成财务竣工决算，因尚未办理资产移交手续，导致其他非流动资产科目列示的上述项目成本合计82,759,067.99元未及时入账。\n四、已办理财务竣工决算审计的项目未对核减利息及时进行调账，导致2023年度合并财务报表多计资产361,777,030.47元\n水投公司其他非流动资产中包含待核销基建支出核减利息361,777,030.47元。水投公司未根据财务竣工决算的情况，对待核销基建支出进行账务调整，导致2023年度合并财务报表多计资产361,777,030.47元。\n五、少计以前年度支出5,216,276.07元，多计2023年年初未分配利润和资产总额5,216,276.07元\n水投公司其他非流动资产中包含待核销基建支出建设单位管理费5,216,276.07元，系以前年度超概算的征地拆迁工作经费被审减后未及时核算冲销，导致2023年度合并财务报表多计年初未分配利润和资产总额5,216,276.07元。\n六、少计以前年度支出448,895.97元，多计2023年年初未分配利润和资产总额\n水投公司其他非流动资产中包含待核销基建支出建设单位管理费147,093.31元，其他建设费用301,802.66元，系以前年度未被纳入项目建设成本的建设单位管理费及其他建设费用，导致2023年度合并财务报表少计以前年度支出448,895.97元，多计2023年年初未分配利润和资产总额。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了2017年修正的《中华人民共和国会计法》第十三条第一款，不符合《企业会计准则——基本准则》第九条、第十二条、第十九条等有关规定。\n依据2017年修正的《中华人民共和国会计法》第四十二条第一款第（五）项的规定，财政部决定给予你公司罚款5万元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部湖北监管局联系，凭财政部湖北监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕257号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974624.htm", "date": "2025-09-13", "id": "00476d6e51218254e8dff69a80c6e9f0", "content": "财政部行政处罚决定书（财监法〔2025〕257号）\n财监法〔2025〕257 号\n财政部行政处罚决定书\n当 事 人：胡萌莹\n地    址：河南自贸试验区郑州片区（郑东）东风南路与金水东路交叉口绿地新都会9号楼9层906\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对河南守正创新会计师事务所（普通合伙）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、合并抵销复核程序执行不到位。对武汉碧水集团有限公司（以下称碧水集团）2023年度合并财务报表涉及的内部交易抵销情况未执行复核程序，导致未识别企业2023年度合并财务报表多计收入79,119,383.39元，多计成本68,865,692.22元，多计利润10,253,691.17元，多计在建工程10,253,691.17元的会计差错。\n二、财务费用审计程序执行不到位。对碧水集团2023年度将2018年—2022年收到的自有资金利息65,376,103.43元从其他应付款转入2023年度财务费用—利息收入事项，未实施审计程序并取得相关审计证据，导致未识别企业2023年度合并财务报表多计利润65,376,103.43元的会计差错。\n三、审计调整依据不充分。对碧水集团子公司武汉水资源发展投资有限公司审计中，未关注相关费用未及时办理财务核算手续的合理性，未在审计底稿中记录调整原因及依据，直接调整部分其他应收款科目金额到其他非流动资产科目。上述调整包括：已办理财务竣工决算审计但未办理资产移交手续的无实体资产清淤工程建设支出82,759,067.99元，已办理财务竣工决算被审减的利息支出361,777,030.47元、超概征地拆迁工作经费5,216,276.07元、超概建设单位管理费及其他建设费用448,895.97元，导致未识别企业2023年度合并财务报表多计资产450,201,270.50元的会计差错。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述事项违反了《中华人民共和国注册会计师法》第二十一条第一款，不符合《中国注册会计师审计准则第1301号——审计证据》第十条，《中国注册会计师审计准则第1323号——关联方》第四条第二款等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，财政部决定给予你警告、暂停执行业务3个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕256号 ）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974623.htm", "date": "2025-09-13", "id": "931cd9d267e592948477c5622f474173", "content": "财政部行政处罚决定书（财监法〔2025〕256号 ）\n财监法〔2025〕256 号\n财政部行政处罚决定书\n当 事 人：张帅\n地    址：河南自贸试验区郑州片区（郑东）东风南路与金水东路交叉口绿地新都会9号楼9层906\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对河南守正创新会计师事务所（普通合伙）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、合并抵销复核程序执行不到位。对武汉碧水集团有限公司（以下称碧水集团）2023年度合并财务报表涉及的内部交易抵销情况未执行复核程序，导致未识别企业2023年度合并财务报表多计收入79,119,383.39元，多计成本68,865,692.22元，多计利润10,253,691.17元，多计在建工程10,253,691.17元的会计差错。\n二、财务费用审计程序执行不到位。对碧水集团2023年度将2018年—2022年收到的自有资金利息65,376,103.43元从其他应付款转入2023年度财务费用—利息收入事项，未实施审计程序并取得相关审计证据，导致未识别企业2023年度合并财务报表多计利润65,376,103.43元的会计差错。\n三、审计调整依据不充分。对碧水集团子公司武汉水资源发展投资有限公司审计中，未关注相关费用未及时办理财务核算手续的合理性，未在审计底稿中记录调整原因及依据，直接调整部分其他应收款科目金额到其他非流动资产科目。上述调整包括：已办理财务竣工决算审计但未办理资产移交手续的无实体资产清淤工程建设支出82,759,067.99元，已办理财务竣工决算被审减的利息支出361,777,030.47元、超概征地拆迁工作经费5,216,276.07元、超概建设单位管理费及其他建设费用448,895.97元，导致未识别企业2023年度合并财务报表多计资产450,201,270.50元的会计差错。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述事项违反了《中华人民共和国注册会计师法》第二十一条第一款，不符合《中国注册会计师审计准则第1301号——审计证据》第十条，《中国注册会计师审计准则第1323号——关联方》第四条第二款等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，财政部决定给予你警告、暂停执行业务3个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕255号 ）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974622.htm", "date": "2025-09-13", "id": "a553f89aee0e84560031c51768fc4405", "content": "财政部行政处罚决定书（财监法〔2025〕255号 ）\n财监法〔2025〕255 号\n财政部行政处罚决定书\n当 事 人：张君君\n地    址：河南自贸试验区郑州片区（郑东）东风南路与金水东路交叉口绿地新都会9号楼9层906\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对河南守正创新会计师事务所（特殊普通合伙）执业质量等情况开展了检查。现将检查发现的主要问题和行政处罚决定如下：\n一、对天瑞集团股份有限公司（以下称天瑞集团）子公司天瑞水泥集团有限公司调整2023年度应收款项预期信用损失率事项复核及评估程序不到位，通过审计调整错误冲销属于以前年度的信用减值损失，导致企业2023年度财务报表虚增利润。\n二、对天瑞集团已涉诉债权减值测试程序执行不到位，审计底稿未说明不计提坏账准备的原因，未取得不计提坏账准备的审计证据。\n三、对天瑞集团应付票据余额情况审计程序执行不到位，通过审计调整错误冲销未到期票据，导致企业2023年度财务报表同时少计资产及负债。\n四、对天瑞集团并购资产评估增值部分的折旧和摊销未执行复核与重新测算程序，未识别企业2023年度财务报表少计提折旧及摊销的会计差错。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述事项违反了《中华人民共和国注册会计师法》第二十一条第一款，不符合《中国注册会计师审计准则第1301号——审计证据》第十条，《企业会计准则第28号——会计政策、会计估计变更和差错更正》第八条第一款及第二款、第十一条第一款及第二款、第十二条第一款及第二款、第十四条，《中国注册会计师审计准则第1321号——会计估计和相关披露的审计》第八条、第十条第一款、第三十一条，《中国注册会计师审计准则第1141号——财务报表审计中与舞弊相关的责任》第九条等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，财政部决定给予你警告、暂停执行业务3个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕254号 ）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974621.htm", "date": "2025-09-13", "id": "a6102498afa61fe0054d4d4ba371974d", "content": "财政部行政处罚决定书（财监法〔2025〕254号 ）\n财监法〔2025〕254 号\n财政部行政处罚决定书\n当 事 人：李强龙\n地    址：河南自贸试验区郑州片区（郑东）东风南路与金水东路交叉口绿地新都会9号楼9层906\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对河南守正创新会计师事务所（特殊普通合伙）执业质量等情况开展了检查。现将检查发现的主要问题和行政处罚决定如下：\n一、对天瑞集团股份有限公司（以下称天瑞集团）子公司天瑞水泥集团有限公司调整2023年度应收款项预期信用损失率事项复核及评估程序不到位，通过审计调整错误冲销属于以前年度的信用减值损失，导致企业2023年度财务报表虚增利润。\n二、对天瑞集团已涉诉债权减值测试程序执行不到位，审计底稿未说明不计提坏账准备的原因，未取得不计提坏账准备的审计证据。\n三、对天瑞集团应付票据余额情况审计程序执行不到位，通过审计调整错误冲销未到期票据，导致企业2023年度财务报表同时少计资产及负债。\n四、对天瑞集团并购资产评估增值部分的折旧和摊销未执行复核与重新测算程序，未识别企业2023年度财务报表少计提折旧及摊销的会计差错。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述事项违反了《中华人民共和国注册会计师法》第二十一条第一款，不符合《中国注册会计师审计准则第1301号——审计证据》第十条，《企业会计准则第28号——会计政策、会计估计变更和差错更正》第八条第一款及第二款、第十一条第一款及第二款、第十二条第一款及第二款、第十四条，《中国注册会计师审计准则第1321号——会计估计和相关披露的审计》第八条、第十条第一款、第三十一条，《中国注册会计师审计准则第1141号——财务报表审计中与舞弊相关的责任》第九条等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，财政部决定给予你警告、暂停执行业务3个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕253号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974620.htm", "date": "2025-09-13", "id": "e334592ec6deec03f93425531481620d", "content": "财政部行政处罚决定书（财监法〔2025〕253号）\n财监法〔2025〕253 号\n财政部行政处罚决定书\n当 事 人：河南守正创新会计师事务所（特殊普通合伙）\n地    址：河南自贸试验区郑州片区（郑东）东风南路与金水东路交叉口绿地新都会9号楼9层906\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对你所执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、内部管理问题\n（一）会计师事务所被非注册会计师实际控制。你所行政总裁秦喜胜2019年因出具证明文件重大失实罪受到刑事处罚，同年注销注册会计师证书。经查，自2020年起秦喜胜任你所行政总裁，具有经营决策、财务管理、人事安排等方面的最终决定权。\n（二）通过虚构业务协作等虚假经济业务事项进行会计核算，将大部分业务收入转移到秦喜胜控制的河南守正创新税务师事务所有限公司及多家管理咨询公司。\n（三）合伙人机制不健全。合伙协议中未约定合伙人管理委员会成员的具体任职条件，未设立发展战略委员会、薪酬与考核委员会等。\n二、执业质量问题\n（一）你所对天瑞集团股份有限公司（以下称天瑞集团）2023年度财务报表审计存在如下问题：\n1.对天瑞集团子公司天瑞水泥集团有限公司调整2023年度应收款项预期信用损失率事项复核及评估程序不到位，通过审计调整错误冲销属于以前年度的信用减值损失，导致企业2023年度财务报表虚增利润。\n2.对天瑞集团已涉诉债权减值测试程序执行不到位，审计底稿未说明不计提坏账准备的原因，未取得不计提坏账准备的审计证据。\n3.对天瑞集团应付票据余额情况审计程序执行不到位，通过审计调整错误冲销未到期票据，导致企业2023年度财务报表同时少计资产及负债。\n4.对天瑞集团并购资产评估增值部分的折旧和摊销未执行复核与重新测算程序，未识别企业2023年度财务报表少计提折旧及摊销的会计差错。\n（二）你所未到现场执行审计程序，直接利用其他会计师事务所审计资料，向武汉碧水集团有限公司（以下称碧水集团）等69户企业2023年度财务报表出具无保留意见审计报告。经延伸检查，对碧水集团2023年度财务报表审计存在如下问题：\n1.合并抵销复核程序执行不到位。对碧水集团2023年度合并财务报表涉及的内部交易抵销情况未执行复核程序，导致未识别企业2023年度合并财务报表多计收入79,119,383.39元，多计成本68,865,692.22元，多计利润10,253,691.17元，多计在建工程10,253,691.17元的会计差错。\n2.财务费用审计程序执行不到位。对碧水集团2023年度将2018年—2022年收到的自有资金利息65,376,103.43元从其他应付款转入2023年度财务费用—利息收入事项，未实施审计程序并取得相关审计证据，导致未识别企业2023年度合并财务报表多计利润65,376,103.43元的会计差错。\n3.审计调整依据不充分。对碧水集团子公司武汉水资源发展投资有限公司审计中，未关注相关费用未及时办理财务核算手续的合理性，未在审计底稿中记录调整原因及依据，直接调整部分其他应收款科目金额到其他非流动资产科目。上述调整包括：已办理财务竣工决算审计但未办理资产移交手续的无实体资产清淤工程建设支出82,759,067.99元，已办理财务竣工决算被审减的利息支出361,777,030.47元、超概征地拆迁工作经费5,216,276.07元、超概建设单位管理费及其他建设费用448,895.97元，导致未识别企业2023年度合并财务报表多计资产450,201,270.50元的会计差错。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述事项违反了《中华人民共和国注册会计师法》第二十一条第一款、第二十二条、第三十一条、第三十二条，2017年修订的《中华人民共和国会计法》第九条第一款及第二款，《会计师事务所执业许可和监督管理办法》第五十条，不符合《中国注册会计师审计准则第1323号——关联方》第四条第二款，《中国注册会计师审计准则第1301号——审计证据》第十条，《企业会计准则第28号——会计政策、会计估计变更和差错更正》第八条第一款及第二款、第十一条第一款及第二款、第十二条第一款及第二款、第十四条，《中国注册会计师审计准则第1321号——会计估计和相关披露的审计》第八条、第十条第一款、第三十一条，《中国注册会计师审计准则第1141号——财务报表审计中与舞弊相关的责任》第九条第一款等有关规定。\n依据《中华人民共和国注册会计师法》第三十九条第一款和《会计师事务所执业许可和监督管理办法》第六十七条第一款等规定，财政部决定给予你所警告，没收天瑞集团2023年度财务报表审计项目违法所得116.5万元；没收碧水集团2023年度财务报表审计项目违法所得14万元；暂停经营业务三个月的行政处罚。\n你所应在收到本处罚决定书之日起十五日内与财政部河南监管局联系，凭财政部河南监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕252号 ）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974619.htm", "date": "2025-09-13", "id": "429b44a802ff4c2e3db1289e13945162", "content": "财政部行政处罚决定书（财监法〔2025〕252号 ）\n财监法〔2025〕252 号\n财政部行政处罚决定书\n当 事 人：李亮\n地    址：湖南省长沙市浏阳经济技术开发区康里路1号\n依照《中华人民共和国会计法》的规定，财政部组织检查组于2024年对湖南南新制药股份有限公司（以下称南新制药）会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n南新制药所属子公司广州南新制药有限公司（以下称广州南新制药）2023年12月以冒名签收的出货单确认2023年度营业收入28,296,301.07元、结转2023年度营业成本4,412,163.38元。其中广州南新制药编号80034413号、80034414号的出货单存在跨年度发货、确认营业收入药品批号与客户验收入库药品批号不一致等情况。根据南新制药“本公司在履行了合同中的履约义务，即在客户取得相关商品控制权时确认收入。取得相关商品控制权是指能够主导该商品的使用并从中获得几乎全部的经济利益。本公司化学药品制剂销售属于在某一时点履行的履约义务，在客户签收、已收取价款或取得收款权利且相关的经济利益很可能流入时确认收入”的会计政策、广州南新制药“供方负责把产品交由承运方运至需方指定的收货点，在货物交给承运方且到达指定位置前产生的费用和风险由供方承担”“到货后需方应当场验收，并填写供方产品签收单，提货人的签收行为即视为需方已确认收货”的销售合同条款约定，广州南新制药多计2023年度营业收入24,539,733.46元、营业成本3,839,043.33元。\n南新制药存在不同地区或相同地区不同时间点推广活动照片一致、登记参会人员姓名相同但签字笔迹差异较大等情况。经查，广州南新制药以虚假事项列支学术推广费37,000,000.00元。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了2017年修正的《中华人民共和国会计法》第九条第一款、第二款，第十三条第三款，不符合《企业会计准则——基本准则》第九条、第十二条、第十五条第二款、第十九条等有关规定。\n你作为南新制药主管会计工作负责人，对上述问题负有责任。依据2017年修正的《中华人民共和国会计法》第四十三条第二款的规定，财政部决定给予你罚款3万元的行政处罚。\n你应在收到本处罚决定书之日起十五日内与财政部湖南监管局联系，凭财政部湖南监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕251号 ）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974618.htm", "date": "2025-09-13", "id": "21a0c3be97c79c06d9b75db9e6878a69", "content": "财政部行政处罚决定书（财监法〔2025〕251号 ）\n财监法〔2025〕251 号\n财政部行政处罚决定书\n当 事 人：张世喜\n地    址：湖南省长沙市浏阳经济技术开发区康里路1号\n依照《中华人民共和国会计法》的规定，财政部组织检查组于2024年对湖南南新制药股份有限公司（以下称南新制药）会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n南新制药所属子公司广州南新制药有限公司（以下称广州南新制药）2023年12月以冒名签收的出货单确认2023年度营业收入28,296,301.07元、结转2023年度营业成本4,412,163.38元。其中广州南新制药编号80034413号、80034414号的出货单存在跨年度发货、确认营业收入药品批号与客户验收入库药品批号不一致等情况。根据南新制药“本公司在履行了合同中的履约义务，即在客户取得相关商品控制权时确认收入。取得相关商品控制权是指能够主导该商品的使用并从中获得几乎全部的经济利益。本公司化学药品制剂销售属于在某一时点履行的履约义务，在客户签收、已收取价款或取得收款权利且相关的经济利益很可能流入时确认收入”的会计政策、广州南新制药“供方负责把产品交由承运方运至需方指定的收货点，在货物交给承运方且到达指定位置前产生的费用和风险由供方承担”“到货后需方应当场验收，并填写供方产品签收单，提货人的签收行为即视为需方已确认收货”的销售合同条款约定，广州南新制药多计2023年度营业收入24,539,733.46元、营业成本3,839,043.33元。\n南新制药存在不同地区或相同地区不同时间点推广活动照片一致、登记参会人员姓名相同但签字笔迹差异较大等情况。经查，广州南新制药以虚假事项列支学术推广费37,000,000.00元。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了2017年修正的《中华人民共和国会计法》第九条第一款、第二款、第十三条第三款，不符合《企业会计准则——基本准则》第九条、第十二条、第十五条第二款、第十九条等有关规定。\n你作为南新制药单位负责人，对上述问题负有责任。依据2017年修正的《中华人民共和国会计法》第四十三条第二款的规定，财政部决定给予你罚款5万元的行政处罚。\n你应在收到本处罚决定书之日起十五日内与财政部湖南监管局联系，凭财政部湖南监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕250号 ）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974617.htm", "date": "2025-09-13", "id": "f11689e6186dc2e59fa7264f48faca6c", "content": "财政部行政处罚决定书（财监法〔2025〕250号 ）\n财监法〔2025〕250 号\n财政部行政处罚决定书\n当 事 人：湖南南新制药股份有限公司\n地    址：湖南省长沙市浏阳经济技术开发区康里路1号\n依照《中华人民共和国会计法》的规定，财政部组织检查组于2024年对你公司会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n你公司所属子公司广州南新制药有限公司（以下称广州南新制药）2023年12月以冒名签收的出货单确认2023年度营业收入28,296,301.07元、结转2023年度营业成本4,412,163.38元。其中广州南新制药编号80034413号、80034414号的出货单存在跨年度发货、确认营业收入药品批号与客户验收入库药品批号不一致等情况。根据你公司“本公司在履行了合同中的履约义务，即在客户取得相关商品控制权时确认收入。取得相关商品控制权是指能够主导该商品的使用并从中获得几乎全部的经济利益。本公司化学药品制剂销售属于在某一时点履行的履约义务，在客户签收、已收取价款或取得收款权利且相关的经济利益很可能流入时确认收入”的会计政策、广州南新制药“供方负责把产品交由承运方运至需方指定的收货点，在货物交给承运方且到达指定位置前产生的费用和风险由供方承担”“到货后需方应当场验收，并填写供方产品签收单，提货人的签收行为即视为需方已确认收货”的销售合同条款约定，广州南新制药多计2023年度营业收入24,539,733.46元、营业成本3,839,043.33元。\n你公司存在不同地区或相同地区不同时间点推广活动照片一致、登记参会人员姓名相同但签字笔迹差异较大等情况。经查，广州南新制药以虚假事项列支学术推广费37,000,000.00元。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了2017年修正的《中华人民共和国会计法》第九条第一款、第二款、第十三条第三款，不符合《企业会计准则——基本准则》第九条、第十二条、第十五条第二款、第十九条等有关规定。\n依据2017年修正的《中华人民共和国会计法》第四十三条第二款的规定，财政部决定给予你公司罚款10万元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部湖南监管局联系，凭财政部湖南监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕249号 ）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974616.htm", "date": "2025-09-13", "id": "00c18a2dcfe8ab619c12216318a297d0", "content": "财政部行政处罚决定书（财监法〔2025〕249号 ）\n财监法〔2025〕249 号\n财政部行政处罚决定书\n当 事 人：王娟\n地    址：湖南省长沙市雨花区迎新路499号御溪国际大厦3栋15楼\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对大华会计师事务所（特殊普通合伙，以下称大华所）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n湖南南新制药股份有限公司（以下称南新制药）所属子公司广州南新制药有限公司（以下称广州南新制药）2023年12月以冒名签收的出货单确认2023年度营业收入28,296,301.07元、结转2023年度营业成本4,412,163.38元。其中广州南新制药编号80034413号、80034414号的出货单存在跨年度发货、确认营业收入药品批号与客户验收入库药品批号不一致等情况。根据南新制药“本公司在履行了合同中的履约义务，即在客户取得相关商品控制权时确认收入。取得相关商品控制权是指能够主导该商品的使用并从中获得几乎全部的经济利益。本公司化学药品制剂销售属于在某一时点履行的履约义务，在客户签收、已收取价款或取得收款权利且相关的经济利益很可能流入时确认收入”的会计政策、广州南新制药“供方负责把产品交由承运方运至需方指定的收货点，在货物交给承运方且到达指定位置前产生的费用和风险由供方承担”“到货后需方应当场验收，并填写供方产品签收单，提货人的签收行为即视为需方已确认收货”的销售合同条款约定，广州南新制药多计2023年度营业收入24,539,733.46元、营业成本3,839,043.33元。\n南新制药存在不同地区或相同地区不同时间点推广活动照片一致、登记参会人员姓名相同但签字笔迹差异较大等情况。经查，广州南新制药以虚假事项列支学术推广费37,000,000.00元。\n大华所在南新制药2023年年报项目审计中，未保持应有的职业怀疑，存在职业判断错误。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第三款，不符合《中国注册会计师鉴证业务基本准则》第二十八条第一款、第二款，《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十八条、第三十条，《中国注册会计师审计准则第1301号——审计证据》第十条、第十五条第（一）项，《中国注册会计师审计准则第1231号——针对评估的重大错报风险采取的应对措施》第五条、第七条第（一）（二）项等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，财政部决定给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕248号 ）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974615.htm", "date": "2025-09-13", "id": "b6121b7c03940a81f46648b1109e9a6d", "content": "财政部行政处罚决定书（财监法〔2025〕248号 ）\n财监法〔2025〕248 号\n财政部行政处罚决定书\n当 事 人：黄海波\n地    址：湖南省长沙市芙蓉区远大一路280号湘域相遇北栋13楼\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对大华会计师事务所（特殊普通合伙，以下称大华所）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n湖南南新制药股份有限公司（以下称南新制药）所属子公司广州南新制药有限公司（以下称广州南新制药）2023年12月以冒名签收的出货单确认2023年度营业收入28,296,301.07元、结转2023年度营业成本4,412,163.38元。其中广州南新制药编号80034413号、80034414号的出货单存在跨年度发货、确认营业收入药品批号与客户验收入库药品批号不一致等情况。根据南新制药“本公司在履行了合同中的履约义务，即在客户取得相关商品控制权时确认收入。取得相关商品控制权是指能够主导该商品的使用并从中获得几乎全部的经济利益。本公司化学药品制剂销售属于在某一时点履行的履约义务，在客户签收、已收取价款或取得收款权利且相关的经济利益很可能流入时确认收入”的会计政策、广州南新制药“供方负责把产品交由承运方运至需方指定的收货点，在货物交给承运方且到达指定位置前产生的费用和风险由供方承担”“到货后需方应当场验收，并填写供方产品签收单，提货人的签收行为即视为需方已确认收货”的销售合同条款约定，广州南新制药多计2023年度营业收入24,539,733.46元、营业成本3,839,043.33元。\n南新制药存在不同地区或相同地区不同时间点推广活动照片一致、登记参会人员姓名相同但签字笔迹差异较大等情况。经查，广州南新制药以虚假事项列支学术推广费37,000,000.00元。\n大华所在南新制药2023年年报项目审计中，未保持应有的职业怀疑，存在职业判断错误。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第三款，不符合《中国注册会计师鉴证业务基本准则》第二十八条第一款、第二款，《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十八条、第三十条，《中国注册会计师审计准则第1301号——审计证据》第十条、第十五条第（一）项，《中国注册会计师审计准则第1231号——针对评估的重大错报风险采取的应对措施》第五条、第七条第（一）（二）项等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，财政部决定给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕247号 ）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974614.htm", "date": "2025-09-13", "id": "bb615e3cda3c490897bc454831096426", "content": "财政部行政处罚决定书（财监法〔2025〕247号 ）\n财监法〔2025〕247 号\n财政部行政处罚决定书\n当 事 人：山东泰山钢铁集团有限公司\n地    址：山东省济南市莱芜区鲁中西大街157号\n依照《中华人民共和国会计法》的规定，财政部组织检查组于2024年对你公司会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n一、将委托加工业务按销售业务核算，多计收入559,916.91万元\n你公司将矿石矿粉以及高炉煤气、蒸汽等交付山东泰威冶金材料制造有限公司（以下称泰威），用于加工生产烧结矿、球团后购回，交付环节不计量不结算，泰威对原材料的采购和产成品的销售均无自主权。你公司该项业务实质属于委托加工，交付环节不构成销售。2023年，你公司因该项业务多计收入559,916.91万元。\n二、账实不符，多计存货171,049.43万元\n2023年末，根据你公司存货实物账与库存盘点表，库存商品与未开票的发出商品合计金额为151,201.59万元。你公司经审计的财务报表及账面显示2023年末存货余额为322,251.02万元，比实际多计171,049.43万元。\n三、未识别交易实质，少计金融负债42,208万元\n2019年，山东省新旧动能转换浙大网新高端装备产业母基金合伙企业（有限合伙，以下称新旧动能，现更名为枣庄人才新旧动能转换产业投资合伙企业（有限合伙））出资60,000万元，认缴山东泰山不锈钢有限公司（以下称泰山不锈钢）40%股权。同年，你公司与新旧动能签订股权回购协议，约定投资款到位之日起5年内按投资本金加每年5%的收益率回购，回购价不因泰山不锈钢资产变化等其他任何事由调整。你公司未恰当识别交易实质，将其作为权益工具核算。截至2023年末，扣除已回购部分，你公司合并报表层面，少计金融负债42,208万元。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了2017年修正的《中华人民共和国会计法》第九条、第二十五条、第二十六条第（一）（二）项，不符合《企业会计准则——基本准则》第十二条、第十六条、《企业会计准则第14号——收入》第四条等有关规定。\n依据2017年修正的《中华人民共和国会计法》第四十二条第一款第（四）项的规定，财政部决定给予你公司罚款5万元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部山东监管局联系，凭财政部山东监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕246号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974613.htm", "date": "2025-09-13", "id": "ffb07256d2f958059c4145eed2af14e5", "content": "财政部行政处罚决定书（财监法〔2025〕246号）\n财监法〔2025〕246 号\n财政部行政处罚决定书\n当 事 人：赵欣\n地    址：北京市西城区阜成门外大街2号22层A24\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对中兴财光华会计师事务所（特殊普通合伙，以下称中兴财光华所）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、未保持职业怀疑，职业判断存在错误，未发现多计收入的重大会计差错\n山东泰山钢铁集团有限公司（以下称泰山钢铁）将矿石矿粉以及高炉煤气、蒸汽等交付山东泰威冶金材料制造有限公司（以下称泰威），用于加工生产烧结矿、球团后购回，交付环节不计量不结算，泰威对原材料的采购和产成品的销售均无自主权。泰山钢铁该项业务实质属于委托加工，交付环节不构成销售。2023年，泰山钢铁因该项业务多计收入559,916.91万元。中兴财光华所在对泰山钢铁2023年度财务报表审计中，在同时对泰威提供审计服务的情况下，未识别委托加工业务实质，未发现收入确认的重大错报，存在职业判断错误。\n二、未保持职业怀疑，职业判断存在错误，未发现多计存货的重大会计差错\n2023年末，泰山钢铁经审计的财务报表及账面显示的存货余额为322,251.02万元，比实际多计171,049.43万元。中兴财光华所在对泰山钢铁2023年度财务报表审计中，执行监盘程序时将监盘数量与财务账存货数量核对，未对核对中发现的重大账实差异保持职业怀疑，未执行进一步审计程序，未发现多计存货的重大错报。\n三、未保持职业怀疑，职业判断存在错误，未发现少计金融负债的重大会计差错\n2019年，山东省新旧动能转换浙大网新高端装备产业母基金合伙企业（有限合伙，以下称新旧动能，现更名为枣庄人才新旧动能转换产业投资合伙企业（有限合伙））出资60,000万元，认缴山东泰山不锈钢有限公司（以下称泰山不锈钢）40%股权。同年，泰山钢铁与新旧动能签订股权回购协议，约定投资款到位之日起5年内按投资本金加每年5%的收益率回购，回购价不因泰山不锈钢资产变化等其他任何事由调整。泰山钢铁未恰当识别交易实质，将其作为权益工具核算。截至2023年末，扣除已回购部分，泰山钢铁合并报表层面少计金融负债42,208万元。中兴财光华所在对泰山钢铁2023年度财务报表审计中，获取了投资协议，但未恰当分析协议条款，未识别新旧动能的投资名为股权实为债权的交易实质，未发现泰山钢铁少计金融负债的重大错报，职业判断存在错误。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第三款，不符合《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十八条、第二十九条，《中国注册会计师审计准则第1301号—审计证据》第十条等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，财政部决定给予你警告、暂停执行业务1个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕245号 ）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974612.htm", "date": "2025-09-13", "id": "fbf50cb5b54ef604e21b4cbf10a13622", "content": "财政部行政处罚决定书（财监法〔2025〕245号 ）\n财监法〔2025〕245 号\n财政部行政处罚决定书\n当 事 人：崔志彪\n地    址：北京市西城区阜成门外大街2号22层A24\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对中兴财光华会计师事务所（特殊普通合伙，以下称中兴财光华所）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、未保持职业怀疑，职业判断存在错误，未发现多计收入的重大会计差错\n山东泰山钢铁集团有限公司（以下称泰山钢铁）将矿石矿粉以及高炉煤气、蒸汽等交付山东泰威冶金材料制造有限公司（以下称泰威），用于加工生产烧结矿、球团后购回，交付环节不计量不结算，泰威对原材料的采购和产成品的销售均无自主权。泰山钢铁该项业务实质属于委托加工，交付环节不构成销售。2023年，泰山钢铁因该项业务多计收入559,916.91万元。中兴财光华所在对泰山钢铁2023年度财务报表审计中，在同时对泰威提供审计服务的情况下，未识别委托加工业务实质，未发现收入确认的重大错报，存在职业判断错误。\n二、未保持职业怀疑，职业判断存在错误，未发现多计存货的重大会计差错\n2023年末，泰山钢铁经审计的财务报表及账面显示的存货余额为322,251.02万元，比实际多计171,049.43万元。中兴财光华所在对泰山钢铁2023年度财务报表审计中，执行监盘程序时将监盘数量与财务账存货数量核对，未对核对中发现的重大账实差异保持职业怀疑，未执行进一步审计程序，未发现多计存货的重大错报。\n三、未保持职业怀疑，职业判断存在错误，未发现少计金融负债的重大会计差错\n2019年，山东省新旧动能转换浙大网新高端装备产业母基金合伙企业（有限合伙，以下称新旧动能，现更名为枣庄人才新旧动能转换产业投资合伙企业（有限合伙））出资60,000万元，认缴山东泰山不锈钢有限公司（以下称泰山不锈钢）40%股权。同年，泰山钢铁与新旧动能签订股权回购协议，约定投资款到位之日起5年内按投资本金加每年5%的收益率回购，回购价不因泰山不锈钢资产变化等其他任何事由调整。泰山钢铁未恰当识别交易实质，将其作为权益工具核算。截至2023年末，扣除已回购部分，泰山钢铁合并报表层面少计金融负债42,208万元。中兴财光华所在对泰山钢铁2023年度财务报表审计中，获取了投资协议，但未恰当分析协议条款，未识别新旧动能的投资名为股权实为债权的交易实质，未发现泰山钢铁少计金融负债的重大错报，职业判断存在错误。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第三款，不符合《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十八条、第二十九条，《中国注册会计师审计准则第1301号—审计证据》第十条等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，财政部决定给予你警告、暂停执行业务1个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕244号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974611.htm", "date": "2025-09-13", "id": "3100f4429eefe62475e1289f9adeffe8", "content": "财政部行政处罚决定书（财监法〔2025〕244号）\n财监法〔2025〕244 号\n财政部行政处罚决定书\n当 事 人：张慧\n地    址：亳州市谯城区亳芜园区斯力泰集团（汤王大道与月季路交叉口）\n依照《中华人民共和国会计法》的规定，财政部组织检查组于2024年对天马（安徽）国药科技股份有限公司（以下称天马国药）会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n一、虚构出口业务主要原材料人参（包括林下参）和虫草花的采购及领用，虚增2023年度营业成本24,047.01万元\n2023年度天马国药账面出口业务采购并领用的主要原材料为人参（包括林下参，下同）和虫草花，其中人参124.13吨，金额46,881.12万元；虫草花138.59吨，金额10,559.20万元，合计金额为57,440.32万元。\n经现场检查，针对出口业务采购的人参和虫草花原材料存在以下问题：\n1.天马国药提供的仓库台账及检验台账，均无这两类原材料对应的出入库及检验记录。\n2.天马国药仓储人员均未收到或未经手过这两类原材料，且部分凭证后附的出入库单据并非本人签字。\n3.天马国药的批生产记录、生产设备，账面出口业务产量远超公司产能，且提供的批生产记录相互矛盾，如投料及投水量远大于提取罐容积、同一时段内同一个提取罐提取不同产成品的提取物等。\n4.天马国药无法提供与这两类原材料采购相关的原始送货单据及与代收代购人就订单、价格、送货、结算与催款等业务过程的支持性文件。\n根据天马国药提供的批生产记录，针对投料及投水量远大于提取罐容积这一情况，经抽样检查并测算，天马国药虚构人参（包括林下参）原材料采购金额14,877.14万元，虫草花原材料采购金额9,130.24万元，虚增营业成本金额24,047.01万元。\n二、虚列2023年度研发支出—材料费用363.73万元\n根据天马国药提供的手工版《成品出入库分类账》和2023年底盘点表，截至2023年12月31日，部分产成品（当归、麸炒白术等合计119种）尚在仓库，但财务账面已做研发领用（涉及中药材反复搓揉的清洗系统的研制、出口压片糖果的技术研发与产业化等10个研发项目），天马国药虚列研发支出—材料费363.73万元。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了2017年修正的《中华人民共和国会计法》第九条、第二十五条、第二十六条第（一）（三）项，不符合《企业会计准则——基本准则》第五条、第十二条等有关规定。\n你作为天马国药的财务负责人，对上述问题负有责任。依据2017年修正的《中华人民共和国会计法》第四十三条第二款的规定，财政部决定给予你罚款2万元的行政处罚。\n你应在收到本处罚决定书之日起十五日内与财政部安徽监管局联系，凭财政部安徽监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕243号 ）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974610.htm", "date": "2025-09-13", "id": "8f99ff48a4aed33598a32e8f4502e564", "content": "财政部行政处罚决定书（财监法〔2025〕243号 ）\n财监法〔2025〕243 号\n财政部行政处罚决定书\n当 事 人：马绍桓\n地    址：亳州市谯城区亳芜园区斯力泰集团（汤王大道与月季路交叉口）\n依照《中华人民共和国会计法》的规定，财政部组织检查组于2024年对天马（安徽）国药科技股份有限公司（以下称天马国药）会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n一、虚构出口业务主要原材料人参（包括林下参）和虫草花的采购及领用，虚增2023年度营业成本24,047.01万元\n2023年度天马国药账面出口业务采购并领用的主要原材料为人参（包括林下参，下同）和虫草花，其中人参124.13吨，金额46,881.12万元；虫草花138.59吨，金额10,559.20万元，合计金额为57,440.32万元。\n经现场检查，针对出口业务采购的人参和虫草花原材料存在以下问题：\n1.天马国药提供的仓库台账及检验台账，均无这两类原材料对应的出入库及检验记录。\n2.天马国药仓储人员均未收到或未经手过这两类原材料，且部分凭证后附的出入库单据并非本人签字。\n3.天马国药的批生产记录、生产设备，账面出口业务产量远超公司产能，且提供的批生产记录相互矛盾，如投料及投水量远大于提取罐容积、同一时段内同一个提取罐提取不同产成品的提取物等。\n4.天马国药无法提供与这两类原材料采购相关的原始送货单据及与代收代购人就订单、价格、送货、结算与催款等业务过程的支持性文件。\n根据天马国药提供的批生产记录，针对投料及投水量远大于提取罐容积这一情况，经抽样检查并测算，天马国药虚构人参（包括林下参）原材料采购金额14,877.14万元，虫草花原材料采购金额9,130.24万元，虚增营业成本金额24,047.01万元。\n二、虚列2023年度研发支出—材料费用363.73万元\n根据天马国药提供的手工版《成品出入库分类账》和2023年底盘点表，截至2023年12月31日，部分产成品（当归、麸炒白术等合计119种）尚在仓库，但财务账面已做研发领用（涉及中药材反复搓揉的清洗系统的研制、出口压片糖果的技术研发与产业化等10个研发项目），天马国药虚列研发支出—材料费363.73万元。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了2017年修正的《中华人民共和国会计法》第九条、第二十五条、第二十六条第（一）（三）项，不符合《企业会计准则——基本准则》第五条、第十二条等有关规定。\n你作为天马国药的单位负责人，对上述问题负有责任。依据2017年修正的《中华人民共和国会计法》第四十三条第二款的规定，财政部决定给予你罚款4万元的行政处罚。\n你应在收到本处罚决定书之日起十五日内与财政部安徽监管局联系，凭财政部安徽监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕242号 ）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974609.htm", "date": "2025-09-13", "id": "e90b6aa043be8d8540f013f5bfee4fc4", "content": "财政部行政处罚决定书（财监法〔2025〕242号 ）\n财监法〔2025〕242 号\n财政部行政处罚决定书\n当 事 人：天马（安徽）国药科技股份有限公司\n地    址：亳州市谯城区亳芜园区斯力泰集团（汤王大道与月季路交叉口）\n依照《中华人民共和国会计法》的规定，财政部组织检查组于2024年对你公司会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n一、虚构出口业务主要原材料人参（包括林下参）和虫草花的采购及领用，虚增2023年度营业成本24,047.01万元\n2023年度你公司账面出口业务采购并领用的主要原材料为人参（包括林下参，下同）和虫草花，其中人参124.13吨，金额46,881.12万元；虫草花138.59吨，金额10,559.20万元，合计金额为57,440.32万元。\n经现场检查，针对出口业务采购的人参和虫草花原材料存在以下问题：\n1.你公司提供的仓库台账及检验台账，均无这两类原材料对应的出入库及检验记录。\n2.你公司仓储人员均未收到或未经手过这两类原材料，且部分凭证后附的出入库单据并非本人签字。\n3.你公司的批生产记录、生产设备，账面出口业务产量远超公司产能，且提供的批生产记录相互矛盾，如投料及投水量远大于提取罐容积、同一时段内同一个提取罐提取不同产成品的提取物等。\n4.你公司无法提供与这两类原材料采购相关的原始送货单据及与代收代购人就订单、价格、送货、结算与催款等业务过程的支持性文件。\n根据你公司提供的批生产记录，针对投料及投水量远大于提取罐容积这一情况，经抽样检查并测算，你公司虚构人参（包括林下参）原材料采购金额14,877.14万元，虫草花原材料采购金额9,130.24万元，虚增营业成本金额24,047.01万元。\n二、虚列2023年度研发支出—材料费用363.73万元\n根据你公司提供的手工版《成品出入库分类账》和2023年底盘点表，截至2023年12月31日，部分产成品（当归、麸炒白术等合计119种）尚在仓库，但财务账面已做研发领用（涉及中药材反复搓揉的清洗系统的研制、出口压片糖果的技术研发与产业化等10个研发项目），你公司虚列研发支出—材料费363.73万元。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了2017年修正的《中华人民共和国会计法》第九条、第二十五条、第二十六条第（一）（三）项，不符合《企业会计准则——基本准则》第五条、第十二条等有关规定。\n依据2017年修正的《中华人民共和国会计法》第四十三条第二款的规定，财政部决定给予你公司罚款8万元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部安徽监管局联系，凭财政部安徽监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕241号 ）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974608.htm", "date": "2025-09-13", "id": "02167929f450b133b08d2cb68317643b", "content": "财政部行政处罚决定书（财监法〔2025〕241号 ）\n财监法〔2025〕241 号\n财政部行政处罚决定书\n当 事 人：于晓平\n地    址：北京市朝阳区通惠家园惠润园3号楼1层110室\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对北京兴荣华会计师事务所（普通合伙，以下称兴荣华所）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n兴荣华所对天马（安徽）国药科技股份有限公司（以下称天马国药）2023年度财务报表审计，出具的审计报告意见类型不恰当。\n一、未保持应有的职业怀疑，未执行必要的审计程序，导致未识别天马国药虚构出口业务主要原材料人参（包括林下参）和虫草花的采购及领用，虚增2023年度营业成本24,047.01万元的重大错报\n2023年天马国药虚构部分原材料采购，涉及虚增营业成本金额约24,047.01万元，具体如下：\n1.天马国药提供的仓库台账及检验台账，均无这两类原材料对应的出入库及检验记录。\n2.天马国药仓储人员均未收到或未经手过这两类原材料，且部分凭证后附的出入库单据并非本人签字。\n3.天马国药的批生产记录、生产设备，账面出口业务产量远超公司产能，且提供的批生产记录相互矛盾，如投料及投水量远大于提取罐容积、同一时段内同一个提取罐提取不同产成品的提取物等。\n4.天马国药无法提供与这两类原材料采购相关的原始送货单据及与代收代购人就订单、价格、送货、结算与催款等业务过程的支持性文件。\n根据天马国药提供的批生产记录，针对投料及投水量远大于提取罐容积这一情况，经抽样检查并测算，天马国药虚构人参（包括林下参）原材料采购金额14,877.14万元，虫草花原材料采购金额9,130.24万元，虚增营业成本金额24,047.01万元。\n兴荣华所在对天马国药2023年度财务报表审计中，底稿仅执行采购分析、部分凭证检查及函证程序，未保持应有的职业怀疑，未对账面采购数据与仓库台账和检验台账的差异予以关注，未针对采购真实性、付款流水等进行核查，导致未发现天马国药虚构部分原材料采购的情况。\n二、未保持应有的职业怀疑，未执行必要的审计程序，未发现被审计单位虚列研发费用363.73万元的重大错报\n根据天马国药提供的手工版《成品出入库分类账》和2023年底盘点表，截至2023年12月31日，部分产成品（当归、麸炒白术等合计119种）尚在仓库，但财务账面已做研发领用（涉及中药材反复搓揉的清洗系统的研制、出口压片糖果的技术研发与产业化等10个研发项目），天马国药虚列研发支出—材料费363.73万元。\n兴荣华所在审计期间未保持应有的职业怀疑，未对研发费用变动予以关注，未对研发领料进行检查，未发现天马国药虚列研发费用的重大错报。\n上述事项导致天马国药虚增2023年度营业成本24,047.01万元，虚列研发费用363.73万元，影响金额具有重大性。天马国药2023年度财务报表层次重要性水平157.50万元，实际执行的重要性水平为78.75万元，兴荣华所出具标准无保留意见审计报告不恰当。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、第二款第（四）项、第三款，《会计师事务所执业许可和监督管理办法》第六十条第（一）项，不符合《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十条第一款、第二十八条，《中国注册会计师审计准则第1231号——针对评估的重大错报风险采取的应对措施》第二十六条，《中国注册会计师审计准则第1501号——对财务报表形成审计意见和出具审计报告》第十九条等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款，《会计师事务所执业许可和监督管理办法》第七十条第一款的规定，财政部决定给予你警告、暂停执行业务3个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕240号 ）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974607.htm", "date": "2025-09-13", "id": "cd6851f75c1cefddeb0670cd8332a95c", "content": "财政部行政处罚决定书（财监法〔2025〕240号 ）\n财监法〔2025〕240 号\n财政部行政处罚决定书\n当 事 人：尚华\n地    址：北京市朝阳区通惠家园惠润园3号楼1层110室\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对北京兴荣华会计师事务所（普通合伙，以下称兴荣华所）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n兴荣华所对天马（安徽）国药科技股份有限公司（以下称天马国药）2023年度财务报表审计，出具的审计报告意见类型不恰当。\n一、未保持应有的职业怀疑，未执行必要的审计程序，导致未识别天马国药虚构出口业务主要原材料人参（包括林下参）和虫草花的采购及领用，虚增2023年度营业成本24,047.01万元的重大错报\n2023年天马国药虚构部分原材料采购，涉及虚增营业成本金额约24,047.01万元，具体如下：\n1.天马国药提供的仓库台账及检验台账，均无这两类原材料对应的出入库及检验记录。\n2.天马国药仓储人员均未收到或未经手过这两类原材料，且部分凭证后附的出入库单据并非本人签字。\n3.天马国药的批生产记录、生产设备，账面出口业务产量远超公司产能，且提供的批生产记录相互矛盾，如投料及投水量远大于提取罐容积、同一时段内同一个提取罐提取不同产成品的提取物等。\n4.天马国药无法提供与这两类原材料采购相关的原始送货单据及与代收代购人就订单、价格、送货、结算与催款等业务过程的支持性文件。\n根据天马国药提供的批生产记录，针对投料及投水量远大于提取罐容积这一情况，经抽样检查并测算，天马国药虚构人参（包括林下参）原材料采购金额14,877.14万元，虫草花原材料采购金额9,130.24万元，虚增营业成本金额24,047.01万元。\n兴荣华所在对天马国药2023年度财务报表审计中，底稿仅执行采购分析、部分凭证检查及函证程序，未保持应有的职业怀疑，未对账面采购数据与仓库台账和检验台账的差异予以关注，未针对采购真实性、付款流水等进行核查，导致未发现天马国药虚构部分原材料采购的情况。\n二、未保持应有的职业怀疑，未执行必要的审计程序，未发现被审计单位虚列研发费用363.73万元的重大错报\n根据天马国药提供的手工版《成品出入库分类账》和2023年底盘点表，截至2023年12月31日，部分产成品（当归、麸炒白术等合计119种）尚在仓库，但财务账面已做研发领用（涉及中药材反复搓揉的清洗系统的研制、出口压片糖果的技术研发与产业化等10个研发项目），天马国药虚列研发支出—材料费363.73万元。\n兴荣华所在审计期间未保持应有的职业怀疑，未对研发费用变动予以关注，未对研发领料进行检查，未发现天马国药虚列研发费用的重大错报。\n上述事项导致天马国药虚增2023年度营业成本24,047.01万元，虚列研发费用363.73万元，影响金额具有重大性。天马国药2023年度财务报表层次重要性水平157.50万元，实际执行的重要性水平为78.75万元，兴荣华所出具标准无保留意见审计报告不恰当。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、第二款第（四）项、第三款，《会计师事务所执业许可和监督管理办法》第六十条第（一）项，不符合《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十条第一款、第二十八条，《中国注册会计师审计准则第1231号——针对评估的重大错报风险采取的应对措施》第二十六条，《中国注册会计师审计准则第1501号——对财务报表形成审计意见和出具审计报告》第十九条等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款，《会计师事务所执业许可和监督管理办法》第七十条第一款的规定，财政部决定给予你警告、暂停执行业务3个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕239号 ）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974606.htm", "date": "2025-09-13", "id": "fd2c76e3d65d27d69b03040a118ead48", "content": "财政部行政处罚决定书（财监法〔2025〕239号 ）\n财监法〔2025〕239 号\n财政部行政处罚决定书\n当 事 人：北京兴荣华会计师事务所（普通合伙）\n地    址：北京市朝阳区通惠家园惠润园3号楼1层110室\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对你所执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n你所对天马（安徽）国药科技股份有限公司（以下称天马国药）2023年度财务报表审计，出具的审计报告意见类型不恰当。\n一、未保持应有的职业怀疑，未执行必要的审计程序，导致未识别天马国药虚构出口业务主要原材料人参（包括林下参）和虫草花的采购及领用，虚增2023年度营业成本24,047.01万元的重大错报\n2023年天马国药虚构部分原材料采购，涉及虚增营业成本金额约24,047.01万元，具体如下：\n1.天马国药提供的仓库台账及检验台账，均无这两类原材料对应的出入库及检验记录。\n2.天马国药仓储人员均未收到或未经手过这两类原材料，且部分凭证后附的出入库单据并非本人签字。\n3.天马国药的批生产记录、生产设备，账面出口业务产量远超公司产能，且提供的批生产记录相互矛盾，如投料及投水量远大于提取罐容积、同一时段内同一个提取罐提取不同产成品的提取物等。\n4.天马国药无法提供与这两类原材料采购相关的原始送货单据及与代收代购人就订单、价格、送货、结算与催款等业务过程的支持性文件。\n根据天马国药提供的批生产记录，针对投料及投水量远大于提取罐容积这一情况，经抽样检查并测算，天马国药虚构人参（包括林下参）原材料采购金额14,877.14万元，虫草花原材料采购金额9,130.24万元，虚增营业成本金额24,047.01万元。\n你所在对天马国药2023年度财务报表审计中，底稿仅执行采购分析、部分凭证检查及函证程序，未保持应有的职业怀疑，未对账面采购数据与仓库台账和检验台账的差异予以关注，未针对采购真实性、付款流水等进行核查，导致未发现天马国药虚构部分原材料采购的情况。\n二、未保持应有的职业怀疑，未执行必要的审计程序，未发现被审计单位虚列研发费用363.73万元的重大错报\n根据天马国药提供的手工版《成品出入库分类账》和2023年底盘点表，截至2023年12月31日，部分产成品（当归、麸炒白术等合计119种）尚在仓库，但财务账面已做研发领用（涉及中药材反复搓揉的清洗系统的研制、出口压片糖果的技术研发与产业化等10个研发项目），天马国药虚列研发支出-材料费363.73万元。\n你所在审计期间未保持应有的职业怀疑，未对研发费用变动予以关注，未对研发领料进行检查，未发现天马国药虚列研发费用的重大错报。\n上述事项导致天马国药虚增2023年度营业成本24,047.01万元，虚列研发费用363.73万元，影响金额具有重大性。天马国药2023年度财务报表层次重要性水平157.50万元，实际执行的重要性水平为78.75万元，你所出具标准无保留意见审计报告不恰当。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、第二款第（四）项、第三款、第三十一条，《会计师事务所执业许可和监督管理办法》第六十条第（一）项，不符合《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十条第一款、第二十八条，《中国注册会计师审计准则第1231号——针对评估的重大错报风险采取的应对措施》第二十六条，《中国注册会计师审计准则第1501号——对财务报表形成审计意见和出具审计报告》第十九条等有关规定。\n依据《中华人民共和国注册会计师法》第三十九条第一款，《会计师事务所执业许可和监督管理办法》第六十七条第一款的规定，财政部决定给予你所警告、没收违法所得13万元并处罚款39万元的行政处罚。\n你所应在收到本处罚决定书之日起十五日内与财政部北京监管局联系，凭财政部北京监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕238号 ）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974605.htm", "date": "2025-09-13", "id": "72b614dab154a894418a43af625c6cf4", "content": "财政部行政处罚决定书（财监法〔2025〕238号 ）\n财监法〔2025〕238 号\n财政部行政处罚决定书\n当 事 人：中化环境大气治理股份有限公司\n地    址：北京丰台区汽车博物馆西路10号院丰台创新中心E2号楼8层\n依照《中华人民共和国会计法》的规定，财政部组织检查组于2024年对你公司会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n一、伪造设备验收单提前确认收入\n你公司于2023年3月与万华化学（蓬莱）有限公司（以下称万华蓬莱）签订项目承包合同，约定交付标的为3套RTO设备，实际交付时间为2024年4月，2023年底3套RTO设备尚未组装完成，不具备交付条件，不满足收入确认条件。你公司伪造万华蓬莱项目“设备验收单”确认主营业务收入17,019,399.8元，确认主营业务成本12,919,153.38元。\n二、多计研发费用，少计成本6,229,695.56元\n你公司将与长春市春城投资发展集团有限公司（现更名为长春市热力（集团）有限责任公司）签订的《春投集团清洁取暖超低排放改造工程（工程总承包）合同》涉及的2023年直接成本6,229,695.56元，计入2023年你公司“适用于催化裂化装置烟气脱硫除尘超低排放的技术研究”研发项目研发费用—直接材料费，导致2023年多计研发费用、少计主营业务成本6,229,695.56元。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了2017年修正的《中华人民共和国会计法》第三条、第九条、第十三条第三款、第二十五条、第二十六条第（二）项，不符合《企业会计准则——基本准则》第九条、第十二条、第十九条，《企业会计准则第14号——收入》第四条第一款、第二款等有关规定。\n依据2017年修正的《中华人民共和国会计法》第四十二条第一款第（三）项、第四十三条第二款的规定，财政部决定给予你公司罚款8万元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部北京监管局联系，凭财政部北京监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕237号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974604.htm", "date": "2025-09-13", "id": "335294a46ca766d9efd3cc98f40a77a1", "content": "财政部行政处罚决定书（财监法〔2025〕237号）\n财监法〔2025〕237 号\n财政部行政处罚决定书\n当 事 人：常州亚邦制药有限公司\n地    址：常州市金坛区良常东路6号\n依照《中华人民共和国会计法》的规定，财政部组织检查组于2024年对你公司会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n一、向不同会计资料使用者提供编制依据不一致的财务会计报告\n你公司2024年向不同的会计资料使用者提供编制依据不一致的财务会计报告，同一年度两份财务会计报告载有的长期股权投资、所有者权益等方面的金额存在明显较大差异。\n二、虚列反担保代偿损失\n你公司对应由子公司亚邦医药股份有限公司承担的反担保代偿损失，在经审计并认可的2022年度单体财务报表中，予以确认列报，虚增营业外支出65,559,787.33元，导致当年利润总额和净利润均由盈利转为亏损；在经审计的2023年度单体财务报表中，虚增营业外收入65,559,787.33元，导致虚增当年利润总额和净利润。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了2017年修正的《中华人民共和国会计法》第二十条第二款、第二十五条、第二十六条第（一）项，不符合《企业会计准则——基本准则》第五条、第十二条等有关规定。\n依据2017年修正的《中华人民共和国会计法》第四十二条第一款第（六）项、第四十三条第二款的规定，财政部决定给予你公司罚款8万元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部江苏监管局联系，凭财政部江苏监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕236号 ）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974603.htm", "date": "2025-09-13", "id": "0004c0f8265cfd8109a7199e6c6d0f10", "content": "财政部行政处罚决定书（财监法〔2025〕236号 ）\n财监法〔2025〕236 号\n财政部行政处罚决定书\n当 事 人：肖煜颢\n地    址：南京市建邺区江东中路215号11楼\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对天健会计师事务所（特殊普通合伙，以下称天健所）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、顺应委托人要求，发表不恰当审计意见\n常州亚邦制药有限公司（以下称亚邦制药）对应由子公司亚邦医药股份有限公司（以下称亚邦股份）承担的反担保代偿损失，在经审计的2022年度母公司单体财务报表中，予以确认列报，虚增营业外支出65,559,787.33元，导致当年利润总额和净利润均由盈利转为亏损；在经审计的2023年度母公司单体财务报表中，虚增营业外收入65,559,787.33元，导致虚增当年利润总额和净利润。同时，亚邦股份2022年少确认营业外支出、2023年多确认营业外支出和少确认以前年度损益。\n天健所江苏分所在亚邦制药和亚邦股份2022年度和2023年度财务报表审计中，明知亚邦制药没有义务承担子公司亚邦股份反担保代偿损失65,559,787.33元，且亚邦制药对此也未作账务处理的情况下，顺应亚邦制药不合理要求，审计错误调整导致虚增母公司亚邦制药2022年营业外支出和2023年营业外收入。同时，审计未调整亚邦股份2022年少确认营业外支出、2023年多确认营业外支出和少确认以前年度损益。\n二、审计错误调整预计负债和营业外支出\n2020年，亚邦制药与其他三方担保人为他方借款人向银行借款共同提供担保。因借款人未按时偿还到期借款，根据法院2023年1月《民事判决书》和当年4月《执行裁定书》，亚邦制药承担连带清偿责任，涉及金额35,713,280.61元，但对由此产生的代偿损失，未进行合理估计和账务处理，少确认2022年营业外支出和预计负债。\n2023年12月，亚邦制药与其他担保人签署和解协议，约定亚邦制药承担上述全部债务的45%，其他担保人承担55%。亚邦制药于2023年9月至2024年3月，支付代偿款共计17,431,088.31元。法院于2024年4月7日出具结案通知书。\n天健所江苏分所在亚邦制药2022年度财务报表审计中，未充分考虑其他三方担保人的偿还能力，全额确认了该代偿损失35,958,728.16元。在亚邦制药2023年度财务报表审计中，未根据和解协议、上年经审计的财务报表调整情况及期后实际支付代偿款情况，审计未调减2022年多确认的预计负债，导致多列报预计负债和以前年度损失。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第二款第（一）项，不符合《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十八条、第二十九条、第三十条，《中国注册会计师审计准则第1301号——审计证据》第十条等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，财政部决定给予你警告、暂停执行业务3个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕235号 ）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974601.htm", "date": "2025-09-13", "id": "a8e185d3de44494c27d6dd2b61b511b1", "content": "财政部行政处罚决定书（财监法〔2025〕235号 ）\n财监法〔2025〕235 号\n财政部行政处罚决定书\n当 事 人：陈振伟\n地    址：南京市建邺区江东中路215号11楼\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对天健会计师事务所（特殊普通合伙，以下称天健所）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、顺应委托人要求，发表不恰当审计意见\n常州亚邦制药有限公司（以下称亚邦制药）对应由子公司亚邦医药股份有限公司（以下称亚邦股份）承担的反担保代偿损失，在经审计的2022年度母公司单体财务报表中，予以确认列报，虚增营业外支出65,559,787.33元，导致当年利润总额和净利润均由盈利转为亏损；在经审计的2023年度母公司单体财务报表中，虚增营业外收入65,559,787.33元，导致虚增当年利润总额和净利润。同时，亚邦股份2022年少确认营业外支出、2023年多确认营业外支出和少确认以前年度损益。\n天健所江苏分所在亚邦制药和亚邦股份2022年度和2023年度财务报表审计中，明知亚邦制药没有义务承担子公司亚邦股份反担保代偿损失65,559,787.33元，且亚邦制药对此也未作账务处理的情况下，顺应亚邦制药不合理要求，审计错误调整导致虚增母公司亚邦制药2022年营业外支出和2023年营业外收入。同时，审计未调整亚邦股份2022年少确认营业外支出、2023年多确认营业外支出和少确认以前年度损益。\n二、审计错误调整预计负债和营业外支出\n2020年，亚邦制药与其他三方担保人为他方借款人向银行借款共同提供担保。因借款人未按时偿还到期借款，根据法院2023年1月《民事判决书》和当年4月《执行裁定书》，亚邦制药承担连带清偿责任，涉及金额35,713,280.61元，但对由此产生的代偿损失，未进行合理估计和账务处理，少确认2022年营业外支出和预计负债。\n2023年12月，亚邦制药与其他担保人签署和解协议，约定亚邦制药承担上述全部债务的45%，其他担保人承担55%。亚邦制药于2023年9月至2024年3月，支付代偿款共计17,431,088.31元。法院于2024年4月7日出具结案通知书。\n天健所江苏分所在亚邦制药2022年度财务报表审计中，未充分考虑其他三方担保人的偿还能力，全额确认了该代偿损失35,958,728.16元。在亚邦制药2023年度财务报表审计中，未根据和解协议、上年经审计的财务报表调整情况及期后实际支付代偿款情况，审计未调减2022年多确认的预计负债，导致多列报预计负债和以前年度损失。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第二款第（一）项，不符合《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十八条、第二十九条、第三十条，《中国注册会计师审计准则第1301号——审计证据》第十条等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，财政部决定给予你警告、暂停执行业务3个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕234号 ）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974599.htm", "date": "2025-09-13", "id": "34d97b7f8e95bfba6b5bfef884914b00", "content": "财政部行政处罚决定书（财监法〔2025〕234号 ）\n财监法〔2025〕234 号\n财政部行政处罚决定书\n当 事 人：天津天保热电有限公司\n地    址：天津市空港经济区纬七道169号\n依照《中华人民共和国会计法》的规定，财政部组织检查组于2024年对你公司会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n你公司2022年度、2023年度在没有证据可以证明能够收到政府经营补贴的情况下，多确认其他收益236,240,000元、237,640,000元。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了2017年修正的《中华人民共和国会计法》第十三条第一款、第二十五条、第二十六条第（一）（二）项，不符合《企业会计准则第16号——政府补助》第六条等有关规定。\n依据2017年修正的《中华人民共和国会计法》第四十二条第一款第（三）项的规定，财政部决定给予你公司罚款8,000元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部天津监管局联系，凭财政部天津监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕233号 ）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974598.htm", "date": "2025-09-13", "id": "5d80d2b926b30020de444406bb1f776a", "content": "财政部行政处罚决定书（财监法〔2025〕233号 ）\n财监法〔2025〕233 号\n财政部行政处罚决定书\n当 事 人：天津荣程联合钢铁集团有限公司\n地    址：天津市津南区葛沽镇冶金工业园区\n依照《中华人民共和国会计法》的规定，财政部组织检查组于2024年对你公司会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n一、2023年度合并财务报表无依据确认政府补助收入73,950,000元\n你公司2023年在确认政府经营贡献奖励收入时直接计提了2021年4月至2022年1月经营贡献奖励。但根据企业与政府签订的协议，上述经营贡献奖励需由政府确认并以出具的年终考核结果为准，你公司在未实际收到款项，也未经政府考核验收的情况下，无依据确认政府补助收入73,950,000元。\n二、2023年度合并财务报表存在其他应收款少确认坏账损失30,000,000元\n你公司2023年末其他应收款中包含唐山威宇冷轧镀锌金属有限公司30,000,000元，该公司于2019年7月注销，但你公司截至2023年末仍未计提坏账损失。\n三、2023年度合并财务报表多计其他收益25,639,200元\n你公司2023年将收到的与资产相关的政府补助25,639,200元一次性确认为其他收益，导致2023年度多计其他收益25,639,200元。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了2017年修正的《中华人民共和国会计法》第十三条第一款、第二十五条、第二十六条第（一）（二）项，不符合《企业会计准则第16号——政府补助》第六条、第八条第一款，《企业会计准则第28号——会计政策、会计估计变更和差错更正》第十二条、第十四条，《企业会计准则第22号——金融工具确认和计量》第四十条第一款第（四）项、四十三条等有关规定。\n依据2017年修正的《中华人民共和国会计法》第四十二条第一款第（三）项的规定，财政部决定给予你公司罚款2万元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部天津监管局联系，凭财政部天津监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕232号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974597.htm", "date": "2025-09-13", "id": "0ca9e3bfa2b4901ca207d5641ffe42fe", "content": "财政部行政处罚决定书（财监法〔2025〕232号）\n财监法〔2025〕232 号\n财政部行政处罚决定书\n当 事 人：李业光\n地    址：天津市南开区红旗路216号天津中环产业园有限公司A楼南门二层\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对立信中联会计师事务所（特殊普通合伙，以下称立信中联所）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n立信中联所在对天津天保热电有限公司（以下称天保热电）2022年度、2023年度合并财务报表审计中，审计程序实施不到位，未识别重大会计差错。\n天保热电2022年度、2023年度在没有证据可以证明企业能够收到政府经营补贴的情况下，多确认其他收益236,240,000元、237,640,000元。\n经检查，立信中联所在审计工作中未保持应有的职业怀疑，未分析以前年度政府补贴实际到账情况，以判断企业确认其他收益的合理性。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款，不符合《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十二条第一款、第二十八条、第二十九条，《中国注册会计师审计准则第1301号——审计证据》第十条等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，财政部决定给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕231号 ）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974596.htm", "date": "2025-09-13", "id": "633ffea35376507697ba9d4cea23a4bf", "content": "财政部行政处罚决定书（财监法〔2025〕231号 ）\n财监法〔2025〕231 号\n财政部行政处罚决定书\n当 事 人：张晓亮\n地    址：天津市南开区红旗路216号天津中环产业园有限公司A楼南门二层\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对立信中联会计师事务所（特殊普通合伙，以下称立信中联所）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n立信中联所在对天津天保热电有限公司（以下称天保热电）2022年度、2023年度合并财务报表审计中，审计程序实施不到位，未识别重大会计差错。\n天保热电2022年度、2023年度在没有证据可以证明企业能够收到政府经营补贴的情况下，多确认其他收益236,240,000元、237,640,000元。\n经检查，立信中联所在审计工作中未保持应有的职业怀疑，未分析以前年度政府补贴实际到账情况，以判断企业确认其他收益的合理性。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款，不符合《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十二条第一款、第二十八条、第二十九条，《中国注册会计师审计准则第1301号——审计证据》第十条等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，财政部决定给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕230号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974595.htm", "date": "2025-09-13", "id": "257cb8277236b069d238ec9146076b6b", "content": "财政部行政处罚决定书（财监法〔2025〕230号）\n财监法〔2025〕230 号\n财政部行政处罚决定书\n当 事 人：常虹\n地    址：天津市南开区红旗路216号天津中环产业园有限公司A楼南门二层\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对立信中联会计师事务所（特殊普通合伙，以下称立信中联所）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、立信中联所在对天津荣程联合钢铁集团有限公司（以下称荣程钢铁）2023年度财务报表审计中，未识别荣程钢铁2023年度存在无依据确认政府补助收入73,950,000元的会计差错\n荣程钢铁2023年在确认政府经营贡献奖励收入时直接计提了2021年4月至2022年1月经营贡献奖励73,950,000元。但根据企业与政府签订的协议，上述经营贡献奖励需由政府确认并以出具的年终考核结果为准，企业在未实际收到款项，也未经政府考核验收的情况下，无依据确认政府补助收入73,950,000元。\n经检查，立信中联所在审计工作中关注到了上述情况，但未保持职业怀疑，未实施进一步审计程序。\n二、立信中联所在对荣程钢铁2023年度财务报表审计中，未识别荣程钢铁2023年度存在其他应收款少确认坏账损失30,000,000元的会计差错\n荣程钢铁2023年末其他应收款中包含唐山威宇冷轧镀锌金属有限公司30,000,000元，该公司于2019年7月注销，但企业截至2023年末仍未计提坏账损失。\n经检查，立信中联所在审计工作中未对长期挂账的往来款予以关注，未获取该笔款项可收回性的支持性文件，导致未识别上述会计差错。\n三、立信中联所在对荣程钢铁2023年度财务报表审计中，未识别荣程钢铁2023年度提前确认其他收益25,639,200元的会计差错\n荣程钢铁2023年将收到的与资产相关的政府补助25,639,200元一次性确认为其他收益。\n经检查，立信中联所在审计工作中未获取充分、适当的审计证据，未对荣程钢铁的政府补助核算方式作出恰当的职业判断。\n上述问题，导致立信中联所对荣程钢铁2023年度财务报表审计发表的审计意见不恰当。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款，不符合《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十二条第一款、第二十八条、第二十九条，《中国注册会计师审计准则第1301号——审计证据》第十条等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，财政部决定给予你警告、暂停执行业务3个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕229号 ）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202510/t20251021_3974594.htm", "date": "2025-09-13", "id": "a15e07851f4c3fc4b18b9e45573d4dd4", "content": "财政部行政处罚决定书（财监法〔2025〕229号 ）\n财监法〔2025〕229 号\n财政部行政处罚决定书\n当 事 人：吕杰丽\n地    址：天津市南开区红旗路216号天津中环产业园有限公司A楼南门二层\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对立信中联会计师事务所（特殊普通合伙，以下称立信中联所）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、立信中联所在对天津荣程联合钢铁集团有限公司（以下称荣程钢铁）2023年度财务报表审计中，未识别荣程钢铁2023年度存在无依据确认政府补助收入73,950,000元的会计差错\n荣程钢铁2023年在确认政府经营贡献奖励收入时直接计提了2021年4月至2022年1月经营贡献奖励73,950,000元。但根据企业与政府签订的协议，上述经营贡献奖励需由政府确认并以出具的年终考核结果为准，企业在未实际收到款项，也未经政府考核验收的情况下，无依据确认政府补助收入73,950,000元。\n经检查，立信中联所在审计工作中关注到了上述情况，但未保持职业怀疑，未实施进一步审计程序。\n二、立信中联所在对荣程钢铁2023年度财务报表审计中，未识别荣程钢铁2023年度存在其他应收款少确认坏账损失30,000,000元的会计差错\n荣程钢铁2023年末其他应收款中包含唐山威宇冷轧镀锌金属有限公司30,000,000元，该公司于2019年7月注销，但企业截至2023年末仍未计提坏账损失。\n经检查，立信中联所在审计工作中未对长期挂账的往来款予以关注，未获取该笔款项可收回性的支持性文件，导致未识别上述会计差错。\n三、立信中联所在对荣程钢铁2023年度财务报表审计中，未识别荣程钢铁2023年度提前确认其他收益25,639,200元的会计差错\n荣程钢铁2023年将收到的与资产相关的政府补助25,639,200元一次性确认为其他收益。\n经检查，立信中联所在审计工作中未获取充分、适当的审计证据，未对荣程钢铁的政府补助核算方式作出恰当的职业判断。\n上述问题，导致立信中联所对荣程钢铁2023年度财务报表审计发表的审计意见不恰当。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款，不符合《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十二条第一款、第二十八条、第二十九条，《中国注册会计师审计准则第1301号——审计证据》第十条等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，财政部决定给予你警告、暂停执行业务3个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年9月13日"}, {"source": "国家税务局", "category": "留言咨询", "title": "上一年度享受了研发费用加计扣除优惠，相关资料应由总机构留存备查还是分支机构留存备查？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5243107/content.html", "date": "2025-09-10", "id": "9413a27fae7f4279f1fb0450070af181", "content": "答：\n上一年度，无论是总机构还是非法人分支机构发生适用税前加计扣除政策的研发活动，均由总机构汇总计算并享受研发费用加计扣除优惠政策。\n根据《国家税务总局关于发布修订后的〈企业所得税优惠政策事项办理办法〉的公告》（国家税务总局公告2018年第23号）第八条规定，设有非法人分支机构的居民企业以及实行汇总纳税的非居民企业机构、场所享受优惠事项的，由居民企业的总机构以及汇总纳税的主要机构、场所负责统一归集并留存备查资料。\n因此，跨省经营汇总纳税企业在上一年度享受了研发费用加计扣除优惠，相关资料应当由总机构留存备查。"}, {"source": "财政部", "category": "处罚案例", "title": "财政部列入严重失信主体名单决定书（财监法〔2025〕228 号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971721.htm", "date": "2025-08-18", "id": "0298ef78db401d11ab0399d7712d33c4", "content": "财政部列入严重失信主体名单决定书（财监法〔2025〕228 号）\n财监法〔2025〕228 号\n财政部列入严重失信主体名单决定书\n当 事 人：广东明心会计师事务所（普通合伙）\n地      址：深圳市罗湖区南湖街道嘉北社区迎春路12号海外联谊大厦2720K3\n依照《注册会计师行业严重失信主体名单管理办法》（财政部令第116号，以下简称《办法》）的规定，基于对你所的有关行政处罚，财政部决定将你所列入严重失信主体名单，有关事项如下：\n依照《中华人民共和国注册会计师法》等法律规定，财政部组织检查组对你所执业质量等情况开展了检查，认定你所存在编造事由出具虚假审计报告等严重违法问题。2024年11月，财政部向你所作出行政处罚决定，给予你所没收违法所得22,100元并处罚款110,500元的行政处罚。截至目前，你所仍未缴纳上述罚没款。\n依据《办法》第四条第（七）项的规定，财政部决定将你所列入注册会计师行业严重失信主体名单，实施联合惩戒。依据《办法》第十条第一款的规定，列入期限为二年。\n依据《办法》第九条的规定，除依照法律、行政法规规定应当实施的从业限制等管理措施外，财政部还将实施下列管理措施：（一）列为重点监管对象，适当提高抽查的比例和频次，依法严格监管；（二）不适用告知承诺制；（三）不予授予财政部门荣誉称号等表彰奖励。\n依据《办法》第十二条的规定，当事人被列入严重失信主体名单满一年后，符合相关条件的，可以依照《办法》规定向财政部申请提前移出。\n依据《办法》第十七条的规定，如有证据证明公示信息不准确，可以要求财政部进行更正。\n如不服本决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本决定不停止执行。\n财  政  部\n2025年8月18日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部列入严重失信主体名单决定书（财监法〔2025〕227 号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971720.htm", "date": "2025-08-18", "id": "5f56197c3824c06bab761169529b5889", "content": "财政部列入严重失信主体名单决定书（财监法〔2025〕227 号）\n财监法〔2025〕227 号\n财政部列入严重失信主体名单决定书\n当 事 人：深圳文本会计师事务所（普通合伙）\n地      址：深圳市福田区福田街道福山社区滨河大道5022号联合广场A座2208-J13\n依照《注册会计师行业严重失信主体名单管理办法》（财政部令第116号，以下简称《办法》）的规定，基于对你所的有关行政处罚，财政部决定将你所列入严重失信主体名单，有关事项如下：\n依照《中华人民共和国注册会计师法》等法律规定，财政部组织检查组对你所执业质量等情况开展了检查，认定你所存在出具虚假审计报告等严重违法问题。2024年11月，财政部向你所作出行政处罚决定，给予你所没收违法所得87,600元并处罚款438,000元的行政处罚。截至目前，你所仍未缴纳上述罚没款。\n依据《办法》第四条第（七）项的规定，财政部决定将你所列入注册会计师行业
