<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会计信息聚合工作台</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1a1d21; --muted: #8a919f;
    --primary: #0f766e; --primary-soft: #e6f4f1; --border: #e7e9ee;
    --tax: #b45309; --tax-bg: #fef3c7;
    --cicpa: #0f766e; --cicpa-bg: #ccfbf1;
    --esnai: #1d4ed8; --esnai-bg: #dbeafe;
    --cpa: #7c3aed; --cpa-bg: #ede9fe;
    --audit: #be185d; --audit-bg: #fce7f3;
    --shadow-sm: 0 1px 2px rgba(16,24,40,.05);
    --shadow-md: 0 4px 14px rgba(16,24,40,.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text); line-height: 1.6;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 24px 20px 48px;
  }
  .wrap { max-width: 1040px; margin: 0 auto; }

  /* 顶栏 */
  .topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .logo {
    width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
    background: var(--primary); display: flex; align-items: center; justify-content: center;
  }
  .topbar h1 { font-size: 21px; font-weight: 600; letter-spacing: -.01em; }
  .topbar p { color: var(--muted); font-size: 13px; margin-top: 2px; }

  /* 顶部官网直达 */
  .quick-links { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .ql {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px;
    border-radius: 999px; font-size: 13px; background: var(--card);
    border: 1px solid var(--border); color: #4b5563; text-decoration: none;
    box-shadow: var(--shadow-sm); transition: all .15s;
  }
  .ql:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
  .ql svg { color: var(--muted); flex-shrink: 0; }
  .ql:hover svg { color: var(--primary); }

  /* 搜索栏 */
  .searchbar {
    display: flex; align-items: center; gap: 10px; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px; padding: 12px 16px;
    box-shadow: var(--shadow-sm); margin-bottom: 18px;
    transition: border-color .15s, box-shadow .15s;
  }
  .searchbar:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .searchbar svg { color: var(--muted); flex-shrink: 0; }
  .searchbar input { flex: 1; border: none; outline: none; font-size: 15px; background: transparent; color: var(--text); }
  .searchbar input::placeholder { color: #b0b6c0; }

  /* 主体布局 */
  .main { display: flex; gap: 18px; align-items: flex-start; }

  /* 左侧栏 */
  .sidebar { width: 210px; flex-shrink: 0; position: sticky; top: 20px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px; box-shadow: var(--shadow-sm); }
  .group-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 8px 10px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px;
    cursor: pointer; font-size: 14px; color: #4b5563; transition: background .12s;
  }
  .nav-item:hover { background: #f2f4f7; }
  .nav-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 500; }
  .nav-item .badge { margin-left: auto; background: #eceef1; color: #6b7280; border-radius: 10px; padding: 1px 8px; font-size: 12px; }
  .nav-item.active .badge { background: #cfe8e2; color: var(--primary); }
  .nav-item .soon { font-size: 11px; color: var(--tax); background: var(--tax-bg); border-radius: 6px; padding: 1px 6px; font-weight: 500; }
  .nav-parent .arrow { font-size: 11px; color: var(--muted); margin-left: 4px; transition: transform .15s; }
  .nav-parent.open .arrow { transform: rotate(180deg); }
  .nav-children { display: none; padding-left: 6px; margin-top: 2px; }
  .nav-children.open { display: block; }
  .nav-child { padding-left: 20px; font-size: 13px; }

  /* 右侧内容 */
  .content { flex: 1; min-width: 0; }
  .count { color: var(--muted); font-size: 13px; margin: 2px 2px 12px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--shadow-sm);
    transition: box-shadow .15s, transform .15s;
  }
  .card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .card .meta { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .tag { padding: 2px 9px; border-radius: 6px; font-size: 12px; font-weight: 500; }
  .tag.cicpa { background: var(--cicpa-bg); color: var(--cicpa); }
  .tag.esnai { background: var(--esnai-bg); color: var(--esnai); }
  .tag.cpa { background: var(--cpa-bg); color: var(--cpa); }
  .tag.audit { background: var(--audit-bg); color: var(--audit); }
  .tag.tax { background: var(--tax-bg); color: var(--tax); }
  .card h2 { font-size: 16px; font-weight: 600; margin: 8px 0 6px; line-height: 1.45; }
  .card h2 a { color: var(--text); text-decoration: none; }
  .card h2 a:hover { color: var(--primary); }
  .card .sum { font-size: 13.5px; color: #5a6472; }
  .empty { text-align: center; color: var(--muted); padding: 56px 0; font-size: 14px; }
  .card.new { border-left: 3px solid #e11d48; background: linear-gradient(90deg, #fff5f6 0%, #ffffff 40%); }
  .badge-new {
    display: inline-flex; align-items: center; background: #ffe4e6; color: #e11d48;
    padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; line-height: 1.5;
  }

  @media (max-width: 720px) {
    .main { flex-direction: column; }
    .sidebar { width: 100%; position: static; }
    .nav-items-row { display: flex; gap: 6px; overflow-x: auto; }
    .nav-item { flex-shrink: 0; }
  }
</style>
</head>

<script>
const DATA = [{"source": "CPA业务探讨", "category": "论坛讨论", "title": "求助陈版主！！关于传媒行业的互投资源是否可以确认收入成本。", "url": "https://bbs.esnai.cn/thread-5498333-1-1.html", "date": "2026-09-01", "content": "陈版主，您好！ 您好！请教一下实务工作中遇到的问题，谢谢！ 公司本身是互联网传媒行业，拥有聚合视听娱乐平台，专注于提供高清直播点播和独家内容服务的自营app。本月，为扩大经营及品牌影响力，公司与另一家专注于听书类的app进行了宣推资源的互采，双方分别签订 ...", "id": "f39bd475d9ec663c6b4206c2e37c1b00"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "项目终止后已完成部分的处理", "url": "https://bbs.esnai.cn/thread-5498332-1-1.html", "date": "2026-09-01", "content": "背景：制造企业建设生产线，在平整土地等基础已完工、并就主要设备签订设备采购合同（定制设备），后因政府批复等原因，该项目被终止。 问题：项目终止后已经完成的平等土地等（在自有土地上实施）是转为无形资产——土地使用权？金额巨大的终止设备采购合同的赔偿金在 ...", "id": "1b7b180a28d3763d5c9a2c85f374b3d1"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "请教陈版主，股份支付相关问题", "url": "https://bbs.esnai.cn/thread-5498331-1-1.html", "date": "2026-09-01", "content": "版主好： 公司授予股权激励背景如下：公司2024年10月设立了持股平台a，彼时持股平台a还没有并入拟上市主体X的股权架构中，且出资额由员工自行认购，按1元/股认购，员工认购后实缴出资到位，出资额合计500万。a合伙协议约定要求“自取得合伙企业份额之日起在X服务满5年 ...", "id": "c9597080700b72bbfcbbf99aad232367"}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第二十五号）", "url": "https://www.cicpa.org.cn/xxfb/news/202608/t20260831_66069.html", "date": "2026-08-31", "id": "be40a7e92dd5470ab0bca6102a473d49", "content": "为贯彻落实《中共中央办公厅\n国务院办公厅印发\n<关于进一步加强财会监督工作的意见>的通知》等文件精神，根据财政部《关于进一步加强注册会计师协会自律监督工作的意见》（财会〔2024〕27号）以及《会计师事务所执业质量检查制度》（会协〔2011〕39号）要求，2025年，按照财会监督专项行动和注册会计师行业“财会监督深化年”主题活动的部署安排，中国注册会计师协会（以下简称中注协）联合财政部监督评价局，组织相关人员与财政部监管局组建检查组，对备案从事证券服务业务的会计师事务所进行执业质量检查；组织各省、自治区、直辖市及深圳市注册会计师协会（以下简称地方注协），联合地方财政部门，对本区域内的会计师事务所开展执业质量检查。现将有关情况公告如下。\n一、总体情况\n截至\n2024年底，全国共有会计师事务所10993家（总所9522家，分所1471家）。2025年，中注协与地方注协共对2053家会计师事务所开展执业质量检查。截至目前，中注协及地方注协共对存在违规问题的377家会计师事务所和711名注册会计师实施了行业惩戒及自律监管措施。其中，对91家会计师事务所和270名注册会计师予以公开谴责；对67家会计师事务所和211名注册会计师予以通报批评；对52家会计师事务所和194名注册会计师予以训诫，对167家会计师事务所和36名注册会计师采取约谈、责令整改等自律监管措施。\n二、典型案例\n（一）永拓会计师事务所（特殊普通合伙）存在对被审计单位同一财务报表同时出具不同结论的审计报告的行为。该所为某公司\n2012年度和2013年度合并财务报表分别出具了审计报告，审计意见均为保留意见。在出具上述报告的同一天，该所还分别为该公司出具了无保留意见的审计报告，其后附的财务报表与发表保留意见的审计报告后附的财务报表列报金额一致。中注协对该所给予公开谴责的行业惩戒。\n（二）吉林市鼎信会计师事务所有限公司在某公司\n2021-2023年研究开发费用专项审计中，从企业获取的资料存在重大不一致，在明知研发费用辅助账无支持资料的情况下，认可公司仅以计提基数和提取比例测算得出研发费用。该所未恰当评估研发费用计算的合理性，未获取充分、适当的审计证据。中注协对该所及注册会计师王林琳、刘艳玲给予公开谴责的行业惩戒。\n（三）中审华会计师事务所（特殊普通合伙）在某公司\n2024年财务报表审计中，未保持应有的职业怀疑，在建工程审计程序执行不到位，未能识别出企业在建工程存在虚增的问题，发表不恰当的审计意见。中注协对该所注册会计师韩正萍、莫秀金给予公开谴责的行业惩戒。\n（四）云南立审会计师事务所（普通合伙）存在允许其他单位或者个人以本所名义承办业务的情形；在审计项目中，存在用伪造的被审计单位及对方单位公章编制虚假询证函，用伪造的被审计单位公章编制虚假固定资产盘点检查表及管理层声明等情况。云南省注册会计师协会对该所及注册会计师吉庆伟、王桂英给予公开谴责的行业惩戒。\n（五）绍兴天清会计师事务所（普通合伙）在审计工作中，明知被审计单位因招投标需要，要做大资产、收入等财务指标，在收到企业人为修改后的财务报表和账套后，未对主营业务收入、银行存款、固定资产等科目明细账中的异常数据给予必要的关注，未获取充分、适当的审计证据，出具了\n4份无保留意见的审计报告。该所还存在未与被审计单位签订业务约定书，从其他会计师事务所转接审计项目并出具审计报告；审计工作底稿由其他会计师事务所员工编制，未获取相关支持性证据并复核数据等情况。浙江省注册会计师协会对该所及注册会计师陈杨、罗先明、刘映元、张小军给予公开谴责的行业惩戒。\n（六）宁波嘉德会计师事务所（普通合伙）允许其他会计师事务所以本所名义承办审计业务，某审计项目的审计工作底稿编制人和复核人均为其他会计师事务所从业人员。存在审计项目未编制审计工作底稿，利用其他会计师事务所审计调整数据出具审计报告的情况。部分审计项目的重要报表科目仅编制审定表、明细表、凭证测试表，未执行实质性的审计程序，未取得审计证据，无审计说明和审计结论。浙江省注册会计师协会对该所及注册会计师支立宇、吴秀梅、王志君给予公开谴责的行业惩戒。\n（七）上海普道兢实会计师事务所（普通合伙）向协会提供的纳税申报表存在修图痕迹，填表日期与税款所属期间明显不匹配，纳税申报表、财务报表收入数据与税务系统导出的对应期间纳税申报表列示的金额不一致，且未提供差异明细。该所未按照质量管理准则及职业道德守则要求修订相关制度；部分审计项目应收账款未实施函证程序且未说明不实施函证的理由，货币资金、预付账款、长期股权投资、固定资产、预收账款、营业收入、营业成本等重要科目审计程序执行不到位。上海市注册会计师协会对该所及注册会计师马勇、陈高潮、曹孟南、袁爱红给予公开谴责的行业惩戒。\n（八）上海中豪会计师事务所（普通合伙）未按照质量管理准则及职业道德守则要求修订相关制度；存在项目组同时为客户提供审计服务和代理记账服务的情况，违反相关独立性要求。在审计项目中，被审计单位提供给事务所的情况说明中提及不能提供会计报表有关会计科目的明细清单，在无法对应收账款、预收账款、其他应收款、其他应付款等重要科目实施有效的审计程序，无法获得充分、适当的审计证据的情况下，仍出具了无保留意见的审计报告。此外，部分鉴证项目在未履行必要的审计程序，未获取充分适当的证据的情况下出具报告。上海市注册会计师协会对该所及注册会计师来永斌、吴均圣给予公开谴责的行业惩戒。\n（九）河南中蓝会计师事务所（普通合伙）部分审计项目业务约定书要素不齐全，未编制总体审计策略；重要科目实质性审计程序缺失，银行存款及应收账款未执行函证程序且未说明理由，未执行替代测试；存货监盘流于形式，且未实施存货计价测试；在建工程、固定资产、无形资产、营业收入、营业成本等重要科目审计程序执行不到位。河南省注册会计师协会对该所及执行合伙人苗晓春，注册会计师吴君丽、肖莹莹、孙孝民给予公开谴责的行业惩戒。\n各会计师事务所和注册会计师应当遵守法律法规，遵循执业准则，恪守职业道德，坚持诚信、客观、独立、公正，切实发挥执业监督作用，维护市场经济秩序和社会公共利益，更好服务经济社会高质量发展。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我们公司仓库存储条件良好、管理有序，但前阵子下大暴雨，导致仓库进水把存货都泡坏了，想问一下，这种被水淹的货物，进项税额还能不能抵扣啊？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5252053/content.html", "date": "2026-08-31", "id": "eaa1f760c52ff35fb87cb29122cd21e0", "content": "答：\n这种情况能继续抵扣。\n您公司仓库存储条件良好、管理有序，因暴雨导致仓库进水、货物被淹损坏，属于自然灾害造成的损失，不属于非正常损失，因此，对应货物的进项税额无需做转出处理，可以继续抵扣。\n根据《中华人民共和国增值税法》第二十二条第三项规定，非正常损失项目对应的进项税额不得从销项税额中抵扣。《中华人民共和国增值税法实施条例》第十九条明确，增值税法所称非正常损失，是指因管理不善造成货物被盗、丢失、霉烂变质，以及因违反法律法规造成货物或者不动产被依法没收、销毁、拆除等情形。\n需要注意的是，企业应当留存好相关证明材料，如仓库检查记录、设备配备情况、气象部门发布的暴雨预警或天气证明、仓库进水的现场照片或视频、存货损失清单、内部报损审批记录等，确保能够充分证明自己已履行了合理的、必要的管理义务，该损失确由自然灾害等不可抗力因素造成，从而合规享受进项税额抵扣政策。"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "违约金现金流选择", "url": "https://bbs.esnai.cn/thread-5498322-1-1.html", "date": "2026-08-31", "content": "求助版主，公司采购一项服务，由于延迟服务，需支付供应商违约金，此项合同已履约，根据准则核算时冲减采购成本，但支付的违约金应该计入购买商品相关的现金流还是支付其他经营活动有关呢？", "id": "99e11c11937f8de245b4156e09e6fa51"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "有点看不懂这公司中报的收入和归母净利润，结合审计考试", "url": "https://bbs.esnai.cn/thread-5498321-1-1.html", "date": "2026-08-31", "content": "代码002611 突然想起审计不是每年综合都要考个认定风险的题吗？大家帮忙分析下", "id": "84b4ececd9df1ed0a87a41bf52e8f719"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "子公司向母公司无偿划拨土地使用权问题", "url": "https://bbs.esnai.cn/thread-5498318-1-1.html", "date": "2026-08-31", "content": "全资子公司向母公司无偿划拨一宗土地的部分使用权，新购土地原值为5千万，其中20%划给母公司。子公司账面实收资本和未分配利润均小于1千万。母公司长投也小于1千万。 单体报表，个人觉得子公司应该先冲资本公积，然后冲留存收益（盈余公积和未分配利润）。母公司应该做 ...", "id": "accf61c4997c5e1cfa0dad2eb51d94c5"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "同控与非同控", "url": "https://bbs.esnai.cn/thread-5498299-1-1.html", "date": "2026-08-28", "content": "请教一个问题： 甲乙同受 A 控制；2025年甲收购丙，形成非同合并，购买日为 2025 年5月1日；2026 年丙 100% 股权无偿划转给乙，乙控制丙的日期为2026年2月；两个时点（甲合并丙、乙控制丙）之间不足12个月，乙合并丙属于非同控？是否满12月是判断同控/非同控的唯一依据 ...", "id": "2e654db214e018768be688d33f05d64d"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "求助陈版9810跨境电商出口增值税收入申报问题", "url": "https://bbs.esnai.cn/thread-5498298-1-1.html", "date": "2026-08-28", "content": "9810跨境电商出口增值税收入申报是按报关单出口当月开具的销项发票进行申报，还是按会计处理（根据电商平台的销售收入金额）进行申报？ 如果按照开具的销项发票申报销售收入，销项发票在会计上不代表确认主营业务收入，只是退税申报凭证，与财务报表的收入金额不相符。 ...", "id": "29326cee0f93e9ab2648cdfaea07ea3d"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "收到某社区居委会通过街道办事处划来财政援助资金，是否为按财政补助会计准则处理？", "url": "https://bbs.esnai.cn/thread-5498296-1-1.html", "date": "2026-08-28", "content": "某社区居民委员会联合A公司，向某区申报巩固脱贫攻坚成果项目——2024年中药材加工生产线建设项目【实施单位：A公司；监管单位：A公司所属街道办事处；实施内容：购买相关设备3台套及运用新技术对某生产进行智能改造等；项目预期收益：稳定一定数量脱贫人员就业，达到一 ...", "id": "4c44e9b6243bf677ca7bddde5e8eb015"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "求助陈版主 急急急", "url": "https://bbs.esnai.cn/thread-5498286-1-1.html", "date": "2026-08-27", "content": "太感谢陈版主的很多指导了，感恩，有很多问题想继续请教一下： 一、像针对一些主要客户的核查，如何判定其交易额与其经营规模、注册资本是否匹配呢？有何具体判定的标准呢？同时如果不匹配会存在哪些需要特别关注的风险呢？像IPO针对客户的回款方式比例的核实，主要目 ...", "id": "f90d99bcc76148748ddae0b02e90d2a6"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "折价退货的处理", "url": "https://bbs.esnai.cn/thread-5498284-1-1.html", "date": "2026-08-27", "content": "A公司采购了一批材料，采购价100万（假设不考虑税费），过了半年后公司发现此批材料存在质量问题，与供应商协商退货，但因这半年期间，该材料的市场价格下降到了90万元，供应商同意按90万退货不接受原价退货。 求助陈版主： （1）这类业务场景是按退货处理还是按向供 ...", "id": "98ad6ae9c223352ad70f16fd3a078035"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "陈版主，定制化软件开发，质保服务和质保金", "url": "https://bbs.esnai.cn/thread-5498277-1-1.html", "date": "2026-08-26", "content": "陈版主，您好 甲公司向乙公司购买产品（定制化开发软件）及验收之后的免费服务维护期为12个月，乙公司承诺在免费服务维护期内对软件提供及时的免费升级服务及扩容服务。升级程序应满足安全要求并能经过测试验证。乙公司有义务确保甲公司软件升级成功，不影响依赖于本 ...", "id": "89b28acbc65670aeba80a6143b1f6ce1"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "求教陈版主，关于票据贴现现金流量问题", "url": "https://bbs.esnai.cn/thread-5498276-1-1.html", "date": "2026-08-26", "content": "陈老师您好，A集团母公司从全资子公司采购产品以后，母公司开立票据支付给子公司，子公司收到票据后进行贴现，子公司收到的贴现款，单体现金流量列示为经营活动-销售商品、提供劳务收到的现金，其中母公司开立票据时有支付承兑保证金也有以大额存单进行质押开立票据的， ...", "id": "4850c42d2232a148707ed84f835c1460"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "同控增资收购", "url": "https://bbs.esnai.cn/thread-5498275-1-1.html", "date": "2026-08-26", "content": "求助陈版主和各位前辈， 案例背景：A和B是同控下的两个兄弟公司，之前没有任何持股关系，今年A向B增资，取得B公司80%股权。假设B公司的净资产跟在最终控制方合并的净资产金额是一样的，A公司的长投应该怎么计算呢？是按照增前的净资产金额*持股比例还是按照增资后的 ...", "id": "37511f1064cdc4748efa886efde01c3b"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "期货公司（含风险管理子公司）新列报准则下利润表格式选择与保证金利息列报分析", "url": "https://bbs.esnai.cn/thread-5498274-1-1.html", "date": "2026-08-26", "content": "分析基于财政部《企业会计准则第30号——财务报表列报》（财会〔2026〕11号，2026年7月正式发布2027/2029/2030年分阶段生效）及《金融企业利润表的列报格式和列报方法（修订征求意见稿）》（财办会〔2025〕51号附件3）整理，供内部会计政策判断参考。配套报表格式尚未正 ...", "id": "6e47e370425485b3713769b7f377bdc8"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "复杂并购条款的分拆和界定", "url": "https://bbs.esnai.cn/thread-5498272-1-1.html", "date": "2026-08-26", "content": "背景： A公司拟收购B公司90%股权，B在现阶段是股份公司，B的部分现股东又是高管，所以B公司股份转让受公司法关于股份公司董监高每年25%股份转让上限的限制，对此，在完成90%全部收购前，B需要先从股份公司转成有限公司；此外，B的现股东中有一个持股10%的股东与B的现大 ...", "id": "bf64527e5ddecce87100034956b60101"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "求助陈老师，文旅行业预收的OTA线上平台款项，如何处理", "url": "https://bbs.esnai.cn/thread-5498269-1-1.html", "date": "2026-08-25", "content": "陈老师好， 有个业务需要咨询您一下 我们审计的客户为文旅行业主要经营海洋馆以及配套酒店业务，部分合同是与大型线上平台，例如美团、携程掐签订，合同约定：该线上平台（乙方）需要预付3000万元，客户实际到园区消费后，核销部分预付款，合同期限为1年，到期可 ...", "id": "82bd244aed4fe3e0ef7c2e6b6aafe887"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "请问下连续审计的情况下，需要对期初数做到什么程度？具体在哪里有规定呢？", "url": "https://bbs.esnai.cn/thread-5498263-1-1.html", "date": "2026-08-25", "content": "请问下连续审计的情况下，需要对期初数做到什么程度？具体在哪里有规定呢？ 查了下豆包，说连续审计的情况下，注册会计师通常只需关注上期期末余额是否已正确结转至本期，很少需要再实施其他专门的审计程序。。。但我找了半天也没找到原文。。。 请问大家知道哪里有规 ...", "id": "eeefbf466aeb5c539e531e4f1d4a5ff9"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "请教陈版：芯片合作研发 + 技术成果转让附带保底采购义务的会计处理", "url": "https://bbs.esnai.cn/thread-5498261-1-1.html", "date": "2026-08-25", "content": "## 一、项目背景及合同主要条款 ### 1、业务背景 2023 年 4 月，A 公司与 B 公司签署芯片研发合作协议。B 公司提出芯片功能需求，双方共同确定芯片规格指标并形成规格书附件；**A 公司主导全部研发工作**，负责芯片设计、晶圆投片、封装测试及后续量产供应保障；B ...", "id": "c5d4b9fa2de9c6c82f23381b432b8ce2"}, {"source": "CPA业务探讨", "category": "论坛讨论", "title": "明股实债在合并层面转股权处理", "url": "https://bbs.esnai.cn/thread-5498257-1-1.html", "date": "2026-08-25", "content": "陈版主，您好！业务是这样，集团公司A和政府共同签订了一个协议注资给A控股的子公司B，政府分两次出资给子公司B，第一次作为股权，第二次出资作为债权（明股实债），现跟对方商量将第二部分债权转股权，请问需要视同初始投资即享有吗？少数股东损益是不是不能按当期利润 ...", "id": "6f60868d57e36535c33e1abace9f8470"}, {"source": "国家税务局", "category": "留言咨询", "title": "上个月有几笔业务没及时开票也没申报，现在补开发票，销售额是按开票时间，还是业务发生时间申报？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5251608/content.html", "date": "2026-08-04", "id": "4f82410647b805b974eafa692cc76dbd", "content": "答：\n销售额应计入业务实际发生时间的税款所属期。根据《国家税务总局关于增值税一般纳税人登记管理有关事项的公告》规定，纳税人因自行补充或更正、风控核查、稽查查补等调整的销售额，应按纳税义务发生时间计入对应税款所属期销售额。\n因此，补开的发票销售额应该按业务发生的所属期申报。"}, {"source": "内部审计", "category": "论坛讨论", "title": "学会这几招、乱账不用愁", "url": "https://bbs.esnai.cn/thread-5497960-1-1.html", "date": "2026-07-30", "content": "学会这几招、乱账不用愁前言：新入职一家公司，可能会因为交接不善，不得不面对“前任”留下来一堆乱账，此时的迷茫与无助与谁说？那么我们需要把这些清楚明白揭示出来，并向领导汇报。学会这几招，其实并不难。一、清理乱账前的准备1、了解公司业务状况，如业务流程（ ...", "id": "6e3db7deaab6391672657a466cae45ac"}, {"source": "国家税务局", "category": "留言咨询", "title": "我们准备新开办一家企业，请问办理税务登记和社保费登记需要收费吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5251143/content.html", "date": "2026-07-17", "id": "b668824e5e891eadcf221c291ee2a74a", "content": "答：\n不需要。\n按照《关于取消部分涉企行政事业性收费的通知》（财综〔2011〕9号），我国取消税务登记证工本费。同时，按照《国务院办公厅关于加快推进“五证合一、一照一码”登记制度改革的通知》（国办发〔2016〕53号）有关要求，税务登记和社会保险登记均已纳入营业执照登记，不再需要单独办理登记。"}, {"source": "内部审计", "category": "论坛讨论", "title": "现在大家发帖吗", "url": "https://bbs.esnai.cn/thread-5497756-1-1.html", "date": "2026-07-10", "content": "现在大家还在论坛上发帖探讨吗？感觉活跃性降低了不少", "id": "440903428c51e0899d6dfa283aa2efe5"}, {"source": "内部审计", "category": "论坛讨论", "title": "审计交流", "url": "https://bbs.esnai.cn/thread-5497741-1-1.html", "date": "2026-07-09", "content": "周一晚上，与某新能源审计负责人做了一些业务交流，其中几个话题值得拿出来探讨。一、业绩成果的界定与审计有效性困惑：目前老板对审计部的管理要求之一是，所有审计发现的问题需区分是新问题还是历史遗留问题。如果挽损金额主要来自历史问题，且金额逐年递增，他会质疑 ...", "id": "6ca3033054c2b300cd355d458bdf8e9d"}, {"source": "内部审计", "category": "论坛讨论", "title": "事项复盘", "url": "https://bbs.esnai.cn/thread-5497709-1-1.html", "date": "2026-07-06", "content": "查出来虚报加班费。与业务主管沟通，业务主管反馈其会与上级领导反馈。 然后我就一直追着问他们上级领导的意见。最终提交的处罚结果与最初给我说的不一致（提交时我不在办公室，一直以为没有提交）。我向领导反馈了。领导只是说他会沟通。最终不了了之。 我在想，之后 ...", "id": "5e7a79de3d8ad3dc659d8653ef3b9855"}, {"source": "内部审计", "category": "论坛讨论", "title": "审计思路", "url": "https://bbs.esnai.cn/thread-5497703-1-1.html", "date": "2026-07-06", "content": "不知道该审什么了......", "id": "ea6ae3f8cc053bdd0e31e15923111be9"}, {"source": "国家税务局", "category": "留言咨询", "title": "我们是按季申报的小规模纳税人，今年第一季度跨地区提供建筑服务，不含税销售额30万元，需要在项目地预缴增值税吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5250677/content.html", "date": "2026-07-01", "id": "313d195cfa8b0d3aa2afe60b76e15c80", "content": "答：\n需要。\n按照《财政部 税务总局关于发布〈增值税预缴税款管理办法〉的公告》（财政部 税务总局公告2026年第14号）《财政部 税务总局关于增值税法施行后增值税优惠政策衔接事项的公告》（财政部 税务总局公告2026年第10号）规定，2026年1月1日起，纳税人跨地级行政区（直辖市下辖县区）提供建筑服务（以下简称跨地区提供建筑服务），当期在预缴地实现的全部价款、预收款（不含增值税）合计未达到增值税起征点的，无需预缴增值税；达到增值税起征点的，2027年12月31日以前减按1%预征率预缴增值税。小规模纳税人以一个季度为一个计税期间的，起征点为季度销售额30万元。\n您是按季申报的小规模纳税人，今年第一季度跨地区提供建筑服务不含税销售额为30万元，达到了增值税起征点，按规定需要预缴增值税，预征率减按1%。"}, {"source": "内部审计", "category": "论坛讨论", "title": "有没有内部审计沟通群", "url": "https://bbs.esnai.cn/thread-5497552-1-1.html", "date": "2026-06-22", "content": "各位大佬、各位同仁： 请问怎么获取本地的内部审计沟通群？以及哪位大佬有内部审计沟通群可以共享一下。 本人3年外审经验，5年内审经验，现任上市公司审计经理，想找一个能交流的群", "id": "46656dea231a237f7dc046d0e66386a1"}, {"source": "国家税务局", "category": "留言咨询", "title": "我们是机械制造公司，是增值税一般纳税人，在销售机器设备的同时还提供安装服务，但是销售设备和提供安装服务的税率不一样，那我们应该如何缴纳增值税？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5250202/content.html", "date": "2026-06-05", "id": "45d81b4b6c30472a25dc17e755f93cda", "content": "答：\n您这种情况属于一项应税交易涉及两个以上税率的情形。按照政策规定，一般纳税人销售机器设备同时提供安装服务，应按照销售货物的税率来缴纳增值税。\n根据《中华人民共和国增值税法》第十三条规定，纳税人发生一项应税交易涉及两个以上税率、征收率的，按照应税交易的主要业务适用税率、征收率。\n根据《财政部 税务总局关于增值税进项税额抵扣等有关事项的公告》（财政部 税务总局公告2026年第13号）：一般纳税人发生下列情形，应当按照应税交易的主要业务适用税率：\n（二）销售活动板房、机器设备、钢结构件等货物的同时提供的安装服务，适用货物的税率。\n也就是说，一项应税交易涉及两个以上税率的业务，核心是看业务之间是否有明显的主附关系，然后按照应税交易的主要业务来确定适用税率。\n你们公司在卖机器设备的同时提供安装服务，既有销售机器设备13%的税率，又有安装服务9%的税率，销售机器设备是居于主体地位的，体现了交易的实质和目的，安装服务是必要的补充，以销售机器设备的发生为前提，那么按照增值税相关政策规定，应该按照主要业务“销售货物”适用13%的税率。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我们是一家生产制造公司，为了扩大生产，2025年12月购买了一套价值400万元的生产设备并于当月投入使用，这些新购入的设备成本可以在2025年度企业所得税汇算清缴时一次性扣除吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5249544/content.html", "date": "2026-05-11", "id": "380937e15cd54744e4bd0f56276d8d2a", "content": "зӯ”пјҡ\nдёҚеҸҜд»ҘгҖӮ\nж №жҚ®гҖҠеӣҪе®¶зЁҺеҠЎжҖ»еұҖе…ідәҺи®ҫеӨҮеҷЁе…·жүЈйҷӨжңүе…ідјҒдёҡжүҖеҫ—зЁҺж”ҝзӯ–жү§иЎҢй—®йўҳзҡ„е…¬е‘ҠгҖӢпјҲеӣҪе®¶зЁҺеҠЎжҖ»еұҖе…¬е‘Ҡ2018е№ҙз¬¬46еҸ·пјүз¬¬дәҢжқЎи§„е®ҡпјҡеӣәе®ҡиө„дә§еңЁжҠ•е…ҘдҪҝз”ЁжңҲд»Ҫзҡ„ж¬ЎжңҲжүҖеұһе№ҙеәҰдёҖж¬ЎжҖ§зЁҺеүҚжүЈйҷӨгҖӮ\nеӣ жӯӨпјҢдёҖж¬ЎжҖ§жүЈйҷӨзҡ„ж—¶зӮ№е№¶йқһиҙӯиҝӣжҲ–жҠ•е…ҘдҪҝз”Ёзҡ„еҪ“жңҲпјҢиҖҢжҳҜеңЁжҠ•е…ҘдҪҝз”ЁжңҲд»Ҫзҡ„ж¬ЎжңҲжүҖеұһе№ҙеәҰгҖӮ\nз»“еҗҲжӮЁе…¬еҸёе®һйҷ…жғ…еҶөпјҢ2025е№ҙ12жңҲиҙӯд№°е№¶жҠ•е…ҘдҪҝз”Ёзҡ„и®ҫеӨҮпјҢеә”еңЁ2026е№ҙдә«еҸ—дёҖж¬ЎжҖ§жүЈйҷӨж”ҝзӯ–пјҢиҖҢдёҚжҳҜеңЁ2025е№ҙеәҰдјҒдёҡжүҖеҫ—зЁҺжұҮз®—жё…зјҙж—¶дә«еҸ—гҖӮ\nиҝҷйҮҢйңҖиҰҒжҸҗйҶ’жӮЁпјҢж №жҚ®гҖҠиҙўж”ҝйғЁ зЁҺеҠЎжҖ»еұҖе…ідәҺи®ҫеӨҮгҖҒеҷЁе…·жүЈйҷӨжңүе…ідјҒдёҡжүҖеҫ—зЁҺж”ҝзӯ–зҡ„е…¬е‘ҠгҖӢпјҲиҙўж”ҝйғЁ зЁҺеҠЎжҖ»еұҖе…¬е‘Ҡ2023е№ҙз¬¬37еҸ·пјүз¬¬дёҖжқЎи§„е®ҡпјҡдјҒдёҡеңЁ2024е№ҙ1жңҲ1ж—ҘиҮі2027е№ҙ12жңҲ31ж—Ҙжңҹй—ҙж–°иҙӯиҝӣзҡ„и®ҫеӨҮгҖҒеҷЁе…·пјҢеҚ•дҪҚд»·еҖјдёҚи¶…иҝҮ500дёҮе…ғзҡ„пјҢе…Ғи®ёдёҖж¬ЎжҖ§и®Ўе…ҘеҪ“жңҹжҲҗжң¬иҙ№з”ЁеңЁи®Ўз®—еә”зәізЁҺжүҖеҫ—йўқж—¶жүЈйҷӨпјҢдёҚеҶҚеҲҶе№ҙеәҰи®Ўз®—жҠҳж—§пјӣеҚ•дҪҚд»·еҖји¶…иҝҮ500дёҮе…ғзҡ„пјҢд»ҚжҢүдјҒдёҡжүҖеҫ—зЁҺжі•е®һж–ҪжқЎдҫӢгҖҒгҖҠиҙўж”ҝйғЁ еӣҪе®¶зЁҺеҠЎжҖ»еұҖе…ідәҺе®Ңе–„еӣәе®ҡиө„дә§еҠ йҖҹжҠҳж—§дјҒдёҡжүҖеҫ—зЁҺж”ҝзӯ–зҡ„йҖҡзҹҘгҖӢпјҲиҙўзЁҺ\nгҖ”\n2014\nгҖ•\n75еҸ·пјүгҖҒгҖҠиҙўж”ҝйғЁ еӣҪе®¶зЁҺеҠЎжҖ»еұҖе…ідәҺиҝӣдёҖжӯҘе®Ңе–„еӣәе®ҡиө„дә§еҠ йҖҹжҠҳж—§дјҒдёҡжүҖеҫ—зЁҺж”ҝзӯ–зҡ„йҖҡзҹҘгҖӢпјҲиҙўзЁҺ\nгҖ”\n2015\nгҖ•\n106еҸ·пјүзӯүзӣёе…іи§„е®ҡжү§иЎҢгҖӮ"}, {"source": "内部审计", "category": "论坛讨论", "title": "AI辅助审计", "url": "https://bbs.esnai.cn/thread-5496935-1-1.html", "date": "2026-04-29", "content": "回到开篇提到的AI（人工智能）辅助审计。求职时，若能讲出一个新故事，为未来的领导描绘更美好的前景（哪怕是“画大饼”），也能显著提升你谈薪时的底气。过去，简历上注明“擅长SQL”绝对是亮点；而如今，这个位置属于AI。随着AI技术的广泛应用，审计模式或将发生变革 ...", "id": "42404a6bcf49ec2ea79781ed31303a98"}, {"source": "国家税务局", "category": "留言咨询", "title": "小规模纳税人提供旅游服务，计算增值税应纳税额时，可以按规定从含税销售额中扣除支付给其他单位的住宿费、餐饮费等，在判断增值税起征点时，是按扣除前的销售额还是扣除后的销售额判断？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5249007/content.html", "date": "2026-04-17", "id": "845159028dbcf4bd336a118f3777b25f", "content": "答：\n根据《财政部 税务总局关于增值税法施行后增值税优惠政策衔接事项的公告》（财政部 税务总局公告2026年第10号）规定：自2026年1月1日至2027年12月31日，小规模纳税人发生应税交易，起征点标准如下：\n（一）以一个月为一个计税期间的，起征点为月销售额10万元。以一个季度为一个计税期间的，起征点为季度销售额30万元。\n（二）按次纳税的，起征点为每次（日）销售额1000元。一日内发生多次应税交易的，按日适用起征点标准。\n小规模纳税人发生应税交易，按照规定以扣除相关价款后的余额计算销售额或者允许从含税销售额中扣除相关价款后计算应纳税额的，以扣除相关价款后的不含税余额，适用本条起征点标准。\n因此，小规模纳税人提供旅游服务，应以按规定扣除相关价款后的不含税余额，来适用起征点标准。"}, {"source": "内部审计", "category": "论坛讨论", "title": "内部审计电子书籍链接（内审修行与实战系列）", "url": "https://bbs.esnai.cn/thread-5496727-1-1.html", "date": "2026-04-11", "content": "《内审修行与实战》系列书，共4本，每本均20万字以上，内容充足且独立原创，全是一线内审干货。 添加助理微信：“内审图书咨询”（17320147730），获取课程信息。 一、电子书免费预览 第1本：实务干货篇：https://flbook.com.cn/c/zIjurapLgb/share 第2本：内审修行 ...", "id": "20f52587744dce549c4bf1a90356e8ca"}, {"source": "内部审计", "category": "论坛讨论", "title": "内部审计书籍推荐4：《内审修行与实战——案例故事篇》", "url": "https://bbs.esnai.cn/thread-5496612-1-1.html", "date": "2026-04-02", "content": "内部审计书籍推荐4：《内审修行与实战——案例故事篇》 前言除部分讲述审计理念的寓言故事外，本书案例和故事，原型基本是审计过程中遇到的现实事件。主旨：通过案例和故事，详细地、趣味性地讲述具体审计过程，让读者拥有沉浸式的观察过程，每一则案例故事，都包含一定 ...", "id": "cf4bc739fc035f0407a3bacc9f9d1049"}, {"source": "内部审计", "category": "论坛讨论", "title": "内部审计书籍推荐3：《内审修行与实战——职场生存篇》", "url": "https://bbs.esnai.cn/thread-5496611-1-1.html", "date": "2026-04-02", "content": "内部审计书籍推荐3：《内审修行与实战——职场生存篇》 前言本书以一线内审工作者的视角来讲述：有什么样的职场环境？会遇到哪些困惑与问题？会碰到哪些雷区与陷阱？需要哪些审计理念与生存技巧？审计创新及企业管理相关问题等等。并讲述相应的解决策略与方法，让读者了 ...", "id": "4d872a0b4dbac25163cb0493fb29e5c3"}, {"source": "内部审计", "category": "论坛讨论", "title": "内部审计书籍推荐2：《内审修行与实战——知识技能篇》", "url": "https://bbs.esnai.cn/thread-5496610-1-1.html", "date": "2026-04-02", "content": "内部审计书籍推荐2：《内审修行与实战——知识技能篇》 前言本书针对审计思想、方法、技能、知识、技巧等方面进行拆解与打磨，精讲：怎么开展审计工作？本书所述知识、技能、思想与传统书籍不尽一样，跳过常见的基础知识技能，重点围绕“实战化”细述。主讲：作为内审 ...", "id": "8fe4823f2cc888d1474f4997bf695fa6"}, {"source": "内部审计", "category": "论坛讨论", "title": "内部审计书籍推荐1：《内审修行与实战—实务干货篇》", "url": "https://bbs.esnai.cn/thread-5496609-1-1.html", "date": "2026-04-02", "content": "内部审计书籍推荐1：《内审修行与实战—实务干货篇》 前言全书只有一个宗旨，亦是内审同行共同的痛点：怎样才能审出东西来？一切从实际需求出发！不引经据典、不抄袭专业书籍，也不讲废话，只说干货，所有内容均来自一线内审工作者的实战经验与心得。内容结构比较简单： ...", "id": "15d881af1526777f7e78f8df89cf43f3"}, {"source": "内部审计", "category": "论坛讨论", "title": "内部审计书籍，4本实战性内审专著终于落地了", "url": "https://bbs.esnai.cn/thread-5496608-1-1.html", "date": "2026-04-02", "content": "内部审计书籍，4本实战性内审专著终于落地了1.早就想出本书了做内审工作已有一二十年了，记忆犹新的还是刚入行那会儿。什么都不懂，到处碰壁，一直希望能得到一位前辈或一本内审书指导，也不至于天天焦虑，不知所措？可市面上大多内部审计图书，只有形，没有意。就算把 ...", "id": "b39748cbc2ee904c4a7487ca1b17cce3"}, {"source": "国家税务局", "category": "留言咨询", "title": "我们是一家制造公司，2025年11月签订合同时采购方就提前一次性预付了全额货款。2026年2月我们按约定发货交付了设备并经验收合格，那这笔货款我们该确认2025年度的企业所得税收入，还是2026年度的？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5248548/content.html", "date": "2026-03-27", "id": "9f25c4875a4e1078cf700d9cfafda875", "content": "答：\n应当在货物发出时确认收入，即2026年。\n根据《中华人民共和国企业所得税法实施条例》第九条规定，企业应纳税所得额的计算，以权责发生制为原则，属于当期的收入和费用，无论款项是否收付，均作为当期的收入和费用；不属于当期的收入和费用，即使款项已经在当期收付，均不作为当期的收入和费用。\n依据《国家税务总局关于确认企业所得税收入若干问题的通知》（国税函〔2008〕875号）第一条规定：企业销售收入的确认必须遵循权责发生制原则和实质重于形式原则。企业销售商品同时满足下列条件的，应确认收入的实现：一是商品销售合同已经签订，企业已将商品所有权上的主要风险和报酬转移给购货方；二是企业对已售出的商品既没有保留通常与所有权相联系的继续管理权，也没有实施有效控制；三是收入的金额能够可靠地计量；四是已发生或将发生的销售方的成本能够可靠地核算。符合上款收入确认条件，销售商品采取预收款方式的，在发出商品时确认收入。\n结合您公司的情况，2025年11月只是收到预收款，2026年2月完成发货交付并验收合格，因此这笔预收货款应确认为2026年度的企业所得税收入。"}, {"source": "内部审计", "category": "论坛讨论", "title": "我的跨行业转行内审之路（二）", "url": "https://bbs.esnai.cn/thread-5496346-1-1.html", "date": "2026-03-12", "content": "今天突然想起10多年前发的这个贴我的跨行业转行内审之路 https://bbs.esnai.com/thread-5021615-1-1.html (出处: 中国会计视野论坛) 好像不能回复更新了，大家有兴趣蹲个后续么", "id": "9a811cb77c9041467328221941fc15e1"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司收到了一张进项发票但无法抵扣，经查询发现该发票已被红冲，可开票方红冲时并未告知我公司，如何防范开票方擅自红冲呢？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5247967/content.html", "date": "2026-03-02", "id": "e8f2d1569c76848bfc03ce0cb054c233", "content": "答：\n开票方擅自将发票红冲会导致受票方无法抵扣进项税额或正常列支成本。为避免这种情况发生，您可以登录电子税务局，通过发票入账标识进行入账确认操作，或通过发票勾选确认进行发票勾选操作，此时如果对方再发起红冲流程，就需经您确认《红字发票信息确认单》后才能开具。具体路径如下：\n登录电子税务局后点击【我要办税】-【税务数字账户】-【发票业务】-【发票入账标识】模块进行发票入账操作。\n或通过【我要办税】-【税务数字账户】-【发票业务】-【发票勾选确认】模块进行发票勾选操作。\n需要注意的是，根据《国家税务总局关于推广应用全面数字化电子发票的公告》（国家税务总局公告2024年第11号）第八条规定，农产品收购发票，报废产品收购发票，光伏收购发票等，不管是不是已经进行用途确认或入账确认，都可由开票方发起红冲流程，并直接开具红字数电发票。"}, {"source": "内部审计", "category": "论坛讨论", "title": "初创期企业财务收支审计需要关注哪些方面呢", "url": "https://bbs.esnai.cn/thread-5496020-1-1.html", "date": "2026-02-11", "content": "今年计划里有一项是审一家新成立的公司，虽然新成立但是因为在研发产品，所以发生的成本费用一点不少，但是目前并没有正式投产，只生产了几台样机。审计需要关注什么呢，本来想的重点关注的是存货成本这块，但是他现在也没出来什么产品", "id": "bee931b1c5b92d29e6f803eebd1b4b53"}, {"source": "国家税务局", "category": "留言咨询", "title": "我们公司2024年购买了安全生产专用设备，已享受企业所得税的抵免政策，近期打算把这设备转让出去。请问之前享受的税额抵免是否需要缴回？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5247627/content.html", "date": "2026-02-03", "id": "fc179e59669a898072fc3d2e9ba31801", "content": "答：\n需要。\n根据《财政部 国家税务总局关于执行环境保护专用设备企业所得税优惠目录，节能节水专用设备企业所得税优惠目录和安全生产专用设备企业所得税优惠目录有关问题的通知》（财税〔2008〕48号）第五条规定，企业购置并实际投入适用，已开始享受税收优惠的专用设备，如从购置之日起5个纳税年度内转让，出租的，应在该专用设备停止使用当月停止享受企业所得税优惠，并补缴已经抵免的企业所得税税款。转让的受让方可以按照该专用设备投资额的10%抵免当年企业所得税应纳税额；当年应纳税额不足抵免的，可以在以后5个纳税年度结转抵免。\n你公司在购置5年内将专用设备转让，需要补缴已经抵免的企业所得税税款。"}, {"source": "内部审计", "category": "论坛讨论", "title": "系统软件（尤其是定制化软件）采购审计重点关注什么？", "url": "https://bbs.esnai.cn/thread-5495778-1-1.html", "date": "2026-01-21", "content": "求教大家分享一些经验，系统软件（尤其是定制化软件）采购审计重点关注什么？有哪些常见的风险点、舞弊点？", "id": "98d90718f476d42a6de694ff6637a5e1"}, {"source": "国家税务局", "category": "留言咨询", "title": "我们的一个供应商最近注销了，没办法补开发票，我们手里只有付款记录和采购协议，相应的支出还能税前扣除吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5246568/content.html", "date": "2026-01-04", "id": "6bc84ecf33be0b867f5ec861fbf64205", "content": "答：\n企业按规定提供相应资料，证实业务及支出的真实性后，可以进行企业所得税税前扣除。\n按照《企业所得税税前扣除凭证管理办法》第十四条规定：\n企业在补开、换开发票、其他外部凭证过程中，因对方注销、撤销、依法被吊销营业执照、被税务机关认定为非正常户等特殊原因无法补开、换开发票、其他外部凭证的，可凭以下资料证实支出真实性后，其支出允许税前扣除：\n（一）无法补开、换开发票、其他外部凭证原因的证明资料(包括工商注销、机构撤销、列入非正常经营户、破产公告等证明资料)；\n（二）相关业务活动的合同或者协议；\n（三）采用非现金方式支付的付款凭证；\n（四）货物运输的证明资料；\n（五）货物入库、出库内部凭证；\n（六）企业会计核算记录以及其他资料。\n前款第一项至第三项为必备资料。\n所以，因对方注销等原因无法补开发票的，只要企业按规定提供的材料能证明业务及支出的真实性，就可以凭借这些资料税前扣除。"}, {"source": "内部审计", "category": "论坛讨论", "title": "审计证据收集的合规性真的很必要", "url": "https://bbs.esnai.cn/thread-5495349-1-1.html", "date": "2025-12-22", "content": "今天在一个从业者微信群里看到同行提问。大意是，想通过某种书证，规避调取员工银行流水可能带来的合规风险。各位同行也是献计献策，讨论了一番。就这个问题，我个人的看法是，首先，提问的同行有风险意识，这个很好。可是，他的防范手段是，企业出具告知书或者同意书， ...", "id": "25141466df9fb8186bf2083e17357fc0"}, {"source": "国家税务局", "category": "留言咨询", "title": "公司给我发了一张超市购物卡，我去超市买东西，收银员说不能再开发票，这符合规定吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5245761/content.html", "date": "2025-12-15", "id": "7a0974007fd94a3764aca5c6f1ca2eaa", "content": "答：\n使用公司发放购物卡购买商品是不能开具发票的。您所说的此类公司发放的超市购物卡属于预付卡的一种，根据《国家税务总局关于营改增试点若干征管问题的公告》（国家税务总局公告2016第53号）相关规定，售卡人在销售预付卡时取得的资金，不缴纳增值税，可以向购卡人、充值人开具增值税普通发票，不得开具增值税专用发票。当持卡人在超市商户使用购物卡进行消费时，销售方应按照现行规定缴纳增值税，且不得向持卡人开具增值税发票。"}, {"source": "内部审计", "category": "论坛讨论", "title": "国有企“两金”清理工作的心得与思考", "url": "https://bbs.esnai.cn/thread-5495173-1-1.html", "date": "2025-12-11", "content": "国有企“两金”清理工作的心得与思考一、背景与认识 近年来，国有企业“两金”（应收账款和存货）压降工作已成为深化国企改革、提升资产质量的重要抓手。从审计实践来看，“两金”占比过高不仅占用大量资金、增加财务成本，还潜藏资产减值风险和经营隐患。笔者结合“两 ...", "id": "2d11a2b081162cf61d5e45906772f8a1"}, {"source": "内部审计", "category": "论坛讨论", "title": "关于国有企业交付高质量内部审计项目的几点心得", "url": "https://bbs.esnai.cn/thread-5495172-1-1.html", "date": "2025-12-11", "content": "近期公司着力打造高质量内部审计项目，持续关注内部审计项目质量，笔者结合公司近年来推动高质量内部审计项目的实践，就如何系统性提升内部审计项目质量，谈几点心得与思考。一、健全审计治理架构，夯实制度根基，是提升审计质量的前提内部审计的独立性与权威性直接影 ...", "id": "0609e24aa4ec6a97d89aeccbec4ae081"}, {"source": "内部审计", "category": "论坛讨论", "title": "从内审员到企业高管（高管续）谢绝转载十续", "url": "https://bbs.esnai.cn/thread-5495003-1-1.html", "date": "2025-11-28", "content": "接着十 补充续 任何企业都是有痛点的，你也可以简单理解为 老板肯定有头疼的事情或者想解决的问题。找一个自己擅长的，可能未来这个位置的高管位置就是你的了。如果你只是做合规性审计、内控审计、风险识别，哪怕是舞弊调查，那就与高管位置无缘了，因为那仅仅是审计思 ...", "id": "8fd57502d25c18b69c0a9e9b2ca742cf"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是一般纳税人，员工出差、休探亲假，以及公司组织员工外出旅游产生的住宿费，我们都取得了增值税专用发票，请问这些专票能否抵扣进项税额？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5245336/content.html", "date": "2025-11-26", "id": "42d94913b5ab9976a0dec8dbee353028", "content": "答：\n您好！一般纳税人取得的住宿费增值税专用发票，能否抵扣，需分情况处理，具体如下：\n1.可抵扣情形：公司员工因公务出差产生的住宿费，取得的增值税专用发票，其进项税额可以按规定抵扣销项税。这是因为出差住宿属于企业生产经营相关的合理支出，符合进项税抵扣的相关规定。\n2.不可抵扣情形：按照规定，如果住宿费用于集体福利或个人消费，即使取得增值税专用发票，进项税额也不能抵扣。比如员工探亲住宿（属于个人消费）、公司组织员工旅游住宿（属于集体福利），这些情况下的住宿费专票均无法抵扣。\n需要特别提醒的是，若属于不可抵扣情形，即使已认证抵扣，也需在后续纳税申报时做进项税额转出处理，避免税务风险。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是一家科技制造企业，想问一下，在10月份预缴申报时，如何享受研发费用加计扣除优惠？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5244846/content.html", "date": "2025-11-06", "id": "d60dd7b35b96665a51aa7a4ce168b6cc", "content": "答：\n按照政策规定，企业可以在7月申报期、10月申报期和年度汇算清缴期三个时点申报享受研发费用加计扣除优惠政策。在每年10月份预缴申报第三季度（按季预缴）或9月份（按月预缴）企业所得税时，企业可以根据盈亏情况、研发费用核算情况、研发费用金额大小等因素，自主选择是否就当年前三季度研发费用享受加计扣除优惠政策。在10月份预缴申报期没有选择享受研发费用加计扣除优惠政策的，可以在办理当年度企业所得税汇算清缴时统一享受。\n企业享受研发费用加计扣除优惠政策采取“自行判别、申报享受、相关资料留存备查”的办理方式。\n填报报表时应这样操作：\n1.根据实际发生的研发费用支出，计算加计扣除金额，在《中华人民共和国企业所得税月（季）度预缴纳税申报表（A类）》第22行“减：免税收入、减计收入、加计扣除”的明细行次填写“优惠事项名称”和对应金额。\n2.根据享受加计扣除优惠的研发费用情况（上半年或前三季度）填写《研发费用加计扣除优惠明细表》(A107012)。《研发费用加计扣除优惠明细表》（A107012）与规定的其他资料一并留存备查。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是一般纳税人，销售自己使用过的固定资产适用简易计税方法的，如何填写增值税申报表？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5243574/content.html", "date": "2025-10-11", "id": "1c9bc8d04e084e47a96d7c7c8ae6ee9d", "content": "答：\n一般纳税人销售自己使用过的固定资产，符合相关规定的，可以选择适用简易办法依照3%征收率减按2%征收增值税优惠政策，填表方法如下：\n1.将价款按3%征收率换算为不含税销售额，销售额=含税销\n售额÷（1+3%），销项税额=销售额x3%。将销售额、销项税\n额填写至《增值税及附加税费申报表附列资料（一）》第11栏对应的列次。\n2.《增值税减免税申报明细表》的减税项目中“减税性质代码及名称”选择“0001129924”，对应减征的增值税应纳税额按销售额的1%计算填写在《增值税减免税申报明细表》减税项目相应栏次。\n3.《增值税及附加税费申报表》主表第5栏填写“按简易办法计税销售额”，第21栏填写“简易计税办法计算的应纳税额”，第23栏填写“应纳税额减征额”，第24栏填写“应纳税额合计”。填写《增值税及附加税费申报表附列资料（一）》《增值税减免税申报明细表》后，系统会自动生成《增值税及附加税费申报表》主表的数据。"}, {"source": "国家税务局", "category": "留言咨询", "title": "上一年度享受了研发费用加计扣除优惠，相关资料应由总机构留存备查还是分支机构留存备查？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5243107/content.html", "date": "2025-09-10", "id": "9413a27fae7f4279f1fb0450070af181", "content": "答：\n上一年度，无论是总机构还是非法人分支机构发生适用税前加计扣除政策的研发活动，均由总机构汇总计算并享受研发费用加计扣除优惠政策。\n根据《国家税务总局关于发布修订后的〈企业所得税优惠政策事项办理办法〉的公告》（国家税务总局公告2018年第23号）第八条规定，设有非法人分支机构的居民企业以及实行汇总纳税的非居民企业机构、场所享受优惠事项的，由居民企业的总机构以及汇总纳税的主要机构、场所负责统一归集并留存备查资料。\n因此，跨省经营汇总纳税企业在上一年度享受了研发费用加计扣除优惠，相关资料应当由总机构留存备查。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我们企业买了一套二手房，想问一下，该如何计提折旧？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5242302/content.html", "date": "2025-08-13", "id": "f866b9455982bb7cbb026ddbc587170a", "content": "答：\n通俗理解，计提折旧就是企业将固定资产在使用过程中逐渐损耗的价值，按一定方法分摊到其预计使用寿命内的会计处理过程。根据《中华人民共和国企业所得税法实施条例》（中华人民共和国国务院令第512号）的规定，房屋、建筑物固定资产计算折旧的最低年限为20年。\n企业外购的固定资产，以购买价款和支付的相关税费以及直接归属于使该资产达到预定用途发生的其他支出为计税基础。固定资产按照直线法计算的折旧，准予扣除。企业应当自固定资产投入使用月份的次月起计算折旧；停止使用的固定资产，应当自停止使用月份的次月起停止计算折\n旧。\n企业应当根据固定资产的性质和使用情况，合理确定固定资产的预计净残值。固定资产的预计净残值一经确定，不得变更。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我家里亲戚有闲置的房子计划开一家共享茶室，听说个体工商户可以享受减半征收个人所得税优惠，有什么条件要求吗？如果继续开新店，要怎么享受这项政策？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5241868/content.html", "date": "2025-07-16", "id": "99897fe2992249c919dedfa698e202c7", "content": "答：\n根据《国家税务总局关于进一步落实支持个体工商户发展个人所得税优惠政策有关事项的公告》（国家税务总局公告2023年第12号）规定：对个体工商户应纳税所得额不超过200万元的部分，减半征收个人所得税。个体工商户在享受现行其他个人所得税优惠政策的基础上，可叠加享受本条优惠政策。个体工商户不区分征收方式，均可享受。\n如果您亲戚的茶室开了新店，就属于个体工商户从两处以上取得经营所得，需在办理年度汇总纳税申报时，合并计算个体工商户经营所得年应纳税所得额，重新计算减免税额，多退少补。"}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第二十四号）", "url": "https://www.cicpa.org.cn/xxfb/tzgg/202507/t20250701_65502.html", "date": "2025-07-01", "id": "49109b80e4f9d86eddaf3d16bc781bda", "content": "为贯彻落实《中共中央办公厅\n国务院办公厅印发\n<关于进一步加强财会监督工作的意见>的通知》、《国务院办公厅关于进一步规范财务审计秩序\n促进注册会计师行业健康发展的意见》（国办发〔\n2021\n〕\n30\n号）等文件精神，根据《会计师事务所执业质量检查制度》（会协〔\n2011\n〕\n39\n号），\n20\n24\n年，按照财会监督专项行动和注册会计师行业\n“执业监督提质年”主题活动的部署安排，中国注册会计师协会（以下简称中注协）\n联合\n财政部监督评价局\n，\n组织相关人员与财政部监管局组\n建\n检查组，对备案从事证券服务业务的会计师事务所进行执业质量检查；组织\n各省、自治区、直辖市\n及深圳\n市\n注册会计师协会（以下简称地方注协）\n，联合地方财政部门，对本区域内的会计师事务所开展执业质量检查。现将有关情况公告如下。\n一、总体情况\n截至\n202\n3\n年\n底\n，全国共有\n会计师\n事务所\n10665\n家（总所\n9305\n家，分所\n1360\n家）\n。\n2024年，\n中注协与地方注协共对\n2226家会计师事务所开展执业质量检查。截至目前，中注协及地方注协共\n对存在违规问题的\n343\n家\n会计师\n事务所和\n784\n名注册会计师实施了行业惩戒及自律监管措施。其中，对\n67\n家\n会计师\n事务所和\n209\n名注册会计师\n予以\n公开谴责；对\n78\n家\n会计师\n事务所和\n204\n名注册会计师\n予以\n通报批评；对\n56\n家\n会计师\n事务所和\n179\n名注册会计师\n予以\n训诫\n；\n对其他\n142\n家\n会计师\n事务所和\n192\n名注册会计师采取约谈\n、责令整改\n等\n自律\n监管措施。\n二、\n典型案例\n（\n一\n）\n北京亚泰国际会计师事务所（特殊普通合伙）\n（\n现\n北京亚泰国际会计师事务所（普通合伙）\n）\n质量管理体系在设计和运行方面存在重大缺陷，不能合理保证会计师事务所及注册会计师执业行为在所有重大方面符合质量管理相关规定以及职业道德守则和业务准则的要求\n。该所多个审计项目未\n严格执行执业准则，未保持应有的职业怀疑，应收账款、存货、商誉、长期股权投资、无形资产、投资性房地产、资本公积、营业收入、营业成本、销售费用、政府补助、合并范围等重要科目或事项审计程序执行不到位，未获取充分、适当的审计证据，形成的审计结论不恰当。中注协对该所及注册会计师\n田梦珺、莫卫武、徐成光、周宛飞、张显玉、郑运霞、张明、胡志勇、赵雅楠、程程\n给予公开谴责的行业惩戒。\n（\n二\n）\n北京中名国成会计师事务所（特殊普通合伙）\n上海自贸试验区分所\n在相关注册会计师不知情的情况下，\n使用软件在鉴证报告上拼贴注册会计师\n印\n章及个人签名图片，冒用\n注册会计师\n名义出具\n99\n份鉴证报告。同时，该所部分审计项目存在未编制总体审计策略、具体审计计划，未恰当实施风险评估程序，应收账款、长期股权投资、应付账款、短期借款、营业收入、营业成本、研发费用等重要科目审计程序执行不到位，未见期初余额、期后事项、或有负债等事项相关审计工作底稿等情况。上海市注册会计师协会\n对\n该\n所及注册会计师潘湘成、贾海亮、陈平\n给予\n公开谴责\n的行业惩戒\n。\n（\n三\n）\n竹溪精诚联合会计师事务所（普通合伙）\n未按要求\n建\n立质量管理体系。\n该所仅有两名执业人员（合伙人），\n在注册会计师行业统一监管平台报备\n230份审计报告，报备数量与\n自查报告业务清单\n数量（\n21份）完全不符，隐瞒的年报审计\n项目\n均\n无审计\n工作\n底稿。\n同时，该所部分审计项目存在业务约定书、管理层声明书无被审计单位盖章；部分科目仅编制了明细表，未执行其他审计程序；\n项目复核流程流于形式，无实质性复核记录等情况。\n湖北省注册会计师协会\n对\n该所\n及首席合伙人\n刘义华\n给予\n公开谴责\n的行业惩戒。\n（\n四\n）\n河南众兴联合会计师事务所\n（\n普通合伙\n）\n部分审计项目未编制审计工作底稿即出具了审计报告\n。部分审计项目未执行风险评估程序，\n未确定重要性水平，未编制具体审计计划，\n重要科目实质性审计程序缺失，银行存款及应收账款未执行函证程序且未说明理由，\n未执行替代测试，存货、固定资产科目未实施监盘，营业收入、营业成本科目未实施实质性审计程序，业务复核流于形式\n等。河南省注册会计师协会对该所及执行合伙人李忠义、注册会计师郭悦俊给予公开谴责的行业惩戒。\n（\n五\n）\n湖北鹏信会计师事务所（普通合伙）\n存在非注册会计师实际控制\n，\n通过与咨询公司\n合作出具\n鉴证\n报告并分享业务收入，\n审计\n项目分类不准确、未\n按规定\n报备，\n审计\n报告文号跳号、重号\n等情况\n。\n同时，该所部分审计项目\n未设定重要性水平，银行存款未执行函证程序，应收账款、存货、营业收入、营业成本、管理费用等重要科目仅见审定表，无\n其他审计工作底稿。\n湖北省注册会计师协会\n对\n该所\n及首席合伙人耿昌敬\n给予\n公开谴责\n的行业惩戒。\n（\n六\n）\n云南中韬龙和会计师事务所（普通合伙）\n存在\n为\n获得客户支付业务介绍费\n的情况\n。\n该所质量管理体系未设计和实施风险评估程序，执行业务承接与保持的时间晚于业务约定书的签订日期，合伙人与普通员工晋升制度未体现以质量为导向。部分审计项目主营业务收入、货币资金、应收账款、预收账款、管理费用等重要科目审计程序执行不到位，\n审计报告意见类型不恰当。云南省注册会计师协会对\n该所及注册会计师\n刘蕾、\n龙寿娟给予公开谴责的行业惩戒。\n（\n七\n）\n北京厚德会计师事务所（特殊普通合伙）\n违反职业道德要求，对外发放宣传单，宣传内容包含\n“合作伙伴分成比例1:9”、“报告出具快、回款快”等内容。该所存在部分审计项目未合理执行控制测试，未记录函证控制过程，审计工作底稿复核记录日期晚于审计报告日，将被审计客户给其他会计师事务所的回函修改为该所回函等情况。北京注册会计师协会对该所及首席合伙人谢付生\n，\n注册会计师王瑞、王永平、杨松给予公开谴责的行业惩戒。\n（\n八\n）\n广东华杏会计师事务所（普通合伙）\n在执业质量检查期间，未按照检查工作要求提供相关资料，未配合检查工作。\n经查，该所还存在相关注册会计师未实际参与审计工作即出具审计报告的情况\n。\n深圳市注册会计师协会对该所\n及注册会计师高君盼、李娟给予\n公开谴责的行业惩戒。\n（\n九\n）\n广东广正会计师事务所（普通合伙）\n未按照质量管理准则要求修订和完善质量管理制度，已制定的相关制度与该所实际情况不符，形同虚设。该所公章以及有关注册会计师签字章由其他单位人员保管，相关注册会计师对签字章的使用情况不了解。该所部分审计项目还存在初步业务活动、风险评估程序流于形式，未实施银行存款、应收账款函证程序，且未说明不函证的理由，未实施存货、固定资产监盘程序，短期借款、营业收入、营业成本、管理费用、销售费用等重要科目审计程序执行不到位，项目复核流于形式，未按规定时间完成审计工作底稿归档等情况。广东省\n注册会计师协会对该所及\n首席合伙人张义荣\n，\n注册会计师赖成功、曹平给予\n公开谴责的行业惩戒。\n各会计师事务所\n要\n恪守职业道德，遵守执业准则，聚焦提升审计质量，守住诚信操守底线，筑牢法律法规红线，独立、客观、公正、规范执业，切实发挥执业监督作用，更好服务中国式现代化建设。"}, {"source": "国家税务局", "category": "留言咨询", "title": "年度中间符合小型微利企业条件的，可以享受小型微利企业企业所得税优惠政策吗？如果可以，之前多预缴的税款如何处理？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5241196/content.html", "date": "2025-06-20", "id": "2cbb612948b75aadc91eb90289d13d94", "content": "答：\n根据《关于落实小型微利企业所得税优惠政策征管问题的公告》（国家税务总局公告2023年第6号）第五条规定，原不符合小型微利企业条件的企业，在年度中间预缴企业所得税时，按照相关政策标准判断符合小型微利企业条件的，应按照截至本期预缴申报所属期末的累计情况，计算减免税额。当年度此前期间如因不符合小型微利企业条件而多预缴的企业所得税税款，可在以后季度应预缴的企业所得税税款中抵减。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我是甲企业法定代表人，甲企业因管理不善纳税信用被评为D级，为何我名下注册登记的乙企业也被评为D级，该怎么办呢？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5240871/content.html", "date": "2025-05-30", "id": "1e47a45ef41652d3b03b5a3aa8005f0e", "content": "答：\n乙企业是被关联评价为D级了。根据《国家税务总局关于发布〈纳税信用管理办法(试行)〉的公告》（国家税务总局公告2014年第40号）第三十二条第一项规定，公开D级纳税人及其直接责任人员名单，对直接责任人员注册登记或者负责经营的其他纳税人纳税信用直接判为D级。\n如果甲企业纳税信用修复后纳税信用等级不再为D级，乙企业可向主管税务机关申请解除纳税信用D级关联，税务机关依据纳税人申请重新评价纳税信用级别。如果甲企业未申请修复或修复后纳税信用级别仍为D级，乙企业则需要在申请前连续6个月没有新增纳税信用失信行为记录，才可向主管税务机关申请纳税信用修复，税务机关依据纳税人申请重新评价纳税信用级别。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司在预缴时享受了小型微利企业所得税优惠，汇算清缴时发现不符合小型微利企业条件的怎么办？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5240479/content.html", "date": "2025-05-16", "id": "2190eafb3c965c98d970be0771a852b2", "content": "答：\n您说的这种情况，应当按规定补缴企业所得税税款。\n按照政策规定，2023年到2027年，我国对小型微利企业减按25%计算应纳税所得额，按20%的税率缴纳企业所得税，实际税负率仅有5%。\n享受这一优惠的小型微利企业，是指从事国家非限制和禁止行业，且同时符合年度应纳税所得额不超过300万元、从业人数不超过300人、资产总额不超过5000万元等条件的企业。\n按照《国家税务总局关于落实小型微利企业所得税优惠政策征管问题的公告》（国家税务总局公告2023年第6号）规定，小型微利企业预缴企业所得税时，从业人数、资产总额、年度应纳税所得额指标，暂按当年度截至本期预缴申报所属期末的情况进行判断。\n也就是说，在预缴时，只要符合小型微利企业条件的，都可以先享受相关优惠政策。但在年度汇算清缴时发现不符合相关政策标准的，就要按规定补缴企业所得税税款。"}, {"source": "国家税务局", "category": "留言咨询", "title": "某纳税人2019年4月购进不动产，取得增值税专用发票并已认证，金额1000万元，税额90万元，应当如何填写增值税纳税申报表？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5239884/content.html", "date": "2025-04-18", "id": "daeb6b5cfe0a9ab1da733e49833c95d9", "content": "答：\n《财政部 税务总局 海关总署关于深化增值税改革有关政策的公告》（财政部 税务总局 海关总署公告2019年第39号）第五条规定，自2019年4月1日起，纳税人取得不动产或者不动产在建工程的进项税额不再分2年抵扣。该纳税人在办理2019年4月税款所属期纳税申报时，应将购入不动产取得的增值税专用发票份数，以及专用发票上注明的金额、税额填入《增值税纳税申报表附列资料（二）》第2行“其中：本期认证相符且本期申报抵扣”的对应栏次；同时，还需将上述内容填入本表第9行“（三）本期用于购建不动产的扣税凭证”的对应栏次。"}, {"source": "国家税务局", "category": "留言咨询", "title": "增值税一般纳税人购进国内旅客运输服务取得航空运输电子客票行程单的，如何计算进项税额？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5239249/content.html", "date": "2025-03-27", "id": "b2a5a6113e4db06e90b661d11a3605b0", "content": "答：\n取得注明旅客身份信息的航空运输电子客票行程单的，按照下列公式计算进项税额：航空旅客运输进项税额＝（票价+燃油附加费）÷（1+9%）×9%。"}, {"source": "国家税务局", "category": "留言咨询", "title": "E公司因员工出差计划取消，支付给航空代理公司退票费，并取得了6%税率的增值税专用发票。E公司可以抵扣该笔进项税额吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5238681/content.html", "date": "2025-03-03", "id": "6916a6bf27b086f01ede78794d0183d6", "content": "答：\n按照现行政策规定，航空代理公司收取的退票费，属于现代服务业的征税范围，应按照6%税率计算缴纳增值税。E公司因公务支付的退票费，属于可抵扣的进项税范围，其增值税专用发票上注明的税额，可以从销项税额中抵扣。"}, {"source": "国家税务局", "category": "留言咨询", "title": "纳税人购进国内旅客运输服务，取得增值税专用发票，按规定可抵扣的进项税额怎么申报？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5238284/content.html", "date": "2025-02-10", "id": "13f7dfbe1d3e29bbe46dbd71ab890fbc", "content": "答：\n纳税人购进国内旅客运输服务，取得增值税专用发票，按规定可抵扣的进项税额，在申报时填写在《增值税纳税申报表附列资料（二）》“（一）认证相符的增值税专用发票”对应栏次中。"}, {"source": "国家税务局", "category": "留言咨询", "title": "深化增值税改革，对增值税一般纳税人购进农产品，原适用10%扣除率的是否有调整？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5237967/content.html", "date": "2025-01-20", "id": "60ad1aa0de34193654eca4949bfd2b90", "content": "答：\n有调整。深化增值税改革有关政策公告规定，对增值税一般纳税人购进农产品，原适用10%扣除率的，扣除率调整为9%。"}, {"source": "国家税务局", "category": "留言咨询", "title": "E公司2019年3月份购入一间厂房，当月取得增值税专用发票并在增值税发票选择确认平台勾选确认，办理3月税款所属期申报时，该厂房的进项税额可以一次性抵扣吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5237797/content.html", "date": "2025-01-10", "id": "c6b41bca486cdf1e68a6bcccbc028e86", "content": "答：\n不可以。《财政部 税务总局 海关总署关于深化增值税改革有关政策的公告》（财政部 税务总局 海关总署公告2019年第39号）第五条规定，自2019年4月1日起，纳税人取得不动产或者不动产在建工程的进项税额不再分2年抵扣。此前按照规定尚未抵扣完毕的待抵扣进项税额，可自2019年4月税款所属期起从销项税额中抵扣。E公司3月份购入的不动产，属于2019年4月1日前购入，应在3月税款所属期抵扣60%进项税额，余下的40%进项税额自4月税款所属期起抵扣完毕。"}, {"source": "国家税务局", "category": "留言咨询", "title": "增值税一般纳税人从批发、零售环节购进适用免征增值税政策的蔬菜而取得的普通发票，能否作为计算抵扣进项税额的凭证？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5237588/content.html", "date": "2025-01-03", "id": "809dec59567c12452a0b42f19731c3b7", "content": "答：\n增值税一般纳税人从批发、零售环节购进适用免征增值税政策的蔬菜而取得的普通发票，不得作为计算抵扣进项税额的凭证。"}, {"source": "国家税务局", "category": "留言咨询", "title": "增值税一般纳税人购进国际旅客运输服务，能否抵扣进项税额？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5237341/content.html", "date": "2024-12-24", "id": "def3571deb1f6798499adc03bf0e0013", "content": "答：\n不能。纳税人提供国际旅客运输服务，适用增值税零税率或免税政策。相应地，购买国际旅客运输服务不能抵扣进项税额。"}, {"source": "国家税务局", "category": "留言咨询", "title": "增值税一般纳税人购进国内旅客运输服务，能否抵扣进项税额？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5237264/content.html", "date": "2024-12-17", "id": "50775185a934783a971d6275f318e2d1", "content": "答：\n可以。自2019年4月1日起，增值税一般纳税人购进国内旅客运输服务，其进项税额允许从销项税额中抵扣。"}, {"source": "国家税务局", "category": "留言咨询", "title": "公司2018年10月购进不动产抵扣了进项税额的60%部分，尚未抵扣完毕的40%部分，2019年4月1日以后可以分几个月进行抵扣吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5236532/content.html", "date": "2024-12-10", "id": "2d2a0b2659394128476381a54fd4699d", "content": "答：\n不可以。按照《财政部 税务总局 海关总署关于深化增值税改革有关政策的公告》（财政部 税务总局 海关总署公告2019年第39号）规定，纳税人在2019年3月31日前尚未抵扣的不动产进项税额的40%部分，自2019年4月所属期起，只能一次性转入进项税额进行抵扣。"}, {"source": "国家税务局", "category": "留言咨询", "title": "A单位2019年4月购入一层写字楼，取得增值税专用发票，购入写字楼的不动产进项税额还需要分两年抵扣吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5236384/content.html", "date": "2024-12-06", "id": "1ea98be5914151579cd3937257166f70", "content": "答：\n不需要，自2019年4月1日起，增值税一般纳税人取得不动产的进项税额不再分两年抵扣，而是在购进不动产的当期一次性抵扣进项税额。"}, {"source": "国家税务局", "category": "留言咨询", "title": "自2019年4月1日起，适用9%税率的增值税应税行为包括哪些？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5236314/content.html", "date": "2024-12-02", "id": "94b2cb90e1be84f98fdb14410f38bdac", "content": "答：\n自2019年4月1日起，增值税一般纳税人销售交通运输、邮政、基础电信、建筑、不动产租赁服务，销售不动产，转让土地使用权，销售或者进口下列货物，税率为9%：粮食等农产品、食用植物油、食用盐；自来水、暖气、冷气、热水、煤气、石油液化气、天然气、二甲醚、沼气、居民用煤炭制品；图书、报纸、杂志、音像制品、电子出版物；饲料、化肥、农药、农机、农膜;国务院规定的其他货物。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司符合享受先进制造业加计抵减政策，请问享受该项优惠应该如何填写申报表?", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5236295/content.html", "date": "2024-11-29", "id": "a32f22000e7627e30393adb7d038c370", "content": "答：\n根据《增值税及附加税费申报表（一般纳税人适用）》及其附列资料填写说明，享受先进制造业加计抵减政策纳税人应填写增值税及附加税费申报表附列资料（四）（税额抵减情况表），本表第6至8行仅限适用加计抵减政策的纳税人填写，反映其加计抵减情况，其他纳税人不需填写。第8行“合计”等于第6行、第7行之和。各列说明如下：\n1.第1列“期初余额”：填写上期期末结余的加计抵减额。\n2.第2列“本期发生额”：填写按照规定本期计提的加计抵减额。\n3.第3列“本期调减额”：填写按照规定本期应调减的加计抵减额。\n4.第4列“本期可抵减额”：按表中所列公式填写。（4＝1＋2－3）\n5.第5列“本期实际抵减额”：反映按照规定本期实际加计抵减额，按以下要求填写。\n若第4列≥0，且第4列＜主表第11栏－主表第18栏，则第5列＝第4列；\n若第4列≥主表第11栏－主表第18栏，则第5列＝主表第11栏－主表第18栏；\n若第4列＜0，则第5列等于0。\n计算本列“一般项目加计抵减额计算”行和“即征即退项目加计抵减额计算”行时，公式中主表各栏次数据分别取主表“一般项目”“本月数”列、“即征即退项目”“本月数”列对应数据。\n6.第6列“期末余额”：填写本期结余的加计抵减额，按表中所列公式填写。（6＝4－5）"}, {"source": "国家税务局", "category": "留言咨询", "title": "我跳槽到了新公司，可我个税APP里还存在老东家的任职受雇信息，我想把它删掉，如何处理？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5236049/content.html", "date": "2024-11-22", "id": "51d30da5717d50304ee50f6ca51c3c20", "content": "答：\n首先，您新入职的公司可以正常新增您的任职受雇信息，且不影响您工资薪金的正常申报。如果您想删除原扣缴单位任职受雇信息，有两种处理方式。\n第一种处理方式\n请您联系原扣缴单位，也就是您上一家工作单位的办税人员。让他通过自然人电子税务局（扣缴端或网页端）“人员信息采集”模块进行信息更新。\n扣缴端\n如使用自然人电子税务局（扣缴端），需将人员状态修改为“非正常“，并填写离职日期，进行保存和报送。\n网页端\n如使用自然人电子税务局（网页端），填写离职日期后点击报送即可。\n之后您个人所得税App中原公司的任职受雇信息将不再显示。\n第二种处理方式\n如果您联系不到原单位办税人员，可以自己通过个人所得税App发起申诉，操作步骤是这样的：打开个人所得税App，点击【我的】—【任职受雇】，点开您上一家任职受雇单位，点击右上角的【申诉】，申诉类型选择“曾经在职”，填写离职日期和补充说明后，点击【提交】，申诉状态变为已受理。\n主管税务机关会后台受理您的申诉信息，并联系您原公司展开调查，辅导办税人员及时准确填报员工离职信息。后续相关结果会通过个人所得税App主页的消息提醒反馈给您，敬请留意即可。"}, {"source": "国家税务局", "category": "留言咨询", "title": "企业的成本费用支出，当期未取得有效凭证，什么时候取得有效凭证就可以税前扣除？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5235861/content.html", "date": "2024-11-15", "id": "30c14894bd452f84210652bc585546a0", "content": "答：\n根据《国家税务总局关于企业所得税若干问题的公告》（国家税务总局公告2011年第34号）规定，企业当年度实际发生的相关成本、费用，由于各种原因未能及时取得该成本、费用的有效凭证，企业在预缴季度所得税时，可暂按账面发生金额进行核算；但在汇算清缴时，应补充提供该成本、费用的有效凭证。"}, {"source": "国家税务局", "category": "留言咨询", "title": "公司为员工租房支付的费用，可以企业所得税税前扣除吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5235723/content.html", "date": "2024-11-08", "id": "7f021f49d8c2ed8ab61af56b79910668", "content": "答：\n根据《中华人民共和国企业所得税法实施条例》(中华人民共和国国务院令第512号)的规定，“第四十条企业发生的职工福利费支出，不超过工资、薪金总额14%的部分，准予扣除。”\n《国家税务总局关于企业工资薪金及职工福利费扣除问题的通知》(国税函〔2009]3号)关于职工福利费扣除问题进一步明确:企业职工福利费，包括为职工卫生保健、生活、住房、交通等所发放的各项补贴和非货币性福利，包括企业向职工发放的因公外地就医费用、未实行医疗统筹企业职工医疗费用、职工供养直系亲属医疗补贴、供暖费补贴、职工防暑降温费、职工困难补贴、救济费、职工食堂经费补贴、职工交通补贴等。\n因此，你公司支付的员工租房费用，符合上述条件的可以在限额以内税前扣除。\n需要提醒的是，企业发生的职工福利费，应该单独设置账册，进行准确核算。没有单独设置账册准确核算的，税务机关应责令企业在规定的期限内进行改正。逾期仍未改正的，税务机关可对企业发生的职工福利费进行合理的核定。"}, {"source": "国家税务局", "category": "留言咨询", "title": "小规模纳税人纳税期限不同其享受免税政策的效果可能存在差异。那么，小规模纳税人能否自己选择按月或按季纳税？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5235598/content.html", "date": "2024-11-01", "id": "cc2b88c3366fe6132da2c4e4fa861d17", "content": "答：\n按照固定期限纳税的小规模纳税人可以根据自己的实际经营情况选择实行按月纳税或按季纳税。\n为确保年度内纳税人的纳税期限相对稳定，纳税人一经选择，一个会计年度内不能变更。这里的一个会计年度，是指会计上所说的1-12月，而不是自选择之日起顺延一年的意思。\n纳税人在每个会计年度内的任意时间均可以向主管税务机关提出选择变更其纳税期限，但纳税人一旦选择变更纳税期限后，当年12月31日前不得再次变更。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我是企业会计，想问一下什么情况下企业需要办理增值税一般纳税人资格登记？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5235450/content.html", "date": "2024-10-25", "id": "ad980e6a38dc7799cdf03a96472fdf71", "content": "答：\n根据《国家税务总局关于增值税一般纳税人登记管理办法》（国家税务总局令第43号）规定：增值税纳税人，年应税销售额超过财政部、国家税务总局规定的小规模纳税人标准的，除本办法第四条规定外，应当向主管税务机关办理一般纳税人登记。\n该办法第四条明确，按照政策规定，选择按照小规模纳税人的；以及年应税销售额超过规定标准的其他个人不办理一般纳税人登记。\n根据《财政部 税务总局关于统一增值税小规模纳税人标准的通知》（财税〔2018〕33号）规定：增值税小规模纳税人标准为年应征增值税销售额500万元及以下。\n年应税销售额，是指纳税人在连续不超过12个月或四个季度的经营期内累计应征增值税销售额，包括纳税申报销售额、稽查查补销售额、纳税评估调整销售额。\n销售服务、无形资产或者不动产有扣除项目的纳税人其应税行为年应税销售额按未扣除之前的销售额计算。纳税人偶然发生的销售无形资产转让不动产的销售额，不计入应税行为年应税销售额。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司目前属于按季纳税的小规模纳税人，随着经营规模扩大，我们在9月办理一般纳税人登记，9月1日生效。请问我公司三季度的申报应如何办理？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5235340/content.html", "date": "2024-10-18", "id": "9967579b696988bac3ddc62b7d5a78e2", "content": "答：\n你公司需要在10月份申报期内办理两项申报业务：一是办理9月税款所属期的一般纳税人申报；二是办理7-8月税款所属期的小规模纳税人申报。\n需要注意的是，对于按季申报纳税的小规模纳税人，在季度中间由小规模纳税人登记为一般纳税人的，其对应的小规模季度属期申报（即你公司7-8月所属期的申报），均统一以季度销售额30万元的标准来判断是否可以享受小规模纳税人免征增值税政策。即，如果你公司7-8月销售额未超过30万元的，仍可以享受小规模纳税人免征增值税优惠。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是一般纳税人，员工出差取得电子客票行程单，行程单中单独注明了改签费，改签费是否可以按照购进旅客运输服务计算抵扣进项税？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5235100/content.html", "date": "2024-10-11", "id": "7aeca288e33a09b18b6b9514e8bf7c0f", "content": "答：\n可以。航空运输电子客票行程单上列明的改签费和铁路车票上列明的改签费，均属于纳税人提供运输服务取得的全部价款和价外费用的范畴，可以按照《财政部 税务总局 海关总署关于深化增值税改革有关政策的公告》（财政部 税务总局 海关总署公告2019年第39号）第六条的有关规定计算抵扣进项税额。"}, {"source": "国家税务局", "category": "留言咨询", "title": "企业为全体员工支付的补充养老保险费和补充医疗保险费能否在企业所得税税前扣除？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5234524/content.html", "date": "2024-09-13", "id": "9f4ba8410f5dc2276c19f9f0404aba9f", "content": "答：\n根据《财政部 国家税务总局关于补充养老保险费 补充医疗保险费有关企业所得税政策问题的通知》（财税〔2009〕27号）的规定，自2008年1月1日起，企业根据国家有关政策规定，为在本企业任职或者受雇的全体员工支付的补充养老保险费、补充医疗保险费，分别在不超过职工工资总额5%标准内的部分，在计算应纳税所得额时准予扣除；超过的部分，不予扣除。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我购买了商业健康保险，准备填报享受税前扣除优惠，请问是否需要获得“税优识别码”?", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5234212/content.html", "date": "2024-08-30", "id": "a816be8ff07a056b5092b96a4dd0d106", "content": "答：\n需要。“税优识别码”是指为确保税收优惠商业健康保险保单的唯一性、真实性和有效性，由商业健康保险信息平台按照“一人一单一码”的原则对投保人进行校验后，下发给保险公司，并在保单凭证上打印的数字识别码。\n根据《国家税务总局关于推广实施商业健康保险个人所得税政策有关征管问题的公告》（国家税务总局公告2017年第17号）第五条以及第六条的规定：保险公司销售符合规定的商业健康保险产品，及时为购买保险的个人开具发票和保单凭证，并在保单凭证上注明“税优识别码”。\n个人购买商业健康保险未获得“税优识别码”的，其支出金额不得税前扣除。"}, {"source": "国家税务局", "category": "留言咨询", "title": "在个税APP修改专项附加扣除的实际操作中我发现，修改子女的教育信息，有时在原来信息基础上修改就可以，有时需要新增一条，这是什么原因呢?", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5233975/content.html", "date": "2024-08-23", "id": "0bd8b98700c19525f92937f5ca34a81a", "content": "答：\n纳税人的子女接受全日制学历教育的相关支出，按照每个子女每月2000元的标准定额扣除。学历教育包括义务教育（小学、初中教育），高中阶段教育（普通高中、中等职业、技工教育）、高等教育（大学专科、大学本科、硕士研究生、博士研究生教育），年满3岁至小学入学前处于学前教育阶段的子女，也按学历教育规定执行。\n子女教育阶段有变化的，纳税人应及时修改相关教育信息。需要在原来信息基础上修改的主要有：子女由小学升初中或转学换校等情况。此时，不需要新增信息，只需要在原有子女教育专项附加扣除记录中进行修改即可。需要新增一条信息的情况主要有：子女由幼儿园升入小学、初中升入高中、高中升入大学专科/本科、后续升入硕士研究生/博士研究生等情况，此时，不可以直接修改原有的子女教育专项附加扣除信息，需要新增一条教育阶段信息。例如，您孩子今年幼儿园升小学，如果您直接将2024年1-8月的“幼儿园”修改为“小学”，这会导致1-8月的数据被覆盖，无法享受对应阶段的专项附加扣除，正确做法是新增一条，填写小学教育信息，选择“扣除比例”和“申报方式”后点击提交。"}, {"source": "国家税务局", "category": "留言咨询", "title": "境外旅客离境时，应如何办理离境退税？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5233268/content.html", "date": "2024-07-31", "id": "76f914203847c1a1c4f30247842f5e6d", "content": "答：\n根据国家税务总局公告2015年第41号第二条、第八条、第十八条、第十九条和第二十二条，在我国境内连续居住不超过183天的外国人和港澳台同胞，境外旅客本人在退税商店购买且符合退税条件的个人物品，需要离境退税的，应当：\n1.境外旅客在退税商店购买退税物品，需要离境退税的，应当在离境前凭本人的有效身份证件及购买退税物品的增值税普通发票（由增值税发票系统升级版开具），向退税商店索取《离境退税申请单》。\n2.境外旅客离境时，应向海关办理退税物品验核确认手续。\n3.境外旅客向退税代理机构申请办理离境退税时，须提交以下资料：\n（1）本人有效身份证件；\n（2）经海关验核签章的《离境退税申请单》。\n4.境外旅客领取或者办理领取退税款时，应当签字确认《境外旅客购物离境退税收款回执单》。"}, {"source": "国家税务局", "category": "留言咨询", "title": "资源回收企业应如何做好企业所得税税前扣除凭证管理？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5232376/content.html", "date": "2024-06-12", "id": "266c72c0f42314a90a6008bee319bb0b", "content": "答：\n“反向开票”措施为资源回收企业取得合规的企业所得税税前扣除凭证提供了便利，可以在很大程度上解决困扰资源回收企业所得税成本无票列支问题，助力企业进一步规范会计核算，降低涉税风险。同时，对于包括通过“反向开票”方式开具的发票在内的各类企业所得税税前扣除凭证，资源回收企业均应严格按照税收法律、行政法规、规章和规范性文件相关规定执行。企业取得的税前扣除凭证不符合相关规定的，相应的支出将不能在发生年度税前扣除。不符合规定进行税前扣除的，税务机关将依法调整其应纳税所得额，追缴税款，并严格按照《中华人民共和国税收征收管理法》《中华人民共和国发票管理办法》等有关规定处理。"}, {"source": "国家税务局", "category": "留言咨询", "title": "通过“反向开票”方式开具的发票是否可以作为企业所得税税前扣除凭证？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5232248/content.html", "date": "2024-06-05", "id": "44fc9703a3efa1877470e1d75e4cfdf1", "content": "зӯ”пјҡ\nж №жҚ®гҖҠдёӯеҚҺдәәж°‘е…ұе’ҢеӣҪдјҒдёҡжүҖеҫ—зЁҺжі•гҖӢеҸҠе…¶е®һж–ҪжқЎдҫӢгҖҒгҖҠдёӯеҚҺдәәж°‘е…ұе’ҢеӣҪзЁҺж”¶еҫҒж”¶з®ЎзҗҶжі•гҖӢеҸҠе…¶е®һж–Ҫз»ҶеҲҷгҖҒгҖҠдёӯеҚҺдәәж°‘е…ұе’ҢеӣҪеҸ‘зҘЁз®ЎзҗҶеҠһжі•гҖӢеҸҠе…¶е®һж–Ҫз»ҶеҲҷгҖҒгҖҠеӣҪе®¶зЁҺеҠЎжҖ»еұҖе…ідәҺеҸ‘еёғ<дјҒдёҡжүҖеҫ—зЁҺзЁҺеүҚжүЈйҷӨеҮӯиҜҒз®ЎзҗҶеҠһжі•>зҡ„е…¬е‘ҠгҖӢпјҲ2018е№ҙз¬¬28еҸ·пјүзӯүзЁҺж”¶жі•еҫӢгҖҒиЎҢж”ҝжі•и§„гҖҒи§„з« е’Ңи§„иҢғжҖ§ж–Үд»¶и§„е®ҡпјҢдјҒдёҡеҸ‘з”ҹж”ҜеҮәпјҢеә”еҸ–еҫ—зЁҺеүҚжүЈйҷӨеҮӯиҜҒпјҢдҪңдёәи®Ўз®—дјҒдёҡжүҖеҫ—зЁҺеә”зәізЁҺжүҖеҫ—йўқж—¶жүЈйҷӨзӣёе…іж”ҜеҮәзҡ„дҫқжҚ®гҖӮиө„жәҗеӣһж”¶дјҒдёҡйҖҡиҝҮвҖңеҸҚеҗ‘ејҖзҘЁвҖқж–№ејҸејҖе…·зҡ„еҸ‘зҘЁпјҢз¬ҰеҗҲдёҠиҝ°зЁҺж”¶жі•еҫӢгҖҒиЎҢж”ҝжі•и§„гҖҒи§„з« е’Ңи§„иҢғжҖ§ж–Үд»¶зӣёе…іи§„е®ҡзҡ„пјҢеҸҜд»ҘдҪңдёәжң¬дјҒдёҡжүҖеҫ—зЁҺзЁҺеүҚжүЈйҷӨеҮӯиҜҒгҖӮ"}, {"source": "国家税务局", "category": "留言咨询", "title": "实行“反向开票”的资源回收企业应如何进行代办申报事项、缴纳代办税费？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5231597/content.html", "date": "2024-05-28", "id": "1723dd33399cbdfa640820b3425207c6", "content": "答：\n实行“反向开票”的资源回收企业，应按照规定在“反向开票”的次月申报期内，向企业所在地主管税务机关报送《代办税费报告表》和《代办税费明细报告表》，缴纳代办的增值税及附加税费、个人所得税。"}, {"source": "国家税务局", "category": "留言咨询", "title": "资源回收企业“反向开票”后，需要开具红字发票的如何处理？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5228242/content.html", "date": "2024-05-23", "id": "84fa1f0658d44596d3bc3e934f693c7e", "content": "答：\n资源回收企业“反向开票”后，发生销售退回、开票有误、销售折让等情形，需要通过增值税发票管理系统开具红字增值税专用发票的，由资源回收企业填开《开具红字增值税专用发票信息表》；需要通过电子发票服务平台开具红字增值税专用发票或普通发票的，由资源回收企业填开《红字发票信息确认单》。资源回收企业填开《开具红字增值税专用发票信息表》或《红字发票信息确认单》时，应当填写对应的蓝字发票信息，红字发票需与原蓝字发票一一对应。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是一家江苏退税商店，这个月有一名外籍人士在我处购买商品，护照上显示他已在我国境内连续居住超一年，请问能给其开具《离境退税申请单》吗?", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5221975/content.html", "date": "2024-03-25", "id": "c246bda48457e2ed136e9de5668f6b5a", "content": "答：\n不可以。按照现行规定，在我国境内连续居住不超过183天的外国人和港澳台同胞适用境外旅客购物离境退税政策。该旅客在我国境内连续居住超过183天，贵公司不得为其开具《离境退税申请单》。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是一家外贸企业，三个月前出口的一批货物已经办理退税，现在因质量问题退回来了，应该如何处理?", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5221825/content.html", "date": "2024-03-18", "id": "f90751950d1a021f5317863b0fca60d4", "content": "答：\n根据现行规定，贵公司出口货物发生退运，应向主管税务机关申请开具《出口货物已补税/未退税证明》，已办理出口退（免）税的，需要补缴已退税款，随后贵公司可凭该证明向海关申请办理退运手续。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司于2023年12月向巴西出口了一批工程机械产品，出口合同中约定的收汇日期为2024年6月30日，请问现在可以申报出口退（免）税吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5221768/content.html", "date": "2024-03-15", "id": "3dc0c9e028f9a5d1446e0a70c42aa115", "content": "答：\n可以。贵公司出口合同约定全部收汇最终日期（2024年6月30日）在申报出口退（免）税截止期限（2023年出口货物的申报退（免）税截止期限为2024年4月增值税纳税申报期）之后的，按照规定留存《出口货物收汇情况表》及相关出口合同等举证资料，即可视同收汇，正常申报办理出口退（免）税。需要注意的是，此类情况应当在合同约定全部收汇最终日期前完成收汇。"}, {"source": "国家税务局", "category": "留言咨询", "title": "请问出口退（免）税备案单证保存期是多久?", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5221702/content.html", "date": "2024-03-12", "id": "ef9d9d1723c6274b56d76c89a5de69ac", "content": "答：\n除另有规定外，出口退（免）税备案单证由出口企业存放和保管，不得擅自损毁，保存期为5年。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是一家出口服装的企业，2023年通过广交会成交一笔订单，但与外商签署的是电子购销合同，请问这样符合备案单证规定吗?", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5221512/content.html", "date": "2024-03-01", "id": "f415f9636f1b708f0c3f666204cd4b47", "content": "答：\n符合。电子购销合同是合同的一种形式。按照规定，贵公司可根据自身实际，自行选择纸质化、影像化或者数字化方式，留存保管出口退（免）税备案单证。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是一家生产企业，现在发现2023年3月办理核销的进料加工手册中填报的进出口数据有误，能重新办理核销吗?", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5221456/content.html", "date": "2024-02-28", "id": "49a11c752aa630b2e1ed9691d1016caf", "content": "答：\n可以。贵公司发现进料加工手册核销数据有误的，应在发现次月按照有关规定向主管税务机关重新办理核销手续。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是一家出口企业，现因经营不善需要注销税务登记，请问是否需要办理出口退（免）税备案撤回?", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5221431/content.html", "date": "2024-02-27", "id": "52647ae5a965f5baa7fe6e2585a0857c", "content": "答：\n需要。出口企业或其他单位申请注销税务登记的，应先向主管税务机关申请撤回出口退（免）税备案。出口企业或其他单位撤回出口退（免）税备案的，主管税务机关应按规定结清退（免）税款后办理。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是一家出口企业，2023年12月已办理出口退（免）税备案，但在2023年6月已出口了一批货物，请问该笔货物能否申报退（免）税？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5221372/content.html", "date": "2024-02-23", "id": "93a1b706b84ba9e550c36032be295206", "content": "答：\n可以。贵公司在出口退（免）税备案之前发生的出口货物劳务，在办理出口退（免）税备案后，可以在规定的退（免）税申报期内按规定申报增值税退（免）税或免税，以及消费税退（免）税或免税。"}, {"source": "国家税务局", "category": "留言咨询", "title": "什么是非居民企业？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5221098/content.html", "date": "2024-02-01", "id": "f0d24be5310af213c8f4ecd70feb238c", "content": "答：\n非居民企业，是指依照外国（地区）法律成立且实际管理机构不在中国境内，但在中国境内设立机构、场所的，或者在中国境内未设立机构、场所，但有来源于中国境内所得的企业。实际管理机构，是指对企业的生产经营、人员、账务、财产等实施实质性全面管理和控制的机构。机构、场所，是指在中国境内从事生产经营活动的机构、场所，包括：\n（一）管理机构、营业机构、办事机构；\n（二）工厂、农场、开采自然资源的场所；\n（三）提供劳务的场所；\n（四）从事建筑、安装、装配、修理、勘探等工程作业的场所；\n（五）其他从事生产经营活动的机构、场所。\n非居民企业委托营业代理人在中国境内从事生产经营活动的，包括委托单位或者个人经常代其签订合同，或者储存、交付货物等，该营业代理人视为非居民企业在中国境内设立的机构、场所。"}, {"source": "国家税务局", "category": "留言咨询", "title": "小规模纳税人可以办理出口退税吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5221096/content.html", "date": "2024-01-25", "id": "75f2ceed564d3970ed7c67404618bc23", "content": "答：\n增值税小规模纳税人出口的货物适用增值税免税政策。"}, {"source": "国家税务局", "category": "留言咨询", "title": "如果我司需要向境外支付资金，哪些情形需要办理对外支付税务备案呢？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5220664/content.html", "date": "2024-01-18", "id": "81fc714734ca8bc3e711eb8c462ccbc7", "content": "答：\n根据《国家税务总局 国家外汇管理局关于服务贸易等项目对外支付税务备案有关问题的公告》（国家税务总局 国家外汇管理局公告2013年第40号）境内机构和个人向境外单笔支付等值5万美元以上（不含等值5万美元，下同）下列外汇资金，除本公告第三条规定的情形外，均应向所在地主管税务机关进行备案：\n（一）境外机构或个人从境内获得的包括运输、旅游、通信、建筑安装及劳务承包、保险服务、金融服务、计算机和信息服务、专有权利使用和特许、体育文化和娱乐服务、其他商业服务、政府服务等服务贸易收入；\n（二）境外个人在境内的工作报酬，境外机构或个人从境内获得的股息、红利、利润、直接债务利息、担保费以及非资本转移的捐赠、赔偿、税收、偶然性所得等收益和经常转移收入；\n（三）境外机构或个人从境内获得的融资租赁租金、不动产的转让收入、股权转让所得以及外国投资者其他合法所得。"}, {"source": "国家税务局", "category": "留言咨询", "title": "非居民纳税人享受税收协定待遇应如何申请？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5220459/content.html", "date": "2024-01-12", "id": "846c774f86d718800b50f3849dbac0ff", "content": "答：\n非居民纳税人享受协定待遇，采取“自行判断、申报享受、相关资料留存备查”的方式办理。非居民纳税人自行判断符合享受协定待遇条件的，可在纳税申报时，或通过扣缴义务人在扣缴申报时，自行享受协定待遇，同时按照规定归集和留存相关资料备查，并接受税务机关后续管理。\n非居民纳税人自行申报的，自行判断符合享受协定待遇条件且需要享受协定待遇，应在申报时报送《非居民纳税人享受协定待遇信息报告表》，并按照规定归集和留存相关资料备查。\n在源泉扣缴和指定扣缴情况下，非居民纳税人自行判断符合享受协定待遇条件且需要享受协定待遇的，应当如实填写《非居民纳税人享受协定待遇信息报告表》，主动提交给扣缴义务人，并按照规定归集和留存相关资料备查。\n扣缴义务人收到《非居民纳税人享受协定待遇信息报告表》后，确认非居民纳税人填报信息完整的，依国内税收法律规定和协定规定扣缴，并如实将《非居民纳税人享受协定待遇信息报告表》作为扣缴申报的附表报送主管税务机关。\n非居民纳税人未主动提交《非居民纳税人享受协定待遇信息报告表》给扣缴义务人或填报信息不完整的，扣缴义务人依国内税收法律规定扣缴。"}, {"source": "国家税务局", "category": "留言咨询", "title": "先进制造业企业出口货物劳务、发生跨境应税行为可否适用加计抵减政策？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5220125/content.html", "date": "2024-01-05", "id": "9b01c3f4892bc2e7411dcd43122f33a2", "content": "зӯ”пјҡ\nж №жҚ®гҖҠиҙўж”ҝйғЁ зЁҺеҠЎжҖ»еұҖе…ідәҺе…ҲиҝӣеҲ¶йҖ дёҡдјҒдёҡеўһеҖјзЁҺеҠ и®ЎжҠөеҮҸж”ҝзӯ–зҡ„е…¬е‘ҠгҖӢпјҲиҙўж”ҝйғЁ зЁҺеҠЎжҖ»еұҖе…¬е‘Ҡ2023е№ҙз¬¬43еҸ·пјүпјҡвҖңдә”гҖҒе…ҲиҝӣеҲ¶йҖ дёҡдјҒдёҡеҮәеҸЈиҙ§зү©еҠіеҠЎгҖҒеҸ‘з”ҹи·Ёеўғеә”зЁҺиЎҢдёәдёҚйҖӮз”ЁеҠ и®ЎжҠөеҮҸж”ҝзӯ–пјҢе…¶еҜ№еә”зҡ„иҝӣйЎ№зЁҺйўқдёҚеҫ—и®ЎжҸҗеҠ и®ЎжҠөеҮҸйўқгҖӮ\nе…ҲиҝӣеҲ¶йҖ дёҡдјҒдёҡе…јиҗҘеҮәеҸЈиҙ§зү©еҠіеҠЎгҖҒеҸ‘з”ҹи·Ёеўғеә”зЁҺиЎҢдёәдё”ж— жі•еҲ’еҲҶдёҚеҫ—и®ЎжҸҗеҠ и®ЎжҠөеҮҸйўқзҡ„иҝӣйЎ№зЁҺйўқпјҢжҢүз…§д»ҘдёӢе…¬ејҸи®Ўз®—пјҡ\nдёҚеҫ—и®ЎжҸҗеҠ и®ЎжҠөеҮҸйўқзҡ„иҝӣйЎ№зЁҺйўқ=еҪ“жңҹж— жі•еҲ’еҲҶзҡ„е…ЁйғЁиҝӣйЎ№зЁҺйўқГ—еҪ“жңҹеҮәеҸЈиҙ§зү©еҠіеҠЎе’ҢеҸ‘з”ҹи·Ёеўғеә”зЁҺиЎҢдёәзҡ„й”Җе”®йўқГ·еҪ“жңҹе…ЁйғЁй”Җе”®йўқгҖӮвҖқ"}, {"source": "国家税务局", "category": "留言咨询", "title": "集成电路企业出口货物劳务、发生跨境应税行为，是否可以享受增值税进项税额加计抵减政策？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5219885/content.html", "date": "2023-12-27", "id": "67dfc2d6424aff3693f5b1885903c53d", "content": "答：\n根据《财政部 税务总局关于集成电路企业增值税加计抵减政策的通知》（财政部 税务总局公告2023年第17号）第五条规定，集成电路企业出口货物劳务、发生跨境应税行为不适用加计抵减政策，其对应的进项税额不得计提加计抵减额。\n集成电路企业兼营出口货物劳务、发生跨境应税行为且无法划分不得计提加计抵减额的进项税额，按照以下公式计算：\n不得计提加计抵减额的进项税额=当期无法划分的全部进项税额×当期出口货物劳务和发生跨境应税行为的销售额÷当期全部销售额"}, {"source": "国家税务局", "category": "留言咨询", "title": "按照现行规定不得从销项税额中抵扣的进项税额，是否可以计提加计抵减额？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5219631/content.html", "date": "2023-12-21", "id": "84ec2e08a2d33270510c7a72fbf51a8c", "content": "答：\n不可以。只有当期可抵扣进项税额才能计提加计抵减额。"}, {"source": "国家税务局", "category": "留言咨询", "title": "企业A已经开始享受先进制造业加计抵减政策，后期又被工信部门列入工业母机企业清单，是否可以选择停止享受先进制造业加计抵减政策，而申请享受工业母机加计抵减政策？工业母机加计抵减政策加计15%，如企业A前期已按先进制造业的5%计提加计抵减额，能否对差额部分进行补充计提？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5219630/content.html", "date": "2023-12-13", "id": "8d162073b42efa96d9b8cdb06da5d965", "content": "答：\n纳税人同时符合三项加计抵减政策的，可以择优选择适用，但在同一期间不得叠加适用。企业A先适用先进制造业加计抵减政策，后期可选择停止享受该政策，改为选择工业母机加计抵减政策，前期未计提的差额部分可以一次性补充计提。"}, {"source": "国家税务局", "category": "留言咨询", "title": "纳税人享受集成电路、工业母机、先进制造业企业增值税加计抵减政策，是否要向税务部门提交声明？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5218264/content.html", "date": "2023-12-08", "id": "b68e32b8f88aadba92d7bd3d2b414dda", "content": "答：\n《国家税务总局关于增值税小规模纳税人减免增值税等政策有关征管事项的公告》（2023年第1号）规定，符合规定的生产、生活性服务业纳税人，应在年度首次确认适用加计抵减政策时，通过电子税务局或办税服务厅提交《适用加计抵减政策的声明》。\n不同于生产、生活性服务业增值税加计抵减政策，三项加计抵减政策均采取清单管理，清单由工信部门牵头制定。清单内的纳税人进行纳税申报时，系统会弹出相关提示，引导纳税人申报享受对应的加计抵减政策，纳税人无需再提交相关声明。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司“六税两费”的申报逾期了，是否还可以享受“六税两费”减免优惠？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5217322/content.html", "date": "2023-12-01", "id": "7ac740378924c28876da707c16a2c4ca", "content": "зӯ”пјҡ\nеўһеҖјзЁҺе°Ҹи§„жЁЎзәізЁҺдәәйҖҫжңҹз”іжҠҘзҡ„вҖңе…ӯзЁҺдёӨиҙ№вҖқзЁҺиҙ№ж¬ҫзҡ„еұһжңҹеңЁ2019е№ҙ1жңҲ1ж—ҘиҮі2027е№ҙ12жңҲ31ж—ҘеҶ…пјҢеҸҜз”іжҠҘдә«еҸ—вҖңе…ӯзЁҺдёӨиҙ№вҖқеҮҸе…Қдјҳжғ пјӣзҷ»и®°дёәдёҖиҲ¬зәізЁҺдәәзҡ„дёӘдҪ“е·Ҙе•ҶжҲ·йҖҫжңҹз”іжҠҘзҡ„вҖңе…ӯзЁҺдёӨиҙ№вҖқзЁҺиҙ№ж¬ҫзҡ„еұһжңҹеңЁ2022е№ҙ1жңҲ1ж—ҘиҮі2027е№ҙ12жңҲ31ж—ҘеҶ…пјҢеҸҜз”іжҠҘдә«еҸ—еҮҸе…Қдјҳжғ пјӣзҷ»и®°дёәдёҖиҲ¬зәізЁҺдәәзҡ„е°ҸеһӢеҫ®еҲ©дјҒдёҡе’Ңж–°и®ҫз«ӢдјҒдёҡйҖҫжңҹз”іжҠҘзҡ„вҖңе…ӯзЁҺдёӨиҙ№вҖқзЁҺиҙ№ж¬ҫзҡ„еұһжңҹеңЁ2022е№ҙ1жңҲ1ж—ҘиҮі2027е№ҙ12жңҲ31ж—ҘеҶ…зҡ„пјҢз¬ҰеҗҲж–Үд»¶и§„е®ҡжғ…еҪўзҡ„пјҢд№ҹеҸҜз”іжҠҘдә«еҸ—еҮҸе…Қдјҳжғ гҖӮ"}, {"source": "国家税务局", "category": "留言咨询", "title": "外出报验的纳税人、跨区税源登记的纳税人能否享受“六税两费”减免政策？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5217014/content.html", "date": "2023-11-24", "id": "c7ca9d143314ba9d5b22e986ae0bc5fa", "content": "答：\n包括外出报验、跨区税源登记的纳税人在内的各类纳税人，均应当根据其税务登记信息、增值税一般纳税人登记信息和企业所得税汇算清缴信息，综合判断是否属于增值税小规模纳税人、个体工商户或小型微利企业，符合条件的可以享受“六税两费”减免政策。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是2023年的新设立企业，尚未办理过汇算清缴，能否申报享受“六税两费”减免优惠？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5216454/content.html", "date": "2023-11-16", "id": "6022f5ffb0cdc109a37fe1eb054cebd4", "content": "答：\n登记为增值税一般纳税人的新设立企业，从事国家非限制和禁止行业，且同时符合申报期上月末从业人数不超过300人、资产总额不超过5000万元两项条件的，在办理首次汇算清缴前，可按照小型微利企业申报享受“六税两费”减免优惠。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是按月申报的增值税小规模纳税人，2023年9月份预计销售货物取得收入20万元，请问能够享受什么减免税政策，又该如何开具增值税发票呢？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5216248/content.html", "date": "2023-11-10", "id": "23dbedcb55240890ee8135d5d487c650", "content": "答：\n《财政部 税务总局关于增值税小规模纳税人减免增值税政策的公告》（2023年第19号）第二条规定，增值税小规模纳税人适用3%征收率的应税销售收入，减按1%征收率征收增值税。\n《国家税务总局关于增值税小规模纳税人减免增值税等政策有关征管事项的公告》（2023年第1号）第五条规定，小规模纳税人取得应税销售收入，适用减按1%征收率征收增值税政策的，应按照1%征收率开具增值税发票。\n因此，您9月份销售货物取得的收入20万元，可以适用减按1%征收率征收增值税的政策，并按照1%征收率开具增值税专用发票或增值税普通发票。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司如何判断是否可以按照小型微利企业申报享受“六税两费”减免优惠？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5215937/content.html", "date": "2023-11-03", "id": "7966b7b7ec026a64564111fce682dcaf", "content": "зӯ”пјҡ\nе°ҸеһӢеҫ®еҲ©дјҒдёҡзҡ„еҲӨе®ҡд»ҘдјҒдёҡжүҖеҫ—зЁҺе№ҙеәҰжұҮз®—жё…зјҙз»“жһңдёәеҮҶгҖӮзҷ»и®°дёәеўһеҖјзЁҺдёҖиҲ¬зәізЁҺдәәзҡ„ж–°и®ҫз«ӢдјҒдёҡпјҢд»ҺдәӢеӣҪе®¶йқһйҷҗеҲ¶е’ҢзҰҒжӯўиЎҢдёҡпјҢдё”еҗҢж—¶з¬ҰеҗҲз”іжҠҘжңҹдёҠжңҲжң«д»Һдёҡдәәж•°дёҚи¶…иҝҮ300дәәгҖҒиө„дә§жҖ»йўқдёҚи¶…иҝҮ5000дёҮе…ғдёӨйЎ№жқЎд»¶зҡ„пјҢеҸҜеңЁеҠһзҗҶйҰ–ж¬ЎжұҮз®—жё…зјҙеүҚжҢүз…§е°ҸеһӢеҫ®еҲ©дјҒдёҡз”іжҠҘдә«еҸ—вҖңе…ӯзЁҺдёӨиҙ№вҖқеҮҸе…Қдјҳжғ пјӣеҜ№дәҺж–°и®ҫз«ӢеҪ“жңҲеҚіжҢүж¬Ўз”іжҠҘзҡ„пјҢеҲҷж №жҚ®и®ҫз«Ӣж—¶жҳҜеҗҰеҗҢж—¶з¬ҰеҗҲд»Һдёҡдәәж•°дёҚи¶…иҝҮ300дәәгҖҒиө„дә§жҖ»йўқдёҚи¶…иҝҮ5000дёҮе…ғдёӨйЎ№жқЎд»¶жқҘеҲӨж–ӯжҳҜеҗҰеҸҜд»ҘжҢүз…§е°ҸеһӢеҫ®еҲ©дјҒдёҡз”іжҠҘдә«еҸ—вҖңе…ӯзЁҺдёӨиҙ№вҖқеҮҸе…Қдјҳжғ гҖӮ"}, {"source": "国家税务局", "category": "留言咨询", "title": "我是个体工商户，属于按季申报的增值税小规模纳税人。2023年8月5日，自行开具了1张征收率为3%的增值税专用发票，提供给下游客户用于抵扣进项税额，尚未申报纳税。请问对于这笔销售收入，如果我要享受减按1%征收增值税政策，是否必须追回已开具的征收率为3%的专用发票？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5215730/content.html", "date": "2023-10-27", "id": "dace8440a1870f57463d6e605751e571", "content": "答：\n《财政部 税务总局关于增值税小规模纳税人减免增值税政策的公告》（2023年第19号）第二条规定，增值税小规模纳税人适用3%征收率的应税销售收入，减按1%征收率征收增值税。\n您取得适用3%征收率的应税销售收入，可以享受减按1%征收率征收增值税政策。但增值税专用发票具有抵扣功能，您已向购买方开具3%征收率的增值税专用发票，应在增值税专用发票全部联次追回予以作废或者按规定开具红字专用发票后，方可就此笔业务适用减征增值税政策。否则，需要就已开具增值税专用发票的应税销售收入按3%征收率申报缴纳增值税。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是分支机构，登记为一般纳税人，是否可以申报享受“六税两费”减免优惠？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5215463/content.html", "date": "2023-10-18", "id": "522a76cd0f7fe9c3a5efbdb93604d203", "content": "答：\n企业所得税实行法人税制，由总机构统一计算包括汇总纳税企业所属各个不具有法人资格分支机构在内的全部应纳税所得额、应纳税额，以法人机构为整体判断是否属于小型微利企业。企业所属各个不具有法人资格的分支机构，登记为增值税一般纳税人的，应当根据总机构是否属于小型微利企业来判别能否申报享受“六税两费”减免优惠。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是零售摩托车的增值税小规模纳税人，2023年8月销售额20万元，均为客户开具了3%征收率的机动车销售统一发票，请问我还能享受3%征收率销售收入减按1%征收增值税政策吗？我的个别客户为增值税一般纳税人，是否能够抵扣进项税额？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5215098/content.html", "date": "2023-10-11", "id": "6bdb59e5f7c68d5429752bc990370a68", "content": "答：\n《财政部 税务总局关于增值税小规模纳税人减免增值税政策的公告》（2023年第19号）第二条规定，增值税小规模纳税人适用3%征收率的应税销售收入，减按1%征收率征收增值税。\n根据上述规定，您可以享受3%征收率销售收入减按1%征收增值税政策。但由于您开具的3%征收率的机动车销售统一发票，具有抵扣功能，您的客户如为一般纳税人，可以凭您开具的3%征收率的机动车销售统一发票，抵扣对应的进项税额。因此，您需要追回已开具的3%征收率的机动车销售统一发票，重新开具1%征收率的机动车销售统一发票，方能享受减税政策。如无法追回，则需要按照3%征收率计算缴纳增值税。今后您要享受3%征收率销售收入减按1%征收增值税政策时，如需开具机动车销售统一发票，注意应按照1%征收率开具。"}, {"source": "国家税务局", "category": "留言咨询", "title": "“一老一小”扣除提高后的标准是多少？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5214546/content.html", "date": "2023-09-28", "id": "bd03031a918dab16162eb41e39b629ce", "content": "зӯ”пјҡ\nиҮӘ2023е№ҙ1жңҲ1ж—Ҙиө·пјҢжҸҗй«ҳ3еІҒд»ҘдёӢе©ҙе№је„ҝз…§жҠӨгҖҒеӯҗеҘіж•ҷиӮІе’ҢиөЎе…»иҖҒдәә3йЎ№дё“йЎ№йҷ„еҠ жүЈйҷӨж ҮеҮҶгҖӮе…¶дёӯпјҢ3еІҒд»ҘдёӢе©ҙе№је„ҝз…§жҠӨгҖҒеӯҗеҘіж•ҷиӮІдё“йЎ№йҷ„еҠ жүЈйҷӨж ҮеҮҶз”ұзҺ°иЎҢжҜҸеӯ©жҜҸжңҲ1000е…ғжҸҗй«ҳеҲ°2000е…ғпјҢд№ҹе°ұжҳҜиҜҙпјҢжҜҸдёӘеӯ©еӯҗд»ҺеҮәз”ҹеҲ°е®ҢжҲҗеӯҰеҺҶж•ҷиӮІпјҢе…¶зҲ¶жҜҚжҜҸдёӘжңҲеҸҜд»ҘеңЁзЁҺеүҚжүЈйҷӨ2000е…ғпјҢжҜҸе№ҙ2.4дёҮе…ғпјҢиҝҷдәӣжүЈйҷӨеҸҜд»Ҙз”ұзҲ¶жҜҚеҸҢж–№еҲҶеҲ«дә«еҸ—пјҢд№ҹеҸҜд»Ҙз”ұе…¶дёӯдёҖж–№дә«еҸ—пјӣиөЎе…»иҖҒдәәдё“йЎ№йҷ„еҠ жүЈйҷӨж ҮеҮҶз”ұжҜҸжңҲ2000е…ғжҸҗй«ҳеҲ°3000е…ғпјҢзӢ¬з”ҹеӯҗеҘіжҢүз…§жҜҸжңҲ3000е…ғзҡ„ж ҮеҮҶе®ҡйўқжүЈйҷӨпјҢйқһзӢ¬з”ҹеӯҗеҘідёҺе…„ејҹе§җеҰ№еҲҶж‘ҠжҜҸжңҲ3000е…ғзҡ„жүЈйҷӨйўқеәҰпјҢжҜҸдәәеҲҶж‘Ҡзҡ„йўқеәҰдёҚи¶…иҝҮжҜҸжңҲ1500е…ғгҖӮ"}, {"source": "国家税务局", "category": "留言咨询", "title": "从事涉税专业服务有哪些基本执业要求？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5212398/content.html", "date": "2023-09-19", "id": "2acd54db6a6ea713ffd861eee322f6d9", "content": "答：\n涉税专业服务机构及其涉税服务人员应当拥护中国共产党领导，坚持正确政治方向，诚实守信、正直自律、勤勉尽责，秉持专业精神和职业操守执行业务。从事涉税专业服务应当遵照法律、行政法规、部门规章及规范性文件，接受税务机关行政监管和相关行业协会自律监管。\n涉税专业服务机构应当按照规定向税务机关报送机构基本信息及其涉税服务人员的身份信息和执业资质信息，并以真实身份开展涉税专业服务。"}, {"source": "国家税务局", "category": "留言咨询", "title": "今年以来，纳税人已经填报享受“一老一小”扣除的，如何按照提高后的标准享受扣除？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5212117/content.html", "date": "2023-09-13", "id": "18f171485f816e11e27a5e5cbf202e6b", "content": "答：\n今年以来，纳税人已经按照原标准填报享受2023年度3岁以下婴幼儿照护、子女教育、赡养老人专项附加扣除的，自9月份起，信息系统将自动按照提高后的专项附加扣除标准计算应缴纳的个人所得税，此前多缴的税款可以自动抵减本年度后续月份应纳税款，抵减不完的，可以在办理2023年度综合所得汇算清缴时继续享受。"}, {"source": "国家税务局", "category": "留言咨询", "title": "个体工商户享受减半征收个人所得税政策是否需要办理备案？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5211719/content.html", "date": "2023-09-08", "id": "cdb2f2e0ec38896a2222abc9ca0fe1e9", "content": "答：\n个体工商户在预缴和汇算清缴个人所得税时均可享受减半征税政策，享受政策时无需进行备案，通过填写个人所得税纳税申报表和减免税事项报告表相关栏次，即可享受。"}, {"source": "国家税务局", "category": "留言咨询", "title": "个体工商户今年已就经营所得预缴税款的，还能享受优惠政策吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5211423/content.html", "date": "2023-09-01", "id": "e4b2aca50204c0887fb6cfa33d627ece", "content": "答：\n为最大程度释放减税红利，个体工商户今年前几个月已就经营所得预缴税款的，也能享受税收优惠。具体办法是，按12号公告应减征的税款，在《公告》发布前已缴纳的，可申请退税；也可自动抵减以后月份的税款，当年抵减不完的在汇算清缴时办理退税；12号公告发布之日前已办理注销的，不再追溯享受。"}, {"source": "国家税务局", "category": "留言咨询", "title": "“换电模式”新能源汽车如何确定车辆购置税计税价格？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5211176/content.html", "date": "2023-08-25", "id": "65cd6c15c6895bf6b58148c3832b66ae", "content": "答：\n为配合新能源汽车“换电模式”创新发展，从引导和规范的角度，允许符合相关技术标准和要求的“换电模式”新能源汽车，以不含动力电池的新能源汽车作为车辆购置税征税对象。为准确区分不含动力电池的新能源汽车车辆购置税计税价格，要求销售方销售时应分别核算不含动力电池的新能源汽车销售额并与动力电池分别开具发票。符合以上要求的，依据购车人购置不含动力电池的新能源汽车时取得的机动车销售统一发票载明的不含税价作为车辆购置税计税价格。"}, {"source": "国家税务局", "category": "留言咨询", "title": "个体工商户减半征收个人所得税政策的优惠力度提高了吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5210948/content.html", "date": "2023-08-17", "id": "eed9b89991291f8276cfbea4fbcd1e76", "content": "答：\n为进一步支持个体工商户发展，国家提高了政策优惠力度。自2023年1月1日至2027年12月31日，将个体工商户减半征收个人所得税的年应纳税所得额范围，由不超过100万元提高为不超过200万元。"}, {"source": "国家税务局", "category": "留言咨询", "title": "适用减半征收个人所得税政策的个体工商户范围是什么？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5210784/content.html", "date": "2023-08-09", "id": "00aeb8f22323d2d0bf83c0d37c3ea936", "content": "答：\n个体工商户不论是查账征收还是核定征收个人所得税，均可享受减半征税政策。"}, {"source": "国家税务局", "category": "留言咨询", "title": "个体工商户如何申报享受减半征收个人所得税政策？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5210544/content.html", "date": "2023-08-03", "id": "22936e5744bc427be92e93f34335cd5b", "content": "答：\n对于通过电子税务局申报的个体工商户，税务机关将自动为其提供申报表和报告表中该项政策的预填服务。实行简易申报的定期定额个体工商户，税务机关按照减免后的应纳税额自动进行税款划缴。"}, {"source": "国家税务局", "category": "留言咨询", "title": "小型微利企业所得税优惠政策的办理程序如何规定？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5210252/content.html", "date": "2023-07-26", "id": "ee7399a9559b25c3f69f6ec95c953db9", "content": "зӯ”пјҡ\nж №жҚ®гҖҠеӣҪе®¶зЁҺеҠЎжҖ»еұҖе…ідәҺиҗҪе®һе°ҸеһӢеҫ®еҲ©дјҒдёҡжүҖеҫ—зЁҺдјҳжғ ж”ҝзӯ–еҫҒз®Ўй—®йўҳзҡ„е…¬е‘ҠгҖӢпјҲеӣҪе®¶зЁҺеҠЎжҖ»еұҖе…¬е‘Ҡ2023е№ҙз¬¬6еҸ·пјүи§„е®ҡпјҢз¬ҰеҗҲжқЎд»¶зҡ„е°ҸеһӢеҫ®еҲ©дјҒдёҡйҖҡиҝҮеЎ«еҶҷзәізЁҺз”іжҠҘиЎЁпјҢеҚіеҸҜдҫҝжҚ·дә«еҸ—дјҳжғ ж”ҝзӯ–пјҢж— йңҖе…¶д»–жүӢз»ӯгҖӮ\nе°ҸеһӢеҫ®еҲ©дјҒдёҡеә”еҮҶзЎ®еЎ«жҠҘд»Һдёҡдәәж•°гҖҒиө„дә§жҖ»йўқгҖҒеӣҪе®¶йҷҗеҲ¶жҲ–зҰҒжӯўиЎҢдёҡзӯүеҹәзЎҖдҝЎжҒҜпјҢи®Ўз®—еә”зәізЁҺжүҖеҫ—йўқеҗҺпјҢдҝЎжҒҜзі»з»ҹе°ҶеҲ©з”Ёзӣёе…іж•°жҚ®пјҢдёәе°ҸеһӢеҫ®еҲ©дјҒдёҡжҷәиғҪйў„еЎ«дјҳжғ йЎ№зӣ®гҖҒиҮӘеҠЁи®Ўз®—еҮҸе…ҚзЁҺйўқгҖӮ"}, {"source": "国家税务局", "category": "留言咨询", "title": "企业如何享受小型微利企业所得税优惠政策？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5209999/content.html", "date": "2023-07-20", "id": "3be4afdce0b3f999c7043efffe6136dd", "content": "答：\n举例：\nA企业2022年成立，从事国家非限制和禁止行业，2023年度1季度和2季度相关指标为：从业人数季度平均值分别为170人、190人；资产总额季度平均值分别为2100万元、2500万元。2季度累计应纳税所得额200万元，其中1季度应纳税所得额90万元，已预缴企业所得税4.5万元。\n解析：\n小型微利企业预缴企业所得税时，资产总额、从业人数、年度应纳税所得额指标，暂按当年度截至本期预缴申报所属期末的情况进行判断。\nA企业预缴2023年2季度企业所得税时，“从业人数”截至本期末季度平均值为180人，“资产总额”截至本期末季度平均值为2300万元，累计应纳税所得额为200万元。\n企业预缴企业所得税时，符合小型微利企业的判断标准：从事国家非限制和禁止行业，且同时符合截至本期预缴申报所属期末资产总额季度平均值不超过5000万元、从业人数季度平均值不超过300人、应纳税所得额不超过300万元，A企业可以享受优惠政策。\n《财政部 税务总局关于小微企业和个体工商户所得税优惠政策的公告》（2023年第6号）规定，对小型微利企业年应纳税所得额不超过100万元的部分，减按25%计入应纳税所得额，按20%的税率缴纳企业所得税。因此，A企业2季度的应纳税额为：200×25%×20%-4.5=5.5（万元）。"}, {"source": "国家税务局", "category": "留言咨询", "title": "企业在7月预缴申报时享受研发费用加计扣除政策，应如何填报申报表？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5209722/content.html", "date": "2023-07-12", "id": "76d6e13763734f3d89432e6ffacaf2b9", "content": "зӯ”пјҡ\nзәізЁҺдәәеҰӮйҖүжӢ©зәёиҙЁз”іжҠҘиЎЁиҝӣиЎҢйў„зјҙз”іжҠҘпјҢеҸҜеңЁгҖҠдёӯеҚҺдәәж°‘е…ұе’ҢеӣҪдјҒдёҡжүҖеҫ—зЁҺжңҲпјҲеӯЈпјүеәҰйў„зјҙзәізЁҺз”іжҠҘиЎЁпјҲAзұ»пјүгҖӢпјҲA200000пјүз¬¬7иЎҢвҖңеҮҸпјҡе…ҚзЁҺж”¶е…ҘгҖҒеҮҸи®Ўж”¶е…ҘгҖҒеҠ и®ЎжүЈйҷӨвҖқдёӢзҡ„жҳҺз»ҶиЎҢж¬ЎеЎ«еҶҷзӣёе…ідјҳжғ дәӢйЎ№еҗҚз§°е’Ңдјҳжғ йҮ‘йўқгҖӮ\nзәізЁҺдәәеҰӮйҖҡиҝҮз”өеӯҗзЁҺеҠЎеұҖиҝӣиЎҢйў„зјҙз”іжҠҘпјҢеҸҜзӣҙжҺҘеңЁдёӢжӢүиҸңеҚ•дёӯйҖүжӢ©зӣёеә”зҡ„дјҳжғ дәӢйЎ№еҗҚз§°пјҢеҶҚеЎ«жҠҘдјҳжғ йҮ‘йўқгҖӮйңҖиҰҒжіЁж„Ҹзҡ„жҳҜпјҢз”ұдәҺдёӢжӢүиҸңеҚ•дёӯдјҳжғ дәӢйЎ№иҫғеӨҡпјҢиҜ·еңЁзЁҺеҠЎжҖ»еұҖе®ҳзҪ‘вҖңзәізЁҺжңҚеҠЎвҖқж Ҹзӣ®жҹҘйҳ…гҖҠдјҒдёҡжүҖеҫ—зЁҺз”іжҠҘдәӢйЎ№зӣ®еҪ•гҖӢпјҢеҜ№з…§йҖүжӢ©жӯЈзЎ®зҡ„дјҳжғ дәӢйЎ№пјҢд»ҘеҮҶзЎ®дә«еҸ—дјҳжғ ж”ҝзӯ–гҖӮ"}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第二十二号）", "url": "https://www.cicpa.org.cn/xxfb/tzgg/202307/t20230707_64330.html", "date": "2023-07-07", "id": "da44e8dac4c7211ee9f5b68900b09366", "content": "为进一步贯彻落实《国务院办公厅关于进一步规范财务审计秩序 促进注册会计师行业健康发展的意见》（国办发〔\n2021\n〕\n30\n号），根据《会计师事务所执业质量检查制度》（会协〔\n2011\n〕\n39\n号），\n2022\n年，中国注册会计师协会（以下简称中注协）与各省、自治区、直辖市注册会计师协会（以下简称省级注协）共计对\n1864\n家会计师事务所开展执业质量检查。截至目前，中注协和省级注协对存在违规问题的\n259\n家事务所和\n336\n名注册会计师实施了行业惩戒及自律监管措施。其中，对\n27\n家事务所和\n54\n名注册会计师公开谴责；对\n32\n家事务所和\n74\n名注册会计师通报批评；对\n37\n家事务所和\n135\n名注册会计师训诫，对其他\n163\n家事务所和\n73\n名注册会计师采取约谈等监管措施。\n现将检查发现的八个典型案例公告如下：\n一是北京正义会计师事务所有限责任公司主任会计师未参与该公司日常经营管理。该公司未按检查要求提供审计工作底稿，部分审计项目存在未实施风险评估程序、未确定重要性水平，未对银行存款、往来款项、借款、存货等科目执行必要的审计程序，未获取充分、适当的审计证据等问题。北京注册会计师协会对该公司及主任会计师杨火才、注册会计师张明作出公开谴责的行业惩戒。\n二是广州天维会计师事务所（普通合伙）现任合伙人均不是注册会计师，不符合执业许可存续条件，且存在冒用已去世注册会计师名义出具报告的行为。该所的部分审计项目存在未对收入、银行存款、往来款项、固定资产等科目执行必要的审计程序，未获取充分、适当的审计证据等问题。广东省注册会计师协会对该所作出公开谴责的行业惩戒。\n三是广州市忠雄会计师事务所（普通合伙）未建立合伙人晋升、委派、考评、薪酬和违规行为处理等机制，且存在支付业务回扣等问题。该所的部分审计项目未确定重要性水平，未对收入、银行存款、往来款项、长期股权投资等科目执行必要的审计程序，未获取充分、适当的审计证据。广东省注册会计师协会对该所作出公开谴责的行业惩戒。\n四是台州中鼎会计师事务所（普通合伙）的部分审计项目存在未实际执行审计程序，未编制审计工作底稿等问题。浙江省注册会计师协会对该所及注册会计师董汉兰、段兰珍、单爱武、赵遗珍作出公开谴责的行业惩戒。\n五是杭州德益会计师事务所（普通合伙）的部分审计项目未对银行存款、应收账款、短期借款等科目执行\n函证程序，也未说明不予函证的理由。同时，存在未对存货获取有关清单，未实施监盘程序，也未实施替代程序等问题。上述科目均对有关财务报表有重大影响，但该所未能执行必要的审计程序，\n未能获取充分、适当的审计证据。浙江省注册会计师协会对该所及注册会计师张丛玲、周娟作出公开谴责的行业惩戒。\n六是武汉天意会计师事务有限责任公司主任会计师无法正常履职，未委托其他股东代为履职，该公司也未将上述情况向监管部门报备。该公司审计报告编号不连续，还存在部分签字注册会计师未实际参与项目，复核流于形式等问题。抽查的部分项目未确定重要性水平，未对银行存款、借款、存货、固定资产、收入等科目执行必要的审计程序，未获取充分、适当的审计证据。个别项目的研发费用审定金额与财务报表实际披露金额差异巨大，该公司未予以关注。湖北省注册会计师协会对该公司及主任会计师高剑作出公开谴责的行业惩戒。\n七是重庆华税会计师事务所（普通合伙）部分审计项目的项目承接、实质性程序、完成阶段等全部审计程序仅由一名助理人员完成，且此人在该所无工资发放及社保缴纳记录，无法证明是该所员工。该所部分审计项目还存在未对收入、银行存款、存货、往来款项、长期股权投资、固定资产等科目执行必要的审计程序，未获取充分、适当的审计证据等问题。重庆市注册会计师协会对该所作出公开谴责的行业惩戒。\n八是云南知行宜宸会计师事务所（普通合伙）对部分首次承接的审计业务，未与前任注册会计师进行沟通，未执行期初余额审计；部分审计项目未对发放贷款、长期股权投资、往来款项、收入等科目执行必要的审计程序，未获取充分、适当的审计证据。云南省注册会计师协会对该所作出公开谴责的行业惩戒。\n2023\n年，中注协将在财政部党组的领导下，按照党中央、国务院决策部署，深入贯彻《中共中央办公厅 国务院办公厅关于进一步加强财会监督工作的意见》，切实加强行业自律监督，加大行业惩戒力度，推动会计师事务所更好发挥执业监督作用，促进行业高质量发展，更好服务国家建设。"}, {"source": "国家税务局", "category": "留言咨询", "title": "企业设立不具有法人资格的分支机构，如何适用小型微利企业所得税优惠政策？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5208158/content.html", "date": "2023-07-05", "id": "52d34dd033d951fec2ee00c53019c35a", "content": "зӯ”пјҡ\nзҺ°иЎҢдјҒдёҡжүҖеҫ—зЁҺе®һиЎҢжі•дәәзЁҺеҲ¶пјҢдјҒдёҡеә”д»Ҙжі•дәәдёәдё»дҪ“пјҢи®Ўз®—е№¶зјҙзәідјҒдёҡжүҖеҫ—зЁҺгҖӮгҖҠдёӯеҚҺдәәж°‘е…ұе’ҢеӣҪдјҒдёҡжүҖеҫ—зЁҺжі•гҖӢз¬¬дә”еҚҒжқЎз¬¬дәҢж¬ҫи§„е®ҡпјҢеұ…ж°‘дјҒдёҡеңЁдёӯеӣҪеўғеҶ…и®ҫз«ӢдёҚе…·жңүжі•дәәиө„ж јзҡ„иҗҘдёҡжңәжһ„зҡ„пјҢеә”еҪ“жұҮжҖ»и®Ўз®—е№¶зјҙзәідјҒдёҡжүҖеҫ—зЁҺгҖӮеӣ жӯӨпјҢдјҒдёҡи®ҫз«ӢдёҚе…·жңүжі•дәәиө„ж јеҲҶж”Ҝжңәжһ„зҡ„пјҢеә”еҪ“е…ҲжұҮжҖ»и®Ўз®—жҖ»жңәжһ„еҸҠе…¶еҗ„еҲҶж”Ҝжңәжһ„зҡ„д»Һдёҡдәәж•°гҖҒиө„дә§жҖ»йўқгҖҒе№ҙеәҰеә”зәізЁҺжүҖеҫ—йўқпјҢеҶҚдҫқжҚ®еҗ„жҢҮж Үзҡ„еҗҲи®Ўж•°еҲӨж–ӯжҳҜеҗҰз¬ҰеҗҲе°ҸеһӢеҫ®еҲ©дјҒдёҡжқЎд»¶гҖӮ"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是一家小型企业，在7月份预缴申报时不打算享受研发费用加计扣除政策，以后还可以享受吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5206717/content.html", "date": "2023-06-26", "id": "794747042156f9cdfecdfef1dc7df5fa", "content": "答：\n对7月份预缴申报期未选择享受研发费用加计扣除政策的企业，在10月份预缴申报或年度汇算清缴时能够准确归集核算研发费用的，可结合自身生产经营实际情况，自主选择在10月份预缴申报或年度汇算清缴时统一享受。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我是一家餐饮公司，为按月申报的增值税小规模纳税人，由于对新出台政策不熟悉，2023年5月25日为客户开具了2万元的3%征收率增值税普通发票。5月实际月销售额为15万元，均为3%征收率的销售收入，我公司客户为个人，无法收回已开具发票，请问我公司还能够享受3%征收率销售收入减按1%征收率征收增值税政策吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5205445/content.html", "date": "2023-06-14", "id": "b3851d15efc63d3ce5559eecea2c3334", "content": "答：\n《财政部 税务总局关于明确增值税小规模纳税人减免增值税等政策的公告》（2023年第1号）规定，自2023年1月1日至2023年12月31日，增值税小规模纳税人适用3%征收率的应税销售收入，减按1%征收率征收增值税。\n您3%征收率的销售收入15万元，可以在申报纳税时直接进行减税申报，享受3%征收率销售收入减按1%征收率征收增值税政策。为减轻您的办税负担，无需对已开具的3%征收率的增值税普通发票进行作废或换开。但需要注意的是，按照《中华人民共和国发票管理办法》等相关规定，纳税人应如实开具发票。《国家税务总局关于增值税小规模纳税人减免增值税等政策有关征管事项的公告》（2023年第1号）第五条规定，小规模纳税人取得应税销售收入，适用减按1%征收率征收增值税政策的，应按照1%征收率开具增值税发票。因此，今后您享受3%征收率销售收入减按1%征收率征收增值税政策时，如需开具增值税普通发票，应按照1%征收率开具。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是零售摩托车的增值税小规模纳税人，每月销售额在10万元左右，2023年5月为客户开具发票时无法确认本月是否能够享受月销售额10万元以下免税政策，请问我要享受今年新出台的小规模纳税人优惠政策，应如何开具机动车销售统一发票？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5205260/content.html", "date": "2023-06-09", "id": "c80880bbc007ceffe4987e044d5f8224", "content": "答：\n《财政部 税务总局关于明确增值税小规模纳税人减免增值税等政策的公告》（2023年第1号）规定，自2023年1月1日至2023年12月31日，对月销售额10万元以下（含本数）的增值税小规模纳税人，免征增值税。增值税小规模纳税人适用3%征收率的应税销售收入，减按1%征收率征收增值税。\n您在月中开票时并不知晓销售额是否会超过10万元、能否享受免税政策，应先按照1%征收率开具机动车销售统一发票。申报纳税时，如月销售额未超过10万元，可以在申报纳税时进行免税申报，如月销售额超过10万元，可以在申报纳税时减按1%征收率申报缴纳增值税。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我是按月申报的增值税小规模纳税人，2023年5月为客户开具发票时按照习惯开具了3%征收率的增值税普通发票，如实际月销售额未超过10万元，请问我能够享受免税优惠政策吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5205092/content.html", "date": "2023-06-01", "id": "422f677fc9ff99970b61d4d0c9e4e24a", "content": "答：\n《财政部 税务总局关于明确增值税小规模纳税人减免增值税等政策的公告》（2023年第1号）规定，自2023年1月1日至2023年12月31日，对月销售额10万元以下（含本数）的增值税小规模纳税人，免征增值税。\n您的月销售额如未超过10万元，可以在申报纳税时直接进行免税申报，享受免征增值税政策。"}, {"source": "国家税务局", "category": "留言咨询", "title": "城镇土地使用税优惠政策如何规定仓储用地？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5196729/content.html", "date": "2023-05-25", "id": "cf89f560d88569504d780235fe79e53a", "content": "зӯ”пјҡ\nж №жҚ®гҖҠиҙўж”ҝйғЁ зЁҺеҠЎжҖ»еұҖе…ідәҺз»§з»ӯе®һж–Ҫзү©жөҒдјҒдёҡеӨ§е®—е•Ҷе“Ғд»“еӮЁи®ҫж–Ҫз”Ёең°еҹҺй•Үеңҹең°дҪҝз”ЁзЁҺдјҳжғ ж”ҝзӯ–зҡ„е…¬е‘ҠгҖӢпјҲиҙўж”ҝйғЁ зЁҺеҠЎжҖ»еұҖе…¬е‘Ҡ2023е№ҙз¬¬5еҸ·пјүпјҢвҖңеҗҢдёҖвҖқд»“еӮЁи®ҫж–ҪеҚ ең°йқўз§ҜеңЁ6000е№іж–№зұіеҸҠд»ҘдёҠзҡ„пјҢжүҚиғҪдә«еҸ—дјҳжғ гҖӮ\nиҝҷжҲ·дјҒдёҡзҡ„д»“еӮЁи®ҫж–ҪеҲҶж•ЈеңЁдёӨең°пјҢеә”еҪ“еҲҶејҖеҲӨж–ӯжҳҜеҗҰз¬ҰеҗҲдјҳжғ жқЎд»¶гҖӮдҪҚдәҺеҹҺеҢ—зҡ„д»“еӮЁи®ҫж–ҪеҚ ең°3000е№іж–№зұіпјҢжңӘиҫҫеҲ°5еҸ·е…¬е‘Ҡи§„е®ҡзҡ„йқўз§Ҝж ҮеҮҶпјҢж— жі•йҖӮз”ЁиҜҘж”ҝзӯ–пјӣдҪҚдәҺеҹҺеҚ—зҡ„д»“еӮЁи®ҫж–ҪеҚ ең°7000е№іж–№зұіпјҢз¬ҰеҗҲ5еҸ·е…¬е‘Ҡи§„е®ҡпјҢеҸҜд»Ҙдә«еҸ—еҮҸжҢүжүҖеұһеңҹең°зӯүзә§йҖӮз”ЁзЁҺйўқж ҮеҮҶзҡ„50%и®ЎеҫҒеҹҺй•Үеңҹең°дҪҝз”ЁзЁҺзҡ„зЁҺж”¶дјҳжғ гҖӮ"}, {"source": "国家税务局", "category": "留言咨询", "title": "取得多处经营所得的个体工商户如何享受优惠政策？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5196398/content.html", "date": "2023-05-18", "id": "9f444562ed3f5f45900668f62ca505fb", "content": "зӯ”пјҡ\nжҢүз…§зҺ°иЎҢж”ҝзӯ–и§„е®ҡпјҢзәізЁҺдәәд»ҺдёӨеӨ„д»ҘдёҠеҸ–еҫ—з»ҸиҗҘжүҖеҫ—зҡ„пјҢеә”еҪ“йҖүжӢ©еҗ‘е…¶дёӯдёҖеӨ„з»ҸиҗҘз®ЎзҗҶжүҖеңЁең°дё»з®ЎзЁҺеҠЎжңәе…іеҠһзҗҶе№ҙеәҰжұҮжҖ»з”іжҠҘгҖӮиӢҘдёӘдҪ“е·Ҙе•ҶжҲ·д»ҺдёӨеӨ„д»ҘдёҠеҸ–еҫ—з»ҸиҗҘжүҖеҫ—пјҢйңҖеңЁеҠһзҗҶе№ҙеәҰжұҮжҖ»зәізЁҺз”іжҠҘж—¶пјҢеҗҲе№¶дёӘдҪ“е·Ҙе•ҶжҲ·з»ҸиҗҘжүҖеҫ—е№ҙеә”зәізЁҺжүҖеҫ—йўқпјҢйҮҚж–°и®Ўз®—еҮҸе…ҚзЁҺйўқпјҢеӨҡйҖҖе°‘иЎҘгҖӮдёҫдҫӢеҰӮдёӢпјҡ\nгҖҗдҫӢгҖ‘зәізЁҺдәәеј жҹҗеҗҢж—¶з»ҸиҗҘдёӘдҪ“е·Ҙе•ҶжҲ·Aе’ҢдёӘдҪ“е·Ҙе•ҶжҲ·BпјҢе№ҙеә”зәізЁҺжүҖеҫ—йўқеҲҶеҲ«дёә80дёҮе…ғе’Ң50дёҮе…ғпјҢйӮЈд№Ҳеј жҹҗеңЁе№ҙеәҰжұҮжҖ»зәізЁҺз”іжҠҘж—¶пјҢеҸҜд»Ҙдә«еҸ—еҮҸеҚҠеҫҒж”¶дёӘдәәжүҖеҫ—зЁҺж”ҝзӯ–зҡ„еә”зәізЁҺжүҖеҫ—йўқдёә100дёҮе…ғгҖӮ"}, {"source": "国家税务局", "category": "留言咨询", "title": "个体工商户减半征税的个人所得税优惠政策及适用范围是什么？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5196046/content.html", "date": "2023-05-12", "id": "e78ec809a3d0a6ac7111b8257242a83b", "content": "答：\n对个体工商户经营所得年应纳税所得额不超过100万元的部分，在现行优惠政策基础上，再减半征收个人所得税。个体工商户不区分征收方式，均可享受。"}, {"source": "国家税务局", "category": "留言咨询", "title": "个体工商户变更经营者是先到税务部门办理变更还是先到市场监管部门办理变更？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5195446/content.html", "date": "2023-05-06", "id": "09cc0d59ba00c181c31b34796336b74a", "content": "ç­”ï¼ڑ\nو ¹وچ®م€ٹن؟ƒè؟›ن¸ھن½“ه·¥ه•†وˆ·هڈ‘ه±•و‌،ن¾‹ï¼ˆن¸­هچژن؛؛و°‘ه…±ه’Œه›½ه›½هٹ،é™¢ن»¤ç¬¬755هڈ·ï¼‰\nم€‹\nم€پم€ٹه¸‚هœ؛ç›‘ç®،و€»ه±€هٹ‍ه…¬هژ…ه…³ن؛ژهپڑه¥½ن¸ھن½“ه·¥ه•†وˆ·ç»ڈèگ¥è€…هڈکو›´ç™»è®°ه·¥ن½œçڑ„é€ڑçں¥ï¼ˆه¸‚ç›‘و³¨هڈ‘م€”2022م€•102هڈ·ï¼‰م€‹è§„ه®ڑï¼Œç»ڈèگ¥è€…ه؛”ه½“ن¾‌و³•هٹ‍ç»“ن¸ھن½“ه·¥ه•†وˆ·و¶‰ç¨ژن؛‹é،¹هگژï¼Œه†چç”³è¯·ن¸ھن½“ه·¥ه•†وˆ·ç»ڈèگ¥è€…هڈکو›´ç™»è®°م€‚ه¸‚هœ؛ç›‘ç®،éƒ¨é—¨وژ¥هڈ—ç”³è¯·ن؛؛وڈگن؛¤çڑ„ç؛¸è´¨م€ٹو¸…ç¨ژè¯پوکژم€‹ï¼Œه…·ه¤‡و•°وچ®ه…±ن؛«و‌،ن»¶çڑ„ï¼Œé€ڑè؟‡و•°وچ®ه…±ن؛«çڑ„و–¹ه¼ڈèژ·هڈ–ه…¶ç¨ژهٹ،ن؛‹é،¹ç»“و¸…وƒ…ه†µçڑ„ن؟،وپ¯م€‚ç»ڈèگ¥è€…هڈکو›´هگژï¼Œهڈٹو—¶ه°†ç›¸ه…³ç™»è®°و³¨ه†Œن؟،وپ¯وژ¨é€پè‡³ç¨ژهٹ،éƒ¨é—¨م€‚"}, {"source": "国家税务局", "category": "留言咨询", "title": "研发费用加计扣除政策中的研发费用包括哪些？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5195199/content.html", "date": "2023-04-28", "id": "e0f769891b4c0ba01178b8a8df152064", "content": "зӯ”пјҡ\nе…·дҪ“еҢ…жӢ¬дәәе‘ҳдәәе·Ҙиҙ№з”ЁпјҢзӣҙжҺҘжҠ•е…Ҙиҙ№з”ЁпјҢжҠҳж—§иҙ№з”ЁпјҢж— еҪўиө„дә§ж‘Ҡй”ҖпјҢж–°дә§е“
