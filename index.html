据予以证实。\n你作为相关审计报告的签字注册会计师，对上述问题负有责任。鉴于你有减轻行政处罚的情节，依据《会计师事务所执业许可和监督管理办法》第七十条、《中华人民共和国行政处罚法》第三十二条第（二）项的规定，我部决定给予你暂停执行业务六个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年1月23日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕7号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971698.htm", "date": "2025-01-23", "id": "885b501609bcad21f1cc7bdf0d1f0e11", "content": "财政部行政处罚决定书（财监法〔2025〕7号）\n财监法〔2025〕7号\n财政部行政处罚决定书\n当 事 人：张璐\n地      址：辽宁省大连市\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2023年对深圳市巨源立德会计师事务所（普通合伙）（以下简称巨源立德）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、编造事由出具虚假审计报告\n（一）在深圳艾为电气技术有限公司（以下称艾为电气）2022年财务报表审计中，未实施必要的审计程序，编造事由出具虚假审计报告。\n艾为电气2022年虚减货币资金13,759,584.55元，虚减比例为89%；虚减应收账款20,247,022.50元，虚减比例为25%；虚减存货36,267,656.24元，虚减比例为55%；虚减应付账款47,497,628.89元，虚减比例为66%；虚减其他应付款7,609,931.86元，虚减比例为83%；虚减应付股利38,000,000.00元，虚减比例为100%；虚增未分配利润33,363,153.15元，虚增比例为111%；虚减盈余公积6,041,037.71元，虚减比例为100%；虚增2022年度研发费用5,861,290.48元，虚增比例为33%。巨源立德在艾为电气2022年财务报表审计中，未实施必要的审计程序，编制的审计工作底稿中部分数据与已获取的审计证据存在明显矛盾或重大不一致，编造事由出具虚假审计报告。\n（二）在深圳小草信息科技有限公司（以下称小草信息）2021年财务报表审计中，未实施必要的审计程序，编造事由出具虚假审计报告。\n小草信息2021年虚增营业收入14,007,280.00元，虚增比例为206%；虚增营业成本9,995,194.80元，虚增比例为192%；虚增净利润2,811,461.20元，虚增比例为365%。巨源立德在小草信息2021年财务报表审计中，未实施必要的审计程序，编制的审计工作底稿中部分数据与已获取的审计证据存在明显矛盾或重大不一致，编造事由出具虚假审计报告。\n（三）在深圳可瑞高新材料股份有限公司（以下称可瑞高新）2022年财务报表审计中，未实施必要的审计程序，编造事由出具虚假审计报告。\n可瑞高新2022年虚减期末应收票据9,163,858.51元，虚减比例为100%；虚增应收账款6,289,970.34元，虚增比例为94%；虚减预付账款11,633,331.15元，虚减比例为97%；虚减存货10,580,000.00元，虚减比例为58%；虚减应付账款7,603,331.15元，虚减比例为52%；虚减其他应付款9,895,829.74元，虚减比例为94%；虚减长期借款6,429,928.81元，虚减比例为43%；虚增2022年度营业收入17,000,000.00元，虚增比例为37%；虚增销售费用4,667,686.17元，虚增比例为513%；虚增管理费用5,658,451.11元，虚增比例为112%；虚增利润总额3,828,789.84元，虚增比例为279%；虚增净利润3,834,078.70元，虚增比例为280%。巨源立德在可瑞高新2022年财务报表审计中，未实施必要的审计程序，无依据调整所有者权益变动表期初未分配利润数据，编造事由出具虚假审计报告。\n（四）在深圳市三浦半导体有限公司（以下称三浦半导体）2022年财务报表审计中，未实施必要的审计程序，编造事由出具虚假审计报告。\n三浦半导体2022年虚增期末应收账款6,689,868.30元，虚增比例为74%；虚增预付账款1,601,110.58元，虚增比例为81%；虚减存货12,000,000.00元，虚减比例为43%；虚减应付账款2,987,472.86元，虚减比例为36%；虚减预收账款1,409,529.01元，虚减比例为62%；虚减其他应付款3,157,157.96元，虚减比例为86%；虚增未分配利润4,561,296.99元，虚增比例为37%；虚增2022年度营业收入20,000,000.00元，虚增比例为159%；虚增营业成本15,380,000.00元，虚增比例为151%；虚增净利润4,561,296.99元，虚增比例为172%。巨源立德在三浦半导体2022年财务报表审计中，未实施必要的审计程序，编制的审计工作底稿中部分数据与已获取的审计证据存在明显矛盾或重大不一致，编造事由出具虚假审计报告。\n（五）在深圳超盈智能科技有限公司（以下称超盈智能）2022年财务报表审计中，未实施必要的审计程序，编造事由出具虚假审计报告。\n超盈智能2022年虚减期末存货34,490,000.00元，虚减比例为36%；虚减其他流动资产4,980,677.45元，虚减比例为56%；虚减应付账款51,399,375.00元，虚减比例为99%；虚减预收账款9,778,718.84元，虚减比例为90%；虚减其他应付款12,499,720.00元，虚减比例为99%；虚增未分配利润24,870,000.00元，虚增比例为375%；虚增2022年度净利润24,870,000.00元，虚增比例为655%。巨源立德在超盈智能2022年财务报表审计中，未实施必要的审计程序，编制的审计工作底稿中部分数据与已获取的审计证据存在明显矛盾或重大不一致，编造事由出具虚假审计报告。\n（六）在深圳市世椿智能装备股份有限公司（以下称世椿智能）2022年财务报表审计中，未实施必要的审计程序，编造事由出具虚假审计报告。\n世椿智能2022年虚增期末存货15,681,182.02元，虚增比例为17%；虚减其他应付款10,800,000.00元，虚减比例为42%；虚增未分配利润19,213,792.03元，虚增比例为85%；虚增2022年度投资收益10,800,000.00元，虚增比例为100%；虚增营业利润17,096,180.02元，虚增比例为158%；虚增净利润16,284,224.34元，虚增比例为147%。巨源立德在世椿智能2022年财务报表审计中，未实施必要的审计程序，编制的审计工作底稿中部分数据与已获取的审计证据存在明显矛盾或重大不一致，编造事由出具虚假审计报告。\n二、未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告\n深圳市微克科技有限公司（以下称微克科技）2021年虚减期末货币资金22,500,000.00元，虚减比例为65%；虚减应收账款13,149,538.00元，虚减比例为62%；虚减存货4,616,503.94元，虚减比例为17%；虚减使用权资产3,520,960.64元，虚减比例为100%；虚减应付票据10,000,000.00元，虚减比例为93%；虚减应付账款16,930,280.97元，虚减比例为44%；虚减合同负债2,188,419.96元，虚减比例为100%；虚减租赁负债2,045,725.98元，虚减比例为100%；虚减资本公积10,602,940.00元,虚减比例为42%；虚减2021年度营业收入48,311,497.28元，虚减比例为22%；虚减营业成本37,035,984.84元，虚减比例为20%；虚减管理费用10,375,242.43元，虚减比例为44%。巨源立德在微克科技2021年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n三、未实施必要的审计程序，未获取充分适当的审计证据，发表不恰当审计意见\n（一）在深圳市希格玛计算机技术有限公司（以下称希格玛）2022年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，发表不恰当审计意见。\n希格玛对持有的华林证券股份有限公司股权投资的账面价值以投资成本金额计量，未按公允价值进行调整，导致少计2022年末总资产2,519,852,445.30元，少计金额超过财务报表总资产金额（310,770,538.15元）的8倍。巨源立德在希格玛2022年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，未发现上述重大会计差错，发表了不恰当的审计意见。\n（二）在深圳市星际大陆科技有限公司（以下称星际大陆）2022年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，发表不恰当审计意见。\n星际大陆2022年未确认用存货偿还59,960,800.00元欠款的债务重组收益，导致少计？债务重组收益32,534,575.55元。巨源立德在星际大陆2022年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，未发现上述重大会计差错，发表了不恰当的审计意见。\n上述行为违反《中华人民共和国注册会计师法》第二十一条，《会计师事务所执业许可和监督管理办法》第六十条第（一）、（三）、（四）项，《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条、第九条，《中国注册会计师职业道德守则第3号——提供专业服务的具体要求》第二条，《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十条、第二十六条、第二十七条、第二十八条、第二十九条、第三十条，《中国注册会计师审计准则第1301号——审计证据》第十条，《中国注册会计师审计准则第1312号——函证》第十二条、第十三条，《中国注册会计师审计准则第1311号——对存货、诉讼和索赔、分部信息等特定项目获取审计证据的具体考虑》第四条等规定。\n上述事实，有财政检查报告、当事人签证和反馈意见、听证笔录等相关证据予以证实。\n你作为巨源立德主任会计师、相关审计报告的签字注册会计师，对上述问题负有责任。根据违法行为的事实、性质、情节，依据《中华人民共和国注册会计师法》第三十九条\n的规定\n，我部决定给予你吊销注册会计师证书的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年1月23日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕6号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971697.htm", "date": "2025-01-23", "id": "fbfd28fd3b3b93ff9f9ae6e034b850d7", "content": "财政部行政处罚决定书（财监法〔2025〕6号）\n财监法〔2025〕6号\n财政部行政处罚决定书\n当 事 人：深圳市巨源立德会计师事务所（普通合伙）\n地      址：深圳市龙岗区坂田街道贝尔路高新技术工业园北座厂房401\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2023年对你所执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、编造事由出具虚假审计报告\n（一）在深圳艾为电气技术有限公司（以下称艾为电气）2022年财务报表审计中，未实施必要的审计程序，编造事由出具虚假审计报告。\n艾为电气2022年虚减货币资金13,759,584.55元，虚减比例为89%；虚减应收账款20,247,022.50元，虚减比例为25%；虚减存货36,267,656.24元，虚减比例为55%；虚减应付账款47,497,628.89元，虚减比例为66%；虚减其他应付款7,609,931.86元，虚减比例为83%；虚减应付股利38,000,000.00元，虚减比例为100%；虚增未分配利润33,363,153.15元，虚增比例为111%；虚减盈余公积6,041,037.71元，虚减比例为100%；虚增2022年度研发费用5,861,290.48元，虚增比例为33%。你所在艾为电气2022年财务报表审计中，未实施必要的审计程序，编制的审计工作底稿中部分数据与已获取的审计证据存在明显矛盾或重大不一致，编造事由出具虚假审计报告。\n（二）在深圳小草信息科技有限公司（以下称小草信息）2021年财务报表审计中，未实施必要的审计程序，编造事由出具虚假审计报告。\n小草信息2021年虚增营业收入14,007,280.00元，虚增比例为206%；虚增营业成本9,995,194.80元，虚增比例为192%；虚增净利润2,811,461.20元，虚增比例为365%。你所在小草信息2021年财务报表审计中，未实施必要的审计程序，编制的审计工作底稿中部分数据与已获取的审计证据存在明显矛盾或重大不一致，编造事由出具虚假审计报告。\n（三）在深圳可瑞高新材料股份有限公司（以下称可瑞高新）2022年财务报表审计中，未实施必要的审计程序，编造事由出具虚假审计报告。\n可瑞高新2022年虚减期末应收票据9,163,858.51元，虚减比例为100%；虚增应收账款6,289,970.34元，虚增比例为94%；虚减预付账款11,633,331.15元，虚减比例为97%；虚减存货10,580,000.00元，虚减比例为58%；虚减应付账款7,603,331.15元，虚减比例为52%；虚减其他应付款9,895,829.74元，虚减比例为94%；虚减长期借款6,429,928.81元，虚减比例为43%；虚增2022年度营业收入17,000,000.00元，虚增比例为37%；虚增销售费用4,667,686.17元，虚增比例为513%；虚增管理费用5,658,451.11元，虚增比例为112%；虚增利润总额3,828,789.84元，虚增比例为279%；虚增净利润3,834,078.70元，虚增比例为280%。你所在可瑞高新2022年财务报表审计中，未实施必要的审计程序，无依据调整所有者权益变动表期初未分配利润数据，编造事由出具虚假审计报告。\n（四）在深圳市三浦半导体有限公司（以下称三浦半导体）2022年财务报表审计中，未实施必要的审计程序，编造事由出具虚假审计报告。\n三浦半导体2022年虚增期末应收账款6,689,868.30元，虚增比例为74%；虚增预付账款1,601,110.58元，虚增比例为81%；虚减存货12,000,000.00元，虚减比例为43%；虚减应付账款2,987,472.86元，虚减比例为36%；虚减预收账款1,409,529.01元，虚减比例为62%；虚减其他应付款3,157,157.96元，虚减比例为86%；虚增未分配利润4,561,296.99元，虚增比例为37%；虚增2022年度营业收入20,000,000.00元，虚增比例为159%；虚增营业成本15,380,000.00元，虚增比例为151%；虚增净利润4,561,296.99元，虚增比例为172%。你所在三浦半导体2022年财务报表审计中，未实施必要的审计程序，编制的审计工作底稿中部分数据与已获取的审计证据存在明显矛盾或重大不一致，编造事由出具虚假审计报告。\n（五）在深圳超盈智能科技有限公司（以下称超盈智能）2022年财务报表审计中，未实施必要的审计程序，编造事由出具虚假审计报告。\n超盈智能2022年虚减期末存货34,490,000.00元，虚减比例为36%；虚减其他流动资产4,980,677.45元，虚减比例为56%；虚减应付账款51,399,375.00元，虚减比例为99%；虚减预收账款9,778,718.84元，虚减比例为90%；虚减其他应付款12,499,720.00元，虚减比例为99%；虚增未分配利润24,870,000.00元，虚增比例为375%；虚增2022年度净利润24,870,000.00元，虚增比例为655%。你所在超盈智能2022年财务报表审计中，未实施必要的审计程序，编制的审计工作底稿中部分数据与已获取的审计证据存在明显矛盾或重大不一致，编造事由出具虚假审计报告。\n（六）在深圳市世椿智能装备股份有限公司（以下称世椿智能）2022年财务报表审计中，未实施必要的审计程序，编造事由出具虚假审计报告。\n世椿智能2022年虚增期末存货15,681,182.02元，虚增比例为17%；虚减其他应付款10,800,000.00元，虚减比例为42%；虚增未分配利润19,213,792.03元，虚增比例为85%；虚增2022年度投资收益10,800,000.00元，虚增比例为100%；虚增营业利润17,096,180.02元，虚增比例为158%；虚增净利润16,284,224.34元，虚增比例为147%。你所在世椿智能2022年财务报表审计中，未实施必要的审计程序，编制的审计工作底稿中部分数据与已获取的审计证据存在明显矛盾或重大不一致，编造事由出具虚假审计报告。\n二、未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告\n深圳市微克科技有限公司（以下称微克科技）2021年虚减期末货币资金22,500,000.00元，虚减比例为65%；虚减应收账款13,149,538.00元，虚减比例为62%；虚减存货4,616,503.94元，虚减比例为17%；虚减使用权资产3,520,960.64元，虚减比例为100%；虚减应付票据10,000,000.00元，虚减比例为93%；虚减应付账款16,930,280.97元，虚减比例为44%；虚减合同负债2,188,419.96元，虚减比例为100%；虚减租赁负债2,045,725.98元，虚减比例为100%；虚减资本公积10,602,940.00元,虚减比例为42%；虚减2021年度营业收入48,311,497.28元，虚减比例为22%；虚减营业成本37,035,984.84元，虚减比例为20%；虚减管理费用10,375,242.43元，虚减比例为44%。你所在微克科技2021年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n三、未实施必要的审计程序，未获取充分适当的审计证据，发表不恰当审计意见\n（一）在深圳市希格玛计算机技术有限公司（以下称希格玛）2022年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，发表不恰当审计意见。\n希格玛对持有的华林证券股份有限公司股权投资的账面价值以投资成本金额计量，未按公允价值进行调整，导致少计2022年末总资产2,519,852,445.30元，少计金额超过财务报表总资产金额（310,770,538.15元）的8倍。巨源立德在希格玛2022年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，未发现上述重大会计差错，发表了不恰当的审计意见。\n（二）在深圳市星际大陆科技有限公司（以下称星际大陆）2022年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，发表不恰当审计意见。\n星际大陆2022年未确认用存货偿还59,960,800.00元欠款的债务重组收益，导致少计？债务重组收益32,534,575.55元。你所在星际大陆2022年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，未发现上述重大会计差错，发表了不恰当的审计意见。\n上述行为违反《中华人民共和国注册会计师法》第二十一条、第三十一条，《会计师事务所执业许可和监督管理办法》第六十条（一）、（三）、（四），《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条、第九条，《中国注册会计师职业道德守则第3号——提供专业服务的具体要求》第二条，《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十条、第二十六条、第二十七条、第二十八条、第二十九条、第三十条，《中国注册会计师审计准则第1301号——审计证据》第十条，《中国注册会计师审计准则第1312号——函证》第十二条、第十三条，《中国注册会计师审计准则第1311号——对存货、诉讼和索赔、分部信息等特定项目获取审计证据的具体考虑》第四条等规定。\n上述事实，有财政检查报告、相关当事人签证和反馈意见、听证笔录等相关证据予以证实。\n根据违法行为的事实、性质、情节，依据《中华人民共和国注册会计师法》第三十九条\n的规定\n，我部决定给予你所警告、没收违法所得47900元并处罚款239500元、吊销执业许可的行政处罚。\n当事人应在收到本处罚决定书之日起十五日内与财政部深圳监管局联系，凭财政部深圳监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年1月23日"}, {"source": "国家税务局", "category": "留言咨询", "title": "深化增值税改革，对增值税一般纳税人购进农产品，原适用10%扣除率的是否有调整？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5237967/content.html", "date": "2025-01-20", "id": "60ad1aa0de34193654eca4949bfd2b90", "content": "答：\n有调整。深化增值税改革有关政策公告规定，对增值税一般纳税人购进农产品，原适用10%扣除率的，扣除率调整为9%。"}, {"source": "国家税务局", "category": "留言咨询", "title": "E公司2019年3月份购入一间厂房，当月取得增值税专用发票并在增值税发票选择确认平台勾选确认，办理3月税款所属期申报时，该厂房的进项税额可以一次性抵扣吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5237797/content.html", "date": "2025-01-10", "id": "c6b41bca486cdf1e68a6bcccbc028e86", "content": "答：\n不可以。《财政部 税务总局 海关总署关于深化增值税改革有关政策的公告》（财政部 税务总局 海关总署公告2019年第39号）第五条规定，自2019年4月1日起，纳税人取得不动产或者不动产在建工程的进项税额不再分2年抵扣。此前按照规定尚未抵扣完毕的待抵扣进项税额，可自2019年4月税款所属期起从销项税额中抵扣。E公司3月份购入的不动产，属于2019年4月1日前购入，应在3月税款所属期抵扣60%进项税额，余下的40%进项税额自4月税款所属期起抵扣完毕。"}, {"source": "国家税务局", "category": "留言咨询", "title": "增值税一般纳税人从批发、零售环节购进适用免征增值税政策的蔬菜而取得的普通发票，能否作为计算抵扣进项税额的凭证？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5237588/content.html", "date": "2025-01-03", "id": "809dec59567c12452a0b42f19731c3b7", "content": "答：\n增值税一般纳税人从批发、零售环节购进适用免征增值税政策的蔬菜而取得的普通发票，不得作为计算抵扣进项税额的凭证。"}, {"source": "国家税务局", "category": "留言咨询", "title": "增值税一般纳税人购进国际旅客运输服务，能否抵扣进项税额？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5237341/content.html", "date": "2024-12-24", "id": "def3571deb1f6798499adc03bf0e0013", "content": "答：\n不能。纳税人提供国际旅客运输服务，适用增值税零税率或免税政策。相应地，购买国际旅客运输服务不能抵扣进项税额。"}, {"source": "国家税务局", "category": "留言咨询", "title": "增值税一般纳税人购进国内旅客运输服务，能否抵扣进项税额？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5237264/content.html", "date": "2024-12-17", "id": "50775185a934783a971d6275f318e2d1", "content": "答：\n可以。自2019年4月1日起，增值税一般纳税人购进国内旅客运输服务，其进项税额允许从销项税额中抵扣。"}, {"source": "国家税务局", "category": "留言咨询", "title": "公司2018年10月购进不动产抵扣了进项税额的60%部分，尚未抵扣完毕的40%部分，2019年4月1日以后可以分几个月进行抵扣吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5236532/content.html", "date": "2024-12-10", "id": "2d2a0b2659394128476381a54fd4699d", "content": "答：\n不可以。按照《财政部 税务总局 海关总署关于深化增值税改革有关政策的公告》（财政部 税务总局 海关总署公告2019年第39号）规定，纳税人在2019年3月31日前尚未抵扣的不动产进项税额的40%部分，自2019年4月所属期起，只能一次性转入进项税额进行抵扣。"}, {"source": "国家税务局", "category": "留言咨询", "title": "A单位2019年4月购入一层写字楼，取得增值税专用发票，购入写字楼的不动产进项税额还需要分两年抵扣吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5236384/content.html", "date": "2024-12-06", "id": "1ea98be5914151579cd3937257166f70", "content": "答：\n不需要，自2019年4月1日起，增值税一般纳税人取得不动产的进项税额不再分两年抵扣，而是在购进不动产的当期一次性抵扣进项税额。"}, {"source": "国家税务局", "category": "留言咨询", "title": "自2019年4月1日起，适用9%税率的增值税应税行为包括哪些？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5236314/content.html", "date": "2024-12-02", "id": "94b2cb90e1be84f98fdb14410f38bdac", "content": "答：\n自2019年4月1日起，增值税一般纳税人销售交通运输、邮政、基础电信、建筑、不动产租赁服务，销售不动产，转让土地使用权，销售或者进口下列货物，税率为9%：粮食等农产品、食用植物油、食用盐；自来水、暖气、冷气、热水、煤气、石油液化气、天然气、二甲醚、沼气、居民用煤炭制品；图书、报纸、杂志、音像制品、电子出版物；饲料、化肥、农药、农机、农膜;国务院规定的其他货物。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司符合享受先进制造业加计抵减政策，请问享受该项优惠应该如何填写申报表?", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5236295/content.html", "date": "2024-11-29", "id": "a32f22000e7627e30393adb7d038c370", "content": "答：\n根据《增值税及附加税费申报表（一般纳税人适用）》及其附列资料填写说明，享受先进制造业加计抵减政策纳税人应填写增值税及附加税费申报表附列资料（四）（税额抵减情况表），本表第6至8行仅限适用加计抵减政策的纳税人填写，反映其加计抵减情况，其他纳税人不需填写。第8行“合计”等于第6行、第7行之和。各列说明如下：\n1.第1列“期初余额”：填写上期期末结余的加计抵减额。\n2.第2列“本期发生额”：填写按照规定本期计提的加计抵减额。\n3.第3列“本期调减额”：填写按照规定本期应调减的加计抵减额。\n4.第4列“本期可抵减额”：按表中所列公式填写。（4＝1＋2－3）\n5.第5列“本期实际抵减额”：反映按照规定本期实际加计抵减额，按以下要求填写。\n若第4列≥0，且第4列＜主表第11栏－主表第18栏，则第5列＝第4列；\n若第4列≥主表第11栏－主表第18栏，则第5列＝主表第11栏－主表第18栏；\n若第4列＜0，则第5列等于0。\n计算本列“一般项目加计抵减额计算”行和“即征即退项目加计抵减额计算”行时，公式中主表各栏次数据分别取主表“一般项目”“本月数”列、“即征即退项目”“本月数”列对应数据。\n6.第6列“期末余额”：填写本期结余的加计抵减额，按表中所列公式填写。（6＝4－5）"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2024〕407号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971695.htm", "date": "2024-11-27", "id": "f08ef057f8f448abf106d4c185f719bc", "content": "财政部行政处罚决定书（财监法〔2024〕407号）\n财监法〔2024〕407号\n财政部行政处罚决定书\n当 事 人：吴玲\n地      址：深圳市罗湖区\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2023年对广东明心会计师事务所（普通合伙）（以下称广东明心）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n深圳市永霖科技有限公司（以下称永霖科技）2021年通过提前确认投资收益虚增净利润12,092,754.62元，虚增比例为4,515.23%。广东明心在永霖科技2021年财务报表审计中，未实施必要的审计程序，未核查永霖科技子公司关于分红的股权大会的会议记录，未获取充分适当的审计证据，发表了不恰当的审计意见。\n上述行为违反《中华人民共和国注册会计师法》第二十一条，《会计师事务所执业许可和监督管理办法》第六十条，《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条、第九条，《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十八条、第二十九条、第三十条，《中国注册会计师审计准则第1301号——审计证据》第十条等规定。\n上述事实，有财政检查报告、财政检查工作底稿、相关当事人签证和反馈意见等相关证据予以证实。\n你作为相关审计报告的签字注册会计师，对上述问题负有责任。依据《中华人民共和国注册会计师法》第三十九条的规定，财政部决定给予你暂停执行业务3个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2024年11月27日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2024〕406号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971694.htm", "date": "2024-11-27", "id": "985d8f4525aad166f8398684e6061a6b", "content": "财政部行政处罚决定书（财监法〔2024〕406号）\n财监法〔2024〕406号\n财政部行政处罚决定书\n当 事 人：何丽华\n地      址：深圳市罗湖区\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2023年对广东明心会计师事务所（普通合伙）（以下称广东明心）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、未实施必要的审计程序，未获取充分适当的审计证据，发表不恰当审计意见\n深圳市长林家居用品有限公司（以下称长林家居）2021年虚增货币资金4,886,680.15元，虚增比例为242.96%，虚增金额占财务报表总资产的20.09%。广东明心在长林家居2021年财务报表审计中，未对银行存款执行函证程序，未核对企业账面金额与银行对账单是否一致，且未说明理由，未发现企业账务处理错误，发表了不恰当的审计意见。\n二、未实施必要的审计程序，未获取充分适当的审计证据，未发现财务报表中存在的重大错报\n深圳市伟创源科技有限公司（以下称伟创源科技）2021年跨期确认存货，导致虚减2021年末存货9,587,787.57元，虚减比例为58.04%；虚减应交税费1,246,412.43元，虚减比例为82.37%；虚减应付账款10,834,200.00元，虚减比例为27.53%。广东明心在伟创源科技2021年财务报表审计中，未实施必要的审计程序，未对存货执行监盘程序及替代性程序，未对应付账款执行函证程序，未获取充分适当的审计证据，未发现财务报表重大错报。\n上述行为违反《中华人民共和国注册会计师法》第二十一条，《会计师事务所执业许可和监督管理办法》第六十条，《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条，《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十八条、第二十九条、第三十条，《中国注册会计师审计准则第1301号——审计证据》第十条，《中国注册会计师审计准则第1312号——函证》第十一条等规定。\n上述事实，有财政检查报告、财政检查工作底稿、相关当事人签证和反馈意见等相关证据予以证实。\n你作为相关审计报告的签字注册会计师，对上述问题负有责任。依据《中华人民共和国注册会计师法》第三十九条的规定，财政部决定给予你暂停执行业务6个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2024年11月27日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2024〕405号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971693.htm", "date": "2024-11-27", "id": "0d1c67f5d5c9b79460d93093f38a8362", "content": "财政部行政处罚决定书（财监法〔2024〕405号）\n财监法〔2024〕405号\n财政部行政处罚决定书\n当 事 人：杨丽芳\n地      址：深圳市罗湖区\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2023年对广东明心会计师事务所（普通合伙）（以下称广东明心）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告\n深圳市蓝极星光电科技有限公司（以下称蓝极星）2022年财务报表虚增银行存款9,299,170.54元，虚增比例为5,779.54%；虚减计入其他货币资金的承兑保证金账面金额6,542,442.08元，虚减比例为15.14%；虚增计入其他应收款的理财产品32,016,031.13元，虚增比例为376.66%。同时，理财产品未列入交易性金融资产核算而计入其他应收款核算，虚增其他应收款40,516,031.13元，虚增比例为4,049.14%；交易性金融资产金额为0元，虚减8,500,000.00元，虚减比例为100.00%。广东明心在蓝极星2022年财务报表审计中，未实施必要的审计程序，仅对货币资金、计入其他应收款的理财产品抽取2笔凭证进行检查，未对银行存款、其他货币资金、理财产品实施函证程序，未核对企业账面金额与银行对账单是否一致，未获取充分适当的审计证据，出具虚假审计报告。\n二、明知虚增研发费用而不予指明，出具虚假审计报告\n（一）在深圳奥简科技有限公司（以下称奥简科技）“低功耗/高性能线性降压（LDO）芯片”项目专项审计中，出具虚假审计报告。\n奥简科技“低功耗/高性能线性降压（LDO）芯片”项目，共计支出9,829,509.14元，其中将2022年度投入到40V开关式降压稳压器等6个项目的研发费用金额5,335,365.17元重复列入该项目，虚增研发费用5,335,365.17元，虚增比例为118.72%。广东明心在奥简科技2022年财务报表审计中，已获取奥简科技2022年度研发费用台账以及对应的凭证明细，但在对奥简科技“低功耗/高性能线性降压（LDO）芯片”项目的专项审计中，将上述6个项目的研发费用重复归集到“低功耗/高性能线性降压(LDO)芯片”项目中，出具虚假审计报告。\n（二）在深圳市新概念医疗科技有限公司（以下称新概念）2021年8月-2023年6月“新概念医用内窥镜摄像系统项目”支出专项审计中，出具虚假审计报告。\n新概念2021年8月-2023年6月投入“新概念医用内窥镜摄像系统项目”的支出共计532,166.45元，其中将2022年度投入到“医用内窥镜色彩还原度测试方法及装置的研发”项目和“电动柔性光纤镜塔设备的研发”项目的研发费用264,000.69元重复列入该项目的支出明细，虚增研发费用264,000.69元，虚增比例为98.45%。广东明心在新概念2022年财务报表审计中，已获取新概念2022年度研发费用台账以及对应的凭证明细，但在对新概念2021年8月-2023年6月“新概念医用内窥镜摄像系统项目”支出的专项审计中，将上述2个项目的研发费用重复支出归集到“新概念医用内窥镜摄像系统项目”项目中，出具虚假审计报告。\n上述行为违反《中华人民共和国注册会计师法》第二十一条，《会计师事务所执业许可和监督管理办法》第六十条，《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条、第九条，《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十条、第二十六条、第二十七条、第二十八条，《中国注册会计师审计准则第1301号——审计证据》第十条等规定。\n上述事实，有财政检查报告、财政检查工作底稿、相关当事人签证和反馈意见等相关证据予以证实。\n你作为相关审计报告的签字注册会计师，对上述问题负有责任。依据《中华人民共和国注册会计师法》第三十九条的规定，财政部决定给予你吊销注册会计师证书的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2024年11月27日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2024〕404号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971691.htm", "date": "2024-11-27", "id": "759670e2864301a38cfb95924c9744f8", "content": "财政部行政处罚决定书（财监法〔2024〕404号）\n财监法〔2024〕404号\n财政部行政处罚决定书\n当 事 人：万巧霞\n地      址：深圳市罗湖区\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2023年对广东明心会计师事务所（普通合伙）（以下称广东明心）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n中晨科技（深圳）有限公司（以下称中晨科技）2021年财务报表期末货币库存现金金额5,121,744.71元，实际现金余额为98,905.42元，虚增货币资金5,022,839.29元，虚增比例为415.20%。广东明心在中晨科技2021年财务报表审计中，未实施必要的审计程序，库存现金监盘表无被审计单位签字，监盘表上的签字日期早于监盘人入职时间，监盘表金额与企业实际现金余额不符且差异巨大，编造事由出具虚假审计报告。\n上述行为违反《中华人民共和国注册会计师法》第二十一条，《会计师事务所执业许可和监督管理办法》第六十条，《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条、第九条，《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十条、第二十六条、第二十七条、第二十八条，《中国注册会计师审计准则第1301号——审计证据》第十条等规定。\n上述事实，有财政检查报告、财政检查工作底稿、相关当事人签证和反馈意见等相关证据予以证实。\n你作为相关审计报告的签字注册会计师，对上述问题负有责任。依据《中华人民共和国注册会计师法》第三十九条的规定，财政部决定给予你吊销注册会计师证书的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2024年11月27日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2024〕402号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971690.htm", "date": "2024-11-27", "id": "be619ddf6afec8dffc1057a1d674d058", "content": "财政部行政处罚决定书（财监法〔2024〕402号）\n财监法〔2024〕402号\n财政部行政处罚决定书\n当 事 人：王素玲\n地      址：深圳市罗湖区\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2023年对广东明心会计师事务所（普通合伙）（以下称广东明心）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、编造事由出具虚假审计报告\n（一）在深圳市百路驰供应链管理有限公司（以下称百路驰）2021年财务报表审计中，未实施必要的审计程序，编造事由出具虚假审计报告。\n百路驰2021年财务报表期末库存现金金额11,257,059.42元，实际现金余额为30,422.51元，虚增货币资金11,226,636.91元，虚增比例为1,448.04%。广东明心在百路驰2021年财务报表审计中，未实施必要的审计程序，库存现金监盘表无被审计单位签字，监盘表上的签字日期早于监盘人入职时间，监盘表金额与企业实际现金余额不符且差异巨大，编造事由出具虚假审计报告。\n（二）在中晨科技（深圳）有限公司（以下称中晨科技）2021年度财务报表审计中，未实施必要的审计程序，编造事由出具虚假审计报告。\n中晨科技2021年财务报表期末货币库存现金金额5,121,744.71元，实际现金余额为98,905.42元，虚增货币资金5,022,839.29元，虚增比例为415.20%。广东明心在中晨科技2021年财务报表审计中，未实施必要的审计程序，库存现金监盘表无被审计单位签字，监盘表上的签字日期早于监盘人入职时间，监盘表金额与企业实际现金余额不符且差异巨大，编造事由出具虚假审计报告。\n（三）在中晨科技2022年度财务报表审计中，编造事由出具虚假审计报告。\n中晨科技2022年财务报表期末库存现金金额2,001,670.03元，实际现金余额33,967.69元，虚增货币资金1,967,702.34元，虚增比例为98.37%。广东明心归档的2022年纸质审计工作底稿中，存留有中晨科技2022年期末库存现金监盘表，金额与中晨科技实际现金余额差异巨大，编造事由出具虚假审计报告。\n二、未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告\n（一）在深圳市蓝极星光电科技有限公司（以下称蓝极星）2022年财务报表审计中，未实施必要审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n蓝极星2022年财务报表虚增银行存款9,299,170.54元，虚增比例为5,779.54%；虚减计入其他货币资金的承兑保证金账面金额6,542,442.08元，虚减比例为15.14%；虚增计入其他应收款的理财产品32,016,031.13元，虚增比例为376.66%。同时，理财产品未列入交易性金融资产核算而计入其他应收款核算，虚增其他应收款40,516,031.13元，虚增比例为4,049.14%；交易性金融资产金额为0元，虚减8,500,000.00元，虚减比例为100.00%。广东明心在蓝极星2022年财务报表审计中，未实施必要的审计程序，仅对货币资金、计入其他应收款的理财产品抽取2笔凭证进行检查，未对银行存款、其他货币资金、理财产品实施函证程序，未核对企业账面金额与银行对账单是否一致，未获取充分适当的审计证据，出具虚假审计报告。\n（二）在蓝极星2021年财务报表审计中，未实施必要审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n蓝极星2021年财务报表虚增货币资金29,341,446.00元，虚增比例为64.61%；虚增计入其他应收款的理财产品32,552,112.72元，虚增比例为651.04%。同时，对持有的理财产品计入其他应收款核算，未列入交易性金融资产，导致虚增其他应收款37,552,112.72元，虚增比例为6,593.59%；虚减交易性金融资产5,000,000.00元，虚减比例为100.00%。广东明心在蓝极星2021年财务报表审计中，未实施必要的审计程序，仅对货币资金、计入其他应收款的理财产品抽取2笔凭证进行检查，未对银行存款、其他货币资金、理财产品实施函证程序，未核对企业账面金额与银行对账单是否一致，未获取充分适当的审计证据，出具虚假审计报告。\n（三）在深圳市一品源太阳能科技有限公司（以下称一品源）2021年财务报表审计中，未实施必要审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n一品源2021年虚增净利润161,477.89元，虚增比例为450.98%；虚增货币资金73,063.97元，虚增比例为75.07%；虚增应收账款9,577,211.75元，虚增比例为416.20%；虚增应付账款8,976,713.17元，虚增比例为58.04%；虚增短期借款507,000.00元，虚增比例为167.22%；虚减其他应付款520,358.00元，虚减比例为31.68%。广东明心在一品源2021年财务报表审计中，未对企业银行存款执行函证程序，未核对企业账面金额与银行对账单是否一致，且未说明理由；未对短期借款执行函证程序，未取得短期借款合同进行核对；未对应收账款、应付账款执行函证程序，且未执行替代程序。广东明心未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n三、明知虚增研发费用而不予指明，出具虚假审计报告\n（一）在深圳奥简科技有限公司（以下称奥简科技）“低功耗/高性能线性降压（LDO）芯片”项目专项审计中，出具虚假审计报告。\n奥简科技“低功耗/高性能线性降压（LDO）芯片”项目，共计支出9,829,509.14元，其中将2022年度投入到40V开关式降压稳压器等6个项目的研发费用金额5,335,365.17元重复列入该项目，虚增研发费用5,335,365.17元，虚增比例为118.72%。广东明心在奥简科技2022年财务报表审计中，已获取奥简科技2022年度研发费用台账以及对应的凭证明细，但在对奥简科技“低功耗/高性能线性降压（LDO）芯片”项目的专项审计中，将上述6个项目的研发费用重复归集到“低功耗/高性能线性降压(LDO)芯片”项目中，出具虚假审计报告。\n（二）在深圳市新概念医疗科技有限公司（以下称新概念）2021年8月-2023年6月“新概念医用内窥镜摄像系统项目”支出专项审计中，出具虚假审计报告。\n新概念2021年8月-2023年6月投入“新概念医用内窥镜摄像系统项目”的支出共计532,166.45元，其中将2022年度投入到“医用内窥镜色彩还原度测试方法及装置的研发”项目和“电动柔性光纤镜塔设备的研发”项目的研发费用264,000.69元重复列入该项目的支出明细，虚增研发费用264,000.69元，虚增比例为98.45%。广东明心在新概念2022年财务报表审计中，已获取新概念2022年度研发费用台账以及对应的凭证明细，但在对新概念2021年8月-2023年6月“新概念医用内窥镜摄像系统项目”支出的专项审计中，将上述2个项目的研发费用重复支出归集到“新概念医用内窥镜摄像系统项目”项目中，出具虚假审计报告。\n四、未实施必要的审计程序，未获取充分适当的审计证据，发表不恰当审计意见\n（一）在深圳市长林家居用品有限公司（以下称长林家居）2021年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，发表不恰当审计意见。\n长林家居2021年虚增货币资金4,886,680.15元，虚增比例为242.96%，虚增金额占财务报表总资产的20.09%。广东明心在长林家居2021年财务报表审计中，未对银行存款执行函证程序，未核对企业账面金额与银行对账单是否一致，且未说明理由，未发现企业账务处理错误，发表了不恰当的审计意见。\n（二）在深圳市永霖科技有限公司（以下称永霖科技）2021年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，发表不恰当审计意见。\n永霖科技2021年通过提前确认投资收益虚增净利润12,092,754.62元，虚增比例为4,515.23%。广东明心在永霖科技2021年财务报表审计中，未实施必要的审计程序，未核查永霖科技子公司关于分红的股权大会的会议记录，未获取充分适当的审计证据，发表了不恰当的审计意见。\n五、未实施必要的审计程序，未获取充分适当的审计证据，未发现财务报表中存在的重大错报\n深圳市伟创源科技有限公司（以下称伟创源科技）2021年跨期确认存货，导致虚减2021年末存货9,587,787.57元，虚减比例为58.04%；虚减应交税费1,246,412.43元，虚减比例为82.37%；虚减应付账款10,834,200.00元，虚减比例为27.53%。广东明心在伟创源科技2021年财务报表审计中，未实施必要的审计程序，未对存货执行监盘程序及替代性程序，未对应付账款执行函证程序，未获取充分适当的审计证据，未发现财务报表重大错报。\n上述行为违反《中华人民共和国注册会计师法》第二十一条，《会计师事务所执业许可和监督管理办法》第六十条，《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条、第十二条、第十四条，《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十条、第二十六条、第二十七条、第二十八条、第三十条，《中国注册会计师审计准则第1301号——审计证据》第十条，《中国注册会计师审计准则第1312号——函证》第十一条，《中国注册会计师审计准则第1311号——对存货、诉讼和索赔、分部信息等特定项目获取审计证据的具体考虑》第四条等规定。\n上述事实，有财政检查报告、财政检查工作底稿、相关当事人签证和反馈意见等相关证据予以证实。\n你作为相关审计报告的签字注册会计师，对上述问题负有责任。依据《中华人民共和国注册会计师法》第三十九条的规定，财政部决定给予你吊销注册会计师证书的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2024年11月27日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2024〕401号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971688.htm", "date": "2024-11-27", "id": "873d784f075465328ed858e0b6c17466", "content": "财政部行政处罚决定书（财监法〔2024〕401号）\n财监法〔2024〕401号\n财政部行政处罚决定书\n当 事 人：广东明心会计师事务所（普通合伙）\n地      址：深圳市罗湖区南湖街道嘉北社区迎春路12号海外联谊大厦2720K3\n依照《中华人民共和国注册会计师法》等法律的规定，我部组织检查组于2023年对你所执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、编造事由出具虚假审计报告\n（一）在深圳市百路驰供应链管理有限公司（以下称百路驰）2021年财务报表审计中，未实施必要的审计程序，编造事由出具虚假审计报告。\n百路驰2021年财务报表期末库存现金金额11,257,059.42元，实际现金余额为30,422.51元，虚增货币资金11,226,636.91元，虚增比例为1,448.04%。你所在百路驰2021年财务报表审计中，未实施必要的审计程序，库存现金监盘表无被审计单位签字，监盘表上的签字日期早于监盘人入职时间，监盘表金额与企业实际现金余额不符且差异巨大，编造事由出具虚假审计报告。\n（二）在中晨科技（深圳）有限公司（以下称中晨科技）2021年度财务报表审计中，未实施必要的审计程序，编造事由出具虚假审计报告。\n中晨科技2021年财务报表期末货币库存现金金额5,121,744.71元，实际现金余额为98,905.42元，虚增货币资金5,022,839.29元，虚增比例为415.20%。你所在中晨科技2021年财务报表审计中，未实施必要的审计程序，库存现金监盘表无被审计单位签字，监盘表上的签字日期早于监盘人入职时间，监盘表金额与企业实际现金余额不符且差异巨大，编造事由出具虚假审计报告。\n（三）在中晨科技2022年度财务报表审计中，未实施必要的审计程序，编造事由出具虚假审计报告。\n中晨科技2022年财务报表期末库存现金金额2,001,670.03元，实际现金余额33,967.69元，虚增货币资金1,967,702.34元，虚增比例为98.37%。你所归档的2022年纸质审计工作底稿中，存留有中晨科技2022年期末库存现金监盘表，金额与中晨科技实际现金余额差异巨大，编造事由出具虚假审计报告。\n二、未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告\n（一）在深圳市蓝极星光电科技有限公司（以下称蓝极星）2022年财务报表审计中，未实施必要审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n蓝极星2022年财务报表虚增银行存款9,299,170.54元，虚增比例为5,779.54%；虚减计入其他货币资金的承兑保证金账面金额6,542,442.08元，虚减比例为15.14%；虚增计入其他应收款的理财产品32,016,031.13元，虚增比例为376.66%。同时，理财产品未列入交易性金融资产核算而计入其他应收款核算，虚增其他应收款40,516,031.13元，虚增比例为4,049.14%；交易性金融资产金额为0元，虚减8,500,000.00元，虚减比例为100.00%。你所在蓝极星2022年财务报表审计中，未实施必要的审计程序，仅对货币资金、计入其他应收款的理财产品抽取2笔凭证进行检查，未对银行存款、其他货币资金、理财产品实施函证程序，未核对企业账面金额与银行对账单是否一致，未获取充分适当的审计证据，出具虚假审计报告。\n（二）在蓝极星2021年财务报表审计中，未实施必要审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n蓝极星2021年财务报表虚增货币资金29,341,446.00元，虚增比例为64.61%；虚增计入其他应收款的理财产品32,552,112.72元，虚增比例为651.04%。同时，对持有的理财产品计入其他应收款核算，未列入交易性金融资产，导致虚增其他应收款37,552,112.72元，虚增比例为6,593.59%；虚减交易性金融资产5,000,000.00元，虚减比例为100.00%。你所在蓝极星2021年财务报表审计中，未实施必要的审计程序，仅对货币资金、计入其他应收款的理财产品抽取2笔凭证进行检查，未对银行存款、其他货币资金、理财产品实施函证程序，未核对企业账面金额与银行对账单是否一致，未获取充分适当的审计证据，出具虚假审计报告。\n（三）在深圳市一品源太阳能科技有限公司（以下称一品源）2021年财务报表审计中，未实施必要审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n一品源2021年虚增净利润161,477.89元，虚增比例为450.98%；虚增货币资金73,063.97元，虚增比例为75.07%；虚增应收账款9,577,211.75元，虚增比例为416.20%；虚增应付账款8,976,713.17元，虚增比例为58.04%；虚增短期借款507,000.00元，虚增比例为167.22%；虚减其他应付款520,358.00元，虚减比例为31.68%。你所在一品源2021年财务报表审计中，未对企业银行存款执行函证程序，未核对企业账面金额与银行对账单是否一致，且未说明理由；未对短期借款执行函证程序，未取得短期借款合同进行核对；未对应收账款、应付账款执行函证程序，且未执行替代程序。你所未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n三、明知虚增研发费用而不予指明，出具虚假审计报告\n（一）在深圳奥简科技有限公司（以下称奥简科技）“低功耗/高性能线性降压（LDO）芯片”项目专项审计中，出具虚假审计报告。\n奥简科技“低功耗/高性能线性降压（LDO）芯片”项目，共计支出9,829,509.14元，其中将2022年度投入到40V开关式降压稳压器等6个项目的研发费用金额5,335,365.17元重复列入该项目，虚增研发费用5,335,365.17元，虚增比例为118.72%。你所在奥简科技2022年财务报表审计中，已获取奥简科技2022年度研发费用台账以及对应的凭证明细，但在对奥简科技“低功耗/高性能线性降压（LDO）芯片”项目的专项审计中，将上述6个项目的研发费用重复归集到“低功耗/高性能线性降压(LDO)芯片”项目中，出具虚假审计报告。\n（二）在深圳市新概念医疗科技有限公司（以下称新概念）2021年8月-2023年6月“新概念医用内窥镜摄像系统项目”支出专项审计中，出具虚假审计报告。\n新概念2021年8月-2023年6月投入“新概念医用内窥镜摄像系统项目”的支出共计532,166.45元，其中将2022年度投入到“医用内窥镜色彩还原度测试方法及装置的研发”项目和“电动柔性光纤镜塔设备的研发”项目的研发费用264,000.69元重复列入该项目的支出明细，虚增研发费用264,000.69元，虚增比例为98.45%。你所在新概念2022年财务报表审计中，已获取新概念2022年度研发费用台账以及对应的凭证明细，但在对新概念2021年8月-2023年6月“新概念医用内窥镜摄像系统项目”支出的专项审计中，将上述2个项目的研发费用重复支出归集到“新概念医用内窥镜摄像系统项目”项目中，出具虚假审计报告。\n四、未实施必要的审计程序，未获取充分适当的审计证据，发表不恰当审计意见\n（一）在深圳市长林家居用品有限公司（以下称长林家居）2021年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，发表不恰当审计意见。\n长林家居2021年虚增货币资金4,886,680.15元，虚增比例为242.96%，虚增金额占财务报表总资产的20.09%。你所在长林家居2021年财务报表审计中，未对银行存款执行函证程序，未核对企业账面金额与银行对账单是否一致，且未说明理由，未发现企业账务处理错误，发表了不恰当的审计意见。\n（二）在深圳市永霖科技有限公司（以下称永霖科技）2021年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，发表不恰当审计意见。\n永霖科技2021年通过提前确认投资收益虚增净利润12,092,754.62元，虚增比例为4,515.23%。你所在永霖科技2021年财务报表审计中，未实施必要的审计程序，未核查永霖科技子公司关于分红的股权大会的会议记录，未获取充分适当的审计证据，发表了不恰当的审计意见。\n五、未实施必要的审计程序，未获取充分适当的审计证据，未发现财务报表中存在的重大错报\n深圳市伟创源科技有限公司（以下称伟创源科技）2021年跨期确认存货，导致虚减2021年末存货9,587,787.57元，虚减比例为58.04%；虚减应交税费1,246,412.43元，虚减比例为82.37%；虚减应付账款10,834,200.00元，虚减比例为27.53%。你所在伟创源科技2021年财务报表审计中，未实施必要的审计程序，未对存货执行监盘程序及替代性程序，未对应付账款执行函证程序，未获取充分适当的审计证据，未发现财务报表重大错报。\n上述行为违反《中华人民共和国注册会计师法》第二十一条、第三十一条，《会计师事务所执业许可和监督管理办法》第六十条，《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条、第十四条，《中国注册会计师职业道德守则第3号——提供专业服务的具体要求》第三条，《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十条、第二十六条、第二十七条、第二十八条、第二十九条、第三十条，《中国注册会计师审计准则第1301号——审计证据》第十条，《中国注册会计师审计准则第1311号——对存货、诉讼和索赔、分部信息等特定项目获取审计证据的具体考虑》第四条、第七条，《中国注册会计师审计准则第1312号——函证》第十一条、第十二条、第十三条等规定。\n上述事实，有财政检查报告、财政检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n根据违法行为的事实、性质、情节，依据《中华人民共和国注册会计师法》第三十九条，我部决定给予你所警告、没收违法所得22,100元并处罚款110,500元、吊销执业许可的行政处罚。\n当事人应在收到本处罚决定书之日起十五日内与财政部深圳监管局联系，凭财政部深圳监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2024年11月27日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2024〕400号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971685.htm", "date": "2024-11-27", "id": "1dc65f62b29a1c3d4f254f05fcc8d2c3", "content": "财政部行政处罚决定书（财监法〔2024〕400号）\n财监法〔2024〕400号\n财政部行政处罚决定书\n当 事 人：李瑶\n地      址：深圳市福田区\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2023年对深圳市度支会计师事务所（普通合伙）（以下称深圳度支）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n深圳市卓越信息技术有限公司（以下称深圳卓越）2021年虚增货币资金期末余额1,768,304.88元，虚增比例为1222%；虚增营业收入4,303,340.00元，虚增比例为31%；虚增营业成本5,714,054.41元，虚增比例为114%；少计合同履约成本3,726,414.04元。深圳度支在深圳卓越2021年财务报表审计中，简单抄录被审计单位财务报表数据，未实施必要的审计程序，未获取充分适当的审计证据，未发现财务报表重大错报，发表了不恰当的审计意见。\n上述行为违反《中华人民共和国注册会计师法》第二十一条，《会计师事务所执业许可和监督管理办法》第六十条，《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条、第九条，《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十八条、第二十九条、第三十条，《中国注册会计师审计准则第1301号——审计证据》第十条等规定。\n上述事实，有财政检查报告、财政检查工作底稿、相关当事人签证和反馈意见等相关证据予以证实。\n你作为相关审计报告的签字注册会计师，对上述问题负有责任。依据《中华人民共和国注册会计师法》第三十九条的规定，财政部决定给予你暂停执行业务3个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2024年11月27日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2024〕399号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971684.htm", "date": "2024-11-27", "id": "8fffabfcb7ea94a2bcc183013e372772", "content": "财政部行政处罚决定书（财监法〔2024〕399号）\n财监法〔2024〕399号\n财政部行政处罚决定书\n当 事 人：任洁\n地      址：深圳市福田区\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2023年对深圳市度支会计师事务所（普通合伙）（以下称深圳度支）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n深圳富达金技术有限公司（以下称富达金）2021年“研发支出”辅助账记录13个研发项目均为滑雪固定器类项目，对应部门为“BURTON”部门，但富达金研发费用明细账记录渔具部门研发材料领用金额为2,364,108.46元，占研发领料总额的63.60%；LED部门研发材料领用金额为1,352,617.00元，占研发领料总额的36.39%，与研发项目对应的“BURTON”部门研发领料金额为500.00元，仅占0.01%。富达金2021年账面记录的研发费用占营业收入的比例为4.32%，将上述计入渔具部门和LED部门的研发领料调出后实际的研发费用金额为1,095,460.17元，占营业收入的比例为0.98%。综上，富达金多计2021年度研发费用3,716,725.46元，多计比例为339%。\n同时，对于由深圳度支出具2021年度审计报告的事项，富达金表示不知情，也未向深圳度支提供相关会计账簿、记账凭证等会计资料。深圳度支在富达金2021年报审计中，未与被审计单位签订业务约定书，根据来源不明的部分财务资料编制审计工作底稿；未实施必要的审计程序，未获取充分适当的审计证据，未发现财务报表重大错报，发表了不恰当的审计意见。\n上述行为违反《中华人民共和国注册会计师法》第二十一条，《会计师事务所执业许可和监督管理办法》第六十条，《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条、第三十二条，《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十七条、第二十八条、第三十条，《中国注册会计师审计准则第1111号——就审计业务约定条款达成一致意见》第六条、第八条、第十条等规定。\n上述事实，有财政检查报告、财政检查工作底稿、相关当事人签证和反馈意见等相关证据予以证实。\n你作为相关审计报告的签字注册会计师，对上述问题负有责任。依据《中华人民共和国注册会计师法》第三十九条的规定，财政部决定给予你暂停执行业务3个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2024年11月27日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2024〕398号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971682.htm", "date": "2024-11-27", "id": "858bd6c442980baa211808f9f65b79f6", "content": "财政部行政处罚决定书（财监法〔2024〕398号）\n财监法〔2024〕398号\n财政部行政处罚决定书\n当 事 人：余大为\n地      址：深圳市福田区\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2023年对深圳市度支会计师事务所（普通合伙）（以下称深圳度支）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n深圳市腾星宏俊科技有限公司（以下称深圳腾星）2021年确认部分主营业务收入的同时通过研发费用结转所需物料成本，多计2021年研发费用、少计主营业务成本7,225,827.57元，多计研发费用比例为190%。深圳度支在深圳腾星2021年财务报表审计中，未对研发费用实施必要的审计程序，未就财务数据的真实性、准确性获取充分适当的审计证据，未发现财务报表重大错报，发表了不恰当的审计意见。\n上述行为违反《中华人民共和国注册会计师法》第二十一条，《会计师事务所执业许可和监督管理办法》第六十条，《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条、第九条，《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十条、第二十六条、第三十条，《中国注册会计师审计准则第1301号——审计证据》第十条等规定。\n上述事实，有财政检查报告、财政检查工作底稿、相关当事人签证和反馈意见等相关证据予以证实。\n你作为相关审计报告的签字注册会计师，对上述问题负有责任。依据《中华人民共和国注册会计师法》第三十九条的规定，财政部决定给予你暂停执行业务3个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2024年11月27日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2024〕397号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971681.htm", "date": "2024-11-27", "id": "bd66dc7904cb503dd2b9cdf410b31364", "content": "财政部行政处罚决定书（财监法〔2024〕397号）\n财监法〔2024〕397号\n财政部行政处罚决定书\n当 事 人：李绍丽\n地      址：深圳市福田区\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2023年对深圳市度支会计师事务所（普通合伙）（以下称深圳度支）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、未实施必要的审计程序，未获取充分适当的审计证据，发表不恰当审计意见\n深圳市智玩无疆科技有限公司（以下称深圳智玩）2021年资产负债表存货项目列报的期末余额为0元。经测算，深圳智玩2021年度期末实际存货结余数量约为453,763PCS，对应金额4,033,084.00元，深圳度支审计报告少计深圳智玩2021年末存货金额4,033,084.00元，占深圳智玩2021年末总资产的18%。\n深圳度支在深圳智玩2021年财务报表审计中，对被审计单位年末存货为0的明显异常情况未保持应有的职业怀疑，未对存货实施任何审计程序，简单抄录被审计单位财务报表，未获取充分适当的审计证据，未发现财务报表重大错报，发表了不恰当的审计意见。\n二、未履行必要的审计程序，未获取充分适当的审计证据，未发现财务报表重大错报\n深圳度支在深圳市天鹤科技有限公司（以下称深圳天鹤）2021年财务报表审计中，简单抄录被审计单位财务报表数据，未进行账证、账实核对，未实施必要的审计程序，未获取充分适当的审计证据，未发现财务报表中存在的重大错报。\n（一）深圳度支未对深圳天鹤通过虚构经济业务和对应的会计分录方式在账簿中进行调账的行为进行审计调整。如：2021年12月31#凭证：借：应交税金-增值税（待认证税额） 91,288.69元；贷：现金 91,288.69元；33#凭证：借：应收账款 7,200元；贷：现金 7,200元。\n（二）深圳度支未对深圳天鹤漏记银行账户及其中发生的业务金额情况进行审计调整，导致深圳天鹤少计2021年期末短期借款695,000.00元，占2021年末短期借款总额的34%。\n上述行为违反《中华人民共和国注册会计师法》第二十一条，《会计师事务所执业许可和监督管理办法》第六十条，《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条、第九条，《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十条、第二十六条、第三十条，《中国注册会计师审计准则第1301号——审计证据》第十条等规定。\n上述事实，有财政检查报告、财政检查工作底稿、相关当事人签证和反馈意见等相关证据予以证实。\n你作为相关审计报告的签字注册会计师，对上述问题负有责任。依据《中华人民共和国注册会计师法》第三十九条的规定，财政部决定给予你暂停执行业务6个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2024年11月27日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2024〕396号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971680.htm", "date": "2024-11-27", "id": "730e707031c52c66f3e398f9a94445c6", "content": "财政部行政处罚决定书（财监法〔2024〕396号）\n财监法〔2024〕396号\n财政部行政处罚决定书\n当 事 人：姚启平\n地      址：深圳市福田区\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2023年对深圳市度支会计师事务所（普通合伙）（以下称深圳度支）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n深圳市卓越信息技术有限公司（以下称深圳卓越）2022年虚增期末库存现金223,381.48元，虚增比例为7.29%；虚减应收账款1,063,339.29元，虚减比例为8.01%；虚减预付账款498,645.68元，虚减比例为100.00%；虚增其他应收款26,399.75元，虚增比例为100.00%；虚减预收账款375,362.35元，虚减比例为100.00%；虚减应交税费115,068.22元，虚减比例为53.18%；虚减其他应付款845,300.87元，虚减比例为24.87%。整体导致深圳卓越2022年度虚减资产总额5.34%，虚减负债总额10.58%，资产负债率从50.46%降至47.66%。深圳度支在深圳卓越2022年财务报表审计中，简单抄录被审计单位财务报表数据，未进行账表、账证、账实核对，未实施必要的审计程序，未就财务数据真实性、准确性获取充分、适当的审计证据，出具虚假审计报告。\n上述行为违反《中华人民共和国注册会计师法》第二十一条，《会计师事务所执业许可和监督管理办法》第六十条，《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条、第九条，《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十条、第二十六条、第二十八条、第三十条，《中国注册会计师审计准则第1301号——审计证据》第十条等规定。\n上述事实，有财政检查报告、财政检查工作底稿、相关当事人签证和反馈意见等相关证据予以证实。\n你作为相关审计报告的签字注册会计师，对上述问题负有责任。依据《中华人民共和国注册会计师法》第三十九条的规定，财政部决定给予你吊销注册会计师证书的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2024年11月27日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2024〕395号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971679.htm", "date": "2024-11-27", "id": "d2b1d0c2748143f7c89400ccdbdaec29", "content": "财政部行政处罚决定书（财监法〔2024〕395号）\n财监法〔2024〕395号\n财政部行政处罚决定书\n当 事 人：许晓冬\n地      址：深圳市福田区\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2023年对深圳市度支会计师事务所（普通合伙）（以下称深圳度支）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、编造事由出具虚假审计报告\n深圳度支在深圳市腾星宏俊科技有限公司（以下称深圳腾星）2022年财务报表审计中，未实施必要的审计程序，未就财务数据的真实性、准确性获取充分、适当的审计证据，通过违规冲减被审计单位资产、负债科目金额等方式，编造事由出具虚假审计报告。\n（一）深圳度支直接将深圳腾星对手方为不同主体的预收账款和预付账款进行对冲调减，虚减预付账款42,571,357.67元、预收账款42,571,357.67元。虚减资产占深圳腾星账表记录总资产的44%、虚减负债占深圳腾星账表记录总负债的62%。虚减后，深圳腾星资产负债率由72%降至50%。\n（二）深圳腾星未按历史成本计量无形资产账面价值，虚增2022年无形资产7,962,376.24元，虚增比例为18209%；虚增资本公积8,000,000.00元。深圳腾星确认部分主营业务收入的同时，通过研发费用结转所需物料成本，多计2022年研发费用、少计主营业务成本6,642,863.58元，多计研发费用比例为147%。深圳度支未实施必要的审计程序，未就财务数据的真实性、准确性获取充分、适当的审计证据。\n二、未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告\n（一）在深圳市微克科技有限公司（以下称微克科技）2021年财务报表审计中，未实施必要的审计程序，未就财务数据真实性、准确性获取充分适当的审计证据，出具虚假审计报告。\n微克科技2021年度财务报表审计报告虚减期末货币资金22,500,000.00元，虚减比例为65%；虚减存货14,616,503.94元，虚减比例为54%；虚减应收账款18,541,717.67元，虚减比例为85%；虚减应付账款36,691,300.80元，虚减比例为95%；虚减应交税费508,856.03元，虚减比例为92%；虚减应付票据10,000,000.00元，虚减比例为93%；虚减资本公积10,602,940.00元，虚减比例为42%；虚减营业收入48,311,497.28元，虚减比例为22%；虚减营业成本37,035,984.84元，虚减比例为20%；虚减管理费用10,375,242.43元，虚减比例为44%。深圳度支在微克科技2021年财务报表审计中，未实施必要的审计程序，未就财务数据的真实性、准确性获取充分适当的审计证据，出具虚假审计报告。\n（二）在深圳市伟绿达科技有限公司（以下称伟绿达）2021年财务报表审计中，未实施必要审计程序，未就财务数据真实性、准确性获取充分适当的审计证据，出具虚假审计报告。\n截至2023年10月24日，伟绿达仅对2021年1月至2021年12月期间发生的经济业务事项进行了部分记录。该公司会计记账凭证不完整，未进行账表、账证、账实核对，未进行完整的会计核算，未将记账凭证和原始凭证装订成册。深圳度支未到伟绿达生产经营地址开展审计工作，根据来源不明的财务数据，为其2021年度财务报表发表标准无保留审计意见。深圳度支在伟绿达2021年财务报表审计中，未实施必要审计程序，未就财务数据真实性、准确性获取充分、适当的审计证据，出具虚假审计报告。\n（三）在深圳市卓越信息技术有限公司（以下称深圳卓越）2022年财务报表审计中，未实施必要的审计程序，未就财务数据真实性、准确性获取充分适当的审计证据，出具虚假审计报告。\n深圳卓越2022年虚增期末库存现金223,381.48元，虚增比例为7.29%；虚减应收账款1,063,339.29元，虚减比例为8.01%；虚减预付账款498,645.68元，虚减比例为100.00%；虚增其他应收款26,399.75元，虚增比例为100.00%；虚减预收账款375,362.35元，虚减比例为100.00%；虚减应交税费115,068.22元，虚减比例为53.18%；虚减其他应付款845,300.87元，虚减比例为24.87%。整体导致深圳卓越2022年度虚减资产总额5.34%，虚减负债总额10.58%，资产负债率从50.46%降至47.66%。深圳度支在深圳卓越2022年财务报表审计中，简单抄录被审计单位财务报表数据，未进行账表、账证、账实核对，未实施必要的审计程序，未就财务数据真实性、准确性获取充分、适当的审计证据，出具虚假审计报告。\n三、未实施必要的审计程序，未获取充分适当的审计证据，发表不恰当审计意见\n（一）在深圳腾星2021年财务报表审计中，未发现财务报表重大错报，发表不恰当审计意见。\n深圳腾星确认部分主营业务收入的同时通过研发费用结转所需物料成本，多计2021年研发费用、少计主营业务成本7,225,827.57元，多计研发费用比例为190%。深圳度支在深圳腾星2021年财务报表审计中，未对研发费用实施必要的审计程序，未就财务数据的真实性、准确性获取充分适当的审计证据，未发现财务报表重大错报，发表了不恰当的审计意见。\n（二）在深圳市智玩无疆科技有限公司（以下称深圳智玩）2021年财务报表审计中，未发现财务报表重大错报，发表不恰当审计意见。\n深圳智玩2021年资产负债表存货项目列报的期末余额为0元。经测算，深圳智玩2021年度期末实际存货结余数量约为453,763PCS，对应金额4,033,084.00元，深圳度支审计报告少计深圳智玩2021年末存货金额4,033,084.00元，占深圳智玩2021年末总资产的18%。\n深圳度支在深圳智玩2021年财务报表审计中，对被审计单位年末存货为0的明显异常情况未保持应有的职业怀疑，未对存货实施任何审计程序，简单抄录被审计单位财务报表，未获取充分适当的审计证据，未发现财务报表重大错报，发表了不恰当的审计意见。\n（三）在深圳富达金技术有限公司（以下称富达金）2021年财务报表审计中，未发现财务报表重大错报，发表不恰当审计意见。\n富达金2021年“研发支出”辅助账记录13个研发项目均为滑雪固定器类项目，对应部门为“BURTON”部门，但富达金研发费用明细账记录渔具部门研发材料领用金额为2,364,108.46元，占研发领料总额的63.60%；LED部门研发材料领用金额为1,352,617.00元，占研发领料总额的36.39%，与研发项目对应的“BURTON”部门研发领料金额为500.00元，仅占0.01%。富达金2021年账面记录的研发费用占营业收入的比例为4.32%，将上述计入渔具部门和LED部门的研发领料调出后实际的研发费用金额为1,095,460.17元，占营业收入的比例为0.98%。综上，富达金多计2021年度研发费用3,716,725.46元，多计比例为339%。\n同时，对于由深圳度支出具2021年度审计报告的事项，富达金表示不知情，也未向深圳度支提供相关会计账簿、记账凭证等会计资料。深圳度支在富达金2021年财务报表审计中，未与被审计单位签订业务约定书，根据来源不明的部分财务资料编制审计工作底稿；未实施必要的审计程序，未获取充分适当的审计证据，未发现财务报表重大错报，发表了不恰当的审计意见。\n（四）在深圳卓越2021年财务报表审计中，未发现财务报表重大错报，发表不恰当审计意见。\n深圳卓越2021年虚增货币资金期末余额1,768,304.88元，虚增比例为1222%；虚增营业收入4,303,340.00元，虚增比例为31%；虚增营业成本5,714,054.41元，虚增比例为114%；少计合同履约成本3,726,414.04元。深圳度支在深圳卓越2021年财务报表审计中，简单抄录被审计单位财务报表数据，未实施必要的审计程序，未获取充分适当的审计证据，未发现财务报表重大错报，发表了不恰当的审计意见。\n四、未履行必要的审计程序，未获取充分适当的审计证据，未发现财务报表重大错报\n深圳度支在深圳市天鹤科技有限公司（以下称深圳天鹤）2021年财务报表审计中，简单抄录被审计单位财务报表数据，未进行账证、账实核对，未实施必要的审计程序，未获取充分适当的审计证据，未发现财务报表中存在的重大错报。\n（一）深圳度支未对深圳天鹤通过虚构经济业务和对应的会计分录方式在账簿中进行调账的行为进行审计调整。如：2021年12月31#凭证：借：应交税金-增值税（待认证税额） 91,288.69元；贷：现金 91,288.69元；33#凭证：借：应收账款 7,200元；贷：现金 7,200元。\n（二）深圳度支未对深圳天鹤漏记银行账户及其中发生的业务金额情况进行审计调整，导致深圳天鹤少计2021年期末短期借款695,000.00元，占2021年末短期借款总额的34%。\n上述行为违反《中华人民共和国注册会计师法》第二十一条，《会计师事务所执业许可和监督管理办法》第六十条，《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条、第九条、第十二条、第十四条，《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十六条、第二十七条、第二十八条、第三十条，《中国注册会计师审计准则第1301号——审计证据》第十条，《中国注册会计师审计准则第1312号——函证》第十一条等规定。\n上述事实，有财政检查报告、财政检查工作底稿、相关当事人签证和反馈意见等相关证据予以证实。\n你作为相关审计报告的签字注册会计师，对上述问题负有责任。依据《中华人民共和国注册会计师法》第三十九条的规定，财政部决定给予你吊销注册会计师证书的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2024年11月27日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2024〕394号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971677.htm", "date": "2024-11-27", "id": "08d3becf5bad78c339b2700dafe08d99", "content": "财政部行政处罚决定书（财监法〔2024〕394号）\n财监法〔2024〕394号\n财政部行政处罚决定书\n当 事 人：深圳市度支会计师事务所（普通合伙）\n地      址：深圳市福田区莲花街道金田路4028号荣超经贸中心A309-B32\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2023年对你所执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、编造事由出具虚假审计报告\n你所在深圳市腾星宏俊科技有限公司（以下称深圳腾星）2022年财务报表审计中，未实施必要的审计程序，未就财务数据的真实性、准确性获取充分、适当的审计证据，通过违规冲减被审计单位资产、负债科目金额等方式，编造事由出具虚假审计报告。\n（一）你所直接将深圳腾星对手方为不同主体的预收账款和预付账款进行对冲调减，虚减预付账款42,571,357.67元、预收账款42,571,357.67元。虚减资产占深圳腾星账表记录总资产的44%、虚减负债占深圳腾星账表记录总负债的62%。虚减后，深圳腾星资产负债率由72%降至50%。\n（二）深圳腾星未按历史成本计量无形资产账面价值，虚增2022年无形资产7,962,376.24元，虚增比例为18209%；虚增资本公积8,000,000.00元。深圳腾星确认部分主营业务收入的同时，通过研发费用结转所需物料成本，多计2022年研发费用、少计主营业务成本6,642,863.58元，多计研发费用比例为147%。你所未实施必要的审计程序，未就财务数据的真实性、准确性获取充分、适当的审计证据。\n二、未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告\n（一）在深圳市微克科技有限公司（以下称微克科技）2021年财务报表审计中，未实施必要的审计程序，未就财务数据真实性、准确性获取充分适当的审计证据，出具虚假审计报告。\n你所出具的微克科技2021年度财务报表审计报告虚减期末货币资金22,500,000.00元，虚减比例为65%；虚减存货14,616,503.94元，虚减比例为54%；虚减应收账款18,541,717.67元，虚减比例为85%；虚减应付账款36,691,300.80元，虚减比例为95%；虚减应交税费508,856.03元，虚减比例为92%；虚减应付票据10,000,000.00元，虚减比例为93%；虚减资本公积10,602,940.00元，虚减比例为42%；虚减营业收入48,311,497.28元，虚减比例为22%；虚减营业成本37,035,984.84元，虚减比例为20%；虚减管理费用10,375,242.43元，虚减比例为44%。你所在微克科技2021年财务报表审计中，未实施必要的审计程序，未就财务数据的真实性、准确性获取充分适当的审计证据，出具虚假审计报告。\n（二）在深圳市伟绿达科技有限公司（以下称伟绿达）2021年财务报表审计中，未实施必要审计程序，未就财务数据真实性、准确性获取充分适当的审计证据，出具虚假审计报告。\n截至2023年10月24日，伟绿达仅对2021年1月至2021年12月期间发生的经济业务事项进行了部分记录。该公司会计记账凭证不完整，未进行账表、账证、账实核对，未进行完整的会计核算，未将记账凭证和原始凭证装订成册。你所未到伟绿达生产经营地址开展审计工作，根据来源不明的财务数据，为其2021年度财务报表发表标准无保留审计意见。你所在伟绿达2021年财务报表审计中，未实施必要审计程序，未就财务数据真实性、准确性获取充分、适当的审计证据，出具虚假审计报告。\n（三）在深圳市卓越信息技术有限公司（以下称深圳卓越）2022年财务报表审计中，未实施必要的审计程序，未就财务数据真实性、准确性获取充分适当的审计证据，出具虚假审计报告。\n深圳卓越2022年虚增期末库存现金223,381.48元，虚增比例为7.29%；虚减应收账款1,063,339.29元，虚减比例为8.01%；虚减预付账款498,645.68元，虚减比例为100.00%；虚增其他应收款26,399.75元，虚增比例为100.00%；虚减预收账款375,362.35元，虚减比例为100.00%；虚减应交税费115,068.22元，虚减比例为53.18%；虚减其他应付款845,300.87元，虚减比例为24.87%。整体导致深圳卓越2022年度虚减资产总额5.34%，虚减负债总额10.58%，资产负债率从50.46%降至47.66%。你所在深圳卓越2022年财务报表审计中，简单抄录被审计单位财务报表数据，未进行账表、账证、账实核对，未实施必要的审计程序，未就财务数据真实性、准确性获取充分、适当的审计证据，出具虚假审计报告。\n三、未实施必要的审计程序，未获取充分适当的审计证据，发表不恰当审计意见\n（一）在深圳腾星2021年财务报表审计中，未发现财务报表重大错报，发表不恰当审计意见。\n深圳腾星确认部分主营业务收入的同时通过研发费用结转所需物料成本，多计2021年研发费用、少计主营业务成本7,225,827.57元，多计研发费用比例为190%。你所在深圳腾星2021年财务报表审计中，未对研发费用实施必要的审计程序，未就财务数据的真实性、准确性获取充分适当的审计证据，未发现财务报表重大错报，发表了不恰当的审计意见。\n（二）在深圳市智玩无疆科技有限公司（以下称深圳智玩）2021年财务报表审计中，未发现财务报表重大错报，发表不恰当审计意见。\n深圳智玩2021年资产负债表存货项目列报的期末余额为0元。经测算，智玩2021年度期末实际存货结余数量约为453,763PCS，对应金额4,033,084.00元，你所审计报告少计深圳智玩2021年末存货金额4,033,084.00元，占深圳智玩2021年末总资产的18%。\n你所在深圳智玩2021年财务报表审计中，对被审计单位年末存货为0的明显异常情况未保持应有的职业怀疑，未对存货实施任何审计程序，简单抄录被审计单位财务报表，未获取充分适当的审计证据，未发现财务报表重大错报，发表了不恰当的审计意见。\n（三）在深圳富达金技术有限公司（以下称富达金）2021年财务报表审计中，未发现财务报表重大错报，发表不恰当审计意见。\n富达金2021年“研发支出”辅助账记录13个研发项目均为滑雪固定器类项目，对应部门为“BURTON”部门。但富达金研发费用明细账记录渔具部门研发材料领用金额为2,364,108.46元，占研发领料总额的63.60%；LED部门研发材料领用金额为1,352,617.00元，占研发领料总额的36.39%，与研发项目对应的“BURTON”部门研发领料金额为500.00元，仅占0.01%。富达金2021年账面记录的研发费用占营业收入的比例为4.32%，将上述计入渔具部门和LED部门的研发领料调出后实际的研发费用金额为1,095,460.17元，占营业收入的比例为0.98%。综上，富达金多计2021年度研发费用3,716,725.46元，多计比例为339%。\n同时，对于由你所出具2021年度审计报告的事项，富达金表示不知情，也未向你所提供相关会计账簿、记账凭证等会计资料。你所在富达金2021年财务报表审计中，未与被审计单位签订业务约定书，根据来源不明的部分财务资料编制审计工作底稿；未实施必要的审计程序，未获取充分适当的审计证据，未发现财务报表重大错报，发表了不恰当的审计意见。\n（四）在深圳卓越2021年财务报表审计中，未发现财务报表重大错报，发表不恰当审计意见。\n深圳卓越2021年虚增货币资金期末余额1,768,304.88元，虚增比例为1222%；虚增营业收入4,303,340.00元，虚增比例为31%；虚增营业成本5,714,054.41元，虚增比例为114%；少计合同履约成本3,726,414.04元。你所在深圳卓越2021年财务报表审计中，简单抄录被审计单位财务报表数据，未实施必要的审计程序，未获取充分适当的审计证据，未发现财务报表重大错报，发表了不恰当的审计意见。\n四、未履行必要的审计程序，未获取充分适当的审计证据，未发现财务报表重大错报\n你所在深圳市天鹤科技有限公司（以下称深圳天鹤）2021年财务报表审计中，简单抄录被审计单位财务报表数据，未进行账证、账实核对，未实施必要的审计程序，未获取充分适当的审计证据，未发现财务报表中存在的重大错报。\n（一）你所未对深圳天鹤通过虚构经济业务和对应的会计分录方式在账簿中进行调账的行为进行审计调整。如：2021年12月31#凭证：借：应交税金-增值税（待认证税额） 91,288.69元；贷：现金 91,288.69元；33#凭证：借：应收账款 7,200元；贷：现金 7,200元。\n（二）你所未对深圳天鹤漏记银行账户及其中发生的业务金额情况进行审计调整，导致深圳天鹤少计2021年期末短期借款695,000.00元，占2021年末短期借款总额的34%。\n五、内部管理混乱，使用其他会计师事务所印章出具审计报告\n你所向深注协报备及提供给深圳卓越的2021年度审计报告（审计报告编号为深度财审字[2022]第PC183号，签字注册会计师为许晓冬、李瑶），正文签字盖章页（事务所盖章处）为深圳文本会计师事务所（普通合伙）印章，签字注册会计师为李伟、张枥方。报备的注册会计师与实际签字的注册会计师不同。\n上述行为违反《中华人民共和国注册会计师法》第二十一条、第三十一条，《会计师事务所执业许可和监督管理办法》第六十条、第六十二条，《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条、第十四条，《中国注册会计师职业道德守则第3号——提供专业服务的具体要求》第三条，《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十条、第二十六条、第二十七条、第二十八条、第二十九条、第三十条，《中国注册会计师审计准则第1301号——审计证据》第十条、第十三条，《中国注册会计师审计准则第1312号——函证》第十二条，第十三条，《中国注册会计师审计准则第1311号——对存货、诉讼和索赔、分部信息等特定项目获取审计证据的具体考虑》第四条，《中国注册会计师审计准则第1501号——对财务报表形成审计意见和出具审计报告》第十二条，《中国注册会计师审计准则第1111号——就审计业务约定条款达成一致意见》第六条、第八条、第十条等规定。\n上述事实，有财政检查报告、财政检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n根据违法行为的事实、性质、情节，依据《中华人民共和国注册会计师法》第三十九条，财政部决定给予你所警告、没收违法所得11,900元并处罚款59,500元、吊销执业许可的行政处罚。\n当事人应在收到本处罚决定书之日起十五日内与财政部深圳监管局联系，凭财政部深圳监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2024年11月27日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书 （财监法〔2024〕393号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971675.htm", "date": "2024-11-27", "id": "547a868043e299b3e5df8e38d3f13bd0", "content": "财政部行政处罚决定书 （财监法〔2024〕393号）\n财监法〔2024〕393号\n财政部行政处罚决定书\n当 事 人：张保林\n地      址：深圳市福田区\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2023年对深圳文本会计师事务所（普通合伙）（以下称深圳文本）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n深圳市粤能环保科技有限公司（以下称粤能环保）2021年财务报告列报货币资金720,843.28元，虚增货币资金700,333.53元，虚增比例为3,414.64%。深圳文本在粤能环保2021年度财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，发表了不恰当的审计意见。\n上述行为违反《中华人民共和国注册会计师法》第二十一条，《会计师事务所执业许可和监督管理办法》第六十条，《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条、第九条，《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十八条、第二十九条、第三十条，《中国注册会计师审计准则第1301号——审计证据》第十条等规定。\n上述事实，有财政检查报告、财政检查工作底稿、相关当事人签证和反馈意见等相关证据予以证实。\n你作为相关审计报告的签字注册会计师，对上述问题负有责任。依据《中华人民共和国注册会计师法》第三十九条的规定，财政部决定给予你暂停执行业务3个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2024年11月27日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书 （财监法〔2024〕392号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971674.htm", "date": "2024-11-27", "id": "942656b554e600e82dd742f9524da219", "content": "财政部行政处罚决定书 （财监法〔2024〕392号）\n财监法〔2024〕392号\n财政部行政处罚决定书\n当 事 人：高振霞\n地      址：深圳市福田区\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2023年对深圳文本会计师事务所（普通合伙）（以下称深圳文本）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n深圳可瑞高新材料股份有限公司（以下称可瑞高新）2022年虚减营业成本12,586,583.82元，虚减比例为33.37%；虚增销售费用1,705,196.11元，虚增比例为187.35%；虚增管理费用4,806,275.90元，虚增比例为320.90%；虚增研发费用1,160,171.73元，虚增比例为32.70%；虚增净利润4,526,082.51元，虚增比例为330.73%；虚减预付账款8,633,331.15元，虚减比例为72.34%；虚减存货10,580,000元，虚减比例为57.56%；虚增固定资产1,947,234.57元，虚增比例为79.53%；虚增无形资产2,246,828.51元，虚增比例为100.00%；虚减应付账款7,603,331.15元，虚减比例为52.14%；虚减其他应付款7,895,829.74元，虚减比例为75.37%；虚减长期借款6,429,928.81元，虚减比例为43.18%。深圳文本在可瑞高新2022年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n上述行为违反《中华人民共和国注册会计师法》第二十一条，《会计师事务所执业许可和监督管理办法》第六十条，《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条、第九条，《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十条、第二十六条、第二十七条、第三十条，《中国注册会计师审计准则第1301号——审计证据》第十条，《中国注册会计师审计准则第1312号——函证》第十一条。\n上述事实，有财政检查报告、财政检查工作底稿、相关当事人签证和反馈意见等相关证据予以证实。\n你作为相关审计报告的签字注册会计师，对上述问题负有责任。依据《中华人民共和国注册会计师法》第三十九条的规定，财政部决定给予你吊销注册会计师证书的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2024年11月27日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书 （财监法〔2024〕391号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971673.htm", "date": "2024-11-27", "id": "92f0ef2084bc1479587d3125fb9eace8", "content": "财政部行政处罚决定书 （财监法〔2024〕391号）\n财监法〔2024〕391号\n财政部行政处罚决定书\n当 事 人：李伟\n地      址：深圳市福田区\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2023年对深圳文本会计师事务所（普通合伙）（以下称深圳文本）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告\n（一）在深圳市景鹏建设工程有限公司（以下称景鹏建设
