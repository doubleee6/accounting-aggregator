  .searchbar svg { color: var(--muted); flex-shrink: 0; }
  .searchbar input { flex: 1; border: none; outline: none; font-size: 15px; background: transparent; color: var(--text); }
  .searchbar input::placeholder { color: #b0b6c0; }

  /* 主体布局 */
  .main { display: flex; gap: 18px; align-items: flex-start; }

  /* 左侧栏 */
  .sidebar { width: 210px; flex-shrink: 0; position: sticky; top: 20px; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px; box-shadow: var(--shadow-sm); }
  .group-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 8px 10px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px;
    cursor: pointer; font-size: 14px; color: #4b5563; transition: background .12s;
  }
  .nav-item:hover { background: #f2f4f7; }
  .nav-item.active { background: var(--primary-soft); color: var(--primary); font-weight: 500; }
  .nav-item .badge { margin-left: auto; background: #eceef1; color: #6b7280; border-radius: 10px; padding: 1px 8px; font-size: 12px; }
  .nav-item.active .badge { background: #cfe8e2; color: var(--primary); }
  .nav-item .soon { font-size: 11px; color: var(--tax); background: var(--tax-bg); border-radius: 6px; padding: 1px 6px; font-weight: 500; }

  /* 右侧内容 */
  .content { flex: 1; min-width: 0; }
  .count { color: var(--muted); font-size: 13px; margin: 2px 2px 12px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px; margin-bottom: 12px; box-shadow: var(--shadow-sm);
    transition: box-shadow .15s, transform .15s;
  }
  .card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .card .meta { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .tag { padding: 2px 9px; border-radius: 6px; font-size: 12px; font-weight: 500; }
  .tag.cicpa { background: var(--cicpa-bg); color: var(--cicpa); }
  .tag.esnai { background: var(--esnai-bg); color: var(--esnai); }
  .tag.tax { background: var(--tax-bg); color: var(--tax); }
  .card h2 { font-size: 16px; font-weight: 600; margin: 8px 0 6px; line-height: 1.45; }
  .card h2 a { color: var(--text); text-decoration: none; }
  .card h2 a:hover { color: var(--primary); }
  .card .sum { font-size: 13.5px; color: #5a6472; }
  .empty { text-align: center; color: var(--muted); padding: 56px 0; font-size: 14px; }

  @media (max-width: 720px) {
    .main { flex-direction: column; }
    .sidebar { width: 100%; position: static; }
    .nav-items-row { display: flex; gap: 6px; overflow-x: auto; }
    .nav-item { flex-shrink: 0; }
  }
</style>

<script>
const DATA = [{"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第二十五号）", "url": "https://www.cicpa.org.cn/xxfb/news/202608/t20260831_66069.html", "date": "2026-08-31", "id": "be40a7e92dd5470ab0bca6102a473d49", "content": "为贯彻落实《中共中央办公厅\n国务院办公厅印发\n<关于进一步加强财会监督工作的意见>的通知》等文件精神，根据财政部《关于进一步加强注册会计师协会自律监督工作的意见》（财会〔2024〕27号）以及《会计师事务所执业质量检查制度》（会协〔2011〕39号）要求，2025年，按照财会监督专项行动和注册会计师行业“财会监督深化年”主题活动的部署安排，中国注册会计师协会（以下简称中注协）联合财政部监督评价局，组织相关人员与财政部监管局组建检查组，对备案从事证券服务业务的会计师事务所进行执业质量检查；组织各省、自治区、直辖市及深圳市注册会计师协会（以下简称地方注协），联合地方财政部门，对本区域内的会计师事务所开展执业质量检查。现将有关情况公告如下。\n一、总体情况\n截至\n2024年底，全国共有会计师事务所10993家（总所9522家，分所1471家）。2025年，中注协与地方注协共对2053家会计师事务所开展执业质量检查。截至目前，中注协及地方注协共对存在违规问题的377家会计师事务所和711名注册会计师实施了行业惩戒及自律监管措施。其中，对91家会计师事务所和270名注册会计师予以公开谴责；对67家会计师事务所和211名注册会计师予以通报批评；对52家会计师事务所和194名注册会计师予以训诫，对167家会计师事务所和36名注册会计师采取约谈、责令整改等自律监管措施。\n二、典型案例\n（一）永拓会计师事务所（特殊普通合伙）存在对被审计单位同一财务报表同时出具不同结论的审计报告的行为。该所为某公司\n2012年度和2013年度合并财务报表分别出具了审计报告，审计意见均为保留意见。在出具上述报告的同一天，该所还分别为该公司出具了无保留意见的审计报告，其后附的财务报表与发表保留意见的审计报告后附的财务报表列报金额一致。中注协对该所给予公开谴责的行业惩戒。\n（二）吉林市鼎信会计师事务所有限公司在某公司\n2021-2023年研究开发费用专项审计中，从企业获取的资料存在重大不一致，在明知研发费用辅助账无支持资料的情况下，认可公司仅以计提基数和提取比例测算得出研发费用。该所未恰当评估研发费用计算的合理性，未获取充分、适当的审计证据。中注协对该所及注册会计师王林琳、刘艳玲给予公开谴责的行业惩戒。\n（三）中审华会计师事务所（特殊普通合伙）在某公司\n2024年财务报表审计中，未保持应有的职业怀疑，在建工程审计程序执行不到位，未能识别出企业在建工程存在虚增的问题，发表不恰当的审计意见。中注协对该所注册会计师韩正萍、莫秀金给予公开谴责的行业惩戒。\n（四）云南立审会计师事务所（普通合伙）存在允许其他单位或者个人以本所名义承办业务的情形；在审计项目中，存在用伪造的被审计单位及对方单位公章编制虚假询证函，用伪造的被审计单位公章编制虚假固定资产盘点检查表及管理层声明等情况。云南省注册会计师协会对该所及注册会计师吉庆伟、王桂英给予公开谴责的行业惩戒。\n（五）绍兴天清会计师事务所（普通合伙）在审计工作中，明知被审计单位因招投标需要，要做大资产、收入等财务指标，在收到企业人为修改后的财务报表和账套后，未对主营业务收入、银行存款、固定资产等科目明细账中的异常数据给予必要的关注，未获取充分、适当的审计证据，出具了\n4份无保留意见的审计报告。该所还存在未与被审计单位签订业务约定书，从其他会计师事务所转接审计项目并出具审计报告；审计工作底稿由其他会计师事务所员工编制，未获取相关支持性证据并复核数据等情况。浙江省注册会计师协会对该所及注册会计师陈杨、罗先明、刘映元、张小军给予公开谴责的行业惩戒。\n（六）宁波嘉德会计师事务所（普通合伙）允许其他会计师事务所以本所名义承办审计业务，某审计项目的审计工作底稿编制人和复核人均为其他会计师事务所从业人员。存在审计项目未编制审计工作底稿，利用其他会计师事务所审计调整数据出具审计报告的情况。部分审计项目的重要报表科目仅编制审定表、明细表、凭证测试表，未执行实质性的审计程序，未取得审计证据，无审计说明和审计结论。浙江省注册会计师协会对该所及注册会计师支立宇、吴秀梅、王志君给予公开谴责的行业惩戒。\n（七）上海普道兢实会计师事务所（普通合伙）向协会提供的纳税申报表存在修图痕迹，填表日期与税款所属期间明显不匹配，纳税申报表、财务报表收入数据与税务系统导出的对应期间纳税申报表列示的金额不一致，且未提供差异明细。该所未按照质量管理准则及职业道德守则要求修订相关制度；部分审计项目应收账款未实施函证程序且未说明不实施函证的理由，货币资金、预付账款、长期股权投资、固定资产、预收账款、营业收入、营业成本等重要科目审计程序执行不到位。上海市注册会计师协会对该所及注册会计师马勇、陈高潮、曹孟南、袁爱红给予公开谴责的行业惩戒。\n（八）上海中豪会计师事务所（普通合伙）未按照质量管理准则及职业道德守则要求修订相关制度；存在项目组同时为客户提供审计服务和代理记账服务的情况，违反相关独立性要求。在审计项目中，被审计单位提供给事务所的情况说明中提及不能提供会计报表有关会计科目的明细清单，在无法对应收账款、预收账款、其他应收款、其他应付款等重要科目实施有效的审计程序，无法获得充分、适当的审计证据的情况下，仍出具了无保留意见的审计报告。此外，部分鉴证项目在未履行必要的审计程序，未获取充分适当的证据的情况下出具报告。上海市注册会计师协会对该所及注册会计师来永斌、吴均圣给予公开谴责的行业惩戒。\n（九）河南中蓝会计师事务所（普通合伙）部分审计项目业务约定书要素不齐全，未编制总体审计策略；重要科目实质性审计程序缺失，银行存款及应收账款未执行函证程序且未说明理由，未执行替代测试；存货监盘流于形式，且未实施存货计价测试；在建工程、固定资产、无形资产、营业收入、营业成本等重要科目审计程序执行不到位。河南省注册会计师协会对该所及执行合伙人苗晓春，注册会计师吴君丽、肖莹莹、孙孝民给予公开谴责的行业惩戒。\n各会计师事务所和注册会计师应当遵守法律法规，遵循执业准则，恪守职业道德，坚持诚信、客观、独立、公正，切实发挥执业监督作用，维护市场经济秩序和社会公共利益，更好服务经济社会高质量发展。"}, {"source": "会计视野", "category": "处罚案例", "title": "2025年四川省大学生商科实务技能大赛落幕", "url": "https://www.esnai.cn/2025/1021/276652.shtml", "date": "2025-10-21", "id": "2dda4ece272abc8e929c9d9daa77b4a9", "content": "10月12日\n，2025年\n四川\n省大学生商科实务技能大赛—智慧财经云管理创新赛道决赛暨颁奖典礼在西\n南财\n经大学举行。本次大赛由省教育厅主办，西南\n财经大学\n承办，省注协协办。省注协秘书长颜彦应邀出席决赛及颁奖典礼。行业专家\n毕马威\n中国川渝地区\n审计\n主管合伙人万姝、\n天健会计师事务所\n审计主管合伙人李元良应邀担任决赛评委。\n颜彦秘书长在赛前致辞中指出，近年来，省注协围绕行业高质量发展要求，持续推进“高校—事务所—协会”协同育人机制，积极推动校所合作，构建多层次人才培养体系，通过统筹赛事、实习、师资共享等多种载体，在为学生提供实践能力、就业机会与职业发展支持的同时，也为夯实行业人才建设“蓄水池”提供坚实支撑。本次赛事作为省内财经领\n域\n首个聚焦“智慧云管理”的省级标杆赛事，实现了从“行业特色赛”到“省级精品赛道”的\n战略\n跃迁，更以“实战性、普惠性、高价值”三大亮点，成为数字财经人才培养的重要载体。未来，也希望该赛事依托省级精品赛道优势，进一步拓展辐射广度与影响深度，打造成为“西部引领、\n全国\n知名”的赛事品牌。\n本次赛事吸引了来自四川农业大学、西南石油大学、西南科技大学、\n成都\n信息工程大学、成都理工大学、西南财经大学等28所省内高校，112支团队、约500名学生参赛。大赛遵循“校赛选拔—省赛初赛—省赛决赛”三级晋级机制，确保赛事专业性和实践性。晋级决赛的11支队伍依次通过ppt现场展示与答辩，围绕企业\n财务\n健康评估、\n经营风险\n预测及发展\n战略规划\n提出创新方案，展现数字技术与财经专业的融合应用能力。经专家评审，最终2支团队获一等奖金奖，3支团队获一等奖银奖，6支团队获一等奖铜奖。"}, {"source": "会计视野", "category": "处罚案例", "title": "谋篇布局\"十五五\" 凝心聚力绘宏图", "url": "https://www.esnai.cn/2025/1021/276654.shtml", "date": "2025-10-21", "id": "831f72fe1bb93489e545e84cdacf2edd", "content": "原标题：谋篇布局“十五五” 凝心聚力绘宏图——2025年京津冀注册会计师资产评估行业协会培训暨联席会议成功举行\n10月14日\n至15日，2025年京津冀\n注册会计师\n资产评估\n行业协会培训暨联席会议在\n北京\n举行。北京注册\n会计师\n协会副会长、秘书长，北京\n资产\n评估协会秘书长\n刘军\n，\n天津市注册会计师协会\n秘书长冯强，\n天津\n市资产评估协会秘书长\n李庆\n勇，\n河北省\n注册\n会计\n师协会秘书长田雪林，\n河北省资产评估协会\n秘书长闻广玉及三地协会相关人员参加会议。\n会议以“谋篇布局‘十五五’，凝心聚力绘宏图”为主题，梳理京津冀注册会计师、资产评估行业在协同发展中取得的成果，围绕行业党建、人才培养、会员\n管理\n和行业发展等方面展开深入交流，明确了重点任务和工作举措。会议期间，与会人员开展了相关培训。\n会议强调，要搭建好“十五五”时期京津冀三地注册会计师、资产评估行业合作框架，找准定位、创新\n理念\n、资源共享、优势互补，凝心聚力，为提升行业治理水平，促进区\n域\n经济\n社会高质量发展，服务国家\n战略\n贡献\n更大力量。\n延伸阅读：\n北京注协维权委员会举办专题培训\n北京注协举办数据资产入表应用案例研讨会\n澳大利亚公共会计师协会集团访问北京注协"}, {"source": "会计视野", "category": "处罚案例", "title": "宜宾科学规范构建\"大审计\"监督格局", "url": "https://www.esnai.cn/2025/1021/276658.shtml", "date": "2025-10-21", "id": "aca64038a8a0321464d85cf59e1282ef", "content": ""}, {"source": "会计视野", "category": "处罚案例", "title": "大信与中兴华被批评涉雏鹰农牧报审计违规", "url": "https://www.esnai.cn/2025/1021/276664.shtml", "date": "2025-10-21", "id": "618952d5ed6aa657ecfbfaa573a58959", "content": "原标题：大信与中兴华2会计师所被批评 涉雏鹰退年报审计违规\n中国\n经济\n网\n北京\n10月20日\n讯深交所网站近期发布关于对\n大信\n会计师事务所\n（特殊普通合伙）及签字\n注册会计师\n许峰\n、谢四刚给予纪律处分的决定（深证上〔2025〕1083号）与关于对\n中兴华会计师事务所\n（特殊普通合伙）及签字注册\n会计师\n李菊洁、\n张丽\n萍给予纪律处分的决定（深证上〔2025〕1084号）。\n大信\n会计\n师事务所（特殊普通合伙）（以下简称大信所）、许峰、谢四刚在雏鹰农牧\n集团\n股份有限公司\n（以下简称雏鹰农牧）2016年\n年报\n审计\n过程中，存在以下违规行为：\n一、大信所出具的雏鹰农牧2016年\n审计报告\n存在虚假记载。雏鹰农牧2016年\n年度报告\n存在虚增可供出售\n金融\n资产\n、长期股权\n投资\n、其他\n流动资产\n、营业\n收入\n和\n利润\n总额等虚假记载行为。大信所为雏鹰农牧2016年年度报告提供审计服务，对该年度报告出具了标准无保留意见的审计报告，许峰、谢四刚是审计报告签字注册会计师。\n二、大信所在雏鹰农牧2016年年报审计过程中未勤勉尽责。大信所存在可供出售金\n融资\n产\n审计程序\n执行不到位、长期\n股权投资\n审计程序执行不到位、未对\n审计证据\n中的异常情况保持职业怀疑、营业收入审计程序存在缺陷、\n函证\n程序存在缺陷的问题。\n大信所在雏鹰农牧2016年年报审计过程中未勤勉尽责，出具的审计报告存在虚假记载，签字注册会计师许峰、谢四刚是直接负责的主管人员。大信所、许峰、谢四刚的上述违规行为违反了深交所《\n股票上市\n规则（2014年修订）》第1.4条、第2.23条的规定。鉴于上述违规\n事实\n及情节，依据深交所《\n股票\n上市规则（2014年修订）》第17.5条的规定，经深交所自律监管纪律处分委员会审议通过，深交所作出如下处分决定：\n一、对许峰、谢四刚给予公开谴责的处分；\n二、对\n大信会计师事务所\n（特殊普通合伙）给予通报批评的处分。\n中兴华\n会计师事务所（特殊普通合伙）（以下简称\n中兴\n华所）、李菊洁、张丽萍在雏鹰农牧集团股份有限公司（以下简称雏鹰农牧）2017年年报审计执业过程中，存在以下违规行为：\n一、中\n兴华\n所出具的雏鹰农牧2017年年度审计报告存在虚假记载。雏鹰农牧2017年年度报告存在虚增其他流动资产、营业收入和利润总额等虚假记载行为。中兴华所为雏鹰农牧2017年年度报告提供审计服务，对该年度报告出具了标准无保留意见的审计报告，李菊洁、张丽萍是审计报告签字注册会计师。\n二、中兴华所在雏鹰农牧2017年年报审计过程中未勤勉尽责。中兴华所存在\n控制测试\n程序存在缺陷、未对审计证据中的异常情况保持职业怀疑、营业收入审计程序存在缺陷、函证程序存在缺陷的问题。\n中兴华所在雏鹰农牧2017年年报审计过程中未勤勉尽责，出具的审计报告存在虚假记载，签字注册会计师李菊洁、张丽萍是直接负责的主管人员。中兴华所、李菊洁、张丽萍的上述违规行为违反了深交所《股票上市规则（2018年修订）》第1.4条、第2.23条的规定。鉴于上述违规事实及情节，依据深交所《股票上市规则（2018年修订）》第17.5条的规定，经深交所自律监管纪律处分委员会审议通过，深交所作出如下处分决定：\n一、对李菊洁、张丽萍给予公开谴责的处分；\n二、对中兴华会计师事务所（特殊普通合伙）给予通报批评的处分。\n雏鹰农牧集团股份有限公司2010年\n9月15日\n上市，保荐机构为东吴\n证券\n股份有限公司。雏鹰农牧于2019年\n10月16日\n起终止上市，东吴证券股份有限公司2020年1\n1月23日\n与雏鹰农牧签订的《推荐恢复上市、委托股票转让协议书》。根据\n全国\n中小企业股份转让系统有限责任公司《全国中小企业股份转让系统两网公司及退市公司股票转让暂行办法》的有关规定，东吴证券将于2021年\n10月22日\n起为雏鹰农牧在全国股转公司\n管理\n的两网和退市公司板块提供股票转让服务。\n以下为原文：\n深圳\n证券交易所文件\n深证上〔2025〕1083号\n关于对大信会计师事务所（特殊普通合伙）及签字注册会计师许峰、谢四刚给予纪律处分的决定当事人：\n大信会计师事务所（特殊普通合伙），雏鹰农牧集团股份有限公司2016年度\n财务报表\n审计机构，住所：\n北京市\n海淀区\n；\n许峰，雏鹰农牧集团股份有限公司2016年审计报告签字注册会计师；\n谢四刚，雏鹰农牧集团股份有限公司2016年审计报告签字注册会计师。\n根据中国证券监督管理委员会河南监管局《行政处罚决定书》查明的事实，大信会计师事务所（特殊普通合伙）（以下简称大信所）、许峰、谢四刚在雏鹰农牧集团股份有限公司（以下简称雏鹰农牧）2016年年报审计过程中，存在以下违规行为：\n一、大信所出具的雏鹰农牧2016年审计报告存在虚假记载\n雏鹰农牧2016年年度报告存在虚增\n可供出售金融资产\n、\n长期股权投资\n、其他流动资产、营业收入和利润总额等虚假记载行为。大信所为雏鹰农牧2016年年度报告提供审计服务，对该年度报告出具了标准无保留意见的审计报告，许峰、谢四刚是审计报告签字注册会计师。\n二、大信所在雏鹰农牧2016年年报审计过程中未勤勉尽责\n（一）可供出售\n金融资产\n审计程序执行不到位\n深圳泽赋农业产业投资\n基金\n有限合伙企业\n（\n有限合伙\n）（雏鹰农牧\n合并财务报表\n范围，以下简称深圳泽赋）可供出售金融资产审计记录稿显示，大信所收取了全部股权投资单位协议等资料。大信所未获取深圳泽赋对\n郑州市\n春野牧业有限责任公司（以下简称春野牧业）、宜城市光大农牧有限公司（以下简称光大农牧）的增资协议，但大信所得出“经核对相符，无异常”的审计结论。大信所审计程序执行不到位，未发现雏鹰农牧虚增可供出售金融资产的情况。\n（二）长期股权投资审计程序执行不到位\n兰考中聚恒通产业投资基金（有限合伙）（雏鹰农牧\n合并\n财务\n报表范围，以下简称中聚恒通）长期股权投资审计记录稿显示，大信所获取了长期股权投资相关的投资协议。大信所获取了中聚恒通对\n郑州\n迅腾贸易有限公司（以下简称迅腾贸易）的增资协议文本，迅腾贸易未在该协议文本上签章，但大信所得出“经核对，无异常”的审计结论。大信所审计程序执行不到位，未发现雏鹰农牧虚增长期股权投资的情况。\n（三）未对审计证据中的异常情况保持职业怀疑\n1．未对股权\n投资收益\n审计证据异常情况保持职业怀疑\n一是2016年\n6月2日\n，深圳泽赋投决会审议通过受让郑州牛师兄食品有限公司（以下简称牛师兄）41.66%股权，受让金额1250万元；\n6月30日\n，深圳泽赋即收到牛师兄\n分红\n款4200万元。二是上述6月2日投决会审议通过受让春野牧业40%股权，受让金额80万元；\n9月27日\n，深圳泽赋投决会审议通过对春野牧业增资3920万元；\n9月30日\n，深圳泽赋向春野牧业转账3920万元作为增资款；当日，深圳泽赋即收到春野牧业分红款3900万元。三是2016年\n7月5日\n，深圳泽赋投决会审议通过受让光大农牧45%股权，受让价格1035万元；上述9月27日投决会审议通过光大农牧股权投资\n项目\n4500万元，其中受让光大农牧45%股权，价格为1035万元，并在完成股权变更、资产交接等手续后对光大农牧增资3465万元，股权比例保持不变；\n9月28日\n，深圳泽赋向光大农牧转账3465万元作为增资款；次日，深圳泽赋即收到光大农牧分红款780万元。四是上述牛师兄等三家公司股东会决议均显示只对深圳泽赋分配利润，对其他股东不分配利润，且决议文本没有落款日期；春野牧业、光大农牧股东会决议未载明股东会召开具体日期。\n2．未对其他流动资产审计证据异常情况保持职业怀疑\n深圳泽赋其他流动资产审计记录稿显示，大信所获取了14家\n债权\n投资单位的\n合同\n、利息进账单等证据，并作出了“核对无异常”“其他流动资产的列报金额可以确认”的审计结论。一是相关合同显示，丙方（担保方）在为甲方（借款方）的借款提供担保时，应向乙方（深圳泽赋）如实书面申报其资产、债务情况以及以往向第三人提供担保的情况。审计底稿中未见担保方有关资产、债务情况的书面申报材料；上述合同显示，在同一担保方为多个借款方提供担保的情况下，未见担保方有关向第三人提供担保的书面申报材料。二是部分债权投资单位两方之间相互提供担保。三是某\n银行\n账户回单显示，存在多笔付款人名称为“过渡\n现金\n”，摘要为“某某利息”的资金入账，利息入账情况存在异常。\n3．未对\n货币资金\n异常情况保持职业怀疑\n深圳泽赋\n货币\n资金及\n交易性金融资产\n审计记录稿显示，大信所获取了某主要银行账户明细\n对账\n单，通过执行相关程序，作出了“货币资金及交易性金融资产的列报金额可以确认”的审计结论。上述银行账户明细对账单显示，2016年1\n2月21日\n，该账户分别存在18笔金额相同、流水号连续和27笔金额相同、流水号连续的资金入账。\n大信所未对上述异常情况保持职业怀疑，未采取进一步审计程序进行查证，未能发现雏鹰农牧虚增其他流动资产、营业收入、投资\n收益\n情况。\n（四）营业收入审计程序存在缺陷\n一是大信所获取郑州新融农牧贸易有限公司（雏鹰农牧合并财务报表范围企业，以下简称新融农牧）与部分客户签订的《生猪购销合同》，约定新融农牧负责运输并承担\n费用\n。大信所对部分客户进行了访谈，访谈记录显示，运输方式由客户承担，与上述合同规定明显不一致，但大信所未获取运输费用支持性证据。二是大信所审计计划显示，对新融农牧营业收入截止性测试时间覆盖范围为\n资产负债表日\n前后20天，但实际执行时间覆盖范围为2天。三是对新融农牧前十大客户（自然人）的函证显示，某个客户的询证函无对应发函和回函快递单据；某两个客户回函快递单据单位名称栏目显示为同一公司，且该两个客户回函快递单据显示询证函回复日期均晚于营业收入\n科目\n审定日期；某个客户回函快递单据显示回函人为非客户本人，单位名称显示为某公司，与《被审计单位提供的函证信息表》相关信息不符。大信所上述审计程序存在缺陷，未能发现雏鹰农牧虚增营业收入情况。\n（五）函证程序存在缺陷\n对深圳泽赋其他流动资产函证结果显示，未见部分询证函发函单据等证明函证发出方式的材料，部分回函快递单据显示询证函回复日期晚于大信所审计报告签署日期。对中聚恒通长期股权投资函证结果显示，未见证明对迅腾贸易询证函发函方式的材料。大信所上述审计程序存在缺陷，未能发现雏鹰农牧虚增其他流动资产、长期股权投资情况。\n大信所对深圳泽赋和中聚恒通的审计均采取了利用组成部分注册会计师工作的方式，分别制定了《利用组成部分注册会计师工作计划》，该计划主要包括在审计的初始阶段对双方的配合做出充分安排、将有关重要事项告知组成部分注册会计师、获取审计报告并对部分\n审计工作底稿\n等进行复核，对主要报表事项执行函证、访谈等针对性的补充程序。\n大信所上述可供出售金融资产、长期股权投资、投资收益、其他流动资产、货币资金、函证分析复核程序执行不到位，未保持应有的职业怀疑，获取的审计证据不充分不适当，未能发现雏鹰农牧2016年年报虚假记载情况。\n大信所在雏鹰农牧2016年年报审计过程中未勤勉尽责，出具的审计报告存在虚假记载，签字注册会计师许峰、谢四刚是直接负责的主管人员。大信所、许峰、谢四刚的上述违规行为违反了本所《股票上市规则（2014年修订）》第1.4条、第2.23条的规定。\n鉴于上述违规事实及情节，依据本所《股票上市规则（2014年修订）》第17.5条的规定，经本所自律监管纪律处分委员会审议通过，本所作出如下处分决定：\n一、对许峰、谢四刚给予公开谴责的处分；\n二、对大信会计师事务所（特殊普通合伙）给予通报批评的处分。\n许峰、谢四刚如对本所作出的纪律处分决定不服，可以在收到本纪律处分决定书之日起的十五个交易日内向本所申请复核。复核申请应当通过邮寄或者现场递交方式提交给本所指定联系人（曹女士，电话：0755-88668399）。对于大信所、许峰、谢四刚的上述违规行为和本所给予的处分，本所将记入\n诚信\n档案。\n深圳证券交易所\n2025年\n10月13日\n深圳证券交易所文件深证上〔2025〕1084号关于对中兴华会计师事务所（特殊普通合伙）及签字注册会计师李菊洁、张丽萍给予纪律处分的决定当事人\n：\n中兴华会计师事务所（特殊普通合伙），雏鹰农牧集团股份有限公司2017年度财务报表审计机构，住所：北京市\n丰台区\n；\n李菊洁，雏鹰农牧集团股份有限公司2017年审计报告签字注册会计师；\n张丽萍，雏鹰农牧集团股份有限公司2017年审计报告签字注册会计师。\n根据中国证券监督管理委员会河南监管局《行政处罚决定书》查明的事实，中兴华会计师事务所（特殊普通合伙）（以下简称中兴华所）、李菊洁、张丽萍在雏鹰农牧集团股份有限公司（以下简称雏鹰农牧）2017年年报审计执业过程中，存在以下违规行为：\n一、中兴华所出具的雏鹰农牧2017年年度审计报告存在虚假记载\n雏鹰农牧2017年年度报告存在虚增其他流动资产、营业收入和利润总额等虚假记载行为。中兴华所为雏鹰农牧2017年年度报告提供审计服务，对该年度报告出具了标准无保留意见的审计报告，李菊洁、张丽萍是审计报告签字注册会计师。\n二、中兴华所在雏鹰农牧2017年年报审计过程中未勤勉尽责\n（一）\n控制\n测试程序存在缺陷\n一是中兴华所制作深圳泽赋农业产业投资基金有限\n合伙企业\n（有限合伙）（雏鹰农牧合并财务报表范围，以下简称深圳泽赋）《控制测试过程记录——\n筹资\n与投资循环》底稿，控制测试目标“债权投资经过恰当的审批”对应的拟测试内容为“抽查债权投资相关审批决议”，中兴华所在对应的“控制测试活动是否得到有效执行（是/否）”栏目填写“是”。中兴华所审计底稿中未见债权投资相关审批决议材料。\n二是中兴华所制作深圳泽赋《筹资与投资循环——控制测试样本测试》底稿，在“投资的审批与处理”部分，未在“可行性—3—研究报告是否经过恰当的批准（是/否）”对应栏目填写内容，但中兴华所得出“控制运行有效”的结论。中兴华所审计底稿中未见债权投资可行性研究报告等材料。\n（二）未对审计证据中的异常情况保持职业怀疑\n1．未对\n应收利息\n审计证据异常保持职业怀疑中兴华所制定深圳泽赋应收利息期后回款检查表，并获取了相关银行流水，其中某银行账户流水显示，不同的债权投资对象集中在同一天现金存入利息且交易流水号连续，利息入账情况存在异常。如2018年\n4月9日\n，该账户收到51笔债权投资对象现金存入的4148.57万元利息；\n4月11日\n，该账户收到65笔债权投资对象现金存入的4564.68万元利息。\n2．未对其他流动资产审计证据异常保持职业怀疑\n一是河南\n泰元\n投资担保有限公司（雏鹰农牧合并财务报表范围，以下简称泰元担保）与15名投资对象签订《投资意向书》，约定泰元担保在投资考察期向被投资方投入投资意向诚意金，在投资意向诚意金支付前，被投资方需向泰元担保提供其认可的担保。2017年\n3月30日\n，泰元担保向15家投资对象共计支付7.28亿\n元诚\n意金，但中兴华所审计底稿中未见被投资方提供担保的证据材料。\n二是泰元担保公司章程第四十七条规定，“本公司可以以自有资金对\n国债\n、金融\n债券\n及大型企业债务融资工具等信用等级较高的固定收益类金融产品进行投资，以及不存在利益冲突且总额不高于净资产20%的其他投资”。经测算，上述7.28亿元诚意金规模超过净资产20%。\n三是中兴华所获取上述15家投资对象出具的《\n承诺\n函》，对截至2017年1\n2月31日\n的借款金额、不存在收到借款再返还泰元担保或其控股股东、实际控制人、其他\n关联方\n，以及与泰元担保及相关方之间不存在关联\n关系\n等情况作出承诺。吴某军持有泰元担保18.82%股权并担任董事，中兴华所审计底稿中企查查相关资料显示，吴某军同时担任上述15家被投资对象之一某公司\n法定代表人\n，持股78.59%，持有上述15家另一被投资对象之一某公司40%股份，该两家被投资对象与泰元担保存在关联关系，与《承诺函》所述内容存在矛盾。\n中兴华所未对上述异常情况保持职业怀疑，未采取进一步审计程序进行查证，未能发现雏鹰农牧虚增其他流动资产、营业收入情况。\n（三）营业收入审计程序存在缺陷\n一是中兴华所获取郑州新融农牧贸易有限公司（雏鹰农牧合并财务报表范围企业，以下简称新融农牧）与部分客户签订的《生猪购销合同》，该合同规定新融农牧负责运输并承担费用。中兴华所制作《\n收入确认\n原则和方法的查验记录》底稿，在“其他需说明事项”栏目，中兴华所记载“物流及\n风险\n：新融农牧公司承担购买至销售过程中的运费”，但中兴华所未获取运输费用支持性证据。二是有关部分前十大客户询证函的回函地址与发函地址不一致。三是有关部分前十大客户访谈的《中介机构现场工作记录》内容不完整。\n中兴华所上述审计程序存在缺陷，未能发现雏鹰农牧虚增营业收入情况。\n（四）函证程序存在缺陷\n《发函清单》《被询证者名称及地址核对记录》以及其他询证函相关底稿显示，部分询证函未见发函或回函快递单，部分被函证单位联系人、联系电话相同，部分被函证单位地址相同，部分被函证单位地址指向雏鹰农牧或雏鹰农牧相关物流中心、会计部等部门，部分被函证单位对应备注栏被标注为“财务办公地址”，部分被函证单位地址与营业执照显示住所地址不同，深圳泽赋、兰考中聚恒通产业投资基金（有限合伙）（以下简称中聚恒通）、泰元担保提供的同一函证对象函证地址不同。\n中兴华所上述相关函证程序存在缺陷，未能发现雏鹰农牧虚增其他流动资产等情况。\n中兴华所在雏鹰农牧2017年年报审计过程中未勤勉尽责，出具的审计报告存在虚假记载，签字注册会计师李菊洁、张丽萍是直接负责的主管人员。中兴华所、李菊洁、张丽萍的上述违规行为违反了本所《股票上市规则（2018年修订）》第1.4条、第2.23条的规定。\n鉴于上述违规事实及情节，依据本所《股票上市规则（2018年修订）》第17.5条的规定，经本所自律监管纪律处分委员会审议通过，本所作出如下处分决定：\n一、对李菊洁、张丽萍给予公开谴责的处分；\n二、对中兴华会计师事务所（特殊普通合伙）给予通报批评的处分。\n李菊洁、张丽萍如对本所作出的纪律处分决定不服，可以在收到本纪律处分决定书之日起的十五个交易日内向本所申请复核。复核申请应当通过邮寄或者现场递交方式提交给本所指定联系人（曹女士，电话：0755-88668399）。中兴华所、李菊洁、张丽萍的上述违规行为和本所给予的处分，本所将记入诚信档案。\n深圳证券交易所\n2025年10月13日\n延伸阅读：\n山西推动会计师事务所提升执业监督效能\n郑州财政局严抓会计师事务所执业质量监管\n重庆注协实施新设会计师事务所谈话制度"}, {"source": "会计视野", "category": "处罚案例", "title": "内江威远搭建能力提升平台 助力干部成长", "url": "https://www.esnai.cn/2025/1021/276662.shtml", "date": "2025-10-21", "id": "2dcb6574e5ef9a7387db1a35f8968fa5", "content": "原标题：“内江｜威远　搭建能力提升平台 助力审计干部成长”\n威远县\n审计\n局围绕“传经验、授方法、促成长”目标，组织开展“审计能手说审计”活动，通过实战案例分享、业务方法拆解、长效帮扶跟进等举措，为审计干部搭建能力提升平台，推动形成可复制、可推广的实践经验，锻造高素质专业化审计干部队伍。\n能手“传经”，用实战案例破解工作难题。\n组织多名深耕审计一线的业务骨干紧扣县\n域\n审计工作重点难点、结合\n项目\n实践操作经验，分享农业园区审计、公共工程\n投资\n审计等常见问题和思路方法，通过案例剖析，进一步提升审计干部对“异常数据”的敏感度、对“逻辑漏洞”的洞察力，不断提高审计专业能力。\n干部“取经”，在互动交流中汲取成长力量\n。开展现场答疑，逐一解答年轻干部普遍面临的“海量数据处理难”“被审计单位沟通难”“审计问题定性难”“整改跟踪推进难”等问题，打破“单向灌输”式培训模式。组建“审计能手助苗小组”，由1名业务能手对接3-5名审计新手，将“课堂”搬到审计现场，通过日常业务咨询、审计方案指导、报告撰写审核等，“边干边学”“以学促干”实现经验转化。\n机制“赋能”，构建常态长效干部培养体系\n。制定“季度分享+案例编制”活动计划，每季度围绕1个核心主题开展专项分享，年度组织收集“优秀案例经验汇编”，将零散经验转化为系统化的业务指引。完善“能力提升考核机制”，将干部参与分享活动、接受帮扶指导、业务能力提升等情况纳入年度考核，明确“掌握1项以上核心审计方法”“提出1个可行性审计建议”等具体目标，引导干部主动学习、深入实践。\n延伸阅读：\n白山市审计局报告2024年审计工作\n四平市审计局筑牢科学规范审计基石\n吉林市审计局举办全市内部审计专题培训"}, {"source": "会计视野", "category": "处罚案例", "title": "明光市审计局推动整改效果提质增效", "url": "https://www.esnai.cn/2025/1021/276666.shtml", "date": "2025-10-21", "id": "a6a24183010b1d5c737892637f2896a6", "content": ""}, {"source": "会计视野", "category": "处罚案例", "title": "广元审计助力残疾人\"两项补贴\"有效落实", "url": "https://www.esnai.cn/2025/1020/276602.shtml", "date": "2025-10-20", "id": "416055071f6400e24e17aed38b04b826", "content": ""}, {"source": "会计视野", "category": "处罚案例", "title": "广安华蓥\"四个强化\"助\"五大行动\"见效", "url": "https://www.esnai.cn/2025/1020/276604.shtml", "date": "2025-10-20", "id": "60ac670ae6480f165964c9b095fa6a34", "content": ""}, {"source": "会计视野", "category": "处罚案例", "title": "甘肃税协召开涉税专业服务三方沟通座谈会", "url": "https://www.esnai.cn/2025/1020/276608.shtml", "date": "2025-10-20", "id": "f318eadc69170e08255a943f01de714e", "content": ""}, {"source": "会计视野", "category": "处罚案例", "title": "上海评协完成第七期行业优秀人才选拔", "url": "https://www.esnai.cn/2025/1020/276606.shtml", "date": "2025-10-20", "id": "1237ce8d5566adba8904c26b2790589d", "content": ""}, {"source": "会计视野", "category": "处罚案例", "title": "陕西税协领导参加省新联会互访交流活动", "url": "https://www.esnai.cn/2025/1020/276610.shtml", "date": "2025-10-20", "id": "1ab22b9c6b52aa84dd636ef1564f8432", "content": ""}, {"source": "会计视野", "category": "处罚案例", "title": "聚焦国有资产 审计精准发力", "url": "https://www.esnai.cn/2025/1020/276612.shtml", "date": "2025-10-20", "id": "d355bb9d267804f8ff1e7ee9beb5448f", "content": ""}, {"source": "会计视野", "category": "处罚案例", "title": "助力强农惠农富农政策落实见效", "url": "https://www.esnai.cn/2025/1020/276616.shtml", "date": "2025-10-20", "id": "05f2712f1ea0e0a1cfb855bacaa5c3a4", "content": ""}, {"source": "会计视野", "category": "处罚案例", "title": "促进重点产业发展、关注就业资金使用", "url": "https://www.esnai.cn/2025/1020/276614.shtml", "date": "2025-10-20", "id": "3b9052979a16bf9231a5718025e48a1d", "content": ""}, {"source": "会计视野", "category": "处罚案例", "title": "大冶统一审计整改标准做好\"下半篇文章\"", "url": "https://www.esnai.cn/2025/1020/276622.shtml", "date": "2025-10-20", "id": "ddbf0c0ea07de379d27ec8085f5aaff4", "content": ""}, {"source": "会计视野", "category": "处罚案例", "title": "丹江口召开\"纪巡审\"监督贯通协同联席会", "url": "https://www.esnai.cn/2025/1020/276624.shtml", "date": "2025-10-20", "id": "df3f01ff8233f9a6f0a51e9590543cec", "content": ""}, {"source": "会计视野", "category": "处罚案例", "title": "香港会财局就多项审计缺失谴责普华永道", "url": "https://www.esnai.cn/2025/1020/276628.shtml", "date": "2025-10-20", "id": "3740e51a0c76332b18047a6e1d08d742", "content": ""}, {"source": "会计视野", "category": "处罚案例", "title": "江夏三措并举严把\"监督关\"助力乡村振兴", "url": "https://www.esnai.cn/2025/1020/276626.shtml", "date": "2025-10-20", "id": "f04cbc13c96115bdad63b06484f11f4b", "content": ""}, {"source": "会计视野", "category": "处罚案例", "title": "聊城阳谷:以审计力度呵护民生温度", "url": "https://www.esnai.cn/2025/1020/276630.shtml", "date": "2025-10-20", "id": "b13a0a857db181b64e8c91500892fa5a", "content": ""}, {"source": "会计视野", "category": "处罚案例", "title": "强化审计监督 全力护航学生营养改善", "url": "https://www.esnai.cn/2025/1020/276644.shtml", "date": "2025-10-20", "id": "9a519f36c5a4da651088230e0e73b60f", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第二十四号）", "url": "https://www.cicpa.org.cn/xxfb/tzgg/202507/t20250701_65502.html", "date": "2025-07-01", "id": "49109b80e4f9d86eddaf3d16bc781bda", "content": "为贯彻落实《中共中央办公厅\n国务院办公厅印发\n<关于进一步加强财会监督工作的意见>的通知》、《国务院办公厅关于进一步规范财务审计秩序\n促进注册会计师行业健康发展的意见》（国办发〔\n2021\n〕\n30\n号）等文件精神，根据《会计师事务所执业质量检查制度》（会协〔\n2011\n〕\n39\n号），\n20\n24\n年，按照财会监督专项行动和注册会计师行业\n“执业监督提质年”主题活动的部署安排，中国注册会计师协会（以下简称中注协）\n联合\n财政部监督评价局\n，\n组织相关人员与财政部监管局组\n建\n检查组，对备案从事证券服务业务的会计师事务所进行执业质量检查；组织\n各省、自治区、直辖市\n及深圳\n市\n注册会计师协会（以下简称地方注协）\n，联合地方财政部门，对本区域内的会计师事务所开展执业质量检查。现将有关情况公告如下。\n一、总体情况\n截至\n202\n3\n年\n底\n，全国共有\n会计师\n事务所\n10665\n家（总所\n9305\n家，分所\n1360\n家）\n。\n2024年，\n中注协与地方注协共对\n2226家会计师事务所开展执业质量检查。截至目前，中注协及地方注协共\n对存在违规问题的\n343\n家\n会计师\n事务所和\n784\n名注册会计师实施了行业惩戒及自律监管措施。其中，对\n67\n家\n会计师\n事务所和\n209\n名注册会计师\n予以\n公开谴责；对\n78\n家\n会计师\n事务所和\n204\n名注册会计师\n予以\n通报批评；对\n56\n家\n会计师\n事务所和\n179\n名注册会计师\n予以\n训诫\n；\n对其他\n142\n家\n会计师\n事务所和\n192\n名注册会计师采取约谈\n、责令整改\n等\n自律\n监管措施。\n二、\n典型案例\n（\n一\n）\n北京亚泰国际会计师事务所（特殊普通合伙）\n（\n现\n北京亚泰国际会计师事务所（普通合伙）\n）\n质量管理体系在设计和运行方面存在重大缺陷，不能合理保证会计师事务所及注册会计师执业行为在所有重大方面符合质量管理相关规定以及职业道德守则和业务准则的要求\n。该所多个审计项目未\n严格执行执业准则，未保持应有的职业怀疑，应收账款、存货、商誉、长期股权投资、无形资产、投资性房地产、资本公积、营业收入、营业成本、销售费用、政府补助、合并范围等重要科目或事项审计程序执行不到位，未获取充分、适当的审计证据，形成的审计结论不恰当。中注协对该所及注册会计师\n田梦珺、莫卫武、徐成光、周宛飞、张显玉、郑运霞、张明、胡志勇、赵雅楠、程程\n给予公开谴责的行业惩戒。\n（\n二\n）\n北京中名国成会计师事务所（特殊普通合伙）\n上海自贸试验区分所\n在相关注册会计师不知情的情况下，\n使用软件在鉴证报告上拼贴注册会计师\n印\n章及个人签名图片，冒用\n注册会计师\n名义出具\n99\n份鉴证报告。同时，该所部分审计项目存在未编制总体审计策略、具体审计计划，未恰当实施风险评估程序，应收账款、长期股权投资、应付账款、短期借款、营业收入、营业成本、研发费用等重要科目审计程序执行不到位，未见期初余额、期后事项、或有负债等事项相关审计工作底稿等情况。上海市注册会计师协会\n对\n该\n所及注册会计师潘湘成、贾海亮、陈平\n给予\n公开谴责\n的行业惩戒\n。\n（\n三\n）\n竹溪精诚联合会计师事务所（普通合伙）\n未按要求\n建\n立质量管理体系。\n该所仅有两名执业人员（合伙人），\n在注册会计师行业统一监管平台报备\n230份审计报告，报备数量与\n自查报告业务清单\n数量（\n21份）完全不符，隐瞒的年报审计\n项目\n均\n无审计\n工作\n底稿。\n同时，该所部分审计项目存在业务约定书、管理层声明书无被审计单位盖章；部分科目仅编制了明细表，未执行其他审计程序；\n项目复核流程流于形式，无实质性复核记录等情况。\n湖北省注册会计师协会\n对\n该所\n及首席合伙人\n刘义华\n给予\n公开谴责\n的行业惩戒。\n（\n四\n）\n河南众兴联合会计师事务所\n（\n普通合伙\n）\n部分审计项目未编制审计工作底稿即出具了审计报告\n。部分审计项目未执行风险评估程序，\n未确定重要性水平，未编制具体审计计划，\n重要科目实质性审计程序缺失，银行存款及应收账款未执行函证程序且未说明理由，\n未执行替代测试，存货、固定资产科目未实施监盘，营业收入、营业成本科目未实施实质性审计程序，业务复核流于形式\n等。河南省注册会计师协会对该所及执行合伙人李忠义、注册会计师郭悦俊给予公开谴责的行业惩戒。\n（\n五\n）\n湖北鹏信会计师事务所（普通合伙）\n存在非注册会计师实际控制\n，\n通过与咨询公司\n合作出具\n鉴证\n报告并分享业务收入，\n审计\n项目分类不准确、未\n按规定\n报备，\n审计\n报告文号跳号、重号\n等情况\n。\n同时，该所部分审计项目\n未设定重要性水平，银行存款未执行函证程序，应收账款、存货、营业收入、营业成本、管理费用等重要科目仅见审定表，无\n其他审计工作底稿。\n湖北省注册会计师协会\n对\n该所\n及首席合伙人耿昌敬\n给予\n公开谴责\n的行业惩戒。\n（\n六\n）\n云南中韬龙和会计师事务所（普通合伙）\n存在\n为\n获得客户支付业务介绍费\n的情况\n。\n该所质量管理体系未设计和实施风险评估程序，执行业务承接与保持的时间晚于业务约定书的签订日期，合伙人与普通员工晋升制度未体现以质量为导向。部分审计项目主营业务收入、货币资金、应收账款、预收账款、管理费用等重要科目审计程序执行不到位，\n审计报告意见类型不恰当。云南省注册会计师协会对\n该所及注册会计师\n刘蕾、\n龙寿娟给予公开谴责的行业惩戒。\n（\n七\n）\n北京厚德会计师事务所（特殊普通合伙）\n违反职业道德要求，对外发放宣传单，宣传内容包含\n“合作伙伴分成比例1:9”、“报告出具快、回款快”等内容。该所存在部分审计项目未合理执行控制测试，未记录函证控制过程，审计工作底稿复核记录日期晚于审计报告日，将被审计客户给其他会计师事务所的回函修改为该所回函等情况。北京注册会计师协会对该所及首席合伙人谢付生\n，\n注册会计师王瑞、王永平、杨松给予公开谴责的行业惩戒。\n（\n八\n）\n广东华杏会计师事务所（普通合伙）\n在执业质量检查期间，未按照检查工作要求提供相关资料，未配合检查工作。\n经查，该所还存在相关注册会计师未实际参与审计工作即出具审计报告的情况\n。\n深圳市注册会计师协会对该所\n及注册会计师高君盼、李娟给予\n公开谴责的行业惩戒。\n（\n九\n）\n广东广正会计师事务所（普通合伙）\n未按照质量管理准则要求修订和完善质量管理制度，已制定的相关制度与该所实际情况不符，形同虚设。该所公章以及有关注册会计师签字章由其他单位人员保管，相关注册会计师对签字章的使用情况不了解。该所部分审计项目还存在初步业务活动、风险评估程序流于形式，未实施银行存款、应收账款函证程序，且未说明不函证的理由，未实施存货、固定资产监盘程序，短期借款、营业收入、营业成本、管理费用、销售费用等重要科目审计程序执行不到位，项目复核流于形式，未按规定时间完成审计工作底稿归档等情况。广东省\n注册会计师协会对该所及\n首席合伙人张义荣\n，\n注册会计师赖成功、曹平给予\n公开谴责的行业惩戒。\n各会计师事务所\n要\n恪守职业道德，遵守执业准则，聚焦提升审计质量，守住诚信操守底线，筑牢法律法规红线，独立、客观、公正、规范执业，切实发挥执业监督作用，更好服务中国式现代化建设。"}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第二十二号）", "url": "https://www.cicpa.org.cn/xxfb/tzgg/202307/t20230707_64330.html", "date": "2023-07-07", "id": "da44e8dac4c7211ee9f5b68900b09366", "content": "为进一步贯彻落实《国务院办公厅关于进一步规范财务审计秩序 促进注册会计师行业健康发展的意见》（国办发〔\n2021\n〕\n30\n号），根据《会计师事务所执业质量检查制度》（会协〔\n2011\n〕\n39\n号），\n2022\n年，中国注册会计师协会（以下简称中注协）与各省、自治区、直辖市注册会计师协会（以下简称省级注协）共计对\n1864\n家会计师事务所开展执业质量检查。截至目前，中注协和省级注协对存在违规问题的\n259\n家事务所和\n336\n名注册会计师实施了行业惩戒及自律监管措施。其中，对\n27\n家事务所和\n54\n名注册会计师公开谴责；对\n32\n家事务所和\n74\n名注册会计师通报批评；对\n37\n家事务所和\n135\n名注册会计师训诫，对其他\n163\n家事务所和\n73\n名注册会计师采取约谈等监管措施。\n现将检查发现的八个典型案例公告如下：\n一是北京正义会计师事务所有限责任公司主任会计师未参与该公司日常经营管理。该公司未按检查要求提供审计工作底稿，部分审计项目存在未实施风险评估程序、未确定重要性水平，未对银行存款、往来款项、借款、存货等科目执行必要的审计程序，未获取充分、适当的审计证据等问题。北京注册会计师协会对该公司及主任会计师杨火才、注册会计师张明作出公开谴责的行业惩戒。\n二是广州天维会计师事务所（普通合伙）现任合伙人均不是注册会计师，不符合执业许可存续条件，且存在冒用已去世注册会计师名义出具报告的行为。该所的部分审计项目存在未对收入、银行存款、往来款项、固定资产等科目执行必要的审计程序，未获取充分、适当的审计证据等问题。广东省注册会计师协会对该所作出公开谴责的行业惩戒。\n三是广州市忠雄会计师事务所（普通合伙）未建立合伙人晋升、委派、考评、薪酬和违规行为处理等机制，且存在支付业务回扣等问题。该所的部分审计项目未确定重要性水平，未对收入、银行存款、往来款项、长期股权投资等科目执行必要的审计程序，未获取充分、适当的审计证据。广东省注册会计师协会对该所作出公开谴责的行业惩戒。\n四是台州中鼎会计师事务所（普通合伙）的部分审计项目存在未实际执行审计程序，未编制审计工作底稿等问题。浙江省注册会计师协会对该所及注册会计师董汉兰、段兰珍、单爱武、赵遗珍作出公开谴责的行业惩戒。\n五是杭州德益会计师事务所（普通合伙）的部分审计项目未对银行存款、应收账款、短期借款等科目执行\n函证程序，也未说明不予函证的理由。同时，存在未对存货获取有关清单，未实施监盘程序，也未实施替代程序等问题。上述科目均对有关财务报表有重大影响，但该所未能执行必要的审计程序，\n未能获取充分、适当的审计证据。浙江省注册会计师协会对该所及注册会计师张丛玲、周娟作出公开谴责的行业惩戒。\n六是武汉天意会计师事务有限责任公司主任会计师无法正常履职，未委托其他股东代为履职，该公司也未将上述情况向监管部门报备。该公司审计报告编号不连续，还存在部分签字注册会计师未实际参与项目，复核流于形式等问题。抽查的部分项目未确定重要性水平，未对银行存款、借款、存货、固定资产、收入等科目执行必要的审计程序，未获取充分、适当的审计证据。个别项目的研发费用审定金额与财务报表实际披露金额差异巨大，该公司未予以关注。湖北省注册会计师协会对该公司及主任会计师高剑作出公开谴责的行业惩戒。\n七是重庆华税会计师事务所（普通合伙）部分审计项目的项目承接、实质性程序、完成阶段等全部审计程序仅由一名助理人员完成，且此人在该所无工资发放及社保缴纳记录，无法证明是该所员工。该所部分审计项目还存在未对收入、银行存款、存货、往来款项、长期股权投资、固定资产等科目执行必要的审计程序，未获取充分、适当的审计证据等问题。重庆市注册会计师协会对该所作出公开谴责的行业惩戒。\n八是云南知行宜宸会计师事务所（普通合伙）对部分首次承接的审计业务，未与前任注册会计师进行沟通，未执行期初余额审计；部分审计项目未对发放贷款、长期股权投资、往来款项、收入等科目执行必要的审计程序，未获取充分、适当的审计证据。云南省注册会计师协会对该所作出公开谴责的行业惩戒。\n2023\n年，中注协将在财政部党组的领导下，按照党中央、国务院决策部署，深入贯彻《中共中央办公厅 国务院办公厅关于进一步加强财会监督工作的意见》，切实加强行业自律监督，加大行业惩戒力度，推动会计师事务所更好发挥执业监督作用，促进行业高质量发展，更好服务国家建设。"}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第二十一号）", "url": "https://www.cicpa.org.cn/xxfb/tzgg/202203/t20220318_63434.html", "date": "2022-03-18", "id": "94c452ebcfcc287c62f6a1a1b5568692", "content": "为深入贯彻落实《国务院办公厅关于进一步规范财务审计秩序 促进注册会计师行业健康发展的意见》（国办发〔\n2021\n〕\n30\n号），根据《会计师事务所执业质量检查制度》（会协〔\n2011\n〕\n39\n号），\n2021\n年，中国注册会计师协会按照统一检查计划、统一组织实施、统一规范程序、统一处理处罚、统一发布公告的原则，组织各省、自治区、直辖市注册会计师协会（以下简称各省级注协）在配合财政部门检查的基础上，又对\n1000\n家事务所开展行业自律检查。截至\n2022\n年\n2\n月\n28\n日，各级注协对存在违规问题的\n199\n家事务所和\n465\n名注册会计师按照惩戒办法实施了行业惩戒。其中，对\n53\n家事务所和\n116\n名注册会计师公开谴责；对\n57\n家事务所和\n151\n名注册会计师通报批评；对\n56\n家事务所和\n137\n名注册会计师训诫；对其他\n33\n家事务所和\n61\n名注册会计师采取约谈等监管措施。同时，各级注协共开展常态化诚信教育\n68\n次，监管约谈\n227\n家次，整改帮扶\n235\n家次，提供专业技术支持\n208\n次。\n现将检查发现的\n9\n个典型案例公告如下：\n一、郁南西江会计师事务所有限公司印章管理不规范，同时使用两枚事务所印章，违规使用业务章签发审计报告，控制注册会计师个人印章。该所还存在抽查的部分审计项目未执行必要的审计程序、未发现被审计单位合并范围严重错误、未按照准则要求撰写审计报告等其他违规行为。广东省注册会计师协会对该所及注册会计师张桂深、陈光明、梁景成、李烘飞作出公开谴责的行业惩戒。\n二、云南天定会计师事务所（普通合伙）雇佣其他会计师事务所合伙人冯某某复核审计工作底稿，且由冯某某执行部分审计工作。该所还存在抽查的部分审计项目未对收入、银行存款、往来款项和存货执行必要的审计程序，未获取充分适当的审计证据等其他违规行为。云南省注册会计师协会对该所及首席合伙人谭宏章作出公开谴责的行业惩戒。\n三、上海佳安会计师事务所有限公司由注册会计师以个人名义聘请非本所员工担任助理人员，执行审计业务，编制审计工作底稿。该所还存在抽查的部分审计项目未执行必要审计程序、未获取充分适当的审计证据等其他违规行为。上海市注册会计师协会对该所及注册会计师黄肇华、陆里清、唐宝华作出公开谴责的行业惩戒。\n四、嘉兴百索会计师事务所有限公司存在允许其他单位或者个人以本所名义承办业务、允许部分注册会计师在该所挂名执业等行为，且存在幕后控制人。该所还存在抽查的部分审计项目未发现长期待摊费用未摊销等重大会计差错、未执行存货监盘等必要审计程序、未获取充分适当的审计证据等其他违规行为。浙江省注册会计师协会对该所及注册会计师李运河作出公开谴责的行业惩戒。\n五、广州中庆会计师事务所（普通合伙）\n2020\n年\n1\n月至\n2021\n年\n6\n月出具的\n790\n份审计报告未经合伙人签字。该所还存在抽查的部分审计项目未执行银行函证等必要审计程序、未获取充分适当的审计证据等其他违规行为。广东省注册会计师协会对该所及注册会计师张俊生、夏喜林、杨士华、陈郁华、李亚民、胡道福作出公开谴责的行业惩戒。\n六、广州华拓会计师事务所有限公司未按检查要求提供审计工作底稿，涉及\n1570\n份审计报告，占该所出具审计报告总量的\n85.33%\n，涉嫌无审计工作底稿出具审计报告。该所还存在抽查的部分审计项目未发现库存现金期末余额为负数、未实施银行函证等必要的审计程序、未获取充分适当的审计证据等其他违规行为。广东省注册会计师协会对该所及注册会计师商四新、胡建新、黄意、赵露雨、张鹏、李亚芝、胡建国、陈川作出公开谴责的行业惩戒。\n七、杭州深度会计师事务所有限公司存在抽查的部分审计项目未对收入、银行存款、往来款项和存货执行必要的审计程序，审计工作底稿中财务报表项目审定金额与财务报表实际金额差异巨大等问题。该所还存在未按规定及时归档审计工作底稿、未按规定如实报备对外出具的审计报告信息等其他违规行为。浙江省注册会计师协会对该所及注册会计师周凤明、崔鸿启、张娟娟作出公开谴责的行业惩戒。\n八、上海普道兢实会计师事务所（普通合伙）存在抽查的部分审计报告与审计工作底稿表述存在矛盾、审计报告中审计意见段与管理层对财务报表的责任段中披露的财务报表编制基础不一致、审计业务约定书中与管理层声明书关于财务报表编制基础不一致等问题。该所还存在抽查的审计项目未实施固定资产监盘和存货监盘程序、未对函证进行控制等其他违规行为。上海市注册会计师协会对该所及注册会计师马勇、陈高潮作出公开谴责的行业惩戒。\n九、湖南元和联合会计师事务所（普通合伙）存在抽查的部分审计报告格式不符合审计报告准则规定、审计报告“特别事项说明”主体未予明确、未附已审计财务报表和财务报表附注等问题。该所还存在抽查的部分审计项目未执行必要的审计程序，承接承做与自身规模、执业能力风险承担能力不匹配的业务等其他违规行为。湖南省注册会计师协会对该所及注册会计师刘春保、陈武南作出公开谴责的行业惩戒。\n中注协将坚决贯彻党中央、国务院决策部署，认真落实财政部党组部署安排，着力配合开展整顿行业秩序、建设法规体系等工作，促进行业健康发展。同时，坚持零容忍、严监管，加大行业自律监管力度，持续推动提升行业社会公信力和服务国家建设的能力。\n2022年\n3\n月\n16\n日"}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第二十号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/202006/t20200618_23730.html", "date": "2020-06-18", "id": "1201d030010040fb0c3fdc3aefabbd23", "content": "你现在的位置：\n首页\n>\n信息查询\n>\n执业质量检查通告\n中国注册会计师协会会计师事务所执业质量检查通告（第二十号）\n2020-06-18 04:12\n根据《会计师事务所执业质量检查制度》（会协〔\n2011\n〕\n39\n号）和《关于开展\n2019\n年全国会计师事务所执业质量检查工作的通知》（会协〔\n2019\n〕\n15\n号）要求，中国注册会计师协会和各省、自治区、直辖市注册会计师协会（以下简称各级注协）组织实施并完成了\n2019\n年会计师事务所（以下简称事务所）执业质量检查工作。现将有关情况通告如下：\n一、检查总体情况\n2019\n年，各级注协贯彻落实党中央国务院关于“打好防范化解重大风险攻坚战”、会计师事务所执业质量检查制度改革精神和注册会计师行业\n“\n职业化建设年\n”\n主题活动等各项要求\n,\n坚持问题导向、坚持系统风险导向检查理念、坚持帮扶提升职业化水平，促进事务所完善质量控制体系、提升职业道德水平和执业质量，推动行业高质量发展。根据《国务院办公厅关于推广随机抽查规范事中事后监管的通知》的要求，以周期性检查为基础，结合实际情况，建立随机抽取检查对象、随机选派检查人员、检查情况及检查结果及时向社会公开的\n“\n双随机、一公开\n”\n检查机制。\n2019\n年，各级注协共组织检查人员\n846\n名\n,\n检查事务所\n1296\n家，抽查业务项目\n8521\n个，其中，财务报表审计业务项目\n6163\n个，验资业务项目\n927\n个，其他专项审计业务项目\n1431\n个。其中，中注协组织检查人员\n69\n名，检查从事证券服务业务事务所\n5\n家，抽取业务项目\n54\n个。\n二、检查重点及检查结果\n2019\n年，各级注协继续坚持系统风险导向检查理念和\n“\n五个并重\n”\n原则，注重实效，加强帮扶。在充分利用系统风险导向检查的成果和日常监管实践基础上，开展\n“\n回头看\n”\n检查，帮助事务所查找存在质量控制和风险管理问题的原因，促进事务所提升执业质量和职业声誉，推动注册会计师提升职业能力、养成职业精神。\n在被检查事务所的选取上，各级注协以周期性检查为基础，坚持随机抽取被查事务所，同时结合实际，将业务规模较大的事务所，涉嫌不正当低价竞争或承接业务数量与事务所人力资源明显不匹配的事务所，在日常监管中发现执业质量较差、受到监管机构处罚或投诉举报较多的事务所，与境外事务所和国内从事证券服务业务会计师事务所合作项目较多的事务所作为检查重点。\n在被检查业务项目的选取上，各级注协根据事务所质量控制体系的初步评估及业务特点，聚焦高风险项目和重点风险领域，兼顾不同规模的客户，以及财务报告审计、验资和专项审计等业务类型。部分省级注协在检查中还关注了事务所内部收费管理政策的制定和执行情况，对涉嫌不正当低价竞争的项目进行重点检查。中注协重点关注了高风险上市公司、新三板和金融类企业的审计业务。\n从检查总体情况看，多数事务所针对第一轮检查中提出的问题，通过修改和完善相关的执业质量政策和程序进行了整改，风险防范意识有所提升，执业质量有所提高。\n检查也发现，部分事务所质量控制体系设计不适当或未得到有效执行，个别事务所未建立完整的质量控制体系，\n未及时根据业务准则和法律法规变化更新执业标准、工作底稿、业务报告等\n。\n在业务执行过程中，一些事务所未认真贯彻风险导向审计理念，未保持合理的职业怀疑态度，存在对重大的交易、账户余额及列报实施的审计程序实施不到位，获取的审计证据不够充分、适当，审计证据不能有效支持审计报告的意见类型等问题。个别事务所在无底稿或未对获取的审计证据执行审计程序的情况下直接出具审计报告。检查还发现，个别会计师事务所未向检查组提交完整的业务清单，存在大量未以事务所名义开具的业务收入发票。\n三、惩戒情况\n2019\n年，各级注协按有关规定对存在问题的\n96\n家事务所和\n251\n名注册会计师实施了行业惩戒。包括，给予\n26\n家事务所和\n37\n名注册会计师公开谴责；给予\n40\n家事务所和\n102\n名注册会计师通报批评；给予\n30\n家事务所和\n112\n名注册会计师训诫。其中，中注协给予\n6\n名注册会计师通报批评，给予\n2\n名注册会计师训诫。\n2020\n年，各级注协将巩固拓展行业质量提升成果，开展\n“\n质量管理提升年\n”\n主题活动，完善行业业务监管工作机制和制度，加强监管联动，探索建立综合监管机制，强化执业质量检查，加大对违规会计师事务所及注册会计师的惩戒力度，提高行业诚信水平。\n2020\n年\n6\n月\n15\n日\n附件："}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十九号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201903/t20190321_23729.html", "date": "2019-03-21", "id": "7b7506d12f3b3a1cd3759bd2dd91420f", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十八号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201901/t20190107_23728.html", "date": "2019-01-07", "id": "f9020bd48738e0366630011b6a29ebe8", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十七号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201804/t20180420_23727.html", "date": "2018-04-20", "id": "f2955e154c71bf2540f897e961dad47a", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十六号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201801/t20180123_23726.html", "date": "2018-01-23", "id": "08e945bc381e3118ab665df25b9ba034", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十五号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201704/t20170421_23725.html", "date": "2017-04-21", "id": "c0be67a8a615d8823055249270c184be", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十四号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201701/t20170117_23724.html", "date": "2017-01-17", "id": "60d2bbe1c3ce16006e428d870ee93ff8", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十三号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201603/t20160311_23723.html", "date": "2016-03-11", "id": "2f7f36c3e79aa253af775b617dcde749", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十二号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201601/t20160126_23722.html", "date": "2016-01-26", "id": "28ccaf0befdb3939dbd9412104bc60f5", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十一号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201503/t20150303_23721.html", "date": "2015-03-03", "id": "3836f51e78739819633eea0e0ed7c8f2", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201501/t20150127_23720.html", "date": "2015-01-27", "id": "971d8ef3b58d640ef15876bea20d2da6", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第九号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201402/t20140208_23719.html", "date": "2014-02-08", "id": "675dc8a771d891bace92d9f9aed33fa1", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第八号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201312/t20131212_23718.html", "date": "2013-12-12", "id": "394ad8936f8489bc88ba8d66ea3bb65f", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第七号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201303/t20130308_23717.html", "date": "2013-03-08", "id": "3d903a38f1316b6663337d2d781c0769", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第六号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201212/t20121219_23716.html", "date": "2012-12-19", "id": "57c37d38649d71f14f5c2712344c24e1", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第五号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201203/t20120301_23715.html", "date": "2012-03-01", "id": "d82855cbb202c00c325e0c08a21343c8", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第四号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201202/t20120221_23714.html", "date": "2012-02-21", "id": "4198d2691af49e6253fbaf5647148985", "content": ""}];
const list = document.getElementById('list');
const count = document.getElementById('count');
let src = 'all';
let kw = '';

function esc(s) { return (s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function tagFor(source) {
  if (source === '中注协') return '<span class="tag cicpa">中注协</span>';
  if (source === '国家税务局') return '<span class="tag tax">国家税务局</span>';
  return '<span class="tag esnai">会计视野</span>';
}

function render() {
  const q = kw.toLowerCase();
  const rows = DATA.filter(it => {
    if (src !== 'all' && it.source !== src) return false;
    if (q && !(it.title + ' ' + (it.content || '')).toLowerCase().includes(q)) return false;
    return true;
  });
  count.textContent = '共 ' + rows.length + ' 条';
  if (!rows.length) {
    const tip = src === '国家税务局' ? '国家税务局数据源尚未接入，敬请期待' : '没有匹配的结果';
    list.innerHTML = '<div class="empty">' + tip + '</div>';
    return;
  }
  list.innerHTML = rows.map(it => {
    const sum = (it.content || '').slice(0, 140).replace(/\n/g, ' ');
    return '<div class="card">' +
      '<div class="meta">' + tagFor(it.source) + '<span>' + esc(it.date || '日期未知') + '</span></div>' +
      '<h2><a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.title) + '</a></h2>' +
      (sum ? '<div class="sum">' + esc(sum) + '…</div>' : '<div class="sum">（正文待抓取）</div>') +
      '</div>';
  }).join('');
}

document.getElementById('q').addEventListener('input', e => { kw = e.target.value.trim(); render(); });
document.getElementById('sidebar').addEventListener('click', e => {
  const item = e.target.closest('.nav-item');
  if (!item) return;
  document.querySelectorAll('.nav-item').forEach(c => c.classList.remove('active'));
  item.classList.add('active');
  src = item.dataset.src;
  render();
});
render();
</script>
