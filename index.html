严重失信主体名单，实施联合惩戒。依据《办法》第十条第一款的规定，列入期限为二年。\n依据《办法》第九条的规定，除依照法律、行政法规规定应当实施的从业限制等管理措施外，财政部还将实施下列管理措施：（一）列为重点监管对象，适当提高抽查的比例和频次，依法严格监管；（二）不适用告知承诺制；（三）不予授予财政部门荣誉称号等表彰奖励。\n依据《办法》第十二条的规定，当事人被列入严重失信主体名单满一年后，符合相关条件的，可以依照《办法》规定向财政部申请提前移出。\n依据《办法》第十七条的规定，如有证据证明公示信息不准确，可以要求财政部进行更正。\n如不服本决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本决定不停止执行。\n财  政  部\n2025年8月18日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部列入严重失信主体名单决定书（财监法〔2025〕226 号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971719.htm", "date": "2025-08-18", "id": "24647b1af51ff11dfb7604780e196dca", "content": "财政部列入严重失信主体名单决定书（财监法〔2025〕226 号）\n财监法〔2025〕226 号\n财政部列入严重失信主体名单决定书\n当 事 人：张璐\n地      址：辽宁省大连市金州区\n依照《注册会计师行业严重失信主体名单管理办法》（财政部令第116号，以下简称《办法》）的规定，基于对你的有关行政处罚，财政部决定将你列入严重失信主体名单，有关事项如下：\n依照《中华人民共和国注册会计师法》等法律规定，财政部组织检查组对深圳市巨源立德会计师事务所（普通合伙）执业质量等情况开展了检查，认定该所在多个审计项目中，存在出具虚假审计报告等严重违法问题；你作为该所主任会计师、相关审计报告签字注册会计师，对有关问题负有责任。2025年1月，财政部对你作出行政处罚决定，给予你吊销注册会计师证书的行政处罚。\n依据《办法》第四条第（二）项的规定，财政部决定将你列入注册会计师行业严重失信主体名单，实施联合惩戒。依据《办法》第十条第二款的规定，列入期限为五年。\n依据《办法》第九条的规定，除依照法律、行政法规规定应当实施的从业限制等管理措施外，财政部还将实施下列管理措施：（一）列为重点监管对象，适当提高抽查的比例和频次，依法严格监管；（二）不适用告知承诺制；（三）不予授予财政部门荣誉称号等表彰奖励。\n依据《办法》第十二条的规定，当事人被列入严重失信主体名单满一年后，符合相关条件的，可以依照《办法》规定向财政部申请提前移出。\n依据《办法》第十七条的规定，如有证据证明公示信息不准确，可以要求财政部进行更正。\n如不服本决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本决定不停止执行。\n财  政  部\n2025年8月18日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部列入严重失信主体名单决定书（财监法〔2025〕225 号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971718.htm", "date": "2025-08-18", "id": "927aacc4d52178db7c3533027651c26c", "content": "财政部列入严重失信主体名单决定书（财监法〔2025〕225 号）\n财监法〔2025〕225 号\n财政部列入严重失信主体名单决定书\n当 事 人：深圳市巨源立德会计师事务所（普通合伙）\n地      址：深圳市龙岗区坂田街道贝尔路高新技术工业园北座厂房401\n依照《注册会计师行业严重失信主体名单管理办法》（财政部令第116号，以下简称《办法》）的规定，基于对你所的有关行政处罚，财政部决定将你所列入严重失信主体名单，有关事项如下：\n依照《中华人民共和国注册会计师法》等法律规定，财政部组织检查组对你所执业质量等情况开展了检查，认定你所在多个审计项目中，存在出具虚假审计报告等严重违法问题。2025年1月，财政部对你所作出行政处罚决定，给予你所警告、没收违法所得47,900元并处罚款239,500元、吊销执业许可的行政处罚。\n依据《办法》第四条第（五）项的规定，财政部决定将你所列入注册会计师行业严重失信主体名单，实施联合惩戒。依据《办法》第十条第二款的规定，列入期限为五年。\n依据《办法》第九条的规定，除依照法律、行政法规规定应当实施的从业限制等管理措施外，财政部还将实施下列管理措施：（一）列为重点监管对象，适当提高抽查的比例和频次，依法严格监管；（二）不适用告知承诺制；（三）不予授予财政部门荣誉称号等表彰奖励。\n依据《办法》第十二条的规定，当事人被列入严重失信主体名单满一年后，符合相关条件的，可以依照《办法》规定向财政部申请提前移出。\n依据《办法》第十七条的规定，如有证据证明公示信息不准确，可以要求财政部进行更正。\n如不服本决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本决定不停止执行。\n财  政  部\n2025年8月18日"}, {"source": "国家税务局", "category": "留言咨询", "title": "我们企业买了一套二手房，想问一下，该如何计提折旧？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5242302/content.html", "date": "2025-08-13", "id": "f866b9455982bb7cbb026ddbc587170a", "content": "答：\n通俗理解，计提折旧就是企业将固定资产在使用过程中逐渐损耗的价值，按一定方法分摊到其预计使用寿命内的会计处理过程。根据《中华人民共和国企业所得税法实施条例》（中华人民共和国国务院令第512号）的规定，房屋、建筑物固定资产计算折旧的最低年限为20年。\n企业外购的固定资产，以购买价款和支付的相关税费以及直接归属于使该资产达到预定用途发生的其他支出为计税基础。固定资产按照直线法计算的折旧，准予扣除。企业应当自固定资产投入使用月份的次月起计算折旧；停止使用的固定资产，应当自停止使用月份的次月起停止计算折\n旧。\n企业应当根据固定资产的性质和使用情况，合理确定固定资产的预计净残值。固定资产的预计净残值一经确定，不得变更。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我家里亲戚有闲置的房子计划开一家共享茶室，听说个体工商户可以享受减半征收个人所得税优惠，有什么条件要求吗？如果继续开新店，要怎么享受这项政策？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5241868/content.html", "date": "2025-07-16", "id": "99897fe2992249c919dedfa698e202c7", "content": "答：\n根据《国家税务总局关于进一步落实支持个体工商户发展个人所得税优惠政策有关事项的公告》（国家税务总局公告2023年第12号）规定：对个体工商户应纳税所得额不超过200万元的部分，减半征收个人所得税。个体工商户在享受现行其他个人所得税优惠政策的基础上，可叠加享受本条优惠政策。个体工商户不区分征收方式，均可享受。\n如果您亲戚的茶室开了新店，就属于个体工商户从两处以上取得经营所得，需在办理年度汇总纳税申报时，合并计算个体工商户经营所得年应纳税所得额，重新计算减免税额，多退少补。"}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第二十四号）", "url": "https://www.cicpa.org.cn/xxfb/tzgg/202507/t20250701_65502.html", "date": "2025-07-01", "id": "49109b80e4f9d86eddaf3d16bc781bda", "content": "为贯彻落实《中共中央办公厅\n国务院办公厅印发\n<关于进一步加强财会监督工作的意见>的通知》、《国务院办公厅关于进一步规范财务审计秩序\n促进注册会计师行业健康发展的意见》（国办发〔\n2021\n〕\n30\n号）等文件精神，根据《会计师事务所执业质量检查制度》（会协〔\n2011\n〕\n39\n号），\n20\n24\n年，按照财会监督专项行动和注册会计师行业\n“执业监督提质年”主题活动的部署安排，中国注册会计师协会（以下简称中注协）\n联合\n财政部监督评价局\n，\n组织相关人员与财政部监管局组\n建\n检查组，对备案从事证券服务业务的会计师事务所进行执业质量检查；组织\n各省、自治区、直辖市\n及深圳\n市\n注册会计师协会（以下简称地方注协）\n，联合地方财政部门，对本区域内的会计师事务所开展执业质量检查。现将有关情况公告如下。\n一、总体情况\n截至\n202\n3\n年\n底\n，全国共有\n会计师\n事务所\n10665\n家（总所\n9305\n家，分所\n1360\n家）\n。\n2024年，\n中注协与地方注协共对\n2226家会计师事务所开展执业质量检查。截至目前，中注协及地方注协共\n对存在违规问题的\n343\n家\n会计师\n事务所和\n784\n名注册会计师实施了行业惩戒及自律监管措施。其中，对\n67\n家\n会计师\n事务所和\n209\n名注册会计师\n予以\n公开谴责；对\n78\n家\n会计师\n事务所和\n204\n名注册会计师\n予以\n通报批评；对\n56\n家\n会计师\n事务所和\n179\n名注册会计师\n予以\n训诫\n；\n对其他\n142\n家\n会计师\n事务所和\n192\n名注册会计师采取约谈\n、责令整改\n等\n自律\n监管措施。\n二、\n典型案例\n（\n一\n）\n北京亚泰国际会计师事务所（特殊普通合伙）\n（\n现\n北京亚泰国际会计师事务所（普通合伙）\n）\n质量管理体系在设计和运行方面存在重大缺陷，不能合理保证会计师事务所及注册会计师执业行为在所有重大方面符合质量管理相关规定以及职业道德守则和业务准则的要求\n。该所多个审计项目未\n严格执行执业准则，未保持应有的职业怀疑，应收账款、存货、商誉、长期股权投资、无形资产、投资性房地产、资本公积、营业收入、营业成本、销售费用、政府补助、合并范围等重要科目或事项审计程序执行不到位，未获取充分、适当的审计证据，形成的审计结论不恰当。中注协对该所及注册会计师\n田梦珺、莫卫武、徐成光、周宛飞、张显玉、郑运霞、张明、胡志勇、赵雅楠、程程\n给予公开谴责的行业惩戒。\n（\n二\n）\n北京中名国成会计师事务所（特殊普通合伙）\n上海自贸试验区分所\n在相关注册会计师不知情的情况下，\n使用软件在鉴证报告上拼贴注册会计师\n印\n章及个人签名图片，冒用\n注册会计师\n名义出具\n99\n份鉴证报告。同时，该所部分审计项目存在未编制总体审计策略、具体审计计划，未恰当实施风险评估程序，应收账款、长期股权投资、应付账款、短期借款、营业收入、营业成本、研发费用等重要科目审计程序执行不到位，未见期初余额、期后事项、或有负债等事项相关审计工作底稿等情况。上海市注册会计师协会\n对\n该\n所及注册会计师潘湘成、贾海亮、陈平\n给予\n公开谴责\n的行业惩戒\n。\n（\n三\n）\n竹溪精诚联合会计师事务所（普通合伙）\n未按要求\n建\n立质量管理体系。\n该所仅有两名执业人员（合伙人），\n在注册会计师行业统一监管平台报备\n230份审计报告，报备数量与\n自查报告业务清单\n数量（\n21份）完全不符，隐瞒的年报审计\n项目\n均\n无审计\n工作\n底稿。\n同时，该所部分审计项目存在业务约定书、管理层声明书无被审计单位盖章；部分科目仅编制了明细表，未执行其他审计程序；\n项目复核流程流于形式，无实质性复核记录等情况。\n湖北省注册会计师协会\n对\n该所\n及首席合伙人\n刘义华\n给予\n公开谴责\n的行业惩戒。\n（\n四\n）\n河南众兴联合会计师事务所\n（\n普通合伙\n）\n部分审计项目未编制审计工作底稿即出具了审计报告\n。部分审计项目未执行风险评估程序，\n未确定重要性水平，未编制具体审计计划，\n重要科目实质性审计程序缺失，银行存款及应收账款未执行函证程序且未说明理由，\n未执行替代测试，存货、固定资产科目未实施监盘，营业收入、营业成本科目未实施实质性审计程序，业务复核流于形式\n等。河南省注册会计师协会对该所及执行合伙人李忠义、注册会计师郭悦俊给予公开谴责的行业惩戒。\n（\n五\n）\n湖北鹏信会计师事务所（普通合伙）\n存在非注册会计师实际控制\n，\n通过与咨询公司\n合作出具\n鉴证\n报告并分享业务收入，\n审计\n项目分类不准确、未\n按规定\n报备，\n审计\n报告文号跳号、重号\n等情况\n。\n同时，该所部分审计项目\n未设定重要性水平，银行存款未执行函证程序，应收账款、存货、营业收入、营业成本、管理费用等重要科目仅见审定表，无\n其他审计工作底稿。\n湖北省注册会计师协会\n对\n该所\n及首席合伙人耿昌敬\n给予\n公开谴责\n的行业惩戒。\n（\n六\n）\n云南中韬龙和会计师事务所（普通合伙）\n存在\n为\n获得客户支付业务介绍费\n的情况\n。\n该所质量管理体系未设计和实施风险评估程序，执行业务承接与保持的时间晚于业务约定书的签订日期，合伙人与普通员工晋升制度未体现以质量为导向。部分审计项目主营业务收入、货币资金、应收账款、预收账款、管理费用等重要科目审计程序执行不到位，\n审计报告意见类型不恰当。云南省注册会计师协会对\n该所及注册会计师\n刘蕾、\n龙寿娟给予公开谴责的行业惩戒。\n（\n七\n）\n北京厚德会计师事务所（特殊普通合伙）\n违反职业道德要求，对外发放宣传单，宣传内容包含\n“合作伙伴分成比例1:9”、“报告出具快、回款快”等内容。该所存在部分审计项目未合理执行控制测试，未记录函证控制过程，审计工作底稿复核记录日期晚于审计报告日，将被审计客户给其他会计师事务所的回函修改为该所回函等情况。北京注册会计师协会对该所及首席合伙人谢付生\n，\n注册会计师王瑞、王永平、杨松给予公开谴责的行业惩戒。\n（\n八\n）\n广东华杏会计师事务所（普通合伙）\n在执业质量检查期间，未按照检查工作要求提供相关资料，未配合检查工作。\n经查，该所还存在相关注册会计师未实际参与审计工作即出具审计报告的情况\n。\n深圳市注册会计师协会对该所\n及注册会计师高君盼、李娟给予\n公开谴责的行业惩戒。\n（\n九\n）\n广东广正会计师事务所（普通合伙）\n未按照质量管理准则要求修订和完善质量管理制度，已制定的相关制度与该所实际情况不符，形同虚设。该所公章以及有关注册会计师签字章由其他单位人员保管，相关注册会计师对签字章的使用情况不了解。该所部分审计项目还存在初步业务活动、风险评估程序流于形式，未实施银行存款、应收账款函证程序，且未说明不函证的理由，未实施存货、固定资产监盘程序，短期借款、营业收入、营业成本、管理费用、销售费用等重要科目审计程序执行不到位，项目复核流于形式，未按规定时间完成审计工作底稿归档等情况。广东省\n注册会计师协会对该所及\n首席合伙人张义荣\n，\n注册会计师赖成功、曹平给予\n公开谴责的行业惩戒。\n各会计师事务所\n要\n恪守职业道德，遵守执业准则，聚焦提升审计质量，守住诚信操守底线，筑牢法律法规红线，独立、客观、公正、规范执业，切实发挥执业监督作用，更好服务中国式现代化建设。"}, {"source": "国家税务局", "category": "留言咨询", "title": "年度中间符合小型微利企业条件的，可以享受小型微利企业企业所得税优惠政策吗？如果可以，之前多预缴的税款如何处理？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5241196/content.html", "date": "2025-06-20", "id": "2cbb612948b75aadc91eb90289d13d94", "content": "答：\n根据《关于落实小型微利企业所得税优惠政策征管问题的公告》（国家税务总局公告2023年第6号）第五条规定，原不符合小型微利企业条件的企业，在年度中间预缴企业所得税时，按照相关政策标准判断符合小型微利企业条件的，应按照截至本期预缴申报所属期末的累计情况，计算减免税额。当年度此前期间如因不符合小型微利企业条件而多预缴的企业所得税税款，可在以后季度应预缴的企业所得税税款中抵减。"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕163 号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202506/t20250627_3966731.htm", "date": "2025-06-03", "id": "46db9f6ca9f5064319b7c627bb10c195", "content": "财政部行政处罚决定书（财监法〔2025〕163 号）\n财监法〔2025〕163 号\n财政部行政处罚决定书\n当 事 人：周鑫校\n地    址：浙江省杭州市现代国际大厦A座16F\n依照《中华人民共和国会计法》的规定，财政部组织检查组于2024年对杭州金鱼电器集团有限公司会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n杭州金鱼电器集团有限公司2023年、2024年向不同的会计资料使用者提供编制依据不一致的财务会计报告、报表数据，同一年度相关财务会计报告、报表数据金额存在明显较大差异。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了2017年修正的《中华人民共和国会计法》第十三条第一款、第二十条第二款等规定。\n你作为杭州金鱼电器集团有限公司会计机构负责人，对上述问题负有责任。依据2017年修正的《中华人民共和国会计法》第四十二条第一款第（六）项规定，财政部决定给予你罚款8,000元的行政处罚。\n你应在收到本处罚决定书之日起十五日内与财政部浙江监管局联系，凭财政部浙江监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年6月3日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕162 号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202506/t20250627_3966730.htm", "date": "2025-06-03", "id": "9a9536861e370edf69cf596334a091cf", "content": "财政部行政处罚决定书（财监法〔2025〕162 号）\n财监法〔2025〕162 号\n财政部行政处罚决定书\n当 事 人：史新波\n地    址：浙江省杭州市现代国际大厦A座16F\n依照《中华人民共和国会计法》的规定，财政部组织检查组于2024年对杭州金鱼电器集团有限公司会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n杭州金鱼电器集团有限公司2023年、2024年向不同的会计资料使用者提供编制依据不一致的财务会计报告、报表数据，同一年度相关财务会计报告、报表数据金额存在明显较大差异。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了2017年修正的《中华人民共和国会计法》第十三条第一款、第二十条第二款等规定。\n你作为杭州金鱼电器集团有限公司的单位负责人，对上述问题负有责任。依据2017年修正的《中华人民共和国会计法》第四十二条第一款第（六）项规定，财政部决定给予你罚款8,000元的行政处罚。\n你应在收到本处罚决定书之日起十五日内与财政部浙江监管局联系，凭财政部浙江监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年6月3日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕161 号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202506/t20250627_3966729.htm", "date": "2025-06-03", "id": "94f87e6086e16dc26a930c1d8cbb5c98", "content": "财政部行政处罚决定书（财监法〔2025〕161 号）\n财监法〔2025〕161 号\n财政部行政处罚决定书\n当 事 人：杭州金鱼电器集团有限公司\n地    址：浙江省杭州市现代国际大厦A座16F\n依照《中华人民共和国会计法》的规定，财政部组织检查组于2024年对你公司会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n你公司2023年、2024年向不同的会计资料使用者提供编制依据不一致的财务会计报告、报表数据，同一年度相关财务会计报告、报表数据金额存在明显较大差异。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了2017年修正的《中华人民共和国会计法》第十三条第一款、第二十条第二款等规定。\n依据2017年修正的《中华人民共和国会计法》第四十二条第一款第（六）项规定，财政部决定给予你公司罚款5万元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部浙江监管局联系，凭财政部浙江监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年6月3日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕160 号 ）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202506/t20250627_3966728.htm", "date": "2025-06-03", "id": "119a84b723cdfc8c2ee90e4f2a98f155", "content": "财政部行政处罚决定书（财监法〔2025〕160 号 ）\n财监法〔2025〕160 号\n财政部行政处罚决定书\n当 事 人：郑文彪\n地    址：浙江省宁波市海曙区月湖街道和义路77号4-6\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对浙江德威会计师事务所（特殊普通合伙，以下称浙江德威）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、未履行必要的审计程序\n浙江德威于2024年4月30日出具杭州金鱼电器集团有限公司合并报表专项审计报告（德威杭专字〔2024〕0152号），报告数据引用其他会计师事务所出具的年度审计报告，浙江德威未对此获取充分适当的审计证据，未执行相应的审计程序。\n二、审计报告合并报表未获取充分适当的审计证据\n浙江德威于2024年4月30日出具的杭州金鱼电器集团有限公司合并报表专项审计报告（德威杭专字〔2024〕0152号），浙江德威未对明显不符合合并范围情况予以适当关注，未实施相应的审计程序。\n上述事实，有检查报告、当事人签证、反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款，《会计师事务所执业许可和监督管理办法》第六十条第一款第（一）（三）项，不符合《中国注册会计师审计准则第1301号——审计证据》第十条，《企业会计准则第33号--合并财务报表》第七条、第十三条等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款、《会计师事务所执业许可和监督管理办法》第七十条第一款的规定，财政部决定给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年6月3日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（ 财监法〔2025〕159 号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202506/t20250627_3966727.htm", "date": "2025-06-03", "id": "c64b5b7521240c8c93f63e9bd8625c05", "content": "财政部行政处罚决定书（ 财监法〔2025〕159 号）\n财监法〔2025〕159 号\n财政部行政处罚决定书\n当 事 人：王敏\n地    址：浙江省宁波市海曙区月湖街道和义路77号4-6\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对浙江德威会计师事务所（特殊普通合伙，以下称浙江德威）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、未履行必要的审计程序\n浙江德威于2023年4月26日出具杭州金鱼电器集团有限公司合并报表专项审计报告（德威杭专字〔2023〕0137号），报告数据引用其他会计师事务所出具的年度审计报告，浙江德威未对此获取充分适当的审计证据，未执行相应的审计程序。\n二、审计报告合并报表未获取充分适当的审计证据\n浙江德威于2023年4月26日出具的杭州金鱼电器集团有限公司合并报表专项审计报告（德威杭专字〔2023〕0137号），浙江德威未对明显不符合合并范围情况予以适当关注，未实施相应的审计程序。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款，《会计师事务所执业许可和监督管理办法》第六十条第一款第（一）（三）项，不符合《中国注册会计师审计准 行政处罚决定如下：\n一、未履行必要的审计程序\n（一）你所于2023年4月26日出具杭州金鱼电器集团有限公司合并报表专项审计报告（德威杭专字〔2023〕0137号），报告数据引用其他会计师事务所出具的年度审计报告，你所未对此获取充分适当的审计证据，未执行相应的审计程序。\n（二）你所于2024年4月30日出具杭州金鱼电器集团有限公司合并报表专项审计报告（德威杭专字〔2024〕0152号），报告数据引用其他会计师事务所出具的年度审计报告，你所未对此获取充分适当的审计证据，未执行相应的审计程序。\n二、审计报告合并报表未获取充分适当的审计证据\n（一）你所于2023年4月26日出具的杭州金鱼电器集团有限公司合并报表专项审计报告（德威杭专字〔2023〕0137号），你所未对明显不符合合并范围情况予以适当关注，未实施相应的审计程序。\n（二）你所于2024年4月30日出具的杭州金鱼电器集团有限公司合并报表专项审计报告（德威杭专字〔2024〕0152号），你所未对明显不符合合并范围情况予以适当关注，未实施相应的审计程序。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款，《会计师事务所执业许可和监督管理办法》第六十条第一款第（一）（三）项，不符合《中国注册会计师审计准则第1301号——审计证据》第十条，《企业会计准则第33号——合并财务报表》第七条、第十三条等有关规定。\n依据《中华人民共和国注册会计师法》第三十九条第一款、《会计师事务所执业许可和监督管理办法》第六十七条第一款的规定，财政部决定给予你所警告、没收违法所得6万元的行政处罚。\n你所应在收到本处罚决定书之日起十五日内与财政部宁波监管局联系，凭财政部宁波监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年6月3日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（ 财监法〔2025〕156 号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202506/t20250627_3966724.htm", "date": "2025-06-03", "id": "84c36654d6bf850d2873eb27405a454d", "content": "财政部行政处罚决定书（ 财监法〔2025〕156 号）\n财监法〔2025〕156 号\n财政部行政处罚决定书\n当 事 人：来嘉莹\n地    址：浙江省杭州市滨江区阡陌路聚光中心\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对浙江中会会计师事务所（特殊普通合伙，以下称浙江中会）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、未履行必要的审计程序\n（一）浙江中会于2023年4月22日出具杭州金鱼电器集团有限公司合并报表专项审计报告（中会会专〔2023〕第0504号），报告数据引用其他会计师事务所出具的年度审计报告，浙江中会未对此获取充分适当的审计证据，未执行相应的审计程序。\n（二）浙江中会于2024年4月30日出具杭州金鱼电器集团有限公司合并报表专项审计报告（中会会专〔2024〕第0509号），报告数据引用其他会计师事务所出具的年度审计报告，浙江中会未对此获取充分适当的审计证据，未执行相应的审计程序。\n二、审计报告合并报表未获取充分适当的审计证据\n（一）浙江中会于2023年4月22日出具的杭州金鱼电器集团有限公司合并报表专项审计报告（中会会专〔2023〕第0504号），浙江中会未对明显不符合合并范围情况予以适当关注，未实施相应的审计程序。\n（二）浙江中会于2024年4月30日出具的杭州金鱼电器集团有限公司合并报表专项审计报告（中会会专〔2024〕第0509号），浙江中会未对明显不符合合并范围情况予以适当关注，未实施相应的审计程序。\n三、审计意见类型不恰当\n浙江中会对杭州金鱼电器集团有限公司子公司鸿元国际（香港）有限公司2022年度财务报表执行专项审计工作时，杭州金鱼电器集团有限公司向杭州市人民政府国有资产监督管理委员会和浙江中会分别提供营业收入数据明显不一致的鸿元国际（香港）有限公司财务报表，浙江中会审计意见未对财务报表编制说明发表结论性意见，且未见财务报表是否“公允”的结论性意见。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款，《会计师事务所执业许可和监督管理办法》第六十条第一款第（一）（三）项，不符合《中国注册会计师审计准则第1301号——审计证据》第十条，《企业会计准则第33号--合并财务报表》第七条、第十三条，《中国注册会计师审计准则第1501号——对财务报表形成审计意见和出具审计报告》第十一条第一款、第十四条第一款第（二）项、第十五条第一款等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款、《会计师事务所执业许可和监督管理办法》第七十条第一款的规定，财政部决定给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年6月3日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕155 号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202506/t20250627_3966723.htm", "date": "2025-06-03", "id": "dda0ea6c6cc1bca51d79d47166e1cafa", "content": "财政部行政处罚决定书（财监法〔2025〕155 号）\n财监法〔2025〕155 号\n财政部行政处罚决定书\n当 事 人：蔡顺荣\n地    址：浙江省杭州市滨江区阡陌路聚光中心\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对浙江中会会计师事务所（特殊普通合伙，以下称浙江中会）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、未履行必要的审计程序\n（一）浙江中会于2023年4月22日出具杭州金鱼电器集团有限公司合并报表专项审计报告（中会会专〔2023〕第0504号），报告数据引用其他会计师事务所出具的年度审计报告，浙江中会未对此获取充分适当的审计证据，未执行相应的审计程序。\n（二）浙江中会于2024年4月30日出具杭州金鱼电器集团有限公司合并报表专项审计报告（中会会专〔2024〕第0509号），报告数据引用其他会计师事务所出具的年度审计报告，浙江中会未对此获取充分适当的审计证据，未执行相应的审计程序。\n二、审计报告合并报表未获取充分适当的审计证据\n（一）浙江中会于2023年4月22日出具的杭州金鱼电器集团有限公司合并报表专项审计报告（中会会专〔2023〕第0504号），浙江中会未对明显不符合合并范围情况予以适当关注，未实施相应的审计程序。\n（二）浙江中会于2024年4月30日出具的杭州金鱼电器集团有限公司合并报表专项审计报告（中会会专〔2024〕第0509号），浙江中会未对明显不符合合并范围情况予以适当关注，未实施相应的审计程序。\n三、审计意见类型不恰当\n浙江中会对杭州金鱼电器集团有限公司子公司鸿元国际（香港）有限公司2022年度财务报表执行专项审计工作时，杭州金鱼电器集团有限公司向杭州市人民政府国有资产监督管理委员会和浙江中会分别提供营业收入数据明显不一致的鸿元国际（香港）有限公司财务报表，浙江中会审计意见未对财务报表编制说明发表结论性意见，且未见财务报表是否“公允”的结论性意见。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、《会计师事务所执业许可和监督管理办法》第六十条第一款第（一）（三）项，不符合《中国注册会计师审计准则第1301号——审计证据》第十条，《企业会计准则第33号--合并财务报表》第七条、第十三条，《中国注册会计师审计准则第1501号——对财务报表形成审计意见和出具审计报告》第十一条第一款、第十四条第一款第（二）项、第十五条第一款等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款、《会计师事务所执业许可和监督管理办法》第七十条第一款的规定，财政部决定给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年6月3日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕154 号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202506/t20250627_3966722.htm", "date": "2025-06-03", "id": "5bcebf11b396c27bfb6e49694906ccd4", "content": "财政部行政处罚决定书（财监法〔2025〕154 号）\n财监法〔2025〕154 号\n财政部行政处罚决定书\n当 事 人：浙江中会会计师事务所（特殊普通合伙）\n地    址：浙江省杭州市滨江区阡陌路聚光中心\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对你所执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、未履行必要的审计程序\n（一）你所于2023年4月22日出具杭州金鱼电器集团有限公司合并报表专项审计报告（中会会专〔2023〕第0504号），报告数据引用其他会计师事务所出具的年度审计报告，你所未对此获取充分适当的审计证据，未执行相应的审计程序。\n（二）你所于2024年4月30日出具杭州金鱼电器集团有限公司合并报表专项审计报告（中会会专〔2024〕第0509号），报告数据引用其他会计师事务所出具的年度审计报告，你所未对此获取充分适当的审计证据，未执行相应的审计程序。\n二、审计报告合并报表未获取充分适当的审计证据\n（一）你所于2023年4月22日出具的杭州金鱼电器集团有限公司合并报表专项审计报告（中会会专〔2023〕第0504号），你所未对明显不符合合并范围情况予以适当关注，未实施相应的审计程序。\n（二）你所于2024年4月30日出具的杭州金鱼电器集团有限公司合并报表专项审计报告（中会会专〔2024〕第0509号），你所未对明显不符合合并范围情况予以适当关注，未实施相应的审计程序。\n三、审计意见类型不恰当\n你所对杭州金鱼电器集团有限公司子公司鸿元国际（香港）有限公司2022年度财务报表执行专项审计工作时，杭州金鱼电器集团有限公司向杭州市人民政府国有资产监督管理委员会和你所分别提供营业收入数据明显不一致的鸿元国际（香港）有限公司财务报表，你所审计意见未对财务报表编制说明发表结论性意见，且未见财务报表是否“公允”的结论性意见。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款，《会计师事务所执业许可和监督管理办法》第六十条第一款第（一）（三）项，不符合《中国注册会计师审计准则第1301号——审计证据》第十条，《企业会计准则第33号--合并财务报表》第七条、第十三条，《中国注册会计师审计准则第1501号——对财务报表形成审计意见和出具审计报告》第十一条第一款、第十四条第一款第（二）项、第十五条第一款等有关规定。\n依据《中华人民共和国注册会计师法》第三十九条第一款、《会计师事务所执业许可和监督管理办法》第六十七条第一款的规定，财政部决定给予你所警告、没收违法所得85,000元，并处违法所得一倍罚款85,000元的行政处罚。\n你所应在收到本处罚决定书之日起十五日内与财政部浙江监管局联系，凭财政部浙江监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年6月3日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕153 号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202506/t20250627_3966719.htm", "date": "2025-06-03", "id": "079c6ae0ddee431bdb72571d266f1bc6", "content": "财政部行政处罚决定书（财监法〔2025〕153 号）\n财监法〔2025〕153 号\n财政部行政处罚决定书\n当 事 人：柳习科\n地    址：江西省南昌市东湖区洪都北大道636号西格玛商务中心12层\n依照《中华人民共和国会计法》的规定，财政部组织检查组于2024年对江西华章汉辰融资担保集团股份有限公司（以下称江西华章）会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n江西华章2024年向不同的会计资料使用者提供编制依据不一致的财务会计报告，同一年度两份财务会计报告载有的负债、所有者权益、收入、成本、净利润等方面的金额存在较大差异。\n江西华章担保赔偿准备金和未到期责任准备金的会计处理依据错误，2023年多计其他业务收入57,168.35万元，多计担保赔偿准备金、未到期责任准备金支出合计57,168.35万元。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了2017年修正的《中华人民共和国会计法》第九条第一款、第二款、第二十条第二款、第二十五条、第二十六条第一款第（二）（三）项，不符合《企业会计准则——基本准则》第十条、第十二条等规定。\n你作为江西华章的主管会计工作负责人，对上述问题负有责任。依据2017年修正的《中华人民共和国会计法》第四十二条第一款第（四）（六）项的规定，财政部决定给予你罚款8,000元的行政处罚。\n你应在收到本处罚决定书之日起十五日内与财政部江西监管局联系，凭财政部江西监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年6月3日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕152 号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202506/t20250627_3966718.htm", "date": "2025-06-03", "id": "8924d09e62f2709fd4efb68a7ec2d2a1", "content": "财政部行政处罚决定书（财监法〔2025〕152 号）\n财监法〔2025〕152 号\n财政部行政处罚决定书\n当 事 人：彭新亮\n地    址：江西省南昌市东湖区洪都北大道636号西格玛商务中心12层\n依照《中华人民共和国会计法》的规定，财政部组织检查组于2024年对江西华章汉辰融资担保集团股份有限公司（以下称江西华章）会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n江西华章2024年向不同的会计资料使用者提供编制依据不一致的财务会计报告，同一年度两份财务会计报告载有的负债、所有者权益、收入、成本、净利润等方面的金额存在较大差异。\n江西华章担保赔偿准备金和未到期责任准备金的会计处理依据错误，2023年多计其他业务收入57,168.35万元，多计担保赔偿准备金、未到期责任准备金支出合计57,168.35万元。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了2017年修正的《中华人民共和国会计法》第九条第一款、第二款、第二十条第二款、第二十五条，第二十六条第（二）（三）项，不符合《企业会计准则——基本准则》第十条、第十二条等规定。\n你作为江西华章的单位负责人，对上述问题负有责任。依据2017年修正的《中华人民共和国会计法》第四十二条第一款第（四）（六）项的规定，财政部决定给予你罚款8,000元的行政处罚。\n你应在收到本处罚决定书之日起十五日内与财政部江西监管局联系，凭财政部江西监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年6月3日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕151 号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202506/t20250627_3966716.htm", "date": "2025-06-03", "id": "92e364fae5f9aeafefdd21d90f061f3d", "content": "财政部行政处罚决定书（财监法〔2025〕151 号）\n财监法〔2025〕151 号\n财政部行政处罚决定书\n当 事 人：江西华章汉辰融资担保集团股份有限公司\n地    址：江西省南昌市东湖区洪都北大道636号西格玛商务中心12层\n依照《中华人民共和国会计法》的规定，财政部组织检查组于2024年对你公司会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n你公司2024年向不同的会计资料使用者提供编制依据不一致的财务会计报告，同一年度两份财务会计报告载有的负债、所有者权益、收入、成本、净利润等方面的金额存在较大差异。\n你公司担保赔偿准备金和未到期责任准备金的会计处理依据错误，2023年多计其他业务收入57,168.35万元，多计担保赔偿准备金、未到期责任准备金支出合计57,168.35万元。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了2017年修正的《中华人民共和国会计法》第九条第一款、第二款、第二十条第二款、第二十五条、第二十六条第（二）（三）项，不符合《企业会计准则——基本准则》第十条、第十二条等规定。\n依据2017年修正的《中华人民共和国会计法》第四十二条第一款第（四）（六）项的规定，财政部决定给予你公司罚款5万元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部江西监管局联系，凭财政部江西监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年6月3日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕150 号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202506/t20250627_3966714.htm", "date": "2025-06-03", "id": "4d41dd517b9fdef4fdbefe982309a875", "content": "财政部行政处罚决定书（财监法〔2025〕150 号）\n财监法〔2025〕150 号\n财政部行政处罚决定书\n当 事 人：魏道静\n地    址：湖南省长沙市岳麓区林语路239号长沙顺畅高新产业园3楼\n依照《中华人民共和国会计法》的规定，财政部组织检查组于2024年对湖南湘投轻材科技股份有限公司（以下称湘投轻材）会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n湘投轻材2023年度伪造向克诺尔车辆设备（苏州）有限公司销售轨交制动盘K1产品的货运单、销售出库单和装箱单等单据，虚构轨交制动盘销售交易，导致2023年度财务报表虚增应收账款1,225.49万元、营业收入1,084.51万元、应交税金140.99万元、营业成本812.27万元、利润总额272.24万元，虚减存货812.27万元。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了2017年修正的《中华人民共和国会计法》第九条第一款、第二款，第十三条第一款、第三款，第二十六条第（一）（二）（三）（四）项，不符合《企业会计准则——基本准则》第十二条等规定。\n你作为湘投轻材会计机构负责人，对上述问题负有责任。依据2017年修正的《中华人民共和国会计法》第四十三条第一款、第二款的规定，财政部决定给予你罚款1万元的行政处罚。\n你应在收到本处罚决定书之日起十五日内与财政部湖南监管局联系，凭财政部湖南监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年6月3日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕149 号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202506/t20250627_3966712.htm", "date": "2025-06-03", "id": "f948ad2079cf14d978f6fb2923606bc2", "content": "财政部行政处罚决定书（财监法〔2025〕149 号）\n财监法〔2025〕149 号\n财政部行政处罚决定书\n当 事 人：蒋兆汝\n地    址：湖南省长沙市岳麓区林语路239号长沙顺畅高新产业园3楼\n依照《中华人民共和国会计法》的规定，财政部组织检查组于2024年对湖南湘投轻材科技股份有限公司（以下称湘投轻材）会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n湘投轻材2023年度伪造向克诺尔车辆设备（苏州）有限公司销售轨交制动盘K1产品的货运单、销售出库单和装箱单等单据，虚构轨交制动盘销售交易，导致2023年度财务报表虚增应收账款1,225.49万元、营业收入1,084.51万元、应交税金140.99万元、营业成本812.27万元、利润总额272.24万元，虚减存货812.27万元。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了2017年修正的《中华人民共和国会计法》第九条第一款、第二款、第十三条第一款、第三款、第二十六条第（一）（二）（三）（四）项，不符合《企业会计准则——基本准则》第十二条等规定。\n你作为湘投轻材的单位负责人，对上述问题负有责任。依据2017年修正的《中华人民共和国会计法》第四十三条第一款、第二款的规定，财政部决定给予你罚款2万元的行政处罚。\n你应在收到本处罚决定书之日起十五日内与财政部湖南监管局联系，凭财政部湖南监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年6月3日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕148 号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202506/t20250627_3966710.htm", "date": "2025-06-03", "id": "984110631f3f262a9c5446ee0b5aa890", "content": "财政部行政处罚决定书（财监法〔2025〕148 号）\n财监法〔2025〕148 号\n财政部行政处罚决定书\n当 事 人：湖南湘投轻材科技股份有限公司\n地    址：湖南省长沙市岳麓区林语路239号长沙顺畅高新产业园3楼\n依照《中华人民共和国会计法》的规定，财政部组织检查组于2024年对你公司会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n你公司2023年度伪造向克诺尔车辆设备（苏州）有限公司销售轨交制动盘K1产品的货运单、销售出库单和装箱单等单据，虚构轨交制动盘销售交易，导致2023年度财务报表虚增应收账款1,225.49万元、营业收入1,084.51万元、应交税金140.99万元、营业成本812.27万元、利润总额272.24万元，虚减存货812.27万元。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了2017年修正的《中华人民共和国会计法》第九条第一款、第二款、第十三条第一款、第三款、第二十六条第（一）（二）（三）（四）项，不符合《企业会计准则——基本准则》第十二条等规定。\n依据2017年修正的《中华人民共和国会计法》第四十三条第一款、第二款的规定，财政部决定给予你公司罚款8万元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部湖南监管局联系，凭财政部湖南监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年6月3日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕147 号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202506/t20250627_3966707.htm", "date": "2025-06-03", "id": "3153c197ec3b2ff9ae3cfa2a6f54f2cc", "content": "财政部行政处罚决定书（财监法〔2025〕147 号）\n财监法〔2025〕147 号\n财政部行政处罚决定书\n当 事 人：华创易通（福建）科技有限公司\n地    址：福建省福州市台江区鳌峰街道福光南路379号武夷绿洲23#楼2层01商铺2102室\n依照《中华人民共和国会计法》的规定，财政部组织检查组于2024年对你公司会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n你公司编制虚假验收单，虚构对中移建设有限公司广东分公司的短信服务采购业务，导致2022年度、2023年度虚增营业成本分别为21,441.51万元、6,860.38万元。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了2017年修正的《中华人民共和国会计法》第九条第一款、第二款、第十三条第三款、第二十五条、第二十六条第（一）（三）项，不符合《企业会计准则——基本准则》第十二条等规定。\n依据2017年修正的《中华人民共和国会计法》第四十三条第一款、第二款的规定，财政部决定给予你公司罚款5万元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部福建监管局联系，凭财政部福建监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年6月3日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕146 号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202506/t20250627_3966706.htm", "date": "2025-06-03", "id": "4e1313c9b99d95a67bbebf965fa2b3ec", "content": "财政部行政处罚决定书（财监法〔2025〕146 号）\n财监法〔2025〕146 号\n财政部行政处罚决定书\n当 事 人：福州缘笙科技有限公司\n地    址：福建省福州市台江区鳌峰街道鳌峰路50号鳌峰街道安置房1#楼二层2182室\n依照《中华人民共和国会计法》的规定，财政部组织检查组于2024年对你公司会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n一、编制虚假验收单，虚增短信服务业务收入\n你公司编制虚假验收单，虚构对佛山信云网科技有限公司的短信服务业务，导致2022年虚增度营业收入27,738.68万元。\n二、虚构采购业务，虚增2022年末预付账款\n2022年12月，你公司向福州市森讯通信技术有限公司（以下称福州森讯）采购服务器，合同金额81,204.88万元。合同约定你公司委托关联方上海紫赏广告传媒有限公司（以下称上海紫赏）分别向福州森讯的股东福州墨森网络科技有限公司、福州腾昌信息科技有限公司预付服务器采购款项；上海紫赏向上述两家公司预付的款项，于当日转回至上海紫赏账户，你公司未冲减确认的预付账款81,204.88万元。2023年4月，你公司依据与福建省海峡星云信息科技有限公司（以下称海峡星云）签订的《买卖框架协议》，在未向海峡星云付款的情况下，将前述81,204.88万元服务器采购预付款，调整为2022年12月31日对海峡星云的预付账款，导致2022年末虚增预付账款81,204.88万元。\n三、编制虚假货物签收和入库资料，虚增2023年末存货\n2023年，你公司与海峡星云签订的《买卖框架协议》和《销售协议》均未实际执行，海峡星云未向你公司供应任何服务器，你公司编制虚假货物签收和入库资料，导致2023年末虚增存货71,862.73万元。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了2017年修正的《中华人民共和国会计法》第九条第一款、第二款、第十三条第三款、第二十五条、第二十六条第（一）（二）项，不符合《企业会计准则——基本准则》第十二条，《企业会计准则第14号——收入》第四条、第五条第一款第（一）（二）（三）（四）（五）项，《企业会计准则第29号——资产负债表日后事项》第六条等规定。\n依据2017年修正的《中华人民共和国会计法》第四十三条第一款、第二款的规定，财政部决定给予你公司罚款8万元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部福建监管局联系，凭财政部福建监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年6月3日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕145 号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202506/t20250627_3966705.htm", "date": "2025-06-03", "id": "8072bd6ec5399df27cc82113217693e4", "content": "财政部行政处罚决定书（财监法〔2025〕145 号）\n财监法〔2025〕145 号\n财政部行政处罚决定书\n当 事 人：杭州亿家晶视传媒有限公司\n地    址：浙江省杭州市余杭区中泰街道环园北路16号1幢101-6\n依照《中华人民共和国会计法》的规定，财政部组织检查组于2024年对你公司会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n你公司编制虚假合同及虚假验收单，虚构对广东粤信智能科技有限公司的短信服务业务，导致2022年度虚增营业收入27,279.06万元。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了2017年修正的《中华人民共和国会计法》第九条第一款、第二款、第十三条第三款、第二十五条、第二十六条第（一）（二）项，不符合《企业会计准则——基本准则》第十二条，《企业会计准则第14号——收入》第四条、第五条第一款第（一）（二）（三）（四）（五）项等规定。\n依据2017年修正的《中华人民共和国会计法》第四十三条第一款、第二款的规定，财政部决定给予你公司罚款5万元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部浙江监管局联系，凭财政部浙江监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年6月3日"}, {"source": "国家税务局", "category": "留言咨询", "title": "我是甲企业法定代表人，甲企业因管理不善纳税信用被评为D级，为何我名下注册登记的乙企业也被评为D级，该怎么办呢？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5240871/content.html", "date": "2025-05-30", "id": "1e47a45ef41652d3b03b5a3aa8005f0e", "content": "答：\n乙企业是被关联评价为D级了。根据《国家税务总局关于发布〈纳税信用管理办法(试行)〉的公告》（国家税务总局公告2014年第40号）第三十二条第一项规定，公开D级纳税人及其直接责任人员名单，对直接责任人员注册登记或者负责经营的其他纳税人纳税信用直接判为D级。\n如果甲企业纳税信用修复后纳税信用等级不再为D级，乙企业可向主管税务机关申请解除纳税信用D级关联，税务机关依据纳税人申请重新评价纳税信用级别。如果甲企业未申请修复或修复后纳税信用级别仍为D级，乙企业则需要在申请前连续6个月没有新增纳税信用失信行为记录，才可向主管税务机关申请纳税信用修复，税务机关依据纳税人申请重新评价纳税信用级别。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司在预缴时享受了小型微利企业所得税优惠，汇算清缴时发现不符合小型微利企业条件的怎么办？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5240479/content.html", "date": "2025-05-16", "id": "2190eafb3c965c98d970be0771a852b2", "content": "答：\n您说的这种情况，应当按规定补缴企业所得税税款。\n按照政策规定，2023年到2027年，我国对小型微利企业减按25%计算应纳税所得额，按20%的税率缴纳企业所得税，实际税负率仅有5%。\n享受这一优惠的小型微利企业，是指从事国家非限制和禁止行业，且同时符合年度应纳税所得额不超过300万元、从业人数不超过300人、资产总额不超过5000万元等条件的企业。\n按照《国家税务总局关于落实小型微利企业所得税优惠政策征管问题的公告》（国家税务总局公告2023年第6号）规定，小型微利企业预缴企业所得税时，从业人数、资产总额、年度应纳税所得额指标，暂按当年度截至本期预缴申报所属期末的情况进行判断。\n也就是说，在预缴时，只要符合小型微利企业条件的，都可以先享受相关优惠政策。但在年度汇算清缴时发现不符合相关政策标准的，就要按规定补缴企业所得税税款。"}, {"source": "国家税务局", "category": "留言咨询", "title": "某纳税人2019年4月购进不动产，取得增值税专用发票并已认证，金额1000万元，税额90万元，应当如何填写增值税纳税申报表？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5239884/content.html", "date": "2025-04-18", "id": "daeb6b5cfe0a9ab1da733e49833c95d9", "content": "答：\n《财政部 税务总局 海关总署关于深化增值税改革有关政策的公告》（财政部 税务总局 海关总署公告2019年第39号）第五条规定，自2019年4月1日起，纳税人取得不动产或者不动产在建工程的进项税额不再分2年抵扣。该纳税人在办理2019年4月税款所属期纳税申报时，应将购入不动产取得的增值税专用发票份数，以及专用发票上注明的金额、税额填入《增值税纳税申报表附列资料（二）》第2行“其中：本期认证相符且本期申报抵扣”的对应栏次；同时，还需将上述内容填入本表第9行“（三）本期用于购建不动产的扣税凭证”的对应栏次。"}, {"source": "国家税务局", "category": "留言咨询", "title": "增值税一般纳税人购进国内旅客运输服务取得航空运输电子客票行程单的，如何计算进项税额？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5239249/content.html", "date": "2025-03-27", "id": "b2a5a6113e4db06e90b661d11a3605b0", "content": "答：\n取得注明旅客身份信息的航空运输电子客票行程单的，按照下列公式计算进项税额：航空旅客运输进项税额＝（票价+燃油附加费）÷（1+9%）×9%。"}, {"source": "国家税务局", "category": "留言咨询", "title": "E公司因员工出差计划取消，支付给航空代理公司退票费，并取得了6%税率的增值税专用发票。E公司可以抵扣该笔进项税额吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5238681/content.html", "date": "2025-03-03", "id": "6916a6bf27b086f01ede78794d0183d6", "content": "答：\n按照现行政策规定，航空代理公司收取的退票费，属于现代服务业的征税范围，应按照6%税率计算缴纳增值税。E公司因公务支付的退票费，属于可抵扣的进项税范围，其增值税专用发票上注明的税额，可以从销项税额中抵扣。"}, {"source": "国家税务局", "category": "留言咨询", "title": "纳税人购进国内旅客运输服务，取得增值税专用发票，按规定可抵扣的进项税额怎么申报？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5238284/content.html", "date": "2025-02-10", "id": "13f7dfbe1d3e29bbe46dbd71ab890fbc", "content": "答：\n纳税人购进国内旅客运输服务，取得增值税专用发票，按规定可抵扣的进项税额，在申报时填写在《增值税纳税申报表附列资料（二）》“（一）认证相符的增值税专用发票”对应栏次中。"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕21号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260428_3988666.htm", "date": "2025-01-23", "id": "30d9cf2222365f6442f434005d813c8b", "content": "财政部行政处罚决定书（财监法〔2025〕21号）\n财\n监法\n〔\n202\n5\n〕\n21\n号\n财政部行政处罚\n决定\n书\n当 事 人：\n严波\n地    址：\n北京市大兴区\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于\n2023\n年对深圳文本会计师事务所（普通合伙）（以下称深圳文本）执业质量等情况开展了检查。检查发现的有关问题和行政处罚决定如下：\n深圳市景鹏建设工程有限公司（以下称景鹏建设）\n2022\n年虚增营业收入\n665,222,853.81\n元，虚增比例为\n143.00%\n；虚增营业成本\n652,852,938.29\n元，虚增比例为\n161.96%\n；虚增管理费用\n6,779,833.36\n元，虚增比例为\n46.04%\n；虚减研发费用\n15,070,965.83\n元，虚减比例为\n100.00%\n；虚增所得税费用\n3,017,030.88\n元，虚增比例为\n93.83%\n；虚增净利润\n16,475,821.37\n元，虚增比例为\n80.46%\n；虚增应收账款\n130,015,708.83\n元，虚增比例为\n408.32%\n；虚减预付账款\n665,639,518.68\n元，虚减比例为\n95.51%\n；虚减其他应收款\n567,695,191.80\n元，虚减比例为\n88.39%\n；虚增存货\n135,403,351.90\n元，虚增比例为\n447.92%\n；虚增固定资产\n8,516,768.56\n元，虚增比例为\n519.22%\n；虚减应付账款\n296,538,653.18\n元，虚减比例为\n77.74%\n；虚减合同负债\n386,000,140.90\n元，虚减比例为\n100.00%\n；虚增应交税费\n8,726,999.47\n元，虚增比例为\n156.31%\n；虚减其他应付款\n368,411,491.10\n元，虚减比例为\n98.24%\n。深圳文本在景鹏建设\n2022\n年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n你将个人证件、材料等交予深圳文本且未采取有效的防范措施，对于深圳文本以你的名义执行业务、出具虚假审计报告的行为负有责任，相关行为违反《会计师事务所执业许可和监督管理办法》第六十一条第（四）项等规定。上述事实，有财政检查报告、相关当事人签证和反馈意见、听证笔录等相关证据予以证实。\n依据《会计师事务所执业许可和监督管理办法》第七十一条、《中华人民共和国行政处罚法》第三十二条第（二）项的规定，我部决定给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n5\n年\n1\n月\n23\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕22号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971717.htm", "date": "2025-01-23", "id": "8ac599d4ae88a242ebf850229cc2f199", "content": "财政部行政处罚决定书（财监法〔2025〕22号）\n财监法〔2025〕22号\n财政部行政处罚决定书\n当 事 人：张译元\n地      址：浙江省宁波市\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2023年对深圳市巨源立德会计师事务所（普通合伙）（以下称巨源立德）执业质量等情况开展了检查。检查发现的有关问题和行政处罚决定如下：\n一、在深圳可瑞高新材料股份有限公司（以下称可瑞高新）2022年财务报表审计报告中，未实施必要的审计程序，编造事由出具虚假审计报告\n可瑞高新2022年虚减期末应收票据9,163,858.51元，虚减比例为100%；虚增应收账款6,289,970.34元，虚增比例为94%；虚减预付账款11,633,331.15元，虚减比例为97%；虚减存货10,580,000.00元，虚减比例为58%；虚减应付账款7,603,331.15元，虚减比例为52%；虚减其他应付款9,895,829.74元，虚减比例为94%；虚减长期借款6,429,928.81元，虚减比例为43%；虚增2022年度营业收入17,000,000.00元，虚增比例为37%；虚增销售费用4,667,686.17元，虚增比例为513%；虚增管理费用5,658,451.11元，虚增比例为112%；虚增利润总额3,828,789.84元，虚增比例为279%；虚增净利润3,834,078.70元，虚增比例为280%。巨源立德在可瑞高新2022年财务报表审计中，未实施必要的审计程序，无依据调整所有者权益变动表期初未分配利润数据，编造事由出具虚假审计报告。\n二、在深圳市三浦半导体有限公司（以下称三浦半导体）2022年财务报表审计报告中，未实施必要的审计程序，编造事由出具虚假审计报告\n三浦半导体2022年虚增期末应收账款6,689,868.30元，虚增比例为74%；虚增预付账款1,601,110.58元，虚增比例为81%；虚减存货12,000,000.00元，虚减比例为43%；虚减应付账款2,987,472.86元，虚减比例为36%；虚减预收账款1,409,529.01元，虚减比例为62%；虚减其他应付款3,157,157.96元，虚减比例为86%；虚增未分配利润4,561,296.99元，虚增比例为37%；虚增2022年度营业收入20,000,000.00元，虚增比例为159%；虚增营业成本15,380,000.00元，虚增比例为151%；虚增净利润4,561,296.99元，虚增比例为172%。巨源立德在三浦半导体2022年财务报表审计中，未实施必要的审计程序，编制的审计工作底稿中部分数据与已获取的审计证据存在明显矛盾或重大不一致，编造事由出具虚假审计报告。\n你将个人证件、材料等交予巨源立德且未采取有效的防范措施，对于巨源立德以你的名义执行业务、出具虚假审计报告的行为负有责任，相关行为违反《会计师事务所执业许可和监督管理办法》第六十一条第（四）项等规定。上述事实，有财政检查报告、相关当事人陈述申辩意见、听证笔录等相关证据予以证实。\n依据《会计师事务所执业许可和监督管理办法》第七十一条、《中华人民共和国行政处罚法》第三十二条第（二）项的规定，我部决定给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年1月23日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕20号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971716.htm", "date": "2025-01-23", "id": "e258b9bcee5b0bccc5912efb366237a6", "content": "财政部行政处罚决定书（财监法〔2025〕20号）\n财监法〔2025〕20号\n财政部行政处罚决定书\n当 事 人：姚忱\n地      址：浙江省湖州市\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2023年对广东明心会计师事务所（普通合伙）（以下称广东明心）执业质量等情况开展了检查。检查发现的有关问题和行政处罚决定如下：\n深圳市一品源太阳能科技有限公司（以下称一品源）2021年虚增净利润161,477.89元，虚增比例为450.98%；虚增货币资金73,063.97元，虚增比例为75.07%；虚增应收账款9,577,211.75元，虚增比例为416.20%；虚增应付账款8,976,713.17元，虚增比例为58.04%；虚增短期借款507,000.00元，虚增比例为167.22%；虚减其他应付款520,358.00元，虚减比例为31.68%。\n广东明心在一品源2021年财务报表审计中，未对企业银行存款执行函证程序，未核对企业账面金额与银行对账单是否一致，且未说明理由；未对短期借款执行函证程序，未取得短期借款合同进行核对；未对应收账款、应付账款执行函证程序，且未执行替代程序。广东明心未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n上述行为违反《会计师事务所执业许可和监督管理办法》第六十条第（一）项，《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条、第九条，《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十条、第二十六条、第二十七条、第二十八条，《中国注册会计师审计准则第1301号——审计证据》第十条，《中国注册会计师审计准则第1312号——函证》第十一条等规定。\n上述事实，有财政检查报告、相关当事人签证和反馈意见、行政处罚事项告知书送达公告等相关证据予以证实。\n你作为相关审计报告的签字注册会计师，对上述问题负有责任。鉴于你有减轻行政处罚的情节，依据《会计师事务所执业许可和监督管理办法》第七十条、《中华人民共和国行政处罚法》第三十二条第（二）项的规定，我部决定给予你暂停执行业务六个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年1月23日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕19号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971715.htm", "date": "2025-01-23", "id": "e2acc706ddd7d2b7b0d18bf86908d8e5", "content": "财政部行政处罚决定书（财监法〔2025〕19号）\n财监法〔2025〕19号\n财政部行政处罚决定书\n当 事 人：张坤菊\n地      址：吉林省长春市\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2023年对广东明心会计师事务所（普通合伙）（以下称广东明心）执业质量等情况开展了检查。检查发现的有关问题和行政处罚决定如下：\n深圳市蓝极星光电科技有限公司（以下称蓝极星）2022年财务报表虚增银行存款9,299,170.54元，虚增比例为5,779.54%；虚减计入其他货币资金的承兑保证金账面金额6,542,442.08元，虚减比例为15.14%；虚增计入其他应收款的理财产品32,016,031.13元，虚增比例为376.66%。同时，理财产品未列入交易性金融资产核算而计入其他应收款核算，虚增其他应收款40,516,031.13元，虚增比例为4,049.14%；交易性金融资产金额为0元，虚减8,500,000.00元，虚减比例为100.00%。\n广东明心在蓝极星2022年财务报表审计中，未实施必要的审计程序，仅对货币资金、计入其他应收款的理财产品抽取2笔凭证进行检查，未对银行存款、其他货币资金、理财产品实施函证程序，未核对企业账面金额与银行对账单是否一致，未获取充分、适当的审计证据，出具虚假审计报告。\n上述行为违反《会计师事务所执业许可和监督管理办法》第六十条第（一）项，《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条、第十二条、第十四条，《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十条、第二十六条、第二十七条、第二十八条，《中国注册会计师审计准则第1301号——审计证据》第十条，《中国注册会计师审计准则第1312号——函证》第十一条等规定。\n上述事实，有财政检查报告、相关当事人签证和反馈意见等相关证据予以证实。\n你作为相关审计报告的签字注册会计师，对上述问题负有责任。鉴于你有减轻行政处罚的情节，依据《会计师事务所执业许可和监督管理办法》第七十条、《中华人民共和国行政处罚法》第三十二条第（二）项的规定，我部决定给予你暂停执行业务六个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年1月23日"}, {"source": "财政部", "category": "处 注册会计师审计准则第1301号——审计证据》第十条等规定。\n上述事实，有财政检查报告、相关当事人签证和反馈意见等相关证据予以证实。\n你作为相关审计报告的签字注册会计师，对上述问题负有责任。鉴于你有减轻行政处罚的情节，依据《会计师事务所执业许可和监督管理办法》第七十条、《中华人民共和国行政处罚法》第三十二条第（二）项的规定，我部决定给予你暂停执行业务六个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年1月23日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕16号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971712.htm", "date": "2025-01-23", "id": "d358041da6495f6a14c090b248632792", "content": "财政部行政处罚决定书（财监法〔2025〕16号）\n财监法〔2025〕16号\n财政部行政处罚决定书\n当 事 人：贺彬\n地      址：四川省成都市\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2023年对深圳市度支会计师事务所（普通合伙）（以下称深圳度支）执业质量等情况开展了检查。检查发现的有关问题和行政处罚决定如下：\n深圳度支在深圳市腾星宏俊科技有限公司（以下称深圳腾星）2022年财务报表审计中，未实施必要的审计程序，未就财务数据的真实性、准确性获取充分、适当的审计证据，编造事由出具虚假审计报告。\n一、深圳度支直接将深圳腾星对手方为不同主体的预收账款和预付账款进行对冲调减，虚减预付账款42,571,357.67元、预收账款42,571,357.67元。虚减资产占深圳腾星账表记录总资产的44%、虚减负债占深圳腾星账表记录总负债的62%。虚减后，深圳腾星资产负债率由72%降至50%。\n二、深圳腾星未按历史成本计量无形资产账面价值，虚增2022年无形资产7,962,376.24元，虚增比例为18209%；虚增资本公积8,000,000.00元；确认部分主营业务收入的同时，通过研发费用结转所需物料成本，多计2022年研发费用、少计主营业务成本6,642,863.58元，多计研发费用比例为147%。深圳度支未实施必要的审计程序，未就财务数据的真实性、准确性获取充分、适当的审计证据。\n上述行为违反，《会计师事务所执业许可和监督管理办法》第六十条第（一）项，《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条、第十二条、第十四条，《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十条、第二十六条，《中国注册会计师审计准则第1301号——审计证据》第十条，第四条等规定。\n上述事实，有财政检查报告、相关当事人签证和反馈意见等相关证据予以证实。\n你作为相关审计报告的签字注册会计师，对上述问题负有责任。鉴于你有减轻行政处罚的情节，依据《会计师事务所执业许可和监督管理办法》第七十条、《中华人民共和国行政处罚法》第三十二条第（二）项的规定，我部决定给予你暂停执行业务六个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年1月23日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕15号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971711.htm", "date": "2025-01-23", "id": "9c02db958fdbe7dcd694f677bce02e77", "content": "财政部行政处罚决定书（财监法〔2025〕15号）\n财监法〔2025〕15号\n财政部行政处罚决定书\n当 事 人：郭鹏\n地      址：河南省许昌市\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2023年对深圳文本会计师事务所（普通合伙）（以下称深圳文本）执业质量等情况开展了检查。检查发现的有关问题和行政处罚决定如下：\n一、未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告\n深圳市欧瑞博科技股份有限公司（以下称欧瑞博）2021年虚增营业收入101,317,344.57元，虚增比例为18.61%；虚减所得税费用19,948,912.92元，虚减比例为100.00%；虚增净利润58,198,429.43元，虚增比例为52.68%；虚减货币资金49,471,385.62元，虚减比例为15.63%；虚减应收账款30,626,766.23元，虚减比例为30.90%；虚减预付账款10,822,370.35元，虚减比例为73.00%；虚增递延所得税资产47,210,784.67元，虚增比例为100.00%；虚减应付账款15,676,989.80元，虚减比例为16.71%；虚减合同负债78,805,708.06元，虚减比例为100.00%。深圳文本在欧瑞博2021年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报告。\n二、未实施必要的审计程序，未获取充分适当的审计证据，发表不恰当审计意见\n深圳蓝胖子机器智能有限公司（以下称蓝胖子）2021年处置子公司股权交易事项不满足投资收益确认条件，导致虚增投资收益50,632,500.00元，虚增比例为100.00%，使其2021年净利润由亏损12,535,211.58元转为盈利38,097,288.42元。深圳文本在蓝胖子2021年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，未发现其处置子公司股权交易事项不满足投资收益确认条件，发表了不恰当的审计意见。\n上述行为违反《会计师事务所执业许可和监督管理办法》第六十条第（一）项，《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条、第九条，《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十条、第二十六条、第二十七条、第二十八条、第二十九条、第三十条，《中国注册会计师审计准则第1301号——审计证据》第十条，《中国注册会计师审计准则第1312号——函证》第十一条等规定。\n上述事实，有财政检查报告、相关当事人签证和反馈意见等相关证据予以证实。\n你作为相关审计报告的签字注册会计师，对上述问题负有责任。鉴于你有减轻行政处罚的情节，依据《会计师事务所执业许可和监督管理办法》第七十条、《中华人民共和国行政处罚法》第三十二条第（二）项的规定，我部决定给予你暂停执行业务六个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年1月23日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕14号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202509/t20250905_3971709.htm", "date": "2025-01-23", "id": "c25d18f657cda116522fc9e956a26733", "content": "财政部行政处罚决定书（财监法〔2025〕14号）\n财监法〔2025〕14号\n财政部行政处罚决定书\n当 事 人：李燕梅\n地      址：湖南省冷水江市\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2023年对深圳文本会计师事务所（普通合伙）（以下称深圳文本）执业质量等情况开展了检查。检查发现的有关问题和行政处罚决定如下：\n深圳市欧瑞博科技股份有限公司（以下称欧瑞博）2021年虚增营业收入101,317,344.57元，虚增比例为18.61%；虚减所得税费用19,948,912.92元，虚减比例为100.00%；虚增净利润58,198,429.43元，虚增比例为52.68%；虚减货币资金49,471,385.62元，虚减比例为15.63%；虚减应收账款30,626,766.23元，虚减比例为30.90%；虚减预付账款10,822,370.35元，虚减比例为73.00%；虚增递延所得税资产47,210,784.67元，虚增比例为100.00%；虚减应付账款15,676,989.80元，虚减比例为16.71%；虚减合同负债78,805,708.06元，虚减比例为100.00%。深圳文本在欧瑞博2021年财务报表审计中，未实施必要的审计程序，未获取充分适当的审计证据，出具虚假审计报
