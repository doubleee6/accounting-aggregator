度确认收入，上述项目由你公司联合施工单位组成联合体共同投标并提供服务，联合体协议明确了各自的工作内容、权利义务和合同价款，你公司负责设计，未主导采购和施工服务，未承担采购和施工服务的主要责任，只收取设计费、管理费，无法自主决定整个项目报价。你公司作为联合体牵头方，对上述项目中的采购和施工部分仅承担连带责任，不符合总额法确认收入的相关条件，应按净额法确认收入，导致\n2024\n年多计收入\n29263.91\n万元、多计成本\n29263.91\n万元。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了\n2024\n年修改的《中华人民共和国会计法》第十五条第一款，不符合《企业会计准则第\n14\n号——收入》第三十四条第一款的规定。\n依据\n2024\n年修改的《中华人民共和国会计法》第四十条第一款第（四）项的规定，财政部决定给予你公司警告、通报批评，并处罚款\n80\n万元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部浙江监管局联系，凭财政部浙江监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n4\n月\n7\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕72号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260414_3987528.htm", "date": "2026-04-07", "id": "fa4ba83da5812db2508a9e4895fa9e78", "content": "财政部行政处罚决定书（财监法〔2026〕72号）\n财监法〔\n2026\n〕\n72\n号\n财政部行政处罚决定书\n当 事 人：张应江\n地    址：贵州省遵义市汇川区汇川大道行政办公中心\n依照《中华人民共和国会计法》的规定，财政部组织检查组于\n2025\n年对遵义市汇川区娄海情旅游发展投资有限公司（以下称娄海情公司）会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n一、通过虚构代建业务虚增收入\n娄海情公司基于债券市场公开披露报表统计收入等需要，在中共遵义市汇川区委党校基础设施建设项目（以下称区委党校项目）已完工的情况下，与控股股东遵义经济技术开发区新兴产业投资有限公司（以下称产投公司）签订了落款日期为\n2022\n年\n12\n月的代建协议，并根据产投公司出具的工程进度结算单，\n2023\n年、\n2024\n年分别确认代建收入\n34344.61\n万元、\n34488.78\n万元，占当期营业收入比例分别为\n95.02%\n、\n92.79%\n，分别确认利润\n5724.10\n万元、\n5748.13\n万元。区委党校项目实际于\n2021\n年完工、\n2022\n年\n8\n月项目开始合作运营，\n2022\n年\n11\n月项目法人变更为产投公司。娄海情公司通过虚构代建业务，\n2023\n年虚增代建收入\n34344.61\n万元、虚增利润\n5724.10\n万元，\n2024\n年虚增代建收入\n34488.78\n万元、虚增利润\n5748.13\n万元。\n二、虚列咨询费358.14万元\n2024\n年\n6\n月，娄海情公司与中国建设银行股份有限公司贵州省分行（以下称建行贵州省分行）签订建设工程造价咨询合同，委托建行贵州省分行对遵义市汇川区田沟绿色食品产业园区建设项目（以下称田沟绿色食品项目）进行工程预算审核，并以咨询费名义列支\n358.14\n万元。田沟绿色食品项目实际已于\n2019\n年\n4\n月完工并验收通过，预算审核服务与项目进度不匹配，该笔费用实际为债券置换优惠利率的补偿，导致\n2024\n年管理费用中虚列咨询费\n358.14\n万元。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了\n2017\n年修改的《中华人民共和国会计法》第九条第一款、第二款，\n2024\n年修改的《中华人民共和国会计法》第九条第一款、第二款等规定。\n你作为娄海情公司的单位负责人，对上述问题负有责任。依据\n2017\n年修改的《中华人民共和国会计法》第四十三条第二款、\n2024\n年修改的《中华人民共和国会计法》第四十一条等规定，财政部决定给予你罚款\n30\n万元的行政处罚。\n你应在收到本处罚决定书之日起十五日内与财政部贵州监管局联系，凭财政部贵州监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n4\n月\n7\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕71号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260414_3987527.htm", "date": "2026-04-07", "id": "0c7f895ee14dfb8737933297bb98789d", "content": "财政部行政处罚决定书（财监法〔2026〕71号）\n财监法〔\n2026\n〕\n71\n号\n财政部行政处罚决定书\n当 事 人：遵义市汇川区娄海情旅游发展投资有限公司\n地    址：贵州省遵义市汇川区汇川大道行政办公中心\n依照《中华人民共和国会计法》的规定，财政部组织检查组于\n2025\n年对你公司会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n一、通过虚构代建业务虚增收入\n你公司基于债券市场公开披露报表统计收入等需要，在中共遵义市汇川区委党校基础设施建设项目（以下称区委党校项目）已完工的情况下，与控股股东遵义经济技术开发区新兴产业投资有限公司（以下称产投公司）签订了落款日期为\n2022\n年\n12\n月的代建协议，并根据产投公司出具的工程进度结算单，\n2023\n年、\n2024\n年分别确认代建收入\n34344.61\n万元、\n34488.78\n万元，占当期营业收入比例分别为\n95.02%\n、\n92.79%\n，分别确认利润\n5724.10\n万元、\n5748.13\n万元。区委党校项目实际于\n2021\n年完工、\n2022\n年\n8\n月项目开始合作运营，\n2022\n年\n11\n月项目法人变更为产投公司。你公司通过虚构代建业务，\n2023\n年虚增代建收入\n34344.61\n万元、虚增利润\n5724.10\n万元，\n2024\n年虚增代建收入\n34488.78\n万元、虚增利润\n5748.13\n万元。\n二、虚列咨询费358.14万元\n2024\n年\n6\n月，你公司与中国建设银行股份有限公司贵州省分行（以下称建行贵州省分行）签订建设工程造价咨询合同，委托建行贵州省分行对遵义市汇川区田沟绿色食品产业园区建设项目（以下称田沟绿色食品项目）进行工程预算审核，并以咨询费名义列支\n358.14\n万元。田沟绿色食品项目实际已于\n2019\n年\n4\n月完工并验收通过，预算审核服务与项目进度不匹配，该笔费用实际为债券置换优惠利率的补偿，导致\n2024\n年管理费用中虚列咨询费\n358.14\n万元。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了\n2017\n年修改的《中华人民共和国会计法》第九条第一款、第二款，\n2024\n年修改的《中华人民共和国会计法》第九条第一款、第二款等规定。\n依据\n2017\n年修改的《中华人民共和国会计法》第四十三条第二款、\n2024\n年修改的《中华人民共和国会计法》第四十一条等规定，财政部决定给予你公司警告、通报批评，并处罚款\n100\n万元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部贵州监管局联系，凭财政部贵州监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n4\n月\n7\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕70号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260410_3987355.htm", "date": "2026-04-07", "id": "eccfdf05bf06de4abe1e37a2c06a9cda", "content": "财政部行政处罚决定书（财监法〔2026〕70号）\n财监法〔\n2026\n〕\n70\n号\n财政部行政处罚决定书\n当 事 人：\n康利岩\n地    址：北京市西城区阜成门外大街\n2\n号\n22\n层\nA24\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于\n2025\n年对中兴财光华会计师事务所（特殊普通合伙）（以下称中兴财光华）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n对东旭蓝天新能源股份有限公司（以下称东旭蓝天）2019至2020年度财务报表审计中，违反多项审计准则的规定，未保持应有的职业怀疑，未履行必要审计程序或审计程序存在重大缺陷，未识别东旭蓝天资金被占用的重大错报。\n有关机关另案查明，东旭蓝天以预付资金形式被东旭集团占用资金，\n2019\n至\n2020\n年发生金额分别为\n19.34\n亿元、\n1.23\n亿元，\n2019\n至\n2020\n年末，东旭蓝天被东旭集团占用资金余额分别为\n76.86\n亿元、\n78.09\n亿元。东旭蓝天在\n2019\n至\n2020\n年的年度财务报告中均未披露相关资金占用事项。\n经查明，中兴财光华对东旭蓝天\n2019\n至\n2020\n年度财务报表审计中，将货币资金、预付款项等列为重点审计领域，但在审计过程中存在如下问题：\n（一）对预付款项及其他非流动资产的真实合理性及资金占用风险未保持应有的职业怀疑，未恰当检查主要银行账户\nU\n盾的保管和使用情况，导致未识别东旭蓝天主要银行账户\nU\n盾实际由东旭集团管控，大额预付资金被东旭集团直接划拨的重大内部控制缺陷。\n（二）对多家大额预付设备款项对应供应商实缴注册资本为\n0\n且参保人数为\n0\n、部分供应商成立当年即与东旭蓝天签订大额预付采购合同的显著异常线索，未充分关注、核实，未充分确认东旭蓝天与上述异常供应商开展重大交易的原因及商业合理性。\n（三）对大额预付设备款项对应的光伏及风电项目长期未取得备案批复文件、未能提供项目资料、部分光伏及风电项目长期未开工、与多家供应商通过反复签订《履约能力测试协议》频繁支付和退回合同预付款、部分大额预付设备款项供应商在收款\n1-2\n年内注销且未退回预付款等重大异常线索，未保持应有的职业怀疑，对相关采购业务的真实性和预付款项合理性未获取充分适当的审计证据。在部分预付股权收购款的函证程序中，未充分关注不同供应商存在函证联系人相同的异常情况，且未回函情况下替代测试程序执行不到位。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、第二款第（四）项、第三款，《会计师事务所执业许可和监督管理办法》（\n2019\n年修订）第六十条第（一）项；不符合《中国注册会计师职业道德守则第\n1\n号——职业道德基本原则》（\n2009\n年修订）第十七条，《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》（\n2019\n年修订）第二十二条第一款、第二款第（一）（二）项，第二十八条，第三十条，《中国注册会计师审计准则第\n1231\n号——针对评估的重大错报风险采取的应对措施》（\n2019\n年修订）第八条第（一）项，《中国注册会计师审计准则第\n1301\n号——审计证据》（\n2016\n年修订）第九条、第十条，《中国注册会计师审计准则第\n1141\n号——财务报表审计中与舞弊相关的责任》（\n2019\n年修订）第十三条、第二十五条、第二十七条、第三十一条，《中国注册会计师审计准则第\n1312\n号——函证》第十四条第（三）（四）项、第十七条、第十九条等规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款、《会计师事务所执业许可和监督管理办法》（\n2019\n年修订）第七十条第一款的规定，财政部决定给予你警告、暂停执行业务\n6\n个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n4\n月\n7\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕69号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260410_3987351.htm", "date": "2026-04-07", "id": "5522db62b7ee8a3d9d20a26db5644713", "content": "财政部行政处罚决定书（财监法〔2026〕69号）\n财监法〔\n2026\n〕\n69\n号\n财政部行政处罚决定书\n当 事 人：\n王凤岐\n地    址：北京市西城区阜成门外大街\n2\n号\n22\n层\nA24\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于\n2025\n年对中兴财光华会计师事务所（特殊普通合伙）（以下称中兴财光华）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n对东旭集团有限公司（以下称东旭集团）2016至2017年度财务报表审计中，违反多项审计准则的规定，未保持应有的职业怀疑，未履行必要审计程序或审计程序存在重大缺陷，审计工作底稿存在虚假记载，未识别东旭集团虚增收入、利润及货币资金的重大错报\n有关机关另案查明，\n2016\n至\n2017\n年，东旭集团通过虚构业务等方式进行财务造假，虚增收入分别为\n96.01\n亿元、\n128.33\n亿元，虚增\n2016\n至\n2017\n年利润总额分别为\n34.15\n亿元、\n47.31\n亿元。\n2016\n至\n2017\n年，东旭集团通过财务不记账、虚假记账等方式，各期末分别虚增货币资金\n247.72\n亿元、\n447.90\n亿元。\n经查明，中兴财光华在对东旭集团\n2016\n至\n2017\n年度财务报表审计中，将货币资金、收入、成本等列为重点审计领域，但在审计过程中存在如下问题：\n（一）在货币资金的审计中，未对东旭集团“存贷双高”的异常情形保持应有的职业怀疑，未获取关键银行账户的银行对账单，未有效控制银行函证过程，未发现东旭集团虚增大额银行存款的舞弊行为。\n（二）在销售与收款循环审计中，未充分了解、评价销售与收款循环相关内部控制，未恰当执行控制测试；函证样本选取不到位，未对应收账款函证过程保持控制，跟函记录存在虚假记载，未回函项目替代程序执行不到位；营业收入细节测试底稿中部分样本既无货物验收或签收情况的具体检查记录也未获取相关单据，既无货物运输单据的具体检查记录也未获取相关单据；针对出库单及验收单编号、日期、模板等存在的异常情况，未保持应有的职业怀疑，未实施进一步审计程序，未就收入真实性获取充分适当的审计证据，未发现东旭集团虚增营业收入的舞弊行为。\n（三）在采购与付款循环审计中，未对预付账款函证全过程保持必要控制，跟函记录存在虚假记载；未关注付款审批材料的异常情况，对预付单一供应商金额占比过高的异常情况未采取进一步审计程序；存货监盘程序执行不到位，存货监盘底稿存在虚假记载，未对存货的存在性认定获取充分适当的审计证据，未发现东旭集团虚假采购的舞弊行为。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、第二款第（四）项、第三款，《会计师事务所审批和监督暂行办法》第五十六条第一款第（一）（五）项，《会计师事务所执业许可和监督管理办法》（\n2017\n年修订）第六十条第（一）项；不符合《中国注册会计师职业道德守则第\n1\n号——职业道德基本原则》（\n2009\n年修订）第十七条，《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》（\n2010\n年修订）第二十二条第一款、第二款第（一）（二）项\n，\n第二十八条\n，\n第三十条，《中国注册会计师审计准则第\n1231\n号——针对评估的重大错报风险采取的应对措施》（\n2010\n年修订）第八条第（一）项，《中国注册会计师审计准则第\n1301\n号——审计证据》（\n2010\n年修订、\n2016\n年修订）第九条、第十条，《中国注册会计师审计准则第\n1141\n号——财务报表审计中与舞弊相关的责任》（\n2010\n年修订）第十三条、第二十五条、第二十七条、第三十一条，《中国注册会计师审计准则第\n1312\n号——函证》第十四条第（二）（三）（四）项、第十七条、第十九条等规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款、《会计师事务所审批和监督暂行办法》第六十五条第一款、《会计师事务所执业许可和监督管理办法》（\n2017\n年修订）第七十条第一款的规定，财政部决定给予你警告、暂停执行业务\n6\n个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n4\n月\n7\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕68号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260410_3987346.htm", "date": "2026-04-07", "id": "57bc57c2cd8a7a497caab13f6335e144", "content": "财政部行政处罚决定书（财监法〔2026〕68号）\n财监法〔\n2026\n〕\n68\n号\n财政部行政处罚决定书\n当 事 人：\n孟晓光\n地    址：北京市西城区阜成门外大街\n2\n号\n22\n层\nA24\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于\n2025\n年对中兴财光华会计师事务所（特殊普通合伙）（以下称中兴财光华）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n对东旭光电科技股份有限公司（以下称东旭光电）2015至2018年度财务报表审计中，违反多项审计准则的规定，未保持应有的职业怀疑，未履行必要审计程序或审计程序存在重大缺陷，审计工作底稿存在虚假记载，未识别东旭光电虚增收入、利润及资金被占用的重大错报。\n有关机关另案查明，\n2015\n至\n2018\n年，东旭光电通过虚构业务等方式进行财务造假，虚增收入分别为\n18.14\n亿元、\n37.05\n亿元、\n43.06\n亿元、\n42.90\n亿元，虚增利润总额分别为\n8.63\n亿元、\n13.69\n亿元、\n13.15\n亿元、\n14.45\n亿元。\n2015\n至\n2018\n年，东旭光电以原材料采购等名义，向东旭集团及其关联方提供非经营性资金，发生金额分别为\n22.14\n亿元、\n24.67\n亿元、\n16.42\n亿元、\n64.84\n亿元。\n经查明，中兴财光华对东旭光电\n2015\n至\n2018\n年度财务报表审计中，将收入、预付账款等列为重点审计领域，但在审计过程中存在如下问题：\n（一）对东旭光电及其重要子公司销售业务相关内部控制了解、评价和控制测试不到位。未按计划执行或有效执行部分子公司销售与收款循环内部控制的了解、评价和控制测试程序，无法得出销售业务相关内部控制设计及运行有效的审计结论。\n（二）在销售与收款循环审计中，对客户函证地址等存在的异常情况未进行核实，对函证过程未保持必要控制；审计报告出具日前未收到个别客户回函，但未执行替代程序；部分未回函项目实施了替代程序，但未获取收入确认的关键证据资料。未充分获取、检查销售货物的物流记录、验收资料等与收入确认相关的关键审计证据；对部分销售业务的验收日期早于合同签订日期、出库单编号与日期顺序不一致、不同客户发票的联系电话相同、大额设备销售合同中约定一次性付款及无质保金条款等异常情况，未保持应有的职业怀疑，未实施进一步审计程序，未发现东旭光电虚增营业收入的舞弊行为。\n（三）对东旭光电重要子公司芜湖东旭光电装备技术有限公司预付账款业务实施的控制测试、实质性审计程序存在重大缺陷。采购付款业务控制测试中未恰当识别、记录和评价付款审批存在的控制缺陷；未充分核实对部分供应商大额预付账款发生额的合理性；未对预付账款函证过程保持必要控制；对多家重要供应商注册地址相同、不同供应商函证联系人及地址相同等异常情况，未保持应有的职业怀疑，未设计和实施必要审计程序，未发现预付的大额资金被东旭集团及其关联方占用。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、第二款第（四）项、第三款，《会计师事务所审批和监督暂行办法》第五十六条第一款第（一）（五）项，《会计师事务所执业许可和监督管理办法》（\n2017\n年修订）第六十条第（一）项；不符合《中国注册会计师职业道德守则第\n1\n号——职业道德基本原则》（\n2009\n年修订）第十七条，《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》（\n2010\n年修订）第二十二条第一款、第二款第（一）（二）项，第二十八条，第三十条，《中国注册会计师审计准则第\n1231\n号——针对评估的重大错报风险采取的应对措施》（\n2010\n年修订）第八条第（一）项，《中国注册会计师审计准则第\n1301\n号——审计证据》（\n2010\n年修订、\n2016\n年修订）第九条、第十条，《中国注册会计师审计准则第\n1141\n号——财务报表审计中与舞弊相关的责任》（\n2010\n年修订）第十三条、第二十五条、第二十七条、第三十一条，《中国注册会计师审计准则第\n1312\n号——函证》第十四条第（三）（四）项、第十七条、第十九条等规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款、《会计师事务所审批和监督暂行办法》第六十五条第一款、《会计师事务所执业许可和监督管理办法》（\n2017\n年修订）第七十条第一款的规定，财政部决定给予你警告、暂停执行业务\n9\n个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n4\n月\n7\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕67号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260410_3987342.htm", "date": "2026-04-07", "id": "4918e2c76813692c61edcefa986c49cb", "content": "财政部行政处罚决定书（财监法〔2026〕67号）\n财监法〔\n2026\n〕\n67\n号\n财政部行政处罚决定书\n当 事 人：\n王雅栋\n地    址：北京市西城区阜成门外大街\n2\n号\n22\n层\nA24\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于\n2025\n年对中兴财光华会计师事务所（特殊普通合伙）（以下称中兴财光华）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、对东旭集团有限公司（以下称东旭集团）2018至2019年度财务报表审计中，违反多项审计准则的规定，未保持应有的职业怀疑，未履行必要审计程序或审计程序存在重大缺陷，审计工作底稿存在虚假记载，未识别东旭集团虚增收入、虚增虚减利润及虚增货币资金的重大错报\n有关机关另案查明，\n2018\n至\n2019\n年，东旭集团通过虚构业务等方式进行财务造假，虚增收入分别为\n141.49\n亿元、\n68.66\n亿元，虚增\n2018\n年利润总额\n54.62\n亿元，虚减\n2019\n年利润总额\n21.55\n亿元。\n2018\n年，东旭集团通过财务不记账、虚假记账等方式，期末虚增货币资金\n337.21\n亿元。\n经查明，中兴财光华在东旭集团\n2018\n至\n2019\n年度财务报表审计中，将货币资金、收入、成本等列为重点审计领域，但在审计过程中存在如下问题：\n（一）在货币资金审计中，未对东旭集团“存贷双高”的异常情形保持应有的职业怀疑，\n2018\n年未获取关键银行账户的银行对账单，未有效控制银行函证过程，未发现东旭集团虚增大额银行存款的舞弊行为。\n（二）在销售与收款循环审计中，未充分了解、评价销售与收款循环相关内部控制，未恰当执行控制测试；函证样本选取不到位，未对应收账款函证过程保持控制，跟函记录存在虚假记载，未回函项目替代程序执行不到位；营业收入细节测试底稿中部分样本既无货物验收或签收情况的具体检查记录也未获取相关单据，既无货物运输单据的具体检查记录也未获取相关单据；针对出库单及验收单编号、日期、模板等存在的异常情况，未保持应有的职业怀疑，未实施进一步审计程序，未就收入真实性获取充分适当的审计证据，未发现东旭集团虚增营业收入的舞弊行为。\n（三）在采购与付款循环审计中，未对预付账款函证全过程保持必要控制，跟函记录存在虚假记载；未关注付款审批材料的异常情况，对预付单一供应商金额占比过高的异常情况未采取进一步审计程序；存货监盘程序执行不到位，存货监盘底稿存在虚假记载，未对存货的存在性认定获取充分适当的审计证据，未发现东旭集团虚假采购的舞弊行为。\n二、对东旭光电科技股份有限公司（以下称东旭光电）2019至2020年度财务报表审计中，违反多项审计准则的规定，未保持应有的职业怀疑，未履行必要审计程序或审计程序存在重大缺陷，审计工作底稿存在虚假记载，未识别东旭光电虚增收入、利润及资金被占用的重大错报\n有关机关另案查明，\n2019\n年，东旭光电通过虚构业务等方式进行财务造假，虚增收入\n26.45\n亿元，虚增利润总额\n6.35\n亿元。\n2019\n至\n2020\n年，东旭光电以原材料采购等名义，向东旭集团及其关联方提供非经营性资金，发生金额分别为\n63.68\n亿元、\n6.81\n亿元。\n经查明，中兴财光华对东旭光电\n2019\n至\n2020\n年度财务报表审计中，将收入、预付账款等列为重点审计领域，但在审计过程中存在如下问题：\n（一）对东旭光电及其重要子公司销售业务相关内部控制了解、评价和控制测试不到位。未按计划执行或有效执行部分子公司销售与收款循环内部控制的了解、评价和控制测试程序，对部分重要子公司“客户验收”关键控制点未进行了解、评价和测试，无法得出销售业务相关内部控制设计及运行有效的审计结论。\n（二）在销售与收款循环审计中，对客户函证地址等存在的异常情况未进行核实，对函证过程未保持必要控制；审计报告出具日前未收到个别客户回函，但未执行替代程序；部分未回函项目实施了替代程序，但未获取收入确认的关键证据资料。未充分获取、检查销售货物的物流记录、验收资料等与收入确认相关的关键审计证据；对部分销售业务的验收日期早于合同签订日期、大额设备销售合同约定一次性付款及无质保金条款等异常情况，未保持应有的职业怀疑，未实施进一步审计程序，未发现东旭光电虚增营业收入的舞弊行为。\n（三）对东旭光电重要子公司芜湖东旭光电装备技术有限公司预付账款业务实施的控制测试、实质性审计程序存在重大缺陷。采购付款业务控制测试中未恰当识别、记录和评价付款审批存在的控制缺陷；对大额预付账款长期挂账、供应商大量及频繁退款、多家重要供应商注册地址相同、不同供应商预付账款催告回复内容及回复时间完全一致、不同供应商函证联系人及地址相同等异常情况，未保持应有的职业怀疑，未设计和实施必要审计程序，未发现预付的大额资金被东旭集团及其关联方占用。\n三、对东旭蓝天新能源股份有限公司（以下称东旭蓝天）2018至2020年度财务报表审计中，违反多项审计准则的规定，未保持应有的职业怀疑，未履行必要审计程序或审计程序存在重大缺陷，未识别东旭蓝天资金被占用的重大错报\n有关机关另案查明，东旭蓝天以预付资金形式被东旭集团占用资金，\n2018\n至\n2020\n年发生金额分别为\n61.89\n亿元、\n19.34\n亿元、\n1.23\n亿元，\n2018\n至\n2020\n年末，东旭蓝天被东旭集团占用资金余额分别为\n60.01\n亿元、\n76.86\n亿元、\n78.09\n亿元。东旭蓝天在\n2018\n至\n2020\n年的年度财务报告中均未披露相关资金占用事项。\n经查明，中兴财光华对东旭蓝天\n2018\n至\n2020\n年度财务报表审计中，将货币资金、预付款项等列为重点审计领域，但在审计过程中存在如下问题：\n（一）对预付款项及其他非流动资产的真实合理性及资金占用风险未保持应有的职业怀疑，未恰当检查主要银行账户\nU\n盾的保管和使用情况，对财务印鉴保管情况的了解结论与实际不符，导致未识别东旭蓝天主要银行账户\nU\n盾及财务印鉴实际由东旭集团管控，大额预付资金被东旭集团直接划拨的重大内部控制缺陷。\n（二）对多家大额预付设备款项对应供应商实缴注册资本为\n0\n且参保人数为\n0\n、部分供应商成立当年即与东旭蓝天签订大额预付采购合同、新增大额预付款项涉及的供应商为首次合作的显著异常线索，未充分关注、核实，未充分确认东旭蓝天与上述异常供应商开展重大交易的原因及商业合理性。\n（三）对大额预付设备款项对应的光伏及风电项目长期未取得备案批复文件、未能提供项目资料、部分光伏及风电项目长期未开工、与多家供应商通过反复签订《履约能力测试协议》频繁支付和退回合同预付款、部分大额预付设备款项供应商在收款\n1-2\n年内注销且未退回预付款等重大异常线索，未保持应有的职业怀疑，对相关采购业务的真实性和预付款项合理性未获取充分适当的审计证据。在部分预付股权收购款的函证程序中，未充分关注不同供应商存在函证联系人相同的异常情况，且未回函情况下替代测试程序执行不到位。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、第二款第（四）项、第三款，《会计师事务所执业许可和监督管理办法》（\n2017\n年修订、\n2019\n年修订）第六十条第（一）项；不符合《中国注册会计师职业道德守则第\n1\n号——职业道德基本原则》（\n2009\n年修订）第十七条，《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》（\n2010\n年修订、\n2019\n年修订）第二十二条第一款、第二款第（一）（二）项，第二十八条，第三十条，《中国注册会计师审计准则第\n1231\n号——针对评估的重大错报风险采取的应对措施》（\n2010\n年修订、\n2019\n年修订）第八条第（一）项，《中国注册会计师审计准则第\n1301\n号——审计证据》（\n2016\n年修订）第九条、第十条，《中国注册会计师审计准则第\n1141\n号——财务报表审计中与舞弊相关的责任》（\n2010\n年修订、\n2019\n年修订）第十三条、第二十五条、第二十七条、第三十一条，《中国注册会计师审计准则第\n1312\n号——函证》第十四条第（二）（三）（四）项、第十七条、第十九条等规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款、《会计师事务所执业许可和监督管理办法》（\n2017\n年修订、\n2019\n年修订）第七十条第一款的规定，财政部决定给予你警告、暂停执行业务\n1\n年的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n4\n月\n7\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕66号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260410_3987338.htm", "date": "2026-04-07", "id": "0d18c004f0a16acfa76d1156af6417ea", "content": "财政部行政处罚决定书（财监法〔2026〕66号）\n财监法〔\n2026\n〕\n66\n号\n财政部行政处罚决定书\n当 事 人：\n齐正华\n地    址：北京市西城区阜成门外大街\n2\n号\n22\n层\nA24\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于\n2025\n年对中兴财光华会计师事务所（特殊普通合伙）（以下称中兴财光华）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、对东旭集团有限公司（以下称东旭集团）2015至2019年度财务报表审计中，违反多项审计准则的规定，未保持应有的职业怀疑，未履行必要审计程序或审计程序存在重大缺陷，审计工作底稿存在虚假记载，未识别东旭集团虚增收入、虚增虚减利润及虚增货币资金的重大错报\n有关机关另案查明，\n2015\n至\n2019\n年，东旭集团通过虚构业务等方式进行财务造假，虚增收入分别为\n43.76\n亿元、\n96.01\n亿元、\n128.33\n亿元、\n141.49\n亿元、\n68.66\n亿元，虚增\n2015\n至\n2018\n年利润总额分别为\n15.48\n亿元、\n34.15\n亿元、\n47.31\n亿元、\n54.62\n亿元，虚减\n2019\n年利润总额\n21.55\n亿元。\n2015\n至\n2018\n年，东旭集团通过财务不记账、虚假记账等方式，各期末分别虚增货币资金\n79.57\n亿元、\n247.72\n亿元、\n447.90\n亿元、\n337.21\n亿元。\n经查明，中兴财光华在东旭集团\n2015\n至\n2019\n年度财务报表审计中，将货币资金、收入、成本等列为重点审计领域，但在审计过程中存在如下问题：\n（一）在货币资金审计中，未对东旭集团“存贷双高”的异常情况保持应有的职业怀疑，\n2016\n至\n2018\n年未获取关键银行账户的银行对账单，未有效控制银行函证过程，未发现东旭集团虚增大额银行存款的舞弊行为。\n（二）在销售与收款循环审计中，未充分了解、评价销售与收款循环相关内部控制，未恰当执行控制测试；函证样本选取不到位，未对应收账款函证过程保持控制，跟函记录存在虚假记载，未回函项目替代程序执行不到位；营业收入细节测试底稿中部分样本既无货物验收或签收情况的具体检查记录也未获取相关单据，既无货物运输单据的具体检查情况也未获取相关单据；针对出库单及验收单编号、日期、模板等存在的异常情况，未保持应有的职业怀疑，未实施进一步审计程序，未能发现东旭集团虚增营业收入的舞弊行为。\n（三）在采购与付款循环审计中，未对预付账款函证全过程保持必要控制，跟函记录存在虚假记载；未关注付款审批材料的异常情况，对预付单一供应商金额占比过高的异常情况未采取进一步审计程序；存货监盘程序执行不到位，存货监盘底稿存在虚假记载，未对存货的存在性认定获取充分适当的审计证据，未发现东旭集团虚假采购的舞弊行为。\n二、对东旭光电科技股份有限公司（以下称东旭光电）2017至2020年度财务报表审计中，违反多项审计准则的规定，未保持应有的职业怀疑，未履行必要审计程序或审计程序存在重大缺陷，审计工作底稿存在虚假记载，未识别东旭光电虚增收入、利润及资金被占用的重大错报\n有关机关另案查明，\n2017\n至\n2019\n年，东旭光电通过虚构业务等方式进行财务造假，虚增收入分别为\n43.06\n亿元、\n42.90\n亿元、\n26.45\n亿元，虚增利润总额分别为\n13.15\n亿元、\n14.45\n亿元、\n6.35\n亿元。\n2017\n至\n2020\n年，东旭光电以原材料采购等名义，向东旭集团及其关联方提供非经营性资金，发生金额分别为\n16.42\n亿元、\n64.84\n亿元、\n63.68\n亿元、\n6.81\n亿元。\n经查明，中兴财光华对东旭光电\n2017\n至\n2020\n年度财务报表审计中，将收入、预付账款等列为重点审计领域，但在审计过程中存在如下问题：\n（一）对东旭光电及其重要子公司销售业务相关内部控制了解、评价和控制测试不到位。未按计划执行或有效执行部分子公司销售与收款循环内部控制的了解、评价和控制测试程序，对部分重要子公司“客户验收”关键控制点未进行了解、评价和测试，无法得出销售业务相关内部控制设计及运行有效的审计结论。\n（二）在销售与收款循环审计中，对客户函证地址等存在的异常情况未进行核实，对函证过程未保持必要控制；审计报告出具日前未收到个别客户回函，但未执行替代程序；部分未回函项目实施了替代程序，但未获取收入确认的关键证据资料；未充分获取检查销售货物的物流记录、验收资料等与收入确认相关的关键审计证据；对部分销售业务的验收日期早于合同签订日期、出库单编号与日期顺序不一致、不同客户发票的联系电话相同、大额设备销售合同约定一次性付款及无质保金条款等异常情况，未保持应有的职业怀疑，未实施进一步审计程序，未发现东旭光电虚增营业收入的舞弊行为。\n（三）对东旭光电重要子公司芜湖东旭光电装备技术有限公司预付账款业务实施的控制测试、实质性审计程序存在重大缺陷。采购付款业务控制测试中未恰当识别、记录和评价付款审批存在的控制缺陷，对大额预付账款长期挂账、供应商大量及频繁退款、多家重要供应商注册地址相同、不同供应商预付账款催告回复内容及回复时间完全一致、不同供应商函证联系人及地址相同等异常情形，未保持应有的职业怀疑，未设计和实施必要审计程序，未发现预付的大额资金被东旭集团及其关联方占用。\n三、对东旭蓝天新能源股份有限公司（以下称东旭蓝天）2018年度财务报表审计中，违反多项审计准则的规定，未保持应有的职业怀疑，未履行必要审计程序或审计程序存在重大缺陷，未识别东旭蓝天资金被占用的重大错报\n有关机关另案查明，东旭蓝天以预付资金形式被东旭集团占用资金，\n2018\n年发生金额为\n61.89\n亿元，\n2018\n年末，东旭蓝天被东旭集团占用资金余额为\n60.01\n亿元。东旭蓝天在\n2018\n年度财务报告中未披露相关资金占用事项。\n经查明，中兴财光华对东旭蓝天\n2018\n年度财务报表审计中，将货币资金、预付款项等列为重点审计领域，但在审计过程中存在如下问题：\n（一）对预付款项及其他非流动资产的真实合理性及资金占用风险未保持应有的职业怀疑，未恰当检查主要银行账户\nU\n盾的保管和使用情况，对财务印鉴保管情况的了解结论与实际不符，导致未识别东旭蓝天主要银行账户\nU\n盾及财务印鉴实际由东旭集团管控，大额预付资金被东旭集团直接划拨的重大内部控制缺陷。\n（二）对多家大额预付设备款项对应供应商实缴注册资本为\n0\n且参保人数为\n0\n、部分供应商成立当年即与东旭蓝天签订大额预付采购合同、新增大额预付款项涉及的供应商为首次合作的显著异常线索，未充分关注、核实，未充分确认东旭蓝天与上述异常供应商开展重大交易的原因及商业合理性。\n（三）对大额预付设备款项对应的光伏及风电项目未取得备案批复文件、未能提供项目资料、与多家供应商通过反复签订《履约能力测试协议》频繁支付和退回合同预付款等重大异常线索未保持应有的职业怀疑，对相关采购业务的真实性和预付款项合理性未获取充分适当的审计证据。在部分预付股权收购款的函证程序中，未充分关注不同供应商存在联系人相同的重大异常线索，且未回函情况下替代测试程序执行不到位。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、第二款第（四）项、第三款，《会计师事务所审批和监督暂行办法》第五十六条第一款第（一）（五）项，《会计师事务所执业许可和监督管理办法》（\n2017\n年修订、\n2019\n年修订）第六十条第（一）项；不符合《中国注册会计师职业道德守则第\n1\n号——职业道德基本原则》（\n2009\n年修订）第十七条，《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》（\n2010\n年修订、\n2019\n年修订）第二十二条第一款、第二款第（一）（二）项，第二十八条，第三十条，《中国注册会计师审计准则第\n1231\n号——针对评估的重大错报风险采取的应对措施》（\n2010\n年修订、\n2019\n年修订）第八条第（一）项，《中国注册会计师审计准则第\n1301\n号——审计证据》（\n2010\n年修订、\n2016\n年修订）第九条、第十条，《中国注册会计师审计准则第\n1141\n号——财务报表审计中与舞弊相关的责任》（\n2010\n年修订、\n2019\n年修订）第十三条、第二十五条、第二十七条、第三十一条，《中国注册会计师审计准则第\n1312\n号——函证》第十四条第（二）（三）（四）项、第十七条、第十九条等规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款、《会计师事务所审批和监督暂行办法》第六十五条第一款、《会计师事务所执业许可和监督管理办法》（\n2017\n年修订、\n2019\n年修订）第七十条第一款的规定，财政部决定给予你警告、暂停执行业务\n1\n年的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n4\n月\n7\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕65号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260410_3987332.htm", "date": "2026-04-07", "id": "29510c32984675f1ef19aada76891888", "content": "财政部行政处罚决定书（财监法〔2026〕65号）\n财监法〔\n2026\n〕\n65\n号\n财政部行政处罚决定书\n当 事 人：中兴财光华会计师事务所（特殊普通合伙）\n地    址：北京市西城区阜成门外大街\n2\n号\n22\n层\nA24\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于\n2025\n年对你所执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、对东旭集团有限公司（以下称东旭集团）2015至2019年度财务报表审计中，违反多项审计准则的规定，未保持应有的职业怀疑，未履行必要审计程序或审计程序存在重大缺陷，审计工作底稿存在虚假记载，未识别东旭集团虚增收入、虚增虚减利润及虚增货币资金的重大错报\n有关机关另案查明，\n2015\n至\n2019\n年，东旭集团通过虚构业务等方式进行财务造假，虚增收入分别为\n43.76\n亿元、\n96.01\n亿元、\n128.33\n亿元、\n141.49\n亿元、\n68.66\n亿元，虚增\n2015\n至\n2018\n年利润总额分别为\n15.48\n亿元、\n34.15\n亿元、\n47.31\n亿元、\n54.62\n亿元，虚减\n2019\n年利润总额\n21.55\n亿元。\n2015\n至\n2018\n年，东旭集团通过财务不记账、虚假记账等方式，各期末分别虚增货币资金\n79.57\n亿元、\n247.72\n亿元、\n447.90\n亿元、\n337.21\n亿元。\n经查明，你所在东旭集团\n2015\n至\n2019\n年度财务报表审计中，将货币资金、收入、成本等列为重点审计领域，但在审计实施过程中存在如下问题：\n（一）在货币资金审计中，未对东旭集团“存贷双高”的异常情形保持应有的职业怀疑，\n2016\n至\n2018\n年未获取关键银行账户的银行对账单，未有效控制银行函证过程，未发现东旭集团虚增大额银行存款的舞弊行为。\n（二）在销售与收款循环审计中，未充分了解、评价销售与收款循环相关内部控制，未恰当执行控制测试；函证样本选取不到位，未对应收账款函证过程保持控制，跟函记录存在虚假记载，未回函项目替代程序执行不到位；营业收入细节测试底稿中部分样本既无货物验收或签收情况的具体检查记录也未获取相关单据，既无货物运输单据的具体检查情况也未获取相关单据；针对出库单及验收单编号、日期、模板等存在的异常情况，未保持应有的职业怀疑，未实施进一步审计程序，未就收入真实性获取充分适当的审计证据，未发现东旭集团虚增营业收入的舞弊行为。\n（三）在采购与付款循环审计中，未对预付账款函证全过程保持必要控制，跟函记录存在虚假记载；未关注付款审批材料的异常情况，对预付单一供应商金额占比过高的异常情况未采取进一步审计程序；存货监盘程序执行不到位，存货监盘底稿存在虚假记载，未对存货的存在性认定获取充分适当的审计证据，未发现东旭集团虚假采购的舞弊行为。\n二、对东旭光电科技股份有限公司（以下称东旭光电）2015至2020年度财务报表审计中，违反多项审计准则的规定，未保持应有的职业怀疑，未履行必要审计程序或审计程序存在重大缺陷，审计工作底稿存在虚假记载，未识别东旭光电虚增收入、利润及资金被占用的重大错报\n有关机关另案查明，\n2015\n至\n2019\n年，东旭光电通过虚构业务等方式进行财务造假，虚增收入分别为\n18.14\n亿元、\n37.05\n亿元、\n43.06\n亿元、\n42.90\n亿元、\n26.45\n亿元，虚增利润总额分别为\n8.63\n亿元、\n13.69\n亿元、\n13.15\n亿元、\n14.45\n亿元、\n6.35\n亿元。\n2015\n至\n2020\n年，东旭光电以原材料采购等名义，向东旭集团及其关联方提供非经营性资金，发生金额分别为\n22.14\n亿元、\n24.67\n亿元、\n16.42\n亿元、\n64.84\n亿元、\n63.68\n亿元、\n6.81\n亿元。\n经查明，你所在东旭光电\n2015\n至\n2020\n年度财务报表审计中，将收入、预付账款等列为重点审计领域，但在审计实施过程中存在如下问题：\n（一）对东旭光电及其重要子公司销售业务相关内部控制了解、评价和控制测试不到位。未按计划执行或有效执行部分子公司销售与收款循环内部控制的了解、评价和控制测试程序，对部分重要子公司“客户验收”关键控制点未进行了解、评价和测试，无法得出销售业务相关内部控制设计及运行有效的审计结论。\n（二）在销售与收款循环审计中，对客户函证地址等存在的异常情况未进行核实，对函证过程未保持必要控制；审计报告出具日前未收到个别客户回函，但未执行替代程序；部分未回函项目实施了替代程序，但未获取收入确认的关键证据资料。未充分获取、检查销售货物的物流记录、验收资料等与收入确认相关的关键审计证据；对部分销售业务的客户验收日期早于合同签订日期、出库单编号与日期顺序不一致、不同客户发票的联系电话相同、大额设备销售合同约定一次性付款及无质保金条款等异常情况，未保持应有的职业怀疑，未实施进一步审计程序，未发现东旭光电虚增营业收入的舞弊行为。\n（三）对东旭光电重要子公司芜湖东旭光电装备技术有限公司预付账款业务实施的控制测试、实质性审计程序存在重大缺陷。采购付款业务控制测试中未恰当识别、记录和评价付款审批存在的控制缺陷；未充分核实对部分供应商大额预付账款发生额的合理性；未对预付账款函证过程保持必要控制；对大额预付账款长期挂账、供应商大量及频繁退款、多家重要供应商注册地址相同、不同供应商预付账款催告回复内容及回复时间完全一致、不同供应商函证联系人及地址相同等异常情况，未保持应有的职业怀疑，未设计和实施必要审计程序，未发现预付的大额资金被东旭集团及其关联方占用。\n三、对东旭蓝天新能源股份有限公司（以下称东旭蓝天）2018至2020年度财务报表审计中，违反多项审计准则的规定，未保持应有的职业怀疑，未履行必要审计程序或审计程序存在重大缺陷，未识别东旭蓝天资金被占用的重大错报\n有关机关另案查明，东旭蓝天以预付资金形式被东旭集团占用资金，\n2018\n至\n2020\n年发生金额分别为\n61.89\n亿元、\n19.34\n亿元、\n1.23\n亿元，\n2018\n至\n2020\n年末，东旭蓝天被东旭集团占用资金余额分别为\n60.01\n亿元、\n76.86\n亿元、\n78.09\n亿元。东旭蓝天在\n2018\n至\n2020\n年的财务报告中均未披露相关资金占用事项。\n经查明，你所在东旭蓝天\n2018\n至\n2020\n年度财务报表审计中，将货币资金、预付款项等列为重点审计领域，但在审计过程中存在如下问题：\n（一）对预付款项及其他非流动资产的真实合理性及资金占用风险未保持应有的职业怀疑，未恰当检查主要银行账户\nU\n盾的保管和使用情况，对财务印鉴保管情况的了解结论与实际不符，导致未识别东旭蓝天主要银行账户\nU\n盾及财务印鉴实际由东旭集团管控，大额预付资金被东旭集团直接划拨的重大内部控制缺陷。\n（二）对多家大额预付设备款项对应供应商实缴注册资本为\n0\n且参保人数为\n0\n、部分供应商成立当年即与东旭蓝天签订大额预付采购合同、新增大额预付款项涉及的供应商为首次合作的显著异常线索，未充分关注、核实，未充分确认东旭蓝天与上述异常供应商开展重大交易的原因及商业合理性。\n（三）对大额预付设备款项对应的光伏及风电项目长期未取得备案批复文件、未能提供项目资料、部分光伏及风电项目长期未开工、与多家供应商通过反复签订《履约能力测试协议》频繁支付和退回合同预付款、部分大额预付设备款项供应商在收款\n1-2\n年内注销且未退回预付款等重大异常线索，未保持应有的职业怀疑，对相关采购业务的真实性和预付款项合理性未获取充分适当的审计证据。在部分预付股权收购款的函证程序中，未充分关注不同供应商存在函证联系人相同的异常情况，且未回函情况下替代测试程序执行不到位。\n四、未指出遵义市汇川区娄海情旅游发展投资有限公司（以下称娄海情公司）2023年、2024年通过虚构代建业务虚增收入及利润的重大错报\n娄海情公司基于债券市场公开披露报表统计收入等需要，在中共遵义市汇川区委党校基础设施建设项目（以下称区委党校项目）已完工的情况下，与控股股东遵义经济技术开发区新兴产业投资有限公司（以下称产投公司）签订了落款日期为\n2022\n年\n12\n月的代建协议，并根据产投公司出具的工程进度结算单，\n2023\n年、\n2024\n年分别确认代建收入\n34344.61\n万元、\n34488.78\n万元，占当期营业收入比例分别为\n95.02%\n、\n92.79%\n，分别确认利润\n5724.10\n万元、\n5748.13\n万元。区委党校项目实际于\n2021\n年完工、\n2022\n年\n8\n月项目开始合作运营，\n2022\n年\n11\n月项目法人变更为产投公司。娄海情公司通过虚构代建业务，\n2023\n年虚增代建收入\n34344.61\n万元、虚增利润\n5724.10\n万元，\n2024\n年虚增代建收入\n34488.78\n万元、虚增利润\n5748.13\n万元。\n你所在娄海情公司\n2023\n年度、\n2024\n年度财务报表审计中，关注到娄海情公司在上述项目完工后虚构代建业务而未予指明，未指出相关重大错报。\n五、职业判断错误，未指出汉嘉设计集团股份有限公司（现更名为汉嘉数智科技集团股份有限公司，以下称汉嘉设计）2023年、2024年总承包联合体业务应按未按净额法确认收入的重大错报\n汉嘉设计\n2024\n年对“大关单元\nGS0507-R21-01\n地块八丈井东片安置房及\nGS0507-G1/S42-30\n地块绿地兼社会停车场设计\n-\n采购\n-\n施工（\nEPC\n）总承包项目”等\n6\n个\nEPC\n联合体项目，\n2023\n年对\n9\n个\nEPC\n联合体项目采用总额法按履约进度确认收入，上述项目由汉嘉设计联合施工单位组成联合体共同投标并提供服务，联合体协议明确了各自的工作内容、权利义务和合同价款，汉嘉设计负责设计，未主导采购和施工服务，未承担采购和施工服务的主要责任，只收取设计费、管理费，无法自主决定整个项目报价。汉嘉设计作为联合体牵头方，对上述项目中的采购和施工部分仅承担连带责任，不符合总额法确认收入的相关条件，应按净额法确认收入，导致\n2024\n年多计收入\n29263.91\n万元、多计成本\n29263.91\n万元，\n2023\n年多计收入\n89483.87\n万元、多计成本\n89483.87\n万元。\n你所在汉嘉设计\n2023\n年度、\n2024\n年度财务报表审计中，未准确判断汉嘉设计上述\nEPC\n联合体业务收入确认方法的恰当性，未指出相关收入应按未按净额法确认收入的重大错报。\n六、对黑龙江北大荒牧业营销有限公司（以下称北大荒牧业营销公司）2023年部分贸易业务的异常情况未履行必要的审计程序，未识别相关收入成本的重大错报\n北大荒牧业营销公司\n2023\n年开展的部分贸易业务不具有商业实质，\n2023\n年虚增收入\n23642.14\n万元，虚增成本\n23608.17\n万元，虚增利润\n33.97\n万元。\n你所在北大荒牧业营销公司\n2023\n年度财务报表审计中，知悉北大荒牧业营销公司收入主要为贸易收入的情况下，未充分关注采购订单与销售订单存在严格对应关系、无真实仓储物流和过磅记录等异常情况，未核实相关贸易收入的真实性，未识别北大荒牧业营销公司\n2023\n年虚增收入、成本、利润的重大错报。\n七、在派斯林数字科技股份有限公司（以下称派斯林）2024年度财务报表审计中，对部分项目预计合同总金额未获取充分、适当的审计证据，未指出多计营业收入及合同资产1905.74万元的重大错报\n派斯林对“北京福田戴姆勒\nA6\n分拼线整包项目”等\n3\n个项目采用时段法确认收入，相关项目合同为固定金额合同，在未签订增补合同，也尚未与客户就增补达成一致的情况下，按照预计增补后的总金额作为基数确认收入，导致\n2024\n年度多计营业收入及合同资产\n1905.74\n万元。\n你所在派斯林\n2024\n年度财务报表审计中，未获取上述\n3\n个项目的增补合同或其他有效证据，未基于已获取的不含税合同金额重新计算\n2024\n年度应确认的收入，未指出派斯林测算进度收入的基数与已签订合同金额存在不符导致的重大错报。\n八、未指出山东中评恒信资产评估有限公司（现更名为山东中评恒信土地房地产资产评估有限公司，以下称中评恒信）2024年度财务报表数据汇总范围不准确导致的重大错报，发表不恰当的审计意见\n中评恒信\n2024\n年将与其无股权投资关系的北京天健兴业资产评估有限公司山东分公司营业收入、营业成本纳入其\n2024\n年度利润表，导致中评恒信\n2024\n年度财务报表数据汇总范围不准确，多计收入\n574.48\n万元，占营业收入比例\n33.31%\n；多计成本\n496.53\n万元，占营业成本比例\n32.85%\n。\n你所对中评恒信\n2024\n年度财务报表审计中，未指出中评恒信财务报表数据汇总范围不准确导致的重大错报，发表不恰当的审计意见。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、第二款第（一）（四）项、第三款，第三十一条，《会计师事务所审批和监督暂行办法》第五十六条第一款第（一）（五）项，《会计师事务所执业许可和监督管理办法》（\n2017\n年修订、\n2019\n年修订）第六十条第（一）（三）（七）项；不符合《中国注册会计师职业道德守则第\n1\n号——职业道德基本原则》（\n2009\n年修订）第十七条，《中国注册会计师职业道德守则第\n1\n号——职业道德基本原则》（\n2020\n年修订）第七条第（二）（四）项，《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》（\n2010\n年修订、\n2019\n年修订、\n2022\n年修订）第二十二条第一款、第二款第（一）（二）项\n，\n第二十八条\n，\n第三十条，《中国注册会计师审计准则第\n1231\n号——针对评估的重大错报风险采取的应对措施》（\n2010\n年修订、\n2019\n年修订）第八条第（一）项，《中国注册会计师审计准则第\n1301\n号——审计证据》（\n2010\n年修订、\n2016\n年修订、\n2022\n年修订）第九条、第十条，《中国注册会计师审计准则第\n1141\n号——财务报表审计中与舞弊相关的责任》（\n2010\n年修订、\n2019\n年修订、\n2022\n年修订）第十三条、第二十五条、第二十七条、第三十一条，《中国注册会计师审计准则第\n1312\n号——函证》第十四条第（二）（三）（四）项、第十七条、第十九条，《中国注册会计师审计准则第\n1501\n号——对财务报表形成审计意见和出具审计报告》第十八条第（一）项等规定。\n依据《中华人民共和国注册会计师法》第三十九条第一款，《会计师事务所审批和监督暂行办法》第六十四条，《会计师事务所执业许可和监督管理办法》（\n2017\n年修订、\n2019\n年修订）第六十七条第一款、第二款的规定，财政部决定给予你所以下行政处罚：\n1.\n警告；\n2.\n暂停经营业务\n1\n年；\n3.\n鉴于中国证监会河北监管局依据《中华人民共和国证券法》对你所相关违法行为给予没收业务收入\n3258.49\n万元、并处罚款\n21018.74\n万元的行政处罚，按照《中华人民共和国行政处罚法》第二十九条的规定，财政部不再另行对你所东旭集团、东旭光电、东旭蓝天相关年度财务报表审计项目违法行为给予罚没款的行政处罚。\n4.\n没收娄海情公司\n2023\n年度、\n2024\n年度财务报表审计项目违法所得\n53\n万元，并处罚款\n159\n万元。\n5.\n没收汉嘉设计\n2023\n年度、\n2024\n年度财务报表审计项目违法所得\n268\n万元，并处罚款\n268\n万元。\n6.\n没收北大荒牧业营销公司\n2023\n年度财务报表审计项目违法所得\n10\n万元。\n7.\n没收派斯林\n2024\n年度财务报表审计项目违法所得\n163\n万元。\n8.\n没收中评恒信\n2024\n年度财务报表审计项目违法所得\n3000\n元。\n你所应在收到本处罚决定书之日起十五日内与财政部北京监管局联系，凭财政部北京监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n4\n月\n7\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕94号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260410_3987321.htm", "date": "2026-04-07", "id": "bd85ae9ef46cf8f0bada010015ebb3c9", "content": "财政部行政处罚决定书（财监法〔2026〕94号）\n财监法〔\n2026\n〕\n94\n号\n财政部行政处罚决定书\n当 事 人：李晓艳\n地    址：北京市西城区阜成门外大街\n2\n号\n22\n层\nA24\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于\n2025\n年对中兴财光华会计师事务所（特殊普通合伙）（以下称中兴财光华）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n2024\n年，山东中评恒信资产评估有限公司（现更名为山东中评恒信土地房地产资产评估有限公司，以下称中评恒信）将与其无股权投资关系的北京天健兴业资产评估有限公司山东分公司营业收入、营业成本纳入其\n2024\n年度利润表，导致中评恒信\n2024\n年度财务报表数据汇总范围不准确，多计收入\n574.48\n万元，占营业收入比例\n33.31%\n；多计成本\n496.53\n万元，占营业成本比例\n32.85%\n。\n中兴财光华在中评恒信\n2024\n年度财务报表审计中，未指出财务报表数据汇总范围不准确导致的重大错报，发表不恰当的审计意见。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、第二款第（四）项、第三款；不符合《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》第二十八条等规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，财政部决定给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n4\n月\n7\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕93号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260410_3987319.htm", "date": "2026-04-07", "id": "1c85736b9a0f806653136d98eb5b620f", "content": "财政部行政处罚决定书（财监法〔2026〕93号）\n财监法〔\n2026\n〕\n93\n号\n财政部行政处罚决定书\n当 事 人：\n李兆春\n地    址：北京市西城区阜成门外大街\n2\n号\n22\n层\nA24\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于\n2025\n年对中兴财光华会计师事务所（特殊普通合伙）（以下称中兴财光华）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n2024\n年，山东中评恒信资产评估有限公司（现更名为山东中评恒信土地房地产资产评估有限公司，以下称中评恒信）将与其无股权投资关系的
