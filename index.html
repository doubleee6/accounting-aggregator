认方法的恰当性，未指出相关收入应按未按净额法确认收入的重大错报。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、第二款第（一）项、第三款，《会计师事务所执业许可和监督管理办法》第六十条第（一）项；不符合《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》第二十二条第一款、第二款第（一）（二）项、第二十八条、第二十九条，《中国注册会计师审计准则第\n1301\n号——审计证据》第十条等规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款、《会计师事务所执业许可和监督管理办法》第七十条第一款的规定，财政部决定给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n4\n月\n7\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕80号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260410_3987313.htm", "date": "2026-04-07", "id": "8fbcc9a1a07f8c7f14c83e58ea65f5e5", "content": "财政部行政处罚决定书（财监法〔2026〕80号）\n财监法〔\n2026\n〕\n80\n号\n财政部行政处罚决定书\n当 事 人：郑周坤\n地    址：北京市西城区阜成门外大街\n2\n号\n22\n层\nA24\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于\n2025\n年对中兴财光华会计师事务所（特殊普通合伙）（以下称中兴财光华）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n汉嘉设计集团股份有限公司（现更名为汉嘉数智科技集团股份有限公司，以下称汉嘉设计）\n2024\n年对“大关单元\nGS0507-R21-01\n地块八丈井东片安置房及\nGS0507-G1/S42-30\n地块绿地兼社会停车场设计\n-\n采购\n-\n施工（\nEPC)\n总承包项目”等\n6\n个\nEPC\n联合体项目采用总额法按履约进度确认收入，上述项目由汉嘉设计联合施工单位组成联合体共同投标并提供服务，联合体协议明确了各自的工作内容、权利义务和合同价款，汉嘉设计负责设计，未主导采购和施工服务，未承担采购和施工服务的主要责任，只收取设计费、管理费，无法自主决定整个项目报价。汉嘉设计作为联合体牵头方，对上述项目中的采购和施工部分仅承担连带责任，不符合总额法确认收入的相关条件，应按净额法确认收入，导致\n2024\n年多计收入\n29263.91\n万元、多计成本\n29263.91\n万元。\n中兴财光华在汉嘉设计\n2024\n年度财务报表审计中，未准确判断汉嘉设计上述\nEPC\n联合体业务收入确认方法的恰当性，未指出相关收入应按未按净额法确认收入的重大错报。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、第二款第（一）项、第三款，《会计师事务所执业许可和监督管理办法》第六十条第（一）项；不符合《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》第二十二条第一款、第二款第（一）（二）项、第二十八条、第二十九条，《中国注册会计师审计准则第\n1301\n号——审计证据》第十条等规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款、《会计师事务所执业许可和监督管理办法》第七十条第一款的规定，财政部决定给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n4\n月\n7\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕79号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260410_3987312.htm", "date": "2026-04-07", "id": "5c88dc1b357dad679f8aae70aea41b66", "content": "财政部行政处罚决定书（财监法〔2026〕79号）\n财监法〔\n2026\n〕\n79\n号\n财政部行政处罚决定书\n当 事 人：许洪磊\n地    址：北京市西城区阜成门外大街\n2\n号\n22\n层\nA24\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于\n2025\n年对中兴财光华会计师事务所（特殊普通合伙）（以下称中兴财光华）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n汉嘉设计集团股份有限公司（现更名为汉嘉数智科技集团股份有限公司，以下称汉嘉设计）\n2024\n年对“大关单元\nGS0507-R21-01\n地块八丈井东片安置房及\nGS0507-G1/S42-30\n地块绿地兼社会停车场设计\n-\n采购\n-\n施工（\nEPC\n）总承包项目”等\n6\n个\nEPC\n联合体项目，\n2023\n年对\n9\n个\nEPC\n联合体项目采用总额法按履约进度确认收入，上述项目由汉嘉设计联合施工单位组成联合体共同投标并提供服务，联合体协议明确了各自的工作内容、权利义务和合同价款，汉嘉设计负责设计，未主导采购和施工服务，未承担采购和施工服务的主要责任，只收取设计费、管理费，无法自主决定整个项目报价。汉嘉设计作为联合体牵头方，对上述项目中的采购和施工部分仅承担连带责任，不符合总额法确认收入的相关条件，应按净额法确认收入，导致\n2024\n年多计收入\n29263.91\n万元、多计成本\n29263.91\n万元，\n2023\n年多计收入\n89483.87\n万元、多计成本\n89483.87\n万元。\n中兴财光华在汉嘉设计\n2023\n年度、\n2024\n年度财务报表审计中，未准确判断汉嘉设计上述\nEPC\n联合体业务收入确认方法的恰当性，未指出相关收入应按未按净额法确认收入的重大错报。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、第二款第（一）项、第三款，《会计师事务所执业许可和监督管理办法》第六十条第（一）项；不符合《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》第二十二条第一款、第二款第（一）（二）项、第二十八条、第二十九条，《中国注册会计师审计准则第\n1301\n号——审计证据》第十条等规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款、《会计师事务所执业许可和监督管理办法》第七十条第一款的规定，财政部决定给予你警告、暂停执行业务\n1\n个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n4\n月\n7\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕74号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260410_3987311.htm", "date": "2026-04-07", "id": "c0cdc34851408e775570ea3464c41002", "content": "财政部行政处罚决定书（财监法〔2026〕74号）\n财监法〔\n2026\n〕\n74\n号\n财政部行政处罚决定书\n当 事 人：李一鸣\n地    址：北京市西城区阜成门外大街\n2\n号\n22\n层\nA24\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于\n2025\n年对中兴财光华会计师事务所（特殊普通合伙）（以下称中兴财光华）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n遵义市汇川区娄海情旅游发展投资有限公司（以下称娄海情公司）基于债券市场公开披露报表统计收入等需要，在中共遵义市汇川区委党校基础设施建设项目（以下称区委党校项目）已完工的情况下，与控股股东遵义经济技术开发区新兴产业投资有限公司（以下称产投公司）签订了落款日期为\n2022\n年\n12\n月的代建协议，并根据产投公司出具的工程进度结算单，\n2023\n年、\n2024\n年分别确认代建收入\n34344.61\n万元、\n34488.78\n万元，占当期营业收入比例分别为\n95.02%\n、\n92.79%\n，分别确认利润\n5724.10\n万元、\n5748.13\n万元。区委党校项目实际于\n2021\n年完工、\n2022\n年\n8\n月项目开始合作运营，\n2022\n年\n11\n月项目法人变更为产投公司。娄海情公司通过虚构代建业务，\n2023\n年虚增代建收入\n34344.61\n万元、虚增利润\n5724.10\n万元，\n2024\n年虚增代建收入\n34488.78\n万元、虚增利润\n5748.13\n万元。\n中兴财光华在娄海情公司\n2023\n年度、\n2024\n年度财务报表审计中，关注到娄海情公司在上述项目完工后虚构代建业务而未予指明，未指出相关重大错报。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第二款第（四）项、第三款；不符合《中国注册会计师审计准则第\n1301\n号——审计证据》第十条等规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，财政部决定给予你警告、暂停执行业务\n6\n个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n4\n月\n7\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕73号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260410_3987310.htm", "date": "2026-04-07", "id": "01300a9df82cab563d8f00941d1d8fe4", "content": "财政部行政处罚决定书（财监法〔2026〕73号）\n财监法〔\n2026\n〕\n73\n号\n财政部行政处罚决定书\n当 事 人：尹盘林\n地    址：北京市西城区阜成门外大街\n2\n号\n22\n层\nA24\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于\n2025\n年对中兴财光华会计师事务所（特殊普通合伙）（以下称中兴财光华）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n遵义市汇川区娄海情旅游发展投资有限公司（以下称娄海情公司）基于债券市场公开披露报表统计收入等需要，在中共遵义市汇川区委党校基础设施建设项目（以下称区委党校项目）已完工的情况下，与控股股东遵义经济技术开发区新兴产业投资有限公司（以下称产投公司）签订了落款日期为\n2022\n年\n12\n月的代建协议，并根据产投公司出具的工程进度结算单，\n2023\n年、\n2024\n年分别确认代建收入\n34344.61\n万元、\n34488.78\n万元，占当期营业收入比例分别为\n95.02%\n、\n92.79%\n，分别确认利润\n5724.10\n万元、\n5748.13\n万元。区委党校项目实际于\n2021\n年完工、\n2022\n年\n8\n月项目开始合作运营，\n2022\n年\n11\n月项目法人变更为产投公司。娄海情公司通过虚构代建业务，\n2023\n年虚增代建收入\n34344.61\n万元、虚增利润\n5724.10\n万元，\n2024\n年虚增代建收入\n34488.78\n万元、虚增利润\n5748.13\n万元。\n中兴财光华在娄海情公司\n2023\n年度、\n2024\n年度财务报表审计中，关注到娄海情公司在上述项目完工后虚构代建业务而未予指明，未指出相关重大错报。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第二款第（四）项、第三款；不符合《中国注册会计师审计准则第\n1301\n号——审计证据》第十条等规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，财政部决定给予你警告、暂停执行业务\n6\n个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026\n年\n4\n月\n7\n日"}, {"source": "内部审计", "category": "论坛讨论", "title": "内部审计书籍推荐4：《内审修行与实战——案例故事篇》", "url": "https://bbs.esnai.cn/thread-5496612-1-1.html", "date": "2026-04-02", "content": "内部审计书籍推荐4：《内审修行与实战——案例故事篇》 前言除部分讲述审计理念的寓言故事外，本书案例和故事，原型基本是审计过程中遇到的现实事件。主旨：通过案例和故事，详细地、趣味性地讲述具体审计过程，让读者拥有沉浸式的观察过程，每一则案例故事，都包含一定 ...", "id": "cf4bc739fc035f0407a3bacc9f9d1049"}, {"source": "内部审计", "category": "论坛讨论", "title": "内部审计书籍推荐3：《内审修行与实战——职场生存篇》", "url": "https://bbs.esnai.cn/thread-5496611-1-1.html", "date": "2026-04-02", "content": "内部审计书籍推荐3：《内审修行与实战——职场生存篇》 前言本书以一线内审工作者的视角来讲述：有什么样的职场环境？会遇到哪些困惑与问题？会碰到哪些雷区与陷阱？需要哪些审计理念与生存技巧？审计创新及企业管理相关问题等等。并讲述相应的解决策略与方法，让读者了 ...", "id": "4d872a0b4dbac25163cb0493fb29e5c3"}, {"source": "内部审计", "category": "论坛讨论", "title": "内部审计书籍推荐2：《内审修行与实战——知识技能篇》", "url": "https://bbs.esnai.cn/thread-5496610-1-1.html", "date": "2026-04-02", "content": "内部审计书籍推荐2：《内审修行与实战——知识技能篇》 前言本书针对审计思想、方法、技能、知识、技巧等方面进行拆解与打磨，精讲：怎么开展审计工作？本书所述知识、技能、思想与传统书籍不尽一样，跳过常见的基础知识技能，重点围绕“实战化”细述。主讲：作为内审 ...", "id": "8fe4823f2cc888d1474f4997bf695fa6"}, {"source": "内部审计", "category": "论坛讨论", "title": "内部审计书籍推荐1：《内审修行与实战—实务干货篇》", "url": "https://bbs.esnai.cn/thread-5496609-1-1.html", "date": "2026-04-02", "content": "内部审计书籍推荐1：《内审修行与实战—实务干货篇》 前言全书只有一个宗旨，亦是内审同行共同的痛点：怎样才能审出东西来？一切从实际需求出发！不引经据典、不抄袭专业书籍，也不讲废话，只说干货，所有内容均来自一线内审工作者的实战经验与心得。内容结构比较简单： ...", "id": "15d881af1526777f7e78f8df89cf43f3"}, {"source": "内部审计", "category": "论坛讨论", "title": "内部审计书籍，4本实战性内审专著终于落地了", "url": "https://bbs.esnai.cn/thread-5496608-1-1.html", "date": "2026-04-02", "content": "内部审计书籍，4本实战性内审专著终于落地了1.早就想出本书了做内审工作已有一二十年了，记忆犹新的还是刚入行那会儿。什么都不懂，到处碰壁，一直希望能得到一位前辈或一本内审书指导，也不至于天天焦虑，不知所措？可市面上大多内部审计图书，只有形，没有意。就算把 ...", "id": "b39748cbc2ee904c4a7487ca1b17cce3"}, {"source": "国家税务局", "category": "留言咨询", "title": "我们是一家制造公司，2025年11月签订合同时采购方就提前一次性预付了全额货款。2026年2月我们按约定发货交付了设备并经验收合格，那这笔货款我们该确认2025年度的企业所得税收入，还是2026年度的？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5248548/content.html", "date": "2026-03-27", "id": "9f25c4875a4e1078cf700d9cfafda875", "content": "答：\n应当在货物发出时确认收入，即2026年。\n根据《中华人民共和国企业所得税法实施条例》第九条规定，企业应纳税所得额的计算，以权责发生制为原则，属于当期的收入和费用，无论款项是否收付，均作为当期的收入和费用；不属于当期的收入和费用，即使款项已经在当期收付，均不作为当期的收入和费用。\n依据《国家税务总局关于确认企业所得税收入若干问题的通知》（国税函〔2008〕875号）第一条规定：企业销售收入的确认必须遵循权责发生制原则和实质重于形式原则。企业销售商品同时满足下列条件的，应确认收入的实现：一是商品销售合同已经签订，企业已将商品所有权上的主要风险和报酬转移给购货方；二是企业对已售出的商品既没有保留通常与所有权相联系的继续管理权，也没有实施有效控制；三是收入的金额能够可靠地计量；四是已发生或将发生的销售方的成本能够可靠地核算。符合上款收入确认条件，销售商品采取预收款方式的，在发出商品时确认收入。\n结合您公司的情况，2025年11月只是收到预收款，2026年2月完成发货交付并验收合格，因此这笔预收货款应确认为2026年度的企业所得税收入。"}, {"source": "内部审计", "category": "论坛讨论", "title": "我的跨行业转行内审之路（二）", "url": "https://bbs.esnai.cn/thread-5496346-1-1.html", "date": "2026-03-12", "content": "今天突然想起10多年前发的这个贴我的跨行业转行内审之路 https://bbs.esnai.com/thread-5021615-1-1.html (出处: 中国会计视野论坛) 好像不能回复更新了，大家有兴趣蹲个后续么", "id": "9a811cb77c9041467328221941fc15e1"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕61号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202603/t20260324_3986039.htm", "date": "2026-03-03", "id": "3a1c3c5e6cb36203f9971850759898ab", "content": "财政部行政处罚决定书（财监法〔2026〕61号）\n财监法〔2026〕61 号\n财政部行政处罚\n决定书\n当 事 人：汤丽丽\n地      址：北京市西城区\n根据《中华人民共和国资产评估法》等法律的规定，财政部组织检查组于2025年对北京百汇方兴资产评估有限公司（以下称百汇方兴）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、检查发现的主要问题\n百汇方兴出具的京百汇评字(2024)第D-1084号\n资产评估报告\n存在以下问题：\n1.该报告的评估目的是资产减值测试，正确的价值类型应为“可回收金额”。资产评估专业人员选用与评估目的不符的“市场价值”作为价值类型，且在评估结果低于账面价值的情况下，未根据相关准则规定采取另外一种方法进一步计算，并与账面价值进行比较。\n2.资产减值测试评估应采用预计未来现金流量现值或公允价值减去处置费用计算资产可回收金额，但资产评估专业人员采用“企业自由现金流量”计算资产可回收金额，不符合资产减值测试评估的相关规定。\n3.未来资本性支出计算错误导致差异金额4,947.90万元（在其他条件不变的情况下，造成低估），差异率12.16%。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等证据予以证实。\n二、行政处罚决定\n依据《资产评估行业财政监督管理办法》第四十六条，财政部认定上述事项不符合《资产评估基本准则》第八条第一项、第二项,《以财务报告为目的的评估指南》第五条、第十八条、第十九条第一款第一项，构成重大遗漏，违反了《中华人民共和国资产评估法》第十四条第七项等有关规定。\n你作为上述评估报告的签字资产评估师，对上述问题负有责任。依据《中华人民共和国资产评估法》第四十四条第五项的规定，财政部决定给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财 政 部\n2026年3月3日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕60号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202603/t20260324_3986037.htm", "date": "2026-03-03", "id": "d47df9f7dca40c71437db562839173fd", "content": "财政部行政处罚决定书（财监法〔2026〕60号）\n财监法〔2026〕60 号\n财政部行政处罚\n决定书\n当 事 人：冯彦朋\n地      址：北京市西城区\n根据《中华人民共和国资产评估法》等法律的规定，财政部组织检查组于2025年对北京百汇方兴资产评估有限公司（以下称百汇方兴）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、检查发现的主要问题\n百汇方兴出具的京百汇评报字(2024)第A-269号\n资产评估报告\n存在以下问题：\n1.计算现金流量时，应扣未扣新能源充换电经营权对应的建设项目固定资产投资160,698.26万元，该错误导致评估结论严重高估。\n2.未区分无形资产与其他资产所获得的收益。资产评估专业人员将新能源充换电建设项目产生的预期收益，全部归为无形资产获得的收益。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等证据予以证实。\n二、行政处罚决定\n依据《资产评估行业财政监督管理办法》第四十六条，财政部认定上述事项不符合《资产评估执业准则——无形资产》第六条、第二十二条第二项，构成重大遗漏，违反了《中华人民共和国资产评估法》第十四条第七项等有关规定。\n你作为上述评估报告的签字资产评估师，对上述问题负有责任。依据《中华人民共和国资产评估法》第四十四条第五项的规定，财政部决定给予你警告、责令停止从业九个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财 政 部\n2026年3月3日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕59号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202603/t20260324_3986035.htm", "date": "2026-03-03", "id": "5615a8b66779ad4ed5fb4169b5979edc", "content": "财政部行政处罚决定书（财监法〔2026〕59号）\n财监法〔2026〕59 号\n财政部行政处罚\n决定书\n当 事 人：路杨\n地      址：北京市西城区\n根据《中华人民共和国资产评估法》等法律的规定，财政部组织检查组于2025年对北京百汇方兴资产评估有限公司（以下称百汇方兴）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、检查发现的主要问题\n百汇方兴出具的京百汇评报字(2024)第A-269号\n资产评估报告\n存在以下问题：\n1.计算现金流量时，应扣未扣新能源充换电经营权对应的建设项目固定资产投资160,698.26万元，该错误导致评估结论严重高估。\n2.未区分无形资产与其他资产所获得的收益。资产评估专业人员将新能源充换电建设项目产生的预期收益，全部归为无形资产获得的收益。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等证据予以证实。\n二、行政处罚决定\n依据《资产评估行业财政监督管理办法》第四十六条，财政部认定上述事项不符合《资产评估执业准则——无形资产》第六条、第二十二条第二项，构成重大遗漏，违反了《中华人民共和国资产评估法》第十四条第七项等有关规定。\n你作为上述评估报告的签字资产评估师，对上述问题负有责任。依据《中华人民共和国资产评估法》第四十四条第五项的规定，财政部决定给予你警告、责令停止从业九个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财 政 部\n2026年3月3日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕58号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202603/t20260324_3986024.htm", "date": "2026-03-03", "id": "fd20fbd4ce2978ea60267058735bd2d4", "content": "财政部行政处罚决定书（财监法〔2026〕58号）\n财监法〔\n202\n6\n〕\n58\n号\n财政部行政处罚\n决定书\n当 事 人：北京百汇方兴资产评估有限公司\n地      址：北京市西城区广安门外大街\n168\n号朗琴国际\nB\n座\n919\n室\n根据《中华人民共和国资产评估法》等法律的规定，财政部组织检查组于\n2025\n年对你公司执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、检查发现的主要问题\n（一）你公司出具的京百汇评报字\n(2024)\n第\nA-269\n号\n资产评估报告\n存在以下问题：\n1.\n计算现金流量时，应扣未扣新能源充换电经营权对应的建设项目固定资产投资\n160,698.26\n万元，该错误导致评估结论严重高估。\n2.\n未区分无形资产与其他资产所获得的收益。你公司资产评估专业人员将新能源充换电建设项目产生的预期收益，全部归为无形资产获得的收益。\n（二）你公司出具的京百汇评字\n(2024)\n第\nD-1084\n号\n资产评估报告\n存在以下问题：\n1.\n该报告的评估目的是资产减值测试，正确的价值类型应为“可回收金额”。你公司资产评估专业人员选用与评估目的不符的“市场价值”作为价值类型，且在评估结果低于账面价值的情况下，未根据相关准则规定采取另外一种方法进一步计算，并与账面价值进行比较。\n2.\n资产减值测试评估应采用预计未来现金流量现值或公允价值减去处置费用计算资产可回收金额，但你公司资产评估专业人员采用“企业自由现金流量”计算资产可回收金额，不符合资产减值测试评估的相关规定。\n3.\n未来资本性支出计算错误导致差异金额\n4,947.90\n万元（在其他条件不变的情况下，造成低估），差异率\n12.16%\n。\n（三）以资产评估师名义签署其未实质承办业务的资产评估报告。\n2024\n年度，你公司以\n李某等\n3\n名\n资产评估师的名义签署其未实质承办业务的资产评估报告，共涉及\n37\n份评估报告，收费合计\n157.22\n万元。\n（四）将资产评估项目委托给无评估资质的企业和个体户。\n你公司将\n6\n个资产评估项目分别委托给\n2\n家无评估资质的企业（涉及\n3\n个项目，你公司收费\n65\n万元，支付委托费\n52\n万元）和\n1\n户个体工商户（涉及\n3\n个项目，你公司收费\n75\n万元，支付委托费\n75\n万元）进行“全面评估服务”。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等证据予以证实。\n二、行政处罚决定\n依据《资产评估行业财政监督管理办法》第四十六条，财政部认定上述事项（一）（二）不符合《资产评估基本准则》第八条第一项、第二项，《资产评估执业准则——无形资产》第六条、第二十二条第二项，《以财务报告为目的的评估指南》第五条、第十八条、第十九条第一款第一项，构成重大遗漏，违反了《中华人民共和国资产评估法》第二十条第六项等规定。\n依据《中华人民共和国资产评估法》第二十条第七项、第二十七条第一款，财政部认定你公司\n以未实质承办业务的\n资产评估师名义\n签署\n37\n份资产评估报告\n，属于“聘用或\n指定不符合本法规定的人员从事评估业务\n”的行为。\n依据《中华人民共和国资产评估法》第二十条第七项，财政部认定你公司将\n6\n个资产评估项目委托给\n2\n家无评估资质的企业和\n1\n户个体工商户进行\n“\n全面评估服务\n”，属于“聘用或指定不符合本法规定的人员从事评估业务”的行为。\n依据《中华人民共和国资产评估法》第四十七条第一款第六项、第八项的规定，财政部决定给予你公司警告、责令停业六个月、没收第\nA-269\n号报告项目违法所得\n146,666.67\n元并处罚款\n440,000.00\n元、没收以资产评估师名义签署其未实质承办业务的\n37\n份资产评估报告（包含第\nD-1084\n号报告）违法所得\n1,572,200.00\n元并处罚\n款\n4,716,600.00\n元、没收案涉\n6\n个委托给无评估资质企业和个体户的资产评估项目违法所得\n1,400,000.00\n元并处罚款\n4,200,000.00\n元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部北京监管局联系，凭财政部北京监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将违法所得和罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财 政 部\n202\n6\n年\n3\n月\n3\n日"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司收到了一张进项发票但无法抵扣，经查询发现该发票已被红冲，可开票方红冲时并未告知我公司，如何防范开票方擅自红冲呢？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5247967/content.html", "date": "2026-03-02", "id": "e8f2d1569c76848bfc03ce0cb054c233", "content": "答：\n开票方擅自将发票红冲会导致受票方无法抵扣进项税额或正常列支成本。为避免这种情况发生，您可以登录电子税务局，通过发票入账标识进行入账确认操作，或通过发票勾选确认进行发票勾选操作，此时如果对方再发起红冲流程，就需经您确认《红字发票信息确认单》后才能开具。具体路径如下：\n登录电子税务局后点击【我要办税】-【税务数字账户】-【发票业务】-【发票入账标识】模块进行发票入账操作。\n或通过【我要办税】-【税务数字账户】-【发票业务】-【发票勾选确认】模块进行发票勾选操作。\n需要注意的是，根据《国家税务总局关于推广应用全面数字化电子发票的公告》（国家税务总局公告2024年第11号）第八条规定，农产品收购发票，报废产品收购发票，光伏收购发票等，不管是不是已经进行用途确认或入账确认，都可由开票方发起红冲流程，并直接开具红字数电发票。"}, {"source": "内部审计", "category": "论坛讨论", "title": "初创期企业财务收支审计需要关注哪些方面呢", "url": "https://bbs.esnai.cn/thread-5496020-1-1.html", "date": "2026-02-11", "content": "今年计划里有一项是审一家新成立的公司，虽然新成立但是因为在研发产品，所以发生的成本费用一点不少，但是目前并没有正式投产，只生产了几台样机。审计需要关注什么呢，本来想的重点关注的是存货成本这块，但是他现在也没出来什么产品", "id": "bee931b1c5b92d29e6f803eebd1b4b53"}, {"source": "国家税务局", "category": "留言咨询", "title": "我们公司2024年购买了安全生产专用设备，已享受企业所得税的抵免政策，近期打算把这设备转让出去。请问之前享受的税额抵免是否需要缴回？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5247627/content.html", "date": "2026-02-03", "id": "fc179e59669a898072fc3d2e9ba31801", "content": "答：\n需要。\n根据《财政部 国家税务总局关于执行环境保护专用设备企业所得税优惠目录，节能节水专用设备企业所得税优惠目录和安全生产专用设备企业所得税优惠目录有关问题的通知》（财税〔2008〕48号）第五条规定，企业购置并实际投入适用，已开始享受税收优惠的专用设备，如从购置之日起5个纳税年度内转让，出租的，应在该专用设备停止使用当月停止享受企业所得税优惠，并补缴已经抵免的企业所得税税款。转让的受让方可以按照该专用设备投资额的10%抵免当年企业所得税应纳税额；当年应纳税额不足抵免的，可以在以后5个纳税年度结转抵免。\n你公司在购置5年内将专用设备转让，需要补缴已经抵免的企业所得税税款。"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕21号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202605/t20260513_3989699.htm", "date": "2026-01-30", "id": "4a5b45df3e4143f0f710d32b572485db", "content": "财政部行政处罚决定书（财监法〔2026〕21号）\n财\n监法\n〔\n202\n6\n〕\n21\n号\n财政部行政处罚\n决定\n书\n当 事 人：王宇\n地    址：南京市玄武区\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对大信会计师事务所（特殊普通合伙）（以下称大信所）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n2016年至\n2018\n年，南京泰通科技股份有限公司（以下称泰通科技）签订\n的\n4份物资供货合同已在\n2016\n年至\n2018\n年分别初验合格，达到付款条件。截至\n2023\n年底，上述\n合同对应的\n应收账款余额1,819.25万元，账龄\n5\n年以上。\n检查发现，2023年泰通科技根据客户出具的《情况说明》和《承诺书》，将\n上述\n应收账款从账龄组合调整至单项认定，预期信用损失率从年初70%变更为年末\n10%\n，冲回坏账准备\n1,091.55\n万元。\n2023年，泰通科技在客户信用风险未发生显著变化情况下，应当沿用账龄组合，按\n5\n年以上的预期信用损失率\n100%\n计提坏账准备计算，应补提坏账准备\n545.77\n万元。补提坏账准备后，泰通科技净利润将由\n250.97\n万元变为\n-1,140.75\n万元。\n此外，根据2023年度财务报表附注，泰通科技单项计提坏账准备的判断标准为：\n“\n本公司对应收款项进行单项认定并计提坏账准备，本公司单项计提的判断标准为：对账龄超过\n3\n或\n5\n年以上、发生诉讼、客户已破产、财务发生重大困难等的应收款项单项认定，全额计提坏账准备\n”\n，泰通科技上述应收账款单项计提标准与政策披露不符。\n针对上述事项，泰通科技项目组未执行进一步审计程序，即对2023年度财务报表出具标准无保留意见的审计报告。大信所未对上述事项会计估计变更的合理性作出全面评估，未保持应有的职业怀疑，未识别泰通科技少计提坏账准备导致虚增净利润的重大错报。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、第二款第（三）项、第三款，不符合《中国注册会计师审计准则第1101号\n——\n注册会计师的总体目标和审计工作的基本要求》第二十二条第一款、第二款第（一）（二）（三）项、第二十八条、第三十条，《中国注册会计师审计准则第\n1121\n号\n——\n对财务报表审计实施的质量管理》第四十九条、第五十条等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款，财政部决定给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n6\n年\n1\n月\n30\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕20号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202605/t20260513_3989698.htm", "date": "2026-01-30", "id": "8db80ea4b0cff0220e685cdd2a02550e", "content": "财政部行政处罚决定书（财监法〔2026〕20号）\n财\n监法\n〔\n202\n6\n〕\n20\n号\n财政部行政处罚\n决定\n书\n当 事 人：狄香雨\n地    址：北京市海淀区知春路1号学院国际大厦\n22\n层\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对大信会计师事务所（特殊普通合伙）（以下称大信所）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n2016年至\n2018\n年，南京泰通科技股份有限公司（以下称泰通科技）签订\n的\n4份物资供货合同已在\n2016\n年至\n2018\n年分别初验合格，达到付款条件。截至\n2023\n年底，上述\n合同对应的\n应收账款余额1,819.25万元，账龄\n5\n年以上。\n检查发现，2023年泰通科技根据客户出具的《情况说明》和《承诺书》，将\n上述\n应收账款从账龄组合调整至单项认定，预期信用损失率从年初70%变更为年末\n10%\n，冲回坏账准备\n1,091.55\n万元。\n2023年，泰通科技在客户信用风险未发生显著变化情况下，应当沿用账龄组合，按\n5\n年以上的预期信用损失率\n100%\n计提坏账准备计算，应补提坏账准备\n545.77\n万元。补提坏账准备后，泰通科技净利润将由\n250.97\n万元变为\n-1,140.75\n万元。\n此外，根据2023年度财务报表附注，泰通科技单项计提坏账准备的判断标准为：\n“\n本公司对应收款项进行单项认定并计提坏账准备，本公司单项计提的判断标准为：对账龄超过\n3\n或\n5\n年以上、发生诉讼、客户已破产、财务发生重大困难等的应收款项单项认定，全额计提坏账准备\n”\n，泰通科技上述应收账款单项计提标准与政策披露不符。\n针对上述事项，泰通科技项目组未执行进一步审计程序，即对2023年度财务报表出具标准无保留意见的审计报告。大信所未对上述事项会计估计变更的合理性作出全面评估，未保持应有的职业怀疑，未识别泰通科技少计提坏账准备导致虚增净利润的重大错报。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、第二款第（三）项、第三款，不符合《中国注册会计师审计准则第1101号\n——\n注册会计师的总体目标和审计工作的基本要求》第二十二条第一款、第二款第（一）（二）（三）项、第二十八条、第三十条，《中国注册会计师审计准则第\n1121\n号\n——\n对财务报表审计实施的质量管理》第四十九条、第五十条等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款，财政部决定给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n6\n年\n1\n月\n30\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕19号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202605/t20260513_3989695.htm", "date": "2026-01-30", "id": "7c5c53a7ff6ac112d40800aa02be46ac", "content": "财政部行政处罚决定书（财监法〔2026〕19号）\n财\n监法\n〔\n202\n6\n〕\n19\n号\n财政部行政处罚\n决定\n书\n当 事 人：南京泰通科技股份有限公司\n地    址：南京市雨花台区\n凤\n汇大道35号\n依照《中华人民共和国会计法》的规定，财政部组织检查组于2024年对你公司会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n2016年至\n2018\n年，你公司签订\n的\n4份物资供货合同已在\n2016\n年至\n2018\n年分别初验合格，达到付款条件。截至\n2023\n年底，上述\n合同对应的\n应收账款余额1,819.25万元，账龄\n5\n年以上。\n检查发现，2023年你公司根据客户出具的《情况说明》和《承诺书》，将\n上述\n应收账款从账龄组合调整至单项认定，预期信用损失率从年初70%变更为年末\n10%\n，冲回坏账准备\n1,091.55\n万元。\n2023年，你公司在客户信用风险未发生显著变化情况下，应当沿用账龄组合，按\n5\n年以上的预期信用损失率\n100%\n计提坏账准备计算，应补提坏账准备\n545.77\n万元。补提坏账准备后，你公司净利润将由\n250.97\n万元变为\n-1,140.75\n万元。\n此外，根据2023年度财务报表附注，你公司单项计提坏账准备的判断标准为：\n“\n本公司对应收款项进行单项认定并计提坏账准备，本公司单项计提的判断标准为：对账龄超过\n3\n或\n5\n年以上、发生诉讼、客户已破产、财务发生重大困难等的应收款项单项认定，全额计提坏账准备\n”\n，你公司上述应收账款单项计提标准与政策披露不符。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了2017年修改的《中华人民共和国会计法》第二十五条、第二十六条第（一）（三）项，不符合《企业会计准则第\n22\n号\n——\n金融工具确认和计量》第五十三条，《企业会计准则第\n28\n号\n——\n会计政策、会计估计变更和差错更正》第八条等相关规定。\n依据2017年修改的《中华人民共和国会计法》第四十二条第一款第（五）项的规定，财政部决定给予你公司罚款\n3\n万元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部江苏监管局联系，凭财政部江苏监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n6\n年\n1\n月\n30\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕18号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202605/t20260513_3989694.htm", "date": "2026-01-30", "id": "e62216029c8d7cd64ea40f05c2a4e847", "content": "财政部行政处罚决定书（财监法〔2026〕18号）\n财\n监法\n〔\n202\n6\n〕\n18\n号\n财政部行政处罚\n决定\n书\n当 事 人：唐成\n地    址：上海市黄浦区南京东路61号\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对立信会计师事务所（特殊普通合伙）（以下称立信所）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n立信所在上海思尔芯技术股份有限公司（以下称思尔芯）审计项目中，未保持职业怀疑，未识别收入确认存在重大会计差错。\n1.思尔芯\n2020\n年度提前确认与深圳市紫光同创电子有限公司（现更名为深圳市紫光同创电子股份有限公司）交易的销售收入，导致当年多计营业收入\n632.08\n万元、多计利润总额\n632.08\n万元。\n立信所对于产品验收单时间早于光盘刻录时间、合同约定软件版本与实际交付版本不一致、产品成本结转为零、该笔交易未按照《佣金管理制度》计提佣金等异常事项未保持应有的职业怀疑，未执行进一步审计程序，未发现上述重大会计差错。\n2.思尔芯\n2020\n年度提前确认与超越科技股份有限公司（以下称超越科技）交易的销售收入，导致当年多计营业收入\n235.65\n万元、营业成本\n92.32\n万元，多计利润总额\n143.33\n万元。\n立信所通过电子邮件沟通已知2021年\n2\n月超越科技将产品主体部分退回给思尔芯，但未对异常事项保持应有的职业怀疑，未执行进一步审计程序，未发现上述重大会计差错。\n3.思尔芯\n2020\n年度根据名义客户上海埃瓦智能科技有限公司（以下称埃瓦智能）确认的产品验收单，提前确认该笔交易的销售收入，导致当年多计营业收入\n273.20\n万元、营业成本\n125.24\n万元，多计利润总额\n147.96\n万元。\n立信所取得的资料显示货物需发运至终端客户验收，且埃瓦智能与思尔芯存在关联关系\n，\n但未对异常事项保持应有的职业怀疑，未发现上述重大会计差错。\n4.思尔芯\n2020\n年度根据名义客户中国仪器进出口集团有限公司确认的产品验收单，提前确认该笔交易的销售收入，导致当年多计营业收入\n121.23\n万元、营业成本\n25.87\n万元，多计利润总额\n95.36\n万元。\n立信所已获取并检查了上述交易的销售合同，应当知晓产品需最终用户进行检测验收，但未对异常事项保持应有的职业怀疑，认可了企业的会计处理，未发现上述重大会计差错。\n5.思尔芯\n2020\n年度提前确认与成都焱之阳科技有限公司交易的销售收入，导致当年多计营业收入\n180.09\n万元、营业成本\n29.39\n万元，多计利润总额\n150.7\n万元。\n立信所未识别到产品烧录MAC地址是控制权转移的必要条件，未检查产品标识卡及相关\nMAC\n地址采购和申请时间，未对异常情况保持应有的职业怀疑，未执行进一步的审计程序，未发现上述重大会计差错。\n6.思尔芯\n2020\n年度提前确认与牛芯半导体（深圳）有限公司交易的销售收入，导致当年多计营业收入\n61.06\n万元、营业成本\n23.98\n万元，多计利润总额\n37.08\n万元。\n立信所未识别到产品烧录MAC地址是控制权转移的必要条件，未获取产品\nMAC\n地址、产品标识卡等重要审计证据，未保持应有的职业怀疑，未发现上述重大会计差错。\n上述事实，有检查报告、反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款，不符合《中国注册会计师鉴证业务基本准则》第二十八条第一款，《中国注册会计师审计准则第1141号\n——\n财务报表审计中与舞弊相关的责任》第二十七条，《中国注册会计师审计准则第\n1231\n号\n——\n针对评估的重大错报风险采取的应对措施》第十八条，《中国注册会计师审计准则第\n1301\n号\n——\n审计证据》第十条，《中国注册会计师审计准则第\n1323\n号\n——\n关联方》第二十六条第（一）（二）项等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，财政部决定给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n6\n年\n1\n月\n30\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕17号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202605/t20260513_3989693.htm", "date": "2026-01-30", "id": "519e47ed325b4c8ee9752e3072f1bf99", "content": "财政部行政处罚决定书（财监法〔2026〕17号）\n财\n监法\n〔\n202\n6\n〕\n17\n号\n财政部行政处罚\n决定\n书\n当 事 人：雷飞飞\n地    址：上海市黄浦区南京东路61号\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对立信会计师事务所（特殊普通合伙）（以下称立信所）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、未保持应有的职业怀疑，未识别重大会计差错\n（一）未识别营业收入确认不当。\n启迪设计集团股份有限公司（以下称启迪设计）设计咨询业务按照时段法确认收入。启迪设计在2018至\n2022\n年共有\n20\n个设计项目已取得审查合格书或其他支持性材料，但对应收入及分包成本未按照规定时间节点确认，而是计入了\n2023\n年度，导致\n2023\n年度多计营业收入\n6,164.72\n万元、营业成本\n1,340.34\n万元，多计利润总额\n4,824.38\n万元。\n立信所实施审计时已取得相关收入确认的支持性材料，包括以前年度支持性材料，但未保持应有的职业怀疑，认可了企业的会计处理，未发现上述重大会计差错。\n（二）未识别研发费用归集不当。\n启迪设计未准确归集研发费用中人工费、软件摊销费、固定资产折旧费等相关费用，导致2023年度多计研发费用\n2,102.8\n万元。\n立信所未充分关注研发费用中人工、无形资产摊销及固定资产折旧费用是否合理归集，未保持应有的职业怀疑，未发现上述重大会计差错。\n二、未保持应有的职业怀疑，存在职业判断错误\n启迪设计分公司EPC业务中心部分与其他施工方共同向业主方承接的设计施工总承包业务，不属于施工部分主要责任人。启迪设计采用总额法确认总承包业务收入，导致\n2023\n年多计营业收入\n27,794.29\n万元、营业成本\n27,794.29\n万元。\n立信所获取的资料已经表明启迪设计总承包业务应当按照净额法确认收入，但未保持应有的职业怀疑，认可了企业的会计处理，存在职业判断错误。\n三、已知企业可能存在会计差错，未执行进一步审计程序\n（一）营业收入确认不当。\n启迪设计所属子公司深圳嘉力达节能科技有限公司（以下称深圳嘉力达）于2022年度承接了合肥玫瑰绅城花园电梯设备采购、空调设备采购及安装项目。深圳嘉力达\n2022\n年将尚未发往项目现场的电梯和空调设备提前确认了收入，导致\n2022\n年度多计营业收入\n2,436.81\n万元、营业成本\n2,171.28\n万元，多计利润总额\n265.53\n万元。\n立信所在2023年度财务报表审计中，对该项目实施实地盘点，已发现相关设备产品未发往项目现场，但未对盘点状况与项目进度间的差异保持应有的职业怀疑，未执行进一步审计程序。\n（二）长期股权投资减值准备计提不足。\n启迪设计2023年\n12\n月\n31\n日合并财务报表中商誉减值准备余额为\n34,409\n万元，母公司报表未对长期股权投资计提减值准备，导致母公司报表少计\n2023\n年期初长期股权投资减值准备余额\n13,814\n万元、\n2023\n年度长期股权投资减值准备\n20,595\n万元、\n2023\n年期末长期股权投资减值准备余额\n34,409\n万元。\n立信所明确知晓启迪设计已计提大额商誉减值准备，母公司长期股权投资出现明显减值迹象，但未执行进一步审计程序以确定长期股权投资减值准备金额。\n上述事实，有检查报告、反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款，不符合《中国注册会计师鉴证业务基本准则》第二十八条，《中国注册会计师审计准则第1141号\n——\n财务报表审计中与舞弊相关的责任》第二十七条，《中国注册会计师审计准则第\n1231\n号\n——\n针对评估的重大错报风险采取的应对措施》第十八条、第三十条，《中国注册会计师审计准则第\n1301\n号\n——\n审计证据》第十条等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，财政部决定给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n6\n年\n1\n月\n30\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕16号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202605/t20260513_3989690.htm", "date": "2026-01-30", "id": "83c124c6ce0718babd48d3092bb6b07f", "content": "财政部行政处罚决定书（财监法〔2026〕16号）\n财\n监法\n〔\n202\n6\n〕\n16\n号\n财政部行政处罚\n决定\n书\n当 事 人：王许\n地    址：上海市黄浦区南京东路61号\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于2024年对立信会计师事务所（特殊普通合伙）（以下称立信所）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、未保持应有的职业怀疑，未识别重大会计差错\n（一）未识别营业收入确认不当。\n启迪设计集团股份有限公司（以下称启迪设计）设计咨询业务按照时段法确认收入。启迪设计在2018至\n2022\n年共有\n20\n个设计项目已取得审查合格书或其他支持性材料，但对应收入及分包成本未按照规定时间节点确认，而是计入了\n2023\n年度，导致\n2023\n年度多计营业收入\n6,164.72\n万元、营业成本\n1,340.34\n万元，多计利润总额\n4,824.38\n万元。\n立信所实施审计时已取得相关收入确认的支持性材料，包括以前年度支持性材料，但未保持应有的职业怀疑，认可了企业的会计处理，未发现上述重大会计差错。\n（二）未识别研发费用归集不当。\n启迪设计未准确归集研发费用中人工费、软件摊销费、固定资产折旧费等相关费用，导致2023年度多计研发费用\n2,102.8\n万元。\n立信所未充分关注研发费用中人工、无形资产摊销及固定资产折旧费用是否合理归集，未保持应有的职业怀疑，未发现上述重大会计差错。\n二、未保持应有的职业怀疑，存在职业判断错误\n启迪设计分公司EPC业务中心部分与其他施工方共同向业主方承接的设计施工总承包业务，不属于施工部分主要责任人，启迪设计采用总额法确认总承包业务收入，导致\n2023\n年多计营业收入\n27,794.29\n万元、营业成本\n27,794.29\n万元。\n立信所获取的资料已经表明启迪设计总承包业务应当按照净额法确认收入，但未保持应有的职业怀疑，认可了企业的会计处理，存在职业判断错误。\n三、已知企业可能存在会计差错，未执行进一步审计程序\n（一）营业收入确认不当。\n启迪设计所属子公司深圳嘉力达节能科技有限公司（以下称深圳嘉力达）于2022年度承接了合肥玫瑰绅城花园电梯设备采购、空调设备采购及安装项目。深圳嘉力达\n2022\n年将尚未发往项目现场的电梯和空调设备提前确认了收入，导致\n2022\n年度多计营业收入\n2,436.81\n万元、营业成本\n2,171.28\n万元，多计利润总额\n265.53\n万元。\n立信所在2023年度财务报表审计中，对该项目实施实地盘点，已发现相关设备产品未发往项目现场，但未对盘点状况与项目进度间的差异保持应有的职业怀疑，未执行进一步审计程序。\n（二）长期股权投资减值准备计提不足。\n启迪设计2023年\n12\n月\n31\n日合并财务报表中商誉减值准备余额为\n34,409\n万元，母公司报表未对长期股权投资计提减值准备，导致母公司报表少计\n2023\n年期初长期股权投资减值准备余额\n13,814\n万元、\n2023\n年度长期股权投资减值准备\n20,595\n万元、\n2023\n年期末长期股权投资减值准备余额\n34,409\n万元。\n立信所明确知晓启迪设计已计提大额商誉减值准备，母公司长期股权投资出现明显减值迹象，但未执行进一步审计程序以确定长期股权投资减值准备金额。\n上述事实，有检查报告、反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款，不符合《中国注册会计师鉴证业务基本准则》第二十八条，《中国注册会计师审计准则第1141号\n——\n财务报表审计中与舞弊相关的责任》第二十七条，《中国注册会计师审计准则第\n1231\n号\n——\n针对评估的重大错报风险采取的应对措施》第十八条、第三十条，《中国注册会计师审计准则第\n1301\n号\n——\n审计证据》第十条等有关规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，财政部决定给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n6\n年\n1\n月\n30\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕15号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202605/t20260513_3989687.htm", "date": "2026-01-30", "id": "77c9d7a2b721196a27c84af7eaa565d3", "content": "财政部行政处罚决定书（财监法〔2026〕15号）\n财\n监法\n〔\n202\n6\n〕\n15\n号\n财政部行政处罚\n决定\n书\n当 事 人：朱江川\n地    址：苏州市工业园区旺茂街9号\n依照《中华人民共和国会计法》的规定，财政部组织检查组于2024年对启迪设计集团股份有限公司（以下称启迪设计）会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n一、以总额法代替净额法核算EPC联合体业务，多计收入及成本\n启迪设计分公司EPC业务中心部分与其他施工方共同向业主方承接的设计施工总承包业务，不属于施工部分主要责任人。启迪\n设计\n错误\n采用总额法确认总承包业务收入，导致2023年多计营业收入\n27,794.29\n万元、营业成本\n27,794.29\n万元。\n二、跨期确认设计咨询业务收入及分包成本\n启迪设计\n的\n设计咨询业务按照时段法确认收入。启迪设计在2018至\n2022\n年共有\n20\n个设计项目已取得审查合格书或其他支持性材料，但对应收入及分包成本未按照规定时间节点确认，而是计入了\n2023\n年度，导致\n2023\n年度多计营业收入\n6,164.72\n万元、营业成本\n1,340.34\n万元，多计利润总额\n4,824.38\n万元。\n三、对尚未实施的设备购置安装业务确认收入成本\n启迪设计所属子公司深圳嘉力达节能科技有限公司（以下称深圳嘉力达）于2022年度承接了合肥玫瑰绅城花园电梯设备采购、空调设备采购及安装项目。深圳嘉力达\n2022\n年将尚未发往项目现场的电梯和空调设备提前确认了收入，导致\n2022\n年度多计营业收入\n2,436.81\n万元、营业成本\n2,171.28\n万元，多计利润总额\n265.53\n万元。\n四、长期股权投资减值准备计提不足\n启迪设计2023年\n12\n月\n31\n日合并财务报表中商誉减值准备余额为\n34,409\n万元，母公司报表未对长期股权投资计提减值准备，导致母公司报表少计\n2023\n年期初长期股权投资减值准备余额\n13,814\n万元、\n2023\n年度长期股权投资减值准备\n20,595\n万元、\n2023\n年期末长期股权投资减值准备余额\n34,409\n万元。\n上述事实，有检查报告、反馈意见等相关证据予以证实。\n上述行为违反了2017年修改的《中华人民共和国会计法》第二十五条、第二十六条第（一）（二）项，不符合《企业会计准则第\n14\n号\n——\n收入》第四条、第三十四条第一款，《企业会计准则第\n2\n号\n——\n长期股权投资》第十八条等有关规定。\n你作为启迪设计的会计机构负责人，对上述问题负有责任。依据2017年修改的《中华人民共和国会计法》第四十二条第一款第（五）项的规定，财政部决定给予你罚款\n1\n万元的行政处罚。\n你应在收到本处罚决定书之日起十五日内与财政部江苏监管局联系，凭财政部江苏监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n6\n年\n1\n月\n30\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕14号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202605/t20260513_3989685.htm", "date": "2026-01-30", "id": "d04cc35156b48e941e13e84cd8a5f499", "content": "财政部行政处罚决定书（财监法〔2026〕14号）\n财\n监法\n〔\n202\n6\n〕\n14\n号\n财政部行政处罚\n决定\n书\n当 事 人：查金荣\n地    址：苏州市工业园区旺茂街\n9\n号\n依照《中华人民共和国会计法》的规定，财政部组织检查组于\n2024\n年对启迪设计集团股份有限公司（以下称启迪设计）会计信息质量进行了检查。检查发现的主要问题和行政处罚决定如下：\n一、以总额法代替净额法核算EPC联合体业务，多计收入及成本\n启迪设计分公司\nEPC\n业务中心部分与其他施工方共同向业主方承接的设计施工总承包业务，不属于施工部分主要责任人。启迪设计错误采用总额法确认总承包业务收入，导致\n2023\n年多计营业收入\n27,794.29\n万元、营业成本\n27,794.29\n万元。\n二、跨期确认设计咨询业务收入及分包成本\n启迪设计\n的\n设计咨询业务按照时段法确认收入。启迪设计在\n2018\n至\n2022\n年共有\n20\n个设计项目已取得审查合格书或其他支持性材料，但对应收入及分包成本未按照规定时间节点确认，而是计入了\n2023\n年度，导致\n2023\n年度多计营业收入\n6,164.72\n万元、营业成本\n1,340.34\n万元，多计利润总额\n4,824.38\n万元。\n三、对尚未实施的设备购置安装业务确认收入成本\n启迪设计所属子公司深圳嘉力达节能科技有限公司（以下称深圳嘉力达）于\n2022\n年度承接了合肥玫瑰绅城花园电梯设备采购、空调设备采购及安装项目。深圳嘉力达\n2022\n年将尚未发往项目现场的电梯和空调设备提前确认了收入，导致\n2022\n年度多计营业收入\n2,436.81\n万元、营业成本\n2,171.28\n万元，多计利润总额\n265.53\n万元。\n四、长期股权投资减值准备计提不足\n启迪设计\n2023\n年\n12\n月\n31\n日合并财务报表中商誉减值准备余额为\n34,409\n万元，母公司报表未对长期股权投资计提减值准备，导致母公司报表少计\n2023\n年期初长期股权投资减值准备余额\n13,814\n万元、\n2023\n年度长期股权投资减值准备\n20,595\n万元、\n2023\n年期末长期股权投资减值准备余额\n34,409\n万元。\n上述事实，有检查报告、反馈意见等相关证据予以证实。\n上述行为违反了\n2017\n年修改的《中华人民共和国会计法》第二十五条、第二十六条第（一）（二）项，不符合《企业会计准则第\n14\n号——收入》第四条、第三十四条第一款，《企业会计准则第\n2\n号——长期股权投资》第十八条等有关规定。\n你作为启迪设计的单位负责人，对上述问题负有责任。依据\n2017\n年修改的《中华人民共和国会计法》第四十二条第一款第（五）项的规定，财政部决定给予你罚款\n2\n万元的行政处罚。\n你应在收到本处罚决定书之日起十五日内与财政部江苏监管局联系，凭财政部江苏监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n6\n年\n1\n月\n30\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕13号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202605/t20260513_3989682.htm", "date": "2026-01-30", "id": "30f0e9d534b90b85e14620af1096ebe5", "content": "财政部行政处罚决定书（财监法〔2026〕13号）\n财\n监法\n〔\n202\n6\n〕\n13\n号\n财政部行政处罚\n决定\n书\n当 事 人：启迪设计集团股份有限公司\n地    址：苏州市工业园区旺茂街\n9\n号\n依照《中华人民共和国会计法》的规定，财政部组织检查组于\n2024\n年对你公司会计信息质量进行了检查。检查发现的主要问题和行政处罚\n决定\n如下：\n一、以总额法代替净额法核算\nEPC\n联合体业务，多计收入及成本\n你公司分公司\nEPC\n业务中心部分与其他施工方共同向业主方承接的设计施工总承包业务，不属于施工部分主要责任人。你公司\n错误\n采用总额法确认总承包业务收入，导致\n2023\n年多计营业收入\n27,794.29\n万元、营业成本\n27,794.29\n万元。\n二、跨期确认设计咨询业务收入及分包成本\n你公司设计咨询业务按照时段法确认收入。你公司在\n2018\n至\n2022\n年共有\n20\n个设计项目已取得审查合格书或其他支持性材料，\n但对应收入及分包成本未按照规定时间节点确认，而是计入了\n2023\n年度，导致\n2023\n年度多计营业收入\n6,164.72\n万元、营业成本\n1,340.34\n万元，多计利润总额\n4,824.38\n万元。\n三、对尚未实施的设备购置安装业务确认收入成本\n你公司所属子公司深圳嘉力达节能科技有限公司（以下称深圳嘉力达）于\n2022\n年度承接了合肥玫瑰绅城花园电梯设备采购、空调设备采购及安装项目。深圳嘉力达\n2022\n年将尚未发往项目现场的电梯和空调设备提前确认了收入，导致\n2022\n年度多计营业收入\n2,436.81\n万元、营业成本\n2,171.28\n万元，多计利润总额\n265.53\n万元。\n四、长期股权投资减值准备计提不足\n你公司\n2023\n年\n12\n月\n31\n日合并财务报表中商誉减值准备余额为\n34,409\n万元，母公司报表未对长期股权投资计提减值准备\n，\n导致母公司报表少计\n2023\n年期初长期股权投资减值准备余额\n13,814\n万元、\n2023\n年度长期股权投资减值准备\n20,595\n万元、\n2023\n年期末长期股权投资减值准备余额\n34,409\n万元。\n上述事实，有检查报告、反馈意见等相关证据予以证实。\n上述行为违反了\n2017\n年\n修改\n的《中华人民共和国会计法》第二十五条、第二十六条第（一\n）（\n二\n）\n项，\n不符合\n《企业会计准则第\n14\n号——收入》第四条、第三十四条第一款，《企业会计准则第\n2\n号——长期股权投资》第十八条\n等有关\n规定。\n依据\n2017\n年\n修改\n的《中华人民共和国会计法》第四十二条第一款第\n（\n五\n）\n项的规定，财政部\n决定\n给予你公司罚款\n5\n万元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部\n江苏\n监管局联系，凭财政部\n江苏\n监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n6\n年\n1\n月\n30\n日"}, {"source": "内部审计", "category": "论坛讨论", "title": "系统软件（尤其是定制化软件）采购审计重点关注什么？", "url": "https://bbs.esnai.cn/thread-5495778-1-1.html", "date": "2026-01-21", "content": "求教大家分享一些经验，系统软件（尤其是定制化软件）采购审计重点关注什么？有哪些常见的风险点、舞弊点？", "id": "98d90718f476d42a6de694ff6637a5e1"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕12号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202603/t20260316_3985412.htm", "date": "2026-01-19", "id": "becd68ff3d03070a2f925ca5f5effd41", "content": "财政部行政处罚决定书（财监法〔2026〕12号）\n财监法〔2026〕12 号\n财政部行政处罚决定书\n当 事 人：朱春艳\n地      址：四川省成都市高新区\n根据《中华人民共和国资产评估法》等法律规定，财政部组织检查组于2025年对四川蓉域资产评估有限公司（以下称四川蓉域）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、检查发现的主要问题\n四川蓉域出具的蓉域评报字(2024)第005号资产评估报告存在以下问题：\n1.评定估算形成结论不恰当。\n2007年5月17日特许经营权授予方某市政公用局与特许经营权受让方某燃气有限公司签订《城市管道燃气特许经营合同》。该合同约定，特许经营权有效期至2037年5月17日，特许经营权终止后，某燃气有限公司应当将全部现有的，以及正在建设的燃气管网设施移交给某市政公用局。\n资产评估专业人员在测算资产组预计未来现金流量的现值时，错误地把永续期作为收益期，未考虑特许经营合同的有效期限。该错误导致评估差异7,500.00万元（在其他条件不变的情况下，造成高估），差异率22.46%，商誉所在资产组由减值变为不减值。\n2.重要评估资料缺失。\n资产评估档案中无特许经营合同、管道设计供气量等影响评估结论的重要资料。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等证据予以证实。\n二、行政处罚决定\n依据《资产评估行业财政监督管理办法》第四十六条，财政部认定上述事项不符合《资产评估执业准则——资产评估方法》第十二条，《资产评估执业准则——资产评估程序》第十三条，《以财务报告为目的的评估指南》第二十八条，构成重大遗漏，违反了《中华人民共和国资产评估法》第十四条第七项等有关规定。\n你作为上述评估报告的签字资产评估师，对上述问题负有责任。依据《中华人民共和国资产评估法》第四十四条第五项的规定，财政部决定给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026年1月19日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕11号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202603/t20260316_3985411.htm", "date": "2026-01-19", "id": "c2b7511081a4bd186fa2c81491eb8c7f", "content": "财政部行政处罚决定书（财监法〔2026〕11号）\n财监法〔2026〕11 号\n财政部行政处罚决定书\n当 事 人：张豆\n地      址：四川省成都市高新区\n根据《中华人民共和国资产评估法》等法律规定，财政部组织检查组于2025年对四川蓉域资产评估有限公司（以下称四川蓉域）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、检查发现的主要问题\n四川蓉域出具的蓉域评报字(2024)第005号资产评估报告存在以下问题：\n1.评定估算形成结论不恰当。\n2007年5月17日特许经营权授予方某市政公用局与特许经营权受让方某燃气有限公司签订《城市管道燃气特许经营合同》。该合同约定，特许经营权有效期至2037年5月17日，特许经营权终止后，某燃气有限公司应当将全部现有的，以及正在建设的燃气管网设施移交给某市政公用局。\n资产评估专业人员在测算资产组预计未来现金流量的现值时，错误地把永续期作为收益期，未考虑特许经营合同的有效期限。该错误导致评估差异7,500.00万元（在其他条件不变的情况下，造成高估），差异率22.46%，商誉所在资产组由减值变为不减值。\n2.重要评估资料缺失。\n资产评估档案中无特许经营合同、管道设计供气量等影响评估结论的重要资料。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等证据予以证实。\n二、行政处罚决定\n依据《资产评估行业财政监督管理办法》第四十六条，财政部认定上述事项不符合《资产评估执业准则——资产评估方法》第十二条，《资产评估执业准则——资产评估程序》第十三条，《以财务报告为目的的评估指南》第二十八条，构成重大遗漏，违反了《中华人民共和国资产评估法》第十四条第七项等有关规定。\n你作为上述评估报告的签字资产评估师，对上述问题负有责任。依据《中华人民共和国资产评估法》第四十四条第五项的规定，财政部决定给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026年1月19日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕10号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202603/t20260316_3985410.htm", "date": "2026-01-19", "id": "05c50ac2e8b338e729789ff1ba6bcd79", "content": "财政部行政处罚决定书（财监法〔2026〕10号）\n财监法〔2026〕10 号\n财政部行政处罚决定书\n当 事 人：邱玉琴\n地      址：四川省成都市高新区\n根据《中华人民共和国资产评估法》等法律规定，财政部组织检查组于2025年对四川蓉域资产评估有限公司（以下称四川蓉域）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、检查发现的主要问题\n四川蓉域出具的蓉域评报字(2024)第004号资产评估报告存在以下问题：\n1.未考虑停工多年的在建工程贬值因素。该项目在建工程于2013年开建，2015年停工，评估基准日为2023年12月31日。资产评估专业人员以项目尚处于基建阶段为由，未结合评估对象长期停工的实际情况分析在建工程长期停工的经济原因、将来复工的可能性、复工存在的工程准备费用及对原有工程修缮加固费用等影响资产贬值的因素。\n2.在建工程重置成本估算不合理。资产评估专业人员采用重置成本法确定公允价值，重置成本估算存在如下问题：\n一是评估说明披露“企业编制其预算时参考定额为《铁路工程预算定额（2010）》，截至评估基准日，最新定额为《铁路工程预算定额（2017）》，本次评估通过对其开工之日至评估基准日定额的基价涨幅，采用造价指数调整法评估。本次摘录了15项工程对2010年的定额与2017年的定额进行对比，通过定额比较，基价平均涨幅约10%，故本次评估以企业实际发生的工程费再乘以工程造价增长率确认其评估值”。经检查，上述15项工程所包含的分项工程定额基价增长率差异较大，最大增长32.14%、最小增长-27.6%，以这15项工程所包含的分项工程定额基价增长率的算术平均值作为工程造价增长率的做法不合理。\n二是在建工程主要包括路基工程、桥涵及隧道工程，资产评估专业人员仅按照路基工程定额基价，未选择桥涵工程定额和隧道工程定额的相关定额基价。同时，根据《铁路工程预算定额（2010）》和《铁路工程预算定额（2017）》，路基工程定额分别包含521项工程内容和497项工程内容。资产评估专业人员仅采用其中15项内容作为定额基价增长率测算基础，未说明理由。\n三是未考虑2017年至评估基准日（2023年12月31日）工程造价的变动情况。\n四是资产评估专业人员未分析土地征用及迁移补偿标准的变化，直接采用2015年在建工程—土地征用及迁移补偿费账面值123,109,747.28元作为评估值。\n五是资产评估专业人员直接采用账面发生的待摊投资剔除赔偿费用后的账面余额82,404,436.44元作为评估值，未分析评估基准日的取费基数和计费标准。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等证据予以证实。\n二、行政处罚决定\n依据《资产评估行业财政监督管理办法》第四十六条，财政部认定上述事项不符合《资产评估执业准则——资产评估方法》第十九条、第二十条，《以财务报告为目的的评估指南》第二十二条、第三十条，构成重大遗漏，违反了《中华人民共和国资产评估法》第十四条第七项等有关规定。\n你作为上述评估报告的签字资产评估师，对上述问题负有责任。依据《中华人民共和国资产评估法》第四十四条第五项的规定，财政部决定给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026年1月19日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕9号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202603/t20260316_3985408.htm", "date": "2026-01-19", "id": "f1285b974e15b693f895e53296c73164", "content": "财政部行政处罚决定书（财监法〔2026〕9号）\n财监法〔2026〕9 号\n财政部行政处罚决定书\n当 事 人：陈连洁\n地      址：四川省成都市高新区\n根据《中华人民共和国资产评估法》等法律规定，财政部组织检查组于2025年对四川蓉域资产评估有限公司（以下称四川蓉域）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、检查发现的主要问题\n四川蓉域出具的蓉域评报字(2024)第004号资产评估报告存在以下问题：\n1.未考虑停工多年的在建工程贬值因素。该项目在建工程于2013年开建，2015年停工，评估基准日为2023年12月31日。资产评估专业人员以项目尚处于基建阶段为由，未结合评估对象长期停工的实际情况分析在建工程长期停工的经济原因、将来复工的可能性、复工存在的工程准备费用及对原有工程修缮加固费用等影响资产贬值的因素。\n2.在建工程重置成本估算不合理。资产评估专业人员采用重置成本法确定公允价值，重置成本估算存在如下问题：\n一是评估说明披露“企业编制其预算时参考定额为《铁路工程预算定额（2010）》，截至评估基准日，最新定额为《铁路工程预算定额（2017）》，本次评估通过对其开工之日至评估基准日定额的基价涨幅，采用造价指数调整法评估。本次摘录了15项工程对2010年的定额与2017年的定额进行对比，通过定额比较，基价平均涨幅约10%，故本次评估以企业实际发生的工程费再乘以工程造价增长率确认其评估值”。经检查，上述15项工程所包含的分项工程定额基价增长率差异较大，最大增长32.14%、最小增长-27.6%，以这15项工程所包含的分项工程定额基价增长率的算术平均值作为工程造价增长率的做法不合理。\n二是在建工程主要包括路基工程、桥涵及隧道工程，资产评估专业人员仅按照路基工程定额基价，未选择桥涵工程定额和隧道工程定额的相关定额基价。同时，根据《铁路工程预算定额（2010）》和《铁路工程预算定额（2017）》，路基工程定额分别包含521项工程内容和497项工程内容。资产评估专业人员仅采用其中15项内容作为定额基价增长率测算基础，未说明理由。\n三是未考虑2017年至评估基准日（2023年12月31日）工程造价的变动情况。\n四是资产评估专业人员未分析土地征用及迁移补偿标准的变化，直接采用2015年在建工程—土地征用及迁移补偿费账面值123,109,747.28元作为评估值。\n五是资产评估专业人员直接采用账面发生的待摊投资剔除赔偿费用后的账面余额82,404,436.44元作为评估值，未分析评估基准日的取费基数和计费标准。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等证据予以证实。\n二、行政处罚决定\n依据《资产评估行业财政监督管理办法》第四十六条，财政部认定上述事项不符合《资产评估执业准则——资产评估方法》第十九条、第二十条，《以财务报告为目的的评估指南》第二十二条、第三十条，构成重大遗漏，违反了《中华人民共和国资产评估法》第十四条第七项等有关规定。\n你作为上述评估报告的签字资产评估师，对上述问题负有责任。依据《中华人民共和国资产评估法》第四十四条第五项的规定，财政部决定给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026年1月19日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕8号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202603/t20260316_3985403.htm", "date": "2026-01-19", "id": "7106e73e78e24cd61322cfd2eb91fedc", "content": "财政部行政处罚决定书（财监法〔2026〕8号）\n财监法〔2026〕8 号\n财政部行政处罚决定书\n当 事 人：四川蓉域资产评估有限公司\n地      址：四川省成都市高新区天府二街166号雄川金融中心1号楼1105\n根据《中华人民共和国资产评估法》等法律规定，财政部组织检查组于2025年对你公司执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、检查发现的主要问题\n（一）你公司出具的蓉域评报字(2024)第004号资产评估报告（以下称第004号报告）存在以下问题：\n1.未考虑停工多年的在建工程贬值因素。该项目在建工程于2013年开建，2015年停工，评估基准日为2023年12月31日。你公司资产评估专业人员以项目尚处于基建阶段为由，未结合评估对象长期停工的实际情况分析在建工程长期停工的经济原因、将来复工的可能性、复工存在的工程准备费用及对原有工程修缮加固费用等影响资产贬值的因素。\n2.在建工程重置成本估算不合理。你公司资产评估专业人员采用重置成本法确定公允价值，重置成本估算存在如下问题：\n一是评估说明披露“企业编制其预算时参考定额为《铁路工程预算定额（2010）》，截至评估基准日，最新定额为《铁路工程预算定额（2017）》，本次评估通过对其开工之日至评估基准日定额的基价涨幅，采用造价指数调整法评估。本次摘录了15项工程对2010年的定额与2017年的定额进行对比，通过定额比较，基价平均涨幅约10%，故本次评估以企业实际发生的工程费再乘以工程造价增长率确认其评估值”。经检查，上述15项工程所包含的分项工程定额基价增长率差异较大，最大增长32.14%、最小增长-27.6%，以这15项工程所包含的分项工程定额基价增长率的算术平均值作为工程造价增长率的做法不合理。\n二是在建工程主要包括路基工程、桥涵及隧道工程，你公司资产评估专业人员仅按照路基工程定额基价，未选择桥涵工程定额和隧道工程定额的相关定额基价。同时，根据《铁路工程预算定额（2010）》和《铁路工程预算定额（2017）》，路基工程定额分别包含521项工程内容和497项工程内容。你公司资产评估专业人员仅采用其中15项内容作为定额基价增长率测算基础，未说明理由。\n三是未考虑2017年至评估基准日（2023年12月31日）工程造价的变动情况。\n四是你公司资产评估专业人员未分析土地征用及迁移补偿标准的变化，直接采用2015年在建工程—土地征用及迁移补偿费账面值123,109,747.28元作为评估值。\n五是你公司资产评估专业人员直接采用账面发生的待摊投资剔除赔偿费用后的账面余额82,404,436.44元作为评估值，未分析评估基准日的取费基数和计费标准。\n（二）你公司出具的蓉域评报字(2024)第005号资产评估报告（以下称第005号报告）存在以下问题：\n1.评定估算形成结论不恰当。\n2007年5月17日特许经营权授予方某市政公用局与特许经营权受让方某然气有限公司签订《城市管道燃气特许经营合同》。该合同约定，特许经营权有效期至2037年5月17日，特许经营权终止后，某然气有限公司应当将全部现有的，以及正在建设的燃气管网设施移交给某市政公用局。\n你公司资产评估专业人员在测算资产组预计未来现金流量的现值时，错误地把永续期作为收益期，未考虑特许经营合同的有效期限。该错误导致评估差异7,500.00万元（在其他条件不变的情况下，造成高估），差异率22.46%，商誉所在资产组由减值变为不减值。\n2.重要评估资料缺失。\n资产评估档案中无特许经营合同、管道设计供气量等影响评估结论的重要资料。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等证据予以证实。\n二、行政处罚决定\n依据《资产评估行业财政监督管理办法》第四十六条，财政部认定上述事项不符合《资产评估执业准则——资产评估方法》第十二条、第十九条、第二十条，《资产评估执业准则——资产评估程序》第十三条，《以财务报告为目的的评估指南》第二十二条、第二十八条、第三十条，构成重大遗漏，违反了《中华人民共和国资产评估法》第二十条第六项等有关规定。\n依据《中华人民共和国资产评估法》第四十七条第一款第六项的规定，财政部决定给予你公司警告、没收第004号报告项目违法所得6万元并处罚款6万元、没收第005号报告项目违法所得2.1万元并处罚款2.1万元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部四川监管局联系，凭财政部四川监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将违法所得和罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026年1月19日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕7号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202603/t20260316_3985402.htm", "date": "2026-01-19", "id": "c7b61129ba3798b6e12b51e43d996539", "content": "财政部行政处罚决定书（财监法〔2026〕7号）\n财监法〔2026〕7 号\n财政部行政处罚决定书\n当 事 人：张坤明\n地      址：广东省湛江市赤坎区\n根据《中华人民共和国资产评估法》等法律规定，财政部组织检查组于2025年对广东千福田资产土地房地产评估规划测绘有限公司（以下称广东千福田）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、检查发现的主要问题\n广东千福田出具的粤千福田资评报字〔2024〕0919B001号资产评估报告存在以下问题：\n1.采用市场法评估时选取的评估案例不可比。\n被评估单位主营业务为私募股权投资，评估基准日交易性金融资产（股权投资）占资产总额比例约99%。采用市场法（价值比率为市净率）评估时，选取的可比公司为中金公司（SH.601995）、第一创业（SZ.002797）、首创证券（SH.601136）。根据3家可比公司2024年中报披露：中金公司私募股权业务占比为3.6%，股权投资占总资产比例未披露;第一创业私募股权业务占比未披露，股权投资占总资产比例为1.49%;首创证券私募股权业务占比未披露，股权投资占总资产比例为0.68%。资产评估专业人员选取的三家可比公司与被评估单位的业务类型差异大，均不具有可比性。\n2.仅采用市场法一种方法进行评估的理由不成立。\n资产评估专业人员已收集被投资项目基准日财务报表、2024年半年度基金运营管理情况报告、评估基准日的清产核资审计报告等资料。在具备采用不同评估方法条件的情况下，资产评估专业人员以无法取得被投资项目较完整的财务资料、无法对被投资项目进行评估为由不采用其他评估方法，最终仅采用市场法一种方法进行评估。\n3.未修正对评估结论有影响的重要因素。\n根据被评估单位公司章程，基金管理人对项目投资收益享有超额收益奖励分成。资产评估专业人员在采用市场法评估时，未调查可比公司的项目投资收益分配方式，也未将其作为关键可比条件对所选可比公司进行修正，导致评估结论不合理。\n4.计算股权折扣率的假设和方法不合理。\n本次评估目的为某资产管理中心拟转让其持有的某投资有限公司的股权提供价值参考依据。\n被评估单位公司章程中显示项目退出收益分配时，某资产管理中心只收取持股比例15.65%对应投资收益的50%，剩余50%按照基金股东出资比例奖励除某资产管理中心外的其他股东。\n资产评估专业人员在计算某资产管理中心持有的被评估单位15.65%股权时，假设股权价值中所有权与收益权各占比50%，确定股权折扣率为：1-50%-（50%×50%）=25%。资产评估专业人员作出的评估假设“股权价值中所有权与收益权各占比50%”与公司章程约定不一致。\n5.重要资产评估档案缺失。\n资产评估档案无交易性金融资产（股权投资）的产权证明文件及权属核实记录，评估基准日交易性金融资产（股权投资）占资产总额比例约99%。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等证据予以证实。\n二、行政处罚决定\n依据《资产评估行业财政监督管理办法》第四十六条，财政部认定上述事项不符合《资产评估执业准则——企业价值》第五条、第六条、第十一条第一项、第十八条、第三十三条第二项，构成重大遗漏，违反了《中华人民共和国资产评估法》第十四条第七项等有关规定。\n你作为上述评估报告的签字资产评估师，对上述问题负有责任。依据《中华人民共和国资产评估法》第四十四条第五项的规定，财政部决定给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026年1月19日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕6号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202603/t20260316_3985401.htm", "date": "2026-01-19", "id": "5bb0117e14dfb3493525da1ed908a909", "content": "财政部行政处罚决定书（财监法〔2026〕6号）\n财监法〔2026〕6 号\n财政部行政处罚决定书\n当 事 人：李森木\n地      址：广东省湛江市赤坎区\n根据《中华人民共和国资产评估法》等法律规定，财政部组织检查组于2025年对广东千福田资产土地房地产评估规划测绘有限公司（以下称广东千福田）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、检查发现的主要问题\n广东千福田出具的粤千福田资评报字〔2024〕0919B001号资产评估报告存在以下问题：\n1.采用市场法评估时选取的评估案例不可比。\n被评估单位主营业务为私募股权投资，评估基准日交易性金融资产（股权投资）占资产总额比例约99%。采用市场法（价值比率为市净率）评估时，选取的可比公司为中金公司（SH.601995）、第一创业（SZ.002797）、首创证券（SH.601136）。根据3家可比公司2024年中报披露：中金公司私募股权业务占比为3.6%，股权投资占总资产比例未披露;第一创业私募股权业务占比未披露，股权投资占总资产比例为1.49%;首创证券私募股权业务占比未披露，股权投资占总资产比例为0.68%。资产评估专业人员选取的三家可比公司与被评估单位的业务类型差异大，均不具有可比性。\n2.仅采用市场法一种方法进行评估的理由不成立。\n资产评估专业人员已收集被投资项目基准日财务报表、2024年半年度基金运营管理情况报告、评估基准日的清产核资审计报告等资料。在具备采用不同评估方法条件的情况下，资产评估专业人员以无法取得被投资项目较完整的财务资料、无法对被投资项目进行评估为由不采用其他评估方法，最终仅采用市场法一种方法进行评估。\n3.未修正对评估结论有影响的重要因素。\n根据被评估单位公司章程，基金管理人对项目投资收益享有超额收益奖励分成。资产评估专业人员在采用市场法评估时，未调查可比公司的项目投资收益分配方式，也未将其作为关键可比条件对所选可比公司进行修正，导致评估结论不合理。\n4.计算股权折扣率的假设和方法不合理。\n本次评估目的为某资产管理中心拟转让其持有的某投资有限公司的股权提供价值参考依据。\n被评估单位公司章程中显示项目退出收益分配时，某资产管理中心只收取持股比例15.65%对应投资收益的50%，剩余50%按照基金股东出资比例奖励除某资产管理中心外的其他股东。\n资产评估专业人员在计算某资产管理中心持有的被评估单位15.65%股权时，假设股权价值中所有权与收益权各占比50%，确定股权折扣率为：1-50%-（50%×50%）=25%。资产评估专业人员作出的评估假设“股权价值中所有权与收益权各占比50%”与公司章程约定不一致。\n5.重要资产评估档案缺失。\n资产评估档案无交易性金融资产（股权投资）的产权证明文件及权属核实记录，评估基准日交易性金融资产（股权投资）占资产总额比例约99%。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等证据予以证实。\n二、行政处罚决定\n依据《资产评估行业财政监督管理办法》第四十六条，财政部认定上述事项不符合《资产评估执业准则——企业价值》第五条、第六条、第十一条第一项、第十八条、第三十三条第二项，构成重大遗漏，违反了《中华人民共和国资产评估法》第十四条第七项等有关规定。\n你作为上述评估报告的签字资产评估师，对上述问题负有责任。依据《中华人民共和国资产评估法》第四十四条第五项的规定，财政部决定给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026年1月19日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕5号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202603/t20260316_3985400.htm", "date": "2026-01-19", "id": "de28d9c9ba4d84826c989a5fe2c94a6c", "content": "财政部行政处罚决定书（财监法〔2026〕5号）\n财监法〔2026〕5 号\n财政部行政处罚决定书\n当 事 人：广东千福田资产土地房地产评估规划测绘有限公司\n地      址：广东省湛江市赤坎区人民大道北41号京基大厦19层\n根据《中华人民共和国资产评估法》等法律的规定，财政部组织检查组于2025年对你公司执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、检查发现的主要问题\n（一）你公司出具的粤千福田资评报字〔2024〕0919B001号资产评估报告（以下称第0919B001号报告）存在以下问题：\n1.采用市场法评估时选取的评估案例不可比。\n被评估单位主营业务为私募股权投资，评估基准日交易性金融资产（股权投资）占资产总额比例约99%。你公司资产评估专业人员采用市场法（价值比率为市净率）评估时，选取的可比公司为中金公司（SH.601995）、第一创业（SZ.002797）、首创证券（SH.601136）。根据3家可比公司2024年中报披露：中金公司私募股权业务占比为3.6%，股权投资占总资产比例未披露;第一创业私募股权业务占比未披露，股权投资占总资产比例为1.49%;首创证券私募股权业务占比未披露，股权投资占总资产比例为0.68%。你公司资产评估专业人员选取的三家可比公司与被评估单位的业务类型差异大，均不具有可比性。\n2.仅采用市场法一种方法进行评估的理由不成立。\n你公司资产评估专业人员已收集被投资项目基准日财务报表、2024年半年度基金运营管理情况报告、评估基准日的清产核资审计报告等资料。在具备采用不同评估方法条件的情况下，你公司资产评估专业人员以无法取得被投资项目较完整的财务资料、无法对被投资项目进行评估为由不采用其他评估方法，最终仅采用市场法一种方法进行评估。\n3.未修正对评估结论有影响的重要因素。\n根据被评估单位公司章程，基金管理人对项目投资收益享有超额收益奖励分成。你公司资产评估专业人员在采用市场法评估时，未调查可比公司的项目投资收益分配方式，也未将其作为关键可比条件对所选可比公司进行修正，导致评估结论不合理。\n4.计算股权折扣率的假设和方法不合理。\n本次评估目的为某资产管理中心拟转让其持有的某投资有限公司的股权提供价值参考依据。\n被评估单位公司章程中显示项目退出收益分配时，某资产管理中心只收取持股比例15.65%对应投资收益的50%，剩余50%按照基金股东出资比例奖励除某资产管理中心外的其他股东。\n你公司资产评估专业人员在计算某资产管理中心持有的被评估单位15.65%股权时，假设股权价值中所有权与收益权各占比50%，确定股权折扣率为：1-50%-（50%×50%）=25%。你公司资产评估专业人员作出的评估假设“股权价值中所有权与收益权各占比50%”与公司章程约定不一致。\n5.重要资产评估档案缺失。\n资产评估档案无交易性金融资产（股权投资）的产权证明文件及权属核实记录，评估基准日交易性金融资产（股权投资）占资产总额比例约99%。\n（二）不如实提供检查资料。\n你公司2024年度实际出具有效资产评估报告330份，提供给检查组的《2024年度资产评估报告明细表》仅含2024年度有效评估报告278份，瞒报有效资产评估报告52份，瞒报率15.76%。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等证据予以证实。\n二、行政处罚决定\n依据《资产评估行业财政监督管理办法》第四十六条，财政部认定上述事项（一）不符合《资产评估执业准则——企业价值》第五条、第六条、第十一条第一项、第十八条、第三十三条第二项，构成重大遗漏，违反了《中华人民共和国资产评估法》第二十条第六项等有关规定。\n依据《中华人民共和国资产评估法》第十七条第三款，财政部认定你公司存在不如实提供检查资料的行为，违反了《财政部门监督办法》第十四条第二款等有关规定。\n依据《中华人民共和国资产评估法》第四十七条第一款第六项、《财政部门监督办法》第二十五条第二项的规定，财政部决定给予你公司警告、没收第0919B001号报告项目违法所得8万元并处罚款8万元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部广东监管局联系，凭财政部广东监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将违法所得和罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026年1月19日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕4号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202603/t20260316_3985399.htm", "date": "2026-01-19", "id": "cd4c38cc43bfea387d1cf83b9a187951", "content": "财政部行政处罚决定书（财监法〔2026〕4号）\n财监法〔2026〕4 号\n财政部行政处罚决定书\n当 事 人：徐亮\n地      址：江苏省南京市秦淮区\n根据《中华人民共和国资产评估法》等法律规定，财政部组织检查组于2025年对江苏象仁土地房地产资产评估有限公司（以下称江苏象仁）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、检查发现的主要问题\n江苏象仁出具的苏象仁资评报字〔2024〕第0013号资产评估报告存在以下问题：\n资产评估专业人员采用收益法评估房地产和设备时，预测期内机器设备折旧合计金额明显高于预测期内资本性支出总额与评估基准日机器设备账面净值之和，且无合理解释。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等证据予以证实。\n二、行政处罚决定\n依据《资产评估行业财政监督管理办法》第四十六条，财政部认定上述事项不符合《以财务报告为目的的评估指南》第五条，构成重大遗漏，违反了《中华人民共和国资产评估法》第十四条第七项等有关规定。\n你作为上述评估报告的签字资产评估师，对上述问题负有责任。依据《中华人民共和国资产评估法》第四十四条第五项的规定，财政部决定给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026年1月19日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕3号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202603/t20260316_3985397.htm", "date": "2026-01-19", "id": "b5e17557effc2d60dfbdef4a598ec93c", "content": "财政部行政处罚决定书（财监法〔2026〕3号）\n财监法〔2026〕3 号\n财政部行政处罚决定书\n当 事 人：马利\n地      址：江苏省南京市秦淮区\n根据《中华人民共和国资产评估法》等法律规定，财政部组织检查组于2025年对江苏象仁土地房地产资产评估有限公司（以下称江苏象仁）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、检查发现的主要问题\n江苏象仁出具的苏象仁资评报字〔2024〕第0010号资产评估报告存在以下问题：\n资产评估专业人员在未与上市公司及注册会计师沟通的情况下，擅自调整关键评估参数。如评估报告中的折现率为12.52%，该上市公司2023年年度报告（以下称年报）披露的折现率为14%，评估报告的评估结论（1,574.07万元）与年报披露的评估结果（1,574.07万元）却相同。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等证据予以证实。\n二、行政处罚决定\n依据《资产评估行业财政监督管理办法》第四十六条，财政部认定上述事项不符合《以财务报告为目的的评估指南》第五条、第八条，构成重大遗漏，违反了《中华人民共和国资产评估法》第十四条第七项等有关规定。\n你作为上述评估报告的签字资产评估师，对上述问题负有责任。依据《中华人民共和国资产评估法》第四十四条第五项的规定，财政部决定给予你警告、责令停止从业九个月的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026年1月19日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕2号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202603/t20260316_3985396.htm", "date": "2026-01-19", "id": "ed9d3d4e29d1c80c94bc1d5b430ab7b8", "content": "财政部行政处罚决定书（财监法〔2026〕2号）\n财监法〔2026〕2 号\n财政部行政处罚决定书\n当 事 人：张荣荣\n地      址：江苏省南京市秦淮区\n根据《中华人民共和国资产评估法》等法律规定，财政部组织检查组于2025年对江苏象仁土地房地产资产评估有限公司（以下称江苏象仁）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、检查发现的主要问题\n（一）江苏象仁出具的苏象仁资评报字〔2024〕第0010号资产评估报告存在以下问题：\n资产评估专业人员在未与上市公司及注册会计师沟通的情况下，擅自调整关键评估参数。如评估报告中的折现率为12.52%，该上市公司2023年年度报告（以下称年报）披露的折现率为14%，评估报告的评估结论（1,574.07万元）与年报披露的评估结果（1,574.07万元）却相同。\n（二）江苏象仁出具的苏象仁资评报字〔2024〕第0013号资产评估报告存在以下问题：\n资产评估专业人员采用收益法评估房地产和设备时，预测期内机器设备折旧合计金额明显高于预测期内资本性支出总额与评估基准日机器设备账面净值之和，且无合理解释。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等证据予以证实。\n二、行政处罚决定\n依据《资产评估行业财政监督管理办法》第四十六条，财政部认定上述事项不符合《以财务报告为目的的评估指南》第五条、第八条，构成重大遗漏，违反了《中华人民共和国资产评估法》第十四条第七项等有关规定。\n你作为上述评估报告的签字资产评估师，对上述问题负有责任。依据《中华人民共和国资产评估法》第四十四条第五项的规定，财政部决定给予你警告、责令停止从业一年的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026年1月19日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2026〕1号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202603/t20260316_3985394.htm", "date": "2026-01-19", "id": "735c2983076645616cc268651be719af", "content": "财政部行政处罚决定书（财监法〔2026〕1号）\n财监法〔2026〕1 号\n财政部行政处罚决定书\n当 事 人：江苏象仁土地房地产资产评估有限公司\n地      址：江苏省南京市秦淮区太平南路389号凤凰和睿大厦807室\n根据《中华人民共和国资产评估法》等法律规定，财政部组织检查组于2025年对你公司执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、检查发现的主要问题\n（一）你公司出具的苏象仁资评报字〔2024〕第0010号资产评估报告（以下称第0010号报告）存在以下问题：\n你公司资产评估专业人员在未与上市公司及注册会计师沟通的情况下，擅自调整关键评估参数。如评估报告中的折现率为12.52%，该上市公司2023年年度报告（以下称年报）披露的折现率为14%，评估报告的评估结论（1,574.07万元）与年报披露的评估结果（1,574.07万元）却相同。\n（二）你公司出具的苏象仁资评报字〔2024〕第0013号资产评估报告（以下称第0013号报告）存在以下问题：\n你公司资产评估专业人员采用收益法评估房地产和设备时，预测期内机器设备折旧合计金额明显高于预测期内资本性支出总额与评估基准日机器设备账面净值之和，且无合理解释。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等证据予以证实。\n二、行政处罚决定\n依据《资产评估行业财政监督管理办法》第四十六条，财政部认定上述事项不符合《以财务报告为目的的评估指南》第五条、第八条，构成重大遗漏，违反了《中华人民共和国资产评估法》第二十条第六项等有关规定。\n依据《中华人民共和国资产评估法》第四十七条第一款第六项的规定，财政部决定给予你公司警告、责令停业三个月、没收第0010号报告项目违法所得5万元并处罚款15万元、没收第0013号报告项目违法所得14万元并处罚款14万元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部江苏监管局联系，凭财政部江苏监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将违法所得和罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2026年1月19日"}, {"source": "国家税务局", "category": "留言咨询", "title": "我们的一个供应商最近注销了，没办法补开发票，我们手里只有付款记录和采购协议，相应的支出还能税前扣除吗？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5246568/content.html", "date": "2026-01-04", "id": "6bc84ecf33be0b867f5ec861fbf64205", "content": "答：\n企业按规定提供相应资料，证实业务及支出的真实性后，可以进行企业所得税税前扣除。\n按照《企业所得税税前扣除凭证管理办法》第十四条规定：\n企业在补开、换开发票、其他外部凭证过程中，因对方注销、撤销、依法被吊销营业执照、被税务机关认定为非正常户等特殊原因无法补开、换开发票、其他外部凭证的，可凭以下资料证实支出真实性后，其支出允许税前扣除：\n（一）无法补开、换开发票、其他外部凭证原因的证明资料(包括工商注销、机构撤销、列入非正常经营户、破产公告等证明资料)；\n（二）相关业务活动的合同或者协议；\n（三）采用非现金方式支付的付款凭证；\n（四）货物运输的证明资料；\n（五）货物入库、出库内部凭证；\n（六）企业会计核算记录以及其他资料。\n前款第一项至第三项为必备资料。\n所以，因对方注销等原因无法补开发票的，只要企业按规定提供的材料能证明业务及支出的真实性，就可以凭借这些资料税前扣除。"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕358号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260428_3988699.htm", "date": "2025-12-30", "id": "fda0468f205085c8d9f66d2afee6c7a8", "content": "财政部行政处罚决定书（财监法〔2025〕358号）\n财监\n法\n〔\n202\n5\n〕\n358\n号\n财政部行政处罚\n决定\n书\n当 事 人：唐赓\n地    址：广西南宁市青秀区金湖路\n59\n号地王国际商会中心\n32\n层\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于\n2024\n年对祥浩（广西）会计师事务所（特殊普通合伙\n，\n以下称祥浩所）执业质量等情况开展了检查。检查发现的主要问题和行政处罚\n决定\n如下：\n祥浩所对广西三鹤茶业有限公司\n2023\n年度财务报表发表的审计意见类型不恰当\n。\n广西三鹤茶业有限公司（以下称广西三鹤）由广西供销投资集团有限公司与广西梧州茶厂有限公司（以下称梧州茶厂）共同出资设立，广西三鹤与梧州茶厂为同一法定代表人，\n2\n家公司的生产经营活动统一由梧州茶厂组织开展，人员、资产实行一体化管理。广西三鹤存在重大内部控制缺陷\n，\n无法作为独立的会计核算主体\n对资产状况、生产成本归集、应付职工薪酬、营业收入等进行准确核算。\n祥浩所在对广西三鹤\n2023\n年度财务报表审计中，无法通过恰当的审计程序，获取充分、适当的审计证据核实固定资产、存货、营业收入、营业成本等财务报表项目的余额或发生额的准确性，不能得出财务报表整体不存在重大错报的结论，该所发表无保留意见不恰当。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第三款，\n不符合\n《中国注册会计师审计准则第\n1502\n号——在审计报告中发表非无保留意见》第七条第（二）项\n等有关\n规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，财政部\n决定\n给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n5\n年\n12\n月\n30\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕357号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260428_3988698.htm", "date": "2025-12-30", "id": "8ad15827c5bbaaf2df78b903b5b01ed6", "content": "财政部行政处罚决定书（财监法〔2025〕357号）\n财监\n法\n〔\n202\n5\n〕\n357\n号\n财政部行政处罚\n决定\n书\n当 事 人：朱石泉\n地    址：广西南宁市青秀区金湖路\n59\n号地王国际商会中心\n32\n层\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于\n2024\n年对祥浩（广西）会计师事务所（特殊普通合伙\n，\n以下称祥浩所）执业质量等情况开展了检查。检查发现的主要问题和行政处罚\n决定\n如下：\n一、对广西三鹤茶业有限公司\n2023\n年度财务报表发表的审计意见类型不恰当\n广西三鹤茶业有限公司（以下称广西三鹤）由广西供销投资集团有限公司与广西梧州茶厂有限公司（以下称梧州茶厂）共同出资设立，广西三鹤与梧州茶厂为同一法定代表人，\n2\n家公司的生产经营活动统一由梧州茶厂组织开展，人员、资产实行一体化管理。广西三鹤存在重大内部控制缺陷，无法作为独立的会计核算主体对资产状况、生产成本归集、应付职工薪酬、营业收入等\n进行准确核算。\n祥浩所在对广西三鹤\n2023\n年度财务报表审计中，无法通过恰当的审计程序，获取充分、适当的审计证据核实固定资产、存货、营业收入、营业成本等财务报表项目的余额或发生额的准确性，不能得出财务报表整体不存在重大错报的结论，该所发表无保留意见不恰当。\n二、未履行必要的审计程序，未获取充分适当的审计证据的情况下为广西大泽建设工程有限公司出具审计报告，且未识别企业财务报表存在的重大错报\n（一）未履行必要的审计程序，未获取充分适当的审计证据的情况下出具审计报告\n。\n1.\n广西大泽建设工程有限公司（以下称广西大泽）\n2023\n年度财务报表列示“管理费用本期金额\n4,628,440.16\n元、上期金额\n3,831,990.04\n元，营业外支出本期金额\n829,116.09\n元、上期金额\n1,572,296.29\n元，应交税费期末余额\n943,478.89\n元、期初余额\n3,729,954.31\n元”。祥浩所在对广西大泽\n2023\n年度财务报表审计中，未对上述科目执行审计程序。截至现场检查结束日，该所未提供上述科目的审计底稿。\n2.\n广西大泽\n2023\n年度财务报表列示“应收账款期末余额\n29,433,312.57\n元、应付账款期末余额\n29,616,858.47\n元、预付款项期末余额\n3,736,377.23\n元、其他应收款期末余额\n627,013.08\n元”。祥浩所在对广西大泽\n2023\n年度财务报表审计中，对上述往来款项仅执行函证程序，未执行其他必要的审计程序。截至现场检查结束日，该所未提供上述科目除函证外的审计底稿。\n3.\n祥浩所\n2023\n年\n5\n月出具广西大泽\n2022\n年度财务报表审计报告后，广西大泽在未与注册会计师进行沟通的情况下，暂估工程成本\n29,970,000\n元，调整\n2022\n年相关科目金额，并按照调整后的企业财务报表进行纳税申报。该所在对广西大泽\n2023\n年度财务报表审计中，审计底稿记录广西大泽\n2023\n年度期初重大会计差错更正\n29,970,000\n元，但未对该期初重大会计差错执行相关审计程序。\n4.\n广西大泽截至\n2023\n年\n12\n月\n31\n日固定资产原值\n1,284,391.30\n元、累计折旧\n466,155.89\n元、净值\n818,235.41\n元；无形资产原值\n30,000,000\n元、累计摊销\n1,263,297.88\n元、净值\n28,736,702.12\n元。祥浩所在对广西大泽\n2023\n年度财务报表审计中，未对固定资产累计折旧、无形资产累计摊销进行测算；未编制对固定资产执行监盘程序的审计底稿，未记录固定资产监盘人员、时间，仅有固定资产照片，无法证明项目组实施了现场监盘程序。\n（二）未保持应有的职业怀疑，未识别企业财务报表存在的重大错报\n。\n1.\n北京中宇泰诺资产评估有限公司（以下称中宇泰诺资产评估公司）\n2023\n年\n7\n月为广西大泽股东购买基于太阳能和污泥的综合能源发电系统、一种具有风力发电功能的可移动红绿灯等\n2\n项实用新型专利。广西大泽\n2023\n年\n9\n月\n1\n日出具《关于进行资产评估有关事项的说明》，预测上述\n2\n项实用新型专利的收益为“\n2023\n年\n9-12\n月收益\n2050\n万元；\n2024\n年收益\n8200\n万元；\n2025\n年收益\n9400\n万元；\n2026\n年收益\n9100\n万元；\n2027\n年收益\n8700\n万元；\n2028\n年收益\n8200\n万元”。中宇泰诺资产评估公司根据以上收益预测，采用收益法评估上述\n2\n项实用新型专利市场价值共计\n30,000,000\n元。\n广西大泽\n基于上述评估结论，于\n2023\n年\n9\n月\n13\n日分别增加无形资产和实收资本\n30,000,000\n元，占\n2023\n年末无形资产账面原值、实收资本的\n100%\n。经查，截至检查日广西大泽未对上述\n2\n项实用新型专利进行具体生产安排，未产生相关收益，该公司出具的《关于进行资产评估有关事项的说明》中对未来收益的预测无明确证据支持，预测金额不合理，评估结论不应作为无形资产初始计量的基础，\n2023\n年末多计无形资产账面原值和实收资本\n29,977,000\n元。\n祥浩所在对广西大泽\n2023\n年度财务报表审计中，仅检查了上述\n２\n项实用新型专利的产权证书、资产评估报告以及企业出资相关证明文件，未对用作审计证据的信息执行利用管理层的专家的审计程序，未评价管理层的专家的胜任能力、专业素质和客观性；未了解管理层的专家的工作；未评价将管理层的专家的工作用作相关认定的审计证据的适当性；该所对\n２\n项实用新型专利的评估结论明显不合理的异常情况未保持职业怀疑，未进一步设计实施审计程序以验证相关资产价值的合理性，未关注\n２\n位股东取得相关实用新型专利付出对价情况并与评估结论进行比对核实，未识别相关重大错报。\n2.\n根据广西大泽的收入确认政策及与项目单位双方确认的工程过程结算表，截至\n2023\n年末该公司累计应确认收入\n184,774,946.99\n元，账面实际确认收入\n173,385,037.61\n元，未及时确认收入\n11,389,909.38\n元，其中\n2022\n年\n5,646,980.68\n元、\n2023\n年\n5,742,928.70\n元。\n祥浩所在对广西大泽\n2023\n年度财务报表审计中，审计档案仅见企业项目进度收入台账和成本台账、部分项目的收入合同及工程费用结算表等被审计企业的资料，该所对营业收入、营业成本等科目未实施必要的审计程序，未取得充分适当的审计证据，未识别相关重大错报。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第三款，《会计师事务所执业许可和监督管理办法》第六十条第（一）项，\n不符合\n《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》第二十八条，《中国注册会计师审计准则第\n1301\n号——审计证据》第十条，《中国注册会计师审计准则第\n1502\n号——在审计报告中发表非无保留意见》第七条第（二）项\n等有关\n规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款、《会计师事务所执业许可和监督管理办法》第七十条第一款的规定，财政部\n决定\n给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n5\n年\n12\n月\n30\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕356号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260428_3988697.htm", "date": "2025-12-30", "id": "ab1b88618154489a80004b4032ae2cb6", "content": "财政部行政处罚决定书（财监法〔2025〕356号）\n财监\n法\n〔\n202\n5\n〕\n356\n号\n财政部行政处罚\n决定\n书\n当 事 人：梁金健\n地    址：广西南宁市青秀区金湖路\n59\n号地王国际商会中心\n32\n层\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于\n2024\n年对祥浩（广西）会计师事务所（特殊普通合伙\n，\n以下称祥浩所）执业质量等情况开展了检查。检查发现的主要问题和行政处罚\n决定\n如下：\n未履行必要的审计程序，未获取充分适当的审计证据的情况下为广西大泽建设工程有限公司出具审计报告，且未识别企业财务报表存在的重大错报。\n一、\n未履行必要的审计程序，未获取充分适当的审计证据的情况下出具审计报告\n（一）\n广西大泽建设工程有限公司（以下称广西大泽）\n2023\n年度财务报表列示“管理费用本期金额\n4,628,440.16\n元、上期金额\n3,831,990.04\n元，营业外支出本期金额\n829,116.09\n元、上期金额\n1,572,296.29\n元，应交税费期末余额\n943,478.89\n元、期初余额\n3,729,954.31\n元”。祥浩所在对广西大泽\n2023\n年度财务报表审计中，未对上述科目执行审计程序。截至现场检查结束日，该所未提供上述科目的审计底稿。\n（二）\n广西大泽\n2023\n年度财务报表列示“应收账款期末余额\n29,433,312.57\n元、应付账款期末余额\n29,616,858.47\n元、预付款项期末余额\n3,736,377.23\n元、其他应收款期末余额\n627,013.08\n元”。祥浩所在对广西大泽\n2023\n年度财务报表审计中，对上述往来款项仅执行函证程序，未执行其他必要的审计程序。截至现场检查结束日，该所未提供上述科目除函证外的审计底稿。\n（三）\n祥浩所\n2023\n年\n5\n月出具广西大泽\n2022\n年度财务报表审计报告后，广西大泽在未与注册会计师进行沟通的情况下，暂估工程成本\n29,970,000\n元，调整\n2022\n年相关科目金额，并按照调整后的企业财务报表进行纳税申报。该所在对广西大泽\n2023\n年度财务报表审计中，审计底稿记录广西大泽\n2023\n年度期初重大会计差错更正\n29,970,000\n元，但未对该期初重大会计差错执行相关审计程序。\n（四）\n广西大泽截至\n2023\n年\n12\n月\n31\n日固定资产原值\n1,284,391.30\n元、累计折旧\n466,155.89\n元、净值\n818,235.41\n元；无形资产原值\n30,000,000\n元、累计摊销\n1,263,297.88\n元、净值\n28,736,702.12\n元。祥浩所在对广西大泽\n2023\n年度财务报表审计中，未对固定资产累计折旧、无形资产累计摊销进行测算；未编制对固定资产执行监盘程序的审计底稿，未记录固定资产监盘人员、时间，仅有固定资产照片，无法证明项目组实施了现场监盘程序。\n二、\n未保持应有的职业怀疑，未识别企业财务报表存在的重大错报\n（一）\n北京中宇泰诺资产评估有限公司（以下称中宇泰诺资产评估公司）\n2023\n年\n7\n月为广西大泽股东购买基于太阳能和污泥的综合能源发电系统、一种具有风力发电功能的可移动红绿灯等\n2\n项实用新型专利。广西大泽\n2023\n年\n9\n月\n1\n日出具《关于进行资产评估有关事项的说明》，预测上述\n2\n项实用新型专利的收益为“\n2023\n年\n9-12\n月收益\n2050\n万元；\n2024\n年收益\n8200\n万元；\n2025\n年收益\n9400\n万元；\n2026\n年收益\n9100\n万元；\n2027\n年收益\n8700\n万元；\n2028\n年收益\n8200\n万元”。中宇泰诺资产评估公司根据以上收益预测，采用收益法评估上述\n2\n项实用新型专利市场价值共计\n30,000,000\n元。\n广西大泽\n基于上述评估结论，于\n2\n023\n年\n9\n月\n13\n日分别增加无形资产和实收资本\n30,000,000\n元，占\n2023\n年末无形资产账面原值、实收资本的\n100%\n。经查，截至检查日广西大泽未对上述\n2\n项实用新型专利进行具体生产安排，未产生相关收益，该公司出具的《关于进行资产评估有关事项的说明》中对未来收益的预测无明确证据支持，预测金额不合理，评估结论不应作为无形资产初始计量的基础，\n2023\n年末多计无形资产账面原值和实收资本\n29,977,000\n元。\n祥浩所在对广西大泽\n2023\n年度财务报表审计中，仅检查了上述\n２\n项实用新型专利的产权证书、资产评估报告以及企业出资相关证明文件，未对用作审计证据的信息执行利用管理层的专家的审计程序，未评价管理层的专家的胜任能力、专业素质和客观性；未了解管理层的专家的工作；未评价将管理层的专家的工作用作相关认定的审计证据的适当性；该所对\n２\n项实用新型专利的评估结论明显不合理的异常情况未保持职业怀疑，未进一步设计实施审计程序以验证相关资产价值的合理性，未关注\n２\n位股东取得相关实用新型专利付出对价情况并与评估结论进行比对核实，未识别相关重大错报。\n（二）\n根据广西大泽的收入确认政策及与项目单位双方确认的工程过程结算表，截至\n2023\n年末该公司累计应确认收入\n184,774,946.99\n元，账面实际确认收入\n173,385,037.61\n元，未及时确认收入\n11,389,909.38\n元，其中\n2022\n年\n5,646,980.68\n元、\n2023\n年\n5,742,928.70\n元。\n祥浩所在对广西大泽\n2023\n年度财务报表审计中，审计档案仅见企业项目进度收入台账和成本台账、部分项目的收入合同及工程费用结算表等被审计企业的资料，该所对营业收入、营业成本等科目未实施必要的审计程序，未取得充分适当的审计证据，未识别相关重大错报。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第三款，《会计师事务所执业许可和监督管理办法》第六十条第（一）项，\n不符合\n《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》第二十八条，《中国注册会计师审计准则第\n1301\n号——审计证据》第十条\n等有关\n规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款、《会计师事务所执业许可和监督管理办法》第七十条第一款的规定，财政部\n决定\n给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n5\n年\n12\n月\n30\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕355号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260428_3988696.htm", "date": "2025-12-30", "id": "fcbbd2d38e76c925c347b5520dfb0749", "content": "财政部行政处罚决定书（财监法〔2025〕355号）\n财监\n法\n〔\n202\n5\n〕\n355\n号\n财政部行政处罚\n决定\n书\n当 事 人：陆凤坡\n地    址：河北省石家庄市裕华区槐安东路\n105\n号怀特商业广场\nA\n座\n10\n层\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于\n2024\n年对中审众环会计师事务所（特殊普通合伙\n，\n以下称中审众环所）执业质量等情况开展了检查。检查发现的主要问题和行政处罚\n决定\n如下：\n未识别被审计单位财务报表存在重大错报，发表的审计意见不恰当\n。\n1.\n未识别被审计单位将不实际控制的公司纳入财务报表合并范围的重大错报。\n冀中能源井陉矿业集团有限公司（以下称井矿集团）将不实际控制的山西汾西瑞泰井矿正行煤业有限公司（以下称瑞泰正行）纳入财务报表合并范围，导致\n2023\n年度合并财务报表期末多计资产\n155,060\n万\n元，多计负债\n133,918.42\n万\n元，\n多计净资产\n21,141.58\n万元。\n中审众环所在对井矿集团\n2023\n年度财务报表执行审计程序时，未获取瑞泰正行相关协议，未确认合并是否恰当，审计程序实施不到位，未识别井矿集团财务报表合并范围的错报，未对合并范围错报提出调整意见。\n2.\n未识别按成本法核算的\n3\n家公司不符合列报要求的重大错报。\n井矿集团\n2023\n年度将已移交冀中能源邢台矿业集团有限责任公司实际管理的瑞泰正行等\n3\n家公司，作为长期股权投资核算和列报，导致集团单体财务报表多计资产\n73,373.70\n万元\n，合并财务报表多计资产\n59,596.01\n万\n元。\n中审众环所在对井矿集团\n2023\n年度财务报表执行审计程序时，未关注瑞泰正行等\n3\n家公司的股东权益已转移且账面价值与实际价值存在重大差异，未识别该项错报，未提出审计调整意见。\n3.\n未识别借款\n130,000\n万元\n调整至资本公积列报\n的\n重大错报。\n井矿集团将统借统还的部分借款本金调整至资本公积列报，导致合并及单体财务报表多计资本公积\n130,000\n万元\n，少计其他应付款\n130,000\n万元\n。\n中审众环所在对井矿集团\n2023\n年度财务报表执行审计程序时，未关注井矿集团将\n130,000\n万元\n借款作为资本公积列报是否恰当，未识别该项错报，未提出审计调整建议。\n4.\n未识别将缴纳的职工医疗保险费用\n20,000\n万元\n计入其他应收款\n的\n重大错报。\n井矿集团将支付的职工医疗保险费用计入资产，导致合并层面多计资产\n20,000\n万元\n。\n中审众环所在对井矿集团\n2023\n年度财务报表执行审计程序时，未关注\n20,000\n万元\n参保费的款项性质，未识别该项错报，未提出审计调整建议。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了\n《中华人民共和国注册会计师法》第二十一条第一款，\n不符合\n《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》第二十八条、《中国注册会计师审计准则第\n1211\n号——重大错报风险的识别和评估》第三十三条、《中国注册会计师审计准则第\n1301\n号——审计证据》第十条、《中国注册会计师审计准则第\n1501\n号——对财务报表形成审计意见和出具审计报告》第十二条\n第一款、第二款第（一）（二）（三）项\n等\n有关\n规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第\n三十九条第二款\n的规定，财政部\n决定\n给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n5\n年\n12\n月\n30\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕354 号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260428_3988695.htm", "date": "2025-12-30", "id": "cec487f95925932100be45d9cf9ef2b0", "content": "财政部行政处罚决定书（财监法〔2025〕354 号）\n财监\n法\n〔\n202\n5\n〕\n354\n号\n财政部行政处罚\n决定\n书\n当 事 人：\n赵志强\n地    址：河北省石家庄市裕华区槐安东路\n105\n号怀特商业广场\nA\n座\n10\n层\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于\n2024\n年对中审众环会计师事务所（特殊普通合伙\n，\n以下称中审众环所）执业质量等情况开展了检查。检查发现的主要问题和行政处罚\n决定\n如下：\n未识别被审计单位财务报表存在重大错报，发表的审计意见不恰当\n。\n1.\n未识别被审计单位将不实际控制的公司纳入财务报表合并范围的重大错报。冀中能源井陉矿业集团有限公司（以下称井矿集团）将不实际控制的山西汾西瑞泰井矿正行煤业有限公司（以下称瑞泰正行）纳入财务报表合并范围，导致\n2023\n年度合并财务报表期末多计资产\n155,060\n万\n元，多计负债\n133,918.42\n万\n元，\n多计净资产\n21,141.58\n万元。\n中审众环所在对井矿集团\n2023\n年度财务报表执行审计程序时，未获取瑞泰正行相关协议，未确认合并是否恰当，审计程序实施不到位，未识别井矿集团财务报表合并范围的错报，未对合并范围错报提出调整意见。\n2.\n未识别按成本法核算的\n3\n家公司不符合列报要求的重大错报。井矿集团\n2023\n年度将已移交冀中能源邢台矿业集团有限责任公司实际管理的瑞泰正行等\n3\n家公司，作为长期股权投资核算和列报，导致集团单体财务报表多计资产\n73,373.70\n万\n元，合并财务报表多计资产\n59,596.01\n万\n元。\n中审众环所在对井矿集团\n2023\n年度财务报表执行审计程序时，未关注瑞泰正行\n等\n3\n家公司\n的股东权益已转移且账面价值与实际价值存在重大差异，未识别该项错报，未提出审计调整意见。\n3.\n未识别借款\n130,000\n万\n元\n调整至资本公积\n列报\n的\n重大错报。\n井矿集团将统借统还的部分借款本金调整至资本公积列报，导致合并及单体财务报表多计资本公积\n130,000\n万\n元，少计其他应付款\n130,000\n万\n元。\n中审众环所在对井矿集团\n2023\n年度财务报表执行审计程序时，未关注井矿集团将\n130,000\n万\n元借款作为资本公积列报是否恰当，未识别该项错报，未提出审计调整建议。\n4.\n未识别将缴纳的职工医疗保险费用\n20,000\n万\n元\n计入\n其他应收款\n的\n重大错报。\n井矿集团将支付的职工医疗保险费用计入资产，导致合并层面多计资产\n20,000\n万\n元。\n中审众环所在对井矿集团\n2023\n年度财务报表执行审计程序时，未关注\n20,000\n万\n元参保费的款项性质，未识别该项错报，未提出审计调整建议。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条\n第一款\n，\n不符合\n《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》第二十八条、《中国注册会计师审计准则第\n1211\n号——重大错报风险的识别和评估》第三十三条、《中国注册会计师审计准则第\n1301\n号——审计证据》第十条\n、《中国注册会计师审计准则第\n1501\n号——对财务报表形成审计意见和出具审计报告》第十二条\n第一款、第二款第（一）（二）（三）项\n等\n有关\n规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，财政部\n决定\n给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n5\n年\n12\n月\n30\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕353号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260428_3988694.htm", "date": "2025-12-30", "id": "1556750f8f78f86ecf819238c0f5b9d9", "content": "财政部行政处罚决定书（财监法〔2025〕353号）\n财监\n法\n〔\n202\n5\n〕\n353\n号\n财政部行政处罚\n决定\n书\n当 事 人：冀中能源井陉矿业集团有限公司\n地    址：河北省石家庄市井陉矿区中纬西路\n依照《中华人民共和国会计法》的规定，财政部组织检查组于\n2024\n年对你公司会计信息质量进行了检查。检查发现的主要问题和行政处罚\n决定\n如下：\n一、将不实际控制的公司纳入财务报表合并范围\n你公司\n2023\n年度将不实际控制的山西汾西瑞泰井矿正行煤业有限公司（以下称瑞泰正行）纳入财务报表合并范围，导致合并财务报表期末多计资产\n155,060\n万\n元，多计负债\n133,918.42\n万\n元，多计净资产\n21,141.58\n万\n元。\n二、长期股权投资核算错误\n你公司\n2023\n年度将已由冀中能源邢台矿业集团有限责任公司实际管理的瑞泰正行等\n3\n家公司，作为长期股权投资核算和列报，导致集团单体财务报表多计资产\n73,373.70\n万\n元，合并\n财务报表\n多计资产\n59,596.01\n万\n元。\n三、资本公积列报错误\n你公司无依据将“统借统还—借款—本金”科目部分余额调整至资本公积列报，导致合并及单体财务报表多计资本公积\n130,000\n万\n元，少计其他应付款\n130,000\n万\n元。\n四、将企业应负担已支付的职工医疗保险费用计入资产\n你公司将企业应负担已支付的职工医疗保险费用计入资产，导致合并层面多计资产\n20,000\n万元\n。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了\n2017\n年\n修改\n的《中华人民共和国会计法》第二十六条第\n（\n一\n）\n项，\n不符合\n《企业会计准则——基本准则》第十二条、第二十二条第\n（\n一\n）\n项，《企业会计准则第\n33\n号——合并财务报表》第七条，《企业会计准则第\n42\n号——持有待售的非流动资产、处置组和终止经营》第五条、第十三条\n等有关\n规定。\n依据\n2017\n年\n修改\n的《中华人民共和国会计法》第四十二条\n第一款\n第\n（\n六\n）\n项的规定，财政部\n决定\n给予你公司罚款\n5\n万元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部\n河北\n监管局联系，凭财政部\n河北\n监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n5\n年\n12\n月\n30\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕352号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260428_3988693.htm", "date": "2025-12-30", "id": "3681267aa07b66e3bb9820b6b7f52730", "content": "财政部行政处罚决定书（财监法〔2025〕352号）\n财监\n法\n〔\n202\n5\n〕\n352\n号\n财政部行政处罚\n决定\n书\n当 事 人：李云虹\n地    址：\n昆明市西山区人民西路\n315\n号云投财富商业广场\nB2\n幢\n20\n层\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于\n2024\n年对信永中和会计师事务所（特殊普通合伙，以下称信永中和所）执业质量等情况开展了检查。检查发现的主要问题和行政处罚\n决定\n如下：\n2019\n年，工银金融资产投资有限公司（以下称工银资产）和农银金融资产投资有限公司（以下称农银资产）分别向云南省投资控股集团有限公司（以下称云投集团）的子公司云南省铁路投资有限公司（以下称云南铁投）增资\n100,000\n万元\n，增资协议约定了固定投资收益率和优先分配权，未足额分配部分将累计至下一年度，投资期满后，需由云投集团或其指定第三方受让工银资产和农银资产所持的云南铁投股权，该增资款实为借款。\n2023\n年末，工银资产仍持有增资款\n70,000\n万元，\n云南铁投应将其确认为\n金融负债，但实际计入实收资本。\n2023\n年，云南铁投支付上述投资分红\n10,036.39\n万元，该分红款实为借款利息。由于该业务会计核算存在重大差错，导致云投集团\n2023\n年合并报表少计其他流动负债\n70,000\n万元，多计少数股东权益\n70,000\n万元，少计财务费用\n10,036.39\n万元，多计税前利润\n10,036.39\n万元。\n在云投集团\n2023\n年年报审计中，信永中和所对上述重大错报，未保持应有的职业怀疑，职业判断错误。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款、第二款第（一）项、第三款，\n不符合\n《中国注册会计师鉴证业务基本准则》第二十八条第一款、第三十条，《中国注册会计师审计准则第\n1101\n号——注册会计师的总体目标和审计工作的基本要求》第十条、第十七条、第二十八条等\n有关\n规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款的规定，财政部\n决定\n给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n5\n年\n12\n月\n30\n日"}, {"source": "财政部", 0\n万元，\n云南铁投\n应将其确认为金融负债，但实际计入实收资本。\n2023\n年，云南铁投支付投资分红\n10,036.39\n万元，该分红款实为借款利息。由于该业务会计核算存在重大差错，导致你公司\n2023\n年合并报表少计其他流动负债\n70,000\n万元，多计少数股东权益\n70,000\n万元，少计财务费用\n10,036.39\n万元，多计税前利润\n10,036.39\n万元。\n上述事实，有检查报告、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了\n2017\n年\n修改\n的《中华人民共和国会计法》第十三条第一款、第二十六条第\n（\n一\n）\n项，\n不符合\n《企业会计准则第\n37\n号——金融工具列报》第七条、第八条第\n（\n一\n）\n项等\n有\n关规定。\n依据\n2017\n年\n修改\n的《中华人民共和国会计法》第四十二条第一款第\n（\n五\n）\n项的规定，财政部\n决定\n给予你公司罚款\n5\n万元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部\n云南\n监管局联系，凭财政部\n云南\n监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n5\n年\n12\n月\n30\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕349号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260428_3988679.htm", "date": "2025-12-30", "id": "e61b8ce6406bc17875f49335959a56dd", "content": "财政部行政处罚决定书（财监法〔2025〕349号）\n财监\n法\n〔\n202\n5\n〕\n349\n号\n财政部行政处罚\n决定\n书\n当 事 人：邱凯\n地    址：\n宁波市鄞州区江东北路\n317\n号和丰创意广场和庭楼\n10\n楼\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于\n2024\n年对浙江科信会计师事务所（特殊普通合伙，以下称浙江科信）执业质量等情况开展了检查。检查发现的主要问题和行政处罚\n决定\n如下：\n一、\n未发现宁波市会展旅业有限公司（以下称宁波会展）\n以\n总额法代替净额法核算，多确认营业收入的重大会计差错\n1.\n宁波会展有关长龙航空、桂林航空机票包销业务中，宁波会展履行的不是机票的采购与销售职责，也未拥有机票定价权，对机票不具有控制权，在该业务中宁波会展为代理人，不属于主要责任人，应当按照净额法确认收入。宁波会展采用总额法确认上述业务收入，导致\n2023\n年度多计营业收入\n4.49\n亿元、营业成本\n4.49\n亿元。\n浙江科信已获取相关协议，对部分长龙航空、桂林航空机票\n包销业务收入进行了抽样测试，并且项目二审复核人对上述事项复核意见为“关注”，但未保持应有的职业怀疑，认可了企业的会计处理，未发现上述重大会计差错。\n2.\n宁波会展开展“东航汇”充值业务，只负责垫付资金及对充值账户的监管，在该业务中宁波会展为代理人，不属于主要责任人，应当按照净额法确认收入。宁波会展采用总额法确认上述业务收入，导致\n2023\n年度多计营业收入\n4,443.40\n万元、营业成本\n4,443.40\n万元。\n浙江科信对上述明显超过重要性水平的业务，未执行审计程序，认可了企业的会计处理，未发现上述重大会计差错。\n二、\n未发现宁波会展\n将\n代收代付款确认营业收入\n、营业成本\n的重大会计差错\n宁波会展将海丝之路项目和雪窦山项目代收代付款项确认为自身营业收入和营业成本，导致\n2023\n年度多计营业收入、营业成本\n412.74\n万元。\n浙江科信已获取海丝之路项目相关合同等关键审计证据，应当知晓代收代付款不应确认营业收入和营业成本，但未保持应有的职业怀疑，认可了企业的会计处理。对雪窦山项目收入和成本未执行审计程序，未发现上述重大会计差错。\n上述事实，有检查报告、反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款，\n不符合\n《中国注册会计师鉴证业务基本准则》第二十八条\n第一款、第二款\n，《中国注册会计师审计准则第\n1301\n号——审计证据》第十条\n等有关\n规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款\n的\n规定，财政部\n决定\n给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n5\n年\n12\n月\n30\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕348号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260428_3988678.htm", "date": "2025-12-30", "id": "d2677b39d359c5d0487ff90b53d33674", "content": "财政部行政处罚决定书（财监法〔2025〕348号）\n财监\n法\n〔\n202\n5\n〕\n348\n号\n财政部行政处罚\n决定\n书\n当 事 人：董珊珊\n地    址：\n宁波市鄞州区江东北路\n317\n号和丰创意广场和庭楼\n10\n楼\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组于\n2024\n年对浙江科信会计师事务所（特殊普通合伙，以下称浙江科信）执业质量等情况开展了检查。检查发现的主要问题和行政处罚\n决定\n如下：\n一、\n未发现宁波市会展旅业有限公司（以下称宁波会展）\n以\n总额法代替净额法核算，多确认营业收入的重大会计差错\n1.\n宁波会展有关长龙航空、桂林航空机票包销业务中，宁波会展履行的不是机票的采购与销售职责，也未拥有机票定价权，对机票不具有控制权，在该业务中宁波会展为代理人，不属于主要责任人，应当按照净额法确认收入。宁波会展采用总额法确认上述业务收入，导致\n2023\n年度多计营业收入\n4.49\n亿元、营业成本\n4.49\n亿元。\n浙江科信已获取相关协议，对部分长龙航空、桂林航空机票\n包销业务收入进行了抽样测试，并且项目二审复核人对上述事项复核意见为“关注”，但未保持应有的职业怀疑，认可了企业的会计处理，未发现上述重大会计差错。\n2\n.\n宁波会展开展“东航汇”充值业务，只负责垫付资金及对充值账户的监管，在该业务中宁波会展为代理人，不属于主要责任人，应当按照净额法确认收入。宁波会展采用总额法确认上述业务收入，导致\n2023\n年度多计营业收入\n4,443.40\n万元、营业成本\n4,443.40\n万元。\n浙江科信对上述明显超过重要性水平的业务，未执行审计程序，认可了企业的会计处理，未发现上述重大会\n计差错。\n二、\n未发现宁波会展\n将\n代收代付款确认营业收入\n、营业成本\n的重大会计差错\n宁波会展将海丝之路项目和雪窦山项目代收代付款项确认为自身营业收入和营业成本，导致\n2023\n年度多计营业收入、营业成本\n412.74\n万元。\n浙江科信已获取海丝之路项目相关合同等关键审计证据，\n应当知晓代收代付款不应确认营业收入和营业成本\n，但未保持应有的职业怀疑，认可了企业的会计处理。对雪窦山项目收入和成本未执行审计程序，未发现上述重大会计差错。\n上述事实，有检查报告、反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条第一款，\n不符合\n《中国注册会计师鉴证业务基本准则》第二十八条\n第一款、第二款\n，\n《中国注册会计师审计准则第\n1301\n号——审计证据》第十条\n等有关\n规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款\n的\n规定，财政部\n决定\n给予你警告的行政处罚。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n5\n年\n12\n月\n30\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕347号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260428_3988676.htm", "date": "2025-12-30", "id": "4d6a1589330e9dcabd9c9ea136b48d9b", "content": "财政部行政处罚决定书（财监法〔2025〕347号）\n财监\n法\n〔\n202\n5\n〕\n347\n号\n财政部行政处罚\n决定\n书\n当 事 人：吴悦\n地    址：浙江省宁波市海\n曙\n区机场路\n1000\n号\n6\n号楼\n255\n室\n依照《中华人民共和国会计法》的规定，财政部组织检查组于\n2024\n年对宁波市会展旅业有限公司（以下称宁波会展）会计信息质量进行了检查。检查发现的主要问题和行政处罚\n决定\n如下：\n一、以总额法代替净额法核算包销机票业务收入，多计收入及成本\n宁波会展有关长龙航空、桂林航空机票包销业务中，宁波会展履行的不是机票的采购与销售职责，也未拥有机票定价权，对机票不具有控制权，在该业务中宁波会展为代理人，不属于主要责任人，应当按照净额法确认收入。宁波会展采用总额法确认上述业务收入，导致\n2023\n年度多计营业收入\n4.49\n亿元、营业成本\n4.49\n亿元。\n二、\n以总额法代替净额法核算机票虚拟账户充值业务收入，\n多计收入及成本\n宁波会展开展“东航汇”充值业务，只负责垫付资金及对充值账户的监管，在该业务中宁波会展为代理人，不属于主要责任人，应当按照净额法确认收入。宁波会展采用总额法确认上述业务收入，导致\n2023\n年度多计营业收入\n4,443.40\n万元、营业成本\n4,443.40\n万元。\n三、将代收代付款项确认为营业收入\n、营业成本\n，多计收入及成本\n宁波会展将海丝之路项目和雪窦山项目代收代付款项确认为自身营业收入和营业成本，导致\n2023\n年度多计营业收入、营业成本\n412.74\n万元。\n上述事实，有检查报告、反馈意见等相关证据予以证实。\n上述行为违反了\n2017\n年\n修改\n的《中华人民共和国会计法》第二十五条，\n不符合\n《企业会计准则第\n14\n号——收入》第三十四条第一款等\n有\n关规定。\n你作为宁波会展的会计机构负责人，对上述问题负有责任。依据\n2017\n年\n修改\n的《中华人民共和国会计法》第四十二条第一款第\n（\n五\n）\n项的规定，财政部\n决定\n给予你罚款\n1\n万元的行政处罚。\n你应在收到本处罚决定书之日起十五日内与财政部\n宁波\n监管局联系，凭财政\n部宁波监管局开具的\n电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n5\n年\n12\n月\n30\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕346号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260428_3988673.htm", "date": "2025-12-30", "id": "89b705b9e0e1ad835c32a807b2776627", "content": "财政部行政处罚决定书（财监法〔2025〕346号）\n财监\n法\n〔\n202\n5\n〕\n346\n号\n财政部行政处罚\n决定\n书\n当 事 人：华天\n地    址：浙江省宁波市海曙区机场路\n1000\n号\n6\n号楼\n255\n室\n依照《中华人民共和国会计法》的规定，财政部组织检查组于\n2024\n年对宁波市会展旅业有限公司（以下称宁波会展）会计信息质量进行了检查。检查发现的主要问题和行政处罚\n决定\n如下：\n一、以总额法代替净额法核算包销机票业务收入，多计收入及成本\n宁波会展有关长龙航空、桂林航空机票包销业务中，宁波会展履行的不是机票的采购与销售职责，也未拥有机票定价权，对机票不具有控制权，在该业务中宁波会展为代理人，不属于主要责任人，应当按照净额法确认收入。宁波会展采用总额法确认上述业务收入，导致\n2023\n年度多计营业收入\n4.49\n亿元、营业成本\n4.49\n亿元。\n二、以总额法代替净额法核算机票虚拟账户充值业务收入，\n多计收入及成本\n宁波会展开展“东航汇”充值业务，只负责垫付资金及对充值账户的监管，在该业务中宁波会展为代理人，不属于主要责任人，应当按照净额法确认收入。宁波会展采用总额法确认上述业务收入，导致\n2023\n年度多计营业收入\n4,443.40\n万元、营业成本\n4,443.40\n万元。\n三、将代收代付款项确认为营业收入\n、营业成本\n，多计收入及成本\n宁波会展将海丝之路项目和雪窦山项目代收代付款项确认为自身营业收入和营业成本，导致\n2023\n年度多计营业收入、营业成本\n412.74\n万元。\n上述事实，有检查报告、反馈意见等相关证据予以证实。\n上述行为违反了\n2017\n年\n修改\n的《中华人民共和国会计法》第二十五条，\n不符合\n《企业会计准则第\n14\n号——收入》第三十四条第一款等\n有\n关规定。\n你作为宁波会展的单位负责人，对上述问题负有责任。依据\n2017\n年\n修改\n的《中华人民共和国会计法》第四十二条第一款第\n（\n五\n）\n项的规定，财政部\n决定\n给予你罚款\n2\n万元的行政处罚。\n你应在收到本处罚决定书之日起十五日内与财政部\n宁波\n监管局联系，凭财政部\n宁波\n监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n5\n年\n12\n月\n30\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕345号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202604/t20260428_3988671.htm", "date": "2025-12-30", "id": "3978074622e5f57591ba3508051f81b8", "content": "财政部行政处罚决定书（财监法〔2025〕345号）\n财监\n法\n〔\n202\n5\n〕\n345\n号\n财政部行政处罚\n决定\n书\n当 事 人：宁波市会展旅业有限公司\n地    址：浙江省宁波市海曙区机场路\n1000\n号\n6\n号楼\n255\n室\n依照《中华人民共和国会计法》的规定，财政部组织检查组于\n2024\n年对你公司会计信息质量进行了检查。检查发现的主要问题和行政处罚\n决定\n如下：\n一、以总额法代替净额法核算包销机票业务收入，多计收入及成本\n你公司有关长龙航空、桂林航空机票包销业务中，你公司履行的\n不是\n机票的采购与销售职责，也未拥有机票定价权，对机票不具有控制权，在该业务中你公司为代理人，不属于主要责任人，应当按照净额法确认收入。你公司采用总额法确认上述业务收入，导致\n2023\n年度多计营业收入\n4.49\n亿元、营业成本\n4.49\n亿元。\n二、以总额法代替净额法核算机票虚拟账户充值业务收入，多计收入及成本\n你公司开展“东航汇”充值业务，只负责垫付资金及对充值账户的监管，在该业务中你公司为代理人，不属于主要责任人，应当按照净额法确认收入。你公司采用总额法确认上述业务收入，导致\n2023\n年度多计营业收入\n4,443.40\n万元、营业成本\n4,443.40\n万元。\n三、将代收代付款项确认为营业收入\n、营业成本\n，多计收入及成本\n你公司将海丝之路项目和雪窦山项目代收代付款项确认为自身营业收入和营业成本，导致\n2023\n年度多计营业收入、营业成本\n412.74\n万元。\n上述事实，有检查报告、反馈意见等相关证据予以证实。\n上述行为违反了\n2017\n年\n修改\n的《中华人民共和国会计法》第二十五条，\n不符合\n《企业会计准则第\n14\n号——收入》第三十四条第一款\n等有关\n规定。\n依据\n2017\n年\n修改\n的《中华人民共和国会计法》第四十二条第一款第\n（\n五\n）\n项的规定，财政部\n决定\n给予你公司罚款\n5\n万元的行政处罚。\n你公司应在收到本处罚决定书之日起十五日内与财政部\n宁波\n监管局联系，凭财政部\n宁波\n监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起六个月内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n202\n5\n年\n12\n月\n30\n日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕372号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202601/t20260115_3981943.htm", "date": "2025-12-29", "id": "3018b9203b7fec35ad84c4347cab0c65", "content": "财政部行政处罚决定书（财监法〔2025〕372号）\n财监法〔2025〕372 号\n财政部行政处罚决定书\n当 事 人：任海春\n地    址：北京市大兴区饮马井街2号院4号楼1层0257号\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组对北京亚泰国际会计师事务所（特殊普通合伙）（现更名为北京亚泰国际会计师事务所（普通合伙），以下称北京亚泰）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、隐匿福建紫天传媒科技股份有限公司关键审计工作底稿等重要档案资料，逃避财政部门依法实施的监督检查\n2024年6月25日，财政部检查组对北京亚泰开展执业质量检查，2024年7月1日，北京亚泰承诺已真实、完整地向检查组提供2024年对包括福建紫天传媒科技股份有限公司（以下称紫天科技）在内的17户企业年度财务报表审计的审计工作底稿等档案资料，\n实际北京亚泰提交材料未包含对紫天科技（单体）、部分重要子公司及合并层面等的审计工作底稿。2024年9月11日，北京亚泰声称紫天科技2023年度财务报表审计项目的纸质版审计工作底稿及存放电子版底稿的电脑及光盘于2024年9月5日被公安机关调取，证实在财政部检查组从2024年6月25日开始的现场检查期间，北京亚泰未将紫天科技2023年度财务报表审计工作底稿完整提交检查组以配合检查。2025年3月至7月，北京亚泰又多次向财政部检查组补充提交紫天科技审计项目新的审计工作底稿，同时书面承认存在未及时配合检查、检查期间未完整提交审计工作底稿的情况。\n二、编制虚假的紫天科技审计工作底稿，隐瞒审计发现的问题，发表了不恰当的审计意见\n（一）编制虚假的存货相关审计工作底稿，隐瞒审计发现的问题，发表了不恰当的审计意见。\n紫天科技子公司福州缘笙科技有限公司（以下称缘笙科技）2023年与福建省海峡星云信息科技有限公司（以下称海峡星云）签订的《买卖框架协议》和《销售协议》均未实际执行，海峡星云未向缘笙科技供应任何服务器，缘笙科技通过编制虚假货物签收和入库资料虚增存货，导致紫天科技2023年度合并财务报表存货期末数虚增71,862.73万元。\n北京亚泰对紫天科技2023年度财务报表审计中，编制虚假的紫天科技存货相关审计工作底稿，隐瞒审计发现的问题，未获取充分适当的审计证据，认可紫天科技2023年度合并财务报表存货期末数虚增71,862.73万元的会计处理，发表了不恰当的审计意见。\n（二）编制虚假的预付账款相关审计工作底稿，隐瞒审计发现的问题，发表了不恰当的审计意见。\n缘笙科技向福州市森讯通信技术有限公司（以下称福州森讯）采购服务器，合同金额81,204.88万元。合同约定缘笙科技委托关联方上海紫赏广告传媒有限公司（以下称上海紫赏）分别向福州森讯的股东福州墨森网络科技有限公司、福州腾昌信息科技有限公司预付服务器采购款项；上海紫赏向上述两家公司预付的款项，于当日转回至上海紫赏账户，缘笙科技未冲减确认的预付账款81,204.88万元。2023年4月，缘笙科技依据与海峡星云签订的《买卖框架协议》，在未向海峡星云付款的情况下，将前述81,204.88万元服务器采购预付款，调整为2022年12月31日对海峡星云的预付账款。上述事项导致紫天科技2022年度合并财务报表预付账款期末数虚增81,204.88万元。\n北京亚泰对紫天科技2023年度财务报表审计中，编制虚假的紫天科技预付账款相关审计工作底稿，隐瞒审计发现的问题，认可紫天科技2023年度合并财务报表预付账款期初数虚增81,204.88万元的会计处理，发表了不恰当的审计意见。\n三、在知悉紫天科技营业成本异常的情况下，未设计和实施恰当的审计程序，未获取充分适当的审计证据，发表了不恰当的审计意见\n紫天科技子公司华创易通（福建）科技有限公司（以下称华创易通）编制虚假验收单，虚构对中移建设有限公司广东分公司的短信服务采购业务，导致紫天科技2023年度合并财务报表营业成本虚增6,860.38万元。\n北京亚泰对紫天科技2023年度财务报表审计中，在知悉营业成本异常的情况下，未设计和实施恰当的审计程序，未获取充分适当的审计证据，认可紫天科技2023年度营业成本虚增6,860.38万元的会计处理，发表了不恰当的审计意见。\n四、未发现紫天科技合并财务报表合并抵销存在的错误，错报金额12,205.08万元超过审计重要性水平\n（一）未发现2023年末应收账款合并抵销错误4,652.69万元。\n北京亚泰对紫天科技2023年度财务报表审计中，编制的紫天科技所属子公司应收账款审计工作底稿记录2023年末对紫天科技合并报表主体范围内公司的应收账款原值审定金额合计5,732.03万元，与合并抵销金额1,079.34万元相差4,652.69万元，北京亚泰未发现上述合并抵销错误，导致紫天科技2023年度合并财务报表应收账款期末数多计4,652.69万元。\n（二）未发现2023年末其他应收款合并抵销错误7,431.85万元。\n北京亚泰对紫天科技2023年度财务报表审计中，编制的紫天科技及其子公司其他应收款审计工作底稿记录2023年末对紫天科技合并报表主体范围外公司的其他应收款原值审定金额合计4,576.23万元，紫天科技合并财务报表中其他应收款原值期末数为12,008.08万元，北京亚泰未发现上述合并抵销错误，导致紫天科技2023年度合并财务报表其他应收款期末数多计7,431.85万元。\n（三）未发现2023年末其他应付款合并抵销错误120.54万元。\n北京亚泰对紫天科技2023年度财务报表审计中，编制的紫天科技及其子公司其他应付款审计工作底稿记录2023年末对紫天科技合并报表主体范围外公司的其他应付款审定金额合计7,710.42万元，紫天科技合并财务报表中其他应付款期末数为7,589.88万元，北京亚泰未发现上述合并抵销错误，导致紫天科技2023年度合并财务报表其他应付款期末数少计120.54万元。\n五、职业判断错误，认可紫天科技代充值业务采用总额法核算的错误会计处理，发表了不恰当的审计意见\n紫天科技子公司宁波麦粒网络科技有限公司（以下称宁波麦粒）对应采用净额法核算的互联网广告代充值业务，采用总额法核算，导致紫天科技2023年度合并财务报表营业收入虚增187,051.80万元、营业成本虚增187,051.80万元。\n北京亚泰对紫天科技2023年度财务报表审计中，未保持应有的职业怀疑，未对宁波麦粒互联网广告代充值业务收入确认获取充分适当的审计证据，认可宁波麦粒采用总额法核算导致紫天科技2023年度合并财务报表营业收入、营业成本各虚增187,051.80万元的错报事项，发表了不恰当的审计意见，错报金额占紫天科技2023年度合并财务报表营业收入的85.48%、营业成本的87.86%。\n六、未编制复核紫天科技合并现金流量表的审计工作底稿，无法支撑审计结论\n北京亚泰对紫天科技2023年度财务报表审计中，未编制复核紫天科技2023年度合并现金流量表的审计工作底稿，未就紫天科技合并现金流量表的公允性、准确性获取充分适当的审计证据，无法支撑审计结论。\n七、上市实体的审计报告未披露关键审计事项段\n北京亚泰出具的《福建紫天传媒科技股份有限公司审计报告》（亚泰国际会审字(2024)第0181号）未披露关键审计事项段。\n上述事实，有检查报告、检查工作底稿、当事人签证和反馈意见等相关证据予以证实。\n上述行为违反了《中华人民共和国注册会计师法》第二十一条，《会计师事务所执业许可和监督管理办法》第五十四条第一款、第六十条第（一）（三）项，不符合《中国注册会计师审计准则第1101号——注册会计师的总体目标和审计工作的基本要求》第二十条第一款、第二十八条、第二十九条、第三十条，《中国注册会计师审计准则第1131号——审计工作底稿》第九条，《中国注册会计师审计准则第1301号——审计证据》第十条，《中国注册会计师审计准则第1401号——对集团财务报表审计的特殊考虑》第四十七条，《中国注册会计师审计准则第1501号——对财务报表形成审计意见和出具审计报告》第十八条第（二）项，《中国注册会计师审计准则第1504号——在审计报告中沟通关键审计事项》第六条、第八条，《中国注册会计师职业道德守则第1号——职业道德基本原则》第七条第（一）（二）（四）项等规定。\n你作为上述审计报告的签字注册会计师，对上述问题负有审计责任。依据《中华人民共和国注册会计师法》第三十九条第二款和《会计师事务所执业许可和监督管理办法》第六十九条、第七十条第一款的规定，财政部决定给予你警告、罚款1万元、暂停执行业务1年的行政处罚。\n你应在收到本处罚决定书之日起十五日内与财政部北京监管局联系，凭财政部北京监管局开具的电子《非税收入一般缴款书》，通过中央财政非税收入收缴代理银行，将罚款缴入中央国库，并将缴款凭证等相关材料书面报送财政部监督评价局。\n如不服本处罚决定，可以在接到本决定书之日起六十日内，依法向财政部申请行政复议；或者在接到本决定书之日起十五日内，依法向北京市第一中级人民法院提起行政诉讼。除法律另有规定外，行政复议和行政诉讼期间，本处罚决定不停止执行。\n财  政  部\n2025年12月29日"}, {"source": "财政部", "category": "处罚案例", "title": "财政部行政处罚决定书（财监法〔2025〕371号）", "url": "https://www.mof.gov.cn/gp/xxgkml/jdjcj/202601/t20260115_3981941.htm", "date": "2025-12-29", "id": "2feb1e4ab2b3dbb376b9027a73ea1582", "content": "财政部行政处罚决定书（财监法〔2025〕371号）\n财监法〔2025〕371号\n财政部行政处罚决定书\n当 事 人：田梦珺\n地    址：北京市大兴区饮马井街2号院4号楼1层0257号\n依照《中华人民共和国注册会计师法》等法律的规定，财政部组织检查组对北京亚泰国际会计师事务所（特殊普通合伙）（现更名为北京亚泰国际会计师事务所（普通合伙），以下称北京亚泰）执业质量等情况开展了检查。检查发现的主要问题和行政处罚决定如下：\n一、隐匿福建紫天传媒科技股份有限公司关键审计工作底稿等重要档案资料，逃避财政部门依法实施的监督检查\n2024年6月25日，财政部检查组对北京亚泰开展执业质量检查，2024年7月1日，北京亚泰承诺已真实、完整地向检查组提供2024年对包括福建紫天传媒科技股份有限公司（以下称紫天科技）在内的17户企业年度财务报表审计的审计工作底稿等档案资料，实际北京亚泰提交材料未包含对紫天科技（单体）、部分重要子公\n司及合并层面等的审计工作底稿。2024年9月11日，北京亚泰声称紫天科技2023年度财务报表审计项目的纸质版审计工作底稿及存放电子版底稿的电脑及光盘于2024年9月5日被公安机关调取，证实在财政部检查组从2024年6月25日开始的现场检查期间，北京亚泰未将紫天科技2023年度财务报表审计工作底稿完整提交检查组以配合检查。2025年3月至7月，北京亚泰又多次向财政部检查组补充提交紫天科技审计项目新的审计工作底稿，同时书面承认存在未及时配合检查、检查期间未完整提交审计工作底稿的情况。\n二、编制虚假的紫天科技审计工作底稿，隐瞒审计发现的问题，发表了不恰当的审计意见\n（一）编制虚假的存货相关审计工作底稿，隐瞒审计发现的问题，发表了不恰当的审计意见。\n紫天科技子公司福州缘笙科技有限公司（以下称缘笙科技）2023年与福建省海峡星云信息科技有限公司（以下称海峡星云）签订的《买卖框架协议》和《销售协议》均未实际执行，海峡星云未向缘笙科技供应任何服务器，缘笙科技通过编制虚假货物签收和入库资料虚增存货，导致紫天科技2023年度合并财务报表存货期末数虚增71,862.73万元。\n北京亚泰对紫天科技2023年度财务报表审计中，编制虚假的紫天科技存货相关审计工作底稿，隐瞒审计发现的问题，未获取充分适当的审计证据，认可紫天科技2023年度合并财务报表存货期末数虚增71,862.73万元的会计处理，发表了不恰当的审计意见。\n（二）编制虚假的预付账款相关审计工作底稿，隐瞒审计发现的问题，发表了不恰当的审计意见。\n缘笙科技向福州市森讯通信技术有限公司（以下称福州森讯）采购服务器，合同金额81,204.88万元。合同约定缘笙科技委托关联方上海紫赏广告传媒有限公司（以下称上海紫赏）分别向福州森讯的股东福州墨森网络科技有限公司、福州腾昌信息科技有限公司预付服务器采购款项；上海紫赏向上述两家公司预付的款项，于当日转回至上海紫赏账户，缘笙科技未冲减确认的预付账款81,204.88万元。2023年4月，缘笙科技依据与海峡星云签订的《买卖框架协议》，在未向海峡星云付款的情况下，将前述81,204.88万元服务器采购预付款，调整为2022年12月31日对海峡星云的预付账款。上述事项导致紫天科技2022年度合并财务报表预付账款期末数虚增81,204.88万元。\n北京亚泰对紫天科技2023年度财务报表审计中，编制虚假的紫天科技预付账款相关审计工作底稿，隐瞒审计发现的问题，认可紫天科技2023年度合并财务报表预付账款期初数虚增81,204.88万元的会计处理，发表了不恰当的审计意见。\n三、在知悉紫天科技营业成本异常的情况下，未设计和实施恰当的审计程序，未获取充分适当的审计证据，发表了不恰当的审计意见
