Ғи®ҫи®Ўиҙ№гҖҒж–°е·Ҙиүәи§„зЁӢеҲ¶е®ҡиҙ№гҖҒж–°иҚҜз ”еҲ¶зҡ„дёҙеәҠиҜ•йӘҢиҙ№гҖҒеӢҳжҺўејҖеҸ‘жҠҖжңҜзҡ„зҺ°еңәиҜ•йӘҢиҙ№е’Ңе…¶д»–зӣёе…іиҙ№з”Ёзӯүиҙ№з”ЁпјҢе…¶дёӯпјҢе…¶д»–зӣёе…іиҙ№з”ЁйҮҮеҸ–йҷҗйўқжүЈйҷӨзҡ„ж–№ејҸгҖӮ119еҸ·ж–ҮпјҲиҙўзЁҺгҖ”2015гҖ•119еҸ·пјүйҮҮеҸ–жӯЈеҲ—дёҫеҪўејҸпјҢеҜ№дёҠиҝ°иҙ№з”ЁдёӯеҸҜеҠ и®ЎжүЈйҷӨзҡ„е…·дҪ“иҙ№з”ЁиҝӣиЎҢдәҶжҳҺзЎ®гҖӮжҜ”еҰӮпјҡдәәе‘ҳдәәе·Ҙиҙ№з”ЁеҢ…жӢ¬зӣҙжҺҘд»ҺдәӢз ”еҸ‘жҙ»еҠЁдәәе‘ҳзҡ„е·Ҙиө„и–ӘйҮ‘гҖҒеҹәжң¬е…»иҖҒдҝқйҷ©иҙ№гҖҒеҹәжң¬еҢ»з–—дҝқйҷ©иҙ№гҖҒеӨұдёҡдҝқйҷ©иҙ№гҖҒе·ҘдјӨдҝқйҷ©иҙ№гҖҒз”ҹиӮІдҝқйҷ©иҙ№е’ҢдҪҸжҲҝе…¬з§ҜйҮ‘пјҢд»ҘеҸҠеӨ–иҒҳз ”еҸ‘дәәе‘ҳзҡ„еҠіеҠЎиҙ№з”ЁпјҢйңҖиҰҒиҜҙжҳҺзҡ„жҳҜпјҢиҒҢе·ҘзҰҸеҲ©иҙ№гҖҒиЎҘе……е…»иҖҒдҝқйҷ©гҖҒиЎҘе……еҢ»з–—дҝқйҷ©дёҚеұһдәҺдәәе‘ҳдәәе·Ҙиҙ№з”ЁпјҢеә”жҢүгҖҠеӣҪе®¶зЁҺеҠЎжҖ»еұҖе…ідәҺз ”еҸ‘иҙ№з”ЁзЁҺеүҚеҠ и®ЎжүЈйҷӨеҪ’йӣҶиҢғеӣҙжңүе…ій—®йўҳзҡ„е…¬е‘ҠгҖӢпјҲ2017е№ҙз¬¬40еҸ·пјүзҡ„и§„е®ҡеҲ—е…Ҙе…¶д»–зӣёе…іиҙ№з”ЁпјҢе№¶йҮҮеҸ–йҷҗйўқжүЈйҷӨзҡ„ж–№ејҸгҖӮ"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是增值税小规模纳税人，享受物流企业大宗商品仓储设施用地减征城镇土地使用税优惠的同时，是否可以叠加享受“六税两费”优惠？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5192816/content.html", "date": "2023-04-20", "id": "db0ce82e97194cd891919a64f4822fb9", "content": "答：\n根据《财政部 税务总局关于进一步实施小微企业“六税两费”减免政策的公告》（2022年第10号）的规定，2022年1月1日至2024年12月31日，省、自治区、直辖市人民政府可以根据本地区实际情况，以及宏观调控需要，对增值税小规模纳税人、小型微利企业和个体工商户在50%的税额幅度内减征房产税、城镇土地使用税等“六税两费”。纳税人享受其他优惠政策的，可叠加享受“六税两费”优惠政策。\n你公司在享受物流企业大宗商品仓储设施用地减半征收城镇土地使用税优惠的基础上，可以叠加享受“六税两费”优惠。"}, {"source": "国家税务局", "category": "留言咨询", "title": "我公司是一家信息传输、软件和信息技术服务企业，2023年度发生的研发费用如何适用加计扣除政策？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5192530/content.html", "date": "2023-04-13", "id": "e65f05d26e9180de9e738838f5511bf6", "content": "зӯ”пјҡ\nгҖҠиҙўж”ҝйғЁ зЁҺеҠЎжҖ»еұҖе…ідәҺиҝӣдёҖжӯҘе®Ңе–„з ”еҸ‘иҙ№з”ЁзЁҺеүҚеҠ и®ЎжүЈйҷӨж”ҝзӯ–зҡ„е…¬е‘ҠгҖӢпјҲ2023е№ҙз¬¬7еҸ·пјҢд»ҘдёӢз®Җз§°вҖң7еҸ·е…¬е‘ҠвҖқпјүжҳҺзЎ®пјҡдјҒдёҡејҖеұ•з ”еҸ‘жҙ»еҠЁдёӯе®һйҷ…еҸ‘з”ҹзҡ„з ”еҸ‘иҙ№з”ЁпјҢжңӘеҪўжҲҗж— еҪўиө„дә§и®Ўе…ҘеҪ“жңҹжҚҹзӣҠзҡ„пјҢеңЁжҢүи§„е®ҡжҚ®е®һжүЈйҷӨзҡ„еҹәзЎҖдёҠпјҢиҮӘ2023е№ҙ1жңҲ1ж—Ҙиө·пјҢеҶҚжҢүз…§е®һйҷ…еҸ‘з”ҹйўқзҡ„100%еңЁзЁҺеүҚеҠ и®ЎжүЈйҷӨпјӣеҪўжҲҗж— еҪўиө„дә§зҡ„пјҢиҮӘ2023е№ҙ1жңҲ1ж—Ҙиө·пјҢжҢүз…§ж— еҪўиө„дә§жҲҗжң¬зҡ„200%еңЁзЁҺеүҚж‘Ҡй”ҖгҖӮ\nдҪ е…¬еҸё2023е№ҙеәҰеҸ‘з”ҹзҡ„з ”еҸ‘иҙ№з”ЁеҸҜжҢүз…§дёҠиҝ°и§„е®ҡпјҢйҖӮз”Ёз ”еҸ‘иҙ№з”ЁеҠ и®ЎжүЈйҷӨж”ҝзӯ–гҖӮ"}, {"source": "国家税务局", "category": "留言咨询", "title": "在预缴企业所得税时，小型微利企业如何享受所得税优惠政策？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5186314/content.html", "date": "2023-04-07", "id": "647563b7cbc83b5294fc8f0961211a0a", "content": "答：\n首先，判断是否符合条件。企业在年度中间预缴企业所得税时，按照政策标准判断符合小型微利企业条件的，即可享受优惠政策。资产总额、从业人数、年度应纳税所得额指标，暂按当年度截至本期预缴申报所属期末的情况进行判断。其中，资产总额、从业人数指标按照政策标准中“全年季度平均值”的计算公式，计算截至本期预缴申报所属期末的季度平均值。\n其次，按照政策规定计算应纳税额。今后如调整政策，从其规定，计算方法以此类推。\n示例如下：\n例：\nA企业2022年成立，从事国家非限制和禁止行业，2023年1季度季初、季末的从业人数分别为120人、200人，1季度季初、季末的资产总额分别为2000万元、4000万元，1季度的应纳税所得额为90万元。\n解析：\n2023年1季度，A企业“从业人数”的季度平均值为160人，“资产总额”的季度平均值为3000万元，应纳税所得额为90万元。符合关于小型微利企业预缴企业所得税时的判断标准：从事国家非限制和禁止行业，且同时符合截至本期预缴申报所属期末资产总额季度平均值不超过5000万元、从业人数季度平均值不超过300人、应纳税所得额不超过300万元，可以享受优惠政策。\n《财政部 税务总局关于小微企业和个体工商户所得税优惠政策的公告》（2023年第6号）规定，对小型微利企业年应纳税所得额不超过100万元的部分，减按25%计入应纳税所得额，按20%的税率缴纳企业所得税。因此，A企业1季度的应纳税额为：90×25%×20%=4.5（万元）。"}, {"source": "国家税务局", "category": "留言咨询", "title": "个体工商户享受个人所得税优惠政策的程序是怎样的？", "url": "https://www.chinatax.gov.cn/chinatax/n810356/n3255681/c5185963/content.html", "date": "2023-03-30", "id": "893dc9cd4406808f55146deedab39efc", "content": "答：\n个体工商户在预缴和汇算清缴个人所得税时均可享受减半政策，享受政策时无需进行备案，通过填写个人所得税纳税申报表和减免税事项报告表相关栏次，即可享受。对于通过电子税务局申报的个体工商户，税务机关将自动为其提供申报表和报告表中该项政策的预填服务。实行简易申报的定期定额个体工商户，税务机关按照减免后的税额进行税款划缴。"}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第二十一号）", "url": "https://www.cicpa.org.cn/xxfb/tzgg/202203/t20220318_63434.html", "date": "2022-03-18", "id": "94c452ebcfcc287c62f6a1a1b5568692", "content": "为深入贯彻落实《国务院办公厅关于进一步规范财务审计秩序 促进注册会计师行业健康发展的意见》（国办发〔\n2021\n〕\n30\n号），根据《会计师事务所执业质量检查制度》（会协〔\n2011\n〕\n39\n号），\n2021\n年，中国注册会计师协会按照统一检查计划、统一组织实施、统一规范程序、统一处理处罚、统一发布公告的原则，组织各省、自治区、直辖市注册会计师协会（以下简称各省级注协）在配合财政部门检查的基础上，又对\n1000\n家事务所开展行业自律检查。截至\n2022\n年\n2\n月\n28\n日，各级注协对存在违规问题的\n199\n家事务所和\n465\n名注册会计师按照惩戒办法实施了行业惩戒。其中，对\n53\n家事务所和\n116\n名注册会计师公开谴责；对\n57\n家事务所和\n151\n名注册会计师通报批评；对\n56\n家事务所和\n137\n名注册会计师训诫；对其他\n33\n家事务所和\n61\n名注册会计师采取约谈等监管措施。同时，各级注协共开展常态化诚信教育\n68\n次，监管约谈\n227\n家次，整改帮扶\n235\n家次，提供专业技术支持\n208\n次。\n现将检查发现的\n9\n个典型案例公告如下：\n一、郁南西江会计师事务所有限公司印章管理不规范，同时使用两枚事务所印章，违规使用业务章签发审计报告，控制注册会计师个人印章。该所还存在抽查的部分审计项目未执行必要的审计程序、未发现被审计单位合并范围严重错误、未按照准则要求撰写审计报告等其他违规行为。广东省注册会计师协会对该所及注册会计师张桂深、陈光明、梁景成、李烘飞作出公开谴责的行业惩戒。\n二、云南天定会计师事务所（普通合伙）雇佣其他会计师事务所合伙人冯某某复核审计工作底稿，且由冯某某执行部分审计工作。该所还存在抽查的部分审计项目未对收入、银行存款、往来款项和存货执行必要的审计程序，未获取充分适当的审计证据等其他违规行为。云南省注册会计师协会对该所及首席合伙人谭宏章作出公开谴责的行业惩戒。\n三、上海佳安会计师事务所有限公司由注册会计师以个人名义聘请非本所员工担任助理人员，执行审计业务，编制审计工作底稿。该所还存在抽查的部分审计项目未执行必要审计程序、未获取充分适当的审计证据等其他违规行为。上海市注册会计师协会对该所及注册会计师黄肇华、陆里清、唐宝华作出公开谴责的行业惩戒。\n四、嘉兴百索会计师事务所有限公司存在允许其他单位或者个人以本所名义承办业务、允许部分注册会计师在该所挂名执业等行为，且存在幕后控制人。该所还存在抽查的部分审计项目未发现长期待摊费用未摊销等重大会计差错、未执行存货监盘等必要审计程序、未获取充分适当的审计证据等其他违规行为。浙江省注册会计师协会对该所及注册会计师李运河作出公开谴责的行业惩戒。\n五、广州中庆会计师事务所（普通合伙）\n2020\n年\n1\n月至\n2021\n年\n6\n月出具的\n790\n份审计报告未经合伙人签字。该所还存在抽查的部分审计项目未执行银行函证等必要审计程序、未获取充分适当的审计证据等其他违规行为。广东省注册会计师协会对该所及注册会计师张俊生、夏喜林、杨士华、陈郁华、李亚民、胡道福作出公开谴责的行业惩戒。\n六、广州华拓会计师事务所有限公司未按检查要求提供审计工作底稿，涉及\n1570\n份审计报告，占该所出具审计报告总量的\n85.33%\n，涉嫌无审计工作底稿出具审计报告。该所还存在抽查的部分审计项目未发现库存现金期末余额为负数、未实施银行函证等必要的审计程序、未获取充分适当的审计证据等其他违规行为。广东省注册会计师协会对该所及注册会计师商四新、胡建新、黄意、赵露雨、张鹏、李亚芝、胡建国、陈川作出公开谴责的行业惩戒。\n七、杭州深度会计师事务所有限公司存在抽查的部分审计项目未对收入、银行存款、往来款项和存货执行必要的审计程序，审计工作底稿中财务报表项目审定金额与财务报表实际金额差异巨大等问题。该所还存在未按规定及时归档审计工作底稿、未按规定如实报备对外出具的审计报告信息等其他违规行为。浙江省注册会计师协会对该所及注册会计师周凤明、崔鸿启、张娟娟作出公开谴责的行业惩戒。\n八、上海普道兢实会计师事务所（普通合伙）存在抽查的部分审计报告与审计工作底稿表述存在矛盾、审计报告中审计意见段与管理层对财务报表的责任段中披露的财务报表编制基础不一致、审计业务约定书中与管理层声明书关于财务报表编制基础不一致等问题。该所还存在抽查的审计项目未实施固定资产监盘和存货监盘程序、未对函证进行控制等其他违规行为。上海市注册会计师协会对该所及注册会计师马勇、陈高潮作出公开谴责的行业惩戒。\n九、湖南元和联合会计师事务所（普通合伙）存在抽查的部分审计报告格式不符合审计报告准则规定、审计报告“特别事项说明”主体未予明确、未附已审计财务报表和财务报表附注等问题。该所还存在抽查的部分审计项目未执行必要的审计程序，承接承做与自身规模、执业能力风险承担能力不匹配的业务等其他违规行为。湖南省注册会计师协会对该所及注册会计师刘春保、陈武南作出公开谴责的行业惩戒。\n中注协将坚决贯彻党中央、国务院决策部署，认真落实财政部党组部署安排，着力配合开展整顿行业秩序、建设法规体系等工作，促进行业健康发展。同时，坚持零容忍、严监管，加大行业自律监管力度，持续推动提升行业社会公信力和服务国家建设的能力。\n2022年\n3\n月\n16\n日"}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第二十号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/202006/t20200618_23730.html", "date": "2020-06-18", "id": "1201d030010040fb0c3fdc3aefabbd23", "content": "你现在的位置：\n首页\n>\n信息查询\n>\n执业质量检查通告\n中国注册会计师协会会计师事务所执业质量检查通告（第二十号）\n2020-06-18 04:12\n根据《会计师事务所执业质量检查制度》（会协〔\n2011\n〕\n39\n号）和《关于开展\n2019\n年全国会计师事务所执业质量检查工作的通知》（会协〔\n2019\n〕\n15\n号）要求，中国注册会计师协会和各省、自治区、直辖市注册会计师协会（以下简称各级注协）组织实施并完成了\n2019\n年会计师事务所（以下简称事务所）执业质量检查工作。现将有关情况通告如下：\n一、检查总体情况\n2019\n年，各级注协贯彻落实党中央国务院关于“打好防范化解重大风险攻坚战”、会计师事务所执业质量检查制度改革精神和注册会计师行业\n“\n职业化建设年\n”\n主题活动等各项要求\n,\n坚持问题导向、坚持系统风险导向检查理念、坚持帮扶提升职业化水平，促进事务所完善质量控制体系、提升职业道德水平和执业质量，推动行业高质量发展。根据《国务院办公厅关于推广随机抽查规范事中事后监管的通知》的要求，以周期性检查为基础，结合实际情况，建立随机抽取检查对象、随机选派检查人员、检查情况及检查结果及时向社会公开的\n“\n双随机、一公开\n”\n检查机制。\n2019\n年，各级注协共组织检查人员\n846\n名\n,\n检查事务所\n1296\n家，抽查业务项目\n8521\n个，其中，财务报表审计业务项目\n6163\n个，验资业务项目\n927\n个，其他专项审计业务项目\n1431\n个。其中，中注协组织检查人员\n69\n名，检查从事证券服务业务事务所\n5\n家，抽取业务项目\n54\n个。\n二、检查重点及检查结果\n2019\n年，各级注协继续坚持系统风险导向检查理念和\n“\n五个并重\n”\n原则，注重实效，加强帮扶。在充分利用系统风险导向检查的成果和日常监管实践基础上，开展\n“\n回头看\n”\n检查，帮助事务所查找存在质量控制和风险管理问题的原因，促进事务所提升执业质量和职业声誉，推动注册会计师提升职业能力、养成职业精神。\n在被检查事务所的选取上，各级注协以周期性检查为基础，坚持随机抽取被查事务所，同时结合实际，将业务规模较大的事务所，涉嫌不正当低价竞争或承接业务数量与事务所人力资源明显不匹配的事务所，在日常监管中发现执业质量较差、受到监管机构处罚或投诉举报较多的事务所，与境外事务所和国内从事证券服务业务会计师事务所合作项目较多的事务所作为检查重点。\n在被检查业务项目的选取上，各级注协根据事务所质量控制体系的初步评估及业务特点，聚焦高风险项目和重点风险领域，兼顾不同规模的客户，以及财务报告审计、验资和专项审计等业务类型。部分省级注协在检查中还关注了事务所内部收费管理政策的制定和执行情况，对涉嫌不正当低价竞争的项目进行重点检查。中注协重点关注了高风险上市公司、新三板和金融类企业的审计业务。\n从检查总体情况看，多数事务所针对第一轮检查中提出的问题，通过修改和完善相关的执业质量政策和程序进行了整改，风险防范意识有所提升，执业质量有所提高。\n检查也发现，部分事务所质量控制体系设计不适当或未得到有效执行，个别事务所未建立完整的质量控制体系，\n未及时根据业务准则和法律法规变化更新执业标准、工作底稿、业务报告等\n。\n在业务执行过程中，一些事务所未认真贯彻风险导向审计理念，未保持合理的职业怀疑态度，存在对重大的交易、账户余额及列报实施的审计程序实施不到位，获取的审计证据不够充分、适当，审计证据不能有效支持审计报告的意见类型等问题。个别事务所在无底稿或未对获取的审计证据执行审计程序的情况下直接出具审计报告。检查还发现，个别会计师事务所未向检查组提交完整的业务清单，存在大量未以事务所名义开具的业务收入发票。\n三、惩戒情况\n2019\n年，各级注协按有关规定对存在问题的\n96\n家事务所和\n251\n名注册会计师实施了行业惩戒。包括，给予\n26\n家事务所和\n37\n名注册会计师公开谴责；给予\n40\n家事务所和\n102\n名注册会计师通报批评；给予\n30\n家事务所和\n112\n名注册会计师训诫。其中，中注协给予\n6\n名注册会计师通报批评，给予\n2\n名注册会计师训诫。\n2020\n年，各级注协将巩固拓展行业质量提升成果，开展\n“\n质量管理提升年\n”\n主题活动，完善行业业务监管工作机制和制度，加强监管联动，探索建立综合监管机制，强化执业质量检查，加大对违规会计师事务所及注册会计师的惩戒力度，提高行业诚信水平。\n2020\n年\n6\n月\n15\n日\n附件："}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十九号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201903/t20190321_23729.html", "date": "2019-03-21", "id": "7b7506d12f3b3a1cd3759bd2dd91420f", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十八号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201901/t20190107_23728.html", "date": "2019-01-07", "id": "f9020bd48738e0366630011b6a29ebe8", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十七号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201804/t20180420_23727.html", "date": "2018-04-20", "id": "f2955e154c71bf2540f897e961dad47a", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十六号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201801/t20180123_23726.html", "date": "2018-01-23", "id": "08e945bc381e3118ab665df25b9ba034", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十五号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201704/t20170421_23725.html", "date": "2017-04-21", "id": "c0be67a8a615d8823055249270c184be", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十四号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201701/t20170117_23724.html", "date": "2017-01-17", "id": "60d2bbe1c3ce16006e428d870ee93ff8", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十三号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201603/t20160311_23723.html", "date": "2016-03-11", "id": "2f7f36c3e79aa253af775b617dcde749", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十二号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201601/t20160126_23722.html", "date": "2016-01-26", "id": "28ccaf0befdb3939dbd9412104bc60f5", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十一号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201503/t20150303_23721.html", "date": "2015-03-03", "id": "3836f51e78739819633eea0e0ed7c8f2", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第十号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201501/t20150127_23720.html", "date": "2015-01-27", "id": "971d8ef3b58d640ef15876bea20d2da6", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第九号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201402/t20140208_23719.html", "date": "2014-02-08", "id": "675dc8a771d891bace92d9f9aed33fa1", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第八号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201312/t20131212_23718.html", "date": "2013-12-12", "id": "394ad8936f8489bc88ba8d66ea3bb65f", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第七号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201303/t20130308_23717.html", "date": "2013-03-08", "id": "3d903a38f1316b6663337d2d781c0769", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第六号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201212/t20121219_23716.html", "date": "2012-12-19", "id": "57c37d38649d71f14f5c2712344c24e1", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第五号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201203/t20120301_23715.html", "date": "2012-03-01", "id": "d82855cbb202c00c325e0c08a21343c8", "content": ""}, {"source": "中注协", "category": "处罚案例", "title": "中国注册会计师协会会计师事务所执业质量检查通告（第四号）", "url": "https://www.cicpa.org.cn/xxcx/kjsswszyzljc/201202/t20120221_237   if (source === '国家税务局') return '<span class="tag tax">国家税务局</span>';
  if (source === 'CPA业务探讨') return '<span class="tag cpa">CPA业务探讨</span>';
  if (source === '内部审计') return '<span class="tag audit">内部审计</span>';
  return '<span class="tag esnai">会计视野</span>';
}

// 判断日期是否在最近 30 天内（用于「新」高亮）
function isRecent(d) {
  if (!d) return false;
  const t = new Date(d + 'T00:00:00');
  if (isNaN(t)) return false;
  const diff = (Date.now() - t.getTime()) / 86400000;
  return diff >= 0 && diff <= 30;
}

function render() {
  const q = kw.toLowerCase();
  const rows = DATA.filter(it => {
    if (src !== 'all' && !(MATCH[src] || []).includes(it.source)) return false;
    if (q && !(it.title + ' ' + (it.content || '')).toLowerCase().includes(q)) return false;
    return true;
  });
  count.textContent = '共 ' + rows.length + ' 条';
  if (!rows.length) {
    const tip = '没有匹配的结果';
    list.innerHTML = '<div class="empty">' + tip + '</div>';
    return;
  }
  list.innerHTML = rows.map(it => {
    const sum = (it.content || '').slice(0, 140).replace(/\n/g, ' ');
    const isNew = isRecent(it.date);
    const newClass = isNew ? ' new' : '';
    const newBadge = isNew ? '<span class="badge-new">新</span>' : '';
    return '<div class="card' + newClass + '">' +
      '<div class="meta">' + tagFor(it.source) + '<span>' + esc(it.date || '日期未知') + '</span>' + newBadge + '</div>' +
      '<h2><a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.title) + '</a></h2>' +
      (sum ? '<div class="sum">' + esc(sum) + '…</div>' : '<div class="sum">（正文待抓取）</div>') +
      '</div>';
  }).join('');
}

document.getElementById('q').addEventListener('input', e => { kw = e.target.value.trim(); render(); });
document.getElementById('sidebar').addEventListener('click', e => {
  const item = e.target.closest('.nav-item');
  if (!item) return;
  // 父级点击：切换子分类展开/收起
  if (item.classList.contains('nav-parent')) {
    item.classList.toggle('open');
    const children = item.nextElementSibling;
    if (children && children.classList.contains('nav-children')) {
      children.classList.toggle('open', item.classList.contains('open'));
    }
  }
  document.querySelectorAll('.nav-item').forEach(c => c.classList.remove('active'));
  item.classList.add('active');
  src = item.dataset.src;
  render();
});
render();
</script>
